transform:
  name: dim_rules_inventory
  operations:

  - kind: read_local
    name: read_dri
    params:
      format: excel
      location: {{storage_account}}/locations/rtr_documents/data_control_center/dim_rules_inventory.xlsx
      options:
        header: true
        pathGlobFilter: dim_rules_inventory.xlsx
        sheet_name: dim_rules_inventory

  - kind: select
    name: select_dri
    context_name: read_dri
    params:
      columns:
        rule_code: rule_code
        rule_description: rule_description
        technical_definition: technical_definition
        value_checked: value_checked
        datamart_or_reference_table_used: datamart_or_reference_table_used
        check_details_message: check_details_message
        quality_category: quality_category
        domain: domain
        sub_domain: sub_domain
        rule_level: rule_level
        group: group
        module: module
        type_of_check: type_of_check
        table_name_checked: table_name_checked
        column_name_checked: column_name_checked
        business_attribute_name: business_attribute_name
        is_active: is_active
        is_pbi_active: is_pbi_active
        is_sesitive: is_sesitive
        severity: severity
        is_field_mandatory: is_field_mandatory
        remediation_output: remediation_output
        exclude_from_score_calculation: exclude_from_score_calculation
        ri: ri
        etl: etl
        pbi: pbi
        dd_to_ri: dd_to_ri
        ri_to_yaml: ri_to_yaml
        yaml_with_data: yaml_with_data
        tested_on_pbi: tested_on_pbi
        comments_feedback: comments_feedback
      distinct: true

  - kind: write_dataio
    name: write_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_rules_inventory
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full