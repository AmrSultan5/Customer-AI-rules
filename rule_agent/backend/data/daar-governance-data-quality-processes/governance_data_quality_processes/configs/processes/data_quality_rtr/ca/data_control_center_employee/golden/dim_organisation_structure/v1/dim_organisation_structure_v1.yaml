transform:
  name: dim_organisation_structure
  operations:

  - kind: read_local
    name: read_dri
    params:
      format: excel
      location: {{storage_account}}/locations/rtr_documents/data_control_center/dcc_employee_reference_tables.xlsx
      options:
        header: true
        pathGlobFilter: dcc_employee_reference_tables.xlsx
        sheet_name: dim_organisation_structure

  - kind: select
    name: select_dri
    context_name: read_dri
    params:
      columns:
        location_code: location_code
        location_name: location_name
        company_code: company_code
        company_name: company_name
        country_code: country_code
        business_unit_code: business_unit_code
        business_unit_name: business_unit_name
        business_unit_workday_value: business_unit_workday_value
      distinct: true

  - kind: write_dataio
    name: write_dim_organisation_structure
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_organisation_structure
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full