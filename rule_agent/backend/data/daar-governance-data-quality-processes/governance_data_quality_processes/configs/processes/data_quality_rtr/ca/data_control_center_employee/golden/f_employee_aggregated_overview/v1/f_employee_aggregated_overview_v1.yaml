transform:
  name: f_employee_aggregated_overview
  operations:

  - kind: read_dataio
    name: read_dm_employee_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_check_results
      schema_version: v3

  - kind: read_dataio
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_rules_inventory
      schema_version: v2

  - kind: filter
    name: filter_dri
    context_name: read_dim_rules_inventory
    params:
      - condition:
          is_active = '1'

  - kind: select
    name: select_dri
    context_name: filter_dri
    params:
      columns:
        rule_code: rule_code
        is_pbi_active: is_pbi_active
      distinct: true

  - kind: read_local
    name: read_dim_organisation_structure
    params:
      format: excel
      location: {{storage_account}}/locations/rtr_documents/data_control_center/dcc_employee_reference_tables.xlsx
      options:
        header: true
        pathGlobFilter: dcc_employee_reference_tables.xlsx
        sheet_name: dim_organisation_structure

  - kind: select
    name: select_dos
    context_name: read_dim_organisation_structure
    params:
      columns:
        location_code: location_code
        business_unit_name: business_unit_name
      distinct: true

  - kind: join
    name: join_overview
    context_name: read_dm_employee_check_results
    params:
      - other:
          select_dri
        how:
          inner
        columns:
          rule_code: rule_code
      - other:
          select_dos
        how:
          left
        columns:
          location_code: location_code

  - kind: add
    name: add_checks
    context_name: join_overview
    params:
      - column: country_code
        expression: if(business_unit_name = 'BSO', 'BSO_EMP',
                    if(business_unit_name = 'CSC', 'CSC', country_code))
        overwrite: true
      - column: failed_checks
        expression: if(check_status = '0', 1, 0)
      - column: passed_checks
        expression: if(check_status = '1', 1, 0)
      - column: skipped_checks
        expression: if(check_status = '', 1, 0)

  - kind: group
    name: group_checks
    context_name: add_checks
    params:
      - aggs:
          failed_checks: sum
          passed_checks: sum
          skipped_checks: sum
        by:
        - rule_code
        - country_code
        - is_pbi_active

  - kind: add
    name: add_total_checks
    context_name: group_checks
    params:
      - column: sum_failed_checks
        expression: ifnull(sum_failed_checks, 0)
        overwrite: true
      - column: sum_passed_checks
        expression: ifnull(sum_passed_checks, 0)
        overwrite: true
      - column: sum_skipped_checks
        expression: ifnull(sum_skipped_checks, 0)
        overwrite: true
      - column: total_checks
        expression: sum_failed_checks + sum_passed_checks
      - column: total_records
        expression: sum_failed_checks + sum_passed_checks + sum_skipped_checks
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: cast
    name: cast_to_integer
    context_name: add_total_checks
    params:
      - column: sum_failed_checks
        to: integer
      - column: sum_passed_checks
        to: integer
      - column: sum_skipped_checks
        to: integer
      - column: total_checks
        to: integer
      - column: total_records
        to: integer
      - column: is_pbi_active
        to: integer

  - kind: add
    name: add_null
    context_name: cast_to_integer
    params:
      - column: country_code
        expression: if(country_code = '', NULL, country_code)
        overwrite: true

  - kind: select
    name: select_overview_final
    context_name: add_null
    params:
      columns:
        country_code: country_code
        rule_code: rule_code
        loading_date: loading_date
        sum_failed_checks: failed_checks
        sum_passed_checks: passed_checks
        sum_skipped_checks: skipped_checks
        total_checks: total_checks
        total_records: total_records
        is_pbi_active: is_pbi_active
      distinct: true

  - kind: write_dataio
    name: write_f_employee_aggregated_overview
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: f_employee_aggregated_overview
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full