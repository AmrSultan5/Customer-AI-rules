transform:
  name: dim_employee_classification
  operations:

#ORGANISATION
  - kind: read_dataio
    name: read_dm_employee_organisation
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_organisation
      schema_version: v1

  - kind: add
    name: add_organisation_data
    context_name: read_dm_employee_organisation
    params:
      - column: worker_type
        expression: 'NULL'
      - column: is_on_leave
        expression: 'NULL'

  - kind: select
    name: select_organisation
    context_name: add_organisation_data
    params:
      columns:
        object_type: object_type
        company_id: company_code
        worker_type: worker_type
        is_on_leave: is_on_leave
      distinct: true

#POSITION
  - kind: read_dataio
    name: read_dm_employee_position
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_position
      schema_version: v1

  - kind: add
    name: add_position_data
    context_name: read_dm_employee_position
    params:
      - column: worker_type
        expression: 'NULL'

  - kind: select
    name: select_position
    context_name: add_position_data
    params:
      columns:
        object_type: object_type
        company_id: company_code
        worker_type: worker_type
        is_on_leave: is_on_leave
      distinct: true

#WORKER
  - kind: read_dataio
    name: read_dm_employee_worker
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_worker
      schema_version: v2

  - kind: select
    name: select_worker
    context_name: read_dm_employee_worker
    params:
      columns:
        object_type: object_type
        company_id: company_code
        worker_type_id: worker_type
        is_on_leave: is_on_leave
      distinct: true

  - kind: union
    name: union_data
    context_name: select_organisation
    params:
      allow_missing: false
      by_name: true
      other: select_position

  - kind: union
    name: union_data
    params:
      allow_missing: false
      by_name: true
      other: select_worker

  - kind: add
    name: add_employee_class_id
    context_name: union_data
    params:
      - column: employee_class_id
        expression: MD5(
                    ifnull(object_type, 'null') ||
                    ifnull(company_code, 'null') ||
                    ifnull(worker_type, 'null') ||
                    ifnull(is_on_leave, 'null')
                    )
      - column: employee_class_id
        expression: object_type

  - kind: select
    name: select_final
    context_name: add_employee_class_id
    params:
      columns:
        employee_class_id: employee_class_id
        object_type: object_type
        company_code: company_code
        worker_type: worker_type
        is_on_leave: is_on_leave
      distinct: true

  - kind: write_dataio
    name: write_dim_employee_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_employee_classification
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: incremental