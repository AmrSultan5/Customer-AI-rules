transform:
  name: dim_user_message_code
  operations:

  - kind: read_local
    name: read_dict_user_message_code
    params:
      format: excel
      location: {{storage_account}}/locations/rtr_documents/data_control_center/dcc_employee_reference_tables.xlsx
      options:
        header: true
        pathGlobFilter: dcc_employee_reference_tables.xlsx
        sheet_name: dict_user_message_code

  - kind: select
    name: select_dumc
    context_name: read_dict_user_message_code
    params:
      columns:
        user_message_code: user_message_code
        user_message_description: user_message_description
        user_message_sort: user_message_sort
      distinct: true

  - kind: cast
    name: cast_to_integer
    context_name: select_dumc
    params:
      - column: user_message_sort
        to: integer

  - kind: write_dataio
    name: write_dim_user_message_code
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_user_message_code
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full