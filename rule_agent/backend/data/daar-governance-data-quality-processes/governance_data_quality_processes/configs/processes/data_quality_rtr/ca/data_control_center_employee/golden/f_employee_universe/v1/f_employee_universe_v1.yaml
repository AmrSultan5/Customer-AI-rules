transform:
  name: f_employee_universe
  operations:

  - kind: read_dataio
    name: read_dm_employee_organisation
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_organisation
      schema_version: v1

  - kind: read_dataio
    name: read_dm_employee_position
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_position
      schema_version: v1

  - kind: add
    name: add_is_on_leave_dep
    context_name: read_dm_employee_position
    params:
      - column: is_on_leave_dep
        expression: ifnull(is_on_leave, 'null')

  - kind: read_dataio
    name: read_dm_employee_worker
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: udm
      object_name: dm_employee_worker
      schema_version: v2

  - kind: add
    name: add_is_on_leave_dew
    context_name: read_dm_employee_worker
    params:
      - column: is_on_leave_dew
        expression: ifnull(is_on_leave, 'null')

  - kind: read_dataio
    name: read_dim_employee_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: dim_employee_classification
      schema_version: v1

#ORGANISATION
  - kind: join
    name: join_dim_class_organisation
    context_name: read_dim_employee_classification
    params:
      - other:
          read_dm_employee_organisation
        how:
          left
        columns:
          object_type: object_type
          company_code: company_id

  - kind: select
    name: select_organisation
    context_name: join_dim_class_organisation
    params:
      columns:
        supervisory_organisation_id: supervisory_organisation_id
        country_id: country_code
        location_id: location_code
        employee_class_id: employee_class_id
      distinct: true

  - kind: add
    name: add_organisation_data
    context_name: select_organisation
    params:
      - column: object_type
        expression: '"Organisation"'
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: group
    name: group_no_of_organisation
    context_name: add_organisation_data
    params:
      - aggs:
          supervisory_organisation_id: count
        by:
        - country_code
        - location_code
        - employee_class_id
        - object_type
        - loading_date

  - kind: select
    name: select_organisation
    context_name: group_no_of_organisation
    params:
      columns:
        country_code: country_code
        location_code: location_code
        employee_class_id: employee_class_id
        loading_date: loading_date
        object_type: object_type
        count_supervisory_organisation_id: no_of_employee_values
      distinct: true

#POSITION
  - kind: join
    name: join_dim_class_position
    context_name: read_dim_employee_classification
    params:
      - other:
          add_is_on_leave_dep
        how:
          left
        columns:
          object_type: object_type
          company_code: company_id
          is_on_leave: is_on_leave_dep

  - kind: select
    name: select_positions
    context_name: join_dim_class_position
    params:
      columns:
        position_id: position_id
        country_id: country_code
        location_id: location_code
        employee_class_id: employee_class_id
      distinct: true

  - kind: add
    name: add_position_data
    context_name: select_positions
    params:
      - column: object_type
        expression: '"Position"'
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: group
    name: group_no_of_position
    context_name: add_position_data
    params:
      - aggs:
          position_id: count
        by:
        - country_code
        - location_code
        - employee_class_id
        - object_type
        - loading_date

  - kind: select
    name: select_position
    context_name: group_no_of_position
    params:
      columns:
        country_code: country_code
        location_code: location_code
        employee_class_id: employee_class_id
        loading_date: loading_date
        object_type: object_type
        count_position_id: no_of_employee_values
      distinct: true

#WORKER
  - kind: join
    name: join_dim_class_worker
    context_name: read_dim_employee_classification
    params:
      - other:
          add_is_on_leave_dew
        how:
          left
        columns:
          object_type: object_type
          worker_type: worker_type_id
          company_code: company_id
          is_on_leave: is_on_leave_dew

  - kind: select
    name: select_worker
    context_name: join_dim_class_worker
    params:
      columns:
        employee_id: employee_id
        country_id: country_code
        location_id: location_code
        employee_class_id: employee_class_id
      distinct: true

  - kind: add
    name: add_worker_data
    context_name: select_worker
    params:
      - column: object_type
        expression: '"Employee"'
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: group
    name: group_no_of_worker
    context_name: add_worker_data
    params:
      - aggs:
          employee_id: count
        by:
        - country_code
        - location_code
        - employee_class_id
        - object_type
        - loading_date

  - kind: select
    name: select_worker
    context_name: group_no_of_worker
    params:
      columns:
        country_code: country_code
        location_code: location_code
        employee_class_id: employee_class_id
        loading_date: loading_date
        object_type: object_type
        count_employee_id: no_of_employee_values
      distinct: true

  - kind: union
    name: union_data
    context_name: select_position
    params:
      allow_missing: false
      by_name: true
      other: select_worker

  - kind: union
    name: union_data
    params:
      allow_missing: false
      by_name: true
      other: select_organisation

  - kind: cast
    name: cast_to_string
    context_name: union_data
    params:
      - column: no_of_employee_values
        to: string

  - kind: add
    name: add_null
    context_name: cast_to_string
    params:
      - column: country_code
        expression: if(country_code = '', NULL, country_code)
        overwrite: true
      - column: location_code
        expression: if(location_code = '', NULL, location_code)
        overwrite: true
      - column: employee_class_id
        expression: if(employee_class_id = '', NULL, employee_class_id)
        overwrite: true
      - column: object_type
        expression: if(object_type = '', NULL, object_type)
        overwrite: true

  - kind: write_dataio
    name: f_employee_universe
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality_rtr
      country: ca
      module: data_control_center_employee
      namespace: golden
      object_name: f_employee_universe
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full