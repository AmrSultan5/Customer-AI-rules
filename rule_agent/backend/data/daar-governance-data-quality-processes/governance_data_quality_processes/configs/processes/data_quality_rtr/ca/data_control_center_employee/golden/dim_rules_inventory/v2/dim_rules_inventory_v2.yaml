transform:
  name: dim_rules_inventory
  operations:

    - kind: read_local
      name: read_dri
      params:
        format: excel
        location: {{storage_account}}/locations/rtr_documents/data_control_center/dim_rules_inventory.xlsx
        options:
          header: true
          pathGlobFilter: dim_rules_inventory.xlsx
          sheet_name: dim_rules_inventory

    - kind: filter
      name: filter_sub_domain
      params:
        - condition:
            sub_domain != "Internal Order Settlement"

    - kind: select
      name: select_dim_rules_inventory
      params:
        columns:
          rule_code: rule_code
          business_attribute_name: business_attribute_name
          column_name_checked: column_name_checked
          domain: domain
          is_active: is_active
          quality_category: quality_category
          rule_description: rule_description
          severity: severity
          sub_domain: sub_domain
          table_name_checked: table_name_checked
          type_of_check: type_of_check
          is_field_mandatory: is_field_mandatory
          remediation_output: remediation_output
          exclude_from_score_calculation: exclude_from_score_calculation
          check_details_message: check_details_message
          rule_responsibility: rule_responsibility
          rule_level: rule_level
          group: group
          module: module
          is_pbi_active: is_pbi_active
          is_sesitive: is_sesitive

    - kind: add
      name: add_bu_bso_split
      context_name: select_dim_rules_inventory
      params:
        - column: is_in_report_scope
          expression: if((domain IN ('Finance') AND quality_category = 'Uniqueness') OR (domain IN ('Finance', 'Vendor') AND quality_category = 'Activeness'), '0', '1')
        - column: quality_category_sort
          expression: if(quality_category = 'Completeness', '1',
                      if(quality_category = 'Conformity', '2',
                      if(quality_category = 'Uniqueness', '3',
                      if(quality_category = 'Activeness', '4', '0'))))

    - kind: write_dataio
      name: write_dim_rules_inventory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: application
          storage_id: '{{dataio.storage_id}}'
        application_name: data_quality_rtr
        country: ca
        module: data_control_center_employee
        namespace: golden
        object_name: dim_rules_inventory
        process_run_id: '{{process_run_id}}'
        schema_version: v2
        refresh_mode: full