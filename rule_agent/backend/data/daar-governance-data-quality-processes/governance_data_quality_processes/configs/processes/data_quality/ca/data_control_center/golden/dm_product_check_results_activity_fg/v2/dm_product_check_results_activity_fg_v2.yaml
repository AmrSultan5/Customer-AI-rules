        expression: IF(product_document_check='1', max_posting_date, null)    
      - column: check_status
        expression: IF(cast(material_code as int) < 3000 or cast(material_code as int) > 9999999,'',
                    IF((material_code_pl IS NULL OR material_code_pl = ''), '',
                    IF(plant_status_check ='at least one ZA','1',
                    IF(plant_status_check ='at least one 97','1',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '1' AND creation_date_check = '1','1',                                                                                            
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '0' AND sales_block_date >= add_months(current_date(), -12),'1',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '0' AND sales_block_date < add_months(current_date(), -12),'0',
                    IF(plant_status_check = '99 only' and sales_status_check = '1' ,'0',
                    IF((plant_status_check = 'no blocks' OR plant_status_check = 'some blocks') and sales_status_check = '0', '0',
                    IF(plant_status_check = '99 only' and sales_status_check = '0','1',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '1' AND creation_date_check = '0','0',
                    IF(creation_date_check = '1', '1',
                    IF(bom_check = '1' ,'1',
                    IF(extract(YEAR from production_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from purchase_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from billing_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from delivery_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from sales_order_last_date) = extract(YEAR from current_date()) 
                    OR sales_quantity_cy != '0','1',
                    IF(extract(YEAR from production_document_last_date) >= extract(YEAR from current_date()) - 1  
                    OR extract(YEAR from purchase_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from billing_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from delivery_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from sales_order_last_date) >= extract(YEAR from current_date()) - 1
                    OR sales_quantity_py != '0' OR stock_batch != 0 
                    OR stock_unrestricted_quantity != 0 
                    OR stock_blocked_quantity != 0 
                    OR stock_quality_inspection_quantity != 0 
                    OR stock_vendor_quantity != 0 OR stock_customer_unrestricted_use_quantity != '0' 
                    OR sales_quantity_cy != '0', '1', 
                    IF(extract(YEAR from purchase_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from product_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR sales_quantity_py != '0' OR sales_quantity_cy != '0' 
                    OR extract(YEAR from production_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from billing_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from delivery_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from sales_order_last_date) >= extract(YEAR from current_date()) - 1,'1',
                    IF((production_order_check = 0 AND purchase_order_check = 0 AND sales_check = 0 AND billing_document_flag = '0'
                    AND delivery_document_flag = '0' AND sales_order_flag = '0') 
                    AND (stock_check = 1 OR extract(YEAR from product_document_last_date) >= extract(YEAR from current_date()) - 2), '0',
                    IF(purchase_order_check = 0 AND product_document_check = 0 AND production_order_check = 0 
                    AND bom_check = '0' AND sales_check = 0 AND stock_check = '0' , '0',
                    IF(future_planning_flag = '1', '1',
                    '0')))))))))))))))))))
      - column: message
        expression: IF(cast(material_code as int) < 3000 or cast(material_code as int) > 9999999,'',
                    IF((material_code_pl IS NULL OR material_code_pl = ''), 'Not extended on plant level',
                    IF(plant_status_check ='at least one ZA','Material used for Planning',
                    IF(plant_status_check ='at least one 97','Material used for env. fee',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '1' AND creation_date_check = '1','Active Material',                                                                                                              
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '0' AND sales_block_date >= add_months(current_date(), -12),'Active Material',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '0' AND sales_block_date < add_months(current_date(), -12),'Candidate for blocking',
                    IF(plant_status_check = '99 only' and sales_status_check = '1' ,'Material is not fully blocked',
                    IF((plant_status_check = 'no blocks' OR plant_status_check = 'some blocks') and sales_status_check = '0','Material is not fully unblocked',
                    IF(plant_status_check = '99 only' and sales_status_check = '0' ,'Inactive Material - Properly Blocked',
                    IF(plant_status_check = 'at least one 98' and sales_status_check = '1' AND creation_date_check = '0','Candidate for blocking',
                    IF(creation_date_check = '1', 'Active Material - Newly Created',
                    IF(bom_check = '1' ,'Active Material - component of BOM',
                    IF(extract(YEAR from production_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from purchase_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from billing_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from delivery_document_last_date) = extract(YEAR from current_date()) 
                    OR extract(YEAR from sales_order_last_date) = extract(YEAR from current_date()) 
                    OR sales_quantity_cy != '0','Active Material - CYTD Sales Order/Sales Docs/Purchase/Production/Billing/Delivering',
                    IF(extract(YEAR from production_document_last_date) >= extract(YEAR from current_date()) - 1  
                    OR extract(YEAR from purchase_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from billing_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from delivery_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from sales_order_last_date) >= extract(YEAR from current_date()) - 1
                    OR sales_quantity_py != '0' OR stock_batch != 0 
                    OR stock_unrestricted_quantity != 0 
                    OR stock_blocked_quantity != 0 
                    OR stock_quality_inspection_quantity != 0 
                    OR stock_vendor_quantity != 0 OR stock_customer_unrestricted_use_quantity != '0' 
                    OR sales_quantity_cy != '0', 'Active Material - PYTD Sales Order/Sales Docs/Purchase/Production/Stock/Billing/Delivering',                                                                                                          
                    IF(extract(YEAR from purchase_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR extract(YEAR from product_document_last_date) >= extract(YEAR from current_date()) - 1 
                    OR sales_quantity_py != '0' OR sales_quantity_cy != '0' 
                    OR extract(YEAR from production_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from billing_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from delivery_document_last_date) >= extract(YEAR from current_date()) - 1
                    OR extract(YEAR from sales_order_last_date) >= extract(YEAR from current_date()) - 1,'Active Material - PYTD Sales Order/Sales Docs/Purchase/Production/Billing/Delivering',
                    IF((production_order_check = 0 AND purchase_order_check = 0 AND sales_check = 0 AND billing_document_flag = '0' 
                    AND delivery_document_flag = '0' AND sales_order_flag = '0') 
                    AND (stock_check = 1 OR extract(YEAR from product_document_last_date) >= extract(YEAR from current_date()) - 2), 'Candidate for blocking - PPYTD Sales Order/Sales Docs/Purchase/Production/Billing/Delivering require revision',
                    IF(purchase_order_check = 0 AND product_document_check = 0 AND production_order_check = 0 
                    AND bom_check = '0' AND sales_check = 0 AND stock_check = '0' , 'Inactive Material - suggested for blocking',
                    IF(future_planning_flag = '1', 'Inactive Material - Planned for future production',
                    'Candidate for blocking')))))))))))))))))))
      
#final columns
  - kind: add
    name: add_columns
    params:
      - column: rule_code
        expression: '''RPACTI_1.1'''
      - column: sales_quantity_cy_flag
