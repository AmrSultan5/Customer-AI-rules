transform:
  name: f_product_uniqueness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_country
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_country

  - kind: select
    name: select_dm_product_sales_organization
    context_name: read_dm_product_sales_organization
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sales_org_code: sales_org_code
        product_hierarchy_code: product_hierarchy_code
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        sales_unit_code: sales_unit_code
        distribution_channel_code: distribution_channel_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_product_general
    context_name: read_dm_product_general
    params:
      columns:
        material_code: material_code
        material_description: material_description
        material_type_code: material_type_code
        material_status_code: material_status_code
        material_group_code: material_group_code
        bpp_code: bpp_code
        sap_cluster: sap_cluster
        uom_pal_conversion_numerator: uom_pal_conversion_numerator
        uom_pal_ean_code: uom_pal_ean_code
        uom_cs_ean_code: uom_cs_ean_code
        uom_pc_ean_code: uom_pc_ean_code
        uom_pack_ean_code: uom_pack_ean_code 
        old_material_code: old_material_code       
      distinct: true

  - kind: join
    name: join_pg_pso
    params:
      - other:
          select_dm_product_sales_organization
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

# Finished Goods BAN, COJ and non-COJ
# COJ and BAN
  - kind: filter
    name: filter_conditions_COJ_BAN
    context_name: join_pg_pso
    params:
      - condition:
          material_type_code like 'ZFG%' AND 
          material_group_code = '1110000' AND 
          material_status_code = '' AND 
          distribution_channel_code = '01' AND 
          sales_org_code = '0001' AND
          brand_code = 'COJ'

  - kind: group
    name: group_material_code_COJ_BAN
    context_name: filter_conditions_COJ_BAN
    params:
      - aggs:
          material_code: count
        by:
        - product_hierarchy_code
        - bpp_code
        - brand_code
        - flavour_code
        - pack_type_code
        - pack_size_code
        - sales_unit_code
        - sap_cluster
        - material_type_code
        - old_material_code
        
  - kind: join
    name: join_dm_product_general_COJ_BAN
    context_name: filter_conditions_COJ_BAN
    params:
      - other:
          group_material_code_COJ_BAN
        how:
          left
        columns:
          product_hierarchy_code: product_hierarchy_code
          bpp_code: bpp_code
          brand_code: brand_code
          flavour_code: flavour_code
          pack_type_code: pack_type_code
          pack_size_code: pack_size_code
          sales_unit_code: sales_unit_code
          sap_cluster: sap_cluster
          material_type_code: material_type_code
          old_material_code: old_material_code

# non-COJ and BAN
  - kind: filter
    name: filter_conditions_nonCOJ_BAN
    context_name: join_pg_pso
    params:
      - condition:
          material_type_code like 'ZFG%' AND 
          material_group_code = '1110000' AND 
          material_status_code = '' AND 
          distribution_channel_code = '01' AND 
          sales_org_code = '0001' AND
          brand_code != 'COJ'

  - kind: group
    name: group_material_code_nonCOJ_BAN
    context_name: filter_conditions_nonCOJ_BAN
    params:
      - aggs:
          material_code: count
        by:
        - product_hierarchy_code
        - bpp_code
        - brand_code
        - flavour_code
        - pack_type_code
        - pack_size_code
        - sales_unit_code
        - sap_cluster
        - material_type_code
   
  - kind: join
    name: join_dm_product_general_nonCOJ_BAN
    context_name: filter_conditions_nonCOJ_BAN
    params:
      - other:
          group_material_code_nonCOJ_BAN
        how:
          left
        columns:
          product_hierarchy_code: product_hierarchy_code
          bpp_code: bpp_code
          brand_code: brand_code
          flavour_code: flavour_code
          pack_type_code: pack_type_code
          pack_size_code: pack_size_code
          sales_unit_code: sales_unit_code
          sap_cluster: sap_cluster
          material_type_code: material_type_code

# Finished Goods non-BAN, COJ and non-COJ
# COJ and non-BAN
  - kind: filter
    name: filter_conditions_COJ_nonBAN
    context_name: join_pg_pso
    params:
      - condition:
          material_type_code like 'ZFG%' AND 
          material_group_code != '1110000' AND 
          material_status_code = '' AND 
          distribution_channel_code = '01' AND 
          sales_org_code = '0001' AND
          brand_code = 'COJ'

  - kind: group
    name: group_material_code_COJ_nonBAN
    context_name: filter_conditions_COJ_nonBAN
    params:
      - aggs:
          material_code: count
        by:
        - product_hierarchy_code
        - bpp_code
        - brand_code
        - flavour_code
        - pack_type_code
        - pack_size_code
        - sales_unit_code
        - sap_cluster
        - material_type_code
        - old_material_code
        
  - kind: join
    name: join_dm_product_general_COJ_nonBAN
    context_name: filter_conditions_COJ_nonBAN
    params:
      - other:
          group_material_code_COJ_nonBAN
        how:
          left
        columns:
          product_hierarchy_code: product_hierarchy_code
          bpp_code: bpp_code
          brand_code: brand_code
          flavour_code: flavour_code
          pack_type_code: pack_type_code
          pack_size_code: pack_size_code
          sales_unit_code: sales_unit_code
          sap_cluster: sap_cluster
          material_type_code: material_type_code
          old_material_code: old_material_code

# non-COJ and non-BAN
  - kind: filter
    name: filter_conditions_nonCOJ_nonBAN
    context_name: join_pg_pso
    params:
      - condition:
          material_type_code like 'ZFG%' AND 
          material_group_code != '1110000' AND 
          material_status_code = '' AND 
          distribution_channel_code = '01' AND 
          sales_org_code = '0001' AND
          brand_code != 'COJ'

  - kind: group
    name: group_material_code_nonCOJ_nonBAN
    context_name: filter_conditions_nonCOJ_nonBAN
    params:
      - aggs:
          material_code: count
        by:
        - product_hierarchy_code
        - bpp_code
        - brand_code
        - flavour_code
        - pack_type_code
        - pack_size_code
        - sales_unit_code
        - sap_cluster
        - material_type_code
   
  - kind: join
    name: join_dm_product_general_nonCOJ_nonBAN
    context_name: filter_conditions_nonCOJ_nonBAN
    params:
      - other:
          group_material_code_nonCOJ_nonBAN
        how:
          left
        columns:
          product_hierarchy_code: product_hierarchy_code
          bpp_code: bpp_code
          brand_code: brand_code
          flavour_code: flavour_code
          pack_type_code: pack_type_code
          pack_size_code: pack_size_code
          sales_unit_code: sales_unit_code
          sap_cluster: sap_cluster
          material_type_code: material_type_code

# unions of COJ-BAN, COJ-nonBAN, nonCOJ-BAN and nonCOJ-nonBAN
  - kind: union
    name: union_1
    params:
      allow_missing: false
      by_name: true
      other: join_dm_product_general_COJ_nonBAN

  - kind: union
    name: union_2
    params:
      allow_missing: false
      by_name: true
      other: join_dm_product_general_COJ_BAN

  - kind: union
    name: union_COJ_nonCOJ
    params:
      allow_missing: false
      by_name: true
      other: join_dm_product_general_nonCOJ_BAN

  - kind: add
    name: add_key_attributes_check
    params:
      - column: key_attributes_check
        expression: if(count_material_code > 1, '0', '1')

  - kind: filter
    name: filter_count
    params:
      - condition:
          key_attributes_check = '0'

  - kind: select
    name: select_dm_product_general
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_description: material_description
        material_group_code: material_group_code
        sap_cluster: sap_cluster
        product_hierarchy_code: product_hierarchy_code
        bpp_code: bpp_code
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        sales_unit_code: sales_unit_code
        count_material_code: count_material_code
        key_attributes_check: key_attributes_check
        uom_pal_conversion_numerator: uom_pal_conversion_numerator
        uom_pal_ean_code: uom_pal_ean_code
        uom_cs_ean_code: uom_cs_ean_code
        uom_pc_ean_code: uom_pc_ean_code
        uom_pack_ean_code: uom_pack_ean_code     
      distinct: true

  - kind: select
    name: select_dm_product_general_2
    params:
      columns:
        material_code: material_code_2
        material_description: material_description_2
        sap_cluster: sap_cluster
        product_hierarchy_code: product_hierarchy_code
        bpp_code: bpp_code
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        sales_unit_code: sales_unit_code
        material_group_code: material_group_code_2
        count_material_code: count_material_code_2
        uom_pal_conversion_numerator: uom_pal_conversion_numerator_2
        uom_pal_ean_code: uom_pal_ean_code_2
        uom_cs_ean_code: uom_cs_ean_code_2
        uom_pc_ean_code: uom_pc_ean_code_2
        uom_pack_ean_code: uom_pack_ean_code_2        
      distinct: true

  - kind: select
    name: select_dim_country
    context_name: read_dim_country
    params:
      columns:
        country_code: country
      distinct: true

  - kind: select
    name: select_dim_country_2
    context_name: read_dim_country
    params:
      columns:
        country_code: country_2
      distinct: true

  - kind: join
    name: join_dm_product_general_cross
    context_name: select_dm_product_general
    params:
      - other:
          select_dm_product_general_2
        how:
          cross
        columns:
          product_hierarchy_code: product_hierarchy_code
          bpp_code: bpp_code
          brand_code: brand_code
          flavour_code: flavour_code
          pack_type_code: pack_type_code
          pack_size_code: pack_size_code
          sales_unit_code: sales_unit_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_material_description_country_code
    params:
      - column: material_description_country_code
        expression: regexp_extract(material_description, '[A-Z]{2}$', 0)
      - column: material_description_country_code_2
        expression: regexp_extract(material_description_2, '[A-Z]{2}$', 0)

  - kind: join
    name: join_dm_product_general_country
    params:
      - other:
          select_dim_country
        how:
          left
        columns:
          material_description_country_code: country
      - other:
          select_dim_country_2
        how:
          left
        columns:
          material_description_country_code_2: country_2

  - kind: filter
    name: filter_equal_material_code
    params:
      - condition:
          material_code <> material_code_2
         
  - kind: select
    name: select_dm_product_general_description
    params:
      columns:
        material_code: material_code
        material_code_2: material_code_2
        country_code: country_code
        material_description: material_description
        material_description_2: material_description_2
        country: country
        country_2: country_2
        key_attributes_check: key_attributes_check
        sap_cluster: sap_cluster
        material_group_code: material_group_code
        material_group_code_2: material_group_code_2
        uom_pal_conversion_numerator: uom_pal_conversion_numerator
        uom_pal_conversion_numerator_2: uom_pal_conversion_numerator_2
        uom_pal_ean_code: uom_pal_ean_code
        uom_pal_ean_code_2: uom_pal_ean_code_2
        uom_cs_ean_code: uom_cs_ean_code
        uom_cs_ean_code_2: uom_cs_ean_code_2
        uom_pc_ean_code: uom_pc_ean_code
        uom_pc_ean_code_2: uom_pc_ean_code_2
        uom_pack_ean_code: uom_pack_ean_code
        uom_pack_ean_code_2: uom_pack_ean_code_2
      distinct: true      

  - kind: add
    name: add_dm_product_general
    context_name: select_dm_product_general_description
    params:
      - column: material_description_substr
        expression: replace(replace(replace(material_description,'(',''),')',''),'-',' ')
      - column: material_description_2_substr
        expression: replace(replace(replace(material_description_2,'(',''),')',''),'-',' ')          
      - column: material_code_sub
        expression: if(isnull(country), material_description_substr, regexp_replace(material_description_substr, '\\s[A-Z]+(?=[^A-Z]*$)', ''))
      - column: material_code_sub2
        expression: if(isnull(country_2), material_description_2_substr, regexp_replace(material_description_2_substr, '\\s[A-Z]+(?=[^A-Z]*$)', '')) 

  - kind: select
    name: select_dm_product_general_description
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_code_2: duplicated_material_code
        key_attributes_check: key_attributes_check
        sap_cluster: sap_cluster
        material_group_code: material_group_code
        material_group_code_2: material_group_code_2
        uom_pal_conversion_numerator: uom_pal_conversion_numerator
        uom_pal_conversion_numerator_2: uom_pal_conversion_numerator_2
        uom_pal_ean_code: uom_pal_ean_code
        uom_pal_ean_code_2: uom_pal_ean_code_2
        uom_cs_ean_code: uom_cs_ean_code
        uom_cs_ean_code_2: uom_cs_ean_code_2
        uom_pc_ean_code: uom_pc_ean_code
        uom_pc_ean_code_2: uom_pc_ean_code_2
        uom_pack_ean_code: uom_pack_ean_code
        uom_pack_ean_code_2: uom_pack_ean_code_2   
        material_code_sub: material_code_sub   
        material_code_sub2: material_code_sub2
        material_description_substr: material_description_substr
        material_description_2_substr: material_description_2_substr          
  
  - kind: filter
    name: filter_material_group_code_1110000
    params:
      - condition:
          material_group_code = '1110000' and material_group_code_2 = '1110000'

  - kind: add
    name: add_finished_good_ban
    context_name: filter_material_group_code_1110000
    params:
      - column: rule_code
        expression: '''RPUNIQ_1'''
      - column: material_description_check
        expression: if(material_description_substr=material_description_2_substr,  '0', '1')
      - column: check_status
        expression: if(key_attributes_check = '0' and material_description_check = '0', '0', '1')
      - column: uom_numerator_check
        expression: ''''''
      - column: uom_ean_check
        expression: ''''''
      - column: check_date
        expression: current_timestamp() 
      - column: material_description_similiarity_score
        expression: cast(null as decimal(3,2))          
          
  - kind: select
    name: select_finished_good_ban
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        duplicated_material_code: duplicated_material_code
        check_date: check_date
        country_code: country_code
        sap_cluster: sap_cluster
        material_description_similiarity_score: material_description_similiarity_score
        uom_numerator_check: uom_numerator_check
        uom_ean_check: uom_ean_check
        key_attributes_check: key_attributes_check
      distinct: true

  - kind: filter
    name: filter_material_group_code_not_1110000
    context_name: select_dm_product_general_description
    params:
      - condition:
          material_group_code <> '1110000' and material_group_code_2 <> '1110000'

  - kind: add
    name: add_material_description_check
    params:
      - column: material_description_check
        expression: if(material_description_substr=material_description_2_substr,  '0', '1')

  - kind: filter
    name: filter_material_description_check
    params:
      - condition:
          material_description_check = '0'

  - kind: add
    name: add_finished_good_non_ban
    params:
      - column: rule_code
        expression: '''RPUNIQ_1'''
      - column: uom_numerator_check
        expression: if(uom_pal_conversion_numerator = uom_pal_conversion_numerator_2, '0', '1')
      - column: uom_ean_check
        expression: if((uom_pal_ean_code = uom_pal_ean_code_2 AND uom_pal_ean_code!='' AND uom_pal_ean_code_2!='') OR (uom_cs_ean_code = uom_cs_ean_code_2 AND uom_cs_ean_code!='' AND uom_cs_ean_code_2!='') OR (uom_pc_ean_code=uom_pc_ean_code_2 AND uom_pc_ean_code!='' AND uom_pc_ean_code_2!='') OR (uom_pack_ean_code=uom_pack_ean_code_2 AND uom_pack_ean_code!='' AND uom_pack_ean_code_2!=''), '0', '1')
      - column: check_status
        expression: if(material_description_check = '0' and uom_numerator_check = '0' and uom_ean_check = '0', '0', '1')
      - column: check_date
        expression: current_timestamp()
      - column: material_description_similiarity_score
        expression: cast(null as decimal(3,2))        

  - kind: select
    name: select_finished_good_non_ban
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        duplicated_material_code: duplicated_material_code
        check_date: check_date
        country_code: country_code
        sap_cluster: sap_cluster
        material_description_similiarity_score: material_description_similiarity_score
        uom_numerator_check: uom_numerator_check
        uom_ean_check: uom_ean_check
        key_attributes_check: key_attributes_check
      distinct: true

  - kind: union
    name: union_ban_and_non_ban
    params:
      allow_missing: false
      by_name: true
      other: select_finished_good_ban

  - kind: select
    name: select_product_general_spare_parts
    context_name: read_dm_product_general
    params:
      columns:
        material_code: material_code
        material_type_code: material_type_code
        material_status_code: material_status_code
        type_number: type_number
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_zsps
    params:
      - condition:
          material_type_code = 'ZSPS' and material_status_code = ''

  - kind: group
    name: group_spare_parts
    params:
      - aggs:
          material_code: count
        by:
        - type_number
        - sap_cluster

  - kind: join
    name: join_group_spare_parts
    context_name: filter_zsps
    params:
      - other:
          group_spare_parts
        how:
          left
        columns:
          type_number: type_number
          sap_cluster: sap_cluster

  - kind: select
    name: select_dm_product_sales_organization_spare_parts
    context_name: read_dm_product_sales_organization
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_pg_pso_spare_parts
    context_name: join_group_spare_parts
    params:
      - other:
          select_dm_product_sales_organization_spare_parts
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_check_status_zsps
    params:
      - column: check_status
        expression: if(count_material_code > 1, '0', '1')
      - column: rule_code
        expression: '''RPUNIQ_1'''
      - column: duplicated_material_code
        expression: ''''''
      - column: material_description_similiarity_score
        expression: cast(null as decimal(3,2))
      - column: uom_numerator_check
        expression: ''''''
      - column: uom_ean_check
        expression: ''''''
      - column: key_attributes_check
        expression: ''''''
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_zsps
    context_name: add_check_status_zsps
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        duplicated_material_code: duplicated_material_code
        check_date: check_date
        country_code: country_code
        sap_cluster: sap_cluster
        material_description_similiarity_score: material_description_similiarity_score
        uom_numerator_check: uom_numerator_check
        uom_ean_check: uom_ean_check
        key_attributes_check: key_attributes_check
      distinct: true

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: union_ban_and_non_ban

  - kind: write_dataio
    name: write_dm_product_check_results_uniqueness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_check_results_uniqueness
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full