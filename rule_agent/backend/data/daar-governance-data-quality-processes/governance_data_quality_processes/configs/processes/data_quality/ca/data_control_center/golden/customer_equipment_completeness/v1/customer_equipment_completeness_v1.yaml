#SELECT rccomp_389_1
  - kind: select
    name: select_rccomp_389_1
    context_name: join_dce_dcg
    params:
      columns:
        customer_code: customer_code
        equipment_model: equipment_model
      distinct: true

  - kind: add
    name: add_rccomp_389_1
    context_name: select_rccomp_389_1
    params:
      - column: rule_code
        expression: "'RCCOMP_389.1'"
      - column: check_status
        expression: "CASE WHEN equipment_model is null OR equipment_model ='' THEN '0' ELSE '1' END"

  - kind: select
    name: select_rccomp_389_1_final
    context_name: add_rccomp_389_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        equipment_model: value_checked
      distinct: true

#Union all
  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_278_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_278_2_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_340_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_341_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_386_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_387_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_388_1_final

  - kind: union
    name: union_customer_equipment_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rccomp_389_1_final

  - kind: add
    name: add_final
    params:
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
        check_date: check_date
      distinct: true  

  - kind: write_dataio
    name: write_customer_equipment_completeness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: customer_equipment_completeness
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full