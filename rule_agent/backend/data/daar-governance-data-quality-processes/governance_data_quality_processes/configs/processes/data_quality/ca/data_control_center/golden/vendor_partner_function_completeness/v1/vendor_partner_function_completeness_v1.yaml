transform:
  name: vendor_partner_function_completeness
  operations:

# ── RVCOMP_265.1  Missing Partner Function (9000 AG only — 1300 AG out of scope until next year)

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_partner_function
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_partner_function

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_company
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_company

  - kind: select
    name: select_dm_vendor_partner_function
    context_name: read_dm_vendor_partner_function
    params:
      columns:
        vendor_code: vendor_code
        vendor_account_group_code: vendor_account_group_code
        partner_function_code: partner_function_code
      distinct: true

  - kind: select
    name: select_dm_vendor_company
    context_name: read_dm_vendor_company
    params:
      columns:
        vendor_code: vendor_code
        country_code: country_code
      distinct: true

  - kind: join
    name: join_data_marts
    context_name: select_dm_vendor_partner_function
    params:
      - other:
          select_dm_vendor_company
        how:
          left
        columns:
          vendor_code: vendor_code

  - kind: add
    name: add_checks
    context_name: join_data_marts
    params:
      - column: rcvomp_265_1
        expression: if(vendor_account_group_code = '9000',
                    if(isnull(partner_function_code) or partner_function_code = '', '0', '1'), '')
      - column: rule_code_rcvomp_265_1
        expression: '''RVCOMP_265.1'''
      - column: subdomain
        expression: '''partner_function_completeness'''
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_rcvomp_265_1
    context_name: add_checks
    params:
      columns:
        rule_code_rcvomp_265_1: rule_code
        rcvomp_265_1: check_status
        vendor_code: vendor_code
        partner_function_code: value_checked
        check_date: check_date
        country_code: country_code
        subdomain: subdomain
      distinct: true

  - kind: write_dataio
    name: write_dm_vendor_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_check_results
      process_run_id: '{{process_run_id}}'
      schema_version: v4
      refresh_mode: full