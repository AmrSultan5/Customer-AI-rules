    context_name: select_rcconf_238_2
    params:
      - column: rule_code
        expression: "'RCCONF_238.2'"
      - column: check_status
        expression: if((l3_customer_code is null OR l4_customer_code is null ) 
                    or (l3_customer_code = '-1' OR l4_customer_code = '-1' ) 
                    or (customer_group_4_code NOT IN ('IN')), '',
                    if(l3_customer_code = 'KA0A' AND l4_customer_code in('0000010100','0000010101','0000010102','0000010103', '00000101004'), '1', 
                    if(l3_customer_code = 'KA0B' AND l4_customer_code in('0000010200','0000010201','0000010202','0000010203', '0000010204', '0000010205', '0000010206', '0000010207', '0000010208', '0000010209'), '1',
                    if(l3_customer_code = 'NK0A' AND l4_customer_code in('0000010300','0000010301','0000010302','0000010303'), '1',
                    if(l3_customer_code = 'NK0B' AND l4_customer_code in('0000010400','0000010401','0000010402','0000010403','0000010405','0000010406', '0000010404'), '1',
                    if(l3_customer_code = 'NK0V' AND l4_customer_code in('0000010500', '0000010501', '0000010502', '0000010503', '0000010504', '0000010505'), '1',
                    if(l3_customer_code = 'NK0T' AND l4_customer_code in('0000010600','0000010601', '0000010602'), '1',
                    if(l3_customer_code = 'NK0Z' AND l4_customer_code in('0000010700','0000010701','0000010702','0000010703', '0000010704'), '1',
                    '0'))))))))
      - column: value_checked
        expression: l3_customer_code|| '_' || l4_customer_code

