transform:
  name: additional_data_mdg_sap
  operations:

  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_mdg_knvv
    context_name: read_mdg_knvv
    params:
      - condition:
          kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')
          and vkorg in(9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

  - kind: select
    name: select_mdg_knvv
    context_name: filter_mdg_knvv
    params:
      columns:
        kunnr: kunnr_mdg_knvv
        vkorg: vkorg_mdg_knvv
        vtweg: vtweg_mdg_knvv
        spart: spart_mdg_knvv
        kvgr1: kvgr1_mdg_knvv
        kvgr5: kvgr5_mdg_knvv
        kvgr4: kvgr4_mdg_knvv
        kvgr2: kvgr2_mdg_knvv
      distinct: true

  - kind: read_dataio
    name: read_sap_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_sap_knvv
    context_name: read_sap_knvv
    params:
      - condition:
          if(sap_cluster = 'CL1', kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          kunnr like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))
          and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

  - kind: select
    name: select_sap_knvv
    context_name: filter_sap_knvv
    params:
      columns:
        kunnr: kunnr_sap_knvv
        vkorg: vkorg_sap_knvv
        vtweg: vtweg_sap_knvv
        spart: spart_sap_knvv
        kvgr1: kvgr1_sap_knvv
        kvgr5: kvgr5_sap_knvv
        kvgr4: kvgr4_sap_knvv
        kvgr2: kvgr2_sap_knvv
      distinct: true

  - kind: add
    name: add_mdg
    context_name: select_mdg_knvv
    params:
      - column: hash_mdg
        expression: md5(concat_ws('',
                    kunnr_mdg_knvv, 
                    vkorg_mdg_knvv, 
                    vtweg_mdg_knvv, 
                    spart_mdg_knvv,
                    kvgr1_mdg_knvv, 
                    kvgr5_mdg_knvv,
                    kvgr4_mdg_knvv,
                    kvgr2_mdg_knvv))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_sap
    context_name: select_sap_knvv
    params:
      - column: hash_sap
        expression: md5(concat_ws('',
                    kunnr_sap_knvv, 
                    vkorg_sap_knvv, 
                    vtweg_sap_knvv, 
                    spart_sap_knvv,
                    kvgr1_sap_knvv, 
                    kvgr5_sap_knvv,
                    kvgr4_sap_knvv,
                    kvgr2_sap_knvv))           

  - kind: checkpoint
    name: checkpoint_sap
    context_name: add_sap

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_sap
        how:
          full
        columns:
          hash_mdg: hash_sap

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_sap) or hash_sap = ''

  - kind: join
    name: join_non_matching_sap
    context_name: checkpoint_sap
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_sap: hash_mdg

  - kind: filter
    name: filter_non_matching_sap
    context_name: join_non_matching_sap
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        kunnr_mdg_knvv: kunnr_mdg
        vkorg_mdg_knvv: vkorg_mdg
        vtweg_mdg_knvv: vtweg_mdg
        spart_mdg_knvv: spart_mdg
        kvgr1_mdg_knvv: kvgr1_mdg
        kvgr5_mdg_knvv: kvgr5_mdg
        kvgr4_mdg_knvv: kvgr4_mdg
        kvgr2_mdg_knvv: kvgr2_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_sap
    context_name: filter_non_matching_sap
    params:
      columns:
        kunnr_sap_knvv: kunnr_sap
        vkorg_sap_knvv: vkorg_sap
        vtweg_sap_knvv: vtweg_sap
        spart_sap_knvv: spart_sap
        kvgr1_sap_knvv: kvgr1_sap
        kvgr5_sap_knvv: kvgr5_sap
        kvgr4_sap_knvv: kvgr4_sap
        kvgr2_sap_knvv: kvgr2_sap
        hash_sap: hash_sap
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_sap
    context_name: select_non_matching_sap

  - kind: read_dataio
    name: read_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_but000
    context_name: read_but000
    params:
      - condition:
          partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')

  - kind: select
    name: select_but000
    context_name: filter_but000
    params:
      columns:
        partner: partner
        name_last: name_last
        name_first: name_first
      distinct: true


  - kind: read_dataio
    name: read_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_sap
        how:
          full
        columns:
          kunnr_mdg: kunnr_sap
          vkorg_mdg: vkorg_sap
          vtweg_mdg: vtweg_sap
          spart_mdg: spart_sap


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_but000
        how:
          left
        columns:
          kunnr_sap: partner
      - other:
          select_kna1
        how:
          left
        columns:
          kunnr_sap: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4_sap: kvgr4


  - kind: join
    name: join_missing_from_sap
    context_name: join_non_matching
    params:
      - other:
          select_but000
        how:
          left
        columns:
          kunnr_mdg: partner
      - other:
          select_kna1
        how:
          left
        columns:
          kunnr_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4_mdg: kvgr4


## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(kunnr_mdg) and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(kunnr_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(kunnr_sap, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''ADDITIONAL DATA'''
      - column: src_system
        expression: '''sap'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from sap

  - kind: filter
    name: filter_missing_from_sap
    context_name: join_missing_from_sap
    params:
      - condition:
          isnull(kunnr_sap) and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_missing_from_sap
    context_name: filter_missing_from_sap
    params:
      - column: msg
        expression: if(isnull(kunnr_sap), 'data missing from sap', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(kunnr_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''ADDITIONAL DATA'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''sap'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_sap
    params:
      - condition:
          kunnr_sap = kunnr_mdg
          and vkorg_sap = vkorg_mdg
          and vtweg_sap = vtweg_mdg
          and spart_sap = spart_mdg
          and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')
          and (kvgr1_sap <> kvgr1_mdg
          or kvgr5_sap <> kvgr5_mdg
          or kvgr4_sap <> kvgr4_mdg
          or kvgr2_sap <> kvgr2_mdg)

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_kvgr1
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr1_sap <=> kvgr1_mdg), 'attributes are mismatching', '-')
      - column: msg_kvgr5
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr5_sap <=> kvgr5_mdg), 'attributes are mismatching', '-')
      - column: msg_kvgr4
        expression: if(kunnr_sap = kunnr_mdg
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr4_sap <=> kvgr4_mdg), 'attributes are mismatching', '-')
      - column: msg_kvgr2
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr2_sap <=> kvgr2_mdg), 'attributes are mismatching', '-')
      - column: attr_name_kvgr1
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr1_sap <=> kvgr1_mdg), concat('ADDITIONAL DATA :', ' ', ' Customer Group 1'), '-')
      - column: attr_name_kvgr5
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr5_sap <=> kvgr5_mdg), concat('ADDITIONAL DATA :', ' ', ' Customer Group 5'), '-')
      - column: attr_name_kvgr4
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr4_sap <=> kvgr4_mdg), concat('ADDITIONAL DATA :', ' ', ' Customer Group 4'), '-')
      - column: attr_name_kvgr2
        expression: if(kunnr_sap = kunnr_mdg 
                    and vkorg_sap = vkorg_mdg
                    and vtweg_sap = vtweg_mdg
                    and spart_sap = spart_mdg
                    and !(kvgr2_sap <=> kvgr2_mdg), concat('ADDITIONAL DATA :', ' ', ' Customer Group 2'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(kunnr_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''ADDITIONAL DATA'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''sap'''
      - column: loading_date
        expression: current_date()


  - kind: select
    name: select_missing_from_mdg
    context_name: add_missing_from_mdg
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        kunnr_sap: primary_key_l1
        name_first: attribute1
        name_last: attribute2
        aufsd: attribute4
        attribute5: attribute5
        vkorg_sap: attribute6
        vtweg_sap: attribute7
        spart_sap: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: select
    name: select_missing_from_sap
    context_name: add_missing_from_sap
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        kunnr_mdg: primary_key_l1
        name_first: attribute1
        name_last: attribute2
        aufsd: attribute4
        attribute5: attribute5
        vkorg_mdg: attribute6
        vtweg_mdg: attribute7
        spart_mdg: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_kvgr1
    context_name: add_mismatched
    params:
      - condition:
          msg_kvgr1 <> '-'

  - kind: select
    name: select_mismatched_kvgr1
    context_name: filter_mismatched_kvgr1
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg_kvgr1: dimension
        kunnr_mdg: primary_key_l1
        name_first: attribute1
        name_last: attribute2
        aufsd: attribute4
        attribute5: attribute5
        vkorg_mdg: attribute6
        vtweg_mdg: attribute7
        spart_mdg: attribute8
        attribute10: attribute10
        country: country
        attr_name_kvgr1: compared_attribute
        kvgr1_mdg: compared_src_attr_value
        kvgr1_sap: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_kvgr5
    context_name: add_mismatched
    params:
      - condition:
          msg_kvgr5 <> '-'

  - kind: select
    name: select_mismatched_kvgr5
    context_name: filter_mismatched_kvgr5
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg_kvgr5: dimension
        kunnr_mdg: primary_key_l1
        name_first: attribute1
        name_last: attribute2
        aufsd: attribute4
        attribute5: attribute5
        vkorg_mdg: attribute6
        vtweg_mdg: attribute7
        spart_mdg: attribute8
        attribute10: attribute10
        country: country
        attr_name_kvgr5: compared_attribute
        kvgr5_mdg: compared_src_attr_value
        kvgr5_sap: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_kvgr4
    context_name: add_mismatched
    params:
      - condition:
          msg_kvgr4 <> '-'

  - kind: select
    name: select_mismatched_kvgr4
    context_name: filter_mismatched_kvgr4
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg_kvgr4: dimension
        kunnr_mdg: primary_key_l1
        name_first: attribute1
        name_last: attribute2
        aufsd: attribute4
        attribute5: attribute5
        vkorg_mdg: attribute6
        vtweg_mdg: attribute7
        spart_mdg: attribute8
        attribute10: attribute10
        country: country
        attr_name_kvgr4: compared_attribute
        kvgr4_mdg: compared_src_attr_value
        kvgr4_sap: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_kvgr2
