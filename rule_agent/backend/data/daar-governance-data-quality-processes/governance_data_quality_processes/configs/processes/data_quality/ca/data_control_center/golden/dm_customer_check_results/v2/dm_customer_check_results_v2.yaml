# Read dim_rules_inventory
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_rules_inventory

  - kind: select
    name: select_dim_rules_inventory
    context_name: read_dim_rules_inventory
    params:
      columns:
        rule_code: rule_code
      distinct: true

  - kind: join
    name: join_customer_check_results
    context_name: union_customer_check_results_final
    params:
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code

  - kind: add
    name: add_customer_check_results_expression
    params:
      - column: primary_key
        expression: "TRIM(concat(ifnull(customer_code, 'null'), '_',  ifnull(rule_code, 'null'), '_', ifnull
        (value_checked, 'null')))"
        overwrite: true

# Add Feedback for False Positive
  - name: df_feedback
    kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    params:
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: feedback
      object_name: customer_details_feedback
      dataio:
        layer: application
        storage_id: '{{dataio.storage_id}}'
        ad_id: '{{dataio.ad_id}}'

  - kind: select
    name: df_feedback_select
    context_name: df_feedback
    params:
      columns:
        primary_key: primary_key
        false_positive_flag: false_positive_flag
      distinct: true

  - kind: filter
    name: df_feedback_fp
    context_name: df_feedback_select
    params:
      - condition:
          false_positive_flag > 0

  - kind: join
    name: join_customer_check_results_feedback
    context_name: add_customer_check_results_expression
    params:
      - other:
          df_feedback_fp
        how:
          left
        columns:
          primary_key: primary_key

  - kind: add
    name: add_customer_check_results_feedback
    context_name: join_customer_check_results_feedback
    params:
      - column: check_status
        expression: if(false_positive_flag IS NOT NULL AND rule_code IN ('RCACCU_18.4', 'RCACCU_21.3', 'RCACCU_21.4', 'RCACCU_22.1', 'RCACCU_22.5', 'RCACCU_22.6', 'RCACCU_225.2', 'RCACCU_23.2', 'RCACCU_383.6', 'RCCONF_21.1', 'RCCONF_225.1', 'RCACCU_61.13', 'RCACCU_12.5', 'RCACCU_12.6', 'RCACCU_370.8', 'RCACCU_13.5', 'RCACCU_370.5'), '1', check_status)
        overwrite: true

  - kind: drop_duplicates
    name: deduplicated_customer_check_results_feedback
    context_name: add_customer_check_results_feedback
    params:
      columns:
        - primary_key
        - rule_code
        - customer_code
        - value_checked
        - check_status
        - check_date

  - kind: drop
    name: drop_false_positive_flag
    context_name: add_customer_check_results_feedback
    params:
      - column: false_positive_flag

  - kind: write_dataio
    name: write_customer_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_check_results
      process_run_id: '{{process_run_id}}'
      schema_version: v3
      refresh_mode: full
