transform:
  name: marketing_attributes_mdg_sap
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')

  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        name_last: name_last_mdg_but000
        name_first: name_first_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_mdg_cabn
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: cabn
      schema_version: v1

  - kind: filter
    name: filter_mdg_cabn
    context_name: read_mdg_cabn
    params:
      - condition:
          atnam in('INDIRECT_CUST_SHARING_STATUS', 
                      'RETAILER_SEGMENTATION',
                      'ZCCAF_HIGH_SEASON2', 
                      'ZCCAF_HIGH_SEASON2_FROM', 
                      'ZCCAF_HIGH_SEASON2_TO', 
                      'ZCDE_ACTUAL_DOORS', 
                      'ZCDE_CHANNEL_PRIORITY', 
                      'ZCOFFEE_SEGMENT', 
                      'ZFOCUS_OUTLET', 
                      'ZFSA_NUMBER_OF_TELLERS', 
                      'ZFSA_SALES_SURFACE', 
                      'ZFSA_WAREHOUSE_SURFACE', 
                      'ZGLOBAL_CUSTOMER', 
                      'ZLOCAL_SEGMENTATION', 
                      'ZONLINE_PLATFORM', 
                      'ZRED_OUTLET', 
                      'ZSELL_ONLINE', 
                      'ZSERVICE_TIME_OFF', 
                      'ZTRADE_NAME', 
                      'ZWEB_HIDE_CREDIT', 
                      'ZWEB_HIDE_PRICE', 
                      'ZXTEL_CLUSTER', 
                      'Z_CCAF_VISIT_FREQUENCY', 
                      'Z_CCHBC_POTENTIAL', 
                      'Z_CCHBC_POTENTIAL_GAP', 
                      'Z_CONT_SEGM', 
                      'Z_CTS_CLUSTER', 
                      'Z_CUST_SATISFACTION', 
                      'Z_CUSTOMER_INCENTIVE', 
                      'Z_EATB_WARM_SPACE', 
                      'Z_EATB_WARM_SPACE_TARGET', 
                      'Z_ECOMM_FSA', 
                      'Z_EDS', 
                      'Z_EFFICIENCY', 
                      'Z_MAIN_OCCASION', 
                      'Z_MERCH_SERVICE_TIME', 
                      'Z_OPTEN', 
                      'Z_ORDERS_NOT_EXPECTED', 
                      'Z_ORIGINAL_NIELSEN_CODE', 
                      'Z_PFP_CUSTOMER', 
                      'Z_PRESELLER_SERVICE_TIME', 
                      'Z_RED_TARGET', 
                      'Z_SECONDARY_OCCASION', 
                      'Z_TIRIES', 
                      'Z_TOTAL_POTENTIAL',
                      'Z_CCAF',
                      'ZSERVICE_TIME',
                      'Z_CCAF_SEASONALITY',
                      'ZBDAA_SEGM01',
                      'ZCDE_TARGET_DOORS')

  - kind: select
    name: select_mdg_cabn
    context_name: filter_mdg_cabn
    params:
      columns:
        atinn: atinn_mdg_cabn
        atnam: atnam_mdg_cabn
      distinct: true

  - kind: read_dataio
    name: read_mdg_ausp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: ausp
      schema_version: v1

  - kind: select
    name: select_mdg_ausp
    context_name: read_mdg_ausp
    params:
      columns:
        objek: objek_mdg_ausp
        atwrt: atwrt_mdg_ausp
        atinn: atinn_mdg_ausp
      distinct: true


  - kind: read_dataio
    name: read_mdg_inob
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: inob
      schema_version: v1

  - kind: select
    name: select_mdg_inob
    context_name: read_mdg_inob
    params:
      columns:
        objek: objek_mdg_inob
        cuobj: cuobj_mdg_inob
      distinct: true


  - kind: join
    name: join_mdg
    context_name: select_mdg_ausp
    params:
      - other:
          select_mdg_inob
        how:
          inner
        columns:
          objek_mdg_ausp: cuobj_mdg_inob
      - other:
          select_mdg_cabn
        how:
          inner
        columns:
          atinn_mdg_ausp: atinn_mdg_cabn
      - other:
          select_mdg_but000
        how:
          inner
        columns:
          objek_mdg_inob: partner_mdg_but000

  - kind: read_dataio
    name: read_sap_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_sap_but000
    context_name: read_sap_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))

  - kind: select
    name: select_sap_but000
    context_name: filter_sap_but000
    params:
      columns:
        partner: partner_sap_but000
        name_last: name_last_sap_but000
        name_first: name_first_sap_but000
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_sap_cabn
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: cabn
      schema_version: v1 

  - kind: filter
    name: filter_sap_cabn
    context_name: read_sap_cabn
    params:
      - condition:
          atnam in('INDIRECT_CUST_SHARING_STATUS', 
                      'RETAILER_SEGMENTATION',
                      'ZCCAF_HIGH_SEASON2', 
                      'ZCCAF_HIGH_SEASON2_FROM', 
                      'ZCCAF_HIGH_SEASON2_TO', 
                      'ZCDE_ACTUAL_DOORS', 
                      'ZCDE_CHANNEL_PRIORITY', 
                      'ZCOFFEE_SEGMENT', 
                      'ZFOCUS_OUTLET', 
                      'ZFSA_NUMBER_OF_TELLERS', 
                      'ZFSA_SALES_SURFACE', 
                      'ZFSA_WAREHOUSE_SURFACE', 
                      'ZGLOBAL_CUSTOMER', 
                      'ZLOCAL_SEGMENTATION', 
                      'ZONLINE_PLATFORM', 
                      'ZRED_OUTLET', 
                      'ZSELL_ONLINE', 
                      'ZSERVICE_TIME_OFF', 
                      'ZTRADE_NAME', 
                      'ZWEB_HIDE_CREDIT', 
                      'ZWEB_HIDE_PRICE', 
                      'ZXTEL_CLUSTER', 
                      'Z_CCAF_VISIT_FREQUENCY', 
                      'Z_CCHBC_POTENTIAL', 
                      'Z_CCHBC_POTENTIAL_GAP', 
                      'Z_CONT_SEGM', 
                      'Z_CTS_CLUSTER', 
                      'Z_CUST_SATISFACTION', 
                      'Z_CUSTOMER_INCENTIVE', 
                      'Z_EATB_WARM_SPACE', 
                      'Z_EATB_WARM_SPACE_TARGET', 
                      'Z_ECOMM_FSA', 
                      'Z_EDS', 
                      'Z_EFFICIENCY', 
                      'Z_MAIN_OCCASION', 
                      'Z_MERCH_SERVICE_TIME', 
                      'Z_OPTEN', 
                      'Z_ORDERS_NOT_EXPECTED', 
                      'Z_ORIGINAL_NIELSEN_CODE', 
                      'Z_PFP_CUSTOMER', 
                      'Z_PRESELLER_SERVICE_TIME', 
                      'Z_RED_TARGET', 
                      'Z_SECONDARY_OCCASION', 
                      'Z_TIRIES', 
                      'Z_TOTAL_POTENTIAL',
                      'Z_CCAF',
                      'ZSERVICE_TIME',
                      'Z_CCAF_SEASONALITY',
                      'ZBDAA_SEGM01',
                      'ZCDE_TARGET_DOORS')

  - kind: select
    name: select_sap_cabn
    context_name: filter_sap_cabn
    params:
      columns:
        atinn: atinn_sap_cabn
        atnam: atnam_sap_cabn
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_sap_ausp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: ausp
      schema_version: v1

  - kind: select
    name: select_sap_ausp
    context_name: read_sap_ausp
    params:
      columns:
        objek: objek_sap_ausp
        atwrt: atwrt_sap_ausp
        atinn: atinn_sap_ausp
        sap_cluster: sap_cluster
      distinct: true


  # - kind: read_dataio
  #   name: read_sap_inob
  #   params:
  #     dataio:
  #       ad_id: '{{dataio.ad_id}}'
  #       layer: curated
  #       storage_id: '{{dataio.storage_id}}'
  #     source: sap_s4hana
  #     namespace: transactional_data
  #     object_name: inob
  #     schema_version: v1

  # - kind: select
  #   name: select_sap_inob
  #   context_name: read_sap_inob
  #   params:
  #     columns:
  #       objek: objek_sap_inob
  #       cuobj: cuobj_sap_inob
  #       sap_cluster: sap_cluster
  #     distinct: true


  - kind: join
    name: join_sap
    context_name: select_sap_ausp
    params:
      # - other:
      #     select_sap_inob
      #   how:
      #     inner
      #   columns:
      #     objek_sap_ausp: cuobj_sap_inob
      #     sap_cluster: sap_cluster
      - other:
          select_sap_cabn
        how:
          inner
        columns:
          atinn_sap_ausp: atinn_sap_cabn
          sap_cluster: sap_cluster
      - other:
          select_sap_but000
        how:
          inner
        columns:
          objek_sap_ausp: partner_sap_but000
          sap_cluster: sap_cluster

  - kind: add
    name: add_mdg
    context_name: join_mdg
    params:
      - column: hash_mdg
        expression: md5(concat(
                    objek_mdg_inob, 
                    atnam_mdg_cabn, 
                    atwrt_mdg_ausp))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_sap
    context_name: join_sap
    params:
      - column: hash_sap
        expression: md5(concat(
                    objek_sap_ausp, 
                    atnam_sap_cabn, 
                    atwrt_sap_ausp))

  - kind: checkpoint
    name: checkpoint_sap
    context_name: add_sap

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_sap
        how:
          full
        columns:
          hash_mdg: hash_sap

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_sap) or hash_sap = ''

  - kind: join
    name: join_non_matching_sap
    context_name: checkpoint_sap
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_sap: hash_mdg

  - kind: filter
    name: filter_non_matching_sap
    context_name: join_non_matching_sap
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        objek_mdg_inob: partner_mdg
        atnam_mdg_cabn: marketing_attr_mdg
        atwrt_mdg_ausp: characteristic_mdg
        name_last_mdg_but000: name_last_mdg
        name_first_mdg_but000: name_first_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_sap
    context_name: filter_non_matching_sap
    params:
      columns:
        objek_sap_ausp: partner_sap
        atnam_sap_cabn: marketing_attr_sap
        atwrt_sap_ausp: characteristic_sap
        name_last_mdg_but000: name_last_sap
        name_first_mdg_but000: name_first_sap
        hash_sap: hash_sap
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_sap
    context_name: select_non_matching_sap

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01'

  - kind: select
    name: select_knvv
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        vkorg: vkorg
        kvgr4: kvgr4
        vtweg: vtweg
        spart: spart

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_sap
        how:
          full
        columns:
          partner_mdg: partner_sap
          marketing_attr_mdg: marketing_attr_sap

  - kind: join
    name: join_missing_from_mdg_pre_ob_filer
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_sap: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    context_name: join_missing_from_mdg_pre_ob_filer
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700)

  - kind: join
    name: join_missing_from_sap_pre_ob_filer
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_sap
    context_name: join_missing_from_sap_pre_ob_filer
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700)

## data missing from mdg
  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_sap, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''MARKETING ATTRIBUTES'''
      - column: src_system
        expression: '''sap'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from sap

  - kind: filter
    name: filter_missing_from_sap
    context_name: join_missing_from_sap
    params:
      - condition:
          isnull(partner_sap)

  - kind: add
    name: add_missing_from_sap
    context_name: filter_missing_from_sap
    params:
      - column: msg
        expression: if(isnull(partner_sap), 'data missing from sap', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''MARKETING ATTRIBUTES'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''sap'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_sap
    params:
      - condition:
          partner_sap = partner_mdg
          and marketing_attr_sap = marketing_attr_mdg
          and characteristic_sap <> characteristic_mdg

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg
        expression: if(partner_sap = partner_mdg 
                    and marketing_attr_sap = marketing_attr_mdg
                    and characteristic_sap <> characteristic_mdg, 'attributes are mismatching', '-')
      - column: attr_name
        expression: if(partner_sap = partner_mdg 
                    and marketing_attr_sap = marketing_attr_mdg
                    and characteristic_sap <> characteristic_mdg, concat('MARKETING ATTRIBUTE:', ' ', marketing_attr_mdg, ' characteristic'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
