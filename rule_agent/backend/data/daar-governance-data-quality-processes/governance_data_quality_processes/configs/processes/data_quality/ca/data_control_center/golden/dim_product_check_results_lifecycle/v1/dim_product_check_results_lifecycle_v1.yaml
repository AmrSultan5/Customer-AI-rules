  - name: df_checks_history
    kind: governance_data_quality_processes.operations.data_control_center.create_product_history.create_product_history.CreateProductHistoryOperation

  - kind: write_dataio
    name: write_dim_product_check_results_lifecycle
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
