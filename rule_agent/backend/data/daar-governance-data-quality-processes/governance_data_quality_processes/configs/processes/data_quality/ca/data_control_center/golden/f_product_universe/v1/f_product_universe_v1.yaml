        country_code: country_code
        prod_class_id: prod_class_id
        material_code: material_code
      distinct: true


  - kind: select
    name: select_product_universe
    params:
      columns:
        country_code: country_code
        material_code: material_code
      distinct: true


  - kind: group
    name: group_product_universe_prod_class_id
    context_name: select_product_universe_prod_class_id
    params:
      - aggs:
          material_code: count
        by:
        - prod_class_id
        - country_code

  - kind: add
    name: add_prod_class_id
    context_name: select_product_universe
    params:
      - column: prod_class_id
        expression: '''-1'''

  - kind: group
    name: group_product_universe
    context_name: add_prod_class_id
    params:
      - aggs:
          material_code: count
        by:
        - country_code
        - prod_class_id

  - kind: union
    name: union_count
    context_name: group_product_universe_prod_class_id
    params:
      allow_missing: false
      by_name: true
      other: group_product_universe

  - kind: select
    name: select_count
    context_name: union_count
    params:
      columns:
        country_code: country_code
        prod_class_id: prod_class_id
