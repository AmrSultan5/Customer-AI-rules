transform:
  name: correspondence_address_mdg_d365
  operations:

  # Read MDG but000 data
  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  # Filter MDG but000 data
  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  # Select required columns from MDG but000
  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg
      distinct: true

  # Read MDG but020 data
  - kind: read_dataio
    name: read_mdg_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but020
      schema_version: v1

  # Select required columns from MDG but020
  - kind: select
    name: select_mdg_but020
    context_name: read_mdg_but020
    params:
      columns:
        partner: partner_mdg_but020
        addrnumber: addrnumber_mdg
      distinct: true

  # Read MDG adrc data
  - kind: read_dataio
    name: read_mdg_adrc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adrc
      schema_version: v1

  # Filter MDG adrc data
  - kind: filter
    name: filter_mdg_adrc
    context_name: read_mdg_adrc
    params:
      - condition:
          nation = '' and (adrc_uuid <> '' and isnotnull(adrc_uuid))

  # Select and clean MDG adrc data
  - kind: select
    name: select_mdg_adrc_regex
    context_name: filter_mdg_adrc
    params:
      columns:
        addrnumber: addrnumber_mdg
        STR_SUPPL1: STR_SUPPL1_mdg_temp
        STR_SUPPL2: STR_SUPPL2_mdg_temp
        name1: NAME_CO_mdg_temp
      distinct: true

  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    context_name: read_mdg_knvv
    params:
      - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

  - kind: select
    name: select_mdg_knvv_checkpoint
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        kvgr4: kvgr4
        vkorg: vkorg
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: checkpoint
    name: select_knvv
    context_name: select_mdg_knvv_checkpoint


  # Join MDG tables
  - kind: join
    name: join_mdg
    context_name: select_mdg_but000
    params:
      - other: select_mdg_but020
        how: inner
        columns:
          partner_mdg: partner_mdg_but020
      - other: select_knvv
        how: inner
        columns:
          partner_mdg: kunnr
      - other: select_mdg_adrc_regex
        how: left
        columns:
          addrnumber_mdg: addrnumber_mdg


  # Compute MDG hash
  - kind: add
    name: mdg
    context_name: join_mdg
    params:
      - column: STR_SUPPL1_mdg
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(STR_SUPPL1_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: STR_SUPPL2_mdg                    
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(STR_SUPPL2_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: NAME_CO_mdg                
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(NAME_CO_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: hash_mdg
        expression: md5(concat(
            regexp_replace(regexp_replace(partner_mdg, '\n', ''), '\r', ''),
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(STR_SUPPL1_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(STR_SUPPL2_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(NAME_CO_mdg_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))

  - kind: select
    name: mdg_temp
    context_name: mdg
    params:
      columns:
        partner_mdg: partner_mdg
        STR_SUPPL1_mdg: STR_SUPPL1_mdg
        STR_SUPPL2_mdg: STR_SUPPL2_mdg
        NAME_CO_mdg: NAME_CO_mdg
        hash_mdg: hash_mdg
      distinct: true
      
      
  - kind: checkpoint
    name: checkpoint_mdg
    context_name: mdg_temp
    

  # Read D365 account data
  - kind: read_dataio
    name: read_d365_account
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: account
      schema_version: v1

  # Filter D365 account data
  - kind: filter
    name: filter_d365_account
    context_name: read_d365_account
    params:
      - condition:
          cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  # Select required columns from D365 account
  - kind: select
    name: select_d365_account
    context_name: filter_d365_account
    params:
      columns:
        cch_sapid: partner_d365
        cch_address3_line1: cch_address3_line1_temp
        cch_address3_line2: cch_address3_line2_temp
        cch_companyname: cch_address3_name_temp
        cch_distributionchannel: cch_distributionchannel
        cch_division: cch_division
        cch_salesorganizationid: cch_salesorganizationid
      distinct: true


  - kind: add
    name: add_d365_account
    context_name: select_d365_account
    params:
      - column: cch_address3_line1
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_line1_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: cch_address3_line2
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_line2_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: cch_address3_name
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_name_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')

  # Compute D365 hash
  - kind: add
    name: d365
    context_name: add_d365_account
    params:
      - column: hash_d365
        expression: md5(concat(partner_d365,
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_line1_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_line2_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),
            coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(cch_address3_name_temp,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))


#################################################################################
  - kind: read_dataio
    name: read_cch_optionsetmapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_optionsetmapping
      schema_version: v1
  
  
#####################################################
  
  - kind: filter
    name: filter_cch_optionsetmapping_cd
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
  
  - kind: select
    name: union_cte_division
    context_name: filter_cch_optionsetmapping_cd
    params:
      columns:
        cch_optionsetvalue: cd_cch_optionsetvalue
        cch_externalvalue: cd_cch_externalvalue
      distinct: true
  
#####################################################
## distributionchannel
  - kind: filter
    name: filter_cch_optionsetmapping_dc
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
  
  - kind: select
    name: union_cte_distributionchannel
    context_name: filter_cch_optionsetmapping_dc
    params:
      columns:
        cch_optionsetvalue: dc_cch_optionsetvalue
        cch_externalvalue: dc_cch_externalvalue
      distinct: true

###########################

  - kind: read_dataio
    name: read_d365_territory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: territory
      schema_version: v1
  
  - kind: filter
    name: filter_territory
    context_name: read_d365_territory
    params:
      - condition: 1 = 1
  
  - kind: select
    name: select_d365_territory
    context_name: filter_territory
    params:
      columns:
        cch_sapid: territory_cch_sapid
        id: territory_id
      distinct: true        

###########################
  - kind: join
    name: join_d365
    context_name: d365
    params:
      - other:
          union_cte_distributionchannel
        how:
          inner
        columns:
          cch_distributionchannel: dc_cch_optionsetvalue
      - other:
          union_cte_division
        how:
          inner
        columns:
          cch_division: cd_cch_optionsetvalue
      - other:
          select_d365_territory
        how:
          left
        columns:
          cch_salesorganizationid: territory_id

  - kind: filter
    name: filter_d365
    context_name: join_d365
    params:
      - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600) 



  - kind: select
    name: d365_temp
    context_name: filter_d365
    params:
      columns:
        partner_d365: partner_d365
        cch_address3_line1: cch_address3_line1_d365
        cch_address3_line2: cch_address3_line2_d365
        cch_address3_name: cch_address3_name_d365
        hash_d365: hash_d365
      distinct: true

  - kind: checkpoint
    name: checkpoint_d365
    context_name: d365_temp
    

  # Identify non-matching MDG records
  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other: checkpoint_d365
        how: full
        columns:
          hash_mdg: hash_d365

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_d365) or hash_d365 = ''

  # Identify non-matching D365 records
  - kind: join
    name: join_non_matching_d365
    context_name: checkpoint_d365
    params:
      - other: checkpoint_mdg
        how: full
        columns:
          hash_d365: hash_mdg

  - kind: filter
    name: filter_non_matching_d365
    context_name: join_non_matching_d365
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  # Select non-matching MDG records
  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
    params:
      columns:
        partner_mdg: partner_mdg
        STR_SUPPL1_mdg: STR_SUPPL1_mdg
        STR_SUPPL2_mdg: STR_SUPPL2_mdg
        NAME_CO_mdg: NAME_CO_mdg
        hash_mdg: hash_mdg
      distinct: true

  # Select non-matching D365 records
  - kind: select
    name: select_non_matching_d365
    context_name: filter_non_matching_d365
    params:
    params:
      columns:
        partner_d365: partner_d365
        cch_address3_line1_d365: cch_address3_line1_d365
        cch_address3_line2_d365: cch_address3_line2_d365
        cch_address3_name_d365: cch_address3_name_d365
        hash_d365: hash_d365
      distinct: true



  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_d365
    context_name: select_non_matching_d365

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true







  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_d365
        how:
          full
        columns:
          partner_mdg: partner_d365


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_d365: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: join
    name: join_missing_from_d365
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_d365
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_d365, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''CORRESPONDENCE ADDRESS'''
      - column: src_system
        expression: '''d365'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()


## data missing from d365

  - kind: filter
    name: filter_missing_from_d365
    context_name: join_missing_from_d365
    params:
      - condition:
          isnull(partner_d365)

  - kind: add
    name: add_missing_from_d365
    context_name: filter_missing_from_d365
    params:
      - column: msg
        expression: if(isnull(partner_d365), 'data missing from d365', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''CORRESPONDENCE ADDRESS'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''d365'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_d365
    params:
      - condition:
          partner_d365 = partner_mdg
          and (cch_address3_line1_d365 <> STR_SUPPL1_mdg
          or cch_address3_line2_d365 <> STR_SUPPL2_mdg
          or cch_address3_name_d365 <> NAME_CO_mdg)

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_STREET_2
        expression: if(partner_d365 = partner_mdg                     
                    and cch_address3_line1_d365 <> STR_SUPPL1_mdg, 'attributes are mismatching', '-')   
      - column: msg_STREET_3
        expression: if(partner_d365 = partner_mdg                     
                    and cch_address3_line2_d365 <> STR_SUPPL2_mdg, 'attributes are mismatching', '-')
      - column: msg_home_NAME_1
        expression: if(partner_d365 = partner_mdg                     
                    and cch_address3_name_d365 <> NAME_CO_mdg, 'attributes are mismatching', '-')
      - column: attr_name_STREET_2
        expression: if(partner_d365 = partner_mdg                    
