transform:
  name: dm_vendor_general
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_lfa1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: vendor
      object_name: lfa1

  - kind: filter
    name: filter_lfa1
    params:
      - condition:
          ( sperr <> 'X' OR sperm <> 'X' OR loevm <> 'X') AND ( nodel <> 'X' AND ktokk IN('4000', '9000', '2000', '3000', '7000') and land1 not in('RU','BY'))

  - kind: select
    name: select_lfa1
    params:
      columns:
        lifnr: lifnr
        land1: land1
        ktokk: ktokk
        erdat: erdat
        name1: name1
        name2: name2
        name3: name3
        name4: name4
        nodel: nodel
        adrnr: adrnr
        ort01: ort01
        ort02: ort02
        pstlz: pstlz
        stras: stras
        loevm: loevm
        sperm: sperm
        sperr: sperr
        werks: werks
        sperz: sperz
        werkr: werkr
        lzone: lzone
        j_1kftbus: j_1kftbus
        j_1kftind: j_1kftind
        brsch: brsch
        kunnr: kunnr
        stceg: stceg
        zzcorpv: zzcorpv
        lnrza: lnrza
        xcpdk: xcpdk
        ktock: ktock
        xzemp: xzemp
        emnfr: emnfr
        mcod1: mcod1
        zzadrsb: zzadrsb
        begru: begru
        fityp: fityp
        j_1kfrepre: j_1kfrepre
        stkzu: stkzu


  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000

  - kind: select
    name: select_but000
    params:
      columns:
        partner: partner
        bu_group: bu_group
        bpkind: bpkind
        type: type
        name_org1: name_org1
        name_org2: name_org2
        name_org3: name_org3
        name_org4: name_org4
        natpers: natpers
        name_first: name_first
        name_last: name_last
        augrp: augrp
        xblck: xblck
        xdele: xdele

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dfkkbptaxnum
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: dfkkbptaxnum

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t077y
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t077y

  - kind: filter
    name: filter_t077y
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_t077y
    params:
      columns:
        ktokk: ktokk
        txt30: txt30
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t016t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t016t

  - kind: filter
    name: filter_t016t
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_t016t
    params:
      columns:
        brsch: brsch
        brtxt: brtxt
      distinct: true


  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t001w
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t001w

  - kind: filter
    name: filter_t001w
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_t001w
    params:
      columns:
        werks: werks
        name1: t001w_name1
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t077k
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t077k

  - kind: select
    name: select_t077k
    params:
      columns:
        ktokk: t077k_ktokk
      distinct: true


  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t005
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t005

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_tzont
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: tzont

  - kind: filter
    name: filter_tzont
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_tzont
    params:
      columns:
        zone1: zone1
        land1: land1_tzont
        vtext: vtext
      distinct: true


  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_tb004t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: tb004t

  - kind: filter
    name: filter_tb004t
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_tb004t
    params:
      columns:
        bpkind: bpkind
        text40: tb004t_text40
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1

  - kind: select
    name: select_kna1
    params:
      columns:
        kunnr: kna1_kunnr
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_lfza
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: vendor
      object_name: lfza

  - kind: select
    name: select_lfza
    params:
      columns:
        lifnr: lifnr
        empfk: empfk
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_lfbw
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: vendor
      object_name: lfbw

  - kind: select
    name: select_lfbw
    params:
      columns:
        lifnr: lifnr
        witht: witht
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_t059u
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: t059u

  - kind: filter
    name: filter_t059u
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_t059u
    params:
      columns:
        witht: witht
        text40: t059u_text40
      distinct: true

  - kind: add
    name: add_but000_lfa_partner
    context_name: select_but000
    params:
      - column: but000_lfa_partner
        expression: if(partner like 'V%', replace(partner, substr(partner, 1, 3), rpad(substr(partner, 2, 2), 3, '0')), partner)

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dfkkbptaxnum
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: dfkkbptaxnum

  - kind: join
    name: join_lfa1_but000_t077y_t016t_t001w_t077k_kna1_lfza_lfbw_tzont_tb004t_t059u_dfkkbptaxnum_t005
    context_name: select_lfa1
    params:
      - other:
          add_but000_lfa_partner
        how:
          left
        columns:
          lifnr: but000_lfa_partner
      - other:
          select_t077k
        how:
          left
        columns:
          ktokk: t077k_ktokk
      - other:
          select_t016t
        how:
          left
        columns:
          brsch: brsch
      - other:
          select_t001w
        how:
          left
        columns:
          werks: werks
      - other:
          select_t077y
        how:
          left
        columns:
          ktokk: ktokk
      - other:
          select_kna1
        how:
          left
        columns:
          kunnr: kna1_kunnr
      - other:
          select_lfza
        how:
          left
        columns:
          lifnr: lifnr
      - other:
          select_lfbw
        how:
          left
        columns:
          lifnr: lifnr
      - other:
          select_tzont
        how:
          left
        columns:
          lzone: zone1
          land1: land1_tzont
      - other:
          select_tb004t
        how:
          left
        columns:
          bpkind: bpkind
      - other:
          select_t059u
        how:
          left
        columns:
          witht: witht

  - kind: add
    name: add_expressions
    params:
      - column: is_business_partner_grouping_allowed
        expression: IF(isnull(t077k_ktokk), '0', '1')
      - column: is_vendor_also_customer
        expression: IF(ktokk in('9000') and not isnotnull(kna1_kunnr), '1', IF(ktokk in('9000') and isnull(kna1_kunnr), '0', ''))
      - column: bu_group
        expression: if(bu_group is null or bu_group = '', 'Z_NOT_FOUND', bu_group)
        overwrite: true

  - kind: select
    name: select_dm_vendor_general
    params:
      columns:
        lifnr: vendor_code
        partner: partner_code
        land1: country_of_origin
        ktokk: vendor_account_group_code
        txt30: vendor_account_group_name
        bu_group: business_partner_grouping
        is_business_partner_grouping_allowed: is_business_partner_grouping_allowed
        erdat: created_date
        type: vendor_category
        name_org1: vendor_org_name1
        name_org2: vendor_org_name2
        name_org3: vendor_org_name3
        name_org4: vendor_org_name4
        natpers: vendor_natural_person_flag
        name1: vendor_name1
        name2: vendor_name2
        name3: vendor_name3
        name4: vendor_name4
        name_first: vendor_person_first_name
        name_last: vendor_person_last_name
        nodel: deletion_block
        adrnr: vendor_address_code
        ort01: city
        ort02: district
        pstlz: postal_code
        stras: street_house_number
        loevm: deletion_central_flag
        sperm: imposed_purchasing_block
        sperr: central_posting_block
        sperz: payment_block
        werkr: plant_level_relevant_ind
        lzone: goods_transportation_zone_code
        vtext: goods_transportation_zone_description
        j_1kftbus: type_of_business
        j_1kftind: type_of_industry
        kunnr: customer_code
        is_vendor_also_customer: is_vendor_also_customer
        stceg: vat_registration_number
        zzcorpv: corporate_vendor_code
        lnrza: alternative_payee_account_number
        ktock: account_group_for_one_time_account
        xzemp: alternative_payee_allowed_ind
        emnfr: external_manufacturer_code
        empfk: vendor_permitted_as_payee
        witht: withholding_tax_recipient_type
        mcod1: search_term
        zzadrsb: addressability_flag
        begru: authorization_group_vendor_level
        fityp: tax_type
        j_1kfrepre: representative_name
        stkzu: liable_for_vat_flag
        augrp: authorization_group_bp_level
        xblck: central_block_bp_flag
        xdele: archiving_flag_bp
      distinct: true

#business_partner_grouping deduplication
  - kind: group
    name: group_business_partner_grouping_min
    context_name: select_dm_vendor_general
    params:
      - aggs:
          business_partner_grouping: min
        by:
        - vendor_code

  - kind: join
    name: join_business_partner_grouping_min
    context_name: select_dm_vendor_general
    params:
      - other:
          group_business_partner_grouping_min
        how:
          inner
        columns:
          vendor_code: vendor_code
          business_partner_grouping: min_business_partner_grouping

#withholding_tax_type_code and vendor_permitted_as_payee deduplication
  - kind: group
    name: group_withholding_tax_vendor_permitted_concat
    context_name: join_business_partner_grouping_min
    params:
      - aggs:
          withholding_tax_recipient_type: collect_set
          vendor_permitted_as_payee: collect_set
        by:
        - vendor_code

  - kind: add
    name: add_withholding_tax_vendor_permitted_concat
    context_name: group_withholding_tax_vendor_permitted_concat
    params:
      - column: collect_set_withholding_tax_recipient_type_concat
        expression: concat_ws(',', sort_array(collect_set_withholding_tax_recipient_type))
      - column: collect_set_vendor_permitted_as_payee_concat
        expression: concat_ws(',', sort_array(collect_set_vendor_permitted_as_payee))

  - kind: join
    name: join_withholding_tax_vendor_permitted_concat
    context_name: join_business_partner_grouping_min
    params:
      - other:
          add_withholding_tax_vendor_permitted_concat
        how:
          inner
        columns:
          vendor_code: vendor_code

  - kind: add
    name: add_bu_group_update
    context_name: join_withholding_tax_vendor_permitted_concat
    params:
      - column: business_partner_grouping
        expression: if(business_partner_grouping = 'Z_NOT_FOUND', 'NOT_FOUND', business_partner_grouping)
        overwrite: true
      - column: created_date
        expression: TO_TIMESTAMP(created_date, 'yyyyMMdd')
        overwrite: true

  - kind: select
    name: select_dm_vendor_general_final
    params:
      columns:
        vendor_code: vendor_code
        partner_code: partner_code
        country_of_origin: country_of_origin
        vendor_account_group_code: vendor_account_group_code
        vendor_account_group_name: vendor_account_group_name
        business_partner_grouping: business_partner_grouping
        is_business_partner_grouping_allowed: is_business_partner_grouping_allowed
        created_date: created_date
        vendor_category: vendor_category
        vendor_org_name1: vendor_org_name1
        vendor_org_name2: vendor_org_name2
        vendor_org_name3: vendor_org_name3
        vendor_org_name4: vendor_org_name4
        vendor_natural_person_flag: vendor_natural_person_flag
        vendor_name1: vendor_name1
        vendor_name2: vendor_name2
        vendor_name3: vendor_name3
        vendor_name4: vendor_name4
        vendor_person_first_name: vendor_person_first_name
        vendor_person_last_name: vendor_person_last_name
        deletion_block: deletion_block
        vendor_address_code: vendor_address_code
        city: city
        district: district
        postal_code: postal_code
        street_house_number: street_house_number
        deletion_central_flag: deletion_central_flag
        imposed_purchasing_block: imposed_purchasing_block
        central_posting_block: central_posting_block
        payment_block: payment_block
        plant_level_relevant_ind: plant_level_relevant_ind
        goods_transportation_zone_code: goods_transportation_zone_code
        goods_transportation_zone_description: goods_transportation_zone_description
        type_of_business: type_of_business
        type_of_industry: type_of_industry
        customer_code: customer_code
        is_vendor_also_customer: is_vendor_also_customer
        vat_registration_number: vat_registration_number
        corporate_vendor_code: corporate_vendor_code
        alternative_payee_account_number: alternative_payee_account_number
        account_group_for_one_time_account: account_group_for_one_time_account
        alternative_payee_allowed_ind: alternative_payee_allowed_ind
        external_manufacturer_code: external_manufacturer_code
        collect_set_vendor_permitted_as_payee_concat: vendor_permitted_as_payee
        collect_set_withholding_tax_recipient_type_concat: withholding_tax_recipient_type
        search_term: search_term
        addressability_flag: addressability_flag
        authorization_group_vendor_level: authorization_group_vendor_level
        tax_type: tax_type
        representative_name: representative_name
        liable_for_vat_flag: liable_for_vat_flag
        authorization_group_bp_level: authorization_group_bp_level
        central_block_bp_flag: central_block_bp_flag
        archiving_flag_bp: archiving_flag_bp
      distinct: true

  - kind: write_dataio
    name: write_dm_vendor_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_general
      process_run_id: '{{process_run_id}}'
      schema_version: v5
      refresh_mode: full