transform:
  name: customer_address_completeness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#READ dm_customer_address_v2
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address

  - kind: select
    context_name: read_dm_customer_address
    name: select_dca
    params:
      columns:
        customer_code: customer_code
        street_1_name: street_1_name
        street_2_name: street_2_name
        street_3_name: street_3_name
        street_4_name: street_4_name
        street_5_name: street_5_name
        house_number: house_number
        post_code: post_code
        city: city
        country_code: country_code
        region_code: region_code
        district: district
        city_billing: city_billing 
        sap_cluster: sap_cluster
      distinct: true

#READ dm_customer_address_contact_v1
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address_contact
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_contact
  
  - kind: filter
    context_name: read_dm_customer_address_contact
    name: filter_dcac
    params:
      - condition:
          contact_medium_type = 'fixed_tel_number' and source = 's4'

  - kind: select
    context_name: filter_dcac
    name: select_dcac
    params:
      columns:
        customer_code: customer_code
        contact_medium_type: contact_medium_type
        country_code: country_code
        source: source
        sap_cluster: sap_cluster
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: select
    context_name: read_dm_customer_general
    name: select_dcg
    params:
      columns:
        customer_code: customer_code
        longitude: longitude
        latitude: latitude
        account_group_code: account_group_code
        sap_cluster: sap_cluster
      distinct: true

#JOIN dcg and dca
  - kind: join
    name: join_dca_dcg
    context_name: select_dca
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#JOIN dcg and dcac
  - kind: join
    name: join_dcac_dcg
    context_name: select_dcac
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#SELECT rccomp_18_1
  - kind: select
    name: select_rccomp_18_1
    context_name: join_dca_dcg
    params:
      columns:
        customer_code: customer_code
        street_1_name: street_1_name
      distinct: true

  - kind: add
    name: add_rccomp_18_1
    context_name: select_rccomp_18_1
    params:
      - column: rule_code
        expression: "'RCCOMP_18.1'"
      - column: check_status
        expression: "CASE WHEN street_1_name is null OR street_1_name ='' THEN '0' ELSE '1' END"      

  - kind: select
    name: select_rccomp_18_1_final
    context_name: add_rccomp_18_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        street_1_name: value_checked
      distinct: true

