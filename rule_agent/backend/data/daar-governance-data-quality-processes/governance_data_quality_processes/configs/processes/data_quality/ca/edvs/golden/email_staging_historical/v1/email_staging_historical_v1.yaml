transform:
  name: edvs_phone_staging_historical
  operations:
  
  - kind: read_local
    name: read_edvs_email_staging_historical
    params:
      format: csv
      location: /mnt/datalake_idq/raw/edvs/historical_data/email_staging/email_staging.csv
      options:
        header: true

  - kind: write_dataio
    name: write_edvs_email_staging_historical
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: edvs
      namespace: golden
      object_name: email_staging
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full