        expression: if ( trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))  = trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))) and  trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))  = trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_sap, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))) and trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))  = trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(attribute8_crm, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))) , 'yes', 'no')
      - column: partner_guid
        expression: upper(substr(primary_key_l1_d365,12,length(primary_key_l1_d365)))
      - column: mdg_value
        expression: coalesce(concat(attribute8_mdg),'')
      - column: sap_value
        expression: coalesce(concat(attribute8_sap),'')
      - column: d365_value
        expression: coalesce(concat(attribute8_d365),'')
      - column: crm_value
        expression: coalesce(concat(attribute8_crm),'')
      - column: createdon
        expression: substr(attribute3_d365,0,10)
      - column: sla
        expression: substr(attribute4_d365,0,10)
      - column: completionon
        expression: substr(attribute10_d365,0,10)
      - column: partner
        expression: substr(primary_key_l1_d365,0,10)

