transform:
  name: dm_customer_address_ext_osm_reverse
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address_ext_osm
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm

  - kind: filter
    name: filter_dm_customer_general
    context_name: read_dm_customer_general
    params:
      - condition:
          country_code = '{{ country_filter }}'

  - kind: select
    name: select_dm_customer_general
    context_name: filter_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    context_name: read_dm_customer_address
    name: select_dm_customer_address
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        latitude: sap_latitude
        longitude: sap_longitude
        country_code: sap_country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm
    context_name: read_dm_customer_address_ext_osm
    params:
      - condition:
          sap_country_code = '{{ country_filter }}'

  - kind: select
    context_name: filter_dm_customer_address_ext_osm
    name: select_dm_customer_address_ext_osm
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_latitude: sap_latitude
        sap_longitude: sap_longitude
        sap_country_code: sap_country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dm_customer_address_ext_osm_reverse
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_address
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_address_ext_osm
        how:
          anti
        columns:
          customer_code: customer_code
          address_number: address_number
          sap_latitude: sap_latitude
          sap_longitude: sap_longitude
          sap_country_code: sap_country_code       
          sap_cluster: sap_cluster

  - kind: select
    name: select_distinct_geocodes
    context_name: join_dm_customer_address_ext_osm_reverse
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_cluster: sap_cluster
        sap_latitude: sap_latitude
        sap_longitude: sap_longitude
        sap_country_code: sap_country_code
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm_reverse
    context_name: select_distinct_geocodes
    params:
      - condition:
          isnotnull(sap_latitude) and sap_latitude <> 0 
          and isnotnull(sap_longitude) and sap_longitude <> 0
          and sap_country_code = '{{ country_filter }}'

  - kind: governance_data_quality_processes.custom_operations.geopy.geolocator_reverse.GeolocatorReverseOperation
    name: geolocator_reverse
    context_name: filter_dm_customer_address_ext_osm_reverse
    config_kind: governance_data_quality_processes.custom_operation_configs.geopy.geolocator_reverse_config.GeolocatorReverseOperationConfig
    params:
      lat: sap_latitude
      lon: sap_longitude
      country_code: sap_country_code
      country_filter: '{{ country_filter }}'

  - kind: add
    name: add_country_code_out
    context_name: geolocator_reverse
    params:
      - column: country_code_out
        expression: if(country_code = 'xk', 'kv', country_code)

  - kind: select
    name: select_dm_customer_address_ext_osm_reverse
    context_name: add_country_code_out
    params:
      columns:
        customer_code: customer_code
        address_number: address_number
        sap_cluster: sap_cluster
        country_code_out: country_code
        postcode: postcode
        city: city
        road: road
        street: street
        house_number: house_number
        house_name: house_name
        type: type
        display_name: display_name
        addresstype: adresstype
        place_id: place_id
        osm_id: osm_id
        importance_api_reverse: importance_api_reverse
        state_district: state_district
        county: county
        municipality: municipality
        village: village
        town: town
        region: region
        district: district
        suburb: suburb
        state: state
        sap_latitude: sap_latitude
        sap_longitude: sap_longitude
        sap_country_code: sap_country_code
        api_reverse_result_status: api_reverse_result_status
      distinct: true

  - kind: add
    name: add_execution_date
    context_name: select_dm_customer_address_ext_osm_reverse
    params:
      - column: execution_date
        expression: cast(current_date() as date)

  - kind: write_dataio
    name: write_dm_customer_address_ext_osm
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm_reverse
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: '{{ refresh_mode }}'