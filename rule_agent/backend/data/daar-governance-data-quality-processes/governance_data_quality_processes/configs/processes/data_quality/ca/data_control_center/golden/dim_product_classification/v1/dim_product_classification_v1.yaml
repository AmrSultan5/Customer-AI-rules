        bpp_code: bpp_code
        bpp_name: bpp_name
        bpp_package_code: bpp_package_code
        bpp_package_name: bpp_package_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dim_product_classification_expression
    params:
      - column: prod_class_id
        expression: MD5(
                    ifnull(flavour_code, 'null') ||
                    ifnull(material_group_code, 'null') ||
                    ifnull(material_type_code, 'null') ||
                    ifnull(pack_size_code, 'null') ||
                    ifnull(pack_type_code, 'null') ||
                    ifnull(product_hierarchy_code, 'null') ||
                    ifnull(product_hierarchy_l1_code, 'null') ||
                    ifnull(product_hierarchy_l2_code, 'null') ||
                    ifnull(product_hierarchy_l3_code, 'null') ||
                    ifnull(product_hierarchy_l4_code, 'null') ||
                    ifnull(product_hierarchy_l5_code, 'null') ||
                    ifnull(sales_unit_code, 'null') ||
                    ifnull(brand_code, 'null') ||
                    ifnull(bpp_code, 'null') ||
                    ifnull(bpp_name, 'null') ||
                    ifnull(bpp_package_code, 'null') ||
                    ifnull(bpp_package_name, 'null')
                    )
      - column: flavour
        expression: flavour_code || ' - ' || flavour_name
      - column: material_group
        expression: material_group_code || ' - ' || material_group_name
      - column: material_type
        expression: material_type_code || ' - ' || material_type_name
      - column: pack_size
        expression: pack_size_code || ' - ' || pack_size_name
      - column: pack_type
        expression: pack_type_code || ' - ' || pack_type_name
      - column: product_hierarchy_l1
        expression: product_hierarchy_l1_code || ' - ' || product_hierarchy_l1_name
      - column: product_hierarchy_l2
        expression: product_hierarchy_l2_code || ' - ' || product_hierarchy_l2_name
      - column: product_hierarchy_l3
        expression: product_hierarchy_l3_code || ' - ' || product_hierarchy_l3_name
      - column: product_hierarchy_l4
        expression: product_hierarchy_l4_code || ' - ' || product_hierarchy_l4_name
      - column: product_hierarchy_l5
        expression: product_hierarchy_l5_code || ' - ' || product_hierarchy_l5_name
      - column: sales_unit
        expression: sales_unit_code || ' - ' || sales_unit_name
      - column: brand
        expression: brand_code || ' - ' || brand_name
      - column: bpp
        expression: bpp_code || ' - ' || bpp_name
      - column: bpp_package
        expression: bpp_package_code || ' - ' || bpp_package_name

  - kind: select
    name: select_dm_product_classification
