      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

  - kind: select
    name: select_dm_product_sales_organization
    params:
      columns:
        material_code: material_code
        flavour_code: flavour_code
        flavour_name: flavour_name
        pack_size_code: pack_size_code
        pack_size_name: pack_size_name
        pack_type_code: pack_type_code
        pack_type_name: pack_type_name
        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l1_code: product_hierarchy_l1_code
        product_hierarchy_l1_name: product_hierarchy_l1_name
        product_hierarchy_l2_code: product_hierarchy_l2_code
        product_hierarchy_l2_name: product_hierarchy_l2_name
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l3_name: product_hierarchy_l3_name
        product_hierarchy_l4_code: product_hierarchy_l4_code
        product_hierarchy_l4_name: product_hierarchy_l4_name
        product_hierarchy_l5_code: product_hierarchy_l5_code
        product_hierarchy_l5_name: product_hierarchy_l5_name
        sales_org_code: sales_org_code
        sales_org_name: sales_org_name
        sales_unit_code: sales_unit_code
        sales_unit_name: sales_unit_name
        brand_code: brand_code
        brand_name: brand_name
        distribution_channel_code: distribution_channel_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dm_product_general
    context_name: select_dm_product_sales_organization
    params:
      - other:
          select_dm_product_general
        how:
          inner
        columns:
          material_code: material_code_pg
          sap_cluster: sap_cluster_pg

  - kind: select
    name: select_dm_product_classification
    params:
      columns:
        flavour_code: flavour_code
        flavour_name: flavour_name
        material_group_code: material_group_code
        material_group_name: material_group_name
        material_type_code: material_type_code
        material_type_name: material_type_name
        pack_size_code: pack_size_code
        pack_size_name: pack_size_name
        pack_type_code: pack_type_code
        pack_type_name: pack_type_name
        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l1_code: product_hierarchy_l1_code
        product_hierarchy_l1_name: product_hierarchy_l1_name
        product_hierarchy_l2_code: product_hierarchy_l2_code
        product_hierarchy_l2_name: product_hierarchy_l2_name
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l3_name: product_hierarchy_l3_name
