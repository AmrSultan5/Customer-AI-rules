transform:
  name: Business_hours_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          partner_guid: partner_guid_mdg_but000
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_mdg_frg0061
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: crmm_but_frg0061
        schema_version: v1

    - kind: select
      name: select_mdg_frg0061
      context_name: read_mdg_frg0061
      params:
        columns:
          valid_from: valid_from_mdg_frg0061
          valid_to: valid_to_mdg_frg0061
          schedule_type: schedule_type_mdg_frg0061
          partner_guid: partner_guid_mdg_frg0061
          rule_id: rule_id_mdg_frg0061
        distinct: true

    - kind: read_dataio
      name: read_mdg_scrules
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: scrules
        schema_version: v1

    - kind: filter
      name: filter_mdg_scrules
      context_name: read_mdg_scrules
      params:
        - condition: type = 'W'

    - kind: select
      name: select_mdg_scrules
      context_name: filter_mdg_scrules
      params:
        columns:
          rule: rule_mdg_scrules
          rule_id: rule_id_mdg_scrules
        distinct: true


    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv
      context_name: read_mdg_knvv
      params:
        - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)
    
    - kind: select
      name: select_mdg_knvv_checkpoint
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_mdg_knvv_checkpoint

    - kind: join
      name: join_mdg
      context_name: select_mdg_but000
      params:
        - other:
            select_mdg_frg0061
          how:
            inner
          columns:
            partner_guid_mdg_but000: partner_guid_mdg_frg0061
        - other:
            select_mdg_scrules
          how:
            inner
          columns:
            rule_id_mdg_frg0061: rule_id_mdg_scrules
        - other:
            select_mdg_knvv
          how:
            inner
          columns:
            partner_mdg_but000: kunnr_knvv 

    - kind: filter
      name: filter_mdg
      context_name: join_mdg
      params:
        - condition: to_date(substr(valid_to_mdg_frg0061,0,8),'yyyyMMdd') = '9999-12-31' AND xpcpt_mdg_but000 <> 'X' AND  partner_mdg_but000 LIKE any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

    - kind: add
      name: add_mdg_columns
      context_name: filter_mdg
      params:
      - column: hash_mdg
        expression: md5(concat(partner_mdg_but000,partner_guid_mdg_but000,coalesce( to_date(substr(valid_from_mdg_frg0061,0,8),'yyyyMMdd') ,''),coalesce( to_date(substr(valid_to_mdg_frg0061,0,8),'yyyyMMdd') ,''),schedule_type_mdg_frg0061,cast(SUBSTR(rule_mdg_scrules,1,2) as int),IF(substr(rule_mdg_scrules,3,1)='X','true','false'),IF(substr(rule_mdg_scrules,4,1)='X','true','false'),IF(substr(rule_mdg_scrules,5,1)='X','true','false'),IF(substr(rule_mdg_scrules,6,1)='X','true','false'),IF(substr(rule_mdg_scrules,7,1)='X','true','false'),IF(substr(rule_mdg_scrules,8,1)='X','true','false'),IF(substr(rule_mdg_scrules,9,1)='X','true','false'),concat(substr(rule_mdg_scrules,10,2),':',substr(rule_mdg_scrules,12,2),':',substr(rule_mdg_scrules,14,2)),concat(substr(rule_mdg_scrules,16,2),':',substr(rule_mdg_scrules,18,2),':',substr(rule_mdg_scrules,20,2)),concat(substr(rule_mdg_scrules,22,2),':',substr(rule_mdg_scrules,24,2),':',substr(rule_mdg_scrules,26,2)),concat(substr(rule_mdg_scrules,28,2),':',substr(rule_mdg_scrules,30,2),':',substr(rule_mdg_scrules,32,2)),concat(substr(rule_mdg_scrules,34,2),':',substr(rule_mdg_scrules,36,2),':',substr(rule_mdg_scrules,38,2)),concat(substr(rule_mdg_scrules,40,2),':',substr(rule_mdg_scrules,42,2),':',substr(rule_mdg_scrules,44,2)),concat(substr(rule_mdg_scrules,46,2),':',substr(rule_mdg_scrules,48,2),':',substr(rule_mdg_scrules,50,2)),concat(substr(rule_mdg_scrules,52,2),':',substr(rule_mdg_scrules,54,2),':',substr(rule_mdg_scrules,56,2)),concat(substr(rule_mdg_scrules,58,2),':',substr(rule_mdg_scrules,60,2),':',substr(rule_mdg_scrules,62,2)),concat(substr(rule_mdg_scrules,64,2),':',substr(rule_mdg_scrules,66,2),':',substr(rule_mdg_scrules,68,2)),concat(substr(rule_mdg_scrules,70,2),':',substr(rule_mdg_scrules,72,2),':',substr(rule_mdg_scrules,74,2)),concat(substr(rule_mdg_scrules,76,2),':',substr(rule_mdg_scrules,78,2),':',substr(rule_mdg_scrules,80,2)),concat(substr(rule_mdg_scrules,82,2),':',substr(rule_mdg_scrules,84,2),':',substr(rule_mdg_scrules,86,2)),concat(substr(rule_mdg_scrules,88,2),':',substr(rule_mdg_scrules,90,2),':',substr(rule_mdg_scrules,92,2))))
      - column: valid_from_mdg
        expression: coalesce(to_date(substr(valid_from_mdg_frg0061,0,8),'yyyyMMdd'),'')
      - column: valid_to_mdg
        expression: coalesce(to_date(substr(valid_to_mdg_frg0061,0,8),'yyyyMMdd'),'')
      - column: frequency_mdg
        expression: cast(SUBSTR(rule_mdg_scrules,1,2) as int)
      - column: allowed_mon_mdg
        expression: IF(substr(rule_mdg_scrules,3,1)='X','true','false')
      - column: allowed_tue_mdg
        expression: IF(substr(rule_mdg_scrules,4,1)='X','true','false')
      - column: allowed_wed_mdg
        expression: IF(substr(rule_mdg_scrules,5,1)='X','true','false')
      - column: allowed_thu_mdg
        expression: IF(substr(rule_mdg_scrules,6,1)='X','true','false')
      - column: allowed_fri_mdg
        expression: IF(substr(rule_mdg_scrules,7,1)='X','true','false')
      - column: allowed_sat_mdg
        expression: IF(substr(rule_mdg_scrules,8,1)='X','true','false')
      - column: allowed_sun_mdg
        expression: IF(substr(rule_mdg_scrules,9,1)='X','true','false')
      - column: from_mon_mdg
        expression: concat(substr(rule_mdg_scrules,10,2),':',substr(rule_mdg_scrules,12,2),':',substr(rule_mdg_scrules,14,2))
      - column: from_tue_mdg
        expression: concat(substr(rule_mdg_scrules,16,2),':',substr(rule_mdg_scrules,18,2),':',substr(rule_mdg_scrules,20,2))
      - column: from_wed_mdg
        expression: concat(substr(rule_mdg_scrules,22,2),':',substr(rule_mdg_scrules,24,2),':',substr(rule_mdg_scrules,26,2))
      - column: from_thu_mdg
        expression: concat(substr(rule_mdg_scrules,28,2),':',substr(rule_mdg_scrules,30,2),':',substr(rule_mdg_scrules,32,2))
      - column: from_fri_mdg
        expression: concat(substr(rule_mdg_scrules,34,2),':',substr(rule_mdg_scrules,36,2),':',substr(rule_mdg_scrules,38,2))
      - column: from_sat_mdg
        expression: concat(substr(rule_mdg_scrules,40,2),':',substr(rule_mdg_scrules,42,2),':',substr(rule_mdg_scrules,44,2))
      - column: from_sun_mdg
        expression: concat(substr(rule_mdg_scrules,46,2),':',substr(rule_mdg_scrules,48,2),':',substr(rule_mdg_scrules,50,2))
      - column: to_mon_mdg
        expression: concat(substr(rule_mdg_scrules,52,2),':',substr(rule_mdg_scrules,54,2),':',substr(rule_mdg_scrules,56,2))
      - column: to_tue_mdg
        expression: concat(substr(rule_mdg_scrules,58,2),':',substr(rule_mdg_scrules,60,2),':',substr(rule_mdg_scrules,62,2))
      - column: to_wed_mdg
        expression: concat(substr(rule_mdg_scrules,64,2),':',substr(rule_mdg_scrules,66,2),':',substr(rule_mdg_scrules,68,2))
      - column: to_thu_mdg
        expression: concat(substr(rule_mdg_scrules,70,2),':',substr(rule_mdg_scrules,72,2),':',substr(rule_mdg_scrules,74,2))
      - column: to_fri_mdg
        expression: concat(substr(rule_mdg_scrules,76,2),':',substr(rule_mdg_scrules,78,2),':',substr(rule_mdg_scrules,80,2))
      - column: to_sat_mdg
        expression: concat(substr(rule_mdg_scrules,82,2),':',substr(rule_mdg_scrules,84,2),':',substr(rule_mdg_scrules,86,2))
      - column: to_sun_mdg
        expression: concat(substr(rule_mdg_scrules,88,2),':',substr(rule_mdg_scrules,90,2),':',substr(rule_mdg_scrules,92,2))

    - kind: select
      name: mdg_checkpoint
      context_name: add_mdg_columns
      params:
        columns:
          partner_mdg_but000: partner_mdg
          partner_guid_mdg_but000: partner_guid_mdg
          valid_from_mdg: valid_from_mdg
          valid_to_mdg: valid_to_mdg
          schedule_type_mdg_frg0061: rule_type_mdg
          frequency_mdg: frequency_mdg
          allowed_mon_mdg: allowed_mon_mdg
          allowed_tue_mdg: allowed_tue_mdg
          allowed_wed_mdg: allowed_wed_mdg
          allowed_thu_mdg: allowed_thu_mdg
          allowed_fri_mdg: allowed_fri_mdg
          allowed_sat_mdg: allowed_sat_mdg
          allowed_sun_mdg: allowed_sun_mdg
          from_mon_mdg: from_mon_mdg
          from_tue_mdg: from_tue_mdg
          from_wed_mdg: from_wed_mdg
          from_thu_mdg: from_thu_mdg
          from_fri_mdg: from_fri_mdg
          from_sat_mdg: from_sat_mdg
          from_sun_mdg: from_sun_mdg
          to_mon_mdg: to_mon_mdg
          to_tue_mdg: to_tue_mdg
          to_wed_mdg: to_wed_mdg
          to_thu_mdg: to_thu_mdg
          to_fri_mdg: to_fri_mdg
          to_sat_mdg: to_sat_mdg
          to_sun_mdg: to_sun_mdg
          hash_mdg: hash_mdg
        distinct: true



    - kind: checkpoint
      name: mdg
      context_name: mdg_checkpoint

###################################################

    - kind: read_dataio
      name: read_d365_cch_businesshour
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_businesshour
        schema_version: v1

    - kind: read_dataio
      name: read_d365_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1

    - kind: filter
      name: filter_d365_cch_optionsetmapping
      context_name: read_d365_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'cch_businesshour' and cch_attributename='cch_typeofbusinesshours' and cch_externalvalue <> 'Goods Receiving Hours'

    - kind: select
      name: select_d365_cch_optionsetmapping
      context_name: filter_d365_cch_optionsetmapping
      params:
        columns:
          cch_optionsetvalue: bh_cch_optionsetvalue
          cch_externalvalue: bh_cch_externalvalue

    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1

    - kind: select
      name: select_d365_account
      context_name: read_d365_account
      params:
        columns:
          id: id_d365_account
          cch_sapid: cch_sapid
          cch_sapcrmguid: cch_sapcrmguid
          cch_salesorganizationid: cch_salesorganizationid
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division

############################################################

    - kind: read_dataio
      name: read_d365_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1
      
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_d365_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true


    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1

    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true    
#   ###################################################
#    distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_d365_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true

    - kind: join
      name: join_d365
      context_name: read_d365_cch_businesshour
      params:
        - other:
            select_d365_cch_optionsetmapping
          how:
            inner
          columns:
            cch_typeofbusinesshours: bh_cch_optionsetvalue
        - other:
            select_d365_account
          how:
            inner
          columns:
            cch_accountid: id_d365_account
        - other:
            union_cte_distributionchannel
          how:
            inner
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            inner
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id


    - kind: filter
      name: filter_d365
      context_name: join_d365
      params:
        - condition: statecode=0 and  to_date(substr(cch_enddate,0,10),'yyyy-MM-dd') = '9999-12-31' and  cch_sapid LIKE any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%',  '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01'  and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600) 

    - kind: add
      name: add_d365_columns
      context_name: filter_d365
      params:
      - column: hash_d365
        expression: md5(concat(cch_sapid,upper(regexp_replace(cch_sapcrmguid,'-','')),to_date(substr(cch_startdate,0,10),'yyyy-MM-dd'),to_date(substr(cch_enddate,0,10),'yyyy-MM-dd'),bh_cch_externalvalue,cch_frequencyofbusinesshours_opt,cch_Monday,cch_Tuesday,cch_Wednesday,cch_Thursday,cch_Friday,cch_Saturday,cch_Sunday,cch_mondaystarthours,cch_tuesdaystarthours,cch_wednesdaystarthours,cch_thursdaystarthours,cch_fridaystarthours,cch_saturdaystarthours,cch_sundaystarthours,cch_mondayendhours,cch_tuesdayendhours,cch_wednesdayendhours,cch_thursdayendhours,cch_fridayendhours,cch_saturdayendhours,cch_sundayendhours))
      - column: partner_guid_d365
        expression: upper(regexp_replace(cch_sapcrmguid,'-',''))
      - column: valid_from_d365
        expression: to_date(substr(cch_startdate,0,10),'yyyy-MM-dd')
      - column: valid_to_d365
        expression: to_date(substr(cch_enddate,0,10),'yyyy-MM-dd')
      - column: frequency_d365
        expression: cast(cch_frequencyofbusinesshours_opt as bigint)

    - kind: select
      name: d365_checkpoint
      context_name: add_d365_columns
      params:
        columns:
          cch_sapid: partner_d365
          partner_guid_d365: partner_guid_d365
          valid_from_d365: valid_from_d365
          valid_to_d365: valid_to_d365
          bh_cch_externalvalue: rule_type_d365
          frequency_d365: frequency_d365
          cch_monday: allowed_mon_d365
          cch_tuesday: allowed_tue_d365
          cch_wednesday: allowed_wed_d365
          cch_thursday: allowed_thu_d365
          cch_friday: allowed_fri_d365
          cch_saturday: allowed_sat_d365
          cch_sunday: allowed_sun_d365
          cch_mondaystarthours: from_mon_d365
          cch_tuesdaystarthours: from_tue_d365
          cch_wednesdaystarthours: from_wed_d365
          cch_thursdaystarthours: from_thu_d365
          cch_fridaystarthours: from_fri_d365
          cch_saturdaystarthours: from_sat_d365
          cch_sundaystarthours: from_sun_d365
          cch_mondayendhours: to_mon_d365
          cch_tuesdayendhours: to_tue_d365
          cch_wednesdayendhours: to_wed_d365
          cch_thursdayendhours: to_thu_d365
          cch_fridayendhours: to_fri_d365
          cch_saturdayendhours: to_sat_d365
          cch_sundayendhours: to_sun_d365
          hash_d365: hash_d365
        distinct: true


    - kind: checkpoint
      name: d365
      context_name: d365_checkpoint


    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            hash_mdg: hash_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: hash_d365 is null or hash_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          partner_guid_mdg: partner_guid_mdg
          valid_from_mdg: valid_from_mdg
          valid_to_mdg: valid_to_mdg
          rule_type_mdg: rule_type_mdg
          frequency_mdg: frequency_mdg
          allowed_mon_mdg: allowed_mon_mdg
          allowed_tue_mdg: allowed_tue_mdg
          allowed_wed_mdg: allowed_wed_mdg
          allowed_thu_mdg: allowed_thu_mdg
          allowed_fri_mdg: allowed_fri_mdg
          allowed_sat_mdg: allowed_sat_mdg
          allowed_sun_mdg: allowed_sun_mdg
          from_mon_mdg: from_mon_mdg
          from_tue_mdg: from_tue_mdg
          from_wed_mdg: from_wed_mdg
          from_thu_mdg: from_thu_mdg
          from_fri_mdg: from_fri_mdg
          from_sat_mdg: from_sat_mdg
          from_sun_mdg: from_sun_mdg
          to_mon_mdg: to_mon_mdg
          to_tue_mdg: to_tue_mdg
          to_wed_mdg: to_wed_mdg
          to_thu_mdg: to_thu_mdg
          to_fri_mdg: to_fri_mdg
          to_sat_mdg: to_sat_mdg
          to_sun_mdg: to_sun_mdg
          hash_mdg: hash_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: hash_mdg is null or hash_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          partner_d365: partner_d365
          partner_guid_d365: partner_guid_d365
          valid_from_d365: valid_from_d365
          valid_to_d365: valid_to_d365
          rule_type_d365: rule_type_d365
          frequency_d365: frequency_d365
          allowed_mon_d365: allowed_mon_d365
          allowed_tue_d365: allowed_tue_d365
          allowed_wed_d365: allowed_wed_d365
          allowed_thu_d365: allowed_thu_d365
