transform:
  name: dm_product_country_trade_classification
  operations:

  - kind: read_dataio
    name: read_sapsll_maritc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: sapsll_maritc
      schema_version: v1

  - kind: cast
    name: cast_datbi
    params:
    - column: datbi
      to: date
      to_format: yyyyMMdd

  - kind: filter
    name: filter_sapsll_maritc_1
    params:
      - condition:
          datbi > current_timestamp()

  - kind: add
    name: add_sapsll_maritc
    params:
      - column: country_code
        expression: substr(stcts, 0, 2)

  - kind: filter
    name: filter_sapsll_maritc_2
    params:
      - condition:
          country_code NOT IN ('RU', 'BY')

  - kind: select
    name: select_sapsll_maritc
    params:
      columns:
        matnr: material_code
        country_code: country_code
        stcts: trade_classification
        ccngn: commodity_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_dm_product_country_trade_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_country_trade_classification
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full