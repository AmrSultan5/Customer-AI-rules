transform:
  name: finance_general_completeness
  operations:

  - kind: read_dataio
    name: read_dm_finance_general_ledger
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_general_ledger
      schema_version: v1


  - kind: read_dataio
    name: read_dm_finance_cost_element
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_cost_element
      schema_version: v1


  - kind: read_dataio
    name: read_dm_finance_controlling_area
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_controlling_area
      schema_version: v1

  - kind: select
    name: select_dfgl
    context_name: read_dm_finance_general_ledger
    params:
      columns:
        chart_of_accounts: chart_of_accounts_gl
        company_code: company_code_gl
        g_l_account_number: g_l_account_number
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dfce
    context_name: read_dm_finance_cost_element
    params:
      columns:
        controlling_area_code: controlling_area_code
        cost_element: cost_element
        cost_element_category: cost_element_category
        cost_element_subcategory: cost_element_subcategory
        is_cost_element_subcategory_allowed: is_cost_element_subcategory_allowed
        cost_element_attributes: cost_element_attributes
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dfca
    context_name: read_dm_finance_controlling_area
    params:
      columns:
        controlling_area_code: controlling_area_code_ca
        country_code: country_code
        company_code: company_code_ca
        chart_of_accounts: chart_of_accounts_ca
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dfgl_dfce_dfca
    context_name: select_dfce
    params:
      - other:
          select_dfca
        how:
          inner
        columns:
          controlling_area_code: controlling_area_code_ca
          sap_cluster: sap_cluster
      - other:
          select_dfgl
        how:
          inner
        columns:
          chart_of_accounts_ca: chart_of_accounts_gl
          company_code_ca: company_code_gl
          cost_element: g_l_account_number
          sap_cluster: sap_cluster  

#SELECT RPCONF_GL_28
  - kind: select
    name: select_RPCONF_GL_28
    context_name: join_dfgl_dfce_dfca
    params:
      columns:
        cost_element: cost_element
        g_l_account_number: g_l_account_number
        cost_element_subcategory: cost_element_subcategory
        is_cost_element_subcategory_allowed: is_cost_element_subcategory_allowed
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RPCONF_GL_28
    context_name: select_RPCONF_GL_28
    params:
      - column: rule_code
        expression: "'RPCONF_GL.28'"
      - column: check_status
        expression: "CASE WHEN (cost_element IS NULL OR cost_element = '') OR (g_l_account_number IS NULL OR g_l_account_number = '') THEN '' WHEN cost_element_subcategory IS NOT NULL AND cost_element_subcategory != '' AND is_cost_element_subcategory_allowed IS NOT NULL THEN '1' ELSE '0' END"
      - column: finance_value
        expression: g_l_account_number
      - column: attribute_name
        expression: '''General Ledger'''

  - kind: select
    name: select_RPCONF_GL_28_final
    context_name: add_RPCONF_GL_28
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        finance_value: finance_value
        attribute_name: attribute_name
        cost_element_subcategory: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

#SELECT RPCONF_GL_29
  - kind: select
    name: select_RPCONF_GL_29
    context_name: join_dfgl_dfce_dfca
    params:
      columns:
        cost_element: cost_element
        cost_element_attributes: cost_element_attributes
        g_l_account_number: g_l_account_number
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RPCONF_GL_29
    context_name: select_RPCONF_GL_29
    params:
      - column: rule_code
        expression: "'RPCONF_GL.29'"
      - column: check_status
        expression: "CASE WHEN (cost_element IS NULL OR cost_element = '') OR (g_l_account_number IS NULL OR g_l_account_number = '') THEN '' WHEN cost_element_attributes IS NOT NULL AND cost_element_attributes != '' THEN '1' ELSE '0' END"
      - column: finance_value
        expression: g_l_account_number
      - column: attribute_name
        expression: '''General Ledger'''

  - kind: select
    name: select_RPCONF_GL_29_final
    context_name: add_RPCONF_GL_29
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        finance_value: finance_value
        attribute_name: attribute_name
        cost_element_attributes: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: select_RPCONF_GL_28_final

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: select_RPCONF_GL_29_final

  - kind: add
    name: add_final
    params:
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        finance_value: finance_value
        attribute_name: attribute_name
        value_checked: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        check_date: check_date
      distinct: true

  - kind: write_dataio
    name: write_finance_general_completeness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: finance_general_completeness
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full