transform:
  name: delivery_address_mdg_sap
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')

  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        name_last: name_last_mdg_but000
        name_first: name_first_mdg_but000
        partner_guid: partner_guid_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_mdg_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but020
      schema_version: v1

  - kind: select
    name: select_mdg_but020
    context_name: read_mdg_but020
    params:
      columns:
        partner: partner_mdg_but020
        addrnumber: addrnumber_mdg_but020
      distinct: true

  - kind: read_dataio
    name: read_mdg_adrc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adrc
      schema_version: v1

  - kind: filter
    name: filter_mdg_adrc
    context_name: read_mdg_adrc
    params:
      - condition:
          nation = '' and (adrc_uuid <> '' and isnotnull(adrc_uuid))

  - kind: select
    name: select_mdg_adrc_regex
    context_name: filter_mdg_adrc
    params:
      columns:
        addrnumber: addrnumber_mdg_adrc
        city1: city1_mdg_adrc1
        street: street_mdg_adrc1
        house_num1: house_num1_mdg_adrc1
        building: building_mdg_adrc1
        post_code1: post_code1_mdg_adrc1
        floor: floor_mdg_adrc1
        house_num2: house_num2_mdg_adrc1
        roomnumber: roomnumber_mdg_adrc1
        country: country_mdg_adrc
        region: region_mdg_adrc
        regiogroup: regiogroup_mdg_adrc
        time_zone: time_zone_mdg_adrc
        transpzone: transpzone_mdg_adrc
      distinct: true
      
  - kind: add
    name: select_mdg_adrc
    context_name: select_mdg_adrc_regex
    params:
      - column: city1_mdg_adrc
        expression: regexp_replace(regexp_replace(city1_mdg_adrc1,'\n',''),'\r','')
      - column: street_mdg_adrc
        expression: regexp_replace(regexp_replace(street_mdg_adrc1,'\n',''),'\r','')
      - column: house_num1_mdg_adrc
        expression: regexp_replace(regexp_replace(house_num1_mdg_adrc1,'\n',''),'\r','')
      - column: building_mdg_adrc
        expression: regexp_replace(regexp_replace(building_mdg_adrc1,'\n',''),'\r','')
      - column: post_code1_mdg_adrc
        expression: regexp_replace(regexp_replace(post_code1_mdg_adrc1,'\n',''),'\r','')
      - column: floor_mdg_adrc
        expression: regexp_replace(regexp_replace(floor_mdg_adrc1,'\n',''),'\r','')
      - column: house_num2_mdg_adrc
        expression: regexp_replace(regexp_replace(house_num2_mdg_adrc1,'\n',''),'\r','')
      - column: roomnumber_mdg_adrc
        expression: regexp_replace(regexp_replace(roomnumber_mdg_adrc1,'\n',''),'\r','')
      - column: regiogroup_mdg_adrc
        expression: regexp_replace(regexp_replace(regiogroup_mdg_adrc1,'\n',''),'\r','')

  - kind: read_dataio
    name: read_mdg_zmdgc_geo
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: zmdgc_geo
      schema_version: v1

  - kind: select
    name: select_mdg_zmdgc_geo
    context_name: read_mdg_zmdgc_geo
    params:
      columns:
        partner: partner_mdg_zmdgc_geo
        zlati: zlati_mdg_zmdgc_geo
        zlong: zlong_mdg_zmdgc_geo
      distinct: true

  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1
  
  - kind: filter
    name: filter_mdg_knvv
    context_name: read_mdg_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
  
  - kind: select
    name: select_knvv_pre_checkpoint
    context_name: filter_mdg_knvv
    params:          
      columns:
        kunnr: kunnr
        kvgr4: kvgr4
        vkorg: vkorg
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: checkpoint
    name: select_knvv
    context_name: select_knvv_pre_checkpoint

  - kind: join
    name: join_mdg
    context_name: select_mdg_but000
    params:
      - other:
          select_mdg_but020
        how:
          inner
        columns:
          partner_mdg_but000: partner_mdg_but020
      - other:
          select_knvv
        how:
          inner
        columns:
          partner_mdg_but000: kunnr
      - other:
          select_mdg_adrc
        how:
          left
        columns:
          addrnumber_mdg_but020: addrnumber_mdg_adrc
      - other:
          select_mdg_zmdgc_geo
        how:
          left
        columns:
          partner_mdg_but000: partner_mdg_zmdgc_geo


  - kind: read_dataio
    name: read_sap_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_sap_but000
    context_name: read_sap_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))

  - kind: select
    name: select_sap_but000
    context_name: filter_sap_but000
    params:
      columns:
        partner: partner_sap_but000
        name_last: name_last_sap_but000
        name_first: name_first_sap_but000
        partner_guid: partner_guid_sap_but000
        sap_cluster: sap_cluster_but000
      distinct: true

  - kind: read_dataio
    name: read_sap_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: but020
      schema_version: v1

  - kind: select
    name: select_sap_but020
    context_name: read_sap_but020
    params:
      columns:
        partner: partner_sap_but020
        addrnumber: addrnumber_sap_but020
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_sap_adrc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: address_and_communication_data
      object_name: adrc
      schema_version: v1

  - kind: filter
    name: filter_sap_adrc
    context_name: read_sap_adrc
    params:
      - condition:
          nation = '' and (adrc_uuid <> '' and isnotnull(adrc_uuid))

  - kind: select
    name: select_sap_adrc_regex
    context_name: filter_sap_adrc
    params:
      columns:
        addrnumber: addrnumber_sap_adrc
        city1: city1_sap_adrc1
        street: street_sap_adrc1
        house_num1: house_num1_sap_adrc1
        building: building_sap_adrc1
        post_code1: post_code1_sap_adrc1
        floor: floor_sap_adrc1
        house_num2: house_num2_sap_adrc1
        roomnumber: roomnumber_sap_adrc1
        country: country_sap_adrc
        region: region_sap_adrc
        regiogroup: regiogroup_sap_adrc1
        time_zone: time_zone_sap_adrc
        transpzone: transpzone_sap_adrc
        sap_cluster: sap_cluster
      distinct: true
     
  - kind: add
    name: select_sap_adrc
    context_name: select_sap_adrc_regex
    params:
      - column: city1_sap_adrc
        expression: regexp_replace(regexp_replace(city1_sap_adrc1,'\n',''),'\r','')
      - column: street_sap_adrc
        expression: regexp_replace(regexp_replace(street_sap_adrc1,'\n',''),'\r','')
      - column: house_num1_sap_adrc
        expression: regexp_replace(regexp_replace(house_num1_sap_adrc1,'\n',''),'\r','')
      - column: building_sap_adrc
        expression: regexp_replace(regexp_replace(building_sap_adrc1,'\n',''),'\r','')
      - column: post_code1_sap_adrc
        expression: regexp_replace(regexp_replace(post_code1_sap_adrc1,'\n',''),'\r','')
      - column: floor_sap_adrc
        expression: regexp_replace(regexp_replace(floor_sap_adrc1,'\n',''),'\r','')
      - column: house_num2_sap_adrc
        expression: regexp_replace(regexp_replace(house_num2_sap_adrc1,'\n',''),'\r','')
      - column: roomnumber_sap_adrc
        expression: regexp_replace(regexp_replace(roomnumber_sap_adrc1,'\n',''),'\r','')
      - column: regiogroup_sap_adrc
        expression: regexp_replace(regexp_replace(regiogroup_sap_adrc1,'\n',''),'\r','')

  - kind: read_dataio
    name: read_sap_lot_gc_adr
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: address_and_communication_data
      object_name: lot_gc_adr
      schema_version: v1

  - kind: select
    name: select_sap_lot_gc_adr
    context_name: read_sap_lot_gc_adr
    params:
      columns:
        addrnumber: addrnumber_sap_lot_gc_adr
        lot_gc_latitude: lot_gc_latitude_sap_lot_gc_adr
        lot_gc_longitud: lot_gc_longitud_sap_lot_gc_adr
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_knvv_sap
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: knvv
      schema_version: v1
  
  - kind: filter
    name: filter_knvv_sap
    context_name: read_knvv_sap
    params:
      - condition:
          vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
  
  - kind: select
    name: select_knvv_sap
    context_name: filter_knvv_sap
    params:          
      columns:
        kunnr: kunnr_knvv
        kvgr4: kvgr4_knvv
        vkorg: vkorg_knvv
        vtweg: vtweg_knvv
        spart: spart_knvv
        sap_cluster: sap_cluster_knvv
      distinct: true

  - kind: join
    name: join_sap
    context_name: select_sap_but000
    params:
      - other:
          select_sap_but020
        how:
          inner
        columns:
          partner_sap_but000: partner_sap_but020
          sap_cluster_but000: sap_cluster
      - other:
          select_knvv_sap
        how:
          inner
        columns:
          partner_sap_but000: kunnr_knvv
          sap_cluster_but000: sap_cluster_knvv
      - other:
          select_sap_adrc
        how:
          left
        columns:
          addrnumber_sap_but020: addrnumber_sap_adrc
          sap_cluster: sap_cluster
      - other:
          select_sap_lot_gc_adr
        how:
          left
        columns:
          addrnumber_sap_but020: addrnumber_sap_lot_gc_adr
          sap_cluster: sap_cluster

  - kind: add
    name: add_mdg
    context_name: join_mdg
    params:
      - column: hash_mdg
        expression: md5(concat_ws('',
                    partner_mdg_but000, 
                    partner_guid_mdg_but000, 
                    city1_mdg_adrc, 
                    street_mdg_adrc, 
                    house_num1_mdg_adrc,
                    building_mdg_adrc, 
                    post_code1_mdg_adrc,
                    floor_mdg_adrc,
                    house_num2_mdg_adrc,
                    roomnumber_mdg_adrc,
                    country_mdg_adrc,
                    region_mdg_adrc,
                    regiogroup_mdg_adrc,
                    time_zone_mdg_adrc,
                    transpzone_mdg_adrc,
                    zlati_mdg_zmdgc_geo,
                    zlong_mdg_zmdgc_geo))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_sap
    context_name: join_sap
    params:
      - column: hash_sap
        expression: md5(concat_ws('',
                    partner_sap_but000, 
                    partner_guid_sap_but000, 
                    city1_sap_adrc, 
                    street_sap_adrc, 
                    house_num1_sap_adrc,
                    building_sap_adrc, 
                    post_code1_sap_adrc,
                    floor_sap_adrc,
                    house_num2_sap_adrc,
                    roomnumber_sap_adrc,
                    country_sap_adrc,
                    region_sap_adrc,
                    regiogroup_sap_adrc,
                    time_zone_sap_adrc,
                    transpzone_sap_adrc,
                    lot_gc_latitude_sap_lot_gc_adr,
                    lot_gc_longitud_sap_lot_gc_adr))           

  - kind: checkpoint
    name: checkpoint_sap
    context_name: add_sap

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_sap
        how:
          full
        columns:
          hash_mdg: hash_sap

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_sap) or hash_sap = ''

  - kind: join
    name: join_non_matching_sap
    context_name: checkpoint_sap
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_sap: hash_mdg

  - kind: filter
    name: filter_non_matching_sap
    context_name: join_non_matching_sap
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        partner_mdg_but000: partner_mdg
        name_last_mdg_but000: name_last_mdg
        name_first_mdg_but000: name_first_mdg
        city1_mdg_adrc: city1_mdg
        street_mdg_adrc: street_mdg
        house_num1_mdg_adrc: house_num1_mdg
        building_mdg_adrc: building_mdg
        post_code1_mdg_adrc: post_code1_mdg
        floor_mdg_adrc: floor_mdg
        house_num2_mdg_adrc: house_num2_mdg
        roomnumber_mdg_adrc: roomnumber_mdg
        country_mdg_adrc: country_mdg
        region_mdg_adrc: region_mdg
        regiogroup_mdg_adrc: regiogroup_mdg
        time_zone_mdg_adrc: time_zone_mdg
        transpzone_mdg_adrc: transpzone_mdg
        zlati_mdg_zmdgc_geo: zlati_mdg
        zlong_mdg_zmdgc_geo: zlong_mdg
        hash_mdg: hash_mdg
        partner_guid_mdg_but000: partner_guid_mdg
      distinct: true

  - kind: select
    name: select_non_matching_sap
    context_name: filter_non_matching_sap
    params:
      columns:
        partner_sap_but000: partner_sap
        name_last_sap_but000: name_last_sap
        name_first_sap_but000: name_first_sap
        city1_sap_adrc: city1_sap
        street_sap_adrc: street_sap
        house_num1_sap_adrc: house_num1_sap
        building_sap_adrc: building_sap
        post_code1_sap_adrc: post_code1_sap
        floor_sap_adrc: floor_sap
        house_num2_sap_adrc: house_num2_sap
        roomnumber_sap_adrc: roomnumber_sap
        country_sap_adrc: country_sap
        region_sap_adrc: region_sap
        regiogroup_sap_adrc: regiogroup_sap
        time_zone_sap_adrc: time_zone_sap
        transpzone_sap_adrc: transpzone_sap
        lot_gc_latitude_sap_lot_gc_adr: lot_gc_latitude_sap
        lot_gc_longitud_sap_lot_gc_adr: lot_gc_longitud_sap
        hash_sap: hash_sap
        partner_guid_sap_but000: partner_guid_sap
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_sap
    context_name: select_non_matching_sap

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_sap
        how:
          full
        columns:
          partner_mdg: partner_sap
          partner_guid_mdg: partner_guid_sap


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_sap: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: join
    name: join_missing_from_sap
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_sap
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_sap, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
