        customer_code: customer_code
        process_run_id: process_run_id
      distinct: true

  - kind: select
    name: select_dm_customer_check_results_uniqueness
    context_name: read_dm_customer_check_results_uniqueness
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code_uq
        process_run_id: process_run_id_uq
      distinct: true

  - kind: join
    name: join_dm_customer_general
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_check_results_uniqueness
        how:
          left
        columns:
          customer_code: customer_code_uq

  - kind: add
    name: add_dm_customer_check_results_uniqueness
    params:
      - column: out_value_checked
        expression: '''N/A'''
      - column: out_check_date
        expression: current_timestamp()
      - column: out_rule_code
        expression: ifnull(rule_code,'''RCUNIQ_1''')
      - column: out_process_run_id
        expression: ifnull(process_run_id_uq, process_run_id)
      - column: out_check_status
        expression: ifnull(check_status, '''1''') 
      - column: out_customer_code
        expression: ifnull(customer_code_uq, customer_code)                      
        
  - kind: select
