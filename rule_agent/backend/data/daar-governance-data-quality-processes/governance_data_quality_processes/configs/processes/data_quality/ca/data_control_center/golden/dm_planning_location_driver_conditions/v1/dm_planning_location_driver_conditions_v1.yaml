transform:
  name: dm_planning_location_driver_conditions
  operations:

  # Read O4H_OSLC_DRV (driver-to-location condition assignments)
  - kind: read_dataio
    name: read_o4h_oslc_drv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: otc_leo
      object_name: o4h_oslc_drv
      schema_version: v1

  # Select and rename columns for final datamart schema
  - kind: select
    name: select_dm_planning_location_driver_conditions
    context_name: read_o4h_oslc_drv
    params:
      columns:
        location: planning_location
        operation: operation
        role: location_role
        drv_id: driver_id
        drv_cond: driver_condition
        sap_cluster: sap_cluster
        sap_read_timestamp: sap_read_timestamp
      distinct: true

  # Write to golden datamart
  - kind: write_dataio
    name: write_dm_planning_location_driver_conditions
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_planning_location_driver_conditions
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
