##agg

  - kind: select
    name: select_mdg
    context_name: checkpoint_mdg
    params:
      columns:
        partner_mdg: partner_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: add
    name: add_mdg_agg
    context_name: select_mdg
    params:
      - column: table_name
        expression: '''CREDIT DATA'''
      - column: src_system
        expression: '''mdg'''
      - column: dimension
        expression: '''TOTAL COUNT'''
      - column: mdg
        expression: hash_mdg
      - column: mdg_country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END

  - kind: group
    name: group_mdg_agg
    context_name: add_mdg_agg
    params:
      - aggs:
          mdg: count
        by:
        - mdg_country
        - table_name
        - src_system
        - dimension

  - kind: add
    name: add_mdg_agg_loading_date
    context_name: group_mdg_agg
    params:
      - column: loading_date
        expression: current_date()
      - column: tgt_system
        expression: '''sap'''
      - column: cnt
        expression: CAST(count_mdg AS INT)

  - kind: select
    name: select_mdg_agg
    context_name: add_mdg_agg_loading_date
    params:
      columns:
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        dimension: dimension
        cnt: cnt
        mdg_country: country
        loading_date: loading_date
      distinct: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: cross_system
      namespace: golden
      object_name: recon_aggregated_prod
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full

