transform:
  name: sap_cc_onetrust
  operations:
    - kind: read_dataio
      name: read_customer_md
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: cch_cp2
        namespace: md
        object_name: customer
        schema_version: v1

    - kind: filter
      name: filter_customer_md
      context_name: read_customer_md
      params:
        - condition: p_active == 1 and (p_sapbackenduuid is not null or p_sapbackenduuid <> '')

    - kind: add
      name: add_customer_md_columns
      context_name: filter_customer_md
      params:
      - column: country_sap_cc
        expression: coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(country,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: email_sap_cc
        expression: coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: hash_sap_cc
        expression: md5(concat(coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(country,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))

    - kind: select
      name: select_sap_cc
      context_name: add_customer_md_columns
      params:
        columns:
          b2b_units: partner_sap_cc
          country_sap_cc: country_sap_cc
          p_sapbackenduuid: src_guid_sap_cc
          email_sap_cc: email_sap_cc
          hash_sap_cc: hash_sap_cc
        distinct: true

    - kind: read_dataio
      name: read_data_subject_profiles
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: onetrust
        namespace: data_subject_profiles
        object_name: data_subject_profiles
        schema_version: v1

    - kind: select
      name: select_data_subject_profiles
      context_name: read_data_subject_profiles
      params:
        columns:
          ot_id: ot_id_profile
          identifier: identifier_profile
        # distinct: true

    - kind: read_dataio
      name: read_data_subject_profile_data_elements
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: onetrust
        namespace: data_subject_profiles
        object_name: data_subject_profile_data_elements
        schema_version: v1

    - kind: select
      name: select_data_subject_profile_data_elements
      context_name: read_data_subject_profile_data_elements
      params:
        columns:
          ot_id: ot_id_data_elements
          value: value_data_elements
          data_element_name: data_element_name
        # distinct: true

    - kind: join
      name: join_ot
      context_name: select_data_subject_profiles
      params:
        - other:
            select_data_subject_profile_data_elements
          how:
            left
          columns:
            ot_id_profile: ot_id_data_elements

    - kind: filter
      name: filter_ot
      context_name: join_ot
      params:
        - condition:
            data_element_name = 'Country'

    - kind: add
      name: add_ot_columns
      context_name: filter_ot
      params:
      - column: country_ot
        expression: coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(value_data_elements,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: email_ot
        expression: coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(identifier_profile,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: hash_ot
        expression: md5(concat(coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(identifier_profile,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),coalesce(trim(upper(regexp_replace(regexp_replace(regexp_replace(regexp_replace(value_data_elements,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))

    - kind: select
      name: select_ot
      context_name: add_ot_columns
      params:
        columns:
          ot_id_profile: tgt_guid_ot
          email_ot: email_ot
          country_ot: country_ot
          hash_ot: hash_ot
        distinct: true

    - kind: join
      name: join_non_matching_sap_cc
      context_name: select_ot
      params:
        - other:
            select_sap_cc
          how:
            full
          columns:
            hash_ot: hash_sap_cc
  
    - kind: filter
      name: filter_non_matching_sap_cc
      context_name: join_non_matching_sap_cc
      params:
        - condition:
            hash_ot IS NULL or hash_ot = ''
  
    - kind: join
      name: join_non_matching_ot
      context_name: select_ot
      params:
        - other:
            select_sap_cc
          how:
            full
          columns:
            hash_ot: hash_sap_cc
  
    - kind: filter
      name: filter_non_matching_ot
      context_name: join_non_matching_ot
      params:
        - condition:
            hash_sap_cc IS NULL or hash_sap_cc = ''

    - kind: select
      name: select_non_matching_sap_cc
      context_name: filter_non_matching_sap_cc
      params:
        columns:
          partner_sap_cc: partner_sap_cc
          country_sap_cc: country_sap_cc
          src_guid_sap_cc: src_guid_sap_cc
          email_sap_cc: email_sap_cc
          hash_sap_cc: hash_sap_cc
        distinct: true

    - kind: select
      name: select_non_matching_ot
      context_name: filter_non_matching_ot
      params:
        columns:
          tgt_guid_ot: tgt_guid_ot
          email_ot: email_ot
          country_ot: country_ot
          hash_ot: hash_ot
        distinct: true

    - kind: join
      name: join_non_matching
      context_name: select_non_matching_sap_cc
      params:
        - other:
            select_non_matching_ot
          how:
            full
          columns:
            email_sap_cc: email_ot

###data missing ot
  
    - kind: filter
      name: filter_data_missing_ot
      context_name: join_non_matching
      params:
        - condition:
            email_ot IS NULL

    - kind: add
      name: add_data_missing_ot_columns
      context_name: filter_data_missing_ot
      params:
      - column: src_system
        expression: cast('sap cc' as string)
      - column: tgt_system
        expression: cast('onetrust' as string)
      - column: msg
        expression: CASE WHEN email_ot IS NULL THEN "data missing from onetrust" END
      - column: attr_name
        expression: CAST(NULL AS string)
      - column: tgt_attr
        expression: CAST(NULL AS string)
      - column: src_attr
        expression: CAST(NULL AS string)
      - column: tgt_pk
        expression: CAST(NULL AS string)

    - kind: select
      name: select_data_missing_ot
      context_name: add_data_missing_ot_columns
      params:
        columns:
          partner_sap_cc: partner
          email_sap_cc: src_pk
          tgt_pk: tgt_pk
          src_system: src_system
          tgt_system: tgt_system
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

###Country
    - kind: filter
      name: filter_country
      context_name: join_non_matching
      params:
        - condition:
            email_sap_cc = email_ot AND country_sap_cc<>country_ot

    - kind: add
      name: add_country_columns
      context_name: filter_country
      params:
      - column: src_system
        expression: cast('sap cc' as string)
      - column: tgt_system
        expression: cast('onetrust' as string)
      - column: msg
        expression: CASE WHEN email_sap_cc = email_ot AND country_sap_cc<>country_ot THEN "attributes are mismatching" END
      - column: attr_name
        expression: CASE WHEN email_sap_cc = email_ot AND country_sap_cc<>country_ot THEN concat("SAP CC OneTrust:"," Country") END
      - column: tgt_attr
        expression: country_sap_cc
      - column: src_attr
        expression: country_ot

    - kind: select
      name: select_country
      context_name: add_country_columns
      params:
        columns:
          partner_sap_cc: partner
          email_sap_cc: src_pk
          email_ot: tgt_pk
          src_system: src_system
          tgt_system: tgt_system
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

    - kind: union
      name: union_comparison
      context_name: select_data_missing_ot
      params:
        allow_missing: true
        by_name: true
        other: select_country

    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1
  
    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1
  
    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1
  
    - kind: filter
      name: filter_t077x
      params:
        - condition:
            spras = 'E' and sap_cluster = 'CL1'
  
    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true
  
    - kind: read_dataio
      name: read_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
  
    - kind: filter
      name: filter_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01'
  
    - kind: select
      name: select_knvv
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          vkorg: vkorg_knvv
          kvgr4: kvgr4_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
  
    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1
  
    - kind: filter
      name: filter_tvv4t
      params:
        - condition:
           sap_cluster = 'CL1' and spras = 'E'
  
    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
      context_name: union_comparison
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            left
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_knvv
          how:
            left
          columns:
            kunnr_kna1: kunnr_knvv
        - other:
            select_tvv4t
          how:
            left
          columns:
            kvgr4_knvv: kvgr4_tvv4t
  
    - kind: filter
      name: filter_final
      params:
        - condition:
            aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg_knvv in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

    - kind: add
      name: add_final_columns
      context_name: filter_final
      params:
        - column: attribute10
          expression: concat(ktokd_kna1, ' - ', txt30_t077x)
        - column: attribute5
          expression: concat(kvgr4_knvv, ' - ', bezei_tvv4t)
        - column: country
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
                           WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
                           WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
                           WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
                           WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
                           WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
                           WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
                           WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
                           WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
                           WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
                           WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
                           WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
                           WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
                           WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
                           WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
                           WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
                           WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
                           WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
                           WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
                           WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
                           WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
                           WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
                           WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
                           WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
                           WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
                           WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
                           WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
                           WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
                           WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END
        - column: domain
          expression: '''CUSTOMER'''
        - column: table_name
          expression: '''SAP CC OneTrust'''
        - column: null_value
          expression: cast(NULL as string)
        - column: loading_date
          expression: current_date()
        - column: attribute3
          expression: src_pk

    - kind: select
      name: select_final
      context_name: add_final_columns
      params:
        columns:
          domain: domain
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          msg: dimension
          partner: primary_key_l1
          src_pk: primary_key_src_l2
          tgt_pk: primary_key_tgt_l2
          null_value: primary_key_src_l3
          null_value: primary_key_tgt_l3
          null_value: attribute1
          null_value: attribute2
          attribute3: attribute3
          aufsd_kna1: attribute4
          attribute5: attribute5
          vkorg_knvv: attribute6
          vtweg_knvv: attribute7
          spart_knvv: attribute8
          null_value: attribute9
          attribute10: attribute10
          country: country
          attr_name: compared_attribute
          src_attr: compared_src_attr_value
          tgt_attr: compared_tgt_attr_value
          loading_date: loading_date

    - kind: write_dataio
      name: write_shipping_data
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: reconciliation_results
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: partition
        convert_to_target_schema: True

## agg ##
### ot ###
    - kind: select
      name: select_ot_agg
      context_name: select_ot
      params:
        columns:
          email_ot: email_ot
          country_ot: country_ot
        distinct: true

    - kind: add
      name: add_missing_columns_ot_agg
      context_name: select_ot_agg
      params:
        - column: table_name
          expression: cast('SAP CC OneTrust' as string)
        - column: src_system
          expression: cast('onetrust' as string)
        - column: tgt_system
          expression: cast('sap cc' as string)
        - column: dimension
          expression: cast('TOTAL COUNT' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_ot_agg
      context_name: add_missing_columns_ot_agg
      params:
        - aggs:
            email_ot: count
          by:
          - country_ot
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_ot_agg_final
      context_name: group_ot_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_email_ot: cnt
          country_ot: country
          loading_date: loading_date
        distinct: true
### sap_cc ###
    - kind: select
      name: select_sap_cc_agg
      context_name: select_sap_cc
      params:
        columns:
          email_sap_cc: email_sap_cc
          country_sap_cc: country_sap_cc
        distinct: true

    - kind: add
      name: add_missing_columns_sap_cc_agg
      context_name: select_sap_cc_agg
      params:
        - column: table_name
          expression: cast('SAP CC OneTrust' as string)
        - column: src_system
          expression: cast('sap cc' as string)
        - column: tgt_system
          expression: cast('onetrust' as string)
        - column: dimension
          expression: cast('TOTAL COUNT' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_sap_cc_agg
      context_name: add_missing_columns_sap_cc_agg
      params:
        - aggs:
            email_sap_cc: count
          by:
          - country_sap_cc
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_sap_cc_agg_final
      context_name: group_sap_cc_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_email_sap_cc: cnt
          country_sap_cc: country
          loading_date: loading_date
        distinct: true

### mismatch ###
    - kind: filter
      name: filter_final_agg
      context_name: select_final
      params:
        - condition:
            dimension = 'attributes are mismatching'

    - kind: select
      name: select_mismatch_agg
      context_name: filter_final_agg
      params:
        columns:
          primary_key_src_l2: primary_key_src_l2
          country: country
        distinct: true

    - kind: add
      name: add_missing_columns_mismatch_agg
      context_name: select_mismatch_agg
      params:
        - column: table_name
          expression: cast('SAP CC OneTrust' as string)
        - column: src_system
          expression: cast('onetrust' as string)
        - column: tgt_system
          expression: cast('sap cc' as string)
        - column: dimension
          expression: cast('ATTRIBUTES ARE MISMATCHING' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_mismatch_agg
      context_name: add_missing_columns_mismatch_agg
      params:
        - aggs:
            primary_key_src_l2: count
          by:
          - country
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_mismatch_agg_final
      context_name: group_mismatch_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_primary_key_src_l2: cnt
          country: country
          loading_date: loading_date
        distinct: true

### missing ot ###
    - kind: filter
      name: filter_missing_ot_agg
      context_name: select_final
      params:
        - condition:
            dimension = 'data missing from onetrust'

    - kind: select
      name: select_missing_ot_agg
      context_name: filter_missing_ot_agg
      params:
        columns:
          primary_key_src_l2: primary_key_src_l2
          country: country
        distinct: true

    - kind: add
      name: add_missing_columns_missing_ot_agg
      context_name: select_missing_ot_agg
      params:
        - column: table_name
          expression: cast('SAP CC OneTrust' as string)
        - column: src_system
          expression: cast('sap cc' as string)
        - column: tgt_system
          expression: cast('onetrust' as string)
        - column: dimension
          expression: cast('DATA MISSING FROM ONETRUST' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_missing_ot_agg
      context_name: add_missing_columns_missing_ot_agg
      params:
        - aggs:
            primary_key_src_l2: count
          by:
          - country
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_missing_ot_agg_final
      context_name: group_missing_ot_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_primary_key_src_l2: cnt
          country: country
          loading_date: loading_date
        distinct: true

### write agg ###
    - kind: union
      name: union_comparison_agg_final
      context_name: select_ot_agg_final
      params:
        allow_missing: true
        by_name: true
        other: select_sap_cc_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_mismatch_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_missing_ot_agg_final        

    - kind: cast
      name: cast_cnt
      context_name: union_comparison_agg
      params:
      - column: cnt
        to: integer

    - kind: write_dataio
      name: write_aggregated
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: recon_aggregated_prod
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: partition