      - column: check_status_lenght
        expression: if(length(trim(contact_medium_value_cac)) < 4 or not rlike(contact_medium_value_cac, '^(?!\\+?\\s*(.)\\1+$)(?!\\+?\\s*([0-9])\\2+$)\\+?(?:[ \\-/()]*[0-9]+)+$'), 'invalid',
                    if(length(contact_medium_value_cac)>=min_number_of_digits and substr(contact_medium_value_cac,0,2) <> '00', 'valid', 'invalid'))
      - column: check_status
        expression: if(contact_medium_value_cac is null OR contact_medium_value_cac = '' OR central_order_block_code IN ('E', 'G', 'SP', 'R', 'U'), '',
                    if(check_status_lenght = 'invalid' OR check_status_pn = 'false', '0', '1'))

