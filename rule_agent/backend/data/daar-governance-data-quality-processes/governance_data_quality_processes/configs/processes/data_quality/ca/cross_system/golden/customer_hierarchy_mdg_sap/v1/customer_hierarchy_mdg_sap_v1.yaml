          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
          layer: curated
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: read_dataio
      name: read_sap_s4hana_reference_data_t077x
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
          layer: curated
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1

    - kind: read_dataio
      name: read_sap_mdg_customer_knvv
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
          layer: curated
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: read_dataio
      name: read_sap_s4hana_reference_data_tvv4t
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
          layer: curated
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1

    - kind: filter
      name: filter_sap_s4hana_reference_data_t077x
      context_name: read_sap_s4hana_reference_data_t077x
      params:
        - condition: "sap_cluster = 'CL1' AND spras = 'E'"

    - kind: filter
      name: filter_sap_s4hana_reference_data_tvv4t
      context_name: read_sap_s4hana_reference_data_tvv4t
      params:
        - condition: "sap_cluster = 'CL1' AND spras = 'E'"

    - kind: select
      name: select_sap_mdg_customer_kna1
      context_name: read_sap_mdg_customer_kna1
      params:
        columns:
          kunnr: kna1_kunnr
          aufsd: attribute4
          ktokd: kna1_ktokd

    - kind: select
      name: select_sap_s4hana_reference_data_t077x
      context_name: filter_sap_s4hana_reference_data_t077x
      params:
        columns:
          txt30: t077x_txt30
          ktokd: t077x_ktokd

    - kind: select
      name: select_sap_mdg_customer_knvv
      context_name: read_sap_mdg_customer_knvv
      params:
        columns:
          kunnr: knvv_kunnr
          vtweg: knvv_vtweg
          spart: knvv_spart
          kvgr4: knvv_kvgr4

    - kind: select
      name: select_sap_s4hana_reference_data_tvv4t
      context_name: filter_sap_s4hana_reference_data_tvv4t
      params:
        columns:
          kvgr4: tvv4t_kvgr4
          bezei: tvv4t_bezei

    - kind: rename
      name: rename_comparison
      context_name: checkpoint_comparison
      params:
        - column: partner
          to: comp_partner
        - column: vtweg
          to: comp_vtweg
        - column: spart
          to: comp_spart
        - column: msg 
          to: dimension
        - column: name_first 
          to: attribute1
        - column: name_last 
          to: attribute2
        - column: lv 
          to: attribute3
        - column: vkorg 
          to: comp_vkorg
        - column: src_attr 
          to: compared_src_attr_value
        - column: tgt_attr 
          to: compared_tgt_attr_value
        - column: attr_name 
          to: compared_attribute

    - kind: join
      name: join_customer_hierarchy
      context_name: rename_comparison
      params:
        - other: select_sap_mdg_customer_kna1
          how: left
          columns:
            comp_partner: kna1_kunnr
        - other: select_sap_s4hana_reference_data_t077x
          how: left
          columns:
            kna1_ktokd: t077x_ktokd
        - other: select_sap_mdg_customer_knvv
          how: left
          columns:
            kna1_kunnr: knvv_kunnr
            comp_vtweg: knvv_vtweg
            comp_spart: knvv_spart
        - other: select_sap_s4hana_reference_data_tvv4t
          how: left
          columns:
            knvv_kvgr4: tvv4t_kvgr4

    - kind: filter
      name: join_customer_hierarchy_ob_filter
      context_name: join_customer_hierarchy
      params:
        - condition: attribute4 in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: add
      name: add_columns_customer_hierarchy
      context_name: join_customer_hierarchy_ob_filter
      params:
        - column: domain
          expression: "'CUSTOMER'"
        - column: table_name
          expression: "'CUSTOMER HIERARCHY'"
        - column: primary_key_l1
          expression: comp_partner
        - column: primary_key_src_l2
          expression: "''"
        - column: primary_key_tgt_l2
          expression: "''"
        - column: primary_key_src_l3
          expression: "''"
        - column: primary_key_tgt_l3
          expression: "''"
        - column: attribute5
          expression: concat(knvv_kvgr4, '-', tvv4t_bezei)
        - column: attribute6
          expression: comp_vkorg
        - column: attribute7
          expression: comp_vtweg
        - column: attribute8
          expression: comp_spart
        - column: attribute9
          expression: "''"
        - column: attribute10
          expression: concat(kna1_ktokd, '-', t077x_txt30)
        - column: country
          expression: CASE WHEN comp_vkorg = 9600 THEN 'AM' WHEN comp_vkorg = 1100 THEN 'AT' WHEN comp_vkorg = 8600 THEN 'BA' WHEN comp_vkorg = 4890 THEN 'BG' WHEN comp_vkorg = 2300 THEN 'BY' WHEN comp_vkorg = 5500 THEN 'CH' WHEN comp_vkorg = 5100 THEN 'CY' WHEN comp_vkorg = 4500 THEN 'CZ' WHEN comp_vkorg = 3200 THEN 'EE' WHEN comp_vkorg = 4700 THEN 'EG' WHEN comp_vkorg = 7900 THEN 'GB' WHEN comp_vkorg = 1200 THEN 'GR' WHEN comp_vkorg = 8090 THEN 'HR' WHEN comp_vkorg = 2800 THEN 'HU' WHEN comp_vkorg = 7800 THEN 'IE' WHEN comp_vkorg = 6300 THEN 'IT' WHEN comp_vkorg = 9200 THEN 'KV' WHEN comp_vkorg = 3300 THEN 'LT' WHEN comp_vkorg = 3100 THEN 'LV' WHEN comp_vkorg = 2000 THEN 'MD' WHEN comp_vkorg = 8200 THEN 'ME' WHEN comp_vkorg = 9500 THEN 'MK' WHEN comp_vkorg = 9400 THEN 'NG' WHEN comp_vkorg = 6100 THEN 'PL' WHEN comp_vkorg = 9100 THEN 'RO' WHEN comp_vkorg = 2500 THEN 'RS' WHEN comp_vkorg = 8500 THEN 'SI' WHEN comp_vkorg = 4090 THEN 'SK' WHEN comp_vkorg = 7200 THEN 'UA' ELSE NULL END
        - column: loading_date
          expression: current_date()

    - kind: select
      name: customer_hierarchy
      context_name: add_columns_customer_hierarchy
      params:
        columns:
          domain: domain
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          primary_key_l1: primary_key_l1
          primary_key_src_l2: primary_key_src_l2
          primary_key_tgt_l2: primary_key_tgt_l2
          primary_key_src_l3: primary_key_src_l3
          primary_key_tgt_l3: primary_key_tgt_l3
          attribute1: attribute1
          attribute2: attribute2
          attribute3: attribute3
          attribute4: attribute4
          attribute5: attribute5
          attribute6: attribute6
          attribute7: attribute7
          attribute8: attribute8
          attribute9: attribute9
          attribute10: attribute10
          country: country
          compared_attribute: compared_attribute
          compared_src_attr_value: compared_src_attr_value
          compared_tgt_attr_value: compared_tgt_attr_value
          loading_date: loading_date
        distinct: true

    - kind: write_dataio
      name: write_customer_hierarchy
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: reconciliation_results
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: full
        convert_to_target_schema: True

