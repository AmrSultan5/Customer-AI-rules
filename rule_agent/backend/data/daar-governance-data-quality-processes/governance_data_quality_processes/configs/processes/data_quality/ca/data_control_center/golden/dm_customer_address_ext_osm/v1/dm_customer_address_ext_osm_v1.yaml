#not in use
transform:
  name: dm_customer_address_ext_osm
  operations:

  - kind: read_dataio
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general
      schema_version: v4

  - kind: read_dataio
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address
      schema_version: v2

  - kind: filter
    name: filter_dm_customer_general
    context_name: read_dm_customer_general
    params:
      - condition:
          country_code = '{{ country_filter }}'

  - kind: select
    name: select_dm_customer_general
    context_name: filter_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    context_name: read_dm_customer_address
    name: select_dm_customer_address
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        latitude: latitude
        longitude: longitude
        house_number: house_number
        street_1_name: street_1_name
        post_code: post_code
        city: city
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dm_customer_address_ext_osm
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_address
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

  - kind: select
    name: select_distinct_geocodes
    context_name: join_dm_customer_address_ext_osm
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_cluster: sap_cluster
        latitude: latitude
        longitude: longitude
        house_number: house_number
        street_1_name: street_1_name
        city: city
        post_code: post_code
        country_code: country_code
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm
    context_name: select_distinct_geocodes
    params:
      - condition:
          isnotnull(street_1_name) and isnotnull(city)
          and street_1_name <> '' and city <> '' 
          and isnotnull(post_code) and post_code <> '' 
          and isnotnull(latitude) and latitude <> 0 
          and isnotnull(longitude) and longitude <> 0
          and country_code = '{{ country_filter }}'

  - kind: governance_data_quality_processes.custom_operations.geopy.geolocator_search.GeolocatorSearchOperation
    name: geolocator_search
    context_name: filter_dm_customer_address_ext_osm
    config_kind: governance_data_quality_processes.custom_operation_configs.geopy.geolocator_search_config.GeolocatorSearchOperationConfig
    params:
      house_number: house_number
      street: street_1_name
      city: city
      postcode: post_code
      country_code: country_code
      country_filter: '{{ country_filter }}'

  - kind: select
    name: select_geolocator_search
    context_name: geolocator_search
    params:
      columns:
        customer_code: customer_code
        address_number: address_number
        latitude: latitude
        longitude: longitude
        lat: lat
        lon: lon
        importance_api_search: importance_api_search
        api_search_result_status: api_search_result_status
        sap_cluster: sap_cluster
      distinct: true

  - kind: governance_data_quality_processes.custom_operations.geopy.geolocator_reverse.GeolocatorReverseOperation
    name: geolocator_reverse
    context_name: select_geolocator_search
    config_kind: governance_data_quality_processes.custom_operation_configs.geopy.geolocator_reverse_config.GeolocatorReverseOperationConfig
    params:
      lat: latitude
      lon: longitude
      country_code: country_code
      country_filter: '{{ country_filter }}'

  - kind: select
    name: dm_customer_address_ext_osm
    context_name: geolocator_reverse
    params:
      columns:
        customer_code: customer_code
        address_number: address_number
        sap_cluster: sap_cluster
        country_code: country_code
        postcode: postcode
        city: city
        road: road
        street: street
        house_number: house_number
        house_name: house_name
        lat: latitude
        lon: longitude
        type: type
        display_name: display_name
        addresstype: adresstype
        place_id: place_id
        osm_id: osm_id
        importance_api_reverse: importance_api_reverse
        importance_api_search: importance_api_search
        state_district: state_district
        county: county
        municipality: municipality
        village: village
        town: town
        region: region
        district: district
        suburb: suburb
        state: state
        api_reverse_result_status: api_reverse_result_status
        api_search_result_status: api_search_result_status
      distinct: true

  - kind: add
    name: add_execution_date
    context_name: dm_customer_address_ext_osm
    params:
      - column: execution_date
        expression: cast(current_date() as date)

  - kind: cast
    name: cast_location
    context_name: add_execution_date
    params:
      - column: latitude
        to: decimal(15, 6)
      - column: longitude
        to: decimal(15, 6)

  - kind: write_dataio
    name: write_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: '{{ refresh_mode }}'