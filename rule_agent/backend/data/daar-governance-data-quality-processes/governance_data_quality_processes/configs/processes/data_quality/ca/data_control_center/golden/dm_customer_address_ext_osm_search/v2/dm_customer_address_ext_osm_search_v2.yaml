#not in use
transform:
  name: dm_customer_address_ext_osm_search
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address_ext_osm
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address_ext_osm_search
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm_search

  - kind: filter
    name: filter_dm_customer_general
    context_name: read_dm_customer_general
    params:
      - condition:
          country_code = '{{ country_filter }}'

  - kind: select
    name: select_dm_customer_general
    context_name: filter_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    context_name: read_dm_customer_address
    name: select_dm_customer_address
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        house_number: sap_house_number
        street_1_name: sap_street_1_name
        post_code: sap_post_code
        city: sap_city
        country_code: sap_country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm
    context_name: read_dm_customer_address_ext_osm
    params:
      - condition:
          sap_country_code = '{{ country_filter }}'

  - kind: select
    context_name: filter_dm_customer_address_ext_osm
    name: select_dm_customer_address_ext_osm
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_house_number: sap_house_number
        sap_street_1_name: sap_street_1_name
        sap_post_code: sap_post_code
        sap_city: sap_city
        sap_country_code: sap_country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm_search
    context_name: read_dm_customer_address_ext_osm_search
    params:
      - condition:
          sap_country_code = '{{ country_filter }}'

  - kind: select
    context_name: filter_dm_customer_address_ext_osm_search
    name: select_dm_customer_address_ext_osm_search
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_house_number: sap_house_number
        sap_street_1_name: sap_street_1_name
        sap_post_code: sap_post_code
        sap_city: sap_city
        sap_country_code: sap_country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dm_customer_address_ext_osm_search
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_address
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_address_ext_osm
        how:
          anti
        columns:
          customer_code: customer_code
          address_number: address_number
          sap_house_number: sap_house_number
          sap_street_1_name: sap_street_1_name
          sap_post_code: sap_post_code
          sap_city: sap_city
          sap_country_code: sap_country_code          
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_address_ext_osm_search
        how:
          anti
        columns:
          customer_code: customer_code
          address_number: address_number
          sap_house_number: sap_house_number
          sap_street_1_name: sap_street_1_name
          sap_post_code: sap_post_code
          sap_city: sap_city
          sap_country_code: sap_country_code          
          sap_cluster: sap_cluster

  - kind: select
    name: select_distinct_addresses
    context_name: join_dm_customer_address_ext_osm_search
    params:
      columns:
        address_number: address_number
        customer_code: customer_code
        sap_cluster: sap_cluster
        sap_house_number: sap_house_number
        sap_street_1_name: sap_street_1_name
        sap_city: sap_city
        sap_post_code: sap_post_code
        sap_country_code: sap_country_code
      distinct: true

  - kind: filter
    name: filter_dm_customer_address_ext_osm_search
    context_name: select_distinct_addresses
    params:
      - condition:
          isnotnull(sap_street_1_name) and isnotnull(sap_city)
          and sap_street_1_name <> '' and sap_city <> '' 
          and isnotnull(sap_post_code) and sap_post_code <> '' and sap_country_code = '{{ country_filter }}'

  - kind: add
    name: add_rownum
    context_name: filter_dm_customer_address_ext_osm_search
    params:
      - column: partition
        expression: '''1'''
      - column: record
        expression: int(1)
      - column: row_number
        expression: row_number() over (partition by partition order by address_number)

  - kind: filter
    name: filter_row_number
    context_name: add_rownum
    params:
      - condition:
          row_number >= {{ range_from }} and row_number <= {{ range_to }}

  - kind: group
    name: count_rows
    context_name: filter_row_number
    params:
      - aggs:
          record: count
        by:
        - address_number
        - customer_code
        - sap_cluster
        - sap_house_number
        - sap_street_1_name
        - sap_city
        - sap_post_code
        - sap_country_code

  - kind: governance_data_quality_processes.custom_operations.geopy.geolocator_search.GeolocatorSearchOperation
    name: geolocator_search
    context_name: count_rows
    config_kind: governance_data_quality_processes.custom_operation_configs.geopy.geolocator_search_config.GeolocatorSearchOperationConfig
    params:
      house_number: sap_house_number
      street: sap_street_1_name
      city: sap_city
      postcode: sap_post_code
      country_code: sap_country_code
      country_filter: '{{ country_filter }}'

  - kind: select
    name: select_dm_customer_address_ext_osm_search
    context_name: geolocator_search
    params:
      columns:
        customer_code: customer_code
        address_number: address_number
        sap_cluster: sap_cluster
        lat: latitude
        lon: longitude
        importance_api_search: importance_api_search
        api_search_result_status: api_search_result_status
        sap_house_number: sap_house_number
        sap_street_1_name: sap_street_1_name
        sap_post_code: sap_post_code
        sap_city: sap_city
        sap_country_code: sap_country_code
      distinct: true

  - kind: add
    name: add_execution_date
    context_name: select_dm_customer_address_ext_osm_search
    params:
      - column: execution_date
        expression: cast(current_date() as date)

  - kind: cast
    name: cast_location
    context_name: add_execution_date
    params:
      - column: latitude
        to: decimal(15, 6)
      - column: longitude
        to: decimal(15, 6)

  - kind: write_dataio
    name: write_dm_customer_address_ext_osm
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address_ext_osm_search
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: '{{ refresh_mode }}'