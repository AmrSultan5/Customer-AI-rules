# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_d365
    params:
      - condition:
          partner_d365 = partner_mdg
          and marketing_attr_d365 = marketing_attr_mdg
          and TRIM(regexp_replace(characteristic_d365, '\u00A0', '')) <>  TRIM(regexp_replace(characteristic_mdg, '\u00A0', ''))
          and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg
        expression: if(partner_d365 = partner_mdg
                    and marketing_attr_d365 = marketing_attr_mdg
                    and TRIM(regexp_replace(characteristic_d365, '\u00A0', '')) <>  TRIM(regexp_replace(characteristic_mdg, '\u00A0', '')), 'attributes are mismatching', '-')
      - column: attr_name
        expression: if(partner_d365 = partner_mdg 
                    and marketing_attr_d365 = marketing_attr_mdg
                    and TRIM(regexp_replace(characteristic_d365, '\u00A0', '')) <>  TRIM(regexp_replace(characteristic_mdg, '\u00A0', '')), concat('MARKETING ATTRIBUTE:', ' ', marketing_attr_mdg, ' characteristic'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''MARKETING ATTRIBUTES'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''d365'''
      - column: loading_date
        expression: current_date()


  - kind: select
    name: select_missing_from_mdg
    context_name: add_missing_from_mdg
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        partner_d365: primary_key_l1
        marketing_attr_d365: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: select
    name: select_missing_from_d365
    context_name: add_missing_from_d365
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        partner_mdg: primary_key_l1
        marketing_attr_mdg: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: select
    name: select_mismatched
    context_name: add_mismatched
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        partner_mdg: primary_key_l1
        marketing_attr_mdg: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        attr_name: compared_attribute
        characteristic_mdg: compared_src_attr_value
        characteristic_d365: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true


  - kind: union
    name: union_marketing_attributes
    context_name: select_missing_from_mdg
    params:
      allow_missing: true
      by_name: true
      other: select_missing_from_d365

  - kind: union
    name: union_marketing_attributes
    params:
      allow_missing: true
      by_name: true
      other: select_mismatched

  - kind: write_dataio
    name: write_marketing_attributes
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: cross_system
      namespace: golden
      object_name: reconciliation_results
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
      convert_to_target_schema: True

