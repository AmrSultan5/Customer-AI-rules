transform:
  name: marketing_attributes_mdg_d365
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        partner_guid: partner_guid_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_mdg_cabn
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: reference_data
      object_name: cabn
      schema_version: v1

  - kind: filter
    name: filter_mdg_cabn
    context_name: read_mdg_cabn
    params:
      - condition:
          atnam in('INDIRECT_CUST_SHARING_STATUS', 
                      'RETAILER_SEGMENTATION', 
                      'ZBDAA_SEGM01', 
                      'ZCCAF_HIGH_SEASON2', 
                      'ZCCAF_HIGH_SEASON2_FROM', 
                      'ZCCAF_HIGH_SEASON2_TO', 
                      'ZCDE_ACTUAL_DOORS', 
                      'ZCDE_CHANNEL_PRIORITY', 
                      'ZCOFFEE_SEGMENT', 
                      'ZFOCUS_OUTLET', 
                      'ZFSA_NUMBER_OF_TELLERS', 
                      'ZFSA_SALES_SURFACE', 
                      'ZFSA_WAREHOUSE_SURFACE', 
                      'ZGLOBAL_CUSTOMER', 
                      'ZLOCAL_SEGMENTATION', 
                      'ZONLINE_PLATFORM', 
                      'ZRED_OUTLET', 
                      'ZSELL_ONLINE', 
                      'ZSERVICE_TIME_OFF', 
                      'ZTRADE_NAME', 
                      'ZWEB_HIDE_CREDIT', 
                      'ZWEB_HIDE_PRICE', 
                      'ZXTEL_CLUSTER', 
                      'Z_CCAF_VISIT_FREQUENCY', 
                      'Z_CCHBC_POTENTIAL', 
                      'Z_CCHBC_POTENTIAL_GAP', 
                      'Z_CONT_SEGM', 
                      'Z_CTS_CLUSTER', 
                      'Z_CUST_SATISFACTION', 
                      'Z_CUSTOMER_INCENTIVE', 
                      'Z_EATB_WARM_SPACE', 
                      'Z_EATB_WARM_SPACE_TARGET', 
                      'Z_ECOMM_FSA', 
                      'Z_EDS', 
                      'Z_EFFICIENCY', 
                      'Z_MAIN_OCCASION', 
                      'Z_MERCH_SERVICE_TIME', 
                      'Z_OPTEN', 
                      'Z_ORDERS_NOT_EXPECTED', 
                      'Z_ORIGINAL_NIELSEN_CODE', 
                      'Z_PFP_CUSTOMER', 
                      'Z_PRESELLER_SERVICE_TIME', 
                      'Z_RED_TARGET', 
                      'Z_SECONDARY_OCCASION', 
                      'Z_TIRIES', 
                      'Z_TOTAL_POTENTIAL',
                      'Z_CCAF',
                      'ZSERVICE_TIME',
                      'Z_CCAF_SEASONALITY',
                      'ZCDE_TARGET_DOORS')

  - kind: select
    name: select_mdg_cabn
    context_name: filter_mdg_cabn
    params:
      columns:
        atinn: atinn_mdg_cabn
        atnam: atnam_mdg_cabn
      distinct: true

  - kind: read_dataio
    name: read_mdg_ausp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: ausp
      schema_version: v1

  - kind: select
    name: select_mdg_ausp
    context_name: read_mdg_ausp
    params:
      columns:
        objek: objek_mdg_ausp
        atwrt: atwrt_mdg_ausp
        atinn: atinn_mdg_ausp
      distinct: true



  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    context_name: read_mdg_knvv
    params:
      - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

  - kind: select
    name: select_mdg_knvv_checkpoint
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        kvgr4: kvgr4
        vkorg: vkorg
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: checkpoint
    name: select_knvv
    context_name: select_mdg_knvv_checkpoint

  - kind: read_dataio
    name: read_mdg_inob
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: inob
      schema_version: v1

  - kind: select
    name: select_mdg_inob
    context_name: read_mdg_inob
    params:
      columns:
        objek: objek_mdg_inob
        cuobj: cuobj_mdg_inob
      distinct: true


  - kind: join
    name: join_mdg
    context_name: select_mdg_ausp
    params:
      - other:
          select_mdg_inob
        how:
          inner
        columns:
          objek_mdg_ausp: cuobj_mdg_inob
      - other:
          select_mdg_cabn
        how:
          inner
        columns:
          atinn_mdg_ausp: atinn_mdg_cabn
      - other:
          select_mdg_but000
        how:
          inner
        columns:
          objek_mdg_inob: partner_mdg_but000
      - other:
          select_knvv
        how:
          inner
        columns:
          objek_mdg_inob: kunnr
          
          
          
          
##d365
  - kind: read_dataio
    name: read_d365_account
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: account
      schema_version: v1

  - kind: read_dataio
    name: read_d365_cch_customermarketingattribute
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_customermarketingattribute
      schema_version: v1

  - kind: filter
    name: filter_d365_account
    context_name: read_d365_account
    params:
      - condition:
          cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  - kind: filter
    name: filter_d365_cch_customermarketingattribute
    context_name: read_d365_cch_customermarketingattribute
    params:
      - condition:
          statecode = 0 
          and cch_marketingattributecode in('INDIRECT_CUST_SHARING_STATUS', 
                      'RETAILER_SEGMENTATION', 
                      'ZBDAA_SEGM01', 
                      'ZCCAF_HIGH_SEASON2', 
                      'ZCCAF_HIGH_SEASON2_FROM', 
                      'ZCCAF_HIGH_SEASON2_TO', 
                      'ZCDE_ACTUAL_DOORS', 
                      'ZCDE_CHANNEL_PRIORITY', 
                      'ZCOFFEE_SEGMENT', 
                      'ZFOCUS_OUTLET', 
                      'ZFSA_NUMBER_OF_TELLERS', 
                      'ZFSA_SALES_SURFACE', 
                      'ZFSA_WAREHOUSE_SURFACE', 
                      'ZGLOBAL_CUSTOMER', 
                      'ZLOCAL_SEGMENTATION', 
                      'ZONLINE_PLATFORM', 
                      'ZRED_OUTLET', 
                      'ZSELL_ONLINE', 
                      'ZSERVICE_TIME_OFF', 
                      'ZTRADE_NAME', 
                      'ZWEB_HIDE_CREDIT', 
                      'ZWEB_HIDE_PRICE', 
                      'ZXTEL_CLUSTER', 
                      'Z_CCAF_VISIT_FREQUENCY', 
                      'Z_CCHBC_POTENTIAL', 
                      'Z_CCHBC_POTENTIAL_GAP', 
                      'Z_CONT_SEGM', 
                      'Z_CTS_CLUSTER', 
                      'Z_CUST_SATISFACTION', 
                      'Z_CUSTOMER_INCENTIVE', 
                      'Z_EATB_WARM_SPACE', 
                      'Z_EATB_WARM_SPACE_TARGET', 
                      'Z_ECOMM_FSA', 
                      'Z_EDS', 
                      'Z_EFFICIENCY', 
                      'Z_MAIN_OCCASION', 
                      'Z_MERCH_SERVICE_TIME', 
                      'Z_OPTEN', 
                      'Z_ORDERS_NOT_EXPECTED', 
                      'Z_ORIGINAL_NIELSEN_CODE', 
                      'Z_PFP_CUSTOMER', 
                      'Z_PRESELLER_SERVICE_TIME', 
                      'Z_RED_TARGET', 
                      'Z_SECONDARY_OCCASION', 
                      'Z_TIRIES', 
                      'Z_TOTAL_POTENTIAL',
                      'Z_CCAF',
                      'ZSERVICE_TIME',
                      'Z_CCAF_SEASONALITY',
                      'ZCDE_TARGET_DOORS')
  - kind: select
    name: select_d365_account
    context_name: filter_d365_account
    params:
      columns:
        cch_sapid: cch_sapid_d365
        cch_salesorganizationid: cch_salesorganizationid
        cch_sapcrmguid: cch_sapcrmguid
        id: id_d365
        cch_distributionchannel: cch_distributionchannel
        cch_division: cch_division
      distinct: true

  - kind: select
    name: select_d365_cch_customermarketingattribute
    context_name: filter_d365_cch_customermarketingattribute
    params:
      columns:
        cch_customerid: cch_customerid_d365
        cch_marketingattributecode: cch_marketingattributecode_d365
        cch_characteristicvalue: cch_characteristicvalue
      distinct: true


#   ###################################################
  - kind: read_dataio
    name: read_optionsetmapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_optionsetmapping
      schema_version: v1   

      
  - kind: filter
    name: filter_cch_optionsetmapping_cd
    context_name: read_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
  
  - kind: select
    name: union_cte_division
    context_name: filter_cch_optionsetmapping_cd
    params:
      columns:
        cch_optionsetvalue: cd_cch_optionsetvalue
        cch_externalvalue: cd_cch_externalvalue
      distinct: true
  
# ###################################################
#  distributionchannel
  - kind: filter
    name: filter_cch_optionsetmapping_dc
    context_name: read_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
  
  - kind: select
    name: union_cte_distributionchannel
    context_name: filter_cch_optionsetmapping_dc
    params:
      columns:
        cch_optionsetvalue: dc_cch_optionsetvalue
        cch_externalvalue: dc_cch_externalvalue
      distinct: true

  - kind: read_dataio
    name: read_d365_territory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: territory
      schema_version: v1

  - kind: filter
    name: filter_territory
    context_name: read_d365_territory
    params:
      - condition: 1 = 1

  - kind: select
    name: select_d365_territory
    context_name: filter_territory
    params:
      columns:
        cch_sapid: territory_cch_sapid
        id: territory_id
      distinct: true        
#######################################################

###########################



  - kind: join
    name: join_d365
    context_name: select_d365_account
    params:
      - other:
          select_d365_cch_customermarketingattribute
        how:
          inner
        columns:
          id_d365: cch_customerid_d365
      - other:
          union_cte_distributionchannel
        how:
          inner
        columns:
          cch_distributionchannel: dc_cch_optionsetvalue
      - other:
          union_cte_division
        how:
          inner
        columns:
          cch_division: cd_cch_optionsetvalue
      - other:
          select_d365_territory
        how:
          left
        columns:
          cch_salesorganizationid: territory_id



  - kind: add
    name: add_mdg
    context_name: join_mdg
    params:
      - column: hash_mdg
        expression: md5(concat(
                    objek_mdg_inob,
                    atnam_mdg_cabn, 
                    atwrt_mdg_ausp))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_d365
    context_name: join_d365
    params:
      - column: cch_sapcrmguid_d365
        expression: upper(regexp_replace(cch_sapcrmguid,'-',''))
      - column: cch_characteristicvalue_d365
        expression: coalesce(cch_characteristicvalue,'')
      - column: hash_d365
        expression: md5(concat(
                    cch_sapid_d365, 
                    cch_marketingattributecode_d365, 
                    cch_characteristicvalue_d365))


  - kind: filter
    name: filter_d365
    context_name: add_d365
    params:
      - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)



  - kind: checkpoint
    name: checkpoint_d365
    context_name: filter_d365

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_d365
        how:
          full
        columns:
          hash_mdg: hash_d365

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_d365) or hash_d365 = ''

  - kind: join
    name: join_non_matching_d365
    context_name: checkpoint_d365
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_d365: hash_mdg

  - kind: filter
    name: filter_non_matching_d365
    context_name: join_non_matching_d365
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        objek_mdg_inob: partner_mdg
        partner_guid_mdg_but000: partner_guid_mdg
        atnam_mdg_cabn: marketing_attr_mdg
        atwrt_mdg_ausp: characteristic_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_d365
    context_name: filter_non_matching_d365
    params:
      columns:
        cch_sapid_d365: partner_d365
        cch_sapcrmguid_d365: partner_guid_d365
        cch_marketingattributecode_d365: marketing_attr_d365
        cch_characteristicvalue_d365: characteristic_d365
        hash_d365: hash_d365
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_d365
    context_name: select_non_matching_d365

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_d365
        how:
          full
        columns:
          partner_mdg: partner_d365
          marketing_attr_mdg: marketing_attr_d365


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_d365: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4


  - kind: join
    name: join_missing_from_d365
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg) and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_d365, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''MARKETING ATTRIBUTES'''
      - column: src_system
        expression: '''d365'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

