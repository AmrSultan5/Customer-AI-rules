# sunday

  - kind: filter
    name: filter_sunday
    context_name: join_missing_from_crm
    params:
      - condition:
          partner_crm = partner_mdg
          and rule_type_crm = rule_type_mdg 
          and (substr(rule_crm, 9, 1) <> substr(rule_mdg, 9, 1) 
          or substr(rule_crm, 46, 6) <> substr(rule_mdg, 46, 6) 
          or substr(rule_crm, 88, 6) <> substr(rule_mdg, 88, 6))

  - kind: add
    name: add_sunday
    context_name: filter_sunday
    params:
      - column: msg
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and (substr(rule_crm, 9, 1) <> substr(rule_mdg, 9, 1) 
                    or substr(rule_crm, 46, 6) <> substr(rule_mdg, 46, 6) 
                    or substr(rule_crm, 88, 6) <> substr(rule_mdg, 88, 6)), 'attributes are mismatching', '-')
      - column: attr_name
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and (substr(rule_crm, 9, 1) <> substr(rule_mdg, 9, 1) 
                    or substr(rule_crm, 46, 6) <> substr(rule_mdg, 46, 6) 
                    or substr(rule_crm, 88, 6) <> substr(rule_mdg, 88, 6)), concat('BUSINESS APPOINTMENT:', ' SUNDAY'), '-')
      - column: tgt_attr
        expression: concat('Allowed:', ' ', substr(rule_crm, 9, 1), 
                    ' From ', substr(rule_crm, 46, 2), 
                    ':', substr(rule_crm, 48, 2), 
                    ':', substr(rule_crm, 50, 2), 
                    ' To ', substr(rule_crm, 88, 2), 
                    ':', substr(rule_crm, 90, 2), 
                    ':', substr(rule_crm, 92, 2))
