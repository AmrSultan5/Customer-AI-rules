transform:
  name: business_appointments_mdg_crm
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1


  - kind: select
    name: select_mdg_but000
    context_name: read_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        name_last: name_last_mdg_but000
        name_first: name_first_mdg_but000
        partner_guid: partner_guid_mdg_but000
        xpcpt: xpcpt_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_mdg_crmm_but_tdar011
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: crmm_but_tdar011
      schema_version: v1


  - kind: select
    name: select_mdg_crmm_but_tdar011
    context_name: read_mdg_crmm_but_tdar011
    params:
      columns:
        rule_id: rule_id_mdg_crmm_but_tdar011
        rule_type: rule_type_mdg_crmm_but_tdar011
        valid_from: valid_from_mdg_crmm_but_tdar011
        valid_to: valid_to_mdg_crmm_but_tdar011
        partner_guid: partner_guid_mdg_crmm_but_tdar011
      distinct: true

  - kind: read_dataio
    name: read_mdg_scrules_raw
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: scrules
      schema_version: v1

  - kind: filter
    name: read_mdg_scrules
    context_name: read_mdg_scrules_raw
    params:
      - condition: end_date = '9999-12-31T00:00:00.000+00:00' 


  - kind: select
    name: select_mdg_scrules
    context_name: read_mdg_scrules
    params:
      columns:
        rule_id: rule_id_mdg_scrules
        rule: rule_mdg_scrules
        start_date: start_date_mdg_scrules
        end_date: end_date_mdg_scrules
      distinct: true

  - kind: join
    name: join_mdg
    context_name: select_mdg_but000
    params:
      - other:
          select_mdg_crmm_but_tdar011
        how:
          inner
        columns:
          partner_guid_mdg_but000: partner_guid_mdg_crmm_but_tdar011
      - other:
          select_mdg_scrules
        how:
          inner
        columns:
          rule_id_mdg_crmm_but_tdar011: rule_id_mdg_scrules


  - kind: filter
    name: filter_mdg
    context_name: join_mdg
    params:
      - condition: to_date(substr(valid_to_mdg_crmm_but_tdar011,0,8),'yyyyMMdd') = '9999-12-31' AND xpcpt_mdg_but000 <> 'X' AND partner_mdg_but000 LIKE any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')


  - kind: read_dataio
    name: read_crm_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: select
    name: select_crm_but000
    context_name: read_crm_but000
    params:
      columns:
        partner: partner_crm_but000
        name_last: name_last_crm_but000
        name_first: name_first_crm_but000
        partner_guid: partner_guid_crm_but000
        sap_cluster: sap_cluster_crm_but000
        xpcpt: xpcpt_crm_but000
      distinct: true

  - kind: read_dataio
    name: read_crm_crmm_but_tdar011
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: customer
      object_name: crmm_but_tdar011
      schema_version: v1


  - kind: select
    name: select_crm_crmm_but_tdar011
    context_name: read_crm_crmm_but_tdar011
    params:
      columns:
        rule_id: rule_id_crm_crmm_but_tdar011
        rule_type: rule_type_crm_crmm_but_tdar011
        valid_from: valid_from_crm_crmm_but_tdar011
        valid_to: valid_to_crm_crmm_but_tdar011
        partner_guid: partner_guid_crm_crmm_but_tdar011
        sap_cluster: sap_cluster_crm_crmm_but_tdar011
      distinct: true

  - kind: read_dataio
    name: read_crm_scrules_raw
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: customer
      object_name: scrules
      schema_version: v1

  - kind: filter
    name: read_crm_scrules
    context_name: read_crm_scrules_raw
    params:
      - condition: end_date = '9999-12-31T00:00:00.000+00:00' 

  - kind: select
    name: select_crm_scrules
    context_name: read_crm_scrules
    params:
      columns:
        rule_id: rule_id_crm_scrules
        rule: rule_crm_scrules
        start_date: start_date_crm_scrules
        end_date: end_date_crm_scrules
        sap_cluster: sap_cluster_crm_scrules
      distinct: true

  - kind: join
    name: join_crm
    context_name: select_crm_but000
    params:
      - other:
          select_crm_crmm_but_tdar011
        how:
          inner
        columns:
          partner_guid_crm_but000: partner_guid_crm_crmm_but_tdar011
          sap_cluster_crm_but000: sap_cluster_crm_crmm_but_tdar011
      - other:
          select_crm_scrules
        how:
          inner
        columns:
          rule_id_crm_crmm_but_tdar011: rule_id_crm_scrules          
          sap_cluster_crm_crmm_but_tdar011: sap_cluster_crm_scrules


  - kind: filter
    name: filter_crm
    context_name: join_crm
    params:
      - condition: to_date(substr(valid_to_crm_crmm_but_tdar011,0,8),'yyyyMMdd') = '9999-12-31' AND xpcpt_crm_but000 <> 'X' and if(sap_cluster_crm_but000 = 'CL1', partner_crm_but000 like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'), partner_crm_but000 like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))


  - kind: add
    name: add_mdg
    context_name: filter_mdg
    params:
      - column: hash_mdg
        expression: md5(concat(
                    partner_mdg_but000, 
                    partner_guid_mdg_but000,
                    rule_type_mdg_crmm_but_tdar011, 
                    start_date_mdg_scrules, 
                    end_date_mdg_scrules, 
                    rule_mdg_scrules))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_crm
    context_name: filter_crm
    params:
      - column: hash_crm
        expression: md5(concat(
                    partner_crm_but000, 
                    partner_guid_crm_but000,
                    rule_type_crm_crmm_but_tdar011, 
                    start_date_crm_scrules, 
                    end_date_crm_scrules, 
                    rule_crm_scrules))

  - kind: checkpoint
    name: checkpoint_crm
    context_name: add_crm

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_crm
        how:
          full
        columns:
          hash_mdg: hash_crm

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_crm) or hash_crm = ''

  - kind: join
    name: join_non_matching_crm
    context_name: checkpoint_crm
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_crm: hash_mdg

  - kind: filter
    name: filter_non_matching_crm
    context_name: join_non_matching_crm
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        partner_mdg_but000: partner_mdg
        partner_guid_mdg_but000: partner_guid_mdg
        rule_type_mdg_crmm_but_tdar011: rule_type_mdg
        rule_mdg_scrules: rule_mdg
        start_date_mdg_scrules: valid_from_mdg
        end_date_mdg_scrules: valid_to_mdg
        name_last_mdg_but000: name_last_mdg
        name_first_mdg_but000: name_first_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_crm
    context_name: filter_non_matching_crm
    params:
      columns:
        partner_crm_but000: partner_crm
        partner_guid_crm_but000: partner_guid_crm
        rule_type_crm_crmm_but_tdar011: rule_type_crm
        rule_crm_scrules: rule_crm
        start_date_crm_scrules: valid_from_crm
        end_date_crm_scrules: valid_to_crm
        name_last_crm_but000: name_last_crm
        name_first_crm_but000: name_first_crm
        hash_crm: hash_crm
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_crm
    context_name: select_non_matching_crm

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01'

  - kind: select
    name: select_knvv
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        vkorg: vkorg
        kvgr4: kvgr4
        vtweg: vtweg
        spart: spart

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_crm
        how:
          full
        columns:
          partner_mdg: partner_crm
          rule_type_mdg: rule_type_crm
          partner_guid_mdg: partner_guid_crm


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_crm: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

  - kind: join
    name: join_missing_from_crm
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_crm
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_crm, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''BUSINESS APPOINTMENTS'''
      - column: src_system
        expression: '''crm'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from crm

  - kind: filter
    name: filter_missing_from_crm
    context_name: join_missing_from_crm
    params:
      - condition:
          isnull(partner_crm)

  - kind: add
    name: add_missing_from_crm
    context_name: filter_missing_from_crm
    params:
      - column: msg
        expression: if(isnull(partner_crm), 'data missing from crm', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''BUSINESS APPOINTMENTS'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''crm'''
      - column: loading_date
        expression: current_date()
# start date of validity

  - kind: filter
    name: filter_start_date_of_validity
    context_name: join_missing_from_crm
    params:
      - condition:
          partner_crm = partner_mdg
          and rule_type_crm = rule_type_mdg
          and valid_from_crm <> valid_from_mdg

  - kind: add
    name: add_start_date_of_validity
    context_name: filter_start_date_of_validity
    params:
      - column: msg
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and valid_from_crm <> valid_from_mdg, 'attributes are mismatching', '-')
      - column: attr_name
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and valid_from_crm <> valid_from_mdg, concat('BUSINESS APPOINTMENT:', ' Start date of validity'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''BUSINESS APPOINTMENTS'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''crm'''
      - column: loading_date
        expression: current_date()

# end date of validity

  - kind: filter
    name: filter_end_date_of_validity
    context_name: join_missing_from_crm
    params:
      - condition:
          partner_crm = partner_mdg
          and rule_type_crm = rule_type_mdg
          and valid_to_crm <> valid_to_mdg

  - kind: add
    name: add_end_date_of_validity
    context_name: filter_end_date_of_validity
    params:
      - column: msg
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and valid_to_crm <> valid_to_mdg, 'attributes are mismatching', '-')
      - column: attr_name
        expression: if(partner_crm = partner_mdg 
                    and rule_type_crm = rule_type_mdg 
                    and valid_to_crm <> valid_to_mdg, concat('BUSINESS APPOINTMENT:', ' End date of validity'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
