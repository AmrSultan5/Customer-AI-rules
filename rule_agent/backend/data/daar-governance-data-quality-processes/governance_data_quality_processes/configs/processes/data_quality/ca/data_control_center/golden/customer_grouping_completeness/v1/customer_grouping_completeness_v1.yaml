#SELECT RCCOMP_238.7
  - kind: select
    name: select_rccomp_238_7
    context_name: join_dcso_dcg_dch
    params:
      columns:
        customer_code: customer_code
        customer_group_4_code: customer_group_4_code
        l3_customer_code: l3_customer_code
        l1_customer_code: l1_customer_code
        l2_customer_code: l2_customer_code
        l5_customer_code: l5_customer_code
        l4_customer_code: l4_customer_code
        l6_customer_code: l6_customer_code
        business_partner_guid: business_partner_guid
      distinct: true   

  - kind: add
    name: add_rccomp_238_7
    context_name: select_rccomp_238_7
    params:
      - column: rule_code
        expression: "'RCCOMP_238.7'"
      - column: check_status
        expression: if(customer_group_4_code not in('DEC', 'DTS', 'DI'), '', 
                    if(isnotnull(l3_customer_code) and l3_customer_code <> '' and l3_customer_code <> '-1' 
                    and isnotnull(l1_customer_code) and l1_customer_code <> '' and l1_customer_code <> '-1' 
                    and isnotnull(l2_customer_code) and l2_customer_code <> '' and l2_customer_code <> '-1' 
                    and isnotnull(l5_customer_code) and l5_customer_code <> '' and l5_customer_code <> '-1' 
                    and isnotnull(l4_customer_code) and l4_customer_code <> '' and l4_customer_code <> '-1' 
                    and isnotnull(l6_customer_code) and l6_customer_code <> '' 
                    and isnotnull(business_partner_guid) and business_partner_guid <> '' 
                    , '1', '0'))
      - column: rccomp_238_7
        expression: concat_ws('_', l1_customer_code, l2_customer_code, 
                    l3_customer_code, l4_customer_code, l5_customer_code, l6_customer_code)

  - kind: select
    name: select_rccomp_238_7_final
    context_name: add_rccomp_238_7
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        rccomp_238_7: value_checked
      distinct: true  

#SELECT RCCOMP_244.2
  - kind: select
    name: select_rccomp_244_2
    context_name: filter_global_customer_trading_group
    params:
      columns:
        customer_code: customer_code
        central_order_block_code: central_order_block_code
        account_group_code: account_group_code
        global_customer_code: global_customer_code
        global_customer_code_c: global_customer_code_c
        global_customer_code_d: global_customer_code_d
      distinct: true   

  - kind: add
    name: add_rccomp_244_2
    context_name: select_rccomp_244_2
    params:
      - column: rule_code
        expression: "'RCCOMP_244.2'"
      - column: check_status
        expression: if(central_order_block_code in('S1', 'E', 'G', 'R', 'U', 'S', 'S3', 'S4', 'SP', 'SY', 'IA', 'IB', 'RN', 'S2', 'S5', 'S9') 
                    or account_group_code like '7%', '', 
                    if(isnotnull(global_customer_code_c) and isnotnull(global_customer_code_d), '1', '0'))   

  - kind: select
    name: select_rccomp_244_2_final
    context_name: add_rccomp_244_2
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        global_customer_code: value_checked
      distinct: true  

