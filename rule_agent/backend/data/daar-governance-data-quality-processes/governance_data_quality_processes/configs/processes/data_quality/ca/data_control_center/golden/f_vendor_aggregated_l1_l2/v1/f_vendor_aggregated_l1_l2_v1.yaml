  - kind: add
    name: add_check_status_expression
#    context_name: join_dm_vendor_check_results_max_check_date
    context_name: read_dm_vendor_check_results
    params:
      - column: check_status_expression
        expression: IF(check_status = '', '2', check_status)

  - kind: group
    name: group_max_check_status
    context_name: add_check_status_expression
    params:
      - aggs:
          check_status_expression: min
        by:
        - vendor_code
        - country_code
        - rule_code
        - check_date

  - kind: add
    name: add_checks_expressions
    context_name: group_max_check_status
    params:
      - column: failed_checks
        expression: IF(min_check_status_expression = '0', 1, 0)
      - column: passed_checks
        expression: IF(min_check_status_expression = '1', 1, 0)
      - column: skipped_checks
        expression: IF(min_check_status_expression = '2', 1, 0)

  - kind: select
    name: select_counts_pre_group
    context_name: add_checks_expressions
    params:
      columns:
        country_code: country_code
        vendor_code: vendor_code
        rule_code: rule_code
        failed_checks: failed_checks
        passed_checks: passed_checks
        skipped_checks: skipped_checks
        check_date: check_date

  - kind: group
    name: group_sum_check_status
    context_name: select_counts_pre_group
    params:
      - aggs:
          failed_checks: sum
          passed_checks: sum
          skipped_checks: sum
        by:
        - vendor_code
        - country_code
        - rule_code
        - check_date

  - kind: select
    name: select_dm_vendor_check_results
    context_name: group_sum_check_status
    params:
      columns:
        rule_code: rule_code
        vendor_code: vendor_code
        country_code: country_code
        sum_failed_checks: failed_checks
        sum_passed_checks: passed_checks
        sum_skipped_checks: skipped_checks

  - kind: add
    name: add_dm_vendor_company
    context_name: read_dm_vendor_company
    params:
      - column: ifnull_company_code
        expression: ifnull(company_code, 'null')

  - kind: select
    name: select_dm_vendor_company
    context_name: add_dm_vendor_company
    params:
      columns:
        vendor_code: vendor_code
        ifnull_company_code: company_code
        country_code: country_code
      distinct: true 

  - kind: add
    name: add_dim_vendor_classification
    context_name: read_dim_vendor_classification
    params:
      - column: ifnull_account_group_code
        expression: ifnull(account_group_code, 'null')
      - column: ifnull_company_code
        expression: ifnull(company_code, 'null')
      - column: ifnull_purchasing_organization_code
        expression: ifnull(purchasing_organization_code, 'null')

  - kind: select
    name: select_dim_vendor_classification
    context_name: add_dim_vendor_classification
    params:
      columns:
        ifnull_account_group_code: vendor_account_group_code
        ifnull_company_code: company_code
        vend_class_id: vend_class_id
        ifnull_purchasing_organization_code: purchasing_organization_code
        preferred_vendor: preferred_vendor
      distinct: true


  - kind: add
    name: add_dm_vendor_purchasing_organization
    context_name: read_dm_vendor_purchasing_organization
    params:
      - column: ifnull_purchasing_organization_code
        expression: ifnull(purchasing_organization_code, 'null')
      - column: ifnull_preferred_vendor
        expression: if(isnull(preferred_vendor) or preferred_vendor= '', '0', '1')

  - kind: select
    name: select_dm_vendor_purchasing_organization
    context_name: add_dm_vendor_purchasing_organization
    params:
      columns:
        vendor_code : vendor_code
        ifnull_purchasing_organization_code: purchasing_organization_code
        ifnull_preferred_vendor: preferred_vendor       
      distinct: true

  - kind: add
    name: add_dm_vendor_general
    context_name: read_dm_vendor_general
    params:
      - column: ifnull_vendor_account_group_code
        expression: ifnull(vendor_account_group_code, 'null')

  - kind: select
    name: select_dm_vendor_general
    context_name: add_dm_vendor_general
    params:
      columns:
        vendor_code: vendor_code
        ifnull_vendor_account_group_code : vendor_account_group_code
        vendor_name1: vendor_name1
      distinct: true   

  - kind: filter
    name: filter_dim_rules_inventory
    context_name: read_dim_rules_inventory
    params:
      - condition:
          is_active = '1'

  - kind: select
    name: select_dim_rules_inventory
    context_name: filter_dim_rules_inventory
    params:
      columns:
        rule_code: rule_code
      distinct: true

  - kind: join
    name: join_vendor_aggregated
    context_name: select_dm_vendor_check_results
    params:
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code
      - other:
          select_dm_vendor_general
        how:
          inner
        columns:
          vendor_code: vendor_code
      - other:
          select_dm_vendor_company
        how:
          inner
        columns:
          vendor_code: vendor_code
          country_code: country_code
      - other:
          select_dm_vendor_purchasing_organization
        how:
          inner
        columns:
          vendor_code: vendor_code                 
      - other:
          select_dim_vendor_classification
        how:
          left
        columns:
          vendor_account_group_code: vendor_account_group_code
          company_code: company_code   
          purchasing_organization_code: purchasing_organization_code
          preferred_vendor: preferred_vendor

  - kind: group
    name: group_vendor_aggregated
    context_name: join_vendor_aggregated
    params:
      - aggs:
          failed_checks: sum
          passed_checks: sum
          skipped_checks: sum
        by:
        - country_code
        - rule_code
        - vend_class_id

  - kind: add
    name: add_vendor_aggregated_calculations
    context_name: group_vendor_aggregated
    params:
      - column: total_checks
        expression: sum_failed_checks + sum_passed_checks
      - column: total_records
        expression: sum_failed_checks + sum_passed_checks + sum_skipped_checks
      - column: loading_date
        expression: current_date()

  - kind: cast
    name: cast_integers
    context_name: add_vendor_aggregated_calculations
    params:
      - column: sum_failed_checks
        to: integer
      - column: sum_passed_checks
        to: integer
      - column: sum_skipped_checks
        to: integer
      - column: total_checks
        to: integer
      - column: total_records
        to: integer

  - kind: select
    name: select_f_vendor_aggregated
    params:
      columns:
        country_code: country_code
        rule_code: rule_code
        vend_class_id: vend_class_id
        loading_date: loading_date
        sum_failed_checks: failed_checks
        sum_passed_checks: passed_checks
        sum_skipped_checks: skipped_checks
        total_checks: total_checks
        total_records: total_records
      distinct: true

  - kind: write_dataio
    name: write_f_vendor_aggregated_l1_l2
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_vendor_aggregated_l1_l2
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
