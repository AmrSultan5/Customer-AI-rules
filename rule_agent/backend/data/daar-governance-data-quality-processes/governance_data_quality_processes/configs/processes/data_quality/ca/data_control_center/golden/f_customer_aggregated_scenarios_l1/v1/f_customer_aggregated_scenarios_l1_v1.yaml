transform:
  name: f_customer_aggregated_scenarios_l1
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_sales_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_hierarchy

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_check_results

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_territory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_territory

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_rules_inventory

  - kind: filter
    name: filter_dim_rules_inventory
    params:
      - condition:
          is_active = '1'

  - kind: select
    name: select_dim_rules_inventory
    context_name: filter_dim_rules_inventory
    params:
      columns:
        rule_code: rule_code
        quality_category: quality_category
        is_field_mandatory: is_field_mandatory
      distinct: true

  - kind: select
    name: select_dm_customer_general
    context_name: read_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        central_order_block_code: central_order_block_code
        account_group_code: account_group_code
        country_code: country_code
        customer_visits_flag: customer_visits_flag
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_sales_organization
    context_name: read_dm_customer_sales_organization
    params:
      columns:
        customer_code: customer_code
        customer_group_4_code: customer_group
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_hierarchy
    context_name: read_dm_customer_hierarchy
    params:
      columns:
        l7_customer_code: l7_customer_code
        l3_customer_code: l3_customer_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_check_results
    context_name: read_dm_customer_check_results
    params:
      columns:
        customer_code: customer_code
        check_status: check_status
        rule_code: rule_code
      distinct: true

  - kind: filter
    name: filter_dm_customer_check_results
    params:
      - condition:
          (check_status == '0' or check_status == '1')

#Select dm_customer_territory

  - kind: filter
    name: filter_dm_customer_territory
    context_name: read_dm_customer_territory
    params:
      - condition:
          territory_Type = 'BD'

  - kind: select
    name: select_dm_customer_territory
    context_name: filter_dm_customer_territory
    params:
      columns:
        customer_code: customer_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_country_rule_exception
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_country_rule_exception

  - kind: select
    name: select_conf_country_rule_exception
    context_name: read_conf_country_rule_exception
    params:
      columns:
        rule_code: rule_code_exception
        country_code: country_code
      distinct: true

  - kind: join
    name: join_f_customer_aggregated_scenarios_l1
    context_name: select_dm_customer_general
    params:
      - other:
          filter_dm_customer_check_results
        how:
          inner
        columns:
          customer_code: customer_code
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code
      - other:
          select_dm_customer_sales_organization
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_hierarchy
        how:
          left
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_territory
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_conf_country_rule_exception
        how:
          left
        columns:
          rule_code: rule_code_exception
          country_code: country_code

  - kind: add
    name: add_f_customer_aggregated_scenarios_l1
    context_name: join_f_customer_aggregated_scenarios_l1
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"
      - column: scenario_1
        expression: if(is_field_mandatory = 'Mandatory', '1', null)
      - column: scenario_2
        expression: if(account_group_code LIKE '9%'
                    and customer_visits_flag IN ('2', '3')
                    and is_field_mandatory = 'Mandatory'
                    and isnull(rule_code_exception), '2', null)
      - column: customers_failing_comp_conf
        expression: if(quality_category in('Completeness', 'Conformity')
                    and check_status = '0', 1, null)
      - column: customers_failing_comp
        expression: if(quality_category = 'Completeness'
                    and check_status ='0', 1, null)
      - column: customers_failing_conf
        expression: if(quality_category = 'Conformity'
                    and check_status ='0', 1, null)
      - column: customers_universe_comp_conf
        expression: if(quality_category in('Completeness', 'Conformity')
                    and check_status in ('0', '1'), 1, null)
      - column: customers_universe_comp
        expression: if(quality_category = 'Completeness'
                    and check_status in ('0', '1'), 1, null)
      - column: customers_universe_conf
        expression: if(quality_category = 'Conformity'
                    and check_status in ('0', '1'), 1, null)

  - kind: rename
    name: rename_scenario_1
    context_name: add_f_customer_aggregated_scenarios_l1
    params:
      - column: scenario_1
        to: scenario_id

  - kind: filter
    name: filter_scenario_1
    context_name: rename_scenario_1
    params:
      - condition:
          isnotnull(scenario_id)

  - kind: group
    name: group_max_scenario_1
    context_name: filter_scenario_1
    params:
      - aggs:
          customers_failing_comp_conf: max
          customers_failing_comp: max
          customers_failing_conf: max
          customers_universe_comp_conf: max
          customers_universe_comp: max
          customers_universe_conf: max

        by:
        - customer_code
        - country_code
        - loading_date
        - scenario_id

  - kind: rename
    name: rename_scenario_2
    context_name: add_f_customer_aggregated_scenarios_l1
    params:
      - column: scenario_2
        to: scenario_id

  - kind: filter
    name: filter_scenario_2
    context_name: rename_scenario_2
    params:
      - condition:
          isnotnull(scenario_id)


  - kind: group
    name: group_max_scenario_2
    context_name: filter_scenario_2
    params:
      - aggs:
          customers_failing_comp_conf: max
          customers_failing_comp: max
          customers_failing_conf: max
          customers_universe_comp_conf: max
          customers_universe_comp: max
          customers_universe_conf: max

        by:
        - customer_code
        - country_code
        - loading_date
        - scenario_id

  - kind: union
    name: union_scenario_id
    context_name: group_max_scenario_1
    params:
      allow_missing: false
      by_name: false
      other: group_max_scenario_2

  - kind: group
    name: group_f_customer_aggregated_scenarios_l1
    context_name: union_scenario_id
    params:
      - aggs:
          max_customers_failing_comp_conf: sum
          max_customers_failing_comp: sum
          max_customers_failing_conf: sum
          max_customers_universe_comp_conf: sum
          max_customers_universe_comp: sum
          max_customers_universe_conf: sum

        by:
        - country_code
        - loading_date
        - scenario_id


  - kind: select
    name: select_f_customer_aggregated_scenarios_l1
    context_name: group_f_customer_aggregated_scenarios_l1
    params:
      columns:
        country_code: country_code
        scenario_id: scenario_id
        loading_date: loading_date
        sum_max_customers_failing_comp_conf: customers_failing_comp_conf
        sum_max_customers_failing_comp: customers_failing_comp
        sum_max_customers_failing_conf: customers_failing_conf
        sum_max_customers_universe_comp_conf: customers_universe_comp_conf
        sum_max_customers_universe_comp: customers_universe_comp
        sum_max_customers_universe_conf: customers_universe_conf
      distinct: true

  - kind: write_dataio
    name: write_f_customer_aggregated_scenarios_l1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_customer_aggregated_scenarios_l1
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full
      convert_to_target_schema: True