transform:
  name: isscom_standard
  operations:

  - kind: read_dataio
    name: read_dm_customer
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_customer
      schema_version: v4

  - kind: read_dataio
    name: read_dm_org_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_org_hierarchy
      schema_version: v1

  - kind: read_dataio
    name: read_dm_cust_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_cust_hierarchy
      schema_version: v1


  - kind: read_dataio
    name: read_stc_tc_cac_matrix
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: master_data_quality
      object_name: stc_tc_cac_matrix
      schema_version: v1


  - kind: select
    name: select_c1
    context_name: read_dm_customer
    params:
      columns:
        customer_code: customer_code
        customer_name: customer_name
        customer_activity_cluster_code: customer_activity_cluster_code
        customer_activity_cluster_name: customer_activity_cluster_name
        trade_channel_code: trade_channel_code
        trade_channel_name: trade_channel_name
        sub_trade_channel_code: sub_trade_channel_code
        sub_trade_channel_name: sub_trade_channel_name
        order_block_code: order_block_code
        order_block_name: order_block_name
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        sales_org_code: sales_org_code
        division_code: division_code
        distribution_channel_code: distribution_channel_code
        account_group_code: account_group_code
        is_l7_customer_in_scope: is_l7_customer_in_scope
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_c2
    context_name: read_dm_customer
    params:
      columns:
        customer_code: customer_code_c2
        customer_name: customer_name_c2
        sales_org_code: sales_org_code_c2
        sap_cluster: sap_cluster_c2
      distinct: true

  - kind: select
    name: select_oh
    context_name: read_dm_org_hierarchy
    params:
      columns:
        sales_org_code: sales_org_code_oh
        country_code: country_code
      distinct: true

  - kind: select
    name: select_ch
    context_name: read_dm_cust_hierarchy
    params:
      columns:
        l7_customer_code: l7_customer_code
        l3_customer_code: l3_customer_code
        l7_division_code: l7_division_code
        l7_distribution_channel_code: l7_distribution_channel_code
        sap_cluster: sap_cluster_ch
      distinct: true

  - kind: select
    name: select_ref
    context_name: read_stc_tc_cac_matrix
    params:
      columns:
        trade_channel: trade_channel
        sub_trade_channel: sub_trade_channel
        cac: cac
      distinct: true

  - kind: join
    name: join_all
    context_name: select_c1
    params:
      - other:
          select_oh
        how:
          inner
        columns:
          sales_org_code: sales_org_code_oh

      - other:
          select_ch
        how:
          left
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster_ch

      - other:
          select_c2
        how:
          left
        columns:
          l3_customer_code: customer_code_c2
          sales_org_code: sales_org_code_c2
          sap_cluster: sap_cluster_c2

      - other:
          select_ref
        how:
          left
        columns:
          trade_channel_code: trade_channel
          sub_trade_channel_code: sub_trade_channel
          customer_activity_cluster_code: cac

  - kind: filter
    name: filter_main
    context_name: join_all
    params:
      - condition: |
          division_code = '01'
          AND distribution_channel_code = '01'
          AND account_group_code LIKE '90%'
          AND order_block_code NOT IN ('S', 'SP', 'E', 'G', 'S2', 'S3', 'S4', 'S5', 'S9', 'R', 'U')
          AND is_l7_customer_in_scope = '1'
          AND l7_division_code = '01'
          AND l7_distribution_channel_code = '01'

  - kind: add
    name: add_flags
    context_name: filter_main
    params:
      - column: attribute_1_missing_check_flag
        expression: if(isnull(customer_activity_cluster_code) or customer_activity_cluster_code = '', '0', '1')
      - column: attribute_6_missing_check_flag
        expression: if(isnull(trade_channel_code) or trade_channel_code = '', '0', '1')
      - column: attribute_7_missing_check_flag
        expression: if(isnull(sub_trade_channel_code) or sub_trade_channel_code = '', '0', '1')
      - column: consistency_check_flag
        expression: if(isnull(cac) or cac = '', '0', '1')

  - kind: select
    name: select_output
    context_name: add_flags
    params:
      columns:
        customer_code: customer_code
        customer_name: customer_name
        customer_activity_cluster_code: customer_activity_cluster_code
        customer_activity_cluster_name: customer_activity_cluster_name
        trade_channel_code: trade_channel_code
        trade_channel_name: trade_channel_name
        sub_trade_channel_code: sub_trade_channel_code
        sub_trade_channel_name: sub_trade_channel_name
        order_block_code: order_block_code
        order_block_name: order_block_name
        customer_code_c2: customer_hier_3_code
        customer_name_c2: customer_hier_3_name
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        country_code: country_code
        sales_org_code: sales_org_code
        attribute_1_missing_check_flag: attribute_1_missing_check_flag
        attribute_6_missing_check_flag: attribute_6_missing_check_flag
        attribute_7_missing_check_flag: attribute_7_missing_check_flag
        consistency_check_flag: consistency_check_flag
      distinct: true


  - kind: add
    name: add_dq_message_output
    params:
      - column: dq_message_output
        expression: |
          CASE
            WHEN attribute_1_missing_check_flag  != '1' AND attribute_6_missing_check_flag = '1' AND attribute_7_missing_check_flag = '1' THEN 'Missing Attribute 1'
            WHEN attribute_1_missing_check_flag  = '1' AND attribute_6_missing_check_flag != '1' AND attribute_7_missing_check_flag = '1' THEN 'Missing Attribute 6'
            WHEN attribute_1_missing_check_flag  = '1' AND attribute_6_missing_check_flag = '1' AND attribute_7_missing_check_flag != '1' THEN 'Missing Attribute 7'
            WHEN attribute_1_missing_check_flag  != '1' AND attribute_6_missing_check_flag != '1' AND attribute_7_missing_check_flag = '1'  THEN 'Missing Attribute 1, 6'
            WHEN attribute_1_missing_check_flag  != '1' AND attribute_6_missing_check_flag = '1' AND attribute_7_missing_check_flag != '1' THEN 'Missing Attribute 1, 7'
            WHEN attribute_1_missing_check_flag  = '1' AND attribute_6_missing_check_flag != '1' AND attribute_7_missing_check_flag != '1' THEN 'Missing Attribute 6, 7'
            WHEN attribute_1_missing_check_flag  != '1' AND attribute_6_missing_check_flag != '1' AND attribute_7_missing_check_flag != '1' THEN 'Missing Attribute 1, 6, 7'
            WHEN attribute_1_missing_check_flag = '1' AND attribute_6_missing_check_flag = '1' AND attribute_7_missing_check_flag = '1' AND consistency_check_flag = '0' THEN 'Inconsistency between attributes - Please check CAC-TC-STC combination with reference table'
            WHEN attribute_1_missing_check_flag = '1' AND attribute_6_missing_check_flag = '1' AND attribute_7_missing_check_flag = '1' AND consistency_check_flag = '1' THEN 'OK'
            ELSE 'OK'
          END
 


  - kind: select
    name: select_detailed
    params:
      columns:
        customer_code: customer_code
        customer_name: customer_name
        customer_activity_cluster_code: customer_activity_cluster_code
        customer_activity_cluster_name: customer_activity_cluster_name
        trade_channel_code: trade_channel_code
        trade_channel_name: trade_channel_name
        sub_trade_channel_code: sub_trade_channel_code
        sub_trade_channel_name: sub_trade_channel_name
        order_block_code: order_block_code
        order_block_name: order_block_name
        customer_hier_3_code: customer_hier_3_code
        customer_hier_3_name: customer_hier_3_name
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        country_code: country_code
        sales_org_code: sales_org_code
        attribute_1_missing_check_flag: attribute_1_missing_check_flag
        attribute_6_missing_check_flag: attribute_6_missing_check_flag
        attribute_7_missing_check_flag: attribute_7_missing_check_flag
        consistency_check_flag: consistency_check_flag
        dq_message_output: dq_message_output
      distinct: true

  - kind: write_dataio
    name: write_detailed
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: isscom_standard
      namespace: golden
      object_name: detailed_status
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full

## AGGREGATED LAYER

#GROUP 1 completeness

  - kind: add
    #context_name: select_detailed  
    name: add_aggregated_group_1_completeness
    params:
     - column: total_records
       expression: IF(customer_code != '', 1, NULL)
     - column: total_checks
       expression: IF(customer_code != '', 1, NULL)

     - column: invalid_records
       expression: IF(consistency_check_flag='0' or attribute_6_missing_check_flag = '0' or attribute_7_missing_check_flag='0', 1, NULL)

  - kind: group
    name: group_group_1_completeness
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_records: count
        by:
        - country_code
        - customer_group_4_name
        - customer_group_4_code

        
  - kind: add
    name: add_aggregated_group_12_completeness
    params:
     - column: group
       expression: '"Group 1"'
     - column: quality_category
       expression: '"completeness/accuracy"'

  - kind: select
    name: select_group_1_completeness
    params:
      columns:
        country_code: country_code
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        count_total_records: count_total_records
        count_total_checks: count_total_checks
        quality_category: quality_category
        count_invalid_records: count_invalid_records
      distinct: true

