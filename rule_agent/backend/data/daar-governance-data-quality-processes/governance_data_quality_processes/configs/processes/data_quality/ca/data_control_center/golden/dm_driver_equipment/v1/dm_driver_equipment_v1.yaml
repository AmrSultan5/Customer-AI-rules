transform:
  name: dm_driver_equipment
  operations:

  # Read LOT_VO_DRVEQ (driver equipment assignments)
  - kind: read_dataio
    name: read_lot_vo_drveq
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: otc_leo
      object_name: lot_vo_drveq
      schema_version: v1

  # Select and rename columns for final datamart schema
  - kind: select
    name: select_dm_driver_equipment
    context_name: read_lot_vo_drveq
    params:
      columns:
        drv_id: driver_id
        eqnr: equipment_number
        sap_cluster: sap_cluster
        sap_read_timestamp: sap_read_timestamp
      distinct: true

  # Write to golden datamart
  - kind: write_dataio
    name: write_dm_driver_equipment
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_driver_equipment
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
