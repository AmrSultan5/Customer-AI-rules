# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_d365
    params:
      - condition:
          partner_d365 = partner_mdg
          and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')
          and (name_org1_d365 <> name_org1_mdg
          or name_org2_d365 <> name_org2_mdg
          or bu_sort1_d365 <> bu_sort1_mdg
          or bu_sort2_d365 <> bu_sort2_mdg
          or location_1_d365 <> location_1_mdg
          or location_2_d365 <> location_2_mdg
          or location_3_d365 <> location_3_mdg
          or legal_enty_d365 <> legal_enty_mdg
          or bu_group_d365 <> bu_group_mdg )


  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_name_org1
        expression: if(partner_d365 = partner_mdg
                    and name_org1_d365 <> name_org1_mdg, 'attributes are mismatching', '-')
      - column: msg_name_org2
        expression: if(partner_d365 = partner_mdg
                    and name_org2_d365 <> name_org2_mdg, 'attributes are mismatching', '-')
      - column: msg_bu_sort1
        expression: if(partner_d365 = partner_mdg
                    and bu_sort1_d365 <> bu_sort1_mdg, 'attributes are mismatching', '-')
      - column: msg_bu_sort2
        expression: if(partner_d365 = partner_mdg 
                    and bu_sort2_d365 <> bu_sort2_mdg, 'attributes are mismatching', '-')
      - column: msg_location_1
        expression: if(partner_d365 = partner_mdg 
                    and location_1_d365 <> location_1_mdg, 'attributes are mismatching', '-')
      - column: msg_location_2
        expression: if(partner_d365 = partner_mdg
                    and location_2_d365 <> location_2_mdg, 'attributes are mismatching', '-')
      - column: msg_location_3
        expression: if(partner_d365 = partner_mdg
                    and location_3_d365 <> location_3_mdg, 'attributes are mismatching', '-')
      - column: msg_legal_enty
        expression: if(partner_d365 = partner_mdg
                    and upper(legal_enty_d365) <> upper(legal_enty_mdg), 'attributes are mismatching', '-')
      - column: msg_bu_group
        expression: if(partner_d365 = partner_mdg
                    and bu_group_d365 <> bu_group_mdg, 'attributes are mismatching', '-')

      - column: attr_name_name_org1
        expression: if(partner_d365 = partner_mdg
                    and name_org1_d365 <> name_org1_mdg, concat('NAME :', ' ', ' NAME_ORG1'), '-')
      - column: attr_name_name_org2
        expression: if(partner_d365 = partner_mdg
                    and name_org2_d365 <> name_org2_mdg, concat('NAME :', ' ', ' NAME_ORG2'), '-')
      - column: attr_name_bu_sort1
        expression: if(partner_d365 = partner_mdg
                    and bu_sort1_d365 <> bu_sort1_mdg, concat('NAME :', ' ', ' BU_SORT1'), '-')
      - column: attr_name_bu_sort2
        expression: if(partner_d365 = partner_mdg 
                    and bu_sort2_d365 <> bu_sort2_mdg, concat('NAME :', ' ', ' BU_SORT2'), '-')
      - column: attr_name_location_1
        expression: if(partner_d365 = partner_mdg
                    and location_1_d365 <> location_1_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_1'), '-')
      - column: attr_name_location_2
        expression: if(partner_d365 = partner_mdg
                    and location_2_d365 <> location_2_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_2'), '-')
      - column: attr_name_location_3
        expression: if(partner_d365 = partner_mdg
                    and location_3_d365 <> location_3_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_3'), '-')
      - column: attr_name_legal_enty
