        schema_version: v1

    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1

    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1

    - kind: filter
      name: filter_t077x
      params:
        - condition: spras = 'E' and sap_cluster = 'CL1'

    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true

    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1

    - kind: filter
      name: filter_tvv4t
      params:
        - condition: sap_cluster = 'CL1' and spras = 'E'

    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
      context_name: union_comparison
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            inner
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_mdg_knvv
          how:
            left
          columns:
            kunnr_kna1: KUNNR_knvv
        - other:
            select_tvv4t
          how:
            inner
          columns:
            KVGR4_knvv: KVGR4_tvv4t

    - kind: filter
      name: filter_comp_partner
      params:
        - condition: aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: add
      name: add_missing_columns
      params:
        - column: COMPARISON_LOADING_DATE
          expression: CURRENT_DATE
        - column: NULL_Value
          expression: cast(NULL as string)
        - column: DOMAIN
          expression: cast('CUSTOMER' as string)
        - column: TABLE_NAME
          expression: cast('UNLOADING POINTS' as string)
        - column: ATTRIBUTE5
          expression: CONCAT(KVGR4_knvv,' - ',BEZEI_tvv4t)
        - column: ATTRIBUTE10
          expression: CONCAT(ktokd_kna1,' - ',txt30_t077x)
        - column: COUNTRY
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
            WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
            WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
            WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
            WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
            WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
            WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
            WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
            WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
            WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
            WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
            WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
            WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
            WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
            WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
            WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
            WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
            WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
            WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
            WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
            WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
            WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
            WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
            WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
            WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
            WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
            WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
            WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
            WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END

    - kind: select
      name: select_final
      params:
        columns:
          DOMAIN: domain
          TABLE_NAME: table_name
          src_system: src_system
          tgt_system: tgt_system
          msg: dimension
          partner: primary_key_l1
          NULL_Value: primary_key_src_l2
          NULL_Value: primary_key_tgt_l2
          NULL_Value: primary_key_src_l3
          NULL_Value: primary_key_tgt_l3
          name_first: attribute1
          name_last: attribute2
          ABLAD: attribute3
          aufsd_kna1: attribute4
          ATTRIBUTE5: attribute5
          VKORG_knvv: attribute6
          VTWEG_knvv: attribute7
          SPART_knvv: attribute8
          NULL_Value: attribute9
          ATTRIBUTE10: attribute10
          COUNTRY: country
          attr_name: compared_attribute
          src_attr: compared_src_attr_value
          tgt_attr: compared_tgt_attr_value
          COMPARISON_LOADING_DATE: loading_date

