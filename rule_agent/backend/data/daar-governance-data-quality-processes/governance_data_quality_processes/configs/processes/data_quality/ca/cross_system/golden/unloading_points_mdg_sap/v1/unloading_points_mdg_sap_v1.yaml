transform:
  name: Unloading_Points_data_mdg_s4hana
  operations:
    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          partner_guid: partner_guid_mdg_but000
          name_last: name_last_mdg_but000
          name_first: name_first_mdg_but000
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_mdg_knva
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knva
        schema_version: v1

    - kind: select
      name: select_mdg_knva
      context_name: read_mdg_knva
      params:
        columns:
          KUNNR: PARTNER
          ABLAD: ABLAD
          KNFAK: KNFAK
          DEFAB: DEFAB
          MOAB1: MOAB1
          MOAB2: MOAB2
          DIAB1: DIAB1
          DIAB2: DIAB2
          MIAB1: MIAB1
          MIAB2: MIAB2
          DOAB1: DOAB1
          DOAB2: DOAB2
          FRAB1: FRAB1
          FRAB2: FRAB2
          SAAB1: SAAB1
          SAAB2: SAAB2
          SOAB1: SOAB1
          SOAB2: SOAB2
          MOBI1: MOBI1
          MOBI2: MOBI2
          DIBI1: DIBI1
          DIBI2: DIBI2
          MIBI1: MIBI1
          MIBI2: MIBI2
          DOBI1: DOBI1
          DOBI2: DOBI2
          FRBI1: FRBI1
          FRBI2: FRBI2
          SABI1: SABI1
          SABI2: SABI2
          SOBI1: SOBI1
          SOBI2: SOBI2
        distinct: true

    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: filter
      name: filter_mdg_knvv
      context_name: read_mdg_knvv
      params:
        - condition: VTWEG = '01' and SPART = '01' and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700)

    - kind: select
      name: select_mdg_knvv_checkpoint
      context_name: filter_mdg_knvv
      params:
        columns:
          KUNNR: KUNNR_knvv
          KVGR4: KVGR4_knvv
          VKORG: VKORG_knvv
          VTWEG: VTWEG_knvv
          SPART: SPART_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_mdg_knvv_checkpoint

    - kind: join
      name: join_mdg_but000
      context_name: select_mdg_knva
      params:
        - other:
            select_mdg_but000
          how:
            inner
          columns:
            PARTNER: partner_mdg_but000
        - other:
            select_mdg_knvv
          how:
            inner
          columns:
            PARTNER: KUNNR_knvv
 
    - kind: add
      name: add_mdg_HASH
      context_name: join_mdg_but000
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,ABLAD,KNFAK,DEFAB,MOAB1,MOAB2,DIAB1,DIAB2,MIAB1,MIAB2,DOAB1,DOAB2,FRAB1,FRAB2,SAAB1,SAAB2,SOAB1,SOAB2,MOBI1,MOBI2,DIBI1,DIBI2,MIBI1,MIBI2,DOBI1,DOBI2,FRBI1,FRBI2,SABI1,SABI2,SOBI1,SOBI2,partner_guid_mdg_but000))

    - kind: filter
      name: filter_mdg_knva
      context_name: add_mdg_HASH
      params:
        - condition:
            xpcpt_mdg_but000 <> 'X' AND ABLAD <> '' AND PARTNER like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '14%', '22%','47%')

    - kind: select
      name: mdg
      context_name: filter_mdg_knva
      params:
        columns:
          PARTNER: PARTNER_mdg
          ABLAD: ABLAD_mdg
          KNFAK: KNFAK_mdg
          DEFAB: DEFAB_mdg
          MOAB1: MOAB1_mdg
          MOAB2: MOAB2_mdg
          DIAB1: DIAB1_mdg
          DIAB2: DIAB2_mdg
          MIAB1: MIAB1_mdg
          MIAB2: MIAB2_mdg
          DOAB1: DOAB1_mdg
          DOAB2: DOAB2_mdg
          FRAB1: FRAB1_mdg
          FRAB2: FRAB2_mdg
          SAAB1: SAAB1_mdg
          SAAB2: SAAB2_mdg
          SOAB1: SOAB1_mdg
          SOAB2: SOAB2_mdg
          MOBI1: MOBI1_mdg
          MOBI2: MOBI2_mdg
          DIBI1: DIBI1_mdg
          DIBI2: DIBI2_mdg
          MIBI1: MIBI1_mdg
          MIBI2: MIBI2_mdg
          DOBI1: DOBI1_mdg
          DOBI2: DOBI2_mdg
          FRBI1: FRBI1_mdg
          FRBI2: FRBI2_mdg
          SABI1: SABI1_mdg
          SABI2: SABI2_mdg
          SOBI1: SOBI1_mdg
          SOBI2: SOBI2_mdg
          name_last_mdg_but000: name_last_mdg
          name_first_mdg_but000: name_first_mdg
          partner_guid_mdg_but000: partner_guid_mdg
          HASH: HASH_mdg

    - kind: read_dataio
      name: read_s4hana_knva
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knva
        schema_version: v1

    - kind: select
      name: select_s4hana_knva
      context_name: read_s4hana_knva
      params:
        columns:
          KUNNR: PARTNER
          ABLAD: ABLAD
          KNFAK: KNFAK
          DEFAB: DEFAB
          MOAB1: MOAB1
          MOAB2: MOAB2
          DIAB1: DIAB1
          DIAB2: DIAB2
          MIAB1: MIAB1
          MIAB2: MIAB2
          DOAB1: DOAB1
          DOAB2: DOAB2
          FRAB1: FRAB1
          FRAB2: FRAB2
          SAAB1: SAAB1
          SAAB2: SAAB2
          SOAB1: SOAB1
          SOAB2: SOAB2
          MOBI1: MOBI1
          MOBI2: MOBI2
          DIBI1: DIBI1
          DIBI2: DIBI2
          MIBI1: MIBI1
          MIBI2: MIBI2
          DOBI1: DOBI1
          DOBI2: DOBI2
          FRBI1: FRBI1
          FRBI2: FRBI2
          SABI1: SABI1
          SABI2: SABI2
          SOBI1: SOBI1
          SOBI2: SOBI2
          SAP_CLUSTER: SAP_CLUSTER
        distinct: true

    - kind: read_dataio
      name: read_s4hana_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_s4hana_but000
      context_name: read_s4hana_but000
      params:
        columns:
          partner: partner_s4hana_but000
          partner_guid: partner_guid_s4hana_but000
          name_last: name_last_s4hana_but000
          name_first: name_first_s4hana_but000
          xpcpt: xpcpt_s4hana_but000
          sap_cluster: sap_cluster_s4hana_but000
        distinct: true

    - kind: read_dataio
      name: read_sap_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: filter
      name: filter_sap_knvv
      context_name: read_sap_knvv
      params:
        - condition: VTWEG = '01' and SPART = '01' and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700)

    - kind: select
      name: select_sap_knvv
      context_name: filter_sap_knvv
      params:
        columns:
          KUNNR: KUNNR_knvv
          KVGR4: KVGR4_knvv
          VKORG: VKORG_knvv
          VTWEG: VTWEG_knvv
          SPART: SPART_knvv
          sap_cluster: sap_cluster_knvv
        distinct: true

    - kind: join
      name: join_s4hana_but000
      context_name: select_s4hana_knva
      params:
        - other:
            select_s4hana_but000
          how:
            inner
          columns:
            PARTNER: partner_s4hana_but000
            sap_cluster: sap_cluster_s4hana_but000
        - other:
            select_sap_knvv
          how:
            inner
          columns:
            PARTNER: KUNNR_knvv
            sap_cluster: sap_cluster_knvv

    - kind: add
      name: add_s4hana_HASH
      context_name: join_s4hana_but000
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,ABLAD,KNFAK,DEFAB,MOAB1,MOAB2,DIAB1,DIAB2,MIAB1,MIAB2,DOAB1,DOAB2,FRAB1,FRAB2,SAAB1,SAAB2,SOAB1,SOAB2,MOBI1,MOBI2,DIBI1,DIBI2,MIBI1,MIBI2,DOBI1,DOBI2,FRBI1,FRBI2,SABI1,SABI2,SOBI1,SOBI2,partner_guid_s4hana_but000))

    - kind: filter
      name: s4hana_union
      context_name: add_s4hana_HASH
      params:
        - condition: xpcpt_s4hana_but000 <> 'X' AND ABLAD <> '' and if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'), partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '14%', '22%','47%'))

    - kind: select
      name: s4hana
      context_name: s4hana_union
      params:
        columns:
          PARTNER: PARTNER_s4hana
          ABLAD: ABLAD_s4hana
          KNFAK: KNFAK_s4hana
          DEFAB: DEFAB_s4hana
          MOAB1: MOAB1_s4hana
          MOAB2: MOAB2_s4hana
          DIAB1: DIAB1_s4hana
          DIAB2: DIAB2_s4hana
          MIAB1: MIAB1_s4hana
          MIAB2: MIAB2_s4hana
          DOAB1: DOAB1_s4hana
          DOAB2: DOAB2_s4hana
          FRAB1: FRAB1_s4hana
          FRAB2: FRAB2_s4hana
          SAAB1: SAAB1_s4hana
          SAAB2: SAAB2_s4hana
          SOAB1: SOAB1_s4hana
          SOAB2: SOAB2_s4hana
          MOBI1: MOBI1_s4hana
          MOBI2: MOBI2_s4hana
          DIBI1: DIBI1_s4hana
          DIBI2: DIBI2_s4hana
          MIBI1: MIBI1_s4hana
          MIBI2: MIBI2_s4hana
          DOBI1: DOBI1_s4hana
          DOBI2: DOBI2_s4hana
          FRBI1: FRBI1_s4hana
          FRBI2: FRBI2_s4hana
          SABI1: SABI1_s4hana
          SABI2: SABI2_s4hana
          SOBI1: SOBI1_s4hana
          SOBI2: SOBI2_s4hana
          name_last_s4hana_but000: name_last_s4hana
          name_first_s4hana_but000: name_first_s4hana
          partner_guid_s4hana_but000: partner_guid_s4hana
          HASH: HASH_s4hana

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            HASH_mdg: HASH_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_s4hana is null or HASH_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          PARTNER_mdg: PARTNER_mdg
          ABLAD_mdg: ABLAD_mdg
          KNFAK_mdg: KNFAK_mdg
          DEFAB_mdg: DEFAB_mdg
          MOAB1_mdg: MOAB1_mdg
          MOAB2_mdg: MOAB2_mdg
          DIAB1_mdg: DIAB1_mdg
          DIAB2_mdg: DIAB2_mdg
          MIAB1_mdg: MIAB1_mdg
          MIAB2_mdg: MIAB2_mdg
          DOAB1_mdg: DOAB1_mdg
          DOAB2_mdg: DOAB2_mdg
          FRAB1_mdg: FRAB1_mdg
          FRAB2_mdg: FRAB2_mdg
          SAAB1_mdg: SAAB1_mdg
          SAAB2_mdg: SAAB2_mdg
          SOAB1_mdg: SOAB1_mdg
          SOAB2_mdg: SOAB2_mdg
          MOBI1_mdg: MOBI1_mdg
          MOBI2_mdg: MOBI2_mdg
          DIBI1_mdg: DIBI1_mdg
          DIBI2_mdg: DIBI2_mdg
          MIBI1_mdg: MIBI1_mdg
          MIBI2_mdg: MIBI2_mdg
          DOBI1_mdg: DOBI1_mdg
          DOBI2_mdg: DOBI2_mdg
          FRBI1_mdg: FRBI1_mdg
          FRBI2_mdg: FRBI2_mdg
          SABI1_mdg: SABI1_mdg
          SABI2_mdg: SABI2_mdg
          SOBI1_mdg: SOBI1_mdg
          SOBI2_mdg: SOBI2_mdg
          name_last_mdg: name_last_mdg
          name_first_mdg: name_first_mdg
          partner_guid_mdg: partner_guid_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          PARTNER_s4hana: PARTNER_s4hana
          ABLAD_s4hana: ABLAD_s4hana
          KNFAK_s4hana: KNFAK_s4hana
          DEFAB_s4hana: DEFAB_s4hana
          MOAB1_s4hana: MOAB1_s4hana
          MOAB2_s4hana: MOAB2_s4hana
          DIAB1_s4hana: DIAB1_s4hana
          DIAB2_s4hana: DIAB2_s4hana
          MIAB1_s4hana: MIAB1_s4hana
          MIAB2_s4hana: MIAB2_s4hana
          DOAB1_s4hana: DOAB1_s4hana
          DOAB2_s4hana: DOAB2_s4hana
          FRAB1_s4hana: FRAB1_s4hana
          FRAB2_s4hana: FRAB2_s4hana
          SAAB1_s4hana: SAAB1_s4hana
          SAAB2_s4hana: SAAB2_s4hana
          SOAB1_s4hana: SOAB1_s4hana
          SOAB2_s4hana: SOAB2_s4hana
          MOBI1_s4hana: MOBI1_s4hana
          MOBI2_s4hana: MOBI2_s4hana
          DIBI1_s4hana: DIBI1_s4hana
          DIBI2_s4hana: DIBI2_s4hana
          MIBI1_s4hana: MIBI1_s4hana
          MIBI2_s4hana: MIBI2_s4hana
          DOBI1_s4hana: DOBI1_s4hana
          DOBI2_s4hana: DOBI2_s4hana
          FRBI1_s4hana: FRBI1_s4hana
          FRBI2_s4hana: FRBI2_s4hana
          SABI1_s4hana: SABI1_s4hana
          SABI2_s4hana: SABI2_s4hana
          SOBI1_s4hana: SOBI1_s4hana
          SOBI2_s4hana: SOBI2_s4hana
          name_last_s4hana: name_last_s4hana
          name_first_s4hana: name_first_s4hana
          partner_guid_s4hana: partner_guid_s4hana
          HASH_s4hana: HASH_s4hana

###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            PARTNER_mdg: PARTNER_s4hana
            ABLAD_mdg: ABLAD_s4hana
            partner_guid_mdg: partner_guid_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns_1
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN PARTNER_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN PARTNER_s4hana IS NULL THEN 'data missing from sap' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: checkpoint
      name: data_missing_from_mdg_add_columns
      context_name: data_missing_from_mdg_add_columns_1

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg is null

    - kind: select
      name: final_data_missing_from_mdg_1
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          PARTNER_s4hana: partner
          ABLAD_s4hana: ABLAD
          name_first_s4hana: name_first
          name_last_s4hana: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: checkpoint
      name: final_data_missing_from_mdg
      context_name: final_data_missing_from_mdg_1


# ###data missing from S4HANA

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana_1
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          PARTNER_mdg: partner
          ABLAD_mdg: ABLAD
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: checkpoint
      name: final_data_missing_from_s4hana
      context_name: final_data_missing_from_s4hana_1

##mismatching FACTORY CALENDAR
    - kind: filter
      name: mismatching_factory_calendar_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND KNFAK_s4hana <> KNFAK_mdg

    - kind: add
      name: add_missing_columns_mismatching_factory_calendar
      context_name: mismatching_factory_calendar_filter
      params:
        - column: attr_name_mismatching_factory_calendar
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND KNFAK_s4hana <> KNFAK_mdg THEN concat('UNLOADING POINTS:',' FACTORY CALENDAR') END
        - column: msg_mismatching_factory_calendar
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND KNFAK_s4hana <> KNFAK_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_mismatching_factory_calendar_1
      context_name: add_missing_columns_mismatching_factory_calendar
      params:
        columns:
          PARTNER_mdg: partner
          ABLAD_mdg: ABLAD
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_mismatching_factory_calendar: msg
          attr_name_mismatching_factory_calendar: attr_name
          KNFAK_s4hana: tgt_attr
          KNFAK_mdg: src_attr

    - kind: checkpoint
      name: final_mismatching_factory_calendar
      context_name: final_mismatching_factory_calendar_1

###mismatching DEFAULT INDICATOR
    - kind: filter
      name: mismatching_default_indicator_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND DEFAB_s4hana <> DEFAB_mdg

    - kind: add
      name: add_missing_columns_mismatching_default_indicator
      context_name: mismatching_default_indicator_filter
      params:
        - column: attr_name_mismatching_default_indicator
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND DEFAB_s4hana <> DEFAB_mdg THEN concat('UNLOADING POINTS:',' DEFAULT INDICATOR') END
        - column: msg_mismatching_default_indicator
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND ABLAD_mdg = ABLAD_s4hana AND partner_guid_mdg = partner_guid_s4hana AND DEFAB_s4hana <> DEFAB_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_mismatching_default_indicator_1
      context_name: add_missing_columns_mismatching_default_indicator
      params:
        columns:
          PARTNER_mdg: partner
          ABLAD_mdg: ABLAD
