transform:
  name: detailed
  operations:
  - kind: read_dataio
    name: read_du
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: informatica_dq
      namespace: du
      object_name: bom
      schema_version: v1

  - kind: add
    name: add_dq_message_output_sales
    context_name: read_du
    params:
      - column: dq_message_output
        expression: "CASE  WHEN sales_bom_accuracy_check = '' THEN 'N/A' WHEN sales_bom_accuracy_check = '2' THEN 'Not Extended for Dummy Plant' WHEN sales_bom_accuracy_check = '3' THEN 'Costing relevancy should be unticked for Sales Bom' WHEN sales_bom_accuracy_check = '4' THEN 'Costing relevancy and ZDSC should be unticked for Sales Bom' WHEN sales_bom_accuracy_check = '5' THEN 'ZDSC should be unticked for Sales Bom' WHEN sales_bom_accuracy_check = '1' THEN 'OK' END"
      - column: dq_flag_output
        expression: " CASE WHEN sales_bom_accuracy_check IN ('2','3','4','5') THEN '0' ELSE sales_bom_accuracy_check END"
      - column: quality_category
        expression: '''Accuracy'''
      - column: quality_type
        expression: '''Sales BOM'''

  - kind: select
    name: select_detailed_sales
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type_code: material_type_code
        plant_material_status_code: plant_material_status_code
        do_not_cost_indicator: do_not_cost_indicator
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        bom_number: bom_number
        bom_material_status: bom_material_status
        bom_component_material_code: bom_component_material_code
        costing_relevancy_flag: costing_relevancy_flag
        distribution_key_code: distribution_key_code
        bom_component_material_type_code: bom_component_material_type_code
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        quality_category: quality_category
        quality_type: quality_type
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dq_message_output_compl
    context_name: read_du
    params:
      - column: dq_message_output
        expression: "CASE WHEN bom_cost_rel_completeness_check = '0' THEN 'Missing Costing Relevancy' WHEN bom_cost_rel_completeness_check = '1' THEN 'OK' ELSE 'N/A' END"
      - column: dq_flag_output
        expression: " CASE WHEN bom_cost_rel_completeness_check = '2' THEN '1' ELSE bom_cost_rel_completeness_check END"
      - column: quality_category
        expression: '''Completeness'''
      - column: quality_type
        expression: '''Costing Relevancy'''

  - kind: select
    name: select_detailed_compl
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type_code: material_type_code
        plant_material_status_code: plant_material_status_code
        do_not_cost_indicator: do_not_cost_indicator
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        bom_number: bom_number
        bom_material_status: bom_material_status
        bom_component_material_code: bom_component_material_code
        costing_relevancy_flag: costing_relevancy_flag
        distribution_key_code: distribution_key_code
        bom_component_material_type_code: bom_component_material_type_code
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        quality_category: quality_category
        quality_type: quality_type
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dq_message_output_accu
    context_name: read_du
    params:
      - column: dq_message_output
        expression: " CASE WHEN bom_cost_rel_completeness_check  = '0' THEN 'Failed at completeness' WHEN bom_cost_rel_accuracy_check = '0' THEN 'Incorrect Costing Relevancy' WHEN bom_cost_rel_accuracy_check = '1' THEN 'OK' ELSE 'N/A' END"
      - column: dq_flag_output
        expression: " CASE WHEN bom_cost_rel_accuracy_check = '2' THEN '1' ELSE bom_cost_rel_accuracy_check END"
      - column: quality_category
        expression: '''Accuracy'''
      - column: quality_type
        expression: '''Costing Relevancy'''

  - kind: select
    name: select_detailed_accu
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type_code: material_type_code
        plant_material_status_code: plant_material_status_code
        do_not_cost_indicator: do_not_cost_indicator
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        bom_number: bom_number
        bom_material_status: bom_material_status
        bom_component_material_code: bom_component_material_code
        costing_relevancy_flag: costing_relevancy_flag
        distribution_key_code: distribution_key_code
        bom_component_material_type_code: bom_component_material_type_code
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        quality_category: quality_category
        quality_type: quality_type
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dq_message_output_compl_accu
    context_name: read_du
    params:
      - column: dq_message_output
        expression: " CASE WHEN bom_dist_key_completeness_check = '0' THEN 'Missing Distribution Key' WHEN bom_dist_key_completeness_check = '1' THEN'OK' ELSE 'N/A' END"
      - column: dq_flag_output
        expression: " CASE WHEN bom_dist_key_completeness_check = '2' THEN '1' ELSE bom_dist_key_completeness_check END"
      - column: quality_category
        expression: '''Completeness'''
      - column: quality_type
        expression: '''Distribution Key'''

  - kind: select
    name: select_detailed_compl_accu
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type_code: material_type_code
        plant_material_status_code: plant_material_status_code
        do_not_cost_indicator: do_not_cost_indicator
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        bom_number: bom_number
        bom_material_status: bom_material_status
        bom_component_material_code: bom_component_material_code
        costing_relevancy_flag: costing_relevancy_flag
        distribution_key_code: distribution_key_code
        bom_component_material_type_code: bom_component_material_type_code
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        quality_category: quality_category
        quality_type: quality_type
        sap_cluster: sap_cluster
      distinct: true

  - kind: union
    name: union_compl_accu
    context_name: select_detailed_compl
    params:
      allow_missing: false
      by_name: true
      other: select_detailed_accu

  - kind: union
    name: union_compl_accu_compl_accu
    context_name: union_compl_accu
    params:
      allow_missing: false
      by_name: true
      other: select_detailed_compl_accu

  - kind: union
    name: union_compl_accu_compl_accu_sales
    context_name: union_compl_accu_compl_accu
    params:
      allow_missing: false
      by_name: true
      other: select_detailed_sales

  - kind: select
    name: select_detailed_finall
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type_code: material_type_code
        plant_material_status_code: plant_material_status_code
        do_not_cost_indicator: do_not_cost_indicator
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        bom_number: bom_number
        bom_material_status: bom_material_status
        bom_component_material_code: bom_component_material_code
        costing_relevancy_flag: costing_relevancy_flag
        distribution_key_code: distribution_key_code
        bom_component_material_type_code: bom_component_material_type_code
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        quality_category: quality_category
        quality_type: quality_type
        sap_cluster: sap_cluster
      distinct: true


  - kind: write_dataio
    name: write_detailed
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: bom
      namespace: golden
      object_name: detailed_status
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full

## AGGREGATED LAYER

#GROUP 1 SALES

  - kind: add
    name: add_aggregated_sales
    context_name: read_du
    params:
     - column: total_records
       expression: IF(material_code != '', 1, NULL)
     - column: total_checks
       expression: IF(sales_bom_accuracy_check != '', 1, NULL)
     - column: quality_type
       expression: '"Sales BOM"'
     - column: quality_category
       expression: '"Accuracy "'
     - column: invalid_checks
       expression: IF(sales_bom_accuracy_check IN ('2','3','4','5'), 1, NULL)

  - kind: group
    name: group_sales
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - quality_category
        - quality_type
        - sap_cluster

  - kind: select
    name: select_sales
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        quality_type: quality_type
        quality_category: quality_category
        count_invalid_checks: invalid_checks
        sap_cluster: sap_cluster
      distinct: true

#GROUP 1 COMPLETENESS

  - kind: add
    name: add_aggregated_completeness
    context_name: read_du
    params:
     - column: total_records
       expression: IF(material_code != '', 1, NULL)
     - column: total_checks
       expression: IF(bom_cost_rel_completeness_check != '', 1, NULL)
     - column: quality_type
       expression: '"Costing Relevancy"'
     - column: quality_category
       expression: '"Completeness"'
     - column: invalid_checks
       expression: IF(bom_cost_rel_completeness_check = '0', 1, NULL)

  - kind: group
    name: group_completeness
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - quality_category
        - quality_type
        - sap_cluster

  - kind: select
    name: select_completeness
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        quality_type: quality_type
        quality_category: quality_category
        count_invalid_checks: invalid_checks
        sap_cluster: sap_cluster
      distinct: true

#GROUP 2 ACCURACY

  - kind: add
    name: add_aggregated_accuracy
    context_name: read_du
    params:
     - column: total_records
       expression: IF(material_code != '', 1, NULL)
     - column: total_checks
       expression: IF(bom_cost_rel_accuracy_check != '', 1, NULL)
     - column: quality_type
       expression: '"Costing Relevancy"'
     - column: quality_category
       expression: '"Accuracy"'
     - column: invalid_checks
       expression: IF(bom_cost_rel_accuracy_check  = '0', 1, NULL)

  - kind: group
    name: group_accuracy
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - quality_category
        - quality_type
        - sap_cluster

  - kind: select
    name: select_accuracy
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        quality_type: quality_type
        quality_category: quality_category
        count_invalid_checks: invalid_checks
        sap_cluster: sap_cluster
      distinct: true

#GROUP 2 COMPLETENESS_ACCURACY

  - kind: add
    name: add_aggregated_completeness_accuracy
    context_name: read_du
    params:
     - column: total_records
       expression: IF(material_code != '', 1, NULL)
     - column: total_checks
       expression: IF(bom_dist_key_completeness_check != '', 1, NULL)
     - column: quality_type
       expression: '"Distribution Key"'
     - column: quality_category
       expression: '"Completeness"'
     - column: invalid_checks
       expression: IF(bom_dist_key_completeness_check = '0', 1, NULL)

  - kind: group
    name: group_completeness_accuracy
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - quality_category
        - quality_type
        - sap_cluster

  - kind: select
    name: select_completeness_accuracy
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        quality_type: quality_type
        quality_category: quality_category
        count_invalid_checks: invalid_checks
        sap_cluster: sap_cluster
      distinct: true

  - kind: union
    name: union_completeness_and_accuracy
    context_name: select_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_accuracy

  - kind: union
    name: union_completeness_and_accuracy_and_compl_accu
    context_name: union_completeness_and_accuracy
    params:
      allow_missing: false
      by_name: true
      other: select_completeness_accuracy

  - kind: union
    name: union_completeness_and_accuracy_and_compl_accu_sales
    context_name: union_completeness_and_accuracy_and_compl_accu
    params:
      allow_missing: false
      by_name: true
      other: select_sales

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: current_date()


  - kind: cast
    name: cast_to_integer
    params:
      - column: total_records
        to: integer
      - column: total_checks
        to: integer
      - column: invalid_checks
        to: integer


  - kind: select
    name: select_finall_agg
    params:
      columns:
        country_code: country_code
        total_records: total_records
        total_checks: total_checks
        quality_type: quality_type
        quality_category: quality_category
        invalid_checks: invalid_checks
        loading_date: loading_date
        sap_cluster: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: bom
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
