transform:
  name: territory_assignment_mdg_crm
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')

  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        name_last: name_last_mdg_but000
        name_first: name_first_mdg_but000
        partner_guid: partner_guid_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_mdg_zmdgc_trr
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: zmdgc_trr
      schema_version: v1

  - kind: filter
    name: filter_mdg_zmdgc_trr
    context_name: read_mdg_zmdgc_trr
    params:
      - condition:
          type in('BD', 'AG', 'CA', 'P1', 'MC', 'P2', 'P3', 'P4', 'P5')

  - kind: select
    name: select_mdg_zmdgc_trr
    context_name: filter_mdg_zmdgc_trr
    params:
      columns:
        partner: partner_mdg_zmdgc_trr
        date_to: date_to_mdg_zmdgc_trr
        date_from: date_from_mdg_zmdgc_trr
        type: type_mdg_zmdgc_trr
        terrid: terrid_mdg_zmdgc_trr
      distinct: true

  - kind: join
    name: join_mdg
    context_name: select_mdg_but000
    params:
      - other:
          select_mdg_zmdgc_trr
        how:
          inner
        columns:
          partner_mdg_but000: partner_mdg_zmdgc_trr


  - kind: read_dataio
    name: read_crm_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_crm_but000
    context_name: read_crm_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))

  - kind: select
    name: select_crm_but000
    context_name: filter_crm_but000
    params:
      columns:
        partner: partner_crm_but000
        name_last: name_last_crm_but000
        name_first: name_first_crm_but000
        partner_guid: partner_guid_crm_but000
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_crm_zbut0000p3vvi9
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: customer
      object_name: zbut0000p3vvi9
      schema_version: v1

  - kind: filter
    name: filter_crm_zbut0000p3vvi9
    context_name: read_crm_zbut0000p3vvi9
    params:
      - condition:
          type in('BD', 'AG', 'CA', 'P1', 'MC', 'P2', 'P3', 'P4', 'P5')

  - kind: select
    name: select_crm_zbut0000p3vvi9
    context_name: filter_crm_zbut0000p3vvi9
    params:
      columns:
        partner: partner_crm_zbut0000p3vvi9
        date_to: date_to_crm_zbut0000p3vvi9
        date_from: date_from_crm_zbut0000p3vvi9
        type: type_crm_zbut0000p3vvi9
        terrid: terrid_crm_zbut0000p3vvi9
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_crm
    context_name: select_crm_but000
    params:
      - other:
          select_crm_zbut0000p3vvi9
        how:
          inner
        columns:
          partner_crm_but000: partner_crm_zbut0000p3vvi9
          sap_cluster: sap_cluster

  - kind: add
    name: add_mdg
    context_name: join_mdg
    params:
      - column: hash_mdg
        expression: md5(concat(
                    partner_mdg_but000, 
                    partner_guid_mdg_but000, 
                    type_mdg_zmdgc_trr, 
                    date_format(date_to_mdg_zmdgc_trr, 'yyyyMMdd'), 
                    date_format(date_from_mdg_zmdgc_trr, 'yyyyMMdd'), 
                    terrid_mdg_zmdgc_trr))
      - column: date_to_mdg
        expression: date_format(date_to_mdg_zmdgc_trr, 'yyyyMMdd')
      - column: date_from_mdg
        expression: date_format(date_from_mdg_zmdgc_trr, 'yyyyMMdd')  

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_crm
    context_name: join_crm
    params:
      - column: hash_crm
        expression: md5(concat(
                    partner_crm_but000, 
                    partner_guid_crm_but000, 
                    type_crm_zbut0000p3vvi9, 
                    substr(date_to_crm_zbut0000p3vvi9, 0, 8), 
                    substr(date_from_crm_zbut0000p3vvi9, 0, 8), 
                    terrid_crm_zbut0000p3vvi9))
      - column: date_to_crm
        expression: substr(date_to_crm_zbut0000p3vvi9, 0, 8)
      - column: date_from_crm
        expression: substr(date_from_crm_zbut0000p3vvi9, 0, 8)              

  - kind: checkpoint
    name: checkpoint_crm
    context_name: add_crm

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_crm
        how:
          full
        columns:
          hash_mdg: hash_crm

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_crm) or hash_crm = ''

  - kind: join
    name: join_non_matching_crm
    context_name: checkpoint_crm
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_crm: hash_mdg

  - kind: filter
    name: filter_non_matching_crm
    context_name: join_non_matching_crm
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        partner_mdg_but000: partner_mdg
        name_last_mdg_but000: name_last_mdg
        name_first_mdg_but000: name_first_mdg
        type_mdg_zmdgc_trr: type_mdg
        date_to_mdg: date_to_mdg
        date_from_mdg: date_from_mdg
        terrid_mdg_zmdgc_trr: terrid_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_crm
    context_name: filter_non_matching_crm
    params:
      columns:
        partner_crm_but000: partner_crm
        name_last_crm_but000: name_last_crm
        name_first_crm_but000: name_first_crm
        type_crm_zbut0000p3vvi9: type_crm
        date_to_crm: date_to_crm
        date_from_crm: date_from_crm
        terrid_crm_zbut0000p3vvi9: terrid_crm
        hash_crm: hash_crm
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_crm
    context_name: select_non_matching_crm

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01'

  - kind: select
    name: select_knvv
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        vkorg: vkorg
        kvgr4: kvgr4
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_crm
        how:
          full
        columns:
          partner_mdg: partner_crm
          type_mdg: type_crm


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_crm: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)


  - kind: join
    name: join_missing_from_crm
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_crm
    params:
      - condition: aufsd in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)


## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_crm, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''TERRITORY ASSIGNMENT'''
      - column: src_system
        expression: '''crm'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from crm

  - kind: filter
    name: filter_missing_from_crm
    context_name: join_missing_from_crm
    params:
      - condition:
          isnull(partner_crm)

  - kind: add
    name: add_missing_from_crm
    context_name: filter_missing_from_crm
    params:
      - column: msg
        expression: if(isnull(partner_crm), 'data missing from crm', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''TERRITORY ASSIGNMENT'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''crm'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_crm
    params:
      - condition:
          partner_crm = partner_mdg
          and type_crm = type_mdg
          and (date_to_crm <> date_to_mdg or date_from_crm <> date_from_mdg or terrid_crm <> terrid_mdg)

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_date_to
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and date_to_crm <> date_to_mdg, 'attributes are mismatching', '-')
      - column: msg_date_from
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and date_from_crm <> date_from_mdg, 'attributes are mismatching', '-')
      - column: msg_terrid
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and terrid_crm <> terrid_mdg, 'attributes are mismatching', '-')
      - column: attr_name_date_to
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and date_to_crm <> date_to_mdg, concat('TERRITORY ASSIGNMENT:', ' ', type_mdg, ' VALID TO'), '-')
      - column: attr_name_date_from
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and date_from_crm <> date_from_mdg, concat('TERRITORY ASSIGNMENT:', ' ', type_mdg, ' VALID FROM'), '-')
      - column: attr_name_terrid
        expression: if(partner_crm = partner_mdg 
                    and type_crm = type_mdg
                    and terrid_crm <> terrid_mdg, concat('TERRITORY ASSIGNMENT:', ' ', type_mdg, ' TERRITORY ID'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''TERRITORY ASSIGNMENT'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''crm'''
      - column: loading_date
        expression: current_date()


  - kind: select
    name: select_missing_from_mdg
    context_name: add_missing_from_mdg
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        partner_crm: primary_key_l1
        name_first_crm: attribute1
        name_last_crm: attribute2
        type_crm: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: select
    name: select_missing_from_crm
    context_name: add_missing_from_crm
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg: dimension
        partner_mdg: primary_key_l1
        name_first_mdg: attribute1
        name_last_mdg: attribute2
        type_mdg: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_date_to
    context_name: add_mismatched
    params:
      - condition:
          msg_date_to <> '-'

  - kind: select
    name: select_mismatched_date_to
    context_name: filter_mismatched_date_to
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg_date_to: dimension
        partner_mdg: primary_key_l1
        name_first_mdg: attribute1
        name_last_mdg: attribute2
        type_mdg: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        attr_name_date_to: compared_attribute
        date_to_mdg: compared_src_attr_value
        date_to_crm: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true

  - kind: filter
    name: filter_mismatched_date_from
    context_name: add_mismatched
    params:
      - condition:
          msg_date_from <> '-'

  - kind: select
    name: select_mismatched_date_from
    context_name: filter_mismatched_date_from
    params:
      columns:
        domain: domain
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        msg_date_from: dimension
        partner_mdg: primary_key_l1
        name_first_mdg: attribute1
        name_last_mdg: attribute2
        type_mdg: attribute3
        aufsd: attribute4
        attribute5: attribute5
        vkorg: attribute6
        vtweg: attribute7
        spart: attribute8
        attribute10: attribute10
        country: country
        attr_name_date_from: compared_attribute
