        attribute10: attribute10
        country: country
        attr_name_terrid: compared_attribute
        terrid_mdg: compared_src_attr_value
        terrid_crm: compared_tgt_attr_value
        loading_date: loading_date
      distinct: true

  - kind: union
    name: union_territory_assignment_mismatched
    context_name: select_mismatched_date_to
    params:
      allow_missing: true
      by_name: true
      other: select_mismatched_date_from

  - kind: union
    name: union_territory_assignment_mismatched
    params:
      allow_missing: true
      by_name: true
      other: select_mismatched_terrid
      
