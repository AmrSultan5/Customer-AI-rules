        linked_by_vendor_account_group_code: linked_by_vendor_account_group_code
        linked_by_vendor_name: linked_by_vendor_name
        linked_by_customer_code: linked_by_customer_code
        linked_by_corporate_vendor_code: linked_by_corporate_vendor_code
        linked_by_addressability_flag: linked_by_addressability_flag
        duplicated_by_vendor_code: duplicated_by_vendor_code
        duplicated_by_vendor_name: duplicated_by_vendor_name
        duplicated_by_customer_code: duplicated_by_customer_code
        duplicated_by_corporate_vendor_code: duplicated_by_corporate_vendor_code
        duplicated_by_addressability_flag: duplicated_by_addressability_flag
        duplicated_by_tax_value: duplicated_by_tax_value
        duplicated_by_bank_value: duplicated_by_bank_value
        duplicated_by_tax0_flag: duplicated_by_tax0_flag
