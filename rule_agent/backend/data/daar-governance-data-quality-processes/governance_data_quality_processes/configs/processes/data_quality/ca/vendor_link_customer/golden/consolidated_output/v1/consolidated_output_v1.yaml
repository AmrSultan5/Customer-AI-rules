#--------------AGGREGATED----------------
  - kind: select
    name: select_aggregated
    context_name: select_final_details
    params:
      columns:
        country_code: country_code
        quality_category: quality_category
        quality_rule: quality_rule
        rule_name: rule_name
        dq_flag_output: dq_flag_output
        duplicated_by_tax0_flag: duplicated_by_tax0_flag
        duplicated_by_tax1_flag: duplicated_by_tax1_flag
        duplicated_by_tax2_flag: duplicated_by_tax2_flag
        duplicated_by_tax3_flag: duplicated_by_tax3_flag
        duplicated_by_tax4_flag: duplicated_by_tax4_flag
        duplicated_by_tax5_flag: duplicated_by_tax5_flag
        duplicated_by_iban_flag: duplicated_by_iban_flag

  - kind: add
    name: add_totals
    context_name: select_aggregated
    params:
      - column: total_records
        expression: cast(1 as int)
      - column: total_checks
        expression: if(dq_flag_output is not null and dq_flag_output != '', 1, null)
      - column: failed_checks
        expression: if(dq_flag_output = '0', 1, null)

  - kind: group
    name: group_aggregated
    context_name: add_totals
    params:
      - aggs:
           total_records: count
           total_checks: count
           failed_checks: count
           duplicated_by_tax0_flag: sum
           duplicated_by_tax1_flag: sum
           duplicated_by_tax2_flag: sum
           duplicated_by_tax3_flag: sum
           duplicated_by_tax4_flag: sum
           duplicated_by_tax5_flag: sum
           duplicated_by_iban_flag: sum
        by:
        -  country_code
        -  quality_rule
        -  quality_category
        -  rule_name

  - kind: cast
    name: cast_aggregated_int
    context_name: group_aggregated
    params:
      - column: count_total_records
        to: int
      - column: count_total_checks
        to: int
      - column: count_failed_checks
        to: int
      - column: sum_duplicated_by_tax0_flag
        to: int
      - column: sum_duplicated_by_tax1_flag
        to: int
      - column: sum_duplicated_by_tax2_flag
        to: int
      - column: sum_duplicated_by_tax3_flag
        to: int
      - column: sum_duplicated_by_tax4_flag
        to: int
      - column: sum_duplicated_by_tax5_flag
        to: int
      - column: sum_duplicated_by_iban_flag
        to: int

  - kind: cast
    name: cast_aggregated_str
    context_name: cast_aggregated_int
    params:
      - column: sum_duplicated_by_tax0_flag
        to: string
      - column: sum_duplicated_by_tax1_flag
        to: string
      - column: sum_duplicated_by_tax2_flag
        to: string
      - column: sum_duplicated_by_tax3_flag
        to: string
      - column: sum_duplicated_by_tax4_flag
        to: string
      - column: sum_duplicated_by_tax5_flag
        to: string
      - column: sum_duplicated_by_iban_flag
        to: string

  - kind: add
    name: add_loading_date
    context_name: cast_aggregated_str
    params:
      - column: loading_date
        expression: current_date()

  - kind: select
    name: select_aggregated_final
    context_name: add_loading_date
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        quality_category: quality_category
        quality_rule: quality_rule
        rule_name: rule_name
        count_failed_checks: failed_checks
        sum_duplicated_by_tax0_flag: duplicated_by_tax0_flag
        sum_duplicated_by_tax1_flag: duplicated_by_tax1_flag
        sum_duplicated_by_tax2_flag: duplicated_by_tax2_flag
        sum_duplicated_by_tax3_flag: duplicated_by_tax3_flag
        sum_duplicated_by_tax4_flag: duplicated_by_tax4_flag
        sum_duplicated_by_tax5_flag: duplicated_by_tax5_flag
        sum_duplicated_by_iban_flag: duplicated_by_iban_flag
        loading_date: loading_date
      distinct: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: vendor_link_customer
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full