        profit_center: profit_center
        cost_center_name: cost_center_name
        valid_to: valid_to
        cost_center_category_code: category_code
        cost_center_category_name: category_name
        person_responsible: person_responsible
        controlling_area_currency_code: currency_code
        dummy_profit_center: dummy_profit_center
        functional_area_completeness_flag: functional_area_completeness_flag
        functional_area_accuracy_flag: functional_area_accuracy_flag
        cost_center_hierarchy_consistency_flag: cost_center_hierarchy_consistency_flag
        cost_center_consistency_flag: cost_center_consistency_flag
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_replace_null_with_blank
    context_name: select_distinct_du
    params:
      - column: functional_area_completeness_flag
        expression: if(functional_area_completeness_flag is null, '', functional_area_completeness_flag)
        overwrite: true
      - column: functional_area_accuracy_flag
        expression: if(functional_area_accuracy_flag is null, '', functional_area_accuracy_flag)
        overwrite: true
      - column: cost_center_hierarchy_consistency_flag
        expression: if(cost_center_hierarchy_consistency_flag is null, '', cost_center_hierarchy_consistency_flag)
        overwrite: true
      - column: cost_center_consistency_flag
        expression: if(cost_center_consistency_flag is null, '', cost_center_consistency_flag)
        overwrite: true

  - kind: select
    name: select_du_1
    context_name: add_replace_null_with_blank
    params:
      columns:
        country_code: country_code
        functional_area_code: functional_area_code
        functional_area_completeness_flag: functional_area_completeness_flag

  - kind: add
    name: add_aggregated_1
    context_name: select_du_1
    params:
      - column: total_checks
        expression: IF(functional_area_completeness_flag !='', 1, NULL)
      - column: failed_checks
        expression: IF(functional_area_completeness_flag = '0', 1, NULL)
      - column: quality_category
        expression: '"Completeness"'
      - column: quality_rule
        expression: '"Functional Area"'

  - kind: group
    name: group_aggregated_1
    context_name: add_aggregated_1
    params:
      - aggs:
          total_checks: count
          failed_checks: count
        by:
        - country_code
        - functional_area_code
        - quality_category
        - quality_rule

  - kind: select
    name: select_aggregated_1
    context_name: group_aggregated_1
    params:
      columns:
        country_code: country_code
        functional_area_code: functional_area_code
        count_total_checks: total_checks
        count_failed_checks: failed_checks
        quality_category: quality_category
