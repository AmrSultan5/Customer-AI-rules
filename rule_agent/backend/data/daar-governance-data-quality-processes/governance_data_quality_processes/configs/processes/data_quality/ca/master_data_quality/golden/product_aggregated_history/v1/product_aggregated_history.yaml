use_case_number: "{{ use_case_number }}"
transform:
  name: product_aggregated_history
  operations:
  {% if use_case_number == "UC23" %}
  - kind: read_dataio
    name: read_product_aggregated_history
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: informatica_dq
      namespace: master_data_quality
      object_name: product_aggregated_history
      schema_version: v1
  - kind: filter
    name: filter_uc_number
    context_name: read_product_aggregated_history
    params:
      - condition:
          use_case = "{{ use_case_number }}"
  - kind: select
    name: select_output
    context_name: filter_uc_number
    params:
      columns:
        country_code: country_code
        company_code: company_code
        record_type: record_type
        quality_category: material_category
        rule_code: quality_category
        total_checks: total_checks
        invalid_checks: invalid_checks
        total_records: total_records
        sap_cluster: sap_cluster
        loading_date: loading_date
  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: sc_pending_open_orders
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
  {% endif %}
