transform:
  name: name_mdg_crm
  operations:

  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')

  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg_but000
        name_last: name_last
        name_first: name_first
        partner_guid: partner_guid_mdg_but000
        name_org1: name_org1
        name_org2: name_org2
        bu_sort1: bu_sort1
        bu_sort2: bu_sort2
        location_1: location_1
        location_2: location_2
        location_3: location_3
        legal_enty: legal_enty
        xpcpt: xpcpt_mdg_but000
      distinct: true

  - kind: read_dataio
    name: read_crm_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: filter
    name: filter_crm_but000
    context_name: read_crm_but000
    params:
      - condition:
          partner not like '000%' and xpcpt <> 'X' and  if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))

  - kind: select
    name: select_crm_but000
    context_name: filter_crm_but000
    params:
      columns:
        partner: partner_crm_but000
        name_last: name_last
        name_first: name_first
        partner_guid: partner_guid_crm_but000
        name_org1: name_org1
        name_org2: name_org2
        bu_sort1: bu_sort1
        bu_sort2: bu_sort2
        location_1: location_1
        location_2: location_2
        location_3: location_3
        legal_enty: legal_enty
        xpcpt: xpcpt_crm_but000
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_mdg
    context_name: select_mdg_but000
    params:
      - column: name_last_mdg_but000
        expression: regexp_replace(regexp_replace(name_last,'\n',''),'\r','')
      - column: name_first_mdg_but000
        expression: regexp_replace(regexp_replace(name_first,'\n',''),'\r','')
      - column: name_org1_mdg_but000
        expression: regexp_replace(regexp_replace(name_org1,'\n',''),'\r','')
      - column: name_org2_mdg_but000
        expression: regexp_replace(regexp_replace(name_org2,'\n',''),'\r','')
      - column: bu_sort1_mdg_but000
        expression: regexp_replace(regexp_replace(bu_sort1,'\n',''),'\r','')
      - column: bu_sort2_mdg_but000
        expression: regexp_replace(regexp_replace(bu_sort2,'\n',''),'\r','')
      - column: location_1_mdg_but000
        expression: regexp_replace(regexp_replace(location_1,'\n',''),'\r','')
      - column: location_2_mdg_but000
        expression: regexp_replace(regexp_replace(location_2,'\n',''),'\r','')
      - column: legal_enty_mdg_but000
        expression: regexp_replace(regexp_replace(legal_enty,'\n',''),'\r','')
      - column: location_3_mdg_but000
        expression: regexp_replace(regexp_replace(location_3,'\n',''),'\r','')
      - column: hash_mdg
        expression: md5(concat_ws('',
                    partner_mdg_but000, 
                    partner_guid_mdg_but000, 
                    name_org1_mdg_but000, 
                    name_org2_mdg_but000, 
                    bu_sort1_mdg_but000,
                    bu_sort2_mdg_but000, 
                    location_1_mdg_but000,
                    location_2_mdg_but000,
                    location_3_mdg_but000,
                    legal_enty_mdg_but000,
                    xpcpt_mdg_but000))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg

  - kind: add
    name: add_crm
    context_name: select_crm_but000
    params:        
      - column: name_last_crm_but000
        expression: regexp_replace(regexp_replace(name_last,'\n',''),'\r','')
      - column: name_first_crm_but000
        expression: regexp_replace(regexp_replace(name_first,'\n',''),'\r','')
      - column: name_org1_crm_but000
        expression: regexp_replace(regexp_replace(name_org1,'\n',''),'\r','')
      - column: name_org2_crm_but000
        expression: regexp_replace(regexp_replace(name_org2,'\n',''),'\r','')
      - column: bu_sort1_crm_but000
        expression: regexp_replace(regexp_replace(bu_sort1,'\n',''),'\r','')
      - column: bu_sort2_crm_but000
        expression: regexp_replace(regexp_replace(bu_sort2,'\n',''),'\r','')
      - column: location_1_crm_but000
        expression: regexp_replace(regexp_replace(location_1,'\n',''),'\r','')
      - column: location_2_crm_but000
        expression: regexp_replace(regexp_replace(location_2,'\n',''),'\r','')
      - column: legal_enty_crm_but000
        expression: regexp_replace(regexp_replace(legal_enty,'\n',''),'\r','')
      - column: location_3_crm_but000
        expression: regexp_replace(regexp_replace(location_3,'\n',''),'\r','')
      - column: hash_crm
        expression: md5(concat_ws('',
                    partner_crm_but000, 
                    partner_guid_crm_but000, 
                    name_org1_crm_but000, 
                    name_org2_crm_but000, 
                    bu_sort1_crm_but000,
                    bu_sort2_crm_but000, 
                    location_1_crm_but000,
                    location_2_crm_but000,
                    location_3_crm_but000,
                    legal_enty_crm_but000,
                    xpcpt_crm_but000))           

  - kind: checkpoint
    name: checkpoint_crm
    context_name: add_crm

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_crm
        how:
          full
        columns:
          hash_mdg: hash_crm

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_crm) or hash_crm = ''

  - kind: join
    name: join_non_matching_crm
    context_name: checkpoint_crm
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_crm: hash_mdg

  - kind: filter
    name: filter_non_matching_crm
    context_name: join_non_matching_crm
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        partner_mdg_but000: partner_mdg
        name_last_mdg_but000: name_last_mdg
        name_first_mdg_but000: name_first_mdg
        name_org1_mdg_but000: name_org1_mdg
        name_org2_mdg_but000: name_org2_mdg
        bu_sort1_mdg_but000: bu_sort1_mdg
        bu_sort2_mdg_but000: bu_sort2_mdg
        location_1_mdg_but000: location_1_mdg
        location_2_mdg_but000: location_2_mdg
        location_3_mdg_but000: location_3_mdg
        legal_enty_mdg_but000: legal_enty_mdg
        xpcpt_mdg_but000: xpcpt_mdg
        hash_mdg: hash_mdg
        partner_guid_mdg_but000: partner_guid_mdg
      distinct: true

  - kind: select
    name: select_non_matching_crm
    context_name: filter_non_matching_crm
    params:
      columns:
        partner_crm_but000: partner_crm
        name_last_crm_but000: name_last_crm
        name_first_crm_but000: name_first_crm
        name_org1_crm_but000: name_org1_crm
        name_org2_crm_but000: name_org2_crm
        bu_sort1_crm_but000: bu_sort1_crm
        bu_sort2_crm_but000: bu_sort2_crm
        location_1_crm_but000: location_1_crm
        location_2_crm_but000: location_2_crm
        location_3_crm_but000: location_3_crm
        legal_enty_crm_but000: legal_enty_crm
        xpcpt_crm_but000: xpcpt_crm
        hash_crm: hash_crm
        partner_guid_crm_but000: partner_guid_crm
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_crm
    context_name: select_non_matching_crm

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01'

  - kind: select
    name: select_knvv
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        vkorg: vkorg
        kvgr4: kvgr4
        vtweg: vtweg
        spart: spart

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_crm
        how:
          full
        columns:
          partner_mdg: partner_crm
          partner_guid_mdg: partner_guid_crm


  - kind: join
    name: join_missing_from_mdg
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_crm: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: join
    name: join_missing_from_crm
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg) and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute3
        expression: partner_guid_crm
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_crm, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''NAME AND IDENTIFICATION'''
      - column: src_system
        expression: '''crm'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from crm

  - kind: filter
    name: filter_missing_from_crm
    context_name: join_missing_from_crm
    params:
      - condition:
          isnull(partner_crm) and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: add
    name: add_missing_from_crm
    context_name: filter_missing_from_crm
    params:
      - column: msg
        expression: if(isnull(partner_crm), 'data missing from crm', '-')
      - column: attribute3
        expression: partner_guid_mdg
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''NAME AND IDENTIFICATION'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''crm'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_crm
    params:
      - condition:
          partner_crm = partner_mdg
          and partner_guid_crm = partner_guid_mdg 
          and aufsd in ('C','CW','I','M','S1','TS','VF','WH','')
          and (name_org1_crm <> name_org1_mdg
          or name_org2_crm <> name_org2_mdg
          or bu_sort1_crm <> bu_sort1_mdg
          or bu_sort2_crm <> bu_sort2_mdg
          or location_1_crm <> location_1_mdg
          or location_2_crm <> location_2_mdg
          or location_3_crm <> location_3_mdg
          or legal_enty_crm <> legal_enty_mdg
          or xpcpt_crm <> xpcpt_mdg)

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_name_org1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and name_org1_crm <> name_org1_mdg, 'attributes are mismatching', '-')
      - column: msg_name_org2
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and name_org2_crm <> name_org2_mdg, 'attributes are mismatching', '-')
      - column: msg_bu_sort1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and bu_sort1_crm <> bu_sort1_mdg, 'attributes are mismatching', '-')
      - column: msg_bu_sort2
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and bu_sort2_crm <> bu_sort2_mdg, 'attributes are mismatching', '-')
      - column: msg_location_1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and location_1_crm <> location_1_mdg, 'attributes are mismatching', '-')
      - column: msg_location_2
        expression: if(partner_crm = partner_mdg
                    and partner_guid_crm = partner_guid_mdg
                    and location_2_crm <> location_2_mdg, 'attributes are mismatching', '-')
      - column: msg_location_3
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and location_3_crm <> location_3_mdg, 'attributes are mismatching', '-')
      - column: msg_legal_enty
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and legal_enty_crm <> legal_enty_mdg, 'attributes are mismatching', '-')
      - column: msg_xpcpt
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and xpcpt_crm <> xpcpt_mdg, 'attributes are mismatching', '-')
      - column: attr_name_name_org1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and name_org1_crm <> name_org1_mdg, concat('NAME :', ' ', ' NAME_ORG1'), '-')
      - column: attr_name_name_org2
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and name_org2_crm <> name_org2_mdg, concat('NAME :', ' ', ' NAME_ORG2'), '-')
      - column: attr_name_bu_sort1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and bu_sort1_crm <> bu_sort1_mdg, concat('NAME :', ' ', ' BU_SORT1'), '-')
      - column: attr_name_bu_sort2
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and bu_sort2_crm <> bu_sort2_mdg, concat('NAME :', ' ', ' BU_SORT2'), '-')
      - column: attr_name_location_1
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and location_1_crm <> location_1_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_1'), '-')
      - column: attr_name_location_2
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and location_2_crm <> location_2_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_2'), '-')
      - column: attr_name_location_3
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and location_3_crm <> location_3_mdg, concat('IDENTIFICATION :', ' ', ' LOCATION_3'), '-')
      - column: attr_name_legal_enty
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and legal_enty_crm <> legal_enty_mdg, concat('IDENTIFICATION :', ' ', ' LEGAL_ENTY'), '-')
      - column: attr_name_xpcpt
        expression: if(partner_crm = partner_mdg 
                    and partner_guid_crm = partner_guid_mdg
                    and xpcpt_crm <> xpcpt_mdg, concat('BUSINESS PURPOSE :', ' ', ' XPCPT'), '-')
      - column: attribute3
        expression: partner_guid_mdg
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
