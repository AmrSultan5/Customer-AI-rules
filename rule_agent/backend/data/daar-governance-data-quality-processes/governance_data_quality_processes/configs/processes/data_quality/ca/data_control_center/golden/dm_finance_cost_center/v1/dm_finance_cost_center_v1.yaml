transform:
  name: dm_finance_cost_center
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

# Read CSKS

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_csks
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: csks

  - kind: filter
    name: filter_csks
    params:
      - condition:
          DATBI = '9999-12-31 00:00:00.000' AND FUNC_AREA <> 'Z999' AND (BKZKP = 'X' OR PKZKP = 'X' OR BKZER = 'X' OR PKZKS = 'X' OR BKZOB = 'X')

  - kind: select
    name: select_csks
    params:
      columns:
        kostl: kostl
        kokrs: kokrs
        datbi: datbi
        datab: datab
        verak_user: verak_user
        verak: verak
        kosar: kosar
        khinr: khinr
        func_area: func_area
        bukrs: bukrs
        prctr: prctr
        name1: name1
        name2: name2
        stras: stras
        pstlz: pstlz
        pstl2: pstl2
        ort01: ort01
        land1: land1
        zzregion: zzregion
        zzwerks: zzwerks
        zzalm: zzalm
        zzvkbur: zzvkbur
        zzbrsch: zzbrsch
        zzleadership1: zzleadership1
        zzleadership2: zzleadership2
        zzleadership3: zzleadership3
        zzfunction1: zzfunction1
        sap_cluster: sap_cluster_cs
      distinct: true


# Read TKA05

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_tka05
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tka05


  - kind: select
    name: select_tka05
    params:
      columns:
        kosar: kosar_tk5
        sap_cluster: sap_cluster_tk5
      distinct: true

