transform:
  name: partner_function_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_knvp
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvp
        schema_version: v1

    - kind: filter
      name: filter_mdg_knvp
      context_name: read_mdg_knvp
      params:
        - condition: kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and vtweg = '01' and spart = '01' and parvw in ('AG','WE','RE','RG','YR','XD','ZW','Z4','ZY','Z3','ZG','ZC','SB') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

    - kind: select
      name: select_mdg_knvp
      context_name: filter_mdg_knvp
      params:
        columns:
          kunnr: partner_mdg_knvp
          vkorg: vkorg_mdg_knvp
          vtweg: vtweg_mdg_knvp
          spart: spart_mdg_knvp
          parvw: parvw_mdg_knvp
          kunn2: kunn2_mdg_knvp
        distinct: true

    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_mdg_knvv
      context_name: read_mdg_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01' and kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)
    
    - kind: select
      name: select_knvv_pre_checkpoint
      context_name: filter_mdg_knvv
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_knvv
      context_name: select_knvv_pre_checkpoint 

    - kind: add
      name: add_mdg_HASH
      context_name: select_mdg_knvp
      params:
      - column: HASH
        expression: MD5(CONCAT(partner_mdg_knvp,vkorg_mdg_knvp, vtweg_mdg_knvp, spart_mdg_knvp,parvw_mdg_knvp,kunn2_mdg_knvp))
        
    - kind: select
      name: mdg
      context_name: add_mdg_HASH
      params:
        columns:
          partner_mdg_knvp: partner_mdg
          vkorg_mdg_knvp: vkorg_mdg
          vtweg_mdg_knvp: vtweg_mdg
          spart_mdg_knvp: spart_mdg
          parvw_mdg_knvp: parvw_mdg
          kunn2_mdg_knvp: kunn2_mdg
          HASH: HASH_mdg
        distinct: true
    
    - kind: checkpoint
      name: mdg_filter
      context_name: mdg
          
##############################################################
###Dynamics CTE partner function map
    - kind: read_dataio
      name: read_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1

    - kind: filter
      name: filter_cch_optionsetmapping_pfm
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'cch_partnerfunction' and cch_attributename = 'cch_partnerfunction'

    - kind: select
      name: partner_function_map
      context_name: filter_cch_optionsetmapping_pfm
      params:
        columns:
          cch_optionsetvalue: pfm_cch_optionsetvalue
          cch_externalvalue: pfm_cch_externalvalue
        distinct: true




#######################################################
##CTE for division
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 

    - kind: select
      name: division_cte
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true


#######################################################
##CTE distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'

    - kind: select
      name: distributionchannel_cte
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true

##D365##
    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1

    - kind: filter
      name: filter_d365_account
      context_name: read_d365_account
      params:
        - condition: statecode = 0 and cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

    - kind: select
      name: select_d365_account
      context_name: filter_d365_account
      params:
        columns:        
          cch_sapid: partner_d365
          id: account_id_d365
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          cch_salesorganizationid: cch_salesorganizationid
        distinct: true        

    - kind: read_dataio
      name: read_d365_cch_partnerfunction
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_partnerfunction
        schema_version: v1

    - kind: filter
      name: filter_d365_cch_partnerfunction
      context_name: read_d365_cch_partnerfunction
      params:
        - condition: statecode = 0

    - kind: select
      name: select_d365_cch_partnerfunction
      context_name: filter_d365_cch_partnerfunction
      params:
        columns:
          cch_customerid: cch_customerid
          cch_partnersapid: cch_partnersapid
          cch_partnerfunction: cch_pf
        distinct: true

    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1
    
    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1
    
    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true           
        
    - kind: join
      name: join_d365
      context_name: select_d365_account
      params:
        - other:
            select_d365_cch_partnerfunction
          how:
            left
          columns:
            account_id_d365: cch_customerid            
        - other:
            partner_function_map
          how:
            left
          columns:
            cch_pf: pfm_cch_optionsetvalue
        - other:
            distributionchannel_cte
          how:
            left
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            division_cte
          how:
            left
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id
        
    - kind: select
      name: select_d365
      context_name: join_d365
      params:
        columns:        
          partner_d365: partner_d365
          territory_cch_sapid: vkorg_d365
          dc_cch_externalvalue: vtweg_d365
          cd_cch_externalvalue: spart_d365
          pfm_cch_externalvalue: parvw_d365
          cch_partnersapid: kunn2_d365
        distinct: true          
        
    - kind: add
      name: add_d365_HASH
      context_name: select_d365
      params:
      - column: HASH
        expression: md5(concat(coalesce(partner_d365,''),coalesce(vkorg_d365,''),coalesce(vtweg_d365,''),coalesce(spart_d365,''),coalesce(parvw_d365,''),coalesce(kunn2_d365,'')))      

    - kind: select
      name: d365
      context_name: add_d365_HASH
      params:
        columns:
          partner_d365: partner_d365
          vkorg_d365: vkorg_d365
          vtweg_d365: vtweg_d365
          spart_d365: spart_d365
          parvw_d365: parvw_d365
          kunn2_d365: kunn2_d365
          HASH: HASH_d365

    - kind: filter
      name: d365_filter_pre_checkpoint
      context_name: d365
      params:
        - condition:
            parvw_d365 in ('AG','WE','RE','RG','YR','XD','ZW','Z4','ZY','Z3','ZG','ZC','SB') and vtweg_d365 = '01' and spart_d365 = '01' and vkorg_d365 in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

    - kind: checkpoint
      name: d365_filter
      context_name: d365_filter_pre_checkpoint

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg_filter
      params:
        - other:
            d365_filter
          how:
            full
          columns:
            HASH_mdg: HASH_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_d365 is null or HASH_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          parvw_mdg: parvw_mdg
          kunn2_mdg: kunn2_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          partner_d365: partner_d365
          vkorg_d365: vkorg_d365
          vtweg_d365: vtweg_d365
          spart_d365: spart_d365
          parvw_d365: parvw_d365
          kunn2_d365: kunn2_d365
          HASH_d365: HASH_d365

###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_d365_select
          how:
            full
          columns:
            partner_mdg: partner_d365
            vkorg_mdg: vkorg_d365
            vtweg_mdg: vtweg_d365
            spart_mdg: spart_d365
            parvw_mdg: parvw_d365
            

    - kind: add
      name: data_missing_from_mdg_add_columns_1
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('d365' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_d365
          expression: CASE WHEN partner_d365 IS NULL THEN 'data missing from d365' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: checkpoint
      name: data_missing_from_mdg_add_columns
      context_name: data_missing_from_mdg_add_columns_1

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_d365: partner
          parvw_d365: parvw
          vkorg_d365: vkorg
          vtweg_d365: vtweg
          spart_d365: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

###data missing from d365

    - kind: filter
      name: join_data_missing_from_d365_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_d365 is null

    - kind: select
      name: final_data_missing_from_d365
      context_name: join_data_missing_from_d365_filter
      params:
        columns:
          partner_mdg: partner
          parvw_mdg: parvw
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_d365: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

## PARTNER FUNCTION mismatch
    - kind: filter
      name: partner_function_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND kunn2_d365 <> kunn2_mdg AND parvw_mdg = parvw_d365

    - kind: add
      name: add_missing_columns_partner_function
      context_name: partner_function_filter
      params:
        - column: attr_name_partner_function
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND kunn2_d365 <> kunn2_mdg AND parvw_mdg = parvw_d365 THEN concat('PARTNER FUNCTION:',' ',parvw_mdg) END
        - column: msg_partner_function
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND kunn2_d365 <> kunn2_mdg AND parvw_mdg = parvw_d365 THEN 'attributes are mismatching' END

    - kind: select
      name: final_partner_function
      context_name: add_missing_columns_partner_function
      params:
        columns:
          partner_mdg: partner
          parvw_mdg: parvw
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_partner_function: msg
          attr_name_partner_function: attr_name
          kunn2_d365: tgt_attr
          kunn2_mdg: src_attr
          
    - kind: union
      name: union
      context_name: final_data_missing_from_mdg
      params:
        allow_missing: true
        by_name: true
        other: final_data_missing_from_d365

    - kind: union
      name: union
      params:
        allow_missing: true
        by_name: true
        other: final_partner_function

##write missing mismatches
    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1

    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1

    - kind: filter
      name: filter_t077x
      params:
        - condition: spras = 'E' and sap_cluster = 'CL1'

    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true

    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1

    - kind: filter
      name: filter_tvv4t
      params:
        - condition: sap_cluster = 'CL1' and spras = 'E'

    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
      context_name: union
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            left
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_knvv
          how:
            left
          columns:
            kunnr_kna1: kunnr_knvv
            vtweg: vtweg_knvv
            spart: spart_knvv
        - other:
            select_tvv4t
          how:
            left
          columns:
            kvgr4_knvv: kvgr4_tvv4t

    - kind: filter
      name: filter_kna1
      context_name: join_final
      params:
        - condition: aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: add
      name: add_missing_columns
      params:
        - column: COMPARISON_LOADING_DATE
          expression: CURRENT_DATE
        - column: NULL_Value
          expression: cast(NULL as string)
        - column: DOMAIN
          expression: cast('CUSTOMER' as string)
        - column: TABLE_NAME
          expression: cast('PARTNER FUNCTION' as string)
        - column: ATTRIBUTE5
          expression: CONCAT(kvgr4_knvv,' - ',bezei_tvv4t)
        - column: ATTRIBUTE10
          expression: CONCAT(ktokd_kna1,' - ',txt30_t077x)
        - column: COUNTRY
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
            WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
            WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
            WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
            WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
            WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
            WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
            WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
            WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
            WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
            WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
            WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
            WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
            WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
            WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
            WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
            WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
            WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
            WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
            WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
            WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
            WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
            WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
            WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
            WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
            WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
            WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
            WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
            WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END

    - kind: select
      name: select_final
      params:
        columns:
          DOMAIN: domain
          TABLE_NAME: table_name
          src_system: src_system
          tgt_system: tgt_system
          msg: dimension
          partner: primary_key_l1
          NULL_Value: primary_key_src_l2
          NULL_Value: primary_key_tgt_l2
          NULL_Value: primary_key_src_l3
          NULL_Value: primary_key_tgt_l3
          NULL_Value: attribute1
          NULL_Value: attribute2
          parvw: attribute3
          aufsd_kna1: attribute4
          ATTRIBUTE5: attribute5
          vkorg_knvv: attribute6
          vtweg_knvv: attribute7
          spart_knvv: attribute8
          NULL_Value: attribute9
          ATTRIBUTE10: attribute10
          COUNTRY: country
          attr_name: compared_attribute
          src_attr: compared_src_attr_value
          tgt_attr: compared_tgt_attr_value
          COMPARISON_LOADING_DATE: loading_date
        distinct: true

    - kind: filter
      name: filter_final
      context_name: select_final
      params:
        - condition:
            attribute4 in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: write_dataio
      name: write_bank_data
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: reconciliation_results
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: partition
        convert_to_target_schema: True

###agg MDG###
    - kind: join
      name: join_mdg_agg
      context_name: mdg_filter
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner_mdg: kunnr_kna1

    - kind: filter
      name: filter_mdg_agg
