  - kind: filter
    name: filter_tvm1t
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_tvm2t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvm2t
