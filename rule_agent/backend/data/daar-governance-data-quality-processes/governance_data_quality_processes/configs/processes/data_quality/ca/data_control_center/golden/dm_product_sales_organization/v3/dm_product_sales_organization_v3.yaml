    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tptmt
      schema_version: v1

  - kind: filter
    name: filter_tptmt
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_tvmst
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvmst
      schema_version: v1

  - kind: filter
    name: filter_tvmst
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_tvkmt
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvkmt
      schema_version: v1

  - kind: filter
    name: filter_tvkmt
    params:
      - condition:
          spras = 'E'


  - kind: read_dataio
    name: read_t179t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t179t
      schema_version: v1

  - kind: filter
    name: filter_t179t
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_tvkot
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvkot
      schema_version: v1

  - kind: filter
    name: filter_tvkot
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_cluster_config
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: cluster_config
      schema_version: v2

  - kind: filter
    name: filter_cluster_config
    params:
      - condition:
          flag = 'DM_product_sales_org'

  - kind: select
    name: select_mvke
    context_name: add_is_basic_scope
    params:
      columns:
        matnr: matnr
        vkorg: vkorg
        kondm: kondm
        ktgrm: ktgrm
        mtpos: mtpos
        mvgr1: mvgr1
        mvgr2: mvgr2
        mvgr3: mvgr3
        mvgr4: mvgr4
        mvgr5: mvgr5
        prat1: prat1
        prodh: prodh
        vmsta: vmsta
        vmstd: vmstd
        vtweg: vtweg
        zz_kondm: zz_kondm
        sap_cluster: sap_cluster
        is_basic_scope: is_basic_scope
      distinct: true

  - kind: select
    name: select_tvm1t
    context_name: filter_tvm1t
    params:
      columns:
        mvgr1: mvgr1
        bezei: bezei_a1
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvm2t
    context_name: filter_tvm2t
    params:
      columns:
        mvgr2: mvgr2
        bezei: bezei_a2
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvm3t
    context_name: filter_tvm3t
    params:
      columns:
        mvgr3: mvgr3
        bezei: bezei_a3
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvm4t
    context_name: filter_tvm4t
    params:
      columns:
        mvgr4: mvgr4
        bezei: bezei_a4
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvm5t
    context_name: filter_tvm5t
    params:
      columns:
        mvgr5: mvgr5
        bezei: bezei_a5
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t178t
    context_name: filter_t178t
    params:
      columns:
        kondm: kondm
        vtext: vtext_a6
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tptmt
    context_name: filter_tptmt
    params:
      columns:
        mtpos: mtpos
        bezei: bezei_a7
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvmst
    context_name: filter_tvmst
    params:
      columns:
        vmsta: vmsta
        vmstb: vmstb
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvkmt
    context_name: filter_tvkmt
    params:
      columns:
        ktgrm: ktgrm
        vtext: vtext_a9
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t
    context_name: filter_t179t
    params:
      columns:
        prodh: prodh
        vtext: vtext_a10
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_cluster_config
    context_name: filter_cluster_config
    params:
      columns:
        sales_org: vkorg
        country_code: country_code
        cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvkot
    context_name: filter_tvkot
    params:
      columns:
        vkorg: vkorg
        vtext: vtext_a11
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_dp101_generic_demand_planning_tool_re
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: udm
        storage_id: '{{dataio.storage_id}}'
      domain: datamart
      namespace: ftd
      object_name: dp101_generic_demand_planning_tool_re
      schema_version: v1

  - kind: add
    name: add_sys_date
    params:
      - column: sys_date
        expression: CONCAT(YEAR(current_date()), '0', LPAD(MONTH(CURRENT_DATE()), 2, '0'))


  - kind: filter
    name: filter_pln
    params:
      - condition:
         fiscper >= sys_date AND fiscper <= add_months(sys_date, 12)

  - kind: add
    name: add_future_plan_12m_qty
    params:
      - column: future_plan_12m_qty
        expression: consensus_plan_uc + released_consensus_plan_uc + operational_abp_uc + last_months_re_uc + official_4re_uc + official_4re_phc

  - kind: group
    name: agg_future_plan_12m_qty
    params:
      - aggs:
          future_plan_12m_qty: sum
        by:
        - salesorg
        - material

  - kind: select
    name: select_pln
    params:
      columns:
        salesorg: salesorg
        material: material
        sum_future_plan_12m_qty: future_plan_12m_qty
      distinct: true


  - kind: join
    name: join_mvke_all
    context_name: select_mvke
    params:
      - other:
          select_tvm1t
        how:
          left
        columns:
          mvgr1: mvgr1
          sap_cluster: sap_cluster
      - other:
          select_tvm2t
        how:
          left
        columns:
          mvgr2: mvgr2
          sap_cluster: sap_cluster
      - other:
          select_tvm3t
        how:
          left
        columns:
          mvgr3: mvgr3
          sap_cluster: sap_cluster
      - other:
          select_tvm4t
        how:
          left
        columns:
          mvgr4: mvgr4
          sap_cluster: sap_cluster
      - other:
          select_tvm5t
        how:
          left
        columns:
          mvgr5: mvgr5
          sap_cluster: sap_cluster
      - other:
          select_t178t
        how:
          left
        columns:
          kondm: kondm
          sap_cluster: sap_cluster
      - other:
          select_tptmt
        how:
          left
        columns:
          mtpos: mtpos
          sap_cluster: sap_cluster
      - other:
          select_tvmst
        how:
          left
        columns:
          vmsta: vmsta
          sap_cluster: sap_cluster
      - other:
          select_tvkmt
        how:
          left
        columns:
          ktgrm: ktgrm
          sap_cluster: sap_cluster
      - other:
          select_t179t
        how:
          left
        columns:
          prodh: prodh
          sap_cluster: sap_cluster
      - other:
          select_cluster_config
        how:
          inner
        columns:
          vkorg: vkorg
          sap_cluster: sap_cluster
      - other:
          select_tvkot
        how:
          left
        columns:
          vkorg: vkorg
          sap_cluster: sap_cluster
      - other:
          select_pln
        how:
          left
        columns:
          vkorg: salesorg
          matnr: material

  - kind: add
    name: add_product_expressions
    params:
      - column: pack_size_uom_unified
        expression: case when bezei_a4 like '%2,4%' OR bezei_a4 = '43.8' OR bezei_a4 = '38.75' then 'G'
                    when bezei_a4 like '%Kilogram%' or bezei_a4 like '%KG%' OR bezei_a4 LIKE '%KILOGRAMS%' then 'KG'
                    when bezei_a4 like '%Gr%' OR bezei_a4 like '%grams%' OR bezei_a4 LIKE '%GRAMS%' OR bezei_a4 LIKE '%gr%' OR bezei_a4 LIKE '%GR%' then 'G'
                    when (bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%') and bezei_a4 like '0.%' then 'ML'
                    when bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%' then 'L'
                    else '-1' end
      - column: pack_size_volume_unified
        expression: case when bezei_a4 like '%2,4%' then '2.4'
                    when bezei_a4 = '43.8' then '43.8'
                    when bezei_a4 = '38.75' then '38.75'
                    when bezei_a4 like '%Kilogram%' or bezei_a4 like '%KG%' OR bezei_a4 LIKE '%KILOGRAMS%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    when bezei_a4 like '%Gr%' OR bezei_a4 LIKE '%grams%' OR bezei_a4 LIKE '%GRAMS%' OR bezei_a4 LIKE '%gr%' OR bezei_a4 LIKE '%GR%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    when (bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%') and bezei_a4 like '0.%' then string(1000 * double(regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)))
                    when bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    else '-1' end
      - column: product_hierarchy_level
        expression: case when length(prodh) = 2 then '1'
                    when length(prodh) = 4 then '2'
                    when length(prodh) = 7 then '3'
                    when length(prodh) = 11 then '4'
                    when length(prodh) = 15 then '5'
                    else null end
      - column: product_hierarchy_l1_code
        expression: if(length(prodh) >= 2, left(prodh, 2), '')
      - column: product_hierarchy_l2_code
        expression: if(length(prodh) >= 4, left(prodh, 4), '')
      - column: product_hierarchy_l3_code
        expression: if(length(prodh) >= 7, left(prodh, 7), '')
      - column: product_hierarchy_l4_code
        expression: if(length(prodh) >= 11, left(prodh, 11), '')
      - column: product_hierarchy_l5_code
        expression: if(length(prodh) >= 15, prodh, '')

  - kind: select
    name: select_t179t_l1
    context_name: select_t179t
    params:
      columns:
        prodh: product_hierarchy_l1_code
        vtext_a10: product_hierarchy_l1_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t_l2
    context_name: select_t179t
    params:
      columns:
        prodh: product_hierarchy_l2_code
        vtext_a10: product_hierarchy_l2_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t_l3
    context_name: select_t179t
    params:
      columns:
        prodh: product_hierarchy_l3_code
        vtext_a10: product_hierarchy_l3_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t_l4
    context_name: select_t179t
    params:
      columns:
        prodh: product_hierarchy_l4_code
        vtext_a10: product_hierarchy_l4_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t_l5
    context_name: select_t179t
    params:
      columns:
        prodh: product_hierarchy_l5_code
        vtext_a10: product_hierarchy_l5_name
        sap_cluster: sap_cluster
      distinct: true  

  - kind: join
    name: join_dm_product_sales_organization
    context_name: add_product_expressions
    params:
      - other:
          select_t179t_l1
        how:
          left
        columns:
          product_hierarchy_l1_code: product_hierarchy_l1_code
          sap_cluster: sap_cluster
      - other:
          select_t179t_l2
        how:
          left
        columns:
          product_hierarchy_l2_code: product_hierarchy_l2_code
          sap_cluster: sap_cluster
      - other:
          select_t179t_l3
        how:
          left
        columns:
          product_hierarchy_l3_code: product_hierarchy_l3_code
          sap_cluster: sap_cluster
      - other:
          select_t179t_l4
        how:
          left
        columns:
          product_hierarchy_l4_code: product_hierarchy_l4_code
          sap_cluster: sap_cluster
      - other:
          select_t179t_l5
        how:
          left
        columns:
          product_hierarchy_l5_code: product_hierarchy_l5_code
          sap_cluster: sap_cluster

  - kind: cast
    name: cast_pack_size_volume_unified
    params:
      - column: pack_size_volume_unified
        to: string
        


  - kind: select
    name: dm_product_sales_organization
    params:
      columns:
        matnr: material_code
        vkorg: sales_org_code
        vtext_a11: sales_org_name
        country_code: country_code
        kondm: material_price_group_code
        vtext_a6: material_price_group_name
        ktgrm: account_assignment_group_code
        vtext_a9: account_assignment_group_name
        mtpos: item_category_group_code
        bezei_a7: item_category_group_name
        mvgr1: brand_code
        bezei_a1: brand_name
        mvgr2: flavour_code
        bezei_a2: flavour_name
        mvgr3: pack_type_code
        bezei_a3: pack_type_name
        mvgr4: pack_size_code
        bezei_a4: pack_size_name
        pack_size_uom_unified: pack_size_uom_unified
        pack_size_volume_unified: pack_size_volume_unified
        mvgr5: sales_unit_code
        bezei_a5: sales_unit_name
        prat1: promotion_flag
        prodh: product_hierarchy_code
        vtext_a10: product_hierarchy_name
        product_hierarchy_level: product_hierarchy_level
        product_hierarchy_l1_code: product_hierarchy_l1_code
        product_hierarchy_l1_name: product_hierarchy_l1_name
        product_hierarchy_l2_code: product_hierarchy_l2_code
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l3_name: product_hierarchy_l3_name
        product_hierarchy_l4_code: product_hierarchy_l4_code
        product_hierarchy_l4_name: product_hierarchy_l4_name
        product_hierarchy_l5_code: product_hierarchy_l5_code
        product_hierarchy_l5_name: product_hierarchy_l5_name
        vmsta: material_status_code
        vmstb: material_status_name
        vmstd: material_sales_valid_from
        vtweg: distribution_channel_code
        zz_kondm: ss_sm_flag
        sap_cluster: sap_cluster
        is_basic_scope: is_basic_scope
        future_plan_12m_qty: future_plan_12m_qty
      distinct: true

  - kind: write_dataio
    name: write_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization
      process_run_id: '{{process_run_id}}'
      schema_version: v3
      refresh_mode: full