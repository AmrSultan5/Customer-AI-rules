transform:
  name: dm_customer_contact
  operations:

# Read BUT050_S4

  - kind: read_dataio
    name: read_b50_s
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: contact_person_relationships
      object_name: but050
      schema_version: v1



  - kind: select
    name: select_b50_s
    context_name: read_b50_s
    params:
      columns:
        partner1: partner1_b50_s
        relnr: relnr_b50_s
        partner2: partner2_b50_s
        date_from: date_from_b50_s
        date_to: date_to_b50_s
        reltyp: reltyp_b50_s
        sap_cluster: sap_cluster_b50_s
      distinct: true

  - kind: add
    name: add_source
    params:
      - column: source
        expression: '''s4'''


  - kind: select
    name: select_b50_s_finall
    params:
      columns:
        partner1_b50_s: partner1
        relnr_b50_s: relnr
        partner2_b50_s: partner2
        date_from_b50_s: date_from
        date_to_b50_s: date_to
        reltyp_b50_s: reltyp
        source: source
        sap_cluster_b50_s: sap_cluster
      distinct: true

# Read BUT050_CRM

  - kind: read_dataio
    name: read_b50_c
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: contact_person_relationships
      object_name: but050
      schema_version: v1

  - kind: select
    name: select_b50_c
    context_name: read_b50_c
    params:
      columns:
        partner1: partner1_b50_c
        relnr: relnr_b50_c
        partner2: partner2_b50_c
        date_from: date_from_b50_c
        date_to: date_to_b50_c
        reltyp: reltyp_b50_c
        sap_cluster: sap_cluster_b50_c
      distinct: true

  - kind: add
    name: add_source
    params:
      - column: source
        expression: '''crm'''


  - kind: select
    name: select_b50_c_finall
    params:
      columns:
        partner1_b50_c: partner1
        relnr_b50_c: relnr
        partner2_b50_c: partner2
        date_from_b50_c: date_from
        date_to_b50_c: date_to
        reltyp_b50_c: reltyp
        source: source
        sap_cluster_b50_c: sap_cluster
      distinct: true



# Read BUT051_S4

  - kind: read_dataio
    name: read_b51_s
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: contact_person_relationships
      object_name: but051
      schema_version: v1

  - kind: select
    name: select_b51_s
    context_name: read_b51_s
    params:
      columns:
        partner1: partner1_b51_s
        partner2: partner2_b51_s
        pafkt: pafkt_b51_s
        relnr: relnr_b51_s
        tel_number: tel_number_b51_s
        fax_number: fax_number_b51_s
        smtp_address: smtp_address_b51_s
        sap_cluster: sap_cluster_b51_s
      distinct: true


  - kind: select
    name: select_b51_s_finall
    params:
      columns:
        partner1_b51_s: partner1
        partner2_b51_s: partner2
        pafkt_b51_s: pafkt
        relnr_b51_s: relnr
        tel_number_b51_s: tel_number
        fax_number_b51_s: fax_number
        smtp_address_b51_s: smtp_address
        sap_cluster_b51_s: sap_cluster
      distinct: true

# Read BUT051_CRM

  - kind: read_dataio
    name: read_b51_c
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_crm
      namespace: contact_person_relationships
      object_name: but051
      schema_version: v1

  - kind: select
    name: select_b51_c
    context_name: read_b51_c
    params:
      columns:
        partner1: partner1_b51_c
        partner2: partner2_b51_c
        pafkt: pafkt_b51_c
        relnr: relnr_b51_c
        tel_number: tel_number_b51_c
        fax_number: fax_number_b51_c
        smtp_address: smtp_address_b51_c
        sap_cluster: sap_cluster_b51_c
      distinct: true


  - kind: select
    name: select_b51_c_finall
    params:
      columns:
        partner1_b51_c: partner1
        partner2_b51_c: partner2
        pafkt_b51_c: pafkt
        relnr_b51_c: relnr
        tel_number_b51_c: tel_number
        fax_number_b51_c: fax_number
        smtp_address_b51_c: smtp_address
        sap_cluster_b51_c: sap_cluster
      distinct: true



  - kind: join
    name: join_s4_finall
    context_name: select_b50_s_finall
    params:
      - other:
          select_b51_s_finall
        how:
          inner
        columns:
          partner1: partner1
          partner2: partner2
          relnr: relnr
          sap_cluster: sap_cluster

  - kind: join
    name: join_crm_finall
    context_name: select_b50_c_finall
    params:
      - other:
          select_b51_c_finall
        how:
          inner
        columns:
          partner1: partner1
          partner2: partner2
          relnr: relnr
          sap_cluster: sap_cluster

  - kind: union
    name: union_b50_b51
    context_name: join_s4_finall
    params:
      allow_missing: false
      by_name: true
      other: join_crm_finall



  - kind: select
    name: select_finall
    params:
      columns:
        partner1: customer_code
        relnr: relationship_number
        partner2: customer_partner_code
        date_from: valid_from
        date_to: valid_to
        reltyp: relationship_category
        pafkt: function_of_partner
        tel_number: tel_number
        fax_number: fax_number
        smtp_address: email_address
        source: source
        sap_cluster: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_dm_customer_contact
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_contact
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full
