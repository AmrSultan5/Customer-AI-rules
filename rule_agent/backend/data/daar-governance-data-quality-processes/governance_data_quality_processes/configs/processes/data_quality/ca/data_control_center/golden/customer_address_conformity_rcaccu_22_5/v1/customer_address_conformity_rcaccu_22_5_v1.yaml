transform:
  name: customer_address_conformity_rcaccu_22_5
  operations:     

  - kind: nested_process
    name: customer_segmentation_conformity_rcaccu_225_2
    params:
      config_path: "processes/data_quality/ca/data_control_center/golden/customer_segmentation_accuracy_rcaccu_225_2/v1/customer_segmentation_accuracy_rcaccu_225_2_v1.yaml"
      module: "governance_data_quality_processes.configs"
      jinja_params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
        process_run_id: "{{process_run_id}}"

  - kind: select
    name: select_rcaccu_225_2
    params:
      columns:
        check_status: check_status_rcaccu_225_2
        customer_code: customer_code
      distinct: true

  - kind: read_dataio
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general
      schema_version: v11

  - kind: read_dataio
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address
      schema_version: v4

#SELECT rcaccu_22_5
  - kind: read_dataio
    name: read_dcc_geocoords_extractor_dic_v1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dcc_geocoords_extractor_dic
      schema_version: v1

  - kind: select
    name: select_ext_dic_1
    context_name: read_dcc_geocoords_extractor_dic_v1
    params:
      columns:
        customer_code: customer_code
        latitude: latitude
        longitude: longitude
        geocoords_extractor: geocoords_extractor

  - kind: add 
    name: add_extractor_fields_ext_dic_1
    context_name: select_ext_dic_1
    params:
      - column: ext_ad
        expression: geocoords_extractor.address
      - column: ext_lat
        expression: cast(geocoords_extractor.latitude as double)
      - column: ext_long
        expression: cast(geocoords_extractor.longitude as double)

  - kind: read_dataio
    name: read_dcc_geocoords_extractor_geonames_dic_v1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dcc_geocoords_extractor_geonames_dic
      schema_version: v1

  - kind: select
    name: select_ext_dic_2
    context_name: read_dcc_geocoords_extractor_geonames_dic_v1
    params:
      columns:
        customer_code: customer_code
        latitude: latitude
        longitude: longitude
        geocoords_extractor: geocoords_extractor2

  - kind: add 
    name: add_extractor_fields_ext_dic_2
    context_name: select_ext_dic_2
    params:
      - column: place_name
        expression: geocoords_extractor2.place_name
      - column: state_name
        expression: geocoords_extractor2.state_name
      - column: ext_lat2
        expression: cast(geocoords_extractor2.latitude as double)
      - column: ext_long2
        expression: cast(geocoords_extractor2.longitude as double)

  # country validation
  - kind: select
    name: select_country_validation
    context_name: select_rcaccu_225_2
    params:
      columns:
        customer_code: customer_code
        check_status_rcaccu_225_2: country_validation
      distinct: true

  - kind: governance_data_quality_processes.custom_operations.data_quality.data_control_center.geocoords_city_check.geocoords_city_check_operation.GeoCoordsCityCheckOperation
    name: add_rcaccu_22_5

  - kind: add
    name: add_check_date
    context_name: add_rcaccu_22_5
    params:
      - column: check_date
        expression: current_timestamp()
      - column: check_details_message
        expression: ''''''

  - kind: select
    name: select_rcaccu_22_5_final
    context_name: add_check_date
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
        check_details_message: check_details_message
        check_date: check_date
      distinct: true 

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
        check_details_message: check_details_message
        check_date: check_date
      distinct: true  