transform:
  name: dm_customer_address
  operations:

# Read BUT020

  - kind: read_dataio
    name: read_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: but020
      schema_version: v1

  - kind: select
    name: select_b
    params:
      columns:
        partner: partner
        addrnumber: addrnumber
        addr_valid_to: addr_valid_to
        addr_valid_from: addr_valid_from
        sap_cluster: sap_cluster

  - kind: filter
    name: filter_b
    params:
      - condition:
          addr_valid_to = '99991231235959'

  - kind: select
    name: select_b_finall
    params:
      columns:
        partner: partner_b
        addrnumber: addrnumber_b
        addr_valid_to: addr_valid_to_b
        addr_valid_from: addr_valid_from_b
        sap_cluster: sap_cluster_b

# Read ADRC

  - kind: read_dataio
    name: read_adrc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: address_and_communication_data
      object_name: adrc
      schema_version: v1

  - kind: select
    name: select_a
    params:
      columns:
        nation: nation
        addrnumber: addrnumber
        street: street
        house_num1: house_num1
        house_num2: house_num2
        post_code1: post_code1
        city1: city1
        city2: city2
        country: country
        region: region
        str_suppl1: str_suppl1
        str_suppl2: str_suppl2
        str_suppl3: str_suppl3
        location: location
        home_city: home_city
        sap_cluster: sap_cluster


  - kind: filter
    name: filter_a
    params:
      - condition:
          nation = '' or nation IS NULL

  - kind: select
    name: select_a_finall
    params:
      columns:
        nation: nation_a
        addrnumber: addrnumber_a
        street: street_a
        house_num1: house_num1_a
        house_num2: house_num2_a
        post_code1: post_code1_a
        city1: city1_a
        city2: city2_a
        country: country_a
        region: region_a
        str_suppl1: str_suppl1_a
        str_suppl2: str_suppl2_a
        str_suppl3: str_suppl3_a
        location: location_a
        home_city: home_city_a
        sap_cluster: sap_cluster_a

# Read /LOT/GC_ADR

  - kind: read_dataio
    name: read_lot_gc_adr
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: address_and_communication_data
      object_name: lot_gc_adr
      schema_version: v1

  - kind: select
    name: select_l
    params:
      columns:
        lot_gc_latitude: lot_gc_latitude_l
        lot_gc_longitud: lot_gc_longitud_l
        addrnumber: addrnumber_l
        sap_cluster: sap_cluster_l

# Read T005U

  - kind: read_dataio
    name: read_t005u
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t005u
      schema_version: v1

  - kind: filter
    name: filter_r
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_r
    params:
      columns:
        bezei: bezei_r
        bland: bland_r
        land1: land1_r
        sap_cluster: sap_cluster_r


# Read BUT021_FS

  - kind: read_dataio
    name: read_but021_fs
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: but021_fs
      schema_version: v1

  - kind: select
    name: select_f
    params:
      columns:
        addrnumber: addrnumber_f
        partner: partner_f
        adr_kind: adr_kind_f
        sap_cluster: sap_cluster_f



# Read T005

  - kind: read_dataio
    name: read_t005
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t005
      schema_version: v1

  - kind: select
    name: select_t
    params:
      columns:
        land1: land1_t
        sap_cluster: sap_cluster_t


  - kind: join
    name: join_dm_customer_address
    context_name: select_b_finall
    params:
      - other:
          select_a_finall
        how:
          inner
        columns:
          addrnumber_b: addrnumber_a
          sap_cluster_b: sap_cluster_a
      - other:
          select_l
        how:
          left
        columns:
          addrnumber_b: addrnumber_l
          sap_cluster_b: sap_cluster_l
      - other:
          select_r
        how:
          left
        columns:
          region_a: bland_r
          country_a: land1_r
          sap_cluster_a: sap_cluster_r
      - other:
          select_f
        how:
          left
        columns:
          addrnumber_b: addrnumber_f
          partner_b: partner_f
          sap_cluster_b: sap_cluster_f
      - other:
          select_t
        how:
          left
        columns:
          country_a: land1_t
          sap_cluster_a: sap_cluster_t


  - kind: add
    name: add_t005
    params:
      - column: is_allowed_country_code_t
        expression: "CASE WHEN land1_t IS NOT NULL THEN '1' ELSE '0' END"

#Add legal name and name above door
  - kind: add
    name: add_legal_name
    params:
      - column: legal_name
        expression: "CASE WHEN country_a = 'IT' THEN '-1' WHEN country_a = 'RO' THEN '-1' WHEN country_a = 'CZ' THEN concat(str_suppl3_a,' ',location_a) WHEN country_a = 'SK' THEN concat(str_suppl3_a,' ',location_a) WHEN country_a = 'RS' THEN '-1' WHEN country_a = 'ME' THEN '-1' WHEN country_a = 'KV' THEN '-1' WHEN country_a = 'BG' THEN '-1' WHEN country_a = 'GR' THEN '-1' WHEN country_a = 'CY' THEN '-1' WHEN country_a = 'NG' THEN '-1' WHEN country_a = 'AT' THEN '-1' WHEN country_a = 'HR' THEN '-1' WHEN country_a = 'BA' THEN '-1' WHEN country_a = 'SI' THEN '-1' WHEN country_a = 'MK' THEN '-1' WHEN country_a = 'UA' THEN '-1' WHEN country_a = 'AM' THEN '-1' WHEN country_a = 'MD' THEN '-1' WHEN country_a = 'EG' THEN '-1' WHEN country_a = 'HU' THEN '-1' WHEN country_a = 'CH' THEN '-1' WHEN country_a = 'IE' THEN '-1' WHEN country_a = 'GB' THEN '-1' WHEN country_a = 'PL' THEN str_suppl3_a WHEN country_a = 'EE' THEN str_suppl3_a WHEN country_a = 'LT' THEN str_suppl3_a WHEN country_a = 'LV' THEN str_suppl3_a ELSE '0' END"
      - column: name_above_door
        expression: "CASE WHEN country_a = 'IT' THEN '-1' WHEN country_a = 'RO' THEN '-1' WHEN country_a = 'CZ' THEN '-1' WHEN country_a = 'SK' THEN '-1' WHEN country_a = 'RS' THEN '-1' WHEN country_a = 'ME' THEN '-1' WHEN country_a = 'KV' THEN '-1' WHEN country_a = 'BG' THEN '-1' WHEN country_a = 'GR' THEN '-1' WHEN country_a = 'CY' THEN '-1' WHEN country_a = 'NG' THEN '-1' WHEN country_a = 'AT' THEN '-1' WHEN country_a = 'HR' THEN '-1' WHEN country_a = 'BA' THEN '-1' WHEN country_a = 'SI' THEN '-1' WHEN country_a = 'MK' THEN '-1' WHEN country_a = 'UA' THEN '-1' WHEN country_a = 'AM' THEN '-1' WHEN country_a = 'MD' THEN '-1' WHEN country_a = 'EG' THEN '-1' WHEN country_a = 'HU' THEN '-1' WHEN country_a = 'CH' THEN '-1' WHEN country_a = 'IE' THEN '-1' WHEN country_a = 'GB' THEN '-1' WHEN country_a = 'PL' THEN '-1' WHEN country_a = 'EE' THEN '-1' WHEN country_a = 'LT' THEN '-1' WHEN country_a = 'LV' THEN '-1' ELSE '0' END"

  - kind: governance_data_quality_processes.custom_operations.text.transliterate_non_latin.TransliterateNonLatinOperation
    name: transliterate_non_latin
    context_name: add_legal_name
    config_kind: governance_data_quality_processes.custom_operation_configs.text.transliterate_non_latin_config.TransliterateNonLatinOperationConfig
    params:
      columns: 
        legal_name: legal_name_translit
        street_a: street_a_translit
        city1_a: city1_a_translit

  - kind: select
    name: select_dm_customer_address
    params:
      columns:
        partner_b: customer_code
        addrnumber_b: address_number
        street_a: street_1_name
        house_num1_a: house_number
        house_num2_a: house_number_supplement
        post_code1_a: post_code
        city1_a: city
        city2_a: district
        country_a: country_code
        is_allowed_country_code_t: is_allowed_country_code
        region_a: region_code
        str_suppl1_a: street_2_name
        str_suppl2_a: street_3_name
        str_suppl3_a: street_4_name
        location_a: street_5_name
        home_city_a: city_billing
        addr_valid_from_b: valid_from
        lot_gc_latitude_l: latitude
        lot_gc_longitud_l: longitude
        bezei_r: region_name
        adr_kind_f: address_type
        legal_name: legal_name
        name_above_door: name_above_door
        legal_name_translit: legal_name_translit
        street_a_translit: street_1_name_translit
        city1_a_translit: city1_a_translit
        sap_cluster_b: sap_cluster

  - kind: cast
    name: cast_long_lati
    params:
      - column: latitude
        to: decimal(15,6)
      - column: longitude
        to: decimal(15,6)

  - kind: write_dataio
    name: write_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address
      process_run_id: '{{process_run_id}}'
      schema_version: v3
      refresh_mode: full