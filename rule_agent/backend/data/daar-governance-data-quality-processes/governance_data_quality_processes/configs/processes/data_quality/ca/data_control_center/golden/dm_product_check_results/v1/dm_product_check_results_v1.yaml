  - kind: group
    name: group_product_uniqueness
    params:
      - aggs:
          duplicated_material_code: collect_list
        by:
        -  rule_code
        -  material_code        
        -  check_status
        -  check_date
        -  country_code
        -  sap_cluster
        -  process_run_id

  - kind: add
    name: add_sales_charg_array
    params:
      - column: duplicated_material_array
        expression: sort_array(collect_list_duplicated_material_code)


  - kind: add
    name: add_duplicated_material_code_batch
    params:
      - column: duplicated_material_code_concat_ws
        expression: concat_ws(',', duplicated_material_array)
      - column: value_checked
        expression: '''N/A'''
      - column: plant_code
        expression: ''''''
      - column: sales_org_code
        expression: ''''''

  - kind: select
