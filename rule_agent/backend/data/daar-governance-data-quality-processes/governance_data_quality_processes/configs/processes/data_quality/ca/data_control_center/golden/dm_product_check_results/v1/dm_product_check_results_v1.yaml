        country_code: country_code
        plant_code: plant_code
        sales_org_code: sales_org_code
        sap_cluster: sap_cluster
        process_run_id: process_run_id
      distinct: true
    skip_next: false


  - kind: union
    name: union_product_check_results
    context_name: read_product_general_completeness
    params:
      allow_missing: false
      by_name: true
      other: read_product_plant_completeness

  - kind: union
