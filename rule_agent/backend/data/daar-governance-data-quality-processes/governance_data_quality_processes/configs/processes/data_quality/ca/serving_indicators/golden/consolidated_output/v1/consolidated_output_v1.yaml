transform:
  name: detailed
  operations:

  - kind: read_dataio
    name: read_du
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: informatica_dq
      namespace: du
      object_name: serving_indicators
      schema_version: v1


  - kind: add
    name: add_du_serving_indicators
    params:
      - column: dq_material_pricing_group_completeness_output
        expression: if(dq_material_pricing_group_completeness_flag = '1', 'OK', 'Missing material pricing group')
      - column: dq_incr_ss_ms_param_completeness_output
        expression: if(dq_incr_ss_ms_param_completeness_flag = '1', 'OK', 'Missing incremental SS_MS parameter')
      - column: dq_coffee_attributes_completeness_output
        expression: if(dq_coffee_channel_completeness_flag = '1' and dq_coffee_format_completeness_flag = '1' , 'OK', 
                    if(dq_coffee_channel_completeness_flag = '0' and dq_coffee_format_completeness_flag = '1' , 'Missing coffee channel attribute', 
                    if(dq_coffee_channel_completeness_flag = '1' and dq_coffee_format_completeness_flag = '0' , 'Missing coffee format attribute', 
                    if(dq_coffee_channel_completeness_flag = '0' and dq_coffee_format_completeness_flag = '0' , 'Missing coffee format and channel attributes', 
                    null))))
      - column: dq_incr_ss_ms_accuracy_rule_output
        expression: if(isnull(dq_incr_ss_ms_accuracy_rule_1_flag) and isnull(dq_incr_ss_ms_accuracy_rule_2_flag) and isnull(dq_incr_ss_ms_accuracy_rule_3_flag) , 'Missing product hierarchy or rule not defined for this product hierarchy', 
                    if(dq_incr_ss_ms_accuracy_rule_1_flag = '3' or dq_incr_ss_ms_accuracy_rule_2_flag = '3' or dq_incr_ss_ms_accuracy_rule_3_flag = '3', 'Failed at completeness', 
                    if(dq_incr_ss_ms_accuracy_rule_1_flag = '1', 'OK', 
                    if(dq_incr_ss_ms_accuracy_rule_2_flag = '1', 'OK', 
                    if(dq_incr_ss_ms_accuracy_rule_3_flag = '1', 'OK', 
                    if(dq_incr_ss_ms_accuracy_rule_3_flag = '2', 'Combination coffee format and coffee channel is not defined in the quality rule', 
                    'Wrongly assigned Incremental SS/MS'))))))
      - column: dq_material_group_accuracy_rule_output
        expression: if(isnull(dq_material_group_accuracy_rule_flag), 'Failed at completeness', 
                    if(dq_material_group_accuracy_rule_flag = '1', 'OK', 
                    if(dq_material_group_accuracy_rule_flag = '2', 'Combination coffee format and coffee channel is not defined in the quality rule', 
                    'Wrongly assigned Material Pricing Group')))
      - column: dq_material_pricing_group_cluster_compare_output
        expression: if(dq_material_pricing_group_cluster_compare_flag = '1', 'OK', 'Mismatch between Material Product Group between clusters')
      - column: dq_incr_ss_ms_param_cluster_compare_output
        expression: if(dq_incr_ss_ms_param_cluster_compare_flag = '1', 'OK', 'Mismatch between Incremental SS MS between clusters')
      - column: dq_coffee_attributes_completeness_flag
        expression: if(dq_coffee_channel_completeness_flag = '1' and dq_coffee_format_completeness_flag = '1', '1', if(isnull(dq_coffee_channel_completeness_flag) or isnull(dq_coffee_format_completeness_flag ), null, '0'))
      - column: dq_incr_ss_ms_accuracy_rule_flag
        expression: if(isnull(dq_incr_ss_ms_accuracy_rule_1_flag) and isnull(dq_incr_ss_ms_accuracy_rule_2_flag) and isnull(dq_incr_ss_ms_accuracy_rule_3_flag) , '0', 
                    if(dq_incr_ss_ms_accuracy_rule_1_flag = '3' or dq_incr_ss_ms_accuracy_rule_2_flag = '3' or dq_incr_ss_ms_accuracy_rule_3_flag = '3', null, 
                    if(dq_incr_ss_ms_accuracy_rule_1_flag = '1', '1', 
                    if(dq_incr_ss_ms_accuracy_rule_2_flag = '1', '1', 
                    if(dq_incr_ss_ms_accuracy_rule_3_flag = '1', '1', 
                    if(dq_incr_ss_ms_accuracy_rule_3_flag = '2', '0', 
                    '0'))))))
      - column: dq_material_group_accuracy_rule_flag
        expression: if(isnull(dq_material_group_accuracy_rule_flag), null, 
                    if(dq_material_group_accuracy_rule_flag = '1', '1', 
                    if(dq_material_group_accuracy_rule_flag = '2', '0', 
                    '0')))
        overwrite: true

        

  - kind: select
    name: select_dq_material_pricing_group_completeness
    context_name: add_du_serving_indicators
    params:
      columns:
