  - kind: union
    name: union_serving_indicators
    params:
      allow_missing: false
      by_name: true
      other: add_dq_incr_ss_ms_param_cluster_compare

  - kind: filter
    name: filter_irrelevant_checks
    context_name: union_serving_indicators
    params:
      - condition:
          isnotnull(quality_check_flag)

  - kind: filter
    name: filter_cl2_consistency_checks
    context_name: union_serving_indicators
    params:
      - condition:
          sap_cluster = 'CL2' and quality_category = 'Consistency'

  - kind: select
    name: select_cl2_consistency_checks
    context_name: filter_cl2_consistency_checks
    params:
      columns:
        material_code: material_code_cl2
        material_name: material_name_cl2
        material_pricing_group: material_pricing_group_cl2
        ss_sm_flag: ss_sm_flag_cl2
        product_hierarchy_level_3_name: product_hierarchy_level_3_name_cl2
        product_hierarchy_level_4_name: product_hierarchy_level_4_name_cl2
        quality_category: quality_category
        rule_name: rule_name
      distinct: true

  - kind: join
    name: join_detailed
    context_name: filter_irrelevant_checks
    params:
      - other:
          select_cl2_consistency_checks
        how:
          left
        columns:
          material_code: material_code_cl2
          quality_category: quality_category
          rule_name: rule_name

  - kind: filter
    name: filter_consistency_from_detailed_if_cl2
    context_name: join_detailed
    params:
      - condition:
          if(sap_cluster = 'CL2' and quality_category = 'Consistency', false, true)

  - kind: write_dataio
    name: write_detailed
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: serving_indicators
      namespace: golden
      object_name: detailed_status
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full

#aggregated

  - kind: select
    name: select_serving_indicators
    context_name: filter_consistency_from_detailed_if_cl2
    params:
      columns:
        product_hierarchy_level_3_code: product_hierarchy_level_3_code
        product_hierarchy_level_3_name: product_hierarchy_level_3_name
        product_hierarchy_level_4_code: product_hierarchy_level_4_code
        product_hierarchy_level_4_name: product_hierarchy_level_4_name
        quality_category: quality_category
        quality_rule: quality_rule
        rule_name: rule_name
        quality_check_flag: total_flag
        sap_cluster: sap_cluster

  - kind: add
    name: add_serving_indicators
    context_name: select_serving_indicators
    params:
      - column: valid_flag
        expression: total_flag
      - column: product_hierarchy_level_3_name
        expression: ifnull(product_hierarchy_level_3_name, '')
        overwrite: true
      - column: product_hierarchy_level_4_name
        expression: ifnull(product_hierarchy_level_4_name, '')
        overwrite: true
      - column: sap_cluster
        expression: if(quality_category = 'Consistency', 'Both', sap_cluster)
        overwrite: true

  - kind: group
    name: group_serving_indicators
    context_name: add_serving_indicators
    params:
      - aggs:
          valid_flag: sum
          total_flag: count
        by:
        - product_hierarchy_level_3_code
        - product_hierarchy_level_3_name
        - product_hierarchy_level_4_code
        - product_hierarchy_level_4_name
        - quality_category
        - quality_rule
        - rule_name
        - sap_cluster

  - kind: add
    name: add_customer_loading_date
    context_name: group_serving_indicators
    params:
      - column: loading_date
        expression: current_date()
      - column: invalid_checks
        expression: count_total_flag - sum_valid_flag
      - column: total_checks
        expression: count_total_flag
      - column: invalid_checks
        expression: CAST(invalid_checks AS INT)
        overwrite: true
      - column: total_checks
        expression: CAST(total_checks AS INT)
        overwrite: true

  - kind: select
    name: select_serving_indicators_aggregated
    context_name: add_customer_loading_date
    params:
      columns:
        product_hierarchy_level_3_code: product_hierarchy_level_3_code
        product_hierarchy_level_3_name: product_hierarchy_level_3_name
        product_hierarchy_level_4_code: product_hierarchy_level_4_code
        product_hierarchy_level_4_name: product_hierarchy_level_4_name
