  - kind: union
    name: union_serving_indicators
    context_name: add_dq_material_pricing_group_completeness
    params:
      allow_missing: false
      by_name: true
      other: add_dq_incr_ss_ms_param_completeness

  - kind: union
    name: union_serving_indicators
    params:
      allow_missing: false
      by_name: true
      other: add_dq_coffee_attributes_completeness

  - kind: union
    name: union_serving_indicators
    params:
