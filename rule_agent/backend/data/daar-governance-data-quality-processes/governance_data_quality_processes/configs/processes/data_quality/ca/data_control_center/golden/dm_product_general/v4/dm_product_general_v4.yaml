transform:
  name: dm_product_general
  operations:

  - kind: read_dataio
    name: read_mara
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mara
      schema_version: v1

  - kind: read_dataio
    name: read_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: makt
      schema_version: v1

  - kind: filter
    name: filter_makt
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_ausp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: ausp
      schema_version: v1

  - kind: group
    name: group_ausp
    params:
      - aggs:
          atzhl: max
        by:
        - objek
        - atinn
        - klart
        - sap_cluster

  - kind: join
    name: join_ausp_self
    context_name: read_ausp
    params:
      - other:
          group_ausp
        how:
          left
        columns:
          objek: objek
          atinn: atinn
          klart: klart
          atzhl: max_atzhl
          sap_cluster: sap_cluster

  - kind: filter
    name: filter_distinct_ausp
    params:
      - condition:
          max_atzhl IS NOT NULL

  - kind: read_dataio
    name: read_cabn
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: cabn
      schema_version: v1

  - kind: read_dataio
    name: read_t134t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t134t
      schema_version: v1

  - kind: filter
    name: filter_t134t
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_t023t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t023t
      schema_version: v1

  - kind: filter
    name: filter_t023t
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_t006a
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t006a
      schema_version: v1

  - kind: filter
    name: filter_t006a
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_t141t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t141t
      schema_version: v1

  - kind: filter
    name: filter_t141t
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_cawnt
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: cawnt
      schema_version: v1

  - kind: read_dataio
    name: read_cawn
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: cawn
      schema_version: v1

  - kind: read_dataio
    name: read_zmdm_bp_code
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: zmdm_bp_code
      schema_version: v1

  - kind: read_dataio
    name: read_zmdm_bpp_codet
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: zmdm_bpp_codet
      schema_version: v1

  - kind: filter
    name: filter_zmdm_bpp_codet
    params:
      - condition:
          spras = 'E'

  - kind: read_dataio
    name: read_ausp_cabn_filter
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: ausp_cabn_filter
      schema_version: v1


  - kind: read_dataio
    name: read_material_type_group_mapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: material_type_group_mapping
      schema_version: v1

  - kind: read_dataio
    name: read_marm
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: marm
      schema_version: v1

  - kind: select
    name: select_marm
    params:
      columns:
        matnr: matnr
        meinh: meinh
        umrez: umrez
        umren: umren
        ean11: ean11_uom
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_marm_pal
    context_name: read_marm
    params:
      - condition:
          meinh = 'PAL'

  - kind: select
    name: select_marm_pal
    params:
      columns:
        matnr: matnr
        umrez: uom_pal_conversion_numerator
        umren: uom_pal_conversion_denominator
        ean11: uom_pal_ean_code
        sap_cluster: sap_cluster
      distinct: true 

  - kind: filter
    name: filter_marm_cs
    context_name: read_marm
    params:
      - condition:
          meinh = 'CS'

  - kind: select
    name: select_marm_cs
    params:
      columns:
        matnr: matnr
        ean11: uom_cs_ean_code
        sap_cluster: sap_cluster
      distinct: true  

  - kind: filter
    name: filter_marm_pc
    context_name: read_marm
    params:
      - condition:
          meinh = 'ST'

  - kind: select
    name: select_marm_pc
    params:
      columns:
        matnr: matnr
        ean11: uom_pc_ean_code
        sap_cluster: sap_cluster
      distinct: true    

  - kind: filter
    name: filter_marm_pack
    context_name: read_marm
    params:
      - condition:
          meinh = 'PAK'

  - kind: select
    name: select_marm_pack
    params:
      columns:
        matnr: matnr
        ean11: uom_pack_ean_code
        sap_cluster: sap_cluster
      distinct: true                         

  - kind: read_dataio
    name: read_zmdm_pack_code
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: zmdm_pack_code
      schema_version: v1

  - kind: select
    name: select_zmdm_pack_code_1
    params:
      columns:
        package_code: package_code
        package_code_d: package_code_d
        pack_type: pack_type
        pack_size: pack_size
        sales_unit: sales_unit
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: grouped_zmdm_pack_code
    context_name: select_zmdm_pack_code_1
    params:
      - aggs:
          package_code_d: max
        by:
        - package_code
        - sap_cluster

  - kind: join
    name: join_zmdm_pack_code
    context_name: select_zmdm_pack_code_1
    params:
      - other:
          grouped_zmdm_pack_code
        how:
          left
        columns:
          package_code_d: max_package_code_d
          package_code: package_code
          sap_cluster: sap_cluster

  - kind: filter
    name: filter_zmdm_pack_code
    context_name: join_zmdm_pack_code
    params:
      - condition:
          max_package_code_d IS NOT NULL

  - kind: select
    name: select_zmdm_pack_code
    params:
      columns:
        package_code: package_code
        package_code_d: package_code_d
        pack_type: pack_type
        pack_size: pack_size
        sales_unit: sales_unit
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: ausp_cabn_filter_cl1
    context_name: read_ausp_cabn_filter
    params:
      columns:
        atinn_cl1: atinn
        atnam: atnam

  - kind: add
    name: add_ausp_cabn_filter_cl1
    params:
      - column: sap_cluster
        expression: '''CL1'''

  - kind: select
    name: ausp_cabn_filter_cl2
    context_name: read_ausp_cabn_filter
    params:
      columns:
        atinn_cl2: atinn
        atnam: atnam

  - kind: add
    name: add_ausp_cabn_filter_cl2
    params:
      - column: sap_cluster
        expression: '''CL2'''

  - kind: union
    name: union_ausp_cabn_filter
    params:
      allow_missing: false
      by_name: true
      other: add_ausp_cabn_filter_cl1

  - kind: select
    name: select_ausp
    context_name: filter_distinct_ausp
    params:
      columns:
        objek: objek
        atinn: atinn
        atwrt: atwrt
        atflv: atflv
        klart: klart
        sap_cluster: sap_cluster

  - kind: select
    name: select_cabn
    context_name: read_cabn
    params:
      columns:
        atinn: atinn
        atnam: atnam
        sap_cluster: sap_cluster

  - kind: join
    name: join_cabn_filter
    params:
      - other:
          union_ausp_cabn_filter
        how:
          inner
        columns:
          atnam: atnam
          atinn: atinn
          sap_cluster: sap_cluster

  - kind: join
    name: join_ausp_cabn_filter
    context_name: select_ausp
    params:
      - other:
          join_cabn_filter
        how:
          inner
        columns:
          atinn: atinn
          sap_cluster: sap_cluster

  - kind: add
    name: add_objek_lpad
    params:
      - column: objek_lpad
        expression: lpad(objek, 18, '0')
      - column: atwrt4
        expression: left(atwrt, 4)
      - column: bpp_physical_state_code
        expression: substr(atwrt, 5, 2)
      - column: bpp_physical_state_name
        expression: case when substr(atwrt, 5, 2) = '05' then 'Packaged Finished Drink'
                    when substr(atwrt, 5, 2) = '03' then 'Postmix Syrup'
                    when substr(atwrt, 5, 2) = '07' then 'Premix Finished Drink'
                    else '' end
      - column: bpp_package_code
        expression: right(atwrt, 4)

  - kind: select
    name: select_distinct_ausp
    params:
      columns:
        objek: objek
        objek_lpad: objek_lpad
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_zmdm_bp_code
    context_name: read_zmdm_bp_code
    params:
      columns:
        atwrt4: atwrt4
        bevprd: bevprd
        mvgr1: mvgr1
        mvgr2: mvgr2
        sap_cluster: sap_cluster

  - kind: select
    name: select_cawn
    context_name: read_cawn
    params:
      columns:
        atinn: atinn
        atwrt: atwrt
        atzhl: atzhl
        sap_cluster: sap_cluster

  - kind: select
    name: select_cawnt
    context_name: read_cawnt
    params:
      columns:
        atinn: atinn
        atwtb: atwtb
        atzhl: atzhl
        sap_cluster: sap_cluster

  - kind: select
    name: select_zmdm_bpp_codet
    context_name: read_zmdm_bpp_codet
    params:
      columns:
        atwrt: atwrt
        atwtb: bpp_name
        sap_cluster: sap_cluster

  - kind: join
    name: join_ausp_cawn_cawnt_zmdm
    context_name: add_objek_lpad
    params:
      - other:
          select_zmdm_bp_code
        how:
          left
        columns:
          atwrt4: atwrt4
          sap_cluster: sap_cluster
      - other:
          select_cawn
        how:
          left
        columns:
          atinn: atinn
          atwrt: atwrt
          sap_cluster: sap_cluster
      - other:
          select_cawnt
        how:
          left
        columns:
          atinn: atinn
          atzhl: atzhl
          sap_cluster: sap_cluster
      - other:
          select_zmdm_bpp_codet
        how:
          left
        columns:
          atwrt: atwrt
          sap_cluster: sap_cluster
      - other:
          select_zmdm_pack_code
        how:
          left
        columns:
          bpp_package_code: package_code
          sap_cluster: sap_cluster

  - kind: filter
    name: filter_ausp_cch
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_COFFEE_CHANNEL'

  - kind: select
    name: select_ausp_cch
    params:
      columns:
        objek: objek
        atwrt: coffee_channel_code
        atwtb: coffee_channel_name
        sap_cluster: sap_cluster
      distinct: true   

  - kind: filter
    name: filter_ausp_cc
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_COFFEE_CLASS'

  - kind: select
    name: select_ausp_cc
    params:
      columns:
        objek: objek
        atwrt: coffee_class_code
        atwtb: coffee_class_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_cf
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_COFFEE_FORMAT'

  - kind: select
    name: select_ausp_cf
    params:
      columns:
        objek: objek
        atwrt: coffee_format_code
        atwtb: coffee_format_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_cm
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_COFFEE_METHOD'

  - kind: select
    name: select_ausp_cm
    params:
      columns:
        objek: objek
        atwrt: coffee_method_code
        atwtb: coffee_method_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_ccs
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_COFFEE_CAPSULE_SYSTEM'

  - kind: select
    name: select_ausp_ccs
    params:
      columns:
        objek: objek
        atwrt: coffee_capsule_system_code
        atwtb: coffee_capsule_system_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_bpp
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'CCHBC_BPP_CODE' and klart='001'


  - kind: add
    name: add_bpp_code
    params:
      - column: bpp_code
        expression: IF(klart='001', atwrt, null)
      - column: bpp_bp_code
        expression: IF(klart='001', atwrt4, null)
      - column: bpp_physical_state_code
        expression: IF(klart='001', bpp_physical_state_code, null)
        overwrite: true
      - column: bpp_package_code
        expression: IF(klart='001', bpp_package_code, null)
        overwrite: true

  - kind: select
    name: select_ausp_bpp
    params:
      columns:
        objek: objek
        bpp_code: bpp_code
        bpp_name: bpp_name
        bpp_bp_code: bpp_bp_code
        bevprd: bpp_bp_name
        bpp_physical_state_code: bpp_physical_state_code
        bpp_physical_state_name: bpp_physical_state_name
        bpp_package_code: bpp_package_code
        package_code_d: package_code_d
        mvgr1: mvgr1
        mvgr2: mvgr2
        pack_type: pack_type
        pack_size: pack_size
        sales_unit: sales_unit
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_mmcm
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'SPR_MM_CORE_MATERIAL' and klart='001'

  - kind: add
    name: add_ausp_mmcm
    params:
      - column: spr_core_material_code
        expression: IF(klart='001', atwrt, null)
      - column: spr_core_material_name
        expression: IF(klart='001', atwtb, null)

  - kind: select
    name: select_ausp_mmcm
    params:
      columns:
        objek: objek
        spr_core_material_code: spr_core_material_code
        spr_core_material_name: spr_core_material_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_mms
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'SPR_MM_SHAPE' and klart='001'

  - kind: add
    name: add_ausp_mms
    params:
      - column: spr_shape_code
        expression: IF(klart='001', atwrt, null)
      - column: spr_shape_name
        expression: IF(klart='001', atwtb, null)

  - kind: select
    name: select_ausp_mms
    params:
      columns:
        objek: objek
        spr_shape_code: spr_shape_code
        spr_shape_name: spr_shape_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_mmw
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'SPR_MM_WEIGHT' and klart='001'

  - kind: add
    name: add_ausp_mmw
    params:
      - column: spr_weight
        expression: IF(klart='001', atflv, null)

  - kind: select
    name: select_ausp_mmw
    params:
      columns:
        objek: objek
        spr_weight: spr_weight
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_mmco2
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'SPR_MM_CO2' and klart='001'

  - kind: add
    name: add_ausp_mmco2
    params:
      - column: spr_co2
        expression: IF(klart='001', atflv, null)

  - kind: select
    name: select_ausp_mmco2
    params:
      columns:
        objek: objek
        spr_co2: spr_co2
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_mmrc
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'SPR_MM_RECYCLE_CONTENT' and klart='001'

  - kind: add
    name: add_ausp_mmrc
    params:
      - column: spr_recycle_content
        expression: IF(klart='001', atflv, null)

  - kind: select
    name: select_ausp_mmrc
    params:
      columns:
        objek: objek
        spr_recycle_content: spr_recycle_content
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_ausp_pm
    context_name: join_ausp_cawn_cawnt_zmdm
    params:
      - condition:
          atnam = 'PM_TYPENUMBER'

  - kind: select
    name: select_ausp_pm
    params:
      columns:
        objek: objek
        atwrt: type_number
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_ausp_all
    context_name: select_distinct_ausp
    params:
      - other:
          select_ausp_cch
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_cc
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_cf
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_cm
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_ccs
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_bpp
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_mmcm
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_mms
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_mmw
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_mmco2
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_mmrc
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster
      - other:
          select_ausp_pm
        how:
          left
        columns:
          objek: objek
          sap_cluster: sap_cluster

  - kind: select
    name: select_mara
    context_name: read_mara
    params:
      columns:
        matnr: matnr
        ean11: ean11
        wrkst: wrkst
        brgew: brgew
        gewei: gewei
        ntgew: ntgew
        tempb: tempb
        gds_relevant: gds_relevant
        matkl: matkl
        meins: meins
        mfrpn: mfrpn
        mhdhb: mhdhb
        mhdrz: mhdrz
        mstae: mstae
        mtart: mtart
        mtpos_mara: mtpos_mara
        lvorm: lvorm
        laeda: laeda
        ersda: ersda
        rmatp: rmatp
        volum: volum
        voleh: voleh
        sap_cluster: sap_cluster
        raube: raube
        bismt: bismt

  - kind: add
    name: add_mara
    params:
      - column: material_type_name_unified
        expression: case when mtart IN('ZFG', 'ZFGS', 'ZFGC', 'ZFGM', 'ZFGA', 'ZNVM') then 'Finished Goods'
                    when mtart IN('ZRW', 'ZSF', 'ZNVL') then 'Raw Material and Semi- FG'
                    when mtart IN('ZSPS', 'ZCDS') then 'Spare Parts'
                    when mtart IN('ZCDC', 'ZCDE') then 'Equipment'
                    when mtart IN('ZKIT') then 'Concentrate KITs'
                    when mtart IN('ZSV') then 'Services'
                    when mtart IN('ZSTL') then 'Settlement'
                    else '' end
      - column: matnr_lpad
        expression: lpad(matnr, 18, '0')

