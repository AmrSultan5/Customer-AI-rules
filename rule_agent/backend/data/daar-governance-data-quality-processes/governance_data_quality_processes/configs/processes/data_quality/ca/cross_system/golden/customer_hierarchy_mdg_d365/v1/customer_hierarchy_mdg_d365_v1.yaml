        - column: msg_customer_hierarchy_cpl_lv5
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND cpl_d365 <> cpl_mdg THEN 'attributes are mismatching' END
        - column: lv_customer_hierarchy_cpl_lv5
          expression: cast('cpl' as string)

    - kind: select
      name: final_customer_hierarchy_cpl_lv5
      context_name: add_missing_columns_customer_hierarchy_cpl_lv5
      params:
        columns:
          partner_mdg: partner
          lv_customer_hierarchy_cpl_lv5: lv
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_customer_hierarchy_cpl_lv5: msg
          attr_name_customer_hierarchy_cpl_lv5: attr_name
          cpl_d365: tgt_attr
          cpl_mdg: src_attr

##LV4
