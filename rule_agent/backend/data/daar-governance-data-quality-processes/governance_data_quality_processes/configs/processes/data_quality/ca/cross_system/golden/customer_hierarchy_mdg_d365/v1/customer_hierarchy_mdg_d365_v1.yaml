      context_name: customer_hierarchy_lv2_filter
      params:
        - column: attr_name_customer_hierarchy_lv2
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND level2_d365 <> level2_mdg THEN concat('customer hierarchy:' ,' level 2') END
        - column: msg_customer_hierarchy_lv2
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND level2_d365 <> level2_mdg THEN 'attributes are mismatching' END
        - column: lv_customer_hierarchy_lv2
