transform:
  name: customer_hierarchy_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_zmdgc_knvh
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: zmdgc_knvh
        schema_version: v1

    - kind: filter
      name: filter_mdg_zmdgc_knvh
      context_name: read_mdg_zmdgc_knvh
      params:
        - condition: To_date(zdatbi, 'yyyyMMdd') > Getdate() and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600) and kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')  and vtweg = '01' and spart = '01'

    - kind: select
      name: select_mdg_zmdgc_knvh
      context_name: filter_mdg_zmdgc_knvh
      params:
        columns:
          KUNNR: partner_zmdgc_knvh
          vkorg: vkorg_zmdgc_knvh
          vtweg: vtweg_zmdgc_knvh
          spart: spart_zmdgc_knvh
          zkunnr2: zkunnr2_zmdgc_knvh
          zkunnr3: zkunnr3_zmdgc_knvh
          zkunnr4: zkunnr4_zmdgc_knvh
          zkunnr5: zkunnr5_zmdgc_knvh
          zkunnr6: zkunnr6_zmdgc_knvh

    - kind: add
      name: add_mdg_columns
      context_name: select_mdg_zmdgc_knvh
      params:
      - column: hash_mdg
        expression: Md5(Concat(partner_zmdgc_knvh, vkorg_zmdgc_knvh, vtweg_zmdgc_knvh, spart_zmdgc_knvh, vkorg_zmdgc_knvh, zkunnr2_zmdgc_knvh, zkunnr3_zmdgc_knvh,zkunnr4_zmdgc_knvh, zkunnr5_zmdgc_knvh, zkunnr6_zmdgc_knvh))
      - column: vkorg_mdg
        expression: vkorg_zmdgc_knvh

    - kind: select
      name: mdg_
      context_name: add_mdg_columns
      params:
        columns:
          partner_zmdgc_knvh: partner_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_zmdgc_knvh: vtweg_mdg
          spart_zmdgc_knvh: spart_mdg
          vkorg_zmdgc_knvh: level1_mdg
          zkunnr2_zmdgc_knvh: level2_mdg
          zkunnr3_zmdgc_knvh: level3_mdg
          zkunnr4_zmdgc_knvh: level4_mdg
          zkunnr5_zmdgc_knvh: cpl_mdg
          zkunnr6_zmdgc_knvh: cpl_division_mdg
          hash_mdg: hash_mdg
        distinct: true

    - kind: checkpoint
      name: mdg
      context_name: mdg_
##############################################################################
###############################################################################
    - kind: read_dataio
      name: read_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1
    
    
##  ###################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true
    
##  ###################################################
##  E distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true
    
##  ##################################################################

    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1

    - kind: select
      name: select_d365_account
      context_name: read_d365_account
      params:
        columns:
          cch_sapid: cch_sapid
          cch_salesorganizationidname: cch_salesorganizationidname
          parentaccountid: parentaccountid
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          statuscode: statuscode
          statecode: statecode
          cch_salesorganizationid: cch_salesorganizationid

    - kind: select
      name: select_d365_account_acc6
      context_name: read_d365_account
      params:
        columns:
          id: id_acc6
          cch_sapid: cch_sapid_acc6
          parentaccountid: parentaccountid_acc6

    - kind: select
      name: select_d365_account_acc5
      context_name: read_d365_account
      params:
        columns:
          id: id_acc5
          cch_hierarchylevel4id: cch_hierarchylevel4id_acc5
          cch_sapid: cch_sapid_acc5

    - kind: read_dataio
      name: read_d365_cch_hierarchylevel
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_hierarchylevel
        schema_version: v1

    - kind: select
      name: select_d365_cch_hierarchylevel_l4
      context_name: read_d365_cch_hierarchylevel
      params:
        columns:
          cch_code: cch_code_l4
          id: id_l4
          cch_higherhierarchylevelid: cch_higherhierarchylevelid_l4

    - kind: select
      name: select_d365_cch_hierarchylevel_l3
      context_name: read_d365_cch_hierarchylevel
      params:
        columns:
          cch_code: cch_code_l3
          id: id_l3
          cch_higherhierarchylevelid: cch_higherhierarchylevelid_l3

    - kind: select
      name: select_d365_cch_hierarchylevel_l2
      context_name: read_d365_cch_hierarchylevel
      params:
        columns:
          cch_code: cch_code_l2
          id: id_l2

    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1

    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true

    - kind: join
      name: join_d365
      context_name: select_d365_account
      params:
        - other:
            select_d365_account_acc6
          how:
            left
          columns:
            parentaccountid: id_acc6
        - other:
            select_d365_account_acc5
          how:
            left
          columns:
            parentaccountid_acc6: id_acc5
        - other:
            select_d365_cch_hierarchylevel_l4
          how:
            left
          columns:
            cch_hierarchylevel4id_acc5: id_l4
        - other:
            select_d365_cch_hierarchylevel_l3
          how:
            left
          columns:
            cch_higherhierarchylevelid_l4: id_l3
        - other:
            select_d365_cch_hierarchylevel_l2
          how:
            left
          columns:
            cch_higherhierarchylevelid_l3: id_l2
        - other:
            union_cte_distributionchannel
          how:
            left
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            left
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id

    - kind: add
      name: add_d365_columns
      context_name: join_d365
      params:
      - column: hash_d365
        expression: md5(concat(cch_sapid,territory_cch_sapid,dc_cch_externalvalue,cd_cch_externalvalue,territory_cch_sapid,cch_code_l2,cch_code_l3,cch_code_l4,cch_sapid_acc5,cch_sapid_acc6))
      - column: vkorg_d365
        expression: territory_cch_sapid

    - kind: filter
      name: filter_d365
      params:
        - condition: cch_sapid  like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')  and dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

    - kind: select
      name: d365_
      context_name: filter_d365
      params:
        columns:
          cch_sapid: partner_d365
          vkorg_d365: vkorg_d365
          dc_cch_externalvalue: vtweg_d365
          cd_cch_externalvalue: spart_d365
          territory_cch_sapid: level1_d365
          cch_code_l2: level2_d365
          cch_code_l3: level3_d365
          cch_code_l4: level4_d365
          cch_sapid_acc5: cpl_d365
          cch_sapid_acc6: cpl_division_d365
          hash_d365: hash_d365
        distinct: true

    - kind: checkpoint
      name: d365
      context_name: d365_

    - kind: join
      name: join_non_matching_mdg_
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            hash_mdg: hash_d365

    - kind: checkpoint
      name: join_non_matching_mdg
      context_name: join_non_matching_mdg_

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: hash_d365 is null or hash_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          level1_mdg: level1_mdg
          level2_mdg: level2_mdg
          level3_mdg: level3_mdg
          level4_mdg: level4_mdg
          cpl_mdg: cpl_mdg
          cpl_division_mdg: cpl_division_mdg
          hash_mdg: hash_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: hash_mdg is null or hash_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          partner_d365: partner_d365
          vkorg_d365: vkorg_d365
          vtweg_d365: vtweg_d365
          spart_d365: spart_d365
          level1_d365: level1_d365
          level2_d365: level2_d365
          level3_d365: level3_d365
          level4_d365: level4_d365
          cpl_d365: cpl_d365
          cpl_division_d365: cpl_division_d365
          hash_d365: hash_d365

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_d365_select
          how:
            full
          columns:
            partner_mdg: partner_d365
            vkorg_mdg: vkorg_d365
            vtweg_mdg: vtweg_d365
            spart_mdg: spart_d365

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('d365' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_d365
          expression: CASE WHEN partner_d365 IS NULL THEN 'data missing from d365' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)  
        - column: null_value
          expression: cast(NULL as string)    

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_d365: partner
          null_value: lv
          vkorg_d365: vkorg
          vtweg_d365: vtweg
          spart_d365: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: filter
      name: join_data_missing_from_d365_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_d365 is null

    - kind: select
      name: final_data_missing_from_d365
      context_name: join_data_missing_from_d365_filter
      params:
        columns:
          partner_mdg: partner
          null_value: lv
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_d365: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##CPL_DIVISION LV6
    - kind: filter
      name: customer_hierarchy_cpl_division_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND cpl_division_d365 <> cpl_division_mdg

    - kind: add
      name: add_missing_columns_customer_hierarchy_cpl_division
      context_name: customer_hierarchy_cpl_division_filter
      params:
        - column: attr_name_customer_hierarchy_cpl_division
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND cpl_division_d365 <> cpl_division_mdg THEN concat('customer hierarchy:' ,' cpl division') END
        - column: msg_customer_hierarchy_cpl_division
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND cpl_division_d365 <> cpl_division_mdg THEN 'attributes are mismatching' END
        - column: lv_customer_hierarchy_cpl_division
          expression: cast('CPL_DIVISION' as string)

    - kind: select
      name: final_customer_hierarchy_cpl_division
      context_name: add_missing_columns_customer_hierarchy_cpl_division
      params:
        columns:
          partner_mdg: partner
          lv_customer_hierarchy_cpl_division: lv
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          src_system: src_system
          tgt_system: tgt_system
          msg_customer_hierarchy_cpl_division: msg
          attr_name_customer_hierarchy_cpl_division: attr_name
          cpl_division_d365: tgt_attr
          cpl_division_mdg: src_attr

##CPL LV5
    - kind: filter
      name: customer_hierarchy_cpl_lv5_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND cpl_d365 <> cpl_mdg

    - kind: add
      name: add_missing_columns_customer_hierarchy_cpl_lv5
      context_name: customer_hierarchy_cpl_lv5_filter
      params:
