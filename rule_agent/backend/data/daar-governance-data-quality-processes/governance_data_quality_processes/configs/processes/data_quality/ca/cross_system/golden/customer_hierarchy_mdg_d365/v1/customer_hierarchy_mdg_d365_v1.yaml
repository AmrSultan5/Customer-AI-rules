        - column: msg_customer_hierarchy_lv1
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND level1_d365 <> level1_mdg THEN 'attributes are mismatching' END
