          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND level4_d365 <> level4_mdg THEN 'attributes are mismatching' END
        - column: lv_customer_hierarchy_lv4
          expression: cast('Level 4' as string)

    - kind: select
      name: final_customer_hierarchy_lv4
      context_name: add_missing_columns_customer_hierarchy_lv4
      params:
        columns:
