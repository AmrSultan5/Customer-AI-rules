##LV2
    - kind: filter
      name: customer_hierarchy_lv2_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND level2_d365 <> level2_mdg

    - kind: add
