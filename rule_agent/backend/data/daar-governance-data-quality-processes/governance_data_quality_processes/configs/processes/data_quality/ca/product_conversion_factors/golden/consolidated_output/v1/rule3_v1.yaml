# --------------------------------Write_DETAILED---------------------------------
  - kind: write_dataio
    name: write_detailed_status
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: product_conversion_factors
      namespace: golden
      object_name: rule3_ds
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
# ---------------------------------AGGREGATED------------------------------------

  - kind: add
    name: add_checks
    context_name: union_all
    params:
      - column: total_checks
        expression: IF(check_flag != '', 1, 0)
      - column: invalid_checks
        expression: IF(check_flag = '0', 1, 0)

  - kind: group
    name: aggregated_data
    context_name: add_checks
    params:
      - aggs:
          material_code: count
          total_checks: sum
          invalid_checks: sum
        by:
        - sap_cluster
        - alternative_unit_of_measure_code
        - rule_name
        - rule_code
        - quality_category

  - kind: add
    name: add_loading_date
    context_name: aggregated_data
    params:
      - column: loading_date
        expression: current_date()

  - kind: select
    name: select_aggregated_data
    context_name: add_loading_date
    params:
      columns:
        sap_cluster: sap_cluster
        alternative_unit_of_measure_code: alternative_unit_of_measure_code
        rule_name: rule_name
        rule_code: rule_code
        count_material_code: total_records
        sum_total_checks: total_checks
        quality_category: quality_category
        sum_invalid_checks: invalid_checks
        loading_date: loading_date
      distinct: true

