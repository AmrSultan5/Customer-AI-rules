transform:
  name: uc07_rule_3
  operations:

#READ dm_material
  - kind: read_dataio
    name: read_dm_material
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material
      schema_version: v6

  - kind: select
    name: select_dmm
    context_name: read_dm_material
    params:
      columns:
        material_code: material_code_m
        material_name: material_description
        material_type_code: material_type_code
        sales_organization: sales_org_code
        unit_of_measure_code: base_unit_of_measure_code
        unit_of_measure_name: base_unit_of_measure_name
        distribution_channel: distribution_channel_code
        brand_code: brand_code
        brand_description: brand_name
        flavour_code: flavour_code
        flavour_description: flavour_name
        package_type_code: pack_type_code
        package_type_name: pack_type_name
        package_size_code: pack_size_code
        package_size_name: pack_size_name
        sales_unit_code: sales_unit_code
        sales_unit_name: sales_unit_name
        pack_size_uom_unified: pack_size_uom_unified
        pack_size_volume_unified: pack_size_volume_unified
        total_sales_units: total_sales_units
        product_hierarchy: product_hierarchy_code
        product_hierarchy_name: product_hierarchy_name
        product_hierarchy_level_5_code: product_hierarchy_level_5_code
        sap_cluster: sap_cluster_m
      distinct: true

  - kind: filter
    name: filter_dmm
    context_name: select_dmm
    params:
      - condition:
          material_type_code IN ('ZFG','ZFGS','ZFGC','ZFGA','ZFGM') AND brand_code NOT IN ('ZV7','ZYU','ZYV','Z88','Z99') AND sales_org_code = '0001' AND distribution_channel_code = '01' AND product_hierarchy_code IS NOT NULL AND product_hierarchy_code != '' AND product_hierarchy_level_5_code IS NOT NULL AND product_hierarchy_level_5_code != '' AND product_hierarchy IN ('010300421792179','010300421792180','010300421792182','010300421792183','010300421792184','010300421792181','010300421792185','010300421792186','010300421792187','010300421792188','010300421792189','010300421792191','010300421792190') #AND material_code_m = '000000000001925701'

# Convert nulls and text to numbers
  - kind: add
    name: add_convert_null_to_zero
    context_name: filter_dmm
    params:
      - column: total_sales_units
        expression: "CASE WHEN total_sales_units IS NULL OR UPPER(total_sales_units) IN ('FOOD','OTHER','PMX BIB','PMX TANK','PRE TANK') THEN '0' ELSE total_sales_units END"
        overwrite: true
      - column: pack_size_volume_unified
        expression: "CASE WHEN pack_size_volume_unified IS NULL OR UPPER(pack_size_volume_unified) IN ('UNKNOWN') THEN '0' ELSE pack_size_volume_unified END"
        overwrite: true

#READ unit_of_measure
  - kind: read_dataio
    name: read_dm_unit_of_measure
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_unit_of_measure
      schema_version: v1

  - kind: select
    name: select_dmuom_initial
    context_name: read_dm_unit_of_measure
    params:
      columns:
        material_code: material_code_uom
        conversion_numerator: conversion_numerator
        conversion_denominator: conversion_denominator
        alternative_unit_of_measure_code: alternative_unit_of_measure_code
        sap_cluster: sap_cluster_uom
      distinct: true

# Add_dummy_id and convert UOM ST -> PC
  - kind: add
    name: add_dummy_id
    context_name: select_dmuom_initial
    params:
      - column: id_uom
        expression: "'1'"
      - column: alternative_unit_of_measure_code
        expression: "CASE WHEN alternative_unit_of_measure_code = 'ST' THEN 'PC' ELSE alternative_unit_of_measure_code END"
        overwrite: true

# --------------------------distinct_unit_of_measure-------------------------------------
  - kind: select
    name: select_distinct_uom
    context_name: read_dm_unit_of_measure
    params:
      columns:
        alternative_unit_of_measure_code: distinct_uom
      distinct: true

  - kind: filter
    name: filter_distinct_uom
    context_name: select_distinct_uom
    params:
      - condition: distinct_uom IN ('CS','CTR','EA','EC','KG','L','PAL','PC','SRV','UC','VCS','ZLI')

# Add_dummy_id to distinct
  - kind: add
    name: add_dummy_id_distinct
    context_name: filter_distinct_uom
    params:
      - column: id_uom_distinct
        expression: "'1'"

# --------------------------uom_material_list-------------------------------------
  - kind: select
    name: select_material_list
    context_name: add_dummy_id
    params:
      columns:
        id_uom: id_uom_material
        material_code_uom: material_code_material
        sap_cluster_uom: sap_cluster_material
      distinct: true

#JOIN uom_materials_with_full_list_of_uom
  - kind: join
    name: join_material_uom_final
    context_name: select_material_list
    params:
      - other:
          add_dummy_id_distinct
        how:
          left
        columns:
          id_uom_material: id_uom_distinct
      - other:
          add_dummy_id
        how:
          left
        columns:
          material_code_material: material_code_uom
          sap_cluster_material: sap_cluster_uom
          distinct_uom: alternative_unit_of_measure_code
  
  # -------------------final_select_after_uom_material_join
  - kind: select
    name: select_dmuom
    context_name: join_material_uom_final
    params:
      columns:
        material_code_material: material_code_uom
        conversion_numerator: conversion_numerator
        conversion_denominator: conversion_denominator
        distinct_uom: alternative_unit_of_measure_code
        sap_cluster_material: sap_cluster_uom
      distinct: true

#----------------------JOIN material and uom
  - kind: join
    name: join_rule_3
    context_name: add_convert_null_to_zero
    params:
      - other:
          select_dmuom
        how:
          inner
        columns:
          material_code_m: material_code_uom
          sap_cluster_m: sap_cluster_uom

# Convert ML -> L, G -> KG
  - kind: add
    name: add_convert
    context_name: join_rule_3
    params:
      - column: pack_size_volume_unified
        expression: "
                    CASE 
                      WHEN pack_size_uom_unified = 'ML' AND pack_size_volume_unified > 0 THEN pack_size_volume_unified/1000
                      WHEN pack_size_uom_unified = 'G' AND pack_size_volume_unified > 0 THEN pack_size_volume_unified/1000 
                    ELSE pack_size_volume_unified 
                    END"
        overwrite: true
      - column: pack_size_uom_unified
        expression: "
                    CASE 
                      WHEN pack_size_uom_unified = 'ML' THEN 'L'
                      WHEN pack_size_uom_unified = 'G' THEN 'KG' 
                    ELSE pack_size_uom_unified 
                    END"
        overwrite: true

  - kind: cast
    name: cast_to_decimal
    context_name: add_convert
    params:
      - column: pack_size_volume_unified
        to: decimal(7,5)
      - column: total_sales_units
        to: decimal(7,3)

  - kind: add
    name: add_uom
    context_name: cast_to_decimal
    params:
      - column: uom_pal_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='PAL' THEN conversion_numerator ELSE NULL END"
      - column: uom_pal_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='PAL' THEN conversion_denominator ELSE NULL END"
      - column: uom_ea_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='EA' THEN conversion_numerator ELSE NULL END"
      - column: uom_ea_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='EA' THEN conversion_denominator ELSE NULL END"
      - column: uom_cs_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='CS' THEN conversion_numerator ELSE NULL END"
      - column: uom_cs_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='CS' THEN conversion_denominator ELSE NULL END"
      - column: uom_ec_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='EC' THEN conversion_numerator ELSE NULL END"
      - column: uom_ec_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='EC' THEN conversion_denominator ELSE NULL END"
      - column: uom_pc_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='PC' THEN conversion_numerator ELSE NULL END"
      - column: uom_pc_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='PC' THEN conversion_denominator ELSE NULL END"
      - column: uom_l_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='L' THEN conversion_numerator ELSE NULL END"
      - column: uom_l_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='L' THEN conversion_denominator ELSE NULL END"
      - column: uom_zli_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='ZLI' THEN conversion_numerator ELSE NULL END"
      - column: uom_zli_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='ZLI' THEN conversion_denominator ELSE NULL END"
      - column: uom_uc_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='UC' THEN conversion_numerator ELSE NULL END"
      - column: uom_uc_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='UC' THEN conversion_denominator ELSE NULL END"
      - column: uom_ctr_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='CTR' THEN conversion_numerator ELSE NULL END"
      - column: uom_ctr_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='CTR' THEN conversion_denominator ELSE NULL END"
      - column: uom_srv_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='SRV' THEN conversion_numerator ELSE NULL END"
      - column: uom_srv_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='SRV' THEN conversion_denominator ELSE NULL END"
      - column: uom_vcs_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='VCS' THEN conversion_numerator ELSE NULL END"
      - column: uom_vcs_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='VCS' THEN conversion_denominator ELSE NULL END"
      - column: uom_kg_conversion_numerator
        expression: "CASE WHEN alternative_unit_of_measure_code='KG' THEN conversion_numerator ELSE NULL END"
      - column: uom_kg_conversion_denominator
        expression: "CASE WHEN alternative_unit_of_measure_code='KG' THEN conversion_denominator ELSE NULL END"
      - column: rule_name
        expression: "'Diary'"
      - column: rule_code
        expression: "'rule_3_ca'"
      - column: quality_category
        expression: "'Completeness/Accuracy'"


  - kind: group
    name: agg_uom
    context_name: add_uom
    params:
      - aggs:
          uom_pal_conversion_numerator: max
          uom_pal_conversion_denominator: max
          uom_ea_conversion_numerator: max
          uom_ea_conversion_denominator: max
          uom_cs_conversion_numerator: max
          uom_cs_conversion_denominator: max
          uom_ec_conversion_numerator: max
          uom_ec_conversion_denominator: max
          uom_pc_conversion_numerator: max
          uom_pc_conversion_denominator: max
          uom_l_conversion_numerator: max
          uom_l_conversion_denominator: max
          uom_zli_conversion_numerator: max
          uom_zli_conversion_denominator: max
          uom_uc_conversion_numerator: max
          uom_uc_conversion_denominator: max
          uom_ctr_conversion_numerator: max
          uom_ctr_conversion_denominator: max
          uom_srv_conversion_numerator: max
          uom_srv_conversion_denominator: max
          uom_vcs_conversion_numerator: max
          uom_vcs_conversion_denominator: max
          uom_kg_conversion_numerator: max
          uom_kg_conversion_denominator: max
        by:
        - material_code_m
        - sap_cluster_m

#----------------------JOIN aggregated nominators and denominators for uom
  - kind: join
    name: join_agg_uom
    context_name: add_uom
    params:
      - other:
          agg_uom
        how:
          left
        columns:
          material_code_m: material_code_m
          sap_cluster_m: sap_cluster_m

  - kind: select
    name: select_uom
    context_name: join_agg_uom
    params:
      columns:
         material_code_m: material_code_m
         material_description: material_description
         material_type_code: material_type_code
         sales_org_code: sales_org_code
         base_unit_of_measure_code: base_unit_of_measure_code
         base_unit_of_measure_name: base_unit_of_measure_name
         distribution_channel_code: distribution_channel_code
         brand_code: brand_code
         brand_name: brand_name
         flavour_code: flavour_code
         flavour_name: flavour_name
         pack_type_code: pack_type_code
         pack_type_name: pack_type_name
         pack_size_code: pack_size_code
         pack_size_name: pack_size_name
         sales_unit_code: sales_unit_code
         sales_unit_name: sales_unit_name
         pack_size_uom_unified: pack_size_uom_unified
         pack_size_volume_unified: pack_size_volume_unified
         total_sales_units: total_sales_units
         product_hierarchy_code: product_hierarchy_code
         product_hierarchy_name: product_hierarchy_name
         product_hierarchy_level_5_code: product_hierarchy_level_5_code
         sap_cluster_m: sap_cluster_m
         conversion_numerator: conversion_numerator
         conversion_denominator: conversion_denominator
         alternative_unit_of_measure_code: alternative_unit_of_measure_code
         max_uom_pal_conversion_numerator: uom_pal_conversion_numerator
         max_uom_pal_conversion_denominator: uom_pal_conversion_denominator
         max_uom_ea_conversion_numerator: uom_ea_conversion_numerator
         max_uom_ea_conversion_denominator: uom_ea_conversion_denominator
         max_uom_cs_conversion_numerator: uom_cs_conversion_numerator
         max_uom_cs_conversion_denominator: uom_cs_conversion_denominator
         max_uom_ec_conversion_numerator: uom_ec_conversion_numerator
         max_uom_ec_conversion_denominator: uom_ec_conversion_denominator
         max_uom_pc_conversion_numerator: uom_pc_conversion_numerator
         max_uom_pc_conversion_denominator: uom_pc_conversion_denominator
         max_uom_l_conversion_numerator: uom_l_conversion_numerator
         max_uom_l_conversion_denominator: uom_l_conversion_denominator
         max_uom_zli_conversion_numerator: uom_zli_conversion_numerator
         max_uom_zli_conversion_denominator: uom_zli_conversion_denominator
         max_uom_uc_conversion_numerator: uom_uc_conversion_numerator
         max_uom_uc_conversion_denominator: uom_uc_conversion_denominator
         max_uom_ctr_conversion_numerator: uom_ctr_conversion_numerator
         max_uom_ctr_conversion_denominator: uom_ctr_conversion_denominator
         max_uom_srv_conversion_numerator: uom_srv_conversion_numerator
         max_uom_srv_conversion_denominator: uom_srv_conversion_denominator
         max_uom_vcs_conversion_numerator: uom_vcs_conversion_numerator
         max_uom_vcs_conversion_denominator: uom_vcs_conversion_denominator
         max_uom_kg_conversion_numerator: uom_kg_conversion_numerator
         max_uom_kg_conversion_denominator: uom_kg_conversion_denominator
         rule_name: rule_name
         rule_code: rule_code
         quality_category: quality_category
      distinct: true

  - kind: add
    name: add_conditions_1
    context_name: select_uom
    params:

# --------------PAL
      - column: uom_pal_check_flag
        expression: "'-1'"
      - column: uom_pal_dq_message_output
        expression: "'N/A'"

# --------------EA
      - column: uom_ea_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='EA' THEN
                      CASE 
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN conversion_denominator/conversion_numerator !=1 THEN '0'
                      ELSE '1' 
                      END	
                    END"
      - column: uom_ea_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='EA' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure EA'
                        WHEN conversion_denominator/conversion_numerator !=1 THEN 'Wrong UMREN/UMREZ for EA' 
                    	ELSE 'OK' 
                    	END
                    END"

# --------------CS
      - column: uom_cs_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='CS' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'CS' AND conversion_denominator/conversion_numerator !=1 THEN '0'
                        WHEN base_unit_of_measure_code = 'ST' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified * total_sales_units,1) THEN '0'  
                    	ELSE '1' 
                    	END
                    END"
      - column: uom_cs_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='CS' THEN
                    	CASE 
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure CS'
                        WHEN base_unit_of_measure_code = 'CS' AND conversion_denominator/conversion_numerator !=1 THEN 'Wrong UMREN/UMREZ for CS' 
                        WHEN base_unit_of_measure_code = 'ST' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified * total_sales_units,1) THEN 'Wrong UMREN/UMREZ for CS'  
                    	ELSE 'OK' 
                    	END
                    END"

# --------------EC
      - column: uom_ec_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='EC' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0' 
                        WHEN base_unit_of_measure_code = 'EC' AND conversion_denominator/conversion_numerator !=1 THEN '0'
                        WHEN base_unit_of_measure_code != 'EC' AND (uom_ec_conversion_numerator / uom_ec_conversion_denominator) != (uom_cs_conversion_numerator / uom_cs_conversion_denominator) THEN '0'  
                    	ELSE '1' 
                    	END
                    END"
      - column: uom_ec_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='EC' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure EC' 
                        WHEN base_unit_of_measure_code = 'EC' AND conversion_denominator/conversion_numerator !=1 THEN 'Wrong UMREN/UMREZ for EC'
                        WHEN base_unit_of_measure_code != 'EC' AND (uom_ec_conversion_numerator / uom_ec_conversion_denominator) != (uom_cs_conversion_numerator / uom_cs_conversion_denominator) THEN 'Wrong UMREN/UMREZ for EC'  
                    	ELSE 'OK' 
                    	END
                    END"

# --------------PC
      - column: uom_pc_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='PC' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'ST' AND conversion_denominator/conversion_numerator !=1 THEN '0'
                    	ELSE '1' 
                    	END
                    END"
      - column: uom_pc_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='PC' THEN
                    	CASE 
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure PC'
                        WHEN base_unit_of_measure_code = 'ST' AND conversion_denominator/conversion_numerator !=1 THEN 'Wrong UMREN/UMREZ for PC' 
                    	ELSE 'OK' 
                    	END
                    END"

# -------------L
      - column: uom_l_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='L' THEN
                    	CASE
                        WHEN base_unit_of_measure_code = 'KG' OR pack_size_uom_unified IN ('KG','G') THEN 'Exception1'
                        WHEN base_unit_of_measure_code = 'ST' THEN 'Exception2'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'L' AND conversion_denominator/conversion_numerator != 1 THEN '0'
                        WHEN base_unit_of_measure_code != 'L' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified,1) THEN '0'
                      	ELSE '1'
                      	END
                    END"
      - column: uom_l_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='L' THEN
                    	CASE
                        WHEN base_unit_of_measure_code = 'KG' OR pack_size_uom_unified IN ('KG','G') THEN 'Exception1'
                        WHEN base_unit_of_measure_code = 'ST' THEN 'Exception2'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure L'
                        WHEN base_unit_of_measure_code = 'L' AND conversion_denominator/conversion_numerator != 1 THEN 'Wrong UMREN/UMREZ for L'
                        WHEN base_unit_of_measure_code != 'L' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified,1) THEN 'Wrong UMREN/UMREZ for L' 
                      	ELSE 'OK'
                      	END
                    END"

# --------------ZLI
      - column: uom_zli_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='ZLI' THEN
                    	CASE
                        WHEN base_unit_of_measure_code = 'KG' OR pack_size_uom_unified IN ('KG','G') THEN 'Exception1'
                        WHEN base_unit_of_measure_code = 'ST' THEN 'Exception2'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'ZLI' AND conversion_denominator/conversion_numerator != 1 THEN '0'
                        WHEN base_unit_of_measure_code != 'ZLI' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified,1) THEN '0'
                      	ELSE '1'
                      	END
                    END"
      - column: uom_zli_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='ZLI' THEN
                    	CASE
                        WHEN base_unit_of_measure_code = 'KG' OR pack_size_uom_unified IN ('KG','G') THEN 'Exception1'
                        WHEN base_unit_of_measure_code = 'ST' THEN 'Exception2'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure ZLI'
                        WHEN base_unit_of_measure_code = 'ZLI' AND conversion_denominator/conversion_numerator != 1 THEN 'Wrong UMREN/UMREZ for ZLI'
                        WHEN base_unit_of_measure_code != 'ZLI' AND ROUND(conversion_denominator/conversion_numerator,1) != ROUND(pack_size_volume_unified,1) THEN 'Wrong UMREN/UMREZ for ZLI' 
                      	ELSE 'OK'
                      	END
                    END"

# --------------UC
      - column: uom_uc_check_flag
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code = 'UC' THEN
                    	CASE 
                        WHEN base_unit_of_measure_code IN ('CS','ST') THEN 'Exception1'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'UC' AND conversion_denominator/conversion_numerator != 1 THEN '0'
                        WHEN base_unit_of_measure_code = 'KG' AND uom_uc_conversion_numerator/uom_uc_conversion_denominator != uom_kg_conversion_numerator/uom_kg_conversion_denominator THEN '0'
                    	ELSE '1' 
                    	END
                    END"
      - column: uom_uc_dq_message_output
        expression: "
                    CASE 
                      WHEN alternative_unit_of_measure_code='UC' THEN
                    	CASE
                        WHEN base_unit_of_measure_code IN ('CS','ST') THEN 'Exception1' 
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure UC'
                        WHEN base_unit_of_measure_code = 'UC' AND conversion_denominator/conversion_numerator != 1 THEN 'Wrong UMREN/UMREZ for UC'
                        WHEN base_unit_of_measure_code = 'KG' AND uom_uc_conversion_numerator/uom_uc_conversion_denominator != uom_kg_conversion_numerator/uom_kg_conversion_denominator THEN 'Wrong UMREN/UMREZ for UC'
                    	ELSE 'OK' 
                    	END
                    END"

# --------------CTR
      - column: uom_ctr_check_flag
        expression: "
                    CASE 
                      WHEN alternative_unit_of_measure_code='CTR' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'CTR' AND conversion_denominator/conversion_numerator !=1 THEN '0'
                      ELSE '1'
                      END
                    END"
      - column: uom_ctr_dq_message_output
        expression: "
                    CASE 
                    WHEN alternative_unit_of_measure_code='CTR' THEN
                    	CASE
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure CTR'
                        WHEN base_unit_of_measure_code = 'CTR' AND conversion_denominator/conversion_numerator !=1 THEN 'Wrong UMREN/UMREZ for CTR'
                      ELSE 'OK'
                      END
                    END"

# --------------SRV
      - column: uom_srv_check_flag
        expression: "'-1'"
      - column: uom_srv_dq_message_output
        expression: "'N/A'"

# --------------VCS
      - column: uom_vcs_check_flag
        expression: "'-1'"
      - column: uom_vcs_dq_message_output
        expression: "'N/A'"

# --------------KG
      - column: uom_kg_check_flag
        expression: "
                    CASE 
                      WHEN alternative_unit_of_measure_code='KG' THEN
                    	CASE		
                        WHEN pack_size_uom_unified IN ('L','ML') THEN 'Exception1'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN '0'
                        WHEN base_unit_of_measure_code = 'KG' AND conversion_denominator/conversion_numerator != 1 THEN '0'
                      ELSE '1'
                      END
                    END"
      - column: uom_kg_dq_message_output
        expression: "
                    CASE 
                      WHEN alternative_unit_of_measure_code='KG' THEN
                    	CASE		
                        WHEN pack_size_uom_unified IN ('L','ML') THEN 'Exception1'
                        WHEN conversion_numerator IS NULL OR conversion_denominator IS NULL THEN 'Missing unit of measure KG'
                        WHEN base_unit_of_measure_code = 'KG' AND conversion_denominator/conversion_numerator != 1 THEN 'Wrong UMREN/UMREZ for KG'
                      ELSE 'OK'
                      END
                    END"

