  - kind: add
    name: add_consistency_checks
    context_name: join_cl1_cl2
    params:
      - column: rule_code
        expression: "'rule_3_co'"
      - column: quality_category
        expression: "'Consistency'"
# ------------------------------------------------PAL-------------------------------------------
      - column: uom_pal_check_flag
        expression: "'-1'"
      - column: uom_pal_dq_message_output
        expression: "'N/A'"
# ------------------------------------------------EA-------------------------------------------
      - column: uom_ea_check_flag
        expression: "
                    CASE 
                      WHEN ((cl1_uom_ea_check_flag IS NULL OR cl1_uom_ea_check_flag = '') AND (cl2_uom_ea_check_flag IS NULL OR cl2_uom_ea_check_flag = '')) OR (cl1_uom_ea_check_flag = '0' AND cl2_uom_ea_check_flag = '0') THEN ''
                        ELSE
                        CASE
                          WHEN cl1_uom_ea_conversion_numerator = cl2_uom_ea_conversion_numerator AND cl1_uom_ea_conversion_denominator = cl2_uom_ea_conversion_denominator THEN '1'
                          ELSE '0'
                        END 
                    END"
      - column: uom_ea_dq_message_output
        expression: "CASE WHEN uom_ea_check_flag = '' THEN 'N/A' WHEN uom_ea_check_flag = '1' THEN 'OK' ELSE 'Inconsistent' END"
