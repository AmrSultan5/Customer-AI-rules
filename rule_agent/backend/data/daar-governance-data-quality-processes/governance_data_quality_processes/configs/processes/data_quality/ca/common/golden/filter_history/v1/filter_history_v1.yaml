transform:
  name: filter_history
  operations:

  - kind: read_dataio
    name: read_history
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: "{{module}}"
      namespace: golden
      object_name: "{{object_name}}"
      schema_version: v1

  - kind: filter
    name: filter_condition
    params:
      - condition:
          "{{filter}}"

  - kind: write_dataio
    name: write_history
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: "{{module}}"
      namespace: golden
      object_name: "{{object_name}}"
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full