transform:
  name: dm_customer_partner
  operations:

  - kind: read_dataio
    name: read_knvp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: knvp
      schema_version: v1

  - kind: filter
    name: filter_knvp
    params:
      - condition:
          (spart = '01' AND vtweg = '01') or (spart = '02' AND vtweg = '04')

  - kind: select
    name: select_knvp
    params:
      columns:
        kunnr: kunnr
        parvw: parvw
        kunn2: kunn2
        vkorg: vkorg
        spart: spart
        vtweg: vtweg
        sap_cluster: sap_cluster


  - kind: read_dataio
    name: read_tpart
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tpart
      schema_version: v1

  - kind: filter
    name: filter_tpart
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_tpart
    params:
      columns:
        parvw: parvw
        vtext: vtext
        sap_cluster: sap_cluster

# Cluster_Config - CC
  - kind: read_dataio
    name: read_cluster_config
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: cluster_config
      schema_version: v2

  - kind: filter
    name: filter_cluster_config
    params:
      - condition:
          flag = 'DM_sales_org'

  - kind: select
    name: select_cluster_config
    params:
      columns:
        sales_org: sales_org_cc
        cluster: cluster_cc
      distinct: true

  - kind: join
    name: join_knvp_tpart
    context_name: select_knvp
    params:
      - other:
          select_tpart
        how:
          left
        columns:
          parvw: parvw
          sap_cluster: sap_cluster
      - other:
          select_cluster_config
        how:
          inner
        columns:
          vkorg: sales_org_cc
          sap_cluster: cluster_cc

  - kind: select
    name: select_dm_customer_partner
    params:
      columns:
        kunnr: customer_code
        parvw: partner_function_code
        vtext: partner_function_name
        kunn2: partner_code
        vkorg: sales_org_code
        spart: division_code
        vtweg: distribution_channel_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_dm_customer_partner
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_partner
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full
