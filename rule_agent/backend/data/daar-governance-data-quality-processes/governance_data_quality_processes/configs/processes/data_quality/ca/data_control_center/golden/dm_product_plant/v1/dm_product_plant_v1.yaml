transform:
  name: dm_product_plant
  operations:

# Read MARC

  - kind: read_dataio
    name: read_marc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: marc
      schema_version: v1


  - kind: filter
    name: filter_mmsta
    params:
      - condition:
          mmsta <> '99' 

  - kind: group
    name: group_mmsta
    params:
      - aggs:
          werks: count
        by:
        -  matnr
        -  sap_cluster

  - kind: join
    name: join_marc_mmsta_count
    context_name: read_marc
    params:
      - other:
          group_mmsta
        how:
          left
        columns:
          matnr: matnr
          sap_cluster: sap_cluster

  - kind: filter
    name: filter_m
    params:
      - condition:
          count_werks >= 1 and lvorm <> 'X' and mmsta <> '99'

  - kind: add
    name: add_concat
    params:
        - column: key_concat
          expression: concat(matnr, werks)
        - column: werks_substr
          expression: substring(werks,0,2)

  - kind: select
    name: select_m
    params:
      columns:
        matnr: matnr
        werks: werks
        werks_substr: werks_substr
        key_concat: key_concat
        ausdt: ausdt
        ausme: ausme
        beskz: beskz
        dismm: dismm
        kzaus: kzaus
        lvorm: lvorm
        maabc: maabc
        minbe: minbe
        mmsta: mmsta
        mmstd: mmstd
        mtvfp: mtvfp
        stawn: stawn
        qmatv: qmatv
        trame: trame
        umlmc: umlmc
        sap_cluster: sap_cluster_m
      distinct: true
    skip_next: false

  - kind: add
    name: add_lpad
    context_name: select_m
    params:
      - column: lpad_key
        expression: "CASE WHEN(length(key_concat) < 24) THEN concat('4', lpad(key_concat, 24, '0')) ELSE key_concat END"

  - kind: select
    name: select_marc
    params:
      columns:
        matnr: matnr
        werks: werks
        werks_substr: werks_substr
        key_concat: key_concat
        lpad_key: lpad_key
        ausdt: ausdt
        ausme: ausme
        beskz: beskz
        dismm: dismm
        kzaus: kzaus
        lvorm: lvorm
        maabc: maabc
        minbe: minbe
        mmsta: mmsta
        mmstd: mmstd
        mtvfp: mtvfp
        stawn: stawn
        qmatv: qmatv
        trame: trame
        umlmc: umlmc
        sap_cluster_m: sap_cluster_m
      distinct: true
    skip_next: false

# Read T141T

  - kind: read_dataio
    name: read_t141t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t141t
      schema_version: v1


  - kind: filter
    name: filter_a1
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_a1
    params:
      columns:
        mtstb: mtstb
        mmsta: mmsta
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false



# Read T006A

  - kind: read_dataio
    name: read_t006a
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t006a
      schema_version: v1

  - kind: filter
    name: filter_a2
    params:
      - condition:
          spras = 'E'

  - kind: select
    name: select_a2
    params:
      columns:
        msehi: msehi
        msehl: msehl
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false



# Read T001W

  - kind: read_dataio
    name: read_t001w
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t001w
      schema_version: v1

#  - kind: filter
#    name: filter_a3
#    params:
#      - condition:
#          spras = 'E'

  - kind: select
    name: select_a3
    params:
      columns:
#        spras: spras
        werks: werks
        name1: name1
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false



# Read plant_code_mapping

  - kind: read_dataio
    name: read_plant_code_mapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: plant_code_mapping
      schema_version: v2

  - kind: select
    name: select_pcm
    params:
      columns:
        plant_code_short: plant_code_short
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false

# Read plant_code_not_active

  - kind: read_dataio
    name: read_plant_code_not_active
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: plant_code_not_active
      schema_version: v1

  - kind: filter
    name: filter_pcn
    params:
      - condition:
          is_active = '1' OR is_active IS NULL

  - kind: select
    name: select_pcna
    params:
      columns:
        plant_code: plant_code
        plant_name: plant_name
        is_active: is_active
      distinct: true
    skip_next: false



# Read CE41000

  - kind: read_dataio
    name: read_c4
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: ce41000
      schema_version: v1

  - kind: select
    name: select_c4
    params:
      columns:
        artnr: artnr
        werks: werks_c4
        paobjnr: paobjnr_c4
        sap_cluster: sap_cluster_c4
      distinct: true
    skip_next: false

# Read CE31000

  - kind: read_dataio
    name: read_c3
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: ce31000
      schema_version: v1

  - kind: filter
    name: filter_c3
    context_name: read_c3
    params:
      - condition:
          gjahr > (date_format(add_months(current_date(), -36),"yyyy"))
      - condition:
          paledger = '01'

  - kind: select
    name: select_c3
    context_name: filter_c3
    params:
      columns:
        paobjnr: paobjnr_c3
        gjahr: gjahr
        absmg001: absmg001
        sap_cluster: sap_cluster_c3
      distinct: true
    skip_next: false



# Read MARD

  - kind: read_dataio
    name: read_mar
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mard
      schema_version: v1

  - kind: group
    name: group_mar
    context_name: read_mar
    params:
      - aggs:
          labst: sum
          speme: sum
          insme: sum
        by:
        -  matnr
        -  werks
        -  sap_cluster  

  - kind: add
    name: add_casts
    context_name: group_mar
    params:
       - column: sum_labst_cast
         expression: CAST(sum_labst AS DECIMAL(33, 3))
       - column: sum_speme_cast
         expression: CAST(sum_speme AS DECIMAL(33, 3))
       - column: sum_insme_cast
         expression: CAST(sum_insme AS DECIMAL(33, 3))

  - kind: select
    name: select_group_mar
    context_name: add_casts
    params:
      columns:
        werks: werks
        matnr: matnr
        sum_labst_cast: sum_labst
        sum_speme_cast: sum_speme
        sum_insme_cast: sum_insme
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false     

# Read MSLB

  - kind: read_dataio
    name: read_msl
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: mslb
      schema_version: v1

  - kind: filter
    name: filter_msl
    params:
      - condition:
          sobkz = 'O'

  - kind: add
    name: add_stock_vendor_flag
    params:
        - column: stock_vendor_flag
          expression: "CASE WHEN(werks IS NOT NULL AND matnr IS NOT NULL) THEN 'X' ELSE '' END"

  - kind: select
    name: select_msl
    params:
      columns:
        sobkz: sobkz
        lfgja: lfgja
        werks: werks
        matnr: matnr
        stock_vendor_flag: stock_vendor_flag
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false



# Read MSKU

  - kind: read_dataio
    name: read_msk
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: msku
      schema_version: v1

  - kind: filter
    name: filter_msk
    context_name: read_msk
    params:
      - condition:
          sobkz IN('V', 'W')

  - kind: group
    name: group_msk
    context_name: filter_msk
    params:
      - aggs:
          kulab: sum
        by:
        - matnr
        - werks
        - sap_cluster

  - kind: select
    name: select_msk
    context_name: group_msk
    params:
      columns:
        werks: werks
        matnr: matnr
        sum_kulab: sum_kulab
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false



# Read MCHB

  - kind: read_dataio
    name: read_mch
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mchb
      schema_version: v1

  - kind: filter
    name: filter_mch
    context_name: read_mch
    params:
      - condition:
          clabs != 0 OR cspem != 0

  - kind: group
    name: group_mch
    context_name: filter_mch
    params:
      - aggs:
          charg: collect_list
        by:
        -  matnr
        -  werks
        -  sap_cluster


  - kind: add
    name: add_sales_charg_array
    context_name: group_mch
    params:
      - column: charg_array
        expression: sort_array(collect_list_charg)


  - kind: add
    name: add_stock_batch
    context_name: add_sales_charg_array
    params:
      - column: charg_concat_ws
        expression: concat_ws(',', charg_array)

  - kind: select
    name: select_mch
    params:
      columns:
        werks: werks
        matnr: matnr
        charg_concat_ws: charg_concat_ws
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false




# Read CDHDR

  - kind: read_dataio
    name: read_ch
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: cdhdr
      schema_version: v1

  - kind: filter
    name: filter_ch
    context_name: read_ch
    params:
      - condition: objectclas = 'MATERIAL'

  - kind: group
    name: group_ch
    context_name: filter_ch
    params:
      - aggs:
          udate: max
        by:
        - changenr
        - sap_cluster

  - kind: select
    name: select_ch
    context_name: group_ch
    params:
      columns:
        changenr: changenr
        max_udate: max_udate
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false




# Read CDPOS

  - kind: read_dataio
    name: read_cp
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: cdpos
      schema_version: v1

  - kind: select
    name: select_cp_1
    params:
      columns:
        objectclas: objectclas
        objectid: objectid
        chngind: chngind
        tabname: tabname
        tabkey: tabkey
        changenr: changenr
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false

  - kind: filter
    name: filter_cp
    params:
      - condition: objectclas = 'MATERIAL' AND chngind = 'I' AND tabname = 'MARC'

  - kind: add
    name: add_tabkey
    params:
      - column: trim_tabkey
        expression: 'replace(tabkey, " ", "") as str'

  - kind: select
    name: select_cp
    params:
      columns:
        objectclas: objectclas
        objectid: objectid
        chngind: chngind
        tabname: tabname
        tabkey: tabkey
        changenr: changenr
        trim_tabkey: trim_tabkey
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false

  - kind: join
    name: join_c3_c4
    context_name: select_c3
    params:
      - other:
          select_c4
        how:
          inner
        columns:
          paobjnr_c3: paobjnr_c4
          sap_cluster_c3: sap_cluster_c4


  - kind: join
    name: join_m_a1_a2_pcm_a3_pcna
    context_name: select_marc
    params:
      - other:
          select_a1
        how:
          left
        columns:
          mmsta: mmsta
          sap_cluster_m: sap_cluster
      - other:
          select_a2
        how:
          left
        columns:
          ausme: msehi
          sap_cluster_m: sap_cluster
      - other:
          select_pcm
        how:
          inner
        columns:
          werks_substr: plant_code_short
          sap_cluster_m: sap_cluster
      - other:
          select_a3
        how:
          left
        columns:
          werks: werks
          sap_cluster_m: sap_cluster
      - other:
          select_pcna
        how:
          left
        columns:
          werks: plant_code
      - other:
          join_c3_c4
        how:
          left
        columns:
          werks: werks_c4
          matnr: artnr
          sap_cluster_m: sap_cluster_c4
      - other:
          select_group_mar
        how:
          left
        columns:
          werks: werks
          matnr: matnr
          sap_cluster_m: sap_cluster
      - other:
          select_msl
        how:
          left
        columns:
          werks: werks
          matnr: matnr
          sap_cluster_m: sap_cluster
      - other:
          select_msk
        how:
          left
        columns:
          werks: werks
          matnr: matnr
          sap_cluster_m: sap_cluster
      - other:
          select_mch
        how:
          left
        columns:
          werks: werks
          matnr: matnr
          sap_cluster_m: sap_cluster
      - other:
          select_cp
        how:
          left
        columns:
          matnr: objectid
          lpad_key: trim_tabkey
          sap_cluster_m: sap_cluster
      - other:
          select_ch
        how:
          left
        columns:
          changenr: changenr
          sap_cluster_m: sap_cluster

  - kind: select
    name: select_group
    params:
      columns:
        matnr: matnr
        werks: werks
        absmg001: absmg001
        gjahr: gjahr
        sap_cluster_m: sap_cluster_m
      distinct: true
    skip_next: false

  - kind: add
    name: add_sales_quantity
    params:
      - column: absmg001_cy_if
        expression: IF(gjahr = extract(YEAR from now()), absmg001, 0)
      - column: absmg001_py_if
        expression: IF(gjahr = extract(YEAR from now()) - 1, absmg001, 0)
      - column: absmg001_ppy_if
        expression: IF(gjahr = extract(YEAR from now()) - 2, absmg001, 0)

  - kind: group
    name: group_c3_c4
    params:
      - aggs:
          absmg001_cy_if: sum
          absmg001_py_if: sum
          absmg001_ppy_if: sum
        by:
        - matnr
        - werks
        - sap_cluster_m

  - kind: select
    name: select_c3_c4_group
    context_name: group_c3_c4
    params:
      columns:
        matnr: matnr
        werks: werks
        sum_absmg001_cy_if: sum_absmg001_cy_if
        sum_absmg001_py_if: sum_absmg001_py_if
        sum_absmg001_ppy_if: sum_absmg001_ppy_if
        sap_cluster_m: sap_cluster_m
      distinct: true
    skip_next: false

  - kind: join
    name: join_final
    context_name: join_m_a1_a2_pcm_a3_pcna
    params:
      - other:
          select_c3_c4_group
        how:
          left
        columns:
          matnr: matnr
          werks: werks
          sap_cluster_m: sap_cluster_m

  - kind: select
    name: select_final
    context_name: join_final
    params:
      columns:
        matnr: material_code
        werks: plant_code
        name1: plant_name
        country_code: country_code
        ausdt: discontinuation_date
        ausme: unit_of_issue_code
        msehl: unit_of_issue_name
        beskz: procurement_type
        dismm: mrp_type
        kzaus: discontinuation_indicator
        lvorm: deletion_flag
        maabc: abc_indicator
        minbe: reorder_point
        mmsta: material_status_code
        mtstb: material_status_name
        mmstd: start_date
        mtvfp: availability_checking_group
        stawn: commodity_code
        qmatv: inspection_setup_flag
        sum_absmg001_cy_if: sales_quantity_cy
        sum_absmg001_py_if: sales_quantity_py
        sum_absmg001_ppy_if: sales_quantity_ppy
        trame: stock_in_transit_quantity
        umlmc: stock_in_transfer_quantity
        sum_labst: stock_unrestricted_quantity
        sum_speme: stock_blocked_quantity
        sum_insme: stock_quality_inspection_quantity
        stock_vendor_flag: stock_vendor_flag
        sum_kulab: stock_customer_unrestricted_use_quantity
        charg_concat_ws: stock_batch
        max_udate: plant_extenstion_date
        sap_cluster_m: sap_cluster
      distinct: true
    skip_next: false

  - kind: write_dataio
    name: write_dm_product_plant
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
