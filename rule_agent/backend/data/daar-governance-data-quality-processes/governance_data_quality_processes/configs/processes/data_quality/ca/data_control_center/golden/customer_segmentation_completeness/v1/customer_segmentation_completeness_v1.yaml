#SELECT rccomp_248_1
  - kind: join
    name: join_dcg_dch
    context_name: select_dcg
    params:
      - other:
          select_dch
        how:
          left
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster


  - kind: select
    name: select_rccomp_248_1
    context_name: join_dcg_dch
    params:
      columns:
        customer_code: customer_code
        country_code: country_code
        ccaf_code: ccaf_code
        central_order_block_code: central_order_block_code
        l4_customer_name: l4_customer_name
        natural_person_flag: natural_person_flag
      distinct: true

  - kind: add
    name: add_rccomp_248_1
    context_name: select_rccomp_248_1
    params:
      - column: rule_code
        expression: "'RCCOMP_248.1'"
      - column: ccaf_code_value_checked
        expression: if(lower(country_code) = 'eg', l4_customer_name, ccaf_code)
      - column: check_status
        expression: if(central_order_block_code in('S', 'SP', 'E', 'G', 'S2', 'S3', 'S4', 'S5', 'S9', 'R', 'U', 'M', 'NR') 
                    or natural_person_flag = 'X', '',
                    if((lower(country_code) != 'eg' and isnotnull(ccaf_code))
                    or (lower(country_code) = 'eg' and l4_customer_name like any('[FT IC]%','[FT FC]%','[KA IC]%','[KA FC]%','[Wholesalers]%')), '1', '0'))     

  - kind: select
    name: select_rccomp_248_1_final
    context_name: add_rccomp_248_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        ccaf_code_value_checked: value_checked
      distinct: true

