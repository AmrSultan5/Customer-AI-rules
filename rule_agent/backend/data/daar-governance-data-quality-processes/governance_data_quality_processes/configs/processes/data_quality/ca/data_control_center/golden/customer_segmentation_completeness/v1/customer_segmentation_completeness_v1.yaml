transform:
  name: customer_segmentation_completeness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: select
    context_name: read_dm_customer_general
    name: select_dcg
    params:
      columns:
        customer_code: customer_code
        country_code: country_code
        customer_activity_cluster_code: customer_activity_cluster_code
        distribution_type_code: distribution_type_code
        trade_channel_code: trade_channel_code
        sub_trade_channel_code: sub_trade_channel_code
        business_partner_guid: business_partner_guid
        ccaf_code: ccaf_code
        central_order_block_code: central_order_block_code
        natural_person_flag: natural_person_flag
        channel_priority_code: channel_priority_code
        actual_warm_space_code: actual_warm_space_code
        red_outlet_flag: red_outlet_flag
        local_segmentation_code: local_segmentation_code
        customer_classification_code: customer_classification_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_hierarchy

  - kind: select
    context_name: read_dm_customer_hierarchy
    name: select_dch
    params:
      columns:
        l7_customer_code: l7_customer_code
        l4_customer_name: l4_customer_name
        sap_cluster: sap_cluster
      distinct: true

#SELECT rccomp_103_1
  - kind: select
    name: select_rccomp_103_1
    context_name: select_dcg
    params:
      columns:
        customer_code: customer_code
        customer_activity_cluster_code: customer_activity_cluster_code
      distinct: true

  - kind: add
    name: add_rccomp_103_1
    context_name: select_rccomp_103_1
    params:
      - column: rule_code
        expression: "'RCCOMP_103.1'"
      - column: check_status
        expression: "CASE WHEN customer_activity_cluster_code is null OR customer_activity_cluster_code ='' THEN '0' ELSE '1' END"      

  - kind: select
    name: select_rccomp_103_1_final
    context_name: add_rccomp_103_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        customer_activity_cluster_code: value_checked
      distinct: true

