      by_name: true
      other: select_rccomp_68_1_final

  - kind: add
    name: add_final
    params:
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
        check_date: check_date
      distinct: true  

  - kind: write_dataio
    name: write_customer_segmentation_completeness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: customer_segmentation_completeness
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full