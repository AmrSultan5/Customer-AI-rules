transform:
  name: product_plant_conformity
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#READ dm_product_general
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general

  - kind: filter
    name: filter_flags_pg
    params:
      - condition:
          is_basic_scope = '1'

  - kind: select
    context_name: filter_flags_pg
    name: select_dpg
    params:
      columns:
        material_code: material_code
        material_type_code: material_type_code
        material_status_code: material_status_code
        material_description: material_description
        general_item_category_group_code: general_item_category_group_code
        sap_cluster: sap_cluster
      distinct: true

#READ dm_product_valuation
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_valuation
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_valuation

  - kind: select
    context_name: read_dm_product_valuation
    name: select_dpv
    params:
      columns:
        material_code: material_code
        valuation_class_code: valuation_class_code
        country_code: country_code_dpv
        valuation_area: valuation_area
        sap_cluster: sap_cluster
      distinct: true

#READ dm_product_sales_organization
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

  - kind: filter
    name: filter_flags_pso
    params:
      - condition:
          is_basic_scope = '1'

  - kind: select
    context_name: filter_flags_pso
    name: select_dpso
    params:
      columns:
        material_code: material_code
        brand_code: brand_code
        account_assignment_group_code: account_assignment_group_code
        sap_cluster: sap_cluster
      distinct: true

#READ dm_product_plant
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
