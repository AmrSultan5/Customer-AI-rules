#RULE RPCONF_284.1
  - kind: add
    name: add_rpconf_284_1
    context_name: join_dpg_dpp_flt
    params:
      - column: rule_code
        expression: "'RPCONF_284.1'"
      - column: sales_org_code
        expression: "''"
      - column: check_status
        expression: "CASE WHEN material_description LIKE '%ABP%' THEN '' WHEN (mrp_type IS NULL OR mrp_type = '') OR material_status_code_pp != '99' THEN '' WHEN (material_type_code IN ('ZFG','ZFGS','ZFGM','ZFGA','ZFGC','ZNVM','ZSF','ZNVL', 'ZSFT', 'ZRWT') OR (material_type_code LIKE 'ZRW%' OR material_type_code LIKE 'ZSF%')) AND ((material_status_code = '99' AND mrp_type ='ND') OR (material_status_code != '99' AND mrp_type IN('X0', 'ND'))) THEN '1' WHEN (material_type_code IN ('ZFG','ZFGS','ZFGM','ZFGA','ZFGC','ZNVM','ZSF','ZNVL', 'ZSFT', 'ZRWT') OR (material_type_code LIKE 'ZRW%' OR material_type_code LIKE 'ZSF%')) AND ((material_status_code = '99' AND mrp_type !='ND') OR (material_status_code != '99' AND mrp_type NOT IN ('X0', 'ND'))) THEN '0' ELSE '' END"

  - kind: select
    name: select_rpconf_284_1_final
    context_name: add_rpconf_284_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        mrp_type: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

