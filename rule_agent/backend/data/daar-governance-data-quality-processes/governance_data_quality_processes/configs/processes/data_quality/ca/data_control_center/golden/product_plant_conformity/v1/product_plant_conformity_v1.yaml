#JOIN dpg and dpp_flt
  - kind: join
    name: join_dpg_dpp
    context_name: select_dpg
    params:
      - other:
          select_dpp
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#JOIN dpg and dpp
  - kind: join
    name: join_dpg_dpp_flt
    context_name: select_dpg
    params:
      - other:
          select_dpp_flt
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#JOIN dpg, dpv and dpso
  - kind: join
    name: join_dpg_dpv_dpso
    context_name: select_dpg
    params:
      - other:
          select_dpv
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpso
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#JOIN dpg, dpv, dpso and dpp_flt
  - kind: join
    name: join_dpg_dpv_dpso_dpp_flt
    context_name: select_dpg
    params:
      - other:
          select_dpv
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpso
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpp_flt
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster


#RULE RPCONF_160.3
  - kind: add
    name: add_rpconf_160_3
    context_name: join_dpg_dpp_flt
    params:
      - column: rule_code
        expression: "'RPCONF_160.3'"
      - column: sales_org_code
        expression: "''"
      - column: check_status
        expression: "CASE WHEN material_description LIKE '%ABP%' THEN '' WHEN availability_checking_group is null OR availability_checking_group = '' THEN '' WHEN material_type_code IN ('ZRWT', 'ZSFT') AND availability_checking_group IN ('02') THEN '1' WHEN material_type_code IN ('ZRWT', 'ZSFT') and availability_checking_group NOT IN ('02') THEN '0' ELSE '' END"

  - kind: select
    name: select_rpconf_160_3_final
    context_name: add_rpconf_160_3
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        availability_checking_group: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

