  - kind: filter
    name: filter_flags
    params:
      - condition:
          is_basic_scope = '1'

  - kind: select
    name: select_dpp_flt
    params:
      columns:
        material_code: material_code
        material_status_code: material_status_code_pp
        availability_checking_group: availability_checking_group
        country_code: country_code
        plant_code: plant_code
        procurement_type: procurement_type
        mrp_type: mrp_type
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dpp
    context_name: read_dm_product_plant
