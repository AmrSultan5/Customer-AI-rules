transform:
  name: cdc_sap_cc
  operations:
    - kind: read_dataio
      name: read_account_md
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: cch_cdc
        namespace: md
        object_name: account
        schema_version: v1

    - kind: filter
      name: filter_account_md
      context_name: read_account_md
      params:
        - condition: sap_backenduuid is not null or sap_backenduuid <> ''

    - kind: add
      name: add_account_md_columns
      context_name: filter_account_md
      params:
      - column: country_cdc
        expression: upper(country)
      - column: cdc_num_cdc
        expression: replace(replace(replace(if( length(coalesce(additional_phone_number,'0'))>length(coalesce(phones_number,'0')), coalesce(additional_phone_number,'0'),coalesce(phones_number,'0')),' ',''),'-',''),'\t','')
      - column: email_cdc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: first_name_cdc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(first_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: last_name_cdc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(last_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: hash_cdc
        expression: MD5(concat(sap_backenduuid,upper(country),replace(replace(replace(if( length(coalesce(additional_phone_number,'0'))>length(coalesce(phones_number,'0')), coalesce(additional_phone_number,'0'),coalesce(phones_number,'0')),' ',''),'-',''),'\t',''), coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(first_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'') ,coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(last_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))

    - kind: select
      name: select_cdc
      context_name: add_account_md_columns
      params:
        columns:
          country_cdc: country_cdc
          sap_backenduuid: sap_backenduuid_cdc
          cdc_num_cdc: cdc_num_cdc
          email_cdc: email_cdc
          first_name_cdc: first_name_cdc
          last_name_cdc: last_name_cdc
          hash_cdc: hash_cdc
        distinct: true

    - kind: read_dataio
      name: read_customer_md
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: cch_cp2
        namespace: md
        object_name: customer
        schema_version: v1

    - kind: filter
      name: filter_customer_md
      context_name: read_customer_md
      params:
        - condition: p_active == 1 and (p_sapbackenduuid is not null or p_sapbackenduuid <> '')

    - kind: add
      name: add_customer_md_columns
      context_name: filter_customer_md
      params:
      - column: country_sap_cc
        expression: upper(country)
      - column: cp2_num_sap_cc
        expression: replace(replace(replace(if(length(coalesce(landline_phone_number,'0'))>length(coalesce(mobile_phone_number,'0')), coalesce(landline_phone_number,'0'),coalesce(mobile_phone_number,'0')),' ',''),'-',''),'\t','')
      - column: email_sap_cc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: first_name_sap_cc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(first_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: last_name_sap_cc
        expression: coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(last_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')
      - column: hash_sap_cc
        expression: MD5(concat(p_sapbackenduuid,upper(country),replace(replace(replace(if(length(coalesce(landline_phone_number,'0'))>length(coalesce(mobile_phone_number,'0')), coalesce(landline_phone_number,'0'),coalesce(mobile_phone_number,'0')),' ',''),'-',''),'\t',''),coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(email,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),''),coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(first_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'') ,coalesce(trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(last_name,'\t',''), '\n', ''), '\r', ''), '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')))

    - kind: select
      name: select_sap_cc
      context_name: add_customer_md_columns
      params:
        columns:
          b2b_units: partner_sap_cc
          country_sap_cc: country_sap_cc
          p_sapbackenduuid: p_sapbackenduuid_sap_cc
          cp2_num_sap_cc: cp2_num_sap_cc
          email_sap_cc: email_sap_cc
          first_name_sap_cc: first_name_sap_cc
          last_name_sap_cc: last_name_sap_cc
          hash_sap_cc: hash_sap_cc
        distinct: true

    - kind: join
      name: join_non_matching_cdc
      context_name: select_cdc
      params:
        - other:
            select_sap_cc
          how:
            full
          columns:
            hash_cdc: hash_sap_cc
  
    - kind: filter
      name: filter_non_matching_cdc
      context_name: join_non_matching_cdc
      params:
        - condition:
            hash_sap_cc IS NULL or hash_sap_cc = ''
  
    - kind: join
      name: join_non_matching_sap_cc
      context_name: select_cdc
      params:
        - other:
            select_sap_cc
          how:
            full
          columns:
            hash_cdc: hash_sap_cc
  
    - kind: filter
      name: filter_non_matching_sap_cc
      context_name: join_non_matching_sap_cc
      params:
        - condition:
            hash_cdc IS NULL or hash_cdc = ''

    - kind: select
      name: select_non_matching_cdc
      context_name: filter_non_matching_cdc
      params:
        columns:
          country_cdc: country_cdc
          sap_backenduuid_cdc: sap_backenduuid_cdc
          cdc_num_cdc: cdc_num_cdc
          email_cdc: email_cdc
          first_name_cdc: first_name_cdc
          last_name_cdc: last_name_cdc
          hash_cdc: hash_cdc
        distinct: true

    - kind: select
      name: select_non_matching_sap_cc
      context_name: filter_non_matching_sap_cc
      params:
        columns:
          partner_sap_cc: partner_sap_cc
          country_sap_cc: country_sap_cc
          p_sapbackenduuid_sap_cc: p_sapbackenduuid_sap_cc
          cp2_num_sap_cc: cp2_num_sap_cc
          email_sap_cc: email_sap_cc
          first_name_sap_cc: first_name_sap_cc
          last_name_sap_cc: last_name_sap_cc
          hash_sap_cc: hash_sap_cc
        distinct: true

    - kind: join
      name: join_non_matching
      context_name: select_non_matching_sap_cc
      params:
        - other:
            select_non_matching_cdc
          how:
            full
          columns:
            p_sapbackenduuid_sap_cc: sap_backenduuid_cdc

###phone number
  
    - kind: filter
      name: filter_phone_number
      context_name: join_non_matching
      params:
        - condition:
            p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND if (cdc_num_cdc=cp2_num_sap_cc,1,if(length(cdc_num_cdc)>6 AND length(cp2_num_sap_cc)>6 and (instr(cdc_num_cdc,cp2_num_sap_cc)>0 OR instr(cp2_num_sap_cc,cdc_num_cdc)>0), 1, 0))<>1

    - kind: add
      name: add_phone_number_columns
      context_name: filter_phone_number
      params:
      - column: tgt_system
        expression: cast('cdc' as string)
      - column: src_system
        expression: cast('sap cc' as string)
      - column: msg
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND if (cdc_num_cdc=cp2_num_sap_cc,1,if(length(cdc_num_cdc)>6 AND length(cp2_num_sap_cc)>6 and (instr(cdc_num_cdc,cp2_num_sap_cc)>0 OR instr(cp2_num_sap_cc,cdc_num_cdc)>0), 1, 0))<>1 THEN "attributes are mismatching" END 
      - column: attr_name
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND if (cdc_num_cdc=cp2_num_sap_cc,1, if(length(cdc_num_cdc)>6 AND length(cp2_num_sap_cc)>6 and (instr(cdc_num_cdc,cp2_num_sap_cc)>0 OR instr(cp2_num_sap_cc,cdc_num_cdc)>0), 1, 0))<>1 THEN concat('SAP CC CDC :', ' Phone Number') END
      - column: tgt_attr
        expression: cp2_num_sap_cc
      - column: src_attr
        expression: cdc_num_cdc

    - kind: select
      name: select_phone_number
      context_name: add_phone_number_columns
      params:
        columns:
          partner_sap_cc: partner
          src_system: src_system
          tgt_system: tgt_system
          sap_backenduuid_cdc: sap_backenduuid
          p_sapbackenduuid_sap_cc: p_sapbackenduuid
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

###email
  
    - kind: filter
      name: filter_email
      context_name: join_non_matching
      params:
        - condition:
            p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND email_cdc<>email_sap_cc

    - kind: add
      name: add_email_columns
      context_name: filter_email
      params:
      - column: tgt_system
        expression: cast('cdc' as string)
      - column: src_system
        expression: cast('sap cc' as string)
      - column: msg
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND email_cdc <> email_sap_cc THEN "attributes are mismatching" END
      - column: attr_name
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND email_cdc <> email_sap_cc THEN concat("SAP CC CDC :", " E-Mail") END
      - column: tgt_attr
        expression: email_sap_cc
      - column: src_attr
        expression: email_cdc

    - kind: select
      name: select_email
      context_name: add_email_columns
      params:
        columns:
          partner_sap_cc: partner
          src_system: src_system
          tgt_system: tgt_system
          sap_backenduuid_cdc: sap_backenduuid
          p_sapbackenduuid_sap_cc: p_sapbackenduuid
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

###last name
  
    - kind: filter
      name: filter_last_name
      context_name: join_non_matching
      params:
        - condition:
            p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND last_name_cdc<>last_name_sap_cc

    - kind: add
      name: add_last_name_columns
      context_name: filter_last_name
      params:
      - column: tgt_system
        expression: cast('cdc' as string)
      - column: src_system
        expression: cast('sap cc' as string)
      - column: msg
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND last_name_cdc<>last_name_sap_cc THEN "attributes are mismatching" END
      - column: attr_name
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND last_name_cdc<>last_name_sap_cc THEN concat('SAP CC CDC :', ' Last Name') END
      - column: tgt_attr
        expression: last_name_sap_cc
      - column: src_attr
        expression: last_name_cdc

    - kind: select
      name: select_last_name
      context_name: add_last_name_columns
      params:
        columns:
          partner_sap_cc: partner
          src_system: src_system
          tgt_system: tgt_system
          sap_backenduuid_cdc: sap_backenduuid
          p_sapbackenduuid_sap_cc: p_sapbackenduuid
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

###first name
  
    - kind: filter
      name: filter_first_name
      context_name: join_non_matching
      params:
        - condition:
            p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND first_name_cdc<>first_name_sap_cc

    - kind: add
      name: add_first_name_columns
      context_name: filter_first_name
      params:
      - column: tgt_system
        expression: cast('cdc' as string)
      - column: src_system
        expression: cast('sap cc' as string)
      - column: msg
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND first_name_cdc<>first_name_sap_cc THEN "attributes are mismatching" END
      - column: attr_name
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND first_name_cdc<>first_name_sap_cc THEN concat('SAP CC CDC :', ' First Name') END
      - column: tgt_attr
        expression: first_name_sap_cc
      - column: src_attr
        expression: first_name_cdc

    - kind: select
      name: select_first_name
      context_name: add_first_name_columns
      params:
        columns:
          partner_sap_cc: partner
          src_system: src_system
          tgt_system: tgt_system
          sap_backenduuid_cdc: sap_backenduuid
          p_sapbackenduuid_sap_cc: p_sapbackenduuid
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

###Country
  
    - kind: filter
      name: filter_country
      context_name: join_non_matching
      params:
        - condition:
            p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND country_cdc<>country_sap_cc

    - kind: add
      name: add_country_columns
      context_name: filter_country
      params:
      - column: tgt_system
        expression: cast('cdc' as string)
      - column: src_system
        expression: cast('sap cc' as string)
      - column: msg
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND country_cdc<>country_sap_cc THEN "attributes are mismatching" END
      - column: attr_name
        expression: CASE WHEN p_sapbackenduuid_sap_cc = sap_backenduuid_cdc AND country_cdc<>country_sap_cc THEN concat('SAP CC CDC :', ' Country') END
      - column: tgt_attr
        expression: country_sap_cc
      - column: src_attr
        expression: country_cdc

    - kind: select
      name: select_country
      context_name: add_country_columns
      params:
        columns:
          partner_sap_cc: partner
          src_system: src_system
          tgt_system: tgt_system
          sap_backenduuid_cdc: sap_backenduuid
          p_sapbackenduuid_sap_cc: p_sapbackenduuid
          msg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr
        distinct: true

    - kind: union
      name: union_comparison
      context_name: select_phone_number
      params:
        allow_missing: true
        by_name: true
        other: select_email
  
    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: select_last_name
  
    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: select_first_name
  
    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: select_country

    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1
  
    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1
  
    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1
  
    - kind: filter
      name: filter_t077x
      params:
        - condition:
            spras = 'E' and sap_cluster = 'CL1'
  
    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true
  
    - kind: read_dataio
      name: read_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
  
    - kind: filter
      name: filter_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01'
  
    - kind: select
      name: select_knvv
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          vkorg: vkorg_knvv
          kvgr4: kvgr4_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
  
    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1
  
    - kind: filter
      name: filter_tvv4t
      params:
        - condition:
           sap_cluster = 'CL1' and spras = 'E'
  
    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
      context_name: union_comparison
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            left
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_knvv
          how:
            left
          columns:
            kunnr_kna1: kunnr_knvv
        - other:
            select_tvv4t
          how:
            left
          columns:
            kvgr4_knvv: kvgr4_tvv4t
  
    - kind: filter
      name: filter_final
      params:
        - condition:
            aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg_knvv in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: add
      name: add_final_columns
      context_name: filter_final
      params:
        - column: attribute10
          expression: concat(ktokd_kna1, ' - ', txt30_t077x)
        - column: attribute5
          expression: concat(kvgr4_knvv, ' - ', bezei_tvv4t)
        - column: country
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
                           WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
                           WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
                           WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
                           WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
                           WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
                           WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
                           WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
                           WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
                           WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
                           WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
                           WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
                           WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
                           WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
                           WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
                           WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
                           WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
                           WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
                           WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
                           WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
                           WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
                           WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
                           WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
                           WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
                           WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
                           WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
                           WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
                           WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
                           WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END
        - column: domain
          expression: '''CUSTOMER'''
        - column: table_name
          expression: '''SAP CC CDC'''
        - column: null_value
          expression: cast(NULL as string)
        - column: loading_date
          expression: current_date()
        - column: attribute3
          expression: sap_backenduuid

    - kind: select
      name: select_final
      context_name: add_final_columns
      params:
        columns:
          domain: domain
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          msg: dimension
          partner: primary_key_l1
          sap_backenduuid: primary_key_src_l2
          p_sapbackenduuid: primary_key_tgt_l2
          null_value: primary_key_src_l3
          null_value: primary_key_tgt_l3
          null_value: attribute1
          null_value: attribute2
          attribute3: attribute3
          aufsd_kna1: attribute4
          attribute5: attribute5
          vkorg_knvv: attribute6
          vtweg_knvv: attribute7
          spart_knvv: attribute8
          null_value: attribute9
          attribute10: attribute10
          country: country
          attr_name: compared_attribute
