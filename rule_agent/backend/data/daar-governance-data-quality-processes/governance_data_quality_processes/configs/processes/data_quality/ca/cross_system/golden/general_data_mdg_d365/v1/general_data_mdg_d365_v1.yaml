transform:
  name: General_data_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: select
      name: select_mdg_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_mdg_kna1
          ktokd: ktokd_mdg_kna1
          stkzu: stkzu_mdg_kna1
          stkza: stkza_mdg_kna1
          stkzn: stkzn_mdg_kna1
          stcd6: stcd6_mdg_kna1
          sperr: sperr_mdg_kna1
          katr1: katr1_mdg_kna1
          katr2: katr2_mdg_kna1
          katr3: katr3_mdg_kna1
          katr4: katr4_mdg_kna1_temp
          katr5: katr5_mdg_kna1_temp
          katr6: katr6_mdg_kna1
          katr7: katr7_mdg_kna1
          katr8: katr8_mdg_kna1
          katr9: katr9_mdg_kna1
          katr10: katr10_mdg_kna1
          locco: locco_mdg_kna1
          kukla: kukla_mdg_kna1
          niels: niels_mdg_kna1
          rpmkr: rpmkr_mdg_kna1
          bran1: bran1_mdg_kna1
          brsch: brsch_mdg_kna1
          aufsd: aufsd_mdg_kna1
        distinct: true

    - kind: filter
      name: filter_mdg_kna1
      params:
        - condition:
            kunnr_mdg_kna1 LIKE any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and length(kunnr_mdg_kna1)=10

    - kind: add
      name: add_mdg_hash
      context_name: filter_mdg_kna1
      params:
      - column: katr4_mdg_kna1
        expression: cast(katr4_mdg_kna1_temp as integer)       
      - column: katr5_mdg_kna1
        expression: cast(katr5_mdg_kna1_temp as integer)
      - column: hash_mdg
        expression: md5(concat(kunnr_mdg_kna1,stkzu_mdg_kna1,stkza_mdg_kna1,stkzn_mdg_kna1,stcd6_mdg_kna1,aufsd_mdg_kna1,sperr_mdg_kna1,katr1_mdg_kna1,katr2_mdg_kna1,katr3_mdg_kna1,cast(katr4_mdg_kna1_temp as integer),cast(katr5_mdg_kna1_temp as integer),katr6_mdg_kna1,katr7_mdg_kna1,katr8_mdg_kna1,katr9_mdg_kna1,katr10_mdg_kna1,locco_mdg_kna1,kukla_mdg_kna1,niels_mdg_kna1,rpmkr_mdg_kna1,bran1_mdg_kna1,brsch_mdg_kna1))



    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv
      context_name: read_mdg_knvv
      params:
        - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)
    
    - kind: select
      name: select_mdg_knvv_checkpoint
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_mdg_knvv_checkpoint
    
    
    # Join MDG tables
    - kind: join
      name: join_mdg
      context_name: add_mdg_hash
      params:
        - other: select_mdg_knvv
          how: inner
          columns:
            kunnr_mdg_kna1: kunnr_knvv
    


    - kind: select
      name: mdg_checkpoint
      context_name: join_mdg
      params:
        columns:
          kunnr_mdg_kna1: partner_mdg
          ktokd_mdg_kna1: ktokd_mdg
          stkzu_mdg_kna1: stkzu_mdg
          stkza_mdg_kna1: stkza_mdg
          stkzn_mdg_kna1: stkzn_mdg
          stcd6_mdg_kna1: stcd6_mdg
          aufsd_mdg_kna1: aufsd_mdg
          sperr_mdg_kna1: sperr_mdg
          katr1_mdg_kna1: katr1_mdg
          katr2_mdg_kna1: katr2_mdg
          katr3_mdg_kna1: katr3_mdg
          katr4_mdg_kna1: katr4_mdg
          katr5_mdg_kna1: katr5_mdg
          katr6_mdg_kna1: katr6_mdg
          katr7_mdg_kna1: katr7_mdg
          katr8_mdg_kna1: katr8_mdg
          katr9_mdg_kna1: katr9_mdg
          katr10_mdg_kna1: katr10_mdg
          locco_mdg_kna1: locco_mdg
          kukla_mdg_kna1: kukla_mdg
          niels_mdg_kna1: niels_mdg
          rpmkr_mdg_kna1: rpmkr_mdg
          bran1_mdg_kna1: bran1_mdg
          brsch_mdg_kna1: brsch_mdg
          hash_mdg: hash_mdg
        distinct: true


    - kind: checkpoint
      name: mdg
      context_name: mdg_checkpoint



#######################################################################################################

    # ===================================================================
    # 1. READ & FILTER MAIN ACCOUNT TABLE
    # ===================================================================
    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1

    - kind: filter
      name: filter_d365_account
      context_name: read_d365_account
      params:
        - condition: cch_sapid LIKE any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and length(cch_sapid)=10

    - kind: select
      name: select_base_account
      context_name: filter_d365_account
      params:
        columns:
          cch_sapid: cch_sapid
          cch_subtradechannel: cch_subtradechannel
          cch_orderblockall: cch_orderblockall
          cch_technicalservicepriority: cch_technicalservicepriority
          cch_distributiontype: cch_distributiontype
          cch_expressorder: cch_expressorder
          cch_customerclassification: cch_customerclassification
          cch_businesscomplextype: cch_businesscomplextype
          cch_primaryconsumeractivity: cch_primaryconsumeractivity
          cch_demandareaid: cch_demandareaid
          cch_subdemandareaid: cch_subdemandareaid
          cch_accountgroupid: cch_accountgroupid
          cch_salespurtax: cch_salespurtax
          cch_equalizationtax: cch_equalizationtax
          cch_naturalperson: cch_naturalperson
          cch_taxnumber6: cch_taxnumber6
          cch_centralpostingblock: cch_centralpostingblock
          cch_consumeractivitycluster: cch_consumeractivitycluster
          cch_serviceleadtime: cch_serviceleadtime
          cch_locationcode: cch_locationcode
          cch_nielsenid: cch_nielsenid
          cch_regionalmarket: cch_regionalmarket
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          cch_salesorganizationid: cch_salesorganizationid
        distinct: true
    # ===================================================================
    # 2. READ ALL LOOKUP TABLES
    # ===================================================================
    - kind: read_dataio
      name: read_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1

    - kind: read_dataio
      name: read_subtradechannel
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_subtradechannel
        schema_version: v1

    - kind: select
      name: select_subtradechannel
      context_name: read_subtradechannel
      params:
        columns:
          id: stcid
          cch_code: stc_cch_code
          cch_tradechannelcode: stc_cch_tradechannelcode
          cch_customeractivityclustercode: stc_cch_customeractivityclustercode
        distinct: true

    - kind: read_dataio
      name: read_demandarea
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_demandarea
        schema_version: v1

    - kind: select
      name: select_demandarea
      context_name: read_demandarea
      params:
        columns:
          id: daid
          cch_sapid: da_cch_sapid
        distinct: true

    - kind: select
      name: select_subdemandarea
      context_name: read_demandarea
      params:
        columns:
          id: sdaid
          cch_sapid: sda_cch_sapid
        distinct: true

    - kind: read_dataio
      name: read_accountgroup
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_accountgroup
        schema_version: v1

    - kind: select
      name: select_accountgroup
      context_name: read_accountgroup
      params:
        columns:
          id: acgid
          cch_code: acg_cch_code
        distinct: true
    # ===================================================================
    # 3. PREPARE LOOKUP CTEs (distinct mappings)
    # ===================================================================
    - kind: filter
      name: filter_tradechannelcode
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_tradechannelcode'

    - kind: select
      name: select_tradechannelcode
      context_name: filter_tradechannelcode
      params:
        columns:
          cch_optionsetvalue: tc_optionset
          cch_externalvalue: tc_external
        distinct: true

    - kind: filter
      name: filter_customeractivitycluster
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_customeractivityclusterisscom'

    - kind: select
      name: select_customeractivitycluster
      context_name: filter_customeractivitycluster
      params:
        columns:
          cch_optionsetvalue: cac_optionset
          cch_externalvalue: cac_external
        distinct: true

    - kind: filter
      name: filter_orderblockall
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_orderblockall'

    - kind: select
      name: select_orderblockall
      context_name: filter_orderblockall
      params:
        columns:
          cch_optionsetvalue: oba_optionset
          cch_externalvalue: oba_external
        distinct: true

    - kind: filter
      name: filter_technicalservicepriority
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_technicalservicepriority'

    - kind: select
      name: select_technicalservicepriority
      context_name: filter_technicalservicepriority
      params:
        columns:
          cch_optionsetvalue: tsp_optionset
          cch_externalvalue: tsp_external
        distinct: true

    - kind: filter
      name: filter_distributiontype
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributiontype'

    - kind: select
      name: select_distributiontype
      context_name: filter_distributiontype
      params:
        columns:
          cch_optionsetvalue: dt_optionset
          cch_externalvalue: dt_external
        distinct: true

    - kind: filter
      name: filter_expressorder
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_expressorder'

    - kind: select
      name: select_expressorder
      context_name: filter_expressorder
      params:
        columns:
          cch_optionsetvalue: eo_optionset
          cch_externalvalue: eo_external
        distinct: true

    - kind: filter
      name: filter_customerclassification
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_customerclassification'

    - kind: select
      name: select_customerclassification
      context_name: filter_customerclassification
      params:
        columns:
          cch_optionsetvalue: ccf_optionset
          cch_externalvalue: ccf_external
        distinct: true

    - kind: filter
      name: filter_businesscomplextype
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_businesscomplextype'

    - kind: select
      name: select_businesscomplextype
      context_name: filter_businesscomplextype
      params:
        columns:
          cch_optionsetvalue: bct_optionset
          cch_externalvalue: bct_external
        distinct: true

    - kind: filter
      name: filter_primaryconsumeractivity
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_primaryconsumeractivity'

    - kind: select
      name: select_primaryconsumeractivity
      context_name: filter_primaryconsumeractivity
      params:
        columns:
          cch_optionsetvalue: pca_optionset
          cch_externalvalue: pca_external
        distinct: true
        
        
#   ###################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true
    
#   ###################################################
#    distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true

    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1
    
    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1
    
    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true    

    # ===================================================================
    # 4. JOIN ALL LOOKUPS TO ACCOUNT
    # ===================================================================
    - kind: join
      name: join_all_lookups
      context_name: select_base_account
      params:
        # Join subtradechannel
        - other: select_subtradechannel
          how: left
          columns:
            cch_subtradechannel: stcid
        # Join demand area
        - other: select_demandarea
          how: left
          columns:
            cch_demandareaid: daid
        # Join sub demand area
        - other: select_subdemandarea
          how: left
          columns:
            cch_subdemandareaid: sdaid
        # Join account group
        - other: select_accountgroup
          how: left
          columns:
            cch_accountgroupid: acgid
        # Join option set mappings
        - other: select_tradechannelcode
          how: left
          columns:
            stc_cch_tradechannelcode: tc_optionset
        - other: select_customeractivitycluster
          how: left
          columns:
            stc_cch_customeractivityclustercode: cac_optionset
        - other: select_orderblockall
          how: left
          columns:
            cch_orderblockall: oba_optionset
        - other: select_technicalservicepriority
          how: left
          columns:
            cch_technicalservicepriority: tsp_optionset
        - other: select_distributiontype
          how: left
          columns:
            cch_distributiontype: dt_optionset
        - other: select_expressorder
          how: left
          columns:
            cch_expressorder: eo_optionset
        - other: select_customerclassification
          how: left
          columns:
            cch_customerclassification: ccf_optionset
        - other: select_businesscomplextype
          how: left
          columns:
            cch_businesscomplextype: bct_optionset
        - other: select_primaryconsumeractivity
          how: left
          columns:
            cch_primaryconsumeractivity: pca_optionset
        - other:
            union_cte_distributionchannel
          how:
            inner
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            inner
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id

    - kind: filter
      name: filter_d365
      context_name: join_all_lookups
      params:
        - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

    # ===================================================================
    # 5. ADD FINAL COLUMNS + HASH
    # ===================================================================
    - kind: add
      name: add_final_columns
      context_name: filter_d365
      params:
        - column: PARTNER
          expression: trim(coalesce(cch_sapid, ''))
        - column: KTOKD
          expression: trim(coalesce(acg_cch_code, ''))
        - column: STKZU
          expression: trim(coalesce(if(cch_salespurtax = 'false', '', 'X'), ''))
        - column: STKZA
          expression: trim(coalesce(if(cch_equalizationtax = 'false', '', 'X'), ''))
        - column: STKZN
          expression: trim(coalesce(if(cch_naturalperson = 'false', '', 'X'), ''))
        - column: STCD6
          expression: trim(coalesce(cch_taxnumber6, ''))
        - column: AUFSD
          expression: trim(coalesce(oba_external, ''))
        - column: SPERR
          expression: trim(coalesce(if(cch_centralpostingblock = 'false', '', 'X'), ''))
        - column: KATR1
          expression: trim(coalesce(cac_external, ''))
        - column: KATR2
          expression: trim(coalesce(cch_consumeractivitycluster, ''))
        - column: KATR3
          expression: trim(coalesce(tsp_external, ''))
        - column: KATR4
          expression: trim(coalesce(cast(dt_external AS INT), ''))
        - column: KATR5
          expression: trim(coalesce(cast(cch_serviceleadtime AS INT), ''))
        - column: KATR6
          expression: trim(coalesce(tc_external, ''))
        - column: KATR7
          expression: trim(coalesce(stc_cch_code, ''))
        - column: KATR8
          expression: trim(coalesce(pca_external, ''))
        - column: KATR9
          expression: trim(coalesce(bct_external, ''))
        - column: KATR10
          expression: trim(coalesce(eo_external, ''))
        - column: LOCCO
          expression: trim(coalesce(cch_locationcode, ''))
        - column: KUKLA
          expression: trim(coalesce(ccf_external, ''))
        - column: NIELS
          expression: trim(coalesce(cch_nielsenid, ''))
        - column: RPMKR
          expression: trim(coalesce(cch_regionalmarket, ''))
        - column: BRAN1
          expression: trim(coalesce(sda_cch_sapid, ''))
        - column: BRSCH
          expression: trim(coalesce(da_cch_sapid, ''))
        - column: HASH
          expression: >-
            md5(concat(
              trim(coalesce(cch_sapid,'')),
              trim(coalesce(if(cch_salespurtax='false','','X'),'')),
              trim(coalesce(if(cch_equalizationtax='false','','X'),'')),
              trim(coalesce(if(cch_naturalperson='false','','X'),'')),
              trim(coalesce(cch_taxnumber6,'')),
              trim(coalesce(oba_external,'')),
              trim(coalesce(if(cch_centralpostingblock='false','','X'),'')),
              trim(coalesce(cac_external,'')),
              trim(coalesce(cch_consumeractivitycluster,'')),
              trim(coalesce(tsp_external,'')),
              trim(coalesce(cast(dt_external AS INT),'')),
              trim(coalesce(cast(cch_serviceleadtime AS INT),'')),
              trim(coalesce(tc_external,'')),
              trim(coalesce(stc_cch_code,'')),
              trim(coalesce(pca_external,'')),
              trim(coalesce(bct_external,'')),
              trim(coalesce(eo_external,'')),
              trim(coalesce(cch_locationcode,'')),
              trim(coalesce(ccf_external,'')),
              trim(coalesce(cch_nielsenid,'')),
              trim(coalesce(cch_regionalmarket,'')),
              trim(coalesce(sda_cch_sapid,'')),
              trim(coalesce(da_cch_sapid,''))
            ))



    # ===================================================================
    # 6. FINAL SELECT WITH DISTINCT
    # ===================================================================
    - kind: select
      name: checkpoint_d365
      context_name: add_final_columns
      params:
        columns:
          PARTNER: PARTNER_d365
          KTOKD: KTOKD_d365
          STKZU: STKZU_d365
          STKZA: STKZA_d365
          STKZN: STKZN_d365
          STCD6: STCD6_d365
          AUFSD: AUFSD_d365
          SPERR: SPERR_d365
          KATR1: KATR1_d365
          KATR2: KATR2_d365
          KATR3: KATR3_d365
          KATR4: KATR4_d365
          KATR5: KATR5_d365
          KATR6: KATR6_d365
          KATR7: KATR7_d365
          KATR8: KATR8_d365
          KATR9: KATR9_d365
          KATR10: KATR10_d365
          LOCCO: LOCCO_d365
          KUKLA: KUKLA_d365
          NIELS: NIELS_d365
          RPMKR: RPMKR_d365
          BRAN1: BRAN1_d365
          BRSCH: BRSCH_d365
          HASH: HASH_d365
        distinct: true

    - kind: checkpoint
      name: d365
      context_name: checkpoint_d365


#######################################################################################################################


    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            hash_mdg: hash_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
