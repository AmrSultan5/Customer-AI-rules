transform:
  name: f_customer_details_l3_history
  operations:

  - kind: read_dataio
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general
      schema_version: v11

  - kind: select
    name: select_dm_customer_general
    params:
      columns:
        customer_code: customer_code
      distinct: true

  - kind: read_dataio
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_rules_inventory
      schema_version: v6

  - kind: filter
    name: filter_dim_rules_inventory
    params:
      - condition:
          is_active = '1'

  - kind: select
    name: select_dim_rules_inventory
    context_name: filter_dim_rules_inventory
    params:
      columns:
        rule_code: rule_code
      distinct: true

  - kind: read_dataio
    name: read_dm_customer_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_check_results
      schema_version: v2

  - kind: filter
    name: filter_dm_customer_check_results
    params:
      - condition:
          check_status in ('0','1')

#  - kind: select
#    name: select_check_date
#    params:
#      columns:
#        check_date: check_date
#        process_run_id: process_run_id
#      distinct: true

#  - kind: group
#    name: group_max_check_date
#    params:
#      - aggs:
#          check_date: max
#        by:
#        - process_run_id

#  - kind: add
#    name: add_max_check_date
#    params:
#      - column: to_date_max_check_date
#        expression: to_date(max_check_date, "yyyy-MM-dd")

  - kind: select
    name: select_dm_customer_check_results
    context_name: filter_dm_customer_check_results
    params:
      columns:
        value_checked: value_checked
        check_status: check_status
        customer_code: customer_code
        rule_code: rule_code
        check_date: check_date
      distinct: true

#  - kind: add
#    name: add_dm_customer_check_results
#    params:
#      - column: to_date_check_date
#        expression: to_date(check_date, "yyyy-MM-dd")

#  - kind: join
#    name: join_dm_customer_check_results_max_check_date
#    params:
#      - other:
#          add_max_check_date
#        how:
#          inner
#        columns:
#          to_date_check_date: to_date_max_check_date

  - kind: join
    name: join_read_dm_customer_general_check_results
    context_name: select_dm_customer_general
    params:
      - other:
#          join_dm_customer_check_results_max_check_date
          select_dm_customer_check_results
        how:
          inner
        columns:
          customer_code: customer_code
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: current_date()

  - kind: select
    name: select_f_customer_details_l3_history
    params:
      columns:
        value_checked: value_checked
        check_status: check_status
        customer_code: customer_code
        rule_code: rule_code
        loading_date: loading_date
      distinct: true

  - kind: write_dataio
    name: write_f_customer_details_l3_history
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_customer_details_l3_history
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full