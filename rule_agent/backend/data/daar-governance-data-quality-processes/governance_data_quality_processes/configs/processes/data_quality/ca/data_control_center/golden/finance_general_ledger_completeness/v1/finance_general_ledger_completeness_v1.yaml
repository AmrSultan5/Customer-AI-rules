transform:
  name: finance_general_ledger_completeness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_general_ledger
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_general_ledger

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_controlling_area
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_controlling_area


  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_cost_element
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_cost_element

  - kind: select
    name: select_dfgl
    context_name: read_dm_finance_general_ledger
    params:
      columns:
        company_code: company_code
        planning_level: planning_level
        commitment_item: commitment_item
        g_l_account_type: g_l_account_type
        chart_of_accounts: chart_of_accounts
        g_l_account_number: g_l_account_number
        field_status_group: field_status_group
        layout_rule_sort_key: layout_rule_sort_key
        line_item_management: line_item_management
        g_l_account_currency: g_l_account_currency
        g_l_account_group_code: g_l_account_group_code
        g_l_account_short_text: g_l_account_short_text
        relevant_cash_flow_ind: relevant_cash_flow_ind
        balance_sheet_account_ind: balance_sheet_account_ind
        open_items_management_ind: open_items_management_ind
        reconciliation_account_ind: reconciliation_account_ind
        balances_in_local_currency: balances_in_local_currency
        tolerance_group_for_accounts: tolerance_group_for_accounts
        exchange_rate_difference_key: exchange_rate_difference_key
        is_chart_of_accounts_allowed: is_chart_of_accounts_allowed
        g_l_account_number_description: g_l_account_number_description
        is_layout_rule_sort_key_allowed: is_layout_rule_sort_key_allowed
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dfca
    context_name: read_dm_finance_controlling_area
    params:
      columns:
        company_code: company_code_dfca
        country_code: country_code_dfca
        chart_of_accounts: chart_of_accounts_dfca
        controlling_area_code: controlling_area_code_dfca
        sap_cluster: sap_cluster_dfca
      distinct: true

  - kind: select
    name: select_dfce
    context_name: read_dm_finance_cost_element
    params:
      columns:
        cost_element: cost_element_dfce
        controlling_area_code: controlling_area_code_dfce
        cost_element_subcategory: cost_element_subcategory_dfce
        cost_element_attributes: cost_element_attributes_dfce
        is_cost_element_subcategory_allowed: is_cost_element_subcategory_allowed_dfce
        chart_of_accounts: chart_of_accounts_dfce
        sap_cluster: sap_cluster_dfce
      distinct: true

  - kind: join
    name: join_dfgl_dfca
    context_name: select_dfgl
    params:
      - other:
          select_dfca
        how:
          inner
        columns:
          company_code: company_code_dfca
          chart_of_accounts: chart_of_accounts_dfca
          sap_cluster: sap_cluster_dfca

  - kind: join
    name: join_dfgl_dfca_dfce
    context_name: select_dfgl
    params:
      - other:
          select_dfca
        how:
          inner
        columns:
          company_code: company_code_dfca
          chart_of_accounts: chart_of_accounts_dfca
          sap_cluster: sap_cluster_dfca
      - other:
          select_dfce
        how:
          inner
        columns:
          controlling_area_code_dfca: controlling_area_code_dfce
          chart_of_accounts: chart_of_accounts_dfce
          g_l_account_number: cost_element_dfce
          sap_cluster: sap_cluster_dfce

#SELECT RFCOMP_FA_7
  - kind: select
    name: select_RFCOMP_GL_7
    context_name: join_dfgl_dfca
    params:
      columns:
        company_code: company_code
        chart_of_accounts: chart_of_accounts
        g_l_account_number: g_l_account_number
        is_chart_of_accounts_allowed: is_chart_of_accounts_allowed
        country_code_dfca: country_code_dfca
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_GL_7
    context_name: select_RFCOMP_GL_7
    params:
      - column: rule_code
        expression: "'RFCOMP_GL.7'"
      - column: attribute_name
        expression: '''General Ledger'''
      - column: check_status
        expression: 
                    if(chart_of_accounts IS NULL OR chart_of_accounts = '' OR (chart_of_accounts IS NOT NULL AND chart_of_accounts != '' AND (is_chart_of_accounts_allowed IS NULL OR is_chart_of_accounts_allowed = '')),'0','1')

  - kind: select
    name: select_RFCOMP_GL_7_final
    context_name: add_RFCOMP_GL_7
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        g_l_account_number: finance_value
        attribute_name: attribute_name
        chart_of_accounts: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true

