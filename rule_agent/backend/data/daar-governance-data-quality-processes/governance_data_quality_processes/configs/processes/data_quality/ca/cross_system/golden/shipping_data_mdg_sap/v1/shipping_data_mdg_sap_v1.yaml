transform:
  name: Shipping_data_mdg_sap
  operations:
    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: select
      name: select_mdg_knvv
      context_name: read_mdg_knvv
      params:
        columns:
          KUNNR: PARTNER
          KVGR4: KVGR4
          vkorg: vkorg
          vtweg: vtweg
          spart: spart
          AUTLF: AUTLF
          VWERK: VWERK
          LPRIO: LPRIO
          ANTLF: ANTLF
          KZTLF: KZTLF
          VSBED: VSBED
 
    - kind: add
      name: add_mdg_HASH
      context_name: select_mdg_knvv
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,vkorg,vtweg,spart,AUTLF,VWERK,LPRIO,ANTLF,KZTLF,VSBED))

    - kind: filter
      name: filter_mdg_knvv
      context_name: add_mdg_HASH
      params:
        - condition: PARTNER LIKE any('12%','13%','40%','18%','30%','16%','29%','17%','24%','26%','21%','19%','96%','28%','27%','32%','35%','25%','34%','42%','33%','31%','15%','95%','94%','14%','22%','47%') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: select
      name: mdg
      context_name: filter_mdg_knvv
      params:
        columns:
          PARTNER: PARTNER_mdg
          KVGR4: KVGR4_mdg
          vkorg: vkorg_mdg
          vtweg: vtweg_mdg
          spart: spart_mdg
          AUTLF: AUTLF_mdg
          VWERK: VWERK_mdg
          LPRIO: LPRIO_mdg
          ANTLF: ANTLF_mdg
          KZTLF: KZTLF_mdg
          VSBED: VSBED_mdg
          HASH: HASH_mdg

    - kind: read_dataio
      name: read_s4hana_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: select
      name: select_s4hana_knvv
      context_name: read_s4hana_knvv
      params:
        columns:
          KUNNR: PARTNER
          KVGR4: KVGR4
          vkorg: vkorg
          vtweg: vtweg
          spart: spart
          AUTLF: AUTLF
          VWERK: VWERK
          LPRIO: LPRIO
          ANTLF: ANTLF
          KZTLF: KZTLF
          VSBED: VSBED
          SAP_CLUSTER: SAP_CLUSTER

    - kind: add
      name: add_s4hana_HASH
      context_name: select_s4hana_knvv
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,vkorg,vtweg,spart,AUTLF,VWERK,LPRIO,ANTLF,KZTLF,VSBED))

    - kind: filter
      name: s4hana_union
      context_name: add_s4hana_HASH
      params:
        - condition: if(SAP_CLUSTER = 'CL1', PARTNER like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),PARTNER like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')) and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: select
      name: s4hana
      context_name: s4hana_union
      params:
        columns:
          PARTNER: PARTNER_s4hana
          KVGR4: KVGR4_s4hana
          vkorg: vkorg_s4hana
          vtweg: vtweg_s4hana
          spart: spart_s4hana
          AUTLF: AUTLF_s4hana
          VWERK: VWERK_s4hana
          LPRIO: LPRIO_s4hana
          ANTLF: ANTLF_s4hana
          KZTLF: KZTLF_s4hana
          VSBED: VSBED_s4hana
          HASH: HASH_s4hana

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            HASH_mdg: HASH_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_s4hana is null or HASH_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          PARTNER_mdg: PARTNER_mdg
          KVGR4_mdg: KVGR4_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          AUTLF_mdg: AUTLF_mdg
          VWERK_mdg: VWERK_mdg
          LPRIO_mdg: LPRIO_mdg
          ANTLF_mdg: ANTLF_mdg
          KZTLF_mdg: KZTLF_mdg
          VSBED_mdg: VSBED_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          PARTNER_s4hana: PARTNER_s4hana
          KVGR4_s4hana: KVGR4_s4hana
          vkorg_s4hana: vkorg_s4hana
          vtweg_s4hana: vtweg_s4hana
          spart_s4hana: spart_s4hana
          AUTLF_s4hana: AUTLF_s4hana
          VWERK_s4hana: VWERK_s4hana
          LPRIO_s4hana: LPRIO_s4hana
          ANTLF_s4hana: ANTLF_s4hana
          KZTLF_s4hana: KZTLF_s4hana
          VSBED_s4hana: VSBED_s4hana
          HASH_s4hana: HASH_s4hana

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            PARTNER_mdg: PARTNER_s4hana
            vkorg_mdg: vkorg_s4hana
            vtweg_mdg: vtweg_s4hana
            spart_mdg: spart_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN PARTNER_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN PARTNER_s4hana IS NULL THEN 'data missing from sap' end
        - column: msg_shipping_data_complete_delivery_required_by_law
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana and vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana and AUTLF_s4hana <> AUTLF_mdg THEN 'attributes are mismatching' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          PARTNER_s4hana: partner
          vkorg_s4hana: VKORG
          vtweg_s4hana: VTWEG
          spart_s4hana: SPART
          KVGR4_s4hana: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##SHIPPING DATA: Complete Delivery Required By Law
    - kind: filter
      name: shipping_data_complete_delivery_required_by_law_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND AUTLF_s4hana <> AUTLF_mdg

    - kind: add
      name: add_missing_columns_shipping_data_complete_delivery_required_by_law
      context_name: shipping_data_complete_delivery_required_by_law_filter
      params:
        - column: attr_name_by_law
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND AUTLF_s4hana <> AUTLF_mdg THEN concat('SHIPPING DATA:',' Complete Delivery Required By Law') END

    - kind: select
      name: final_shipping_data_complete_delivery_required_by_law
      context_name: add_missing_columns_shipping_data_complete_delivery_required_by_law
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_complete_delivery_required_by_law: msg
          attr_name_by_law: attr_name
          AUTLF_s4hana: tgt_attr
          AUTLF_mdg: src_attr

###SHIPPING DATA: Delivering Plant---
    - kind: filter
      name: shipping_data_delivering_plant_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VWERK_s4hana <> VWERK_mdg

    - kind: add
      name: add_missing_columns_shipping_data_delivering_plant
      context_name: shipping_data_delivering_plant_filter
      params:
        - column: attr_name_shipping_data_delivering_plant
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VWERK_s4hana <> VWERK_mdg THEN concat('SHIPPING DATA:',' Delivering Plant') END
        - column: msg_shipping_data_delivering_plant
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VWERK_s4hana <> VWERK_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_delivering_plant
      context_name: add_missing_columns_shipping_data_delivering_plant
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_delivering_plant: msg
          attr_name_shipping_data_delivering_plant: attr_name
          VWERK_s4hana: tgt_attr
          VWERK_mdg: src_attr

##SHIPPING DATA: Delivery Priority
    - kind: filter
      name: shipping_data_delivery_priority_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND LPRIO_s4hana <> LPRIO_mdg

    - kind: add
      name: add_missing_columns_shipping_data_delivery_priority
      context_name: shipping_data_delivery_priority_filter
      params:
        - column: attr_name_shipping_data_delivery_priority
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND LPRIO_s4hana <> LPRIO_mdg THEN concat('SHIPPING DATA:',' Delivery Priority') END
        - column: msg_shipping_data_delivery_priority
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND LPRIO_s4hana <> LPRIO_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_delivery_priority
      context_name: add_missing_columns_shipping_data_delivery_priority
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_delivery_priority: msg
          attr_name_shipping_data_delivery_priority: attr_name
          LPRIO_s4hana: tgt_attr
          LPRIO_mdg: src_attr

###SHIPPING DATA: Max.Part.Deliveries

    - kind: filter
      name: shipping_data_max_part_deliveries_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND ANTLF_s4hana <> ANTLF_mdg

    - kind: add
      name: add_missing_columns_shipping_data_max_part_deliveries
      context_name: shipping_data_max_part_deliveries_filter
      params:
        - column: attr_name_shipping_data_max_part_deliveries
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND ANTLF_s4hana <> ANTLF_mdg THEN concat('SHIPPING DATA:',' Max.Part.Deliveries') END
        - column: msg_shipping_data_max_part_deliveries
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND ANTLF_s4hana <> ANTLF_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_max_part_deliveries
      context_name: add_missing_columns_shipping_data_max_part_deliveries
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_max_part_deliveries: msg
          attr_name_shipping_data_max_part_deliveries: attr_name
          ANTLF_s4hana: tgt_attr
          ANTLF_mdg: src_attr

###SHIPPING DATA: Part.dlv./item
    - kind: filter
      name: shipping_data_part_dlv_item_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND KZTLF_s4hana <> KZTLF_mdg

    - kind: add
      name: add_missing_columns_shipping_data_part_dlv_item
      context_name: shipping_data_part_dlv_item_filter
      params:
        - column: attr_name_shipping_data_part_dlv_item
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND KZTLF_s4hana <> KZTLF_mdg THEN concat('SHIPPING DATA:',' Part.dlv./item') END
        - column: msg_shipping_data_part_dlv_item
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND KZTLF_s4hana <> KZTLF_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_part_dlv_item
      context_name: add_missing_columns_shipping_data_part_dlv_item
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_part_dlv_item: msg
          attr_name_shipping_data_part_dlv_item: attr_name
          KZTLF_s4hana: tgt_attr
          KZTLF_mdg: src_attr

###SHIPPING DATA: Shipping Conditions
    - kind: filter
      name: shipping_data_shipping_conditions_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VSBED_s4hana <> VSBED_mdg

    - kind: add
      name: add_missing_columns_shipping_data_shipping_conditions
      context_name: shipping_data_shipping_conditions_filter
      params:
        - column: attr_name_shipping_data_shipping_conditions
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VSBED_s4hana <> VSBED_mdg THEN concat('SHIPPING DATA:',' Shipping Conditions') END
        - column: msg_shipping_data_shipping_conditions
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND VSBED_s4hana <> VSBED_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_shipping_conditions
      context_name: add_missing_columns_shipping_data_shipping_conditions
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_shipping_conditions: msg
          attr_name_shipping_data_shipping_conditions: attr_name
          VSBED_s4hana: tgt_attr
          VSBED_mdg: src_attr

    - kind: union
      name: union_comparison
      context_name: final_data_missing_from_mdg
      params:
        allow_missing: true
        by_name: true
        other: final_data_missing_from_s4hana

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_complete_delivery_required_by_law

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_delivering_plant

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_delivery_priority

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_max_part_deliveries

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_part_dlv_item

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_shipping_data_shipping_conditions

    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          name_last: name_last_mdg_but000
          name_first: name_first_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1

    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1

    - kind: filter
      name: filter_t077x
      params:
        - condition: spras = 'E' and sap_cluster = 'CL1'

    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true

    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1

    - kind: filter
      name: filter_tvv4t
      params:
        - condition: sap_cluster = 'CL1' and spras = 'E'

    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
