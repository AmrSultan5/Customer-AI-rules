        - column: table_name
          expression: cast('SHIPPING DATA' as string)
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: dimension
          expression: cast('ATTRIBUTES ARE MISMATCHING' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_data_mismatch_agg
      context_name: add_missing_columns_data_mismatch_agg
      params:
        - aggs:
            partner: count
          by:
          - country
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_data_mismatch_final
      context_name: group_data_mismatch_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_partner: cnt
          country: country
          loading_date: loading_date
        distinct: true  

### write agg ###
    - kind: union
      name: union_comparison_agg_final
      context_name: select_mdg_agg_final
      params:
        allow_missing: true
        by_name: true
        other: select_s4hana_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_missing_from_mdg_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_missing_from_s4hana_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_mismatch_final

    - kind: cast
      name: cast_cnt
      context_name: union_comparison_agg
      params:
      - column: cnt
