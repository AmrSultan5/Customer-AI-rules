  - kind: select
    name: select_a8
    params:
      columns:
        vkgrp: vkgrp_a8
        vkbur: vkbur_a8
        sap_cluster: sap_cluster_a8
      distinct: true


  - kind: select
    name: select_a11
    context_name: read_tvbvk
    params:
      columns:
        vkgrp: vkgrp_a11
        sap_cluster: sap_cluster_a11
      distinct: true


#TVKBT - A9
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_tvkbt
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvkbt

  - kind: filter
    name: filter_a9
    params:
      - condition:
          spras = 'E'

  - kind: select
