transform:
  name: dm_customer_sales_organization
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#KNVV - KV
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: knvv

  - kind: filter
    name: filter_knvh
    params:
      - condition:
          (spart = '01' AND vtweg = '01' AND  kvgr4 != 'ZIN')

  - kind: select
    name: select_kv
    params:
      columns:
        kunnr: kunnr_kv
        vkorg: vkorg_kv
        vtweg: vtweg_kv
        spart: spart_kv
        aufsd: aufsd_kv
        kdgrp: kdgrp_kv
        ktgrd: ktgrd_kv
        zterm: zterm_kv
        inco1: inco1_kv
        konda: konda_kv
        kvgr4: kvgr4_kv
        vkbur: vkbur_kv
        vwerk: vwerk_kv
        vkgrp: vkgrp_kv
        vsbed: vsbed_kv
        sap_cluster: sap_cluster_kv
      distinct: true



#TVSBT - A1   Waiting for curated data
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
