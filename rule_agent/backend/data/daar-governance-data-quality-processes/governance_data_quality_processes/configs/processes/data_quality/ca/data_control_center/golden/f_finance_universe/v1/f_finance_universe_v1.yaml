transform:
  name: f_finance_universe
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

# Read dm_finance_controlling_area

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_controlling_area
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_controlling_area

# Read dm_finance_general_ledger

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_general_ledger
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_general_ledger

# Read dm_finance_internal_order

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_internal_order
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_internal_order

# Read dm_finance_asset

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_asset
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_asset


# Read dm_finance_cost_center

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_cost_center
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_cost_center


# Read dim_finance_classification

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_finance_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_finance_classification

# Select dm_finance_controlling_area

  - kind: select
    name: select_dm_finance_controlling_area
    context_name: read_dm_finance_controlling_area
    params:
      columns:
        chart_of_accounts: chart_of_accounts
        company_code: company_code
        controlling_area_code: controlling_area_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

#Select dm_finance_general_ledger

  - kind: select
    name: select_dm_finance_general_ledger
    context_name: read_dm_finance_general_ledger
    params:
      columns:
        company_code: company_code
        chart_of_accounts: chart_of_accounts
        g_l_account_number: g_l_account_number
        g_l_account_group_code: g_l_account_group_code
        sap_cluster: sap_cluster
      distinct: true

#Select dm_finance_internal_order

  - kind: select
    name: select_dm_finance_internal_order
    context_name: read_dm_finance_internal_order
    params:
      columns:
        controlling_area_code: controlling_area_code
        company_code: company_code
        order_number: order_number
        order_type: order_type
        sap_cluster: sap_cluster
      distinct: true

#Select dm_finance_asset

  - kind: select
    name: select_dm_finance_asset
    context_name: read_dm_finance_asset
    params:
      columns:
        controlling_area_code: controlling_area_code
        company_code: company_code
        asset_number: asset_number
        sap_cluster: sap_cluster
      distinct: true

#Select dm_finance_cost_center

  - kind: select
    name: select_dm_finance_cost_center
    context_name: read_dm_finance_cost_center
    params:
      columns:
        controlling_area_code: controlling_area_code
        company_code: company_code
        cost_center_number: cost_center_number
        functional_area: functional_area
        standard_hierarchy_area: standard_hierarchy_area
        sap_cluster: sap_cluster
      distinct: true


#Select dim_finance_classification


  - kind: add
    name: add_dim_finance_classification
    context_name: read_dim_finance_classification
    params:
      - column: controlling_area_code_fcc
        expression: "CASE WHEN(controlling_area_code IS NULL) THEN 'null' ELSE controlling_area_code  END"
      - column: company_code_fcc
        expression:  "CASE WHEN(company_code  IS NULL) THEN 'null' ELSE company_code  END"
      - column: charts_of_accounts_fcc
        expression: "CASE WHEN(chart_of_accounts_code IS NULL) THEN 'null' ELSE chart_of_accounts_code END"
      - column: cost_center_number_fcc
        expression: "CASE WHEN(cost_center_number IS NULL) THEN 'null' ELSE cost_center_number END"
      - column: functional_area_code_fcc
        expression: "CASE WHEN(functional_area_code IS NULL) THEN 'null' ELSE functional_area_code END"
      - column: cost_center_hierarchy_fcc
        expression: "CASE WHEN(cost_center_hierarchy IS NULL) THEN 'null' ELSE cost_center_hierarchy END"

  - kind: select
    name: select_dim_finance_classification
    params:
      columns:
        controlling_area_code_fcc: controlling_area_code
        company_code_fcc: company_code
        charts_of_accounts_fcc: charts_of_accounts
        finance_class_id: finance_class_id
        object_type: object_type
        cost_center_number_fcc: cost_center_number_fcc
        functional_area_code_fcc: functional_area_code_fcc
        cost_center_hierarchy_fcc: cost_center_hierarchy_fcc
      distinct: true

  - kind: join
    name: join_ca_gl
    context_name: select_dm_finance_controlling_area
    params:
      - other:
          select_dm_finance_general_ledger
        how:
          inner
        columns:
          chart_of_accounts: chart_of_accounts
          company_code: company_code
          sap_cluster: sap_cluster


  - kind: join
    name: join_ca_gl_fc
    context_name: join_ca_gl
    params:
      - other:
          select_dim_finance_classification
        how:
          left
        columns:
          controlling_area_code: controlling_area_code
          company_code: company_code
          chart_of_accounts: charts_of_accounts

  - kind: filter
    name: filter_obj_gl
    params:
      - condition:
          (object_type  == 'General Ledger')


  - kind: add
    name: add_empty_gl_ca
    params:
      - column: order_number
        expression: ''''''
      - column: order_type
        expression: ''''''
      - column: asset_number
        expression:  ''''''
      - column: cost_center_number
        expression: ''''''
      - column: count_io
        expression: ''''''
      - column: count_fa
        expression: ''''''
      - column: count_cc
