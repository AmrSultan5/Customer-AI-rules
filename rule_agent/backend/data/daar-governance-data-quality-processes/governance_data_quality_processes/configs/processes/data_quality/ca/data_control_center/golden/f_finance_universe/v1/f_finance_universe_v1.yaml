        sap_cluster: sap_cluster
        g_l_account_number: g_l_account_number
        g_l_account_group_code: g_l_account_group_code
        count_gl: count_gl
      distinct: true

  - kind: group
    name: group_key_sub_domain_gl
    params:
      - aggs:
          count_gl: count
        by:
        - g_l_account_number
        - company_code
        - sap_cluster
        - g_l_account_group_code


