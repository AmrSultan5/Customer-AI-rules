  - kind: group
    name: sum_key_sub_domain
    params:
      - aggs:
          count_gl: sum
          count_io: sum
          count_fa: sum
          count_cc: sum
        by:
        - count_gl
        - count_io
        - count_fa
        - count_cc
        - country_code
        - finance_class_id

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"
  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"
      - column: no_of_finance_values
        expression: "CAST(CASE WHEN(sum_count_gl IS NOT NULL) THEN sum_count_gl WHEN(sum_count_io IS NOT NULL) THEN sum_count_io WHEN(sum_count_fa IS NOT NULL) THEN sum_count_fa WHEN(sum_count_cc IS NOT NULL) THEN sum_count_cc ELSE 'N/A' END AS INT)"

  - kind: select
    name: select_finall
    params:
      columns:
        finance_class_id: finance_class_id
        country_code: country_code
        loading_date: loading_date
        no_of_finance_values: no_of_finance_values
      distinct: true

