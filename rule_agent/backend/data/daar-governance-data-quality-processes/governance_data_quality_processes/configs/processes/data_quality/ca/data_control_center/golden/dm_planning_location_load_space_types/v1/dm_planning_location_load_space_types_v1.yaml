transform:
  name: dm_planning_location_load_space_types
  operations:

  # Read O4H_OSLC_VEH (location load space type assignments)
  - kind: read_dataio
    name: read_o4h_oslc_veh
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: data_quality
      object_name: o4h_oslc_veh
      schema_version: v1

  # Select and rename columns for final datamart schema
  - kind: select
    name: select_dm_planning_location_load_space_types
    context_name: read_o4h_oslc_veh
    params:
      columns:
        location: planning_location
        lrtyp: vehicle_type
        sap_cluster: sap_cluster
        sap_read_timestamp: sap_read_timestamp
        operation: operation
        role: location_role
      distinct: true

  # Write to golden datamart
  - kind: write_dataio
    name: write_dm_planning_location_load_space_types
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_planning_location_load_space_types
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
