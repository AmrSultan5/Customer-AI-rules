transform:
  name: f_vendor_details_l3_activity
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_check_results_activity
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_check_results_activity

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_company
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_company

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_vendor_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_vendor_classification

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_purchasing_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_purchasing_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_vendor_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_vendor_general
      

  - kind: select
    name: select_dm_vendor_check_results_activity
    context_name: read_dm_vendor_check_results_activity
    params:
      columns:
        rule_code: rule_code
        country_code: country_code
        check_status: check_status
        vendor_code: vendor_code
        deletion_block: deletion_block
        deletion_central_flag: deletion_central_flag
        purchasing_block: purchasing_block
        company_level_posting_block: company_level_posting_block
        company_level_deletion_flag: company_level_deletion_flag
        company_level_deletion_block: company_level_deletion_block
        po_level_purchasing_block: po_level_purchasing_block
        po_level_deletion_flag: po_level_deletion_flag
        purchasing_document: purchasing_document
        purchasing_document_date: purchasing_document_date
        invoice_to_complete: invoice_to_complete
        delivery_to_complete: delivery_to_complete
        open_items: open_items
        parked_items: parked_items
      distinct: true

  - kind: add
    name: add_dm_vendor_company
    context_name: read_dm_vendor_company
    params:
      - column: ifnull_company_code
        expression: ifnull(company_code, 'null')

  - kind: select
    name: select_dm_vendor_company
    context_name: add_dm_vendor_company
    params:
      columns:
        vendor_code: vendor_code
        ifnull_company_code: company_code
        country_code: country_code
      distinct: true 

  - kind: add
    name: add_dim_vendor_classification
    context_name: read_dim_vendor_classification
    params:
      - column: ifnull_account_group_code
        expression: ifnull(account_group_code, 'null')
      - column: ifnull_company_code
        expression: ifnull(company_code, 'null')
      - column: ifnull_purchasing_organization_code
        expression: ifnull(purchasing_organization_code, 'null')

  - kind: select
    name: select_dim_vendor_classification
    context_name: add_dim_vendor_classification
    params:
      columns:
        ifnull_account_group_code: vendor_account_group_code
        ifnull_company_code: company_code
        vend_class_id: vend_class_id
        ifnull_purchasing_organization_code: purchasing_organization_code
        preferred_vendor: preferred_vendor
      distinct: true


  - kind: add
    name: add_dm_vendor_purchasing_organization
    context_name: read_dm_vendor_purchasing_organization
    params:
      - column: ifnull_purchasing_organization_code
        expression: ifnull(purchasing_organization_code, 'null')
      - column: ifnull_preferred_vendor
        expression: if(isnull(preferred_vendor) or preferred_vendor= '', '0', '1')

  - kind: select
    name: select_dm_vendor_purchasing_organization
    context_name: add_dm_vendor_purchasing_organization
    params:
      columns:
        vendor_code : vendor_code
        ifnull_purchasing_organization_code: purchasing_organization_code
        ifnull_preferred_vendor: preferred_vendor       
      distinct: true


  - kind: add
    name: add_dm_vendor_general
    context_name: read_dm_vendor_general
    params:
      - column: ifnull_vendor_account_group_code
        expression: ifnull(vendor_account_group_code, 'null')

  - kind: select
    name: select_dm_vendor_general
    context_name: add_dm_vendor_general
    params:
      columns:
        vendor_code: vendor_code
        ifnull_vendor_account_group_code : vendor_account_group_code
        vendor_name1: vendor_name1
      distinct: true   



  - kind: join
    name: join_vendor_details
    context_name: select_dm_vendor_check_results_activity
    params:
      - other:
          select_dm_vendor_general
        how:
          inner
        columns:
          vendor_code: vendor_code
      - other:
          select_dm_vendor_company
        how:
          inner
        columns:
          vendor_code: vendor_code
          country_code: country_code
      - other:
          select_dm_vendor_purchasing_organization
        how:
          inner
        columns:
          vendor_code: vendor_code                 
      - other:
          select_dim_vendor_classification
        how:
          left
        columns:
          vendor_account_group_code: vendor_account_group_code
          company_code: company_code   
          purchasing_organization_code: purchasing_organization_code
          preferred_vendor: preferred_vendor

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"
      - column: activity_check
        expression: if(check_status = '1', 'Vendor active', if(check_status = '0', 'Vendor inactive', ''))

  - kind: select
    name: select_f_vendor_details_l3_activity
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        vendor_code: vendor_code
        country_code: country_code
        loading_date: loading_date
        vendor_name1: vendor_name
        vend_class_id: vend_class_id
        deletion_block: deletion_block
        deletion_central_flag: deletion_central_flag
        purchasing_block: purchasing_block
        company_level_posting_block: company_level_posting_block
        company_level_deletion_flag: company_level_deletion_flag
        company_level_deletion_block: company_level_deletion_block
        po_level_purchasing_block: po_level_purchasing_block
        po_level_deletion_flag: po_level_deletion_flag
        purchasing_document: purchasing_document
        purchasing_document_date: purchasing_document_date
        invoice_to_complete: invoice_to_complete
        delivery_to_complete: delivery_to_complete
        open_items: open_items
        parked_items: parked_items
        activity_check: activity_check
      distinct: true

  - kind: write_dataio
    name: write_f_vendor_details_l3_activity
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_vendor_details_l3_activity
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
