        - material_code
        - sap_cluster

  - kind: join
    name: join_mat_descr_flag
    context_name: select_RPCONF_82_1
    params:
      - other:
          group_mat_descr_flag
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_RPCONF_82_1
    context_name: join_mat_descr_flag
    params:
      - column: rule_code
        expression: "'RPCONF_82.1'"
      - column: check_status
        expression: if(eu_flag != 1 OR eu_flag IS NULL OR eu_flag = '' OR commodity_code IS NULL OR commodity_code = '', '',
                    if(max_mat_descr_flag != '1', '',
                    if(material_type_code IN ('ZSPS','ZSV'), '',
                    if(LEN(commodity_code) IN ('8', '10'), '1', '0'))))
      - column: value_checked
        expression: commodity_code
      - column: plant_code
        expression: ''''''
      - column: sales_org_code
        expression: ''''''

