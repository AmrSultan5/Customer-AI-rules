#SELECT RPCONF_153_2
  - kind: select
    name: select_RPCONF_153_2
    context_name: join_dpg_dpso
    params:
      columns:
        material_code: material_code
        material_description: material_description
        material_type_code: material_type_code
        sap_cluster: sap_cluster
        material_group_code: material_group_code
        distribution_channel_code: distribution_channel_code
        country_code_so: country_code
        sales_org_code_so: sales_org_code
        ss_sm_flag: ss_sm_flag
        product_hierarchy_code: product_hierarchy_code
        pack_size_code: pack_size_code
        pack_type_code: pack_type_code
        pack_size_uom_unified: pack_size_uom_unified
        pack_size_volume_unified: pack_size_volume_unified
        pack_size_name: pack_size_name
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l4_code: product_hierarchy_l4_code
        product_hierarchy_l5_code: product_hierarchy_l5_code
      distinct: true

  - kind: add
    name: add_RPCONF_153_2
    context_name: select_RPCONF_153_2
    params:
      - column: rule_code
        expression: "'RPCONF_153.2'"
      - column: pack_size_name_ss_sm_flag_unified
        expression: concat_ws('_', pack_size_name, ss_sm_flag)
      - column: plant_code
        expression: "''"
      - column: check_status
        expression: "
CASE 
    WHEN material_description LIKE '%ABP%' 
        OR ss_sm_flag IS NULL 
        OR ss_sm_flag = '' 
        OR product_hierarchy_code IS NULL 
        OR product_hierarchy_code = '' 
        OR pack_size_code IS NULL 
        OR pack_size_code = '' 
        OR pack_type_code IS NULL 
        OR pack_type_code = 0 
    THEN ''
    WHEN NOT((product_hierarchy_l4_code IN ('01010012001','01010012015','01010012117', '01010012123', '01010012031','01010012041', '01010012055', '01010022155', '01010012060','01010032163', '01010012069', '01010012083', '01010012093','01010012097', '01010012107', '01030042179', '01010032169', '01030052301', '01030052315', '01049882988', '01049992999', '01010022133', '01010022145', '01010012137')
        OR product_hierarchy_l5_code = '010100120832085' 
        OR product_hierarchy_l3_code = '0206008'))
    THEN ''
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code IN ('ZZ') 
        AND pack_type_code NOT IN ('OTH') 
        AND ss_sm_flag = 'SS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code IN ('ZZ') 
        AND pack_type_code NOT IN ('OTH') 
        AND ss_sm_flag != 'SS' 
    THEN '0'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code IN ('ZZ') 
        AND pack_type_code IN ('OTH') 
        AND ss_sm_flag = 'MS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code IN ('ZZ') 
        AND pack_type_code IN ('OTH') 
        AND ss_sm_flag != 'MS' 
    THEN '0'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code NOT IN ('ZZ') 
        AND pack_type_code IN ('TNK','BIB','BRL','KEG') 
        AND ss_sm_flag = 'SS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND pack_size_code NOT IN ('ZZ') 
        AND pack_type_code IN ('TNK','BIB','BRL','KEG') 
        AND ss_sm_flag != 'SS' 
    THEN '0'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND product_hierarchy_code = '010100120832085' 
        AND ss_sm_flag = 'MS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND product_hierarchy_code = '010100120832085' 
        AND ss_sm_flag != 'MS' 
    THEN '0'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND (product_hierarchy_code LIKE '01010012001%' OR product_hierarchy_code LIKE '01010012015%' OR product_hierarchy_code LIKE  '01010012031%' OR product_hierarchy_code LIKE  
            '01010012069%' OR product_hierarchy_code LIKE  '01010012083%' OR product_hierarchy_code LIKE  '01010012093%' OR product_hierarchy_code LIKE  
            '01010012097%' OR product_hierarchy_code LIKE '01010012107%'
        )
        AND pack_size_uom_unified IN ('ML','G') 
        AND cast(pack_size_volume_unified as float) <= 749 
        AND ss_sm_flag = 'SS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND (product_hierarchy_code LIKE '01010012001%' OR product_hierarchy_code LIKE '01010012015%' OR product_hierarchy_code LIKE  '01010012031%' OR product_hierarchy_code LIKE  
            '01010012069%' OR product_hierarchy_code LIKE  '01010012083%' OR product_hierarchy_code LIKE  '01010012093%' OR product_hierarchy_code LIKE  
            '01010012097%' OR product_hierarchy_code LIKE '01010012107%'
        )
        AND pack_size_uom_unified IN ('ML','G') 
        AND cast(pack_size_volume_unified as float) <= 749 
        AND ss_sm_flag != 'SS' 
    THEN '0'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND (product_hierarchy_code LIKE '01010012001%' OR product_hierarchy_code LIKE '01010012015%' OR product_hierarchy_code LIKE  '01010012031%' OR product_hierarchy_code LIKE  
            '01010012069%' OR product_hierarchy_code LIKE  '01010012083%' OR product_hierarchy_code LIKE  '01010012093%' OR product_hierarchy_code LIKE  
            '01010012097%' OR product_hierarchy_code LIKE '01010012107%'
        ) 
        AND (
            (pack_size_uom_unified IN ('ML','G') AND cast(pack_size_volume_unified as float) > 749) 
            OR (pack_size_uom_unified IN ('L','KG') AND cast(pack_size_volume_unified as float) >= 1)
        ) 
        AND ss_sm_flag = 'MS' 
    THEN '1'
    WHEN sales_org_code = '0001' 
        AND distribution_channel_code = '01' 
        AND material_group_code != '1110000' 
        AND material_type_code LIKE 'ZFG%' 
        AND (product_hierarchy_code LIKE '01010012001%' OR product_hierarchy_code LIKE '01010012015%' OR product_hierarchy_code LIKE  '01010012031%' OR product_hierarchy_code LIKE  
            '01010012069%' OR product_hierarchy_code LIKE  '01010012083%' OR product_hierarchy_code LIKE  '01010012093%' OR product_hierarchy_code LIKE  
            '01010012097%' OR product_hierarchy_code LIKE '01010012107%'
        )
        AND (
            (pack_size_uom_unified IN ('ML','G') AND cast(pack_size_volume_unified as float) > 749) 
            OR (pack_size_uom_unified IN ('L','KG') AND cast(pack_size_volume_unified as float) >= 1)
        ) 
        AND ss_sm_flag != 'MS' 
    THEN '0'
    ELSE '' 
END"

  - kind: select
    name: select_RPCONF_153_2_final
    context_name: add_RPCONF_153_2 
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        pack_size_name_ss_sm_flag_unified: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

