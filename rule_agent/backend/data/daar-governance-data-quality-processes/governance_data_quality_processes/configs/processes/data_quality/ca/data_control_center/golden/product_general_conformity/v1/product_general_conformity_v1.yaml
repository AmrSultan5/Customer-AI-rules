      distinct: true

  - kind: add
    name: add_RPCONF_252_1
    context_name: select_RPCONF_252_1
    params:
      - column: rule_code
        expression: "'RPCONF_252.1'"
      - column: check_status
        expression: "CASE WHEN (material_price_group_code IS NULL OR material_price_group_code = '') OR (coffee_channel_code IS NULL OR coffee_channel_code = '') OR (coffee_format_code IS NULL OR coffee_format_code = '') OR (ss_sm_flag IS NULL OR ss_sm_flag = '') OR material_group_code = '1110000' or material_type_code NOT IN ('ZFG', 'ZFGS', 'ZFGC', 'ZFGA', 'ZFGM') THEN '' 
        WHEN (product_hierarchy_l4_code NOT IN ('01010012001','01010012015','01010012117', '01010012123', '01010012031','01010012041', '01010012055', '01010022155', '01010012060', '01010032163', '01010012069', '01010012083', '01010012093',  '01010012097', '01010012107', '01030042179', '01010032169', '01030052301', '01030052315', '01049882988', '01049992999', '01010022133', '01010022145', '01010012137') OR product_hierarchy_l5_code != '010100120832085' OR product_hierarchy_l3_code != '0206008') THEN '' 
        WHEN material_type_code = 'ZFGC' AND coffee_channel_code IN ('CH4','CH5','CH6','CH3') AND coffee_format_code= 'CF1' AND material_price_group_code = '03' THEN '1'
        WHEN material_type_code = 'ZFGC' AND coffee_channel_code IN ('CH3') AND coffee_format_code IN ('CF2','CF3') AND material_price_group_code ='04' THEN '1'
        WHEN material_type_code = 'ZFGC' AND coffee_channel_code IN ('CH5') AND coffee_format_code IN ('CF2','CF3') AND material_price_group_code = '03' THEN '1'
        WHEN material_type_code = 'ZFGC' AND coffee_channel_code IN ('CH4') AND coffee_format_code IN ('CF2','CF4') AND material_price_group_code = '03' THEN '1'
        WHEN material_type_code = 'ZFGC' AND coffee_channel_code IN ('CH6') AND coffee_format_code IN ('CF4') AND material_price_group_code = '03' THEN '1'
        WHEN material_type_code = 'ZFGC' THEN '0'
        WHEN pack_type_code IN ('TNK','BIB','BRL','KEG') AND material_price_group_code = '03' THEN '1'
        WHEN (pack_size_code = 'ZZ' AND pack_type_code ='OTH') AND material_price_group_code = '04' THEN '1'
        WHEN (product_hierarchy_l4_code = '01010012137' OR brand_code= 'CN3') AND pack_size_gram_ml_unified = 250 AND material_price_group_code = '03' THEN '1'
        WHEN (product_hierarchy_l4_code = '01010012137' OR brand_code= 'CN3') AND pack_size_gram_ml_unified = 800 AND material_price_group_code = '04' THEN '1'
        WHEN product_hierarchy_l4_code = '01010022145' AND pack_size_gram_ml_unified <= 99 AND material_price_group_code = '03' THEN '1'
        WHEN product_hierarchy_l4_code = '01010022145' AND pack_size_gram_ml_unified > 99 AND material_price_group_code = '04' THEN '1'
        WHEN product_hierarchy_l4_code = '01010022133' AND pack_size_gram_ml_unified <= 500 AND material_price_group_code = '03' THEN '1'
        WHEN product_hierarchy_l4_code = '01010022133' AND pack_size_gram_ml_unified > 500 AND material_price_group_code = '04' THEN '1'
        WHEN product_hierarchy_l4_code = '01010012083' AND material_price_group_code = '04' THEN '1'
        WHEN product_hierarchy_l4_code = '01030052329'AND pack_size_gram_ml_unified <= 100 AND material_price_group_code = '03' THEN '1'
        WHEN product_hierarchy_l4_code = '01030052329' AND pack_size_gram_ml_unified > 100 AND material_price_group_code = '04' THEN '1'
        ELSE '0' END"

  - kind: select
    name: select_RPCONF_252_1_final
    context_name: add_RPCONF_252_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        material_price_group_code: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

