        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: select_dpp_leo_scope
    params:
      - column: country_code_for_join
        expression: "CASE WHEN country_code = 'IE' THEN 'GB' ELSE country_code END"

  - kind: add
    name: add_dps_soc_pf
    context_name: add_sales_org_code
    params:
      - column: sales_org_code_prefix_for_join
        expression: "SUBSTR(sales_org_code_for_join,1,2)"
      - column: country_code_for_join
        expression: "CASE WHEN country_code = 'IE' THEN 'GB' ELSE country_code END" 

