#SELECT RPCONF_15_1
  - kind: select
    name: select_RPCONF_15_1
    context_name: join_15_1_final
    params:
      columns:
        material_code: material_code
        material_description: material_description
        material_type_code: material_type_code
        ean_code: ean_code
        ean_code_b: ean_code_b
        coffee_channel_code: coffee_channel_code
        count_conversion_factor_b: conversion_factor_b
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RPCONF_15_1
    context_name: select_RPCONF_15_1
    params:
      - column: rule_code
        expression: "'RPCONF_15.1'"
      - column: plant_code
        expression: "''"
      - column: sales_org_code
        expression: "''"
      - column: check_status
        expression: "CASE WHEN material_description LIKE '%ABP%' OR ean_code IS NULL OR ean_code = '' OR ean_code_b IS NULL OR ean_code_b = '' THEN '' WHEN (material_type_code IN ('ZFG','ZFGS') OR (material_type_code IN ('ZFGC') AND coffee_channel_code != 'CH4')) AND conversion_factor_b = 1 THEN '1' WHEN (material_type_code IN ('ZFG','ZFGS') OR (material_type_code IN ('ZFGC') AND coffee_channel_code != 'CH4')) AND conversion_factor_b > 1 THEN '0' ELSE '' END"

  - kind: select
    name: select_RPCONF_15_1_final
    context_name: add_RPCONF_15_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        ean_code_b: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

