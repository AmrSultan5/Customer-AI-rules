#SELECT RPCONF_161_2
  - kind: select
    name: select_RPCONF_161_2
    context_name: join_dpg_dpso_ban
    params:
      columns:
        material_code_ban: material_code
        material_type_code_dpg2: material_type_code
        material_group_code_ban: material_group_code_ban
        ban_code_ban: ban_code
        bpp_code_dpg2: bpp_code_a
        bpp_code_ban: bpp_code_b
        sap_cluster_ban: sap_cluster
        sales_org_code_dpso_ban: sales_org_code
        country_code_dpso_ban: country_code
        product_hierarchy_code_ban: product_hierarchy_code_ban
        product_hierarchy_code_sku: product_hierarchy_code_sku
        brand_code_ban: brand_code_ban
        brand_code_sku: brand_code_sku
        flavour_code_ban: flavour_code_ban
        flavour_code_sku: flavour_code_sku
        pack_type_code_ban: pack_type_code_ban
        pack_type_code_sku: pack_type_code_sku
        pack_size_code_ban: pack_size_code_ban
        pack_size_code_sku: pack_size_code_sku
        sales_unit_code_ban: sales_unit_code_ban
        sales_unit_code_sku: sales_unit_code_sku 
      distinct: true

  - kind: add
    name: add_RPCONF_161_2
    context_name: select_RPCONF_161_2
    params:
      - column: rule_code
        expression: "'RPCONF_161.2'"
      - column: plant_code
        expression: "''"
      - column: check_status
        expression: "
    CASE 
    WHEN
        ban_code IS NULL OR ban_code = '' OR 
        product_hierarchy_code_ban IS NULL OR product_hierarchy_code_ban = '' OR
        product_hierarchy_code_sku IS NULL OR product_hierarchy_code_sku = '' OR
        brand_code_ban IS NULL OR brand_code_ban = '' OR
        brand_code_sku IS NULL OR brand_code_sku = '' OR
        flavour_code_ban IS NULL OR flavour_code_ban = '' OR
        flavour_code_sku IS NULL OR flavour_code_sku = '' OR
        pack_type_code_ban IS NULL OR pack_type_code_ban = '' OR
        pack_type_code_sku IS NULL OR pack_type_code_sku = '' OR
        pack_size_code_ban IS NULL OR pack_size_code_ban = '' OR
        pack_size_code_sku IS NULL OR pack_size_code_sku = '' OR
        sales_unit_code_ban IS NULL OR sales_unit_code_ban = '' OR
        sales_unit_code_sku IS NULL OR sales_unit_code_sku = '' OR
        bpp_code_a IS NULL OR bpp_code_a = 0 OR
        bpp_code_b IS NULL OR bpp_code_b = 0 OR
        material_type_code NOT IN ('ZFG','ZFGS','ZFGC','ZFGA','ZFGM') OR
        brand_code_ban IN ('ZV7','ZYU','ZYV','Z88','Z99') OR
        material_group_code_ban != '1110000' 
    THEN ''
    WHEN material_type_code IN('ZFG', 'ZFGS', 'ZFGA', 'ZFGM', 'ZFGC') AND
        (product_hierarchy_code_ban = product_hierarchy_code_sku AND 
        brand_code_ban = brand_code_sku AND 
        flavour_code_ban = flavour_code_sku AND
        pack_type_code_ban = pack_type_code_sku AND
        pack_size_code_ban = pack_size_code_sku AND
        sales_unit_code_ban = sales_unit_code_sku AND
        bpp_code_a = bpp_code_b
        )
    THEN '1'
    WHEN material_type_code IN('ZFG', 'ZFGS', 'ZFGA', 'ZFGM', 'ZFGC') AND
        (product_hierarchy_code_ban != product_hierarchy_code_sku OR 
        brand_code_ban != brand_code_sku OR 
        flavour_code_ban != flavour_code_sku OR
        pack_type_code_ban != pack_type_code_sku OR
        pack_size_code_ban != pack_size_code_sku OR
        sales_unit_code_ban != sales_unit_code_sku OR
        bpp_code_a != bpp_code_b
        )
    THEN '0'    
    ELSE '' END"

