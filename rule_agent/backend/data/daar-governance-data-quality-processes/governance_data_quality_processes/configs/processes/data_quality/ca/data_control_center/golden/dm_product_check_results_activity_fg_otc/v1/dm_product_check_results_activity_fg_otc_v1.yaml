#Final check status
  - kind: add
    name: add_check_status
    params:
      - column: product_document_last_date
        expression: IF(product_document_check='1', max_posting_date, null)    
      - column: check_status
        expression: /*1.1*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '', '1',
                    /*1.2*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '1', '1',
                    /*1.3*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '0', '1',
                    /*2.1*/if(plant_status_check = '99 only' AND sales_status_check = '1' AND plan_check = '1', '1',
                    /*2.2*/if(plant_status_check = '99 only' AND sales_status_check = '1' AND plan_check = '0', '1',
                    /*2.3*/if(plant_status_check = 'at least one ZA' AND plan_check = '1', '1',
                    /*2.4*/if(plant_status_check = 'at least one ZA' AND plan_check = '0', '1',
                    /*3.1*/if((sales_check = '1' OR product_document_check = '1' OR purchase_order_check = '1' OR production_order_check = '1' OR delivery_document_flag = '1' OR sales_order_flag = '1' OR billing_document_flag = '1') AND stock_check = '1' AND plan_check = '1', '1',
                    /*3.2*/if((sales_check = '1' OR product_document_check = '1' OR purchase_order_check = '1' OR production_order_check = '1' OR delivery_document_flag = '1' OR sales_order_flag = '1' OR billing_document_flag = '1') AND stock_check = '0' AND plan_check = '1', '1',
                    /*3.3*/if((sales_check = '0' AND product_document_check = '0' AND purchase_order_check = '0' AND production_order_check = '0' AND delivery_document_flag = '0' AND sales_order_flag = '0' AND billing_document_flag = '0') AND stock_check = '1' AND plan_check = '0', '1',
                    /*3.4*/if((sales_check = '0' AND product_document_check = '0' AND purchase_order_check = '0' AND production_order_check = '0' AND delivery_document_flag = '0' AND sales_order_flag = '0' AND billing_document_flag = '') AND stock_check = '0' AND plan_check = '0', '1',
                    /*4*/if(bom_check = '1', '1',
                    /*5*/if(material_code_pl IS NULL OR material_code_pl = '', '0',
                    /*6*/if(creation_date_check = '1', '1', /*6*/ '0'))))))))))))))        
      - column: message
        expression: /*1.1*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '', 'Inactive Material - Properly Blocked',
                    /*1.2*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '1', 'Inactive Material - Fully blocked but available in Listings',
                    /*1.3*/if(plant_status_check = '99 only' AND sales_status_check = '0' AND listing_check = '0', 'Inactive Material - Properly Blocked',
                    /*2.1*/if(plant_status_check = '99 only' AND sales_status_check = '1' AND plan_check = '1', 'Material is not fully blocked and planned for future Production',
                    /*2.2*/if(plant_status_check = '99 only' AND sales_status_check = '1' AND plan_check = '0', 'Material is not fully blocked and NO plan for future Production',
                    /*2.3*/if(plant_status_check = 'at least one ZA' AND plan_check = '1', 'Material used for Planning and planned for future production',
                    /*2.4*/if(plant_status_check = 'at least one ZA' AND plan_check = '0', 'Material used for Planning and NO plan for future production',
                    /*3.1*/if((sales_check = '1' OR product_document_check = '1' OR purchase_order_check = '1' OR production_order_check = '1' OR delivery_document_flag = '1' OR sales_order_flag = '1' OR billing_document_flag = '1') AND stock_check = '1' AND plan_check = '1', 'Active Material - PYTD Sales order/Sales Docs/Purchase/Production/Billing/Delivering/Stock and planned for future production',
                    /*3.2*/if((sales_check = '1' OR product_document_check = '1' OR purchase_order_check = '1' OR production_order_check = '1' OR delivery_document_flag = '1' OR sales_order_flag = '1' OR billing_document_flag = '1') AND stock_check = '0' AND plan_check = '1', 'Active Material - PYTD Sales order/Sales Docs/Purchase/Production/Billing/Delivering/ NO Stock and Planned for future production',
                    /*3.3*/if((sales_check = '0' AND product_document_check = '0' AND purchase_order_check = '0' AND production_order_check = '0' AND delivery_document_flag = '0' AND sales_order_flag = '0' AND billing_document_flag = '0') AND stock_check = '1' AND plan_check = '0', 'Delisted with stock',
                    /*3.4*/if((sales_check = '0' AND product_document_check = '0' AND purchase_order_check = '0' AND production_order_check = '0' AND delivery_document_flag = '0' AND sales_order_flag = '0' AND billing_document_flag = '') AND stock_check = '0' AND plan_check = '0', 'Candidate for Blocking - No activity PYTD and stock, NO plan for future production',
                    /*4*/if(bom_check = '1', 'Active Material - component of BOM',
                    /*5*/if(material_code_pl IS NULL OR material_code_pl = '', 'Not extended on plant level',
                    /*6*/if(creation_date_check = '1', 'Newly Created Material', /*6*/ 'Inactive Material – Suggested for blocking'))))))))))))))
      
#final columns
  - kind: add
    name: add_columns
    params:
      - column: rule_code
        expression: '''RPACTI_1.3'''
      - column: sales_quantity_flag
        expression: if(sales_12m_qty = 0, '0', 
                    IF(sales_12m_qty > 0, '+X', 
                    IF(sales_12m_qty < 0, '-X', '')))
      - column: stock_in_country_flag
        expression: IF(stock_check = '1', 'X', '')
      - column: purchase_document_flag
        expression: IF(purchase_order_check = '1', 'X', '')
      - column: purchase_document_last_date
        expression: IF(purchase_order_check = '1', purchase_document_last_date, '')
      - column: production_order_flag
        expression: IF(production_order_check = '1', 'X', '')
      - column: production_order_last_date
        expression: IF(production_order_check = '1', production_document_last_date, '')
      - column: bom_number
        expression: IF(bom_check='1', bom_number_array,'')
      - column: bom_material_code
        expression: IF(bom_check_material_code = '1', material_code_array,'')        
      - column: bom_component_material_flag
        expression: IF(bom_check='1', 'X', '')
      - column: product_document_flag
        expression: IF(product_document_check = '1', 'X', '')
      - column: product_document_last_date
        expression: IF(product_document_check = '1', product_document_last_date, '')
      - column: sales_block_status
        expression: if(sales_status_check = '0', '03', '')
      - column: check_date
        expression: current_timestamp()
      - column: future_planning_flag
        expression: IF(future_plan_check = '1', 'X', '')
      - column: sales_order_flag_check
        expression: IF(sales_order_flag = '1', 'X', '')
      - column: sales_order_last_date_cast
        expression: CAST(date_format(to_date(left(sales_order_last_date,10),"yyyy-MM-dd"),"yyyy-MM-dd") AS timestamp)
      - column: sales_order_last_date
        expression: IF(sales_order_flag = '1', sales_order_last_date_cast, '')
        overwrite: true
      - column: sales_block_date
        expression: CAST(date_format(to_date(left(sales_block_date,10),"yyyy-MM-dd"),"yyyy-MM-dd") AS timestamp)
        overwrite: true
      - column: billing_document_flag_check
        expression: IF(billing_document_flag = '1', 'X', '')
      - column: billing_document_last_date_cast
        expression: CAST(date_format(to_date(left(billing_document_last_date,10),"yyyy-MM-dd"),"yyyy-MM-dd") AS timestamp)
      - column: billing_document_last_date
        expression: IF(billing_document_flag = '1', billing_document_last_date_cast, '')
        overwrite: true
      - column: delivery_document_flag_check
        expression: IF(delivery_document_flag = '1', 'X', '')
      - column: delivery_document_last_date_cast
        expression: CAST(date_format(to_date(left(delivery_document_last_date,10),"yyyy-MM-dd"),"yyyy-MM-dd") AS timestamp)
      - column: delivery_document_last_date
        expression: IF(delivery_document_flag = '1', delivery_document_last_date_cast, '')
        overwrite: true
      - column: first_order_flag
        expression: IF(sales_order_first_date IS NOT NULL, 'X', '')
      - column: future_production_flag
        expression: IF(future_production_check = '1', 'X', '')
      - column: listing_flag
        expression: IF(listing_check = '1' AND listing_flag_solc = '1', '+X', IF(listing_check = '1' AND exclusion_flag_solc = '1', '-X', ''))
      - column: user_manual_message
        expression: "''"

