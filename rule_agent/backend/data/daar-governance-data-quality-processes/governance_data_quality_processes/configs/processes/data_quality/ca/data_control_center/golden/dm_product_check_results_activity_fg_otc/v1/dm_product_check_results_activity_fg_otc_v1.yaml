transform:
  name: dm_product_check_results_activity_otc
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#read dm_product_plant
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant

  - kind: filter
    name: filter_dm_product_plant
    context_name: read_dm_product_plant
    params:
      - condition:
          country_code!='BSO' and cast(material_code as int) >= 3000 AND cast(material_code as int) <= 9999999

#1 Sales check

  - kind: select
    name: select_dm_product_plant_sales_check
    context_name: filter_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sales_12m_qty: sales_12m_qty
        stock_batch: stock_batch
        sap_cluster: sap_cluster
      distinct: true

############################################1. Sales check (dm_product_plant) ###############################

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_not_empty
        expression: IF(stock_batch='', null, stock_batch)

  - kind: group
    name: group_dm_product_plant_sales_check
    params:
      - aggs:
          sales_12m_qty: sum
          stock_batch_not_empty: collect_set
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_sales_check_sort_set
    params:
      - column: stock_batch_not_empty_sorted_array
        expression: sort_array(collect_set_stock_batch_not_empty)

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_array_concat
        expression: concat_ws(',', stock_batch_not_empty_sorted_array)

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_array
        expression: IF(length(stock_batch_array_concat)<4001, stock_batch_array_concat, substr(stock_batch_array_concat,1,4000))

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: sales_check_with_null
        expression: if(sum_sales_12m_qty != '0', '1', '0')

  - kind: add
    name: add_dm_product_plant_sales_check_if_null
    params:
      - column: sales_check
        expression: "CASE WHEN(sales_check_with_null is null) THEN '0' ELSE sales_check_with_null END"

  - kind: select
    name: select_dm_product_plant_sales_check_final
    params:
      columns:
        material_code: material_code_pl
        country_code: country_code_pl
        sap_cluster: sap_cluster_pl
        sum_sales_12m_qty: sum_sales_12m_qty
        sales_check: sales_check
        stock_batch_array: stock_batch_array

#2 Stock check
  - kind: select
    name: select_dm_product_plant_stock_check
    context_name: filter_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        stock_batch: stock_batch
        stock_unrestricted_12m_qty: stock_unrestricted_12m_qty
        stock_blocked_quantity_12m_qty: stock_blocked_quantity_12m_qty
        stock_quality_inspection_12m_qty: stock_quality_inspection_12m_qty
        stock_vendor_12m_qty: stock_vendor_12m_qty
        stock_customer_unrestricted_use_12m_qty: stock_customer_unrestricted_use_12m_qty
        stock_supplier_quantity: stock_supplier_quantity
        stock_in_transit_quantity: stock_in_transit_quantity
        stock_in_transfer_quantity: stock_in_transfer_quantity
        stock_vendor_flag: stock_vendor_flag
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dm_product_plant_stock_check
    params:
      - aggs:
          stock_batch: max
          stock_unrestricted_12m_qty: sum
          stock_blocked_quantity_12m_qty: sum
          stock_quality_inspection_12m_qty: sum
          stock_vendor_12m_qty: sum
          stock_customer_unrestricted_use_12m_qty: sum
          stock_supplier_quantity: sum
          stock_in_transit_quantity: sum
          stock_in_transfer_quantity: sum
          stock_vendor_flag: max
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_stock_check
    params:
      - column: stock_check
        expression: if(ifnull(sum_stock_blocked_quantity_12m_qty, 0) + ifnull(sum_stock_quality_inspection_12m_qty, 0) 
                    + ifnull(sum_stock_vendor_12m_qty, 0) + ifnull(sum_stock_unrestricted_12m_qty, 0) + ifnull(sum_stock_customer_unrestricted_use_12m_qty, 0)  + ifnull(sum_stock_supplier_quantity, 0) + ifnull(sum_stock_in_transit_quantity, 0) + ifnull(sum_stock_in_transfer_quantity, 0) > 0 or ifnull(max_stock_batch, null) != '', '1', '0')

  - kind: select
    name: select_dm_product_plant_stock_check_final
    params:
      columns:
        material_code: material_code_ppl
        country_code: country_code_ppl
        sap_cluster: sap_cluster_ppl
        max_stock_batch: stock_batch
        sum_stock_unrestricted_12m_qty: stock_unrestricted_12m_qty
        sum_stock_blocked_quantity_12m_qty: stock_blocked_quantity_12m_qty
        sum_stock_quality_inspection_12m_qty: stock_quality_inspection_12m_qty
        sum_stock_vendor_12m_qty: stock_vendor_12m_qty
        sum_stock_customer_unrestricted_use_12m_qty: stock_customer_unrestricted_use_12m_qty
        sum_stock_supplier_quantity: stock_supplier_quantity
        sum_stock_in_transit_quantity: stock_in_transit_quantity
        sum_stock_in_transfer_quantity: stock_in_transfer_quantity
        max_stock_vendor_flag: stock_vendor_flag
        stock_check: stock_check
      distinct: true

#read dm_product_documents
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_documents
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_documents

  - kind: filter
    name: filter_dm_product_documents
    context_name: read_dm_product_documents
    params:
      - condition:
          date_format(posting_date,'yyyy-MM-dd') >= (date_format(add_months(current_date(), -12),'yyyy-MM-dd'))

#3 Sales document check
  - kind: select
    name: select_dm_product_documents_sales_document_check
    params:
      columns:
        material_code: material_code_doc
        country_code: country_code_doc
        sap_cluster: sap_cluster_doc
        posting_date: posting_date
      distinct: true

  - kind: group
    name: group_dm_product_documents_sales_document_check
    params:
      - aggs:
          posting_date: max
        by:
        - material_code_doc
        - country_code_doc
        - sap_cluster_doc

  - kind: add
    name: add_dm_product_documents_sales_document_check
    params:
      - column: product_document_check
        expression: "CASE WHEN(material_code_doc is null) THEN '0' ELSE '1' END"

  - kind: select
    name: select_dm_product_documents_sales_document_check_final
    params:
      columns:
        material_code_doc: material_code_doc
        country_code_doc: country_code_doc
        sap_cluster_doc: sap_cluster_doc
        product_document_check: product_document_check
        max_posting_date: max_posting_date
      distinct: true

#read dm_bill_of_material
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_bill_of_material
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_bill_of_material

  - kind: filter
    name: filter_dm_bill_of_material_pre_plant
    context_name: read_dm_bill_of_material
    params:
      - condition:
          (bom_item_link_deletion_flag = '' or bom_item_link_deletion_flag is null) and bom_material_status = '1' and (bom_deletion_flag IS NULL or bom_deletion_flag = '') and (bom_deletion_indicator IS NULL or bom_deletion_indicator = '')

# exclude all materials with plant block 99 from dm_product_plant
  - kind: filter
    name: filter_material_status_code
    context_name: read_dm_product_plant
    params:
      - condition:
          material_status_code!='99'

  - kind: select
    name: select_dm_product_plant_bom_check
    context_name: filter_material_status_code
    params:
      columns:
        material_code: material_code_pl
        material_status_code: material_status_code_pl
        plant_code: plant_code_pl
        sap_cluster: sap_cluster_pl
      distinct: true

#Inner join filtered product plant with bom material to exclude the same from the BOM check.
  - kind: join
    name: filter_dm_bill_of_material
    context_name: filter_dm_bill_of_material_pre_plant
    params:
      - other:
          select_dm_product_plant_bom_check
        how:
          inner
        columns:
          material_code: material_code_pl
          plant_code: plant_code_pl
          sap_cluster: sap_cluster_pl

#4 BOM check
  - kind: select
    name: select_dm_bill_of_material_bom_check
    context_name: filter_dm_bill_of_material
    params:
      columns:
        bom_component_material_number: bom_component_material_number
        country_code: country_code
        sap_cluster: sap_cluster
        bom_item_link_deletion_flag : bom_item_link_deletion_flag
        bom_deletion_flag: bom_deletion_flag
        bom_deletion_indicator: bom_deletion_indicator
        bom_number: bom_number
        bom_material_status: bom_material_status 
        material_code: material_code
      distinct: true

  - kind: add
    name: add_bom_number_trim
    params:
      - column: bom_number_trim
        expression: ltrim('0',bom_number)

  - kind: group
    name: group_dm_bill_of_material_bom_check
    params:
      - aggs:
          bom_item_link_deletion_flag : min
          bom_deletion_flag: min 
          bom_deletion_indicator: min
          bom_number_trim: collect_set
        by:
        - bom_component_material_number
        - bom_material_status 
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_bill_of_material_bom_check_sort_set
    params:
      - column: bom_number_sorted_array
        expression: sort_array(collect_set_bom_number_trim)

  - kind: add
    name: add_dm_bill_of_material_bom_check
    params:
      - column: bom_number_array_concat
        expression: concat_ws(',', bom_number_sorted_array)

  - kind: add
    name: add_dm_bill_of_material_bom_check
    params:
      - column: bom_number_array
        expression: IF(length(bom_number_array_concat)<4001, bom_number_array_concat, substr(bom_number_array_concat,1,4000))

  - kind: add
    name: add_dm_bill_of_material_bom_check
    params:
      - column: bom_check_with_null
        expression: "CASE WHEN((min_bom_item_link_deletion_flag = '' or min_bom_item_link_deletion_flag is null) AND bom_material_status = '1' and (min_bom_deletion_flag IS NULL or min_bom_deletion_flag = '') and (min_bom_deletion_indicator IS NULL or min_bom_deletion_indicator = '')) THEN '1' ELSE '0' END"

  - kind: select
    name: select_dm_bill_of_material_bom_check
    params:
      columns:
        bom_component_material_number: bom_component_material_number
        country_code: country_code
        sap_cluster: sap_cluster
        bom_check_with_null : bom_check_with_null 
        bom_number_array: bom_number_array
        bom_material_status: bom_material_status
      distinct: true

  - kind: add
    name: add_dm_bill_of_material_bom_check_if_null
    params:
      - column: bom_check
        expression: "CASE WHEN(bom_check_with_null is null) THEN '0' ELSE bom_check_with_null END"

  - kind: select
    name: select_dm_bill_of_material_bom_check_material_code
    context_name: filter_dm_bill_of_material
    params:
      columns:
        bom_component_material_number: bom_component_material_number
        country_code: country_code
        sap_cluster: sap_cluster
        bom_item_link_deletion_flag : bom_item_link_deletion_flag 
        bom_deletion_flag: bom_deletion_flag
        bom_deletion_indicator: bom_deletion_indicator
        bom_number: bom_number
        bom_material_status: bom_material_status 
        material_code: material_code
      distinct: true

  - kind: add
    name: add_material_code_trim
    context_name: select_dm_bill_of_material_bom_check_material_code
    params:
      - column: material_code_trim
        expression: ltrim('0',material_code)

  - kind: group
    name: group_dm_bill_of_material_material_code
    context_name: add_material_code_trim
    params:
      - aggs:
          bom_item_link_deletion_flag : min
          bom_deletion_flag: min 
          bom_deletion_indicator: min
          material_code_trim: collect_set
        by:
        - bom_component_material_number 
        - bom_material_status
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_bill_of_material_check_material_code_sort_set
    params:
      - column: material_code_sorted_array
        expression: sort_array(collect_set_material_code_trim)

  - kind: add
    name: add_dm_bill_of_material_check_material_code
    params:
      - column: material_code_array_concat
        expression: concat_ws(',', material_code_sorted_array)

  - kind: add
    name: add_dm_bill_of_material_check_material_code
    params:
      - column: material_code_array
        expression: IF(length(material_code_array_concat)<4001, material_code_array_concat, substr(material_code_array_concat,1,4000))

  - kind: add
    name: add_dm_bill_of_material_check_material_code
    params:
      - column: check_material_code_with_null
        expression: "CASE WHEN((min_bom_item_link_deletion_flag = '' or min_bom_item_link_deletion_flag is null) AND bom_material_status = '1' and (min_bom_deletion_flag IS NULL or min_bom_deletion_flag = '') and (min_bom_deletion_indicator IS NULL or min_bom_deletion_indicator = '')) THEN '1' ELSE '0' END"

  - kind: select
    name: select_dm_bill_of_material_check_material_code
    params:
      columns:
        bom_component_material_number: bom_component_material_number
        country_code: country_code
        sap_cluster: sap_cluster
        check_material_code_with_null : check_material_code_with_null 
        material_code_array: material_code_array
        bom_material_status: bom_material_status
      distinct: true

  - kind: join
    name: join_dm_bill_of_material_check_material_code_universe
    context_name: add_dm_bill_of_material_bom_check_if_null
    params:
      - other:
          select_dm_bill_of_material_check_material_code
        how:
          left
        columns:
          country_code: country_code
          bom_component_material_number: bom_component_material_number 
          bom_material_status: bom_material_status
          sap_cluster: sap_cluster

  - kind: add
    name: add_dm_bill_of_material_check_material_code_if_null
    params:
      - column: bom_check_material_code
        expression: "CASE WHEN(check_material_code_with_null is null) THEN '0' ELSE check_material_code_with_null END"

  - kind: select
    name: select_dm_bill_of_material_bom_check_final
    params:
      columns:
        country_code: country_code_bom
        bom_component_material_number: bom_component_material_number
        bom_check: bom_check
        bom_number_array: bom_number_array
        bom_check_material_code: bom_check_material_code
        material_code_array: material_code_array
        sap_cluster: sap_cluster_bom
      distinct: true

#read dm_purchase_orders
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_purchase_orders
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_purchase_orders

  - kind: filter
    name: filter_dm_purchase_orders
    context_name: read_dm_purchase_orders
    params:
      - condition:
          date_format(purchase_document_date,'yyyy-MM-dd') >= (date_format(add_months(current_date(), -12),'yyyy-MM-dd'))

#5 Purchase Orders check
  - kind: select
    name: select_dm_purchase_orders_production_orders_check
    params:
      columns:
        material_code: material_code_po
        country_code: country_code_po
        sap_cluster: sap_cluster_po
        purchase_document_date: purchase_document_date
      distinct: true

  - kind: group
    name: group_dm_purchase_orders_production_orders_check
    params:
      - aggs:
          purchase_document_date: max
        by:
        - material_code_po
        - country_code_po
        - sap_cluster_po

  - kind: add
    name: add_dm_purchase_orders_production_orders_check
    params:
      - column: purchase_order_check 
        expression: "CASE WHEN(material_code_po is null) THEN '0' ELSE '1' END"

  - kind: select
    name: select_dm_purchase_orders_production_orders_check_final
    params:
      columns:
        material_code_po: material_code_po
        country_code_po: country_code_po
        sap_cluster_po: sap_cluster_po
        purchase_order_check: purchase_order_check
        max_purchase_document_date: purchase_document_last_date
      distinct: true

#read dm_production_orders
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_production_orders
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_production_orders

#6 Production orders check

  - kind: filter
    name: filter_dm_production_orders
    context_name: read_dm_production_orders
    params:
      - condition:
          date_format(delivery_finish_date,'yyyy-MM-dd') >= date_format(add_months(current_date(), -12),'yyyy-MM-dd')

  - kind: select
    name: select_dm_production_orders_check
    params:
      columns:
        material_code: material_code_o
        country_code: country_code_o
        sap_cluster: sap_cluster_o
        delivery_finish_date: finish_date
      distinct: true

  - kind: group
    name: group_dm_production_orders_check
    params:
      - aggs:
          finish_date: max
        by:
        - material_code_o
        - country_code_o
        - sap_cluster_o

  - kind: add
    name: add_dm_production_orders_check
    params:
      - column: production_order_check  
        expression: "CASE WHEN(material_code_o is null) THEN '0' ELSE '1' END"

  - kind: select
    name: select_dm_production_orders_check_final
    params:
      columns:
        material_code_o: material_code_o
        country_code_o: country_code_o
        sap_cluster_o: sap_cluster_o
        production_order_check: production_order_check
        max_finish_date: production_document_last_date
      distinct: true

#read dm_product_general
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general

  - kind: filter
    name: filter_dm_product_general
    context_name: read_dm_product_general
    params:
      - condition:
          cast(material_code as int) >= 3000 AND cast(material_code as int) <= 9999999 and material_group_code != '111000'

#read dm_product_sales_organization
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

  - kind: filter
    name: filter_dm_product_sales_organization
    context_name: read_dm_product_sales_organization
    params:
      - condition:
          country_code!= 'BSO' and cast(material_code as int) >= 3000 AND cast(material_code as int) <= 9999999 #and distribution_channel_code = '01'

  - kind: filter
    name: filter_dm_product_sales_organization_01
    context_name: filter_dm_product_sales_organization
    params:
      - condition:
          distribution_channel_code = '01'

#7 Creation date check

  - kind: select
    name: select_dm_product_general_creation_date_check
    context_name: filter_dm_product_general
    params:
      columns:
        material_code: material_code
        creation_date: creation_date 
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_product_sales_organization_creation_date_check_ext_date
    context_name: filter_dm_product_sales_organization_01
    params:
      columns:
        country_code: country_code
        material_code: material_code
        sales_extension_date: sales_extension_date
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dm_product_sales_organization_creation_date_check
    params:
      - aggs:
          sales_extension_date: max
        by:
        - country_code
        - material_code
        - sap_cluster

  - kind: join
    name: join_dm_product_sales_organization_general_creation_date_check
    context_name: group_dm_product_sales_organization_creation_date_check
    params:
      - other:
          select_dm_product_general_creation_date_check
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_dm_product_general_creation_date_check
    params:
      - column: creation_date_check_with_null
        expression: "CASE WHEN(to_date(creation_date) >= date_add(to_date(current_date()), -182) and max_sales_extension_date is null) OR (to_date(max_sales_extension_date) >= date_add(to_date(current_date()), -182)) THEN '1' ELSE '0' END"
  
  - kind: add
    name: add_dm_product_general_creation_date_check_if_null
    params:
      - column: creation_date_check
        expression: "CASE WHEN(creation_date_check_with_null is null) THEN '0' ELSE creation_date_check_with_null END"

  - kind: select
    name: select_dm_product_general_creation_date_check_final
    params:
      columns:
