#8 Plant status check

  - kind: select
    name: select_dm_product_plant_status_check_za
    context_name: filter_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_status_code: material_status_code_org
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dm_product_plant_matarial_status_code
    params:
      - column: material_status_code 
        expression: IF(material_status_code_org = '02', '', material_status_code_org)

  - kind: add
    name: add_dm_product_plant_status_check_if
    params:
      - column: plant_status_check_za 
        expression: IF(material_status_code='ZA', 1, 0)
      - column: plant_status_check_97 
        expression: IF(material_status_code='97', 1, 0)
      - column: plant_status_check_98 
        expression: IF(material_status_code='98', 1, 0)
      - column: plant_status_check_99 
        expression: IF(material_status_code='99', 1, 0)   
      - column: plant_status_check_99_s
        expression: IF(material_status_code='99', 1, 0)           
      - column: plant_status_check_not_99 
        expression: IF(material_status_code!='99', 1, 0)  
      - column: plant_status_check_null
        expression: IF(material_status_code is null or material_status_code='', 1, 0)                                     
      - column: plant_status_check_null_not_98
        expression: IF(material_status_code!='98' and (material_status_code is null or material_status_code=''), 1, 0)  
      - column: plant_status_all
        expression: CAST(1 as INT)                                

  - kind: group
    name: group_dm_product_plant_status_check
    params:
      - aggs:
          plant_status_check_za: max
          plant_status_check_97: max
          plant_status_check_98: max
          plant_status_check_99: max
          plant_status_check_99_s: sum
          plant_status_check_not_99: max
          plant_status_check_null_not_98: sum
          plant_status_check_null: sum
          plant_status_all: sum
        by:
        - material_code
        - country_code
        - sap_cluster


  - kind: add
    name: add_dm_product_plant_status_check
    params:
      - column: plant_status_check
        expression: "CASE WHEN(max_plant_status_check_za = 1) THEN 'at least one ZA' WHEN (max_plant_status_check_97 = 1) THEN 'at least one 97' WHEN (max_plant_status_check_98 = 1 and sum_plant_status_check_null_not_98 = 0) THEN 'at least one 98' WHEN sum_plant_status_check_99_s = sum_plant_status_all THEN '99 only' WHEN max_plant_status_check_99 = 1 AND max_plant_status_check_not_99 = 1 THEN 'at least one 99' WHEN sum_plant_status_check_null = sum_plant_status_all THEN 'no blocks' ELSE 'some blocks' END"

  - kind: select
    name: select_dm_product_plant_status_check_final
    params:
      columns:
        material_code: material_code_pppl
        country_code: country_code_pppl
        sap_cluster: sap_cluster_pppl
        plant_status_check: plant_status_check
      distinct: true

#9 Sales status check

  - kind: select
    name: select_dm_product_sales_organization_sales_status_check
    context_name: filter_dm_product_sales_organization_01
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_status_code: material_status_code
        distribution_channel_code: distribution_channel_code
        material_sales_valid_from: material_sales_valid_from
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_material_status_code
    params:
      - column: material_status_code_03_check
        expression: "CASE WHEN(material_status_code='03') THEN 1 ELSE 0 END"
      - column: material_status_code_all
        expression: CAST(1 AS INT)       

  - kind: group
    name: group_dm_product_sales_organization_sales_status_check
    params:
      - aggs:
          material_status_code_03_check: sum
          material_status_code_all: sum
          material_sales_valid_from: max
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_sales_organization_product_plant_sales_status_check
    params:
      - column: sales_status_check  
        expression: "CASE WHEN(sum_material_status_code_03_check = sum_material_status_code_all) THEN '0' ELSE '1' END"
      - column: material_sales_valid_from_final  
        expression: "CASE WHEN(sales_status_check='0') THEN max_material_sales_valid_from ELSE '' END"

  - kind: select
