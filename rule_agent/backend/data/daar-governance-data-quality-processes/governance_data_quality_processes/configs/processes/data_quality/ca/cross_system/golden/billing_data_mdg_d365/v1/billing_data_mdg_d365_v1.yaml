transform:
  name: Billing_data_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: select
      name: select_mdg_knvv
      context_name: read_mdg_knvv
      params:
        columns:
          KUNNR: PARTNER
          KVGR4: KVGR4
          vkorg: vkorg
          vtweg: vtweg
          spart: spart
          PERRL: PERRL
          KTGRD: KTGRD
          INCO1: INCO1
          INCO2: INCO2
          PRFRE: PRFRE
          ZTERM: ZTERM
          aufsd: aufsd
        distinct: true   

    - kind: filter
      name: filter_mdg_knvv
      context_name: select_mdg_knvv
      params:
        - condition: PARTNER like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and vtweg = '01' and spart = '01' and vkorg in (9600,1100,8600,4890,5500,5100,4500,3200,7900,1200,8090,2800,7800,6300,9200,3300,3100,2000,8200,9500,9400,6100,9100,2500,8500,4090,7200)

    - kind: add
      name: add_mdg_HASH
      context_name: filter_mdg_knvv
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,vkorg,vtweg,spart,PERRL,KTGRD,INCO1,INCO2,upper(PRFRE),ZTERM,aufsd))

    - kind: select
      name: mdg_
      context_name: add_mdg_HASH
      params:
        columns:
          PARTNER: PARTNER_mdg
          KVGR4: KVGR4_mdg
          vkorg: vkorg_mdg
          vtweg: vtweg_mdg
          spart: spart_mdg
          PERRL: PERRL_mdg
          KTGRD: KTGRD_mdg
          INCO1: INCO1_mdg
          INCO2: INCO2_mdg
          PRFRE: PRFRE_mdg
          ZTERM: ZTERM_mdg
          aufsd: aufsd_mdg
          HASH: hash_mdg
        distinct: true

    - kind: checkpoint
      name: mdg
      context_name: mdg_

        
####################################################################################################
    - kind: read_dataio
      name: read_d365_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1

    - kind: select
      name: optionsetmapping
      context_name: read_d365_optionsetmapping
      params:
        columns:
          cch_entityname: cch_entityname
          cch_attributename: cch_attributename
          cch_externalvalue: cch_externalvalue
          cch_optionsetvalue: cch_optionsetvalue
####################################################################################################

    - kind: filter
      name: filter_cch_invoicinglistdates
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_invoicinglistdates'

    - kind: add
      name: clean_cch_invoicinglistdates
      context_name: filter_cch_invoicinglistdates
      params:
      - column: sap_invoicinglistdates
        expression: trim(cch_externalvalue)
      - column: d365_invoicinglistdates
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_cch_invoicinglistdates
      context_name: clean_cch_invoicinglistdates
      params:
        columns:
          sap_invoicinglistdates: sap_invoicinglistdates
          d365_invoicinglistdates: d365_invoicinglistdates
        distinct: true
###################################################################
    - kind: filter
      name: filter_cch_accountassignmentgroup
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_accountassignmentgroup'


    - kind: add
      name: clean_cch_accountassignmentgroup
      context_name: filter_cch_accountassignmentgroup
      params:
      - column: sap_accountassignmentgroup
        expression: trim(cch_externalvalue)
      - column: d365_accountassignmentgroup
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_accountassignmentgroup
      context_name: clean_cch_accountassignmentgroup
      params:
        columns:
          sap_accountassignmentgroup: sap_accountassignmentgroup
          d365_accountassignmentgroup: d365_accountassignmentgroup
        distinct: true
###################################################################



    - kind: filter
      name: filter_cch_incoterms
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_incoterms'

    - kind: add
      name: clean_cch_incoterms
      context_name: filter_cch_incoterms
      params:
      - column: sap_incoterms
        expression: trim(cch_externalvalue)
      - column: d365_incoterms
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_cch_incoterms
      context_name: clean_cch_incoterms
      params:
        columns:
          sap_incoterms: sap_incoterms
          d365_incoterms: d365_incoterms
        distinct: true
###################################################################
    - kind: filter
      name: filter_paymenttermscode
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'paymenttermscode'


    - kind: add
      name: clean_paymenttermscode
      context_name: filter_paymenttermscode
      params:
      - column: sap_paymenttermscode
        expression: trim(cch_externalvalue)
      - column: d365_paymenttermscode
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_paymenttermscode
      context_name: clean_paymenttermscode
      params:
        columns:
          sap_paymenttermscode: sap_paymenttermscode
          d365_paymenttermscode: d365_paymenttermscode
        distinct: true
###################################################################

    - kind: filter
      name: filter_orderblockselectedsalesarea
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_orderblockselectedsalesarea'


    - kind: add
      name: clean_orderblockselectedsalesarea
      context_name: filter_orderblockselectedsalesarea
      params:
      - column: sap_orderblockselectedsalesarea
        expression: trim(cch_externalvalue)
      - column: d365_orderblockselectedsalesarea
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_orderblockselectedsalesarea
      context_name: clean_orderblockselectedsalesarea
      params:
        columns:
          sap_orderblockselectedsalesarea: sap_orderblockselectedsalesarea
          d365_orderblockselectedsalesarea: d365_orderblockselectedsalesarea
        distinct: true
###################################################################

    - kind: filter
      name: filter_distributionchannel
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'


    - kind: add
      name: clean_distributionchannel
      context_name: filter_distributionchannel
      params:
      - column: sap_distributionchannel
        expression: trim(cch_externalvalue)
      - column: d365_distributionchannel
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_distributionchannel
      context_name: clean_distributionchannel
      params:
        columns:
          sap_distributionchannel: sap_distributionchannel
          d365_distributionchannel: d365_distributionchannel
        distinct: true
###################################################################


    - kind: filter
      name: filter_division
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_division'


    - kind: add
      name: clean_division
      context_name: filter_division
      params:
      - column: sap_division
        expression: trim(cch_externalvalue)
      - column: d365_division
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_division
      context_name: clean_division
      params:
        columns:
          sap_division: sap_division
          d365_division: d365_division
        distinct: true
###################################################################

    - kind: filter
      name: filter_customergroup4code
      context_name: optionsetmapping
      params:
        - condition: statuscode = 1 and statecode = 0 and cch_entityname = 'account' and cch_attributename = 'cch_customergroup4code'

    - kind: add
      name: clean_customergroup4code
      context_name: filter_customergroup4code
      params:
      - column: sap_customergroup4code
        expression: trim(cch_externalvalue)
      - column: d365_customergroup4code
        expression: trim(cch_optionsetvalue)
        
    - kind: select
      name: select_customergroup4code
      context_name: clean_customergroup4code
      params:
        columns:
          sap_customergroup4code: sap_customergroup4code
          d365_customergroup4code: d365_customergroup4code
        distinct: true
###################################################################


    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1

    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true

        
        
####################################################################################################
    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1
  
    - kind: filter
      name: filter_d365_account
      context_name: read_d365_account
      params:
        - condition: cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')
  
    - kind: select
      name: select_d365_account
      context_name: filter_d365_account
      params:
        columns:        
          cch_sapid: cch_sapid
          cch_salesorganizationid: cch_salesorganizationid
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          cch_orderblockselectedsalesarea: cch_orderblockselectedsalesarea
          cch_invoicinglistdates: cch_invoicinglistdates
          cch_accountassignmentgroup: cch_accountassignmentgroup
          cch_incoterms: cch_incoterms
          cch_incotermspart2: cch_incotermspart2
          cch_pricedetermination: cch_pricedetermination
          paymenttermscode: paymenttermscode
          cch_custgrp4directindirect: cch_custgrp4directindirect
        distinct: true

  
    - kind: join
      name: join_d365
      context_name: select_d365_account
      params:
        - other:
            select_distributionchannel
          how:
            left
          columns:
            cch_distributionchannel: d365_distributionchannel
        - other:
            select_division
          how:
            left
          columns:
            cch_division: d365_division
        - other:
            select_customergroup4code
          how:
            left
          columns:
            cch_custgrp4directindirect: d365_customergroup4code
        - other:
            select_accountassignmentgroup
          how:
            left
          columns:
            cch_accountassignmentgroup: d365_accountassignmentgroup            
        - other:
            select_cch_incoterms
          how:
            left
          columns:
            cch_incoterms: d365_incoterms  
        - other:
            select_orderblockselectedsalesarea
          how:
            left
          columns:
            cch_orderblockselectedsalesarea: d365_orderblockselectedsalesarea            
        - other:
            select_paymenttermscode
          how:
            left
          columns:
            paymenttermscode: d365_paymenttermscode  
        - other:
            select_cch_invoicinglistdates
          how:
            left
          columns:
            cch_invoicinglistdates: d365_invoicinglistdates
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id

    - kind: select
      name: select_d365
      context_name: join_d365
      params:
        columns:        
          cch_sapid: cch_sapid
          territory_cch_sapid: territory_cch_sapid
          sap_distributionchannel: cch_distributionchannel
          sap_division: cch_division
          sap_orderblockselectedsalesarea: cch_orderblockselectedsalesarea_temp
          sap_invoicinglistdates: cch_invoicinglistdates_temp
          sap_accountassignmentgroup: cch_accountassignmentgroup_temp
          sap_incoterms: cch_incoterms_temp
          cch_incotermspart2: cch_incotermspart2_temp
          cch_pricedetermination: cch_pricedetermination_temp
          sap_paymenttermscode: paymenttermscode_temp
          sap_customergroup4code: cch_custgrp4directindirect
        distinct: true

    - kind: add
      name: add_d365_columns
      context_name: select_d365
      params:
        - column: cch_invoicinglistdates
          expression: COALESCE(cch_invoicinglistdates_temp,'')
        - column: cch_accountassignmentgroup
          expression: COALESCE(cch_accountassignmentgroup_temp,'')
        - column: cch_incoterms
          expression: COALESCE(cch_incoterms_temp,'')
        - column: cch_incotermspart2
          expression: COALESCE(cch_incotermspart2_temp,'')
        - column: cch_pricedetermination
          expression: upper(IF(coalesce(cast(cch_pricedetermination_temp as string),'') ='false','X',''))
        - column: paymenttermscode
          expression: COALESCE(paymenttermscode_temp,'')
        - column: cch_orderblockselectedsalesarea
          expression: trim(coalesce(cch_orderblockselectedsalesarea_temp,''))
        - column: hash_d365
          expression: md5(concat(coalesce(cch_sapid,''),coalesce(territory_cch_sapid,''),coalesce(cch_distributionchannel,''),coalesce(cch_division,''),coalesce(cch_invoicinglistdates_temp,''),coalesce(cch_accountassignmentgroup_temp,''),coalesce(cch_incoterms_temp,''),coalesce(cch_incotermspart2_temp,''),upper(IF(coalesce(cast(cch_pricedetermination_temp as string),'') ='false','X','')),coalesce(paymenttermscode_temp,''),trim(coalesce(cch_orderblockselectedsalesarea_temp,''))))

    - kind: filter
      name: filter_d365
      context_name: add_d365_columns
      params:
        - condition: sap_distributionchannel = '01' and sap_division = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)


    - kind: select
      name: d365_
      context_name: filter_d365
      params:
        columns:
          cch_sapid: PARTNER_d365
          cch_custgrp4directindirect: KVGR4_d365
          territory_cch_sapid: vkorg_d365
          cch_distributionchannel: vtweg_d365
          cch_division: spart_d365
          cch_invoicinglistdates: PERRL_d365
          cch_accountassignmentgroup: KTGRD_d365
          cch_incoterms: INCO1_d365
          cch_incotermspart2: INCO2_d365
          cch_pricedetermination: PRFRE_d365
          paymenttermscode: ZTERM_d365
          cch_orderblockselectedsalesarea: aufsd_d365
          hash_d365: HASH_d365
        distinct: true

    - kind: checkpoint
      name: d365
      context_name: d365_      
#############################################################

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            HASH_mdg: HASH_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_d365 is null or HASH_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          PARTNER_mdg: PARTNER_mdg
          KVGR4_mdg: KVGR4_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          PERRL_mdg: PERRL_mdg
          KTGRD_mdg: KTGRD_mdg
          INCO1_mdg: INCO1_mdg
          INCO2_mdg: INCO2_mdg
          PRFRE_mdg: PRFRE_mdg
          ZTERM_mdg: ZTERM_mdg
          aufsd_mdg: aufsd_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          PARTNER_d365: PARTNER_d365
          KVGR4_d365: KVGR4_d365
          vkorg_d365: vkorg_d365
          vtweg_d365: vtweg_d365
          spart_d365: spart_d365
          PERRL_d365: PERRL_d365
          KTGRD_d365: KTGRD_d365
          INCO1_d365: INCO1_d365
          INCO2_d365: INCO2_d365
          PRFRE_d365: PRFRE_d365
          ZTERM_d365: ZTERM_d365
          aufsd_d365: aufsd_d365
          HASH_d365: HASH_d365

###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_d365_select
          how:
            full
          columns:
            PARTNER_mdg: PARTNER_d365
            vkorg_mdg: vkorg_d365
            vtweg_mdg: vtweg_d365
            spart_mdg: spart_d365

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('d365' as string)
        - column: msg_mdg
          expression: CASE WHEN PARTNER_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_d365
          expression: CASE WHEN PARTNER_d365 IS NULL THEN 'data missing from d365' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          PARTNER_d365: partner
          vkorg_d365: VKORG
          vtweg_d365: VTWEG
          spart_d365: SPART
          KVGR4_d365: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

###data missing from d365

    - kind: filter
      name: join_data_missing_from_d365_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_d365 is null

    - kind: select
      name: final_data_missing_from_d365
      context_name: join_data_missing_from_d365_filter
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_d365: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##BILLING DATA: Invoice List Schedule
    - kind: filter
      name: billing_data_invoice_list_schedule_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND PERRL_d365 <> PERRL_mdg

    - kind: add
      name: add_missing_columns_billing_data_invoice_list_schedule
      context_name: billing_data_invoice_list_schedule_filter
      params:
        - column: attr_name_billing_data_invoice_list_schedule
          expression: CASE WHEN PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND PERRL_d365 <> PERRL_mdg THEN concat('BILLING DATA:',' Invoice List Schedule') END
        - column: msg_billing_data_invoice_list_schedule
          expression: CASE WHEN PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND PERRL_d365 <> PERRL_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_data_invoice_list_schedule
      context_name: add_missing_columns_billing_data_invoice_list_schedule
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_data_invoice_list_schedule: msg
          attr_name_billing_data_invoice_list_schedule: attr_name
          PERRL_d365: tgt_attr
          PERRL_mdg: src_attr

###BILLING DATA: Account Assignment Group---
    - kind: filter
      name: billing_data_account_assignment_group_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND KTGRD_d365 <> KTGRD_mdg

    - kind: add
      name: add_missing_columns_billing_data_account_assignment_group
      context_name: billing_data_account_assignment_group_filter
      params:
        - column: attr_name_billing_data_account_assignment_group
          expression: CASE WHEN PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND KTGRD_d365 <> KTGRD_mdg THEN concat('BILLING DATA:',' Account Assignment Group') END
        - column: msg_billing_data_account_assignment_group
          expression: CASE WHEN PARTNER_mdg = PARTNER_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND KTGRD_d365 <> KTGRD_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_data_account_assignment_group
      context_name: add_missing_columns_billing_data_account_assignment_group
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_data_account_assignment_group: msg
          attr_name_billing_data_account_assignment_group: attr_name
          KTGRD_d365: tgt_attr
