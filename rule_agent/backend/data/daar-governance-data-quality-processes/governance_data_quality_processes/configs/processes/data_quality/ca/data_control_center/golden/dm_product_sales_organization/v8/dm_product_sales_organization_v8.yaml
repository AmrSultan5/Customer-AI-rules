# Read CDHDR
  - kind: read_dataio
    name: read_cdhdr
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: cdhdr
      schema_version: v1

  - kind: filter
    name: filter_ch
    context_name: read_cdhdr
    params:
      - condition:
          objectclas = 'MATERIAL'

  - kind: select
    name: select_ch
    context_name: filter_ch
    params:
      columns:
        changenr: changenr_ch
        udate: udate_ch
        sap_cluster: sap_cluster_ch
      distinct: true

# Read CDPOS
  - kind: read_dataio
    name: read_cdpos
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: cdpos
      schema_version: v1

  - kind: filter
    name: filter_cp
    context_name: read_cdpos
    params:
      - condition:
          objectclas = 'MATERIAL' AND chngind = 'I' AND tabname = 'MVKE'

  - kind: select
    name: select_cp
    context_name: filter_cp
    params:
      columns:
        objectid: objectid_cp
        changenr: changenr_cp
        tabkey: tabkey_cp
        sap_cluster: sap_cluster_cp
      distinct: true

  - kind: join
    name: join_ch_cp
    context_name: select_cp
    params:
      - other:
          select_ch
        how:
          left
        columns:
          changenr_cp: changenr_ch
          sap_cluster_cp: sap_cluster_ch

  - kind: group
    name: group_ch_cp
    context_name: join_ch_cp
    params:
      - aggs:
          udate_ch: min
        by:
        - objectid_cp
        - tabkey_cp
        - sap_cluster_cp

  - kind: add
    name: add_cp
    context_name: group_ch_cp
    params:
      - column: clean_tabkey_cp
        expression: regexp_replace(tabkey_cp, ' ', '')
      - column: xyz_cp
        expression: CASE WHEN length(clean_tabkey_cp) >= 6
              THEN substring(clean_tabkey_cp, length(clean_tabkey_cp) - 5, 6)
              ELSE NULL END
      - column: x_cp
        expression: CASE WHEN xyz_cp IS NOT NULL THEN substring(xyz_cp, 1, 2) ELSE NULL END
      - column: y_cp
        expression: CASE WHEN xyz_cp IS NOT NULL THEN substring(xyz_cp, 3, 4) ELSE NULL END
      - column: z_cp
        expression: CASE WHEN xyz_cp IS NOT NULL THEN substring(xyz_cp, 5, 2) ELSE NULL END
      - column: concat_str_cp
        expression: concat('400', objectid_cp, xyz_cp)
      - column: tabkey_check_cp
        expression: if(clean_tabkey_cp = concat_str_cp, '1', '0')

  - kind: filter
    name: filter_cp_xyz
    context_name: add_cp
    params:
      - condition:
          (x_cp = '80' and  y_cp like '900%') or (x_cp != '80' and  y_cp like '000%') 

  - kind: select
    name: select_mvke
    context_name: add_mvke_data
    params:
      columns:
        matnr: matnr
        vkorg: vkorg
        kondm: kondm
        ktgrm: ktgrm
        mtpos: mtpos
        mvgr1: mvgr1
        mvgr2: mvgr2
        mvgr3: mvgr3
        mvgr4: mvgr4
        mvgr5: mvgr5
        prat1: prat1
        prodh: prodh
        vmsta: vmsta
        vmstd: vmstd
        vtweg: vtweg
        zz_kondm: zz_kondm
        zz_pckgr: zz_pckgr
        sap_cluster: sap_cluster
        is_basic_scope: is_basic_scope
        vkorg_substr: vkorg_substr
      distinct: true

  - kind: select
    name: select_tvm1t
    context_name: filter_tvm1t
    params:
      columns:
        mvgr1: mvgr1
        bezei: bezei_a1
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
