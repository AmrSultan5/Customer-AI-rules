    params:
      columns:
        matnr_lst: matnr_lst
        vkorg_lst: vkorg_lst
        sap_cluster_lst: sap_cluster_lst
      distinct: true

  - kind: select
    name: select_mvke_lst
    context_name: read_mvke
    params:
      columns:
        matnr: matnr_mvke
        vkorg: vkorg_mvke
        sap_cluster: sap_cluster_mvke
      distinct: true

  - kind: join
    name: join_mvke_lst
    context_name: select_mvke_lst
    params:
      - other:
          select_final_lst
        how:
          inner
        columns:
          matnr_mvke: matnr_lst
          vkorg_mvke: vkorg_lst
          sap_cluster_mvke: sap_cluster_lst

  - kind: add
    name: add_lst
    context_name: join_mvke_lst
    params:
      - column: lst
        expression: if(matnr_lst IS NOT NULL AND matnr_lst != '', '1', '0')

  - kind: group
    name: group_max_lst
    context_name: add_lst
    params:
      - aggs:
          lst: max
        by:
        - matnr_lst
        - vkorg_lst
        - sap_cluster_lst

