  - kind: add
    name: add_product_expressions
    params:
      - column: pack_size_uom_unified
        expression: case when bezei_a4 like '%2,4%' OR bezei_a4 = '43.8' OR bezei_a4 = '38.75' then 'G'
                    when bezei_a4 like '%Kilogram%' or bezei_a4 like '%KG%' OR bezei_a4 LIKE '%KILOGRAMS%' then 'KG'
                    when bezei_a4 like '%Gr%' OR bezei_a4 like '%grams%' OR bezei_a4 LIKE '%GRAMS%' OR bezei_a4 LIKE '%gr%' OR bezei_a4 LIKE '%GR%' then 'G'
                    when (bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%') and bezei_a4 like '0.%' then 'ML'
                    when bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%' then 'L'
                    else '-1' end
      - column: pack_size_volume_unified
        expression: case when bezei_a4 like '%2,4%' then '2.4'
                    when bezei_a4 = '43.8' then '43.8'
                    when bezei_a4 = '38.75' then '38.75'
                    when bezei_a4 like '%Kilogram%' or bezei_a4 like '%KG%' OR bezei_a4 LIKE '%KILOGRAMS%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    when bezei_a4 like '%Gr%' OR bezei_a4 LIKE '%grams%' OR bezei_a4 LIKE '%GRAMS%' OR bezei_a4 LIKE '%gr%' OR bezei_a4 LIKE '%GR%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    when (bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%') and bezei_a4 like '0.%' then string(1000 * double(regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)))
                    when bezei_a4 like '%Litre%' or bezei_a4 like '%Liter%' OR bezei_a4 LIKE '%litre%' OR bezei_a4 LIKE '%LITER%' OR bezei_a4 LIKE '%LITRE%' then regexp_extract(bezei_a4, '[0-9]+(?:[.][0-9]+)?', 0)
                    else '-1' end
      - column: product_hierarchy_level
        expression: case when length(prodh) = 2 then '1'
                    when length(prodh) = 4 then '2'
                    when length(prodh) = 7 then '3'
                    when length(prodh) = 11 then '4'
                    when length(prodh) = 15 then '5'
                    else null end
      - column: product_hierarchy_l1_code
        expression: if(length(prodh) >= 2, left(prodh, 2), '')
      - column: product_hierarchy_l2_code
        expression: if(length(prodh) >= 4, left(prodh, 4), '')
      - column: product_hierarchy_l3_code
        expression: if(length(prodh) >= 7, left(prodh, 7), '')
      - column: product_hierarchy_l4_code
        expression: if(length(prodh) >= 11, left(prodh, 11), '')
      - column: product_hierarchy_l5_code
        expression: if(length(prodh) >= 15, prodh, '')
      - column: max_lst
        expression: if(max_lst = '1', '1', '0')
        overwrite: true

