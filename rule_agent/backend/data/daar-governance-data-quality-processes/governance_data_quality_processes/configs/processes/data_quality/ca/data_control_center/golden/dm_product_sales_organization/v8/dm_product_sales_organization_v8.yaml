  - kind: add
    name: add_pack_size_gram_ml_unified
    params:
      - column: pack_size_gram_ml_unified
        expression: CASE WHEN pack_size_uom_unified ='L' THEN 1000 *(pack_size_volume_unified)
                    WHEN pack_size_uom_unified ='KG' THEN 1000 *(pack_size_volume_unified)
                    WHEN pack_size_uom_unified ='G' THEN pack_size_volume_unified
                    WHEN pack_size_uom_unified ='ML' THEN pack_size_volume_unified
                    ELSE pack_size_volume_unified END

