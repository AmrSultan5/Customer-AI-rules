    params:
      columns:
        kondm: kondm
        vtext: vtext_a6
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tptmt
    context_name: filter_tptmt
    params:
      columns:
        mtpos: mtpos
        bezei: bezei_a7
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvmst
    context_name: filter_tvmst
    params:
      columns:
        vmsta: vmsta
        vmstb: vmstb
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_tvkmt
    context_name: filter_tvkmt
    params:
      columns:
        ktgrm: ktgrm
        vtext: vtext_a9
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_t179t
    context_name: filter_t179t
    params:
      columns:
        prodh: prodh
        vtext: vtext_a10
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_cluster_config
    context_name: filter_cluster_config
    params:
      columns:
        sales_org: vkorg
        country_code: country_code
        cluster: sap_cluster
        eu_flag: eu_flag
      distinct: true

  - kind: select
    name: select_tvkot
    context_name: filter_tvkot
    params:
      columns:
        vkorg: vkorg
        vtext: vtext_a11
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_dp101_generic_demand_planning_tool_re
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: udm
        storage_id: '{{dataio.storage_id}}'
      domain: datamart
      namespace: ftd
      object_name: dp101_generic_demand_planning_tool_re
      schema_version: v1

  - kind: add
    name: add_sys_date
    params:
      - column: sys_date
        expression: CONCAT(YEAR(current_date()), '0', LPAD(MONTH(CURRENT_DATE()), 2, '0'))

  - kind: filter
    name: filter_pln
    params:
      - condition:
         fiscper >= sys_date AND fiscper <= add_months(sys_date, 12)

  - kind: add
    name: add_future_plan_12m_qty
    params:
      - column: future_plan_12m_qty
        expression: consensus_plan_uc + released_consensus_plan_uc + operational_abp_uc + last_months_re_uc + official_4re_uc + official_4re_phc

  - kind: group
    name: agg_future_plan_12m_qty
    params:
      - aggs:
          future_plan_12m_qty: sum
        by:
        - salesorg
        - material

  - kind: select
    name: select_pln
    params:
      columns:
        salesorg: salesorg
        material: material
        sum_future_plan_12m_qty: future_plan_12m_qty
      distinct: true

