transform:
  name: use_cases_summary
  operations:


#### UC11 #####
#read zg_partner_function_assignment

  - kind: read_dataio
    name: read_aggregated_history_uc11
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: zg_partner_function_assignment
      namespace: golden
      object_name: aggregated_history
      schema_version: v1

#total - UC11
  - kind: add
    name: add_domain_uc_code_kpi_type_uc11
    params:
      - column: domain
        expression: '''customer'''
      - column: uc_code
        expression: '''uc11'''
      - column: kpi_type
        expression: '''total'''
      - column: week_of_year
        expression: weekofyear(loading_date)
      - column: year_of_date
        expression: year(loading_date)


  - kind: select
    name: select_uc11_total
    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        total_checks: total_checks
        invalid_checks: invalid_checks
        week_of_year: week_of_year
        year_of_date: year_of_date

  - kind: group
    name: group_max_date
    params:
      - aggs:
          loading_date: max
        by:
        - week_of_year
        - year_of_date

  - kind: join
    name: join_group_max_date
    context_name: select_uc11_total
    params:
      - other:
          group_max_date
        how:
          inner
        columns:
          loading_date: max_loading_date

  - kind: group
    name: group_country_code_date
    params:
      - aggs:
          total_checks: sum
          invalid_checks: sum
        by:
        - country_code
        - loading_date
        - domain
        - uc_code
        - kpi_type

  - kind: select
    name: select_uc11_final
    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        sum_total_checks: total_checks
        sum_invalid_checks: invalid_checks
      distinct: true

