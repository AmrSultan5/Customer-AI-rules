    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        total_checks: total_checks
        failed_checks: invalid_checks
        week_of_year: week_of_year
        year_of_date: year_of_date

  - kind: group
    name: group_max_date
    params:
      - aggs:
          loading_date: max
        by:
        - week_of_year
        - year_of_date

  - kind: join
    name: join_group_max_date
    context_name: select_uc46_total
    params:
      - other:
          group_max_date
        how:
          inner
        columns:
          loading_date: max_loading_date

  - kind: group
    name: group_country_code_date
    params:
      - aggs:
          total_checks: sum
          invalid_checks: sum
        by:
        - country_code
        - loading_date
        - domain
        - uc_code
        - kpi_type

  - kind: select
    name: select_uc46_total_final
    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        sum_total_checks: total_checks
        sum_invalid_checks: invalid_checks
      distinct: true

