  ##UC03 Serving Indicators

  - kind: read_dataio
    name: read_uc03_serving_indicators
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: serving_indicators
      namespace: golden
      object_name: aggregated_history
      schema_version: v1

  - kind: add
    name: add_domain_uc_code_kpi_type_uc03
    params:
      - column: domain
        expression: '''product'''
      - column: uc_code
        expression: '''uc03'''
      - column: kpi_type
        expression: '''Total'''
      - column: week_of_year
        expression: weekofyear(loading_date)
      - column: year_of_date
        expression: year(loading_date)
      - column: country_code
        expression: cast(NULL as string)


  - kind: select
    name: select_uc03_total
    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        total_checks: total_checks
        invalid_checks: invalid_checks
        week_of_year: week_of_year
        year_of_date: year_of_date

  - kind: group
    name: group_max_date_uc03
    params:
      - aggs:
          loading_date: max
        by:
        - week_of_year
        - year_of_date

  - kind: join
    name: join_group_max_date_uc03
    context_name: select_uc03_total
    params:
      - other:
          group_max_date_uc03
        how:
          inner
        columns:
          loading_date: max_loading_date

  - kind: group
    name: group_country_code_date_uc03
    params:
      - aggs:
          total_checks: sum
          invalid_checks: sum
        by:
        - country_code
        - loading_date
        - domain
        - uc_code
        - kpi_type

  - kind: select
    name: select_uc03_total_final
    params:
      columns:
        domain: domain
        uc_code: uc_code
        country_code: country_code
        loading_date: loading_date
        kpi_type: kpi_type
        sum_total_checks: total_checks
        sum_invalid_checks: invalid_checks
      distinct: true

