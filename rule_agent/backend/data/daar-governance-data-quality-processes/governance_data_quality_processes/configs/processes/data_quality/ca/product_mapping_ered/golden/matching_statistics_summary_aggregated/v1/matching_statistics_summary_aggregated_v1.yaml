      #   overwrite: true
      - column: country_code
        expression: IF(country_code IS NULL, country_code_eval, country_code)
        overwrite: true

  - kind: add
    name: add_metrics_1
    context_name: add_flavour_country
    params:
      - column: support
        expression: tp + fn 

  - kind: group
    name: group_metrics_1
    context_name: add_metrics_1
    params:
      - aggs:
          support: sum
          tp: sum
        by:
        - country_code
        - source_system
        # - processing_date
        # - scenario_id

  - kind: join
    name: join_metrics_1
    context_name: add_metrics_1
    params:
      - other:
          group_metrics_1
        how:
          left
        columns:
          country_code : country_code
          source_system : source_system          
          # processing_date : processing_date
          # scenario_id: scenario_id

  - kind: add
    name: add_metrics_2
    context_name: join_metrics_1
    params:
      - column: precision
        expression: IF(tp + fp = 0, 0, 100 * tp / (tp + fp))
      - column: recall
        expression: IF(tp + fn = 0, 0, 100* tp / (tp + fn))
      - column: f1 
        expression: IF(precision + recall = 0, 0, 2 * precision * recall / (precision + recall))
      - column: accuracy
        expression: 100 * sum_tp/sum_support
      - column: weights 
        expression: support/sum_support

  - kind: add
    name: add_metrics_3
    context_name: add_metrics_2
    params:
      - column: weigthed_precision
        expression: weights * precision
      - column: weigthed_recall
        expression: weights * recall
      - column: weigthed_f1 
        expression: weights * f1

  - kind: group
    name: group_flavour_country_metrics
    context_name: add_metrics_3
    params:
      - aggs:
          precision: avg
          recall: avg
          f1: avg
          accuracy: avg
          weigthed_precision: sum
          weigthed_recall: sum
          weigthed_f1: sum
        by:
        - country_code
        - source_system
        # - processing_date
        # - scenario_id

  - kind: add
    name: add_processing_date_f_country
    context_name: group_flavour_country_metrics
    params:
      - column: processing_date
        expression: cast(current_timestamp() as string)

  - kind: select
    name: select_flavour_country_metrics
    params:
      columns:
        avg_precision: macro_precision_flavour
        avg_recall: macro_recall_flavour
        avg_f1: macro_f1_flavour
        avg_accuracy: accuracy_flavour
        sum_weigthed_precision: weighted_precision_flavour
        sum_weigthed_recall: weighted_recall_flavour
        sum_weigthed_f1: weighted_f1_flavour
        country_code: ext_country_code
        source_system: source_system
        processing_date: processing_date
        # scenario_id: scenario_id
      distinct: true         

  - kind: unpivot
    name: unpivot_flavour_country_metrics
    context_name: select_flavour_country_metrics
    params:
      by:
       - source_system
       - ext_country_code
       - processing_date
      #  - scenario_id
      to:
       - kpi_code
       - kpi_value

  - kind: add
    name: flavour_country_metrics
    context_name: unpivot_flavour_country_metrics
    params:
      - column: kpi_scope
        expression: '''model'''
      - column: kpi_level
        expression: '''country'''

  - kind: union
    name: flavour_metrics
    params:
      allow_missing: false
      by_name: true
      other: flavour_all_metrics

####################### final all metrics union #######################
  - kind: union
    name: union_flavour_pack_type
    context_name: flavour_metrics
    params:
      allow_missing: false
      by_name: true
      other: pack_type_metrics

  - kind: union
    name: union_flavour_pack_type_brand_name
    context_name: union_flavour_pack_type
    params:
      allow_missing: false
      by_name: true
      other: brand_name_metrics

  - kind: union
    name: union_final
    context_name: union_flavour_pack_type_brand_name
    params:
      allow_missing: false
      by_name: true
      other: union_PMM_MRA

  - kind: cast
    name: cast_final
    params:
      - column: kpi_value
        to: decimal(13,3)

  - kind: write_dataio
    name: write_matching_statistics_aggregated
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: product_mapping_ered
      namespace: golden
      object_name: matching_statistics_summary_aggregated
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full