# AGGREGATED
#########################################################

####################### PMM #############################
########## SAP_PROD_COUNT_PMM 
  - kind: group
    name: group_count_num_match
    context_name: select_base
    params:
      - aggs:
          ext_product_name: count
        by:
        - ext_country_code
        - sap_product_code
        # - scenaro_id

  - kind: join
    name: join_count_num_match
    context_name: select_base
    params:
      - other:
          group_count_num_match
        how:
          inner
        columns:
          ext_country_code : ext_country_code
          sap_product_code: sap_product_code
          # scenario_id: scenario_id

  - kind: filter
    name: filter_count_SAP_single_match
    context_name: join_count_num_match
    params:
      - condition:
          count_ext_product_name = '1'

  - kind: group
    name: group_count_SAP_single_match
    params:
      - aggs:
          count_ext_product_name: count
        by:
        - ext_country_code

  - kind: join
    name: join_count_SAP_single_match
    context_name: filter_count_SAP_single_match
    params:
      - other:
          group_count_SAP_single_match
        how:
          inner
        columns:
          ext_country_code : ext_country_code

  - kind: select
    name: select_SAP_single_match
    context_name: join_count_SAP_single_match
    params:
      columns:
        processing_date: processing_date
        ext_country_code: ext_country_code
        count_count_ext_product_name: kpi_value
        source_system: source_system
      distinct: true        

  - kind: add
    name: add_count_SAP_single_match
    params:
      - column: kpi_code
        expression: '''SAP_PROD_COUNT_PMM'''
      - column: kpi_scope
        expression: '''matching'''
      - column: kpi_level
        expression: '''country'''

  - kind: select
    name: select_SAP_PROD_COUNT_PMM
    params:
      columns:
        ext_country_code: ext_country_code
        # scenario_id: scenario_id
        processing_date: processing_date
        kpi_code: kpi_code
        kpi_scope: kpi_scope
        kpi_level: kpi_level
        kpi_value: kpi_value
        source_system: source_system
      distinct: true        

