############################################################# MODEL METRICS ############################################################################
# evaluation set
  - kind: read_local
    name: read_eval
    params:
      format: parquet
      location: "{{mnt_path}}eRED/model_management/model_validation/"
          
  - kind: add
    name: add_eval_source_system
    params:
      - column: source_system
        expression: '''ered'''

  - kind: read_dataio
    name: read_mmi
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: product_mapping_ered
      object_name: manual_input
      schema_version: v1

  - kind: join
    name: join_mmi_sap
    context_name: read_mmi
    params:
      - other:
          read_spu
        how:
          left
        columns:
          sap_product_code : product_code
          ext_country_code : country_code

  - kind: filter
    name: filter_mmi
    context_name: join_mmi_sap
    params:
      - condition:
          mapping_status = '1'

  - kind: select
    name: select_mmi
    params:
      columns:
        ext_country_code: country_code
        ext_product_name: product_name_raw
        pack_type_code: pack_type
        flavour_name: flavour
        brand_name: brand_name
        # processing_date: processing_date
      distinct: true        

  - kind: add
    name: add_mmi_source_system
    params:
      - column: source_system
        expression: '''ered'''

  - kind: select
    name: select_processing_date_scenario_id
    params:
      columns:
        source_system: source_system
        # processing_date: processing_date
        # scenario_id: scenario_id
      distinct: true        

  - kind: join
    name: join_eval_processing_date_scenario_id
    context_name: add_eval_source_system
    params:
      - other:
          select_processing_date_scenario_id
        how:
          left
        columns:
          source_system : source_system

  - kind: union
    name: union_mmi
    context_name: add_mmi_source_system
    params:
      allow_missing: false
      by_name: true
      other: join_eval_processing_date_scenario_id

  - kind: select
    name: select_eval
    params:
      columns:
        country_code: country_code_eval
        product_name_raw: product_name_raw_eval
        pack_type: pack_type_eval
        flavour: flavour_eval
        brand_name: brand_name_eval
        # processing_date: processing_date_eval
        source_system: source_system_eval
      distinct: true   

  - kind: add
    name: add_eval
    params:
      - column: brand_name_eval_cleansed
        expression: "TRIM(REGEXP_REPLACE(REGEXP_REPLACE(LOWER(brand_name_eval), 'schweppes-cs', 'schweppes-club'), '[^a-z0-9,.-]+', ' '))"
      - column: flavour_eval_cleansed
        expression: "REGEXP_REPLACE(TRIM(REGEXP_REPLACE(lower(flavour_eval), '[^a-z0-9,.-]+', ' ')), ' ', '-')"
      - column: pack_type_eval_cleansed
        expression: "lower(pack_type_eval)"
        
  - kind: add
    name: add_epu_pack_type
    context_name: read_epu
    params:
      - column: pack_type
        expression: pack_type_name

  - kind: join
    name: join_eval_epu
    context_name: add_eval
    params:
      - other:
          add_epu_pack_type
        how:
          inner
        columns:
          product_name_raw_eval : product_name_raw
          country_code_eval : country_code
 
### brand_name all
  - kind: add
    name: add_eval_epu
    context_name: join_eval_epu
    params:
      - column: true_brand_name_pred
        expression: IF(brand_name_eval_cleansed = brand_name, 1, 0)
      - column: false_brand_name_pred
        expression: IF(brand_name_eval_cleansed = brand_name, 0, 1)

  - kind: group
    name: group_brand_name_all_tp
    context_name: add_eval_epu
    params:
      - aggs:
          true_brand_name_pred: sum
        by:
        - brand_name_eval_cleansed
        - source_system_eval
        # - processing_date_eval
        # - scenario_id

  - kind: select
    name: select_brand_name_all_tp
    params:
      columns:
        sum_true_brand_name_pred: tp
        brand_name_eval_cleansed: brand_name_eval_cleansed
        source_system_eval: source_system_eval
        # processing_date_eval: processing_date_eval
        # scenario_id: scenario_id
      distinct: true   

  - kind: group
    name: group_brand_name_all_fp
    context_name: add_eval_epu
    params:
      - aggs:
          false_brand_name_pred: sum
        by:
        - brand_name
        - source_system_eval
        # - processing_date_eval
        # - scenario_id

  - kind: select
    name: select_brand_name_all_fp
    params:
      columns:
        sum_false_brand_name_pred: fp
        brand_name: brand_name
        source_system_eval: source_system
        # processing_date_eval: processing_date
        # scenario_id: scenario_id
      distinct: true   

  - kind: group
    name: group_brand_name_all_fn
    context_name: add_eval_epu
    params:
      - aggs:
          false_brand_name_pred: sum
        by:
        - brand_name_eval_cleansed
        - source_system_eval
        # - processing_date_eval
        # - scenario_id

  - kind: select
    name: select_brand_name_all_fn
    params:
      columns:
        sum_false_brand_name_pred: fn
        brand_name_eval_cleansed: brand_name_eval_cleansed
        source_system_eval: source_system_eval
        # processing_date_eval: processing_date_eval
        # scenario_id: scenario_id
      distinct: true   

  - kind: join
    name: join_brand_name_all
    context_name: select_brand_name_all_tp
    params:
      - other:
          select_brand_name_all_fn
        how:
          full_outer
        columns:
          source_system_eval : source_system_eval
          brand_name_eval_cleansed: brand_name_eval_cleansed
          # processing_date_eval : processing_date_eval
          # scenario_id: scenario_id
      - other:
          select_brand_name_all_fp
        how:
          full_outer
        columns:
          source_system_eval : source_system
          brand_name_eval_cleansed: brand_name
          # processing_date_eval : processing_date
          # scenario_id: scenario_id

  - kind: add
    name: add_brand_name_all
    context_name: join_brand_name_all
    params:
      - column: tp
        expression: IF(tp IS NULL, 0, tp)
        overwrite: true
      - column: fp
        expression: IF(fp IS NULL, 0, fp)
        overwrite: true
      - column: fn
        expression: IF(fn IS NULL, 0, fn)
        overwrite: true
      - column: brand_name
        expression: IF(brand_name IS NULL, brand_name_eval_cleansed, brand_name)
        overwrite: true
      - column: source_system
        expression: IF(source_system IS NULL, source_system_eval, source_system)
        overwrite: true
      # - column: processing_date
      #   expression: IF(processing_date IS NULL, processing_date_eval, processing_date)
      #   overwrite: true

  - kind: add
    name: add_metrics_1
    context_name: add_brand_name_all
    params:
      - column: support
        expression: tp + fn 

  - kind: group
    name: group_metrics_1
    context_name: add_metrics_1
    params:
      - aggs:
          support: sum
          tp: sum
        by:
        - source_system
        # - processing_date
        # - scenario_id

  - kind: join
    name: join_metrics_1
    context_name: add_metrics_1
    params:
      - other:
          group_metrics_1
        how:
          left
        columns:
          source_system : source_system          
          # processing_date : processing_date
          # scenario_id: scenario_id

  - kind: add
    name: add_metrics_2
    context_name: join_metrics_1
    params:
      - column: precision
        expression: IF(tp + fp = 0, 0, 100 * tp / (tp + fp))
      - column: recall
        expression: IF(tp + fn = 0, 0, 100* tp / (tp + fn))
      - column: f1 
        expression: IF(precision + recall = 0, 0, 2 * precision * recall / (precision + recall))
      - column: accuracy
        expression: 100 * sum_tp/sum_support
      - column: weights 
        expression: support/sum_support

  - kind: add
    name: add_metrics_3
    context_name: add_metrics_2
    params:
      - column: weigthed_precision
        expression: weights * precision
      - column: weigthed_recall
        expression: weights * recall
      - column: weigthed_f1 
        expression: weights * f1

  - kind: group
    name: group_brand_name_all_metrics
    context_name: add_metrics_3
    params:
      - aggs:
          precision: avg
          recall: avg
          f1: avg
          accuracy: avg
          weigthed_precision: sum
          weigthed_recall: sum
          weigthed_f1: sum
        by:
        - source_system
        # - processing_date
        # - scenario_id

  - kind: add
    name: add_processing_date
    context_name: group_brand_name_all_metrics
    params:
      - column: processing_date
        expression: cast(current_timestamp() as string)

  - kind: select
    name: select_brand_name_all_metrics
    params:
      columns:
        avg_precision: macro_precision_brand_name
        avg_recall: macro_recall_brand_name
        avg_f1: macro_f1_brand_name
        avg_accuracy: accuracy_brand_name
        sum_weigthed_precision: weighted_precision_brand_name
        sum_weigthed_recall: weighted_recall_brand_name
        sum_weigthed_f1: weighted_f1_brand_name
        source_system: source_system
        processing_date: processing_date
        # scenario_id: scenario_id
      distinct: true         

  - kind: unpivot
    name: unpivot_brand_name_all_metrics
    context_name: select_brand_name_all_metrics
    params:
      by:
       - source_system
       - processing_date
      #  - scenario_id
      to:
       - kpi_code
       - kpi_value

  - kind: add
    name: brand_name_all_metrics
    context_name: unpivot_brand_name_all_metrics
    params:
      - column: ext_country_code
        expression: ''''''
      - column: kpi_scope
        expression: '''model'''
      - column: kpi_level
        expression: '''all'''

### brand_name country
  - kind: group
    name: group_brand_name_country_tp
    context_name: add_eval_epu
    params:
