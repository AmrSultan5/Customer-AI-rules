transform:
  name: Billing_address_mdg_sap
  operations:
    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: add
      name: add_but000_regexp
      context_name: read_mdg_but000
      params:
      - column: partner_mdg_but000_regexp
        expression: regexp_replace(regexp_replace(partner,'\n',''),'\r','')
      - column: partner_guid_mdg_but000_regexp
        expression: regexp_replace(regexp_replace(partner_guid,'\n',''),'\r','')

    - kind: select
      name: select_mdg_but000
      context_name: add_but000_regexp
      params:
        columns:
          partner: partner_mdg_but000
          partner_mdg_but000_regexp: partner_mdg_but000_regexp
          partner_guid_mdg_but000_regexp: partner_guid_mdg_but000_regexp
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_mdg_but020
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but020
        schema_version: v1

    - kind: select
      name: select_mdg_but020
      context_name: read_mdg_but020
      params:
        columns:
          partner: partner_mdg_but020
          addrnumber: addrnumber_mdg_but020
        distinct: true

    - kind: read_dataio
      name: read_mdg_adrc
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: address_and_communication_data
        object_name: adrc
        schema_version: v1

    - kind: filter
      name: filter_mdg_adrc
      context_name: read_mdg_adrc
      params:
        - condition: nation = '' AND (adrc_uuid <> '' OR adrc_uuid IS NOT NULL)

    - kind: add
      name: add_mdg_adrc_regexp
      context_name: filter_mdg_adrc
      params:
      - column: location_mdg_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(location),'\n',''),'\r','')
      - column: city2_mdg_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(city2),'\n',''),'\r','')
      - column: home_city_mdg_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(home_city),'\n',''),'\r','')
      - column: str_suppl3_mdg_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(str_suppl3),'\n',''),'\r','')

    - kind: select
      name: select_mdg_adrc
      context_name: add_mdg_adrc_regexp
      params:
        columns:
          addrnumber: addrnumber_mdg_adrc
          location_mdg_adrc_regexp: location_mdg_adrc_regexp
          city2_mdg_adrc_regexp: city2_mdg_adrc_regexp
          home_city_mdg_adrc_regexp: home_city_mdg_adrc_regexp
          str_suppl3_mdg_adrc_regexp: str_suppl3_mdg_adrc_regexp
          nation: nation_mdg_adrc
          ADRC_UUID: adrc_uuid_mdg_adrc
        distinct: true

    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_mdg_knvv
      context_name: read_mdg_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_knvv_pre_checkpoint
      context_name: filter_mdg_knvv
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true

    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_knvv_pre_checkpoint

    - kind: join
      name: join_mdg
      context_name: select_mdg_but000
      params:
        - other:
            select_mdg_but020
          how:
            inner
          columns:
            partner_mdg_but000: partner_mdg_but020
        - other:
            select_mdg_knvv
          how:
            inner
          columns:
            partner_mdg_but000: kunnr_knvv
        - other:
            select_mdg_adrc
          how:
            left
          columns:
            addrnumber_mdg_but020: addrnumber_mdg_adrc

    - kind: filter
      name: filter_mdg
      context_name: join_mdg
      params:
        - condition: xpcpt_mdg_but000<>'X' AND partner_mdg_but000 LIKE any('12%','13%','40%','18%','30%','16%','29%','17%','24%','26%','21%','19%','96%','28%','27%','32%','35%','25%','34%','42%','33%','31%','15%','95%','94%','14%','22%','47%')

    - kind: add
      name: add_mdg_HASH
      context_name: filter_mdg
      params:
      - column: hash_mdg
        expression: md5(concat(partner_mdg_but000_regexp,partner_guid_mdg_but000_regexp,location_mdg_adrc_regexp,city2_mdg_adrc_regexp,home_city_mdg_adrc_regexp,str_suppl3_mdg_adrc_regexp))

    - kind: select
      name: mdg
      context_name: add_mdg_HASH
      params:
        columns:
          partner_mdg_but000_regexp: partner_mdg
          partner_guid_mdg_but000_regexp: partner_guid_mdg
          location_mdg_adrc_regexp: location_mdg
          city2_mdg_adrc_regexp: city2_mdg
          home_city_mdg_adrc_regexp: home_city_mdg
          str_suppl3_mdg_adrc_regexp: str_suppl3_mdg
          hash_mdg: hash_mdg

    - kind: read_dataio
      name: read_s4hana_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: add
      name: add_but000_regexp
      context_name: read_s4hana_but000
      params:
      - column: partner_s4hana_but000_regexp
        expression: regexp_replace(regexp_replace(partner,'\n',''),'\r','')
      - column: partner_guid_s4hana_but000_regexp
        expression: regexp_replace(regexp_replace(partner_guid,'\n',''),'\r','')

    - kind: select
      name: select_s4hana_but000
      context_name: add_but000_regexp
      params:
        columns:
          partner: partner_s4hana_but000
          partner_s4hana_but000_regexp: partner_s4hana_but000_regexp
          partner_guid_s4hana_but000_regexp: partner_guid_s4hana_but000_regexp
          xpcpt: xpcpt_s4hana_but000
          sap_cluster: sap_cluster_s4hana_but000
        distinct: true

    - kind: read_dataio
      name: read_s4hana_but020
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: business_partner
        object_name: but020
        schema_version: v1

    - kind: select
      name: select_s4hana_but020
      context_name: read_s4hana_but020
      params:
        columns:
          partner: partner_s4hana_but020
          addrnumber: addrnumber_s4hana_but020
          sap_cluster: sap_cluster_s4hana_but020
        distinct: true

    - kind: read_dataio
      name: read_s4hana_adrc
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: address_and_communication_data
        object_name: adrc
        schema_version: v1

    - kind: filter
      name: filter_s4hana_adrc
      context_name: read_s4hana_adrc
      params:
        - condition: nation = '' AND (adrc_uuid <> '' OR adrc_uuid IS NOT NULL)

    - kind: add
      name: add_s4hana_adrc_regexp
      context_name: filter_s4hana_adrc
      params:
      - column: location_s4hana_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(location),'\n',''),'\r','')
      - column: city2_s4hana_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(city2),'\n',''),'\r','')
      - column: home_city_s4hana_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(home_city),'\n',''),'\r','')
      - column: str_suppl3_s4hana_adrc_regexp
        expression: regexp_replace(regexp_replace(lower(str_suppl3),'\n',''),'\r','')

    - kind: select
      name: select_s4hana_adrc
      context_name: add_s4hana_adrc_regexp
      params:
        columns:
          addrnumber: addrnumber_s4hana_adrc
          location_s4hana_adrc_regexp: location_s4hana_adrc_regexp
          city2_s4hana_adrc_regexp: city2_s4hana_adrc_regexp
          home_city_s4hana_adrc_regexp: home_city_s4hana_adrc_regexp
          str_suppl3_s4hana_adrc_regexp: str_suppl3_s4hana_adrc_regexp
          nation: nation_s4hana_adrc
          ADRC_UUID: adrc_uuid_s4hana_adrc
          sap_cluster: sap_cluster_s4hana_adrc
        distinct: true

    - kind: read_dataio
      name: read_knvv_sap
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv_sap
      context_name: read_knvv_sap
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_knvv_sap
      context_name: filter_knvv_sap
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
          sap_cluster: sap_cluster_knvv
        distinct: true

    - kind: join
      name: join_s4hana
      context_name: select_s4hana_but000
      params:
        - other:
            select_s4hana_but020
          how:
            inner
          columns:
            partner_s4hana_but000: partner_s4hana_but020
            sap_cluster_s4hana_but000: sap_cluster_s4hana_but020
        - other:
            select_knvv_sap
          how:
            inner
          columns:
            partner_s4hana_but000: kunnr_knvv
            SAP_CLUSTER_s4hana_but000: sap_cluster_knvv
        - other:
            select_s4hana_adrc
          how:
            left
          columns:
            addrnumber_s4hana_but020: addrnumber_s4hana_adrc
            sap_cluster_s4hana_but020: sap_cluster_s4hana_adrc

    - kind: filter
      name: filter_s4hana
      context_name: join_s4hana
      params:
        - condition: xpcpt_s4hana_but000<>'X' AND if(sap_cluster_s4hana_but020 = 'CL1', partner_s4hana_but000 like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),partner_s4hana_but000 like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%'))

    - kind: add
      name: add_s4hana_HASH
      context_name: filter_s4hana
      params:
      - column: hash_s4hana
        expression: md5(concat(partner_s4hana_but000_regexp,partner_guid_s4hana_but000_regexp,location_s4hana_adrc_regexp,city2_s4hana_adrc_regexp,home_city_s4hana_adrc_regexp,str_suppl3_s4hana_adrc_regexp))

    - kind: select
      name: s4hana
      context_name: add_s4hana_HASH
      params:
        columns:
          partner_s4hana_but000_regexp: partner_s4hana
          partner_guid_s4hana_but000_regexp: partner_guid_s4hana
          location_s4hana_adrc_regexp: location_s4hana
          city2_s4hana_adrc_regexp: city2_s4hana
          home_city_s4hana_adrc_regexp: home_city_s4hana
          str_suppl3_s4hana_adrc_regexp: str_suppl3_s4hana
          hash_s4hana: hash_s4hana

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            HASH_mdg: HASH_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_s4hana is null or HASH_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          partner_guid_mdg: partner_guid_mdg
          location_mdg: location_mdg
          city2_mdg: city2_mdg
          home_city_mdg: home_city_mdg
          str_suppl3_mdg: str_suppl3_mdg
          hash_mdg: hash_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          partner_s4hana: partner_s4hana
          partner_guid_s4hana: partner_guid_s4hana
          location_s4hana: location_s4hana
          city2_s4hana: city2_s4hana
          home_city_s4hana: home_city_s4hana
          str_suppl3_s4hana: str_suppl3_s4hana
          hash_s4hana: hash_s4hana

###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            partner_mdg: partner_s4hana
            partner_guid_mdg: partner_guid_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN partner_s4hana IS NULL THEN 'data missing from sap' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_s4hana: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

###data missing from S4HANA

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          partner_mdg: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##BILLING ADDRESS: LOCATION
    - kind: filter
      name: billing_address_location_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND location_s4hana <> location_mdg

    - kind: add
      name: add_missing_columns_billing_address_location
      context_name: billing_address_location_filter
      params:
        - column: attr_name_billing_address_location
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND location_s4hana <> location_mdg THEN concat('BILLING ADDRESS:',' LOCATION') END
        - column: msg_billing_address_location
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND location_s4hana <> location_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_address_location
      context_name: add_missing_columns_billing_address_location
      params:
        columns:
          partner_mdg: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_address_location: msg
          attr_name_billing_address_location: attr_name
          location_s4hana: tgt_attr
          location_mdg: src_attr

##BILLING ADDRESS: CITY2
    - kind: filter
      name: billing_address_city2_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND city2_s4hana <> city2_mdg

    - kind: add
      name: add_missing_columns_billing_address_city2
      context_name: billing_address_city2_filter
      params:
        - column: attr_name_billing_address_city2
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND city2_s4hana <> city2_mdg THEN concat('BILLING ADDRESS:',' CITY2') END
        - column: msg_billing_address_city2
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND city2_s4hana <> city2_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_address_city2
      context_name: add_missing_columns_billing_address_city2
      params:
        columns:
          partner_mdg: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_address_city2: msg
          attr_name_billing_address_city2: attr_name
          city2_s4hana: tgt_attr
          city2_mdg: src_attr

##BILLING ADDRESS: HOME_CITY
    - kind: filter
      name: billing_address_home_city_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND home_city_s4hana <> home_city_mdg

    - kind: add
      name: add_missing_columns_billing_address_home_city
      context_name: billing_address_home_city_filter
      params:
        - column: attr_name_billing_address_home_city
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND home_city_s4hana <> home_city_mdg THEN concat('BILLING ADDRESS:',' HOME_CITY') END
        - column: msg_billing_address_home_city
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND home_city_s4hana <> home_city_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_address_home_city
      context_name: add_missing_columns_billing_address_home_city
      params:
        columns:
          partner_mdg: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_address_home_city: msg
          attr_name_billing_address_home_city: attr_name
          home_city_s4hana: tgt_attr
          home_city_mdg: src_attr

##BILLING ADDRESS: STR_SUPPL3
    - kind: filter
      name: billing_address_str_suppl3_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND str_suppl3_s4hana <> str_suppl3_mdg

    - kind: add
      name: add_missing_columns_billing_address_str_suppl3
      context_name: billing_address_str_suppl3_filter
      params:
        - column: attr_name_billing_address_str_suppl3
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND str_suppl3_s4hana <> str_suppl3_mdg THEN concat('BILLING ADDRESS:',' STR_SUPPL3') END
        - column: msg_billing_address_str_suppl3
          expression: CASE WHEN partner_mdg = partner_s4hana AND partner_guid_mdg = partner_guid_s4hana AND str_suppl3_s4hana <> str_suppl3_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_address_str_suppl3
      context_name: add_missing_columns_billing_address_str_suppl3
      params:
        columns:
          partner_mdg: partner
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_address_str_suppl3: msg
          attr_name_billing_address_str_suppl3: attr_name
          str_suppl3_s4hana: tgt_attr
          str_suppl3_mdg: src_attr

    - kind: union
      name: union_comparison
      context_name: final_data_missing_from_mdg
      params:
        allow_missing: true
        by_name: true
        other: final_data_missing_from_s4hana

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_address_location

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_address_city2

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_address_home_city

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_address_str_suppl3

    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
