            WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
            WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
            WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
            WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
            WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
            WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END
        - column: table_name
          expression: cast('BILLING ADDRESS' as string)
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: dimension
          expression: cast('ATTRIBUTES ARE MISMATCHING' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_data_mismatch_agg
      context_name: add_missing_columns_data_mismatch_agg
      params:
        - aggs:
            partner: count
          by:
          - country
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_data_mismatch_final
      context_name: group_data_mismatch_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_partner: cnt
          country: country
          loading_date: loading_date
        distinct: true  

### write agg ###
    - kind: union
      name: union_comparison_agg_final
      context_name: select_mdg_agg_final
      params:
        allow_missing: true
        by_name: true
        other: select_s4hana_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_missing_from_mdg_agg_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_missing_from_s4hana_final

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: select_data_mismatch_final

    - kind: cast
      name: cast_cnt
      context_name: union_comparison_agg
      params:
      - column: cnt
        to: integer

    - kind: write_dataio
      name: write_aggregated
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: recon_aggregated_prod
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: partition