transform:
  name: f_product_details_l3
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

# Read dm_product_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general


# Read dm_product_sales_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

# Read dm_product_universe

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_universe
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_universe

# Read dim_product_classification

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_product_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_product_classification

# Read dm_product_check_results

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_check_results
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_check_results

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_rules_inventory

  - kind: filter
    name: filter_dim_rules_inventory
    context_name: read_dim_rules_inventory
    params:
      - condition:
          is_active = '1'

  - kind: select
    name: select_dim_rules_inventory
    context_name: filter_dim_rules_inventory
    params:
      columns:
        rule_code: rule_code
      distinct: true

#Select dm_product_general

  - kind: add
    name: add_dm_product_general
    context_name: read_dm_product_general
    params:
      - column: material_group_code_ifnull
        expression: ifnull(material_group_code, 'null')
      - column: material_type_code_ifnull
        expression: ifnull(material_type_code, 'null')
      - column: bpp_code_ifnull
        expression: ifnull(bpp_code, 'null')
      - column: bpp_name_ifnull
        expression: ifnull(bpp_name,'null' ) 
      - column: bpp_package_name_ifnull
        expression: ifnull(bpp_package_name,'null' )
      - column: bpp_package_code_ifnull
        expression: ifnull(bpp_package_code,'null' )

  - kind: select
    name: select_dm_product_general
    context_name: add_dm_product_general
    params:
      columns:
        material_code: material_code
        material_group_code_ifnull: material_group_code_ifnull
        material_type_code_ifnull: material_type_code_ifnull
        bpp_code_ifnull: bpp_code_ifnull
        bpp_name_ifnull: bpp_name_ifnull
        bpp_package_name_ifnull: bpp_package_name_ifnull 
        bpp_package_code_ifnull: bpp_package_code_ifnull         
        material_description: material_description
        creation_date: creation_date
        sap_cluster: sap_cluster_pg
      distinct: true


#Select dm_product_sales_organization

  - kind: add
    name: add_dm_product_sales_organization
    context_name: read_dm_product_sales_organization
    params:
      - column: flavour_code_ifnull
        expression: ifnull(flavour_code, 'null')
      - column: pack_size_code_ifnull
        expression: ifnull(pack_size_code, 'null')
      - column: pack_type_code_ifnull
        expression: ifnull(pack_type_code, 'null')
      - column: product_hierarchy_code_ifnull
        expression: ifnull(product_hierarchy_code, 'null')
      - column: sales_org_code_ifnull
        expression: ifnull(sales_org_code, 'null')
      - column: sales_unit_code_ifnull
        expression: ifnull(sales_unit_code, 'null')
      - column: brand_code_ifnull
        expression: ifnull(brand_code, 'null')
      - column: distribution_channel_code_ifnull
        expression: ifnull(distribution_channel_code, 'null')

  - kind: select
    name: select_dm_product_sales_organization
    context_name: add_dm_product_sales_organization
    params:
      columns:
        material_code: material_code
        flavour_code_ifnull: flavour_code_ifnull
        pack_size_code_ifnull: pack_size_code_ifnull
        pack_type_code_ifnull: pack_type_code_ifnull
        product_hierarchy_code_ifnull: product_hierarchy_code_ifnull
        sales_org_code_ifnull: sales_org_code_ifnull
        sales_unit_code_ifnull: sales_unit_code_ifnull
        brand_code_ifnull: brand_code_ifnull
        distribution_channel_code_ifnull: distribution_channel_code_ifnull
        country_code: country_code
        sap_cluster: sap_cluster_pso
      distinct: true

#Select dm_product_universe

  - kind: select
    name: select_dm_product_universe
    context_name: read_dm_product_universe
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster_pu
      distinct: true


#Select dim_product_classification

  - kind: add
    name: add_dim_product_classification
    context_name: read_dim_product_classification
    params:
      - column: flavour_code_ifnull
        expression: ifnull(flavour_code, 'null')
      - column: material_group_code_ifnull
        expression: ifnull(material_group_code, 'null')
      - column: material_type_code_ifnull
        expression: ifnull(material_type_code, 'null')
      - column: pack_size_code_ifnull
        expression: ifnull(pack_size_code, 'null')
      - column: pack_type_code_ifnull
        expression: ifnull(pack_type_code, 'null')
      - column: product_hierarchy_code_ifnull
        expression: ifnull(product_hierarchy_code, 'null')
      - column: sales_unit_code_ifnull
        expression: ifnull(sales_unit_code, 'null')
      - column: brand_code_ifnull
        expression: ifnull(brand_code, 'null')
      - column: bpp_code_ifnull
        expression: ifnull(bpp_code, 'null')
      - column: bpp_name_ifnull
        expression: ifnull(bpp_name,'null' ) 
      - column: bpp_package_name_ifnull
        expression: ifnull(bpp_package_name,'null' ) 
      - column: bpp_package_code_ifnull
        expression: ifnull(bpp_package_code,'null' ) 

  - kind: select
    name: select_dim_product_classification
    context_name: add_dim_product_classification
    params:
      columns:
        prod_class_id: prod_class_id
        flavour_code_ifnull: flavour_code_ifnull
        material_group_code_ifnull: material_group_code_ifnull
        material_type_code_ifnull: material_type_code_ifnull
        pack_size_code_ifnull: pack_size_code_ifnull
        pack_type_code_ifnull: pack_type_code_ifnull
        product_hierarchy_code_ifnull: product_hierarchy_code_ifnull
        sales_unit_code_ifnull: sales_unit_code_ifnull
        brand_code_ifnull: brand_code_ifnull
        bpp_code_ifnull: bpp_code_ifnull
        bpp_name_ifnull: bpp_name_ifnull
        bpp_package_name_ifnull: bpp_package_name_ifnull    
        bpp_package_code_ifnull: bpp_package_code_ifnull        
      distinct: true

#Select dm_product_check_results

  - kind: select
    name: select_dm_product_check_results
    context_name: read_dm_product_check_results
    params:
      columns:
        material_code: material_code
        country_code: country_code
        value_checked: value_checked
        check_status: check_status
        check_date: check_date
        rule_code: rule_code
        sap_cluster: sap_cluster_qc
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

  - kind: filter
    name: filter_dm_product_check_results
    params:
      - condition:
          (check_status == '0' or check_status == '1') and sap_cluster_qc is not null and sap_cluster_qc!='' AND rule_code like 'RPACTI_1%'

  - kind: join
    name: join_qc_pu_pg_pso_pc
    params:
      - other:
          select_dm_product_universe
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster_qc: sap_cluster_pu
      - other:
          select_dm_product_general
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster_qc: sap_cluster_pg
      - other:
          select_dm_product_sales_organization
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster_qc: sap_cluster_pso
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code            
      - other:
          select_dim_product_classification
        how:
          left
        columns:
          flavour_code_ifnull: flavour_code_ifnull
          material_group_code_ifnull: material_group_code_ifnull
          material_type_code_ifnull: material_type_code_ifnull
          pack_size_code_ifnull: pack_size_code_ifnull
          pack_type_code_ifnull: pack_type_code_ifnull
          product_hierarchy_code_ifnull: product_hierarchy_code_ifnull
          sales_unit_code_ifnull: sales_unit_code_ifnull
          brand_code_ifnull: brand_code_ifnull
          bpp_code_ifnull: bpp_code_ifnull
          bpp_name_ifnull: bpp_name_ifnull
          bpp_package_name_ifnull: bpp_package_name_ifnull 
          bpp_package_code_ifnull: bpp_package_code_ifnull 

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: select
    name: select_f_product_details_l3_y
    params:
      columns:
        value_checked: value_checked
        check_status: check_status
        country_code: country_code
        prod_class_id: prod_class_id
        material_description: material_description
        material_code: material_code
        creation_date: material_creation_date
        plant_code: plant_code
        sales_org_code: sales_org_code
        rule_code: rule_code
        loading_date: loading_date
        sap_cluster_pu: sap_cluster
      distinct: true


  - kind: select
    name: select_dm_product_check_results_n
    context_name: read_dm_product_check_results
    params:
      columns:
        material_code: material_code
        country_code: country_code
        value_checked: value_checked
        check_status: check_status
        check_date: check_date
        rule_code: rule_code
        sap_cluster: sap_cluster_qc
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

  - kind: filter
    name: filter_dm_product_check_results_n
    params:
      - condition:
          (check_status == '0' or check_status == '1') and sap_cluster_qc is not null and sap_cluster_qc!='' AND rule_code not like 'RPACTI_1%'

  - kind: join
    name: join_qc_pu_pg_pso_pc
    params:
      - other:
          select_dm_product_universe
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster_qc: sap_cluster_pu
      - other:
          select_dm_product_general
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster_qc: sap_cluster_pg
      - other:
          select_dm_product_sales_organization
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster_qc: sap_cluster_pso
      - other:
          select_dim_rules_inventory
        how:
          inner
        columns:
          rule_code: rule_code            
      - other:
          select_dim_product_classification
        how:
          left
        columns:
          flavour_code_ifnull: flavour_code_ifnull
          material_group_code_ifnull: material_group_code_ifnull
          material_type_code_ifnull: material_type_code_ifnull
          pack_size_code_ifnull: pack_size_code_ifnull
          pack_type_code_ifnull: pack_type_code_ifnull
          product_hierarchy_code_ifnull: product_hierarchy_code_ifnull
          sales_unit_code_ifnull: sales_unit_code_ifnull
          brand_code_ifnull: brand_code_ifnull
          bpp_code_ifnull: bpp_code_ifnull
          bpp_name_ifnull: bpp_name_ifnull
          bpp_package_name_ifnull: bpp_package_name_ifnull 
          bpp_package_code_ifnull: bpp_package_code_ifnull 

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: select
    name: select_f_product_details_l3_n
    params:
      columns:
        value_checked: value_checked
        check_status: check_status
        country_code: country_code
        prod_class_id: prod_class_id
        material_description: material_description
        material_code: material_code
        creation_date: material_creation_date
        plant_code: plant_code
        sales_org_code: sales_org_code
        rule_code: rule_code
        loading_date: loading_date
        sap_cluster_pu: sap_cluster
      distinct: true

  - kind: union
    name: union_product_check_results_not_null
    context_name: select_f_product_details_l3_y
    params:
      allow_missing: false
      by_name: true
      other: select_f_product_details_l3_n


  - kind: select
    name: select_dm_product_check_results_empty_sap_cluster
    context_name: read_dm_product_check_results
    params:
