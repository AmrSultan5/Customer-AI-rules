        country_code: country_code
        value_checked: value_checked
        check_status: check_status
        check_date: check_date
        rule_code: rule_code
        sap_cluster: sap_cluster_qc
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

  - kind: filter
    name: filter_dm_product_check_results_empty_sap_cluster
    params:
      - condition:
          (check_status == '0' or check_status == '1') and (sap_cluster_qc is null or sap_cluster_qc='')

  - kind: join
    name: join_qc_pu_pg_pso_pc_empty_sap_cluster
    params:
      - other:
          select_dm_product_universe
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
      - other:
          select_dm_product_general
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster_pu: sap_cluster_pg
      - other:
          select_dm_product_sales_organization
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
