  - kind: union
    name: union_product_check_results
    context_name: union_product_check_results_not_null
    params:
      allow_missing: false
      by_name: true
      other: select_f_product_details_l3_empty_sap_cluster


  - kind: write_dataio
    name: write_f_product_details_l3
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_product_details_l3
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
