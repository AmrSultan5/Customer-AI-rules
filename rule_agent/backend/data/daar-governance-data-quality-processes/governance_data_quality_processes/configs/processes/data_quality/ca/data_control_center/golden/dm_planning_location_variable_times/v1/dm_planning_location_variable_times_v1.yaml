transform:
  name: dm_planning_location_variable_times
  operations:

  # Read O4H_OSLC_ST (location variable times)
  - kind: read_dataio
    name: read_o4h_oslc_st
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: otc_leo
      object_name: o4h_oslc_st
      schema_version: v1

  # Add type casting for decimal columns
  - kind: add
    name: add_type_casts
    context_name: read_o4h_oslc_st
    params:
      - column: dur_load_cast
        expression: cast(coalesce(dur_load, 0) as decimal(38,18))
      - column: dur_unload_cast
        expression: cast(coalesce(dur_unload, 0) as decimal(38,18))

  # Select and rename columns for final datamart schema (matching target schema order)
  - kind: select
    name: select_dm_planning_location_variable_times
    context_name: add_type_casts
    params:
      columns:
        location: planning_location
        operation: operation
        role: location_role
        uom: variable_time_base_unit_of_measure
        sap_cluster: sap_cluster
        sap_read_timestamp: sap_read_timestamp
        dur_einhe: variable_time_duration_unit
        dur_load_cast: variable_time_load_duration
        dur_unload_cast: variable_time_unload_duration
      distinct: true

  # Write to golden datamart
  - kind: write_dataio
    name: write_dm_planning_location_variable_times
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_planning_location_variable_times
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
