transform:
  name: dim_customer_classification
  operations:

  - kind: read_dataio
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general
      schema_version: v11

  - kind: read_dataio
    name: read_dm_customer_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_sales_organization
      schema_version: v3

  - kind: read_dataio
    name: read_dm_customer_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_hierarchy
      schema_version: v3

  - kind: select
    name: select_dm_customer_general
    context_name: read_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        account_group_code: account_group_code
        account_group_name: account_group_name
        customer_1_name: customer_1_name
        central_order_block_code: central_order_block_code
        central_order_block_name: central_order_block_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_sales_organization
    context_name: read_dm_customer_sales_organization
    params:
      columns:
        customer_code: customer_code
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        payer_partner_function_flag: payer_partner_function_flag
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_hierarchy
    context_name: read_dm_customer_hierarchy
    params:
      columns:
        l7_customer_code: l7_customer_code
        l3_customer_code: l3_customer_code
        l3_customer_name: l3_customer_name
        l4_customer_code: l4_customer_code
        l4_customer_name: l4_customer_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dm_customer_general
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_sales_organization
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_hierarchy
        how:
          left
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster

  - kind: select
    name: select_dim_customer
    params:
      columns:
        account_group_code: account_group_code
        account_group_name: account_group_name
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        l3_customer_code: customer_hierarchy_3_code
        l3_customer_name: customer_hierarchy_3_name
        l4_customer_code: customer_hierarchy_4_code
        l4_customer_name: customer_hierarchy_4_name
        central_order_block_code: order_block_code
        central_order_block_name: order_block_name
        payer_partner_function_flag: payer_partner_function_flag
      distinct: true

  - kind: add
    name: add_dim_customer_classification_expression
    params:
      - column: cust_class_id
        expression: MD5(
                    ifnull(account_group_code, 'null') ||
                    ifnull(customer_group_4_code, 'null') ||
                    ifnull(customer_hierarchy_3_code, 'null') ||
                    ifnull(customer_hierarchy_4_code, 'null') ||
                    ifnull(order_block_code, 'null') ||
                    ifnull(payer_partner_function_flag, 'null')
                    )
      - column: account_group
        expression: account_group_code || ' - ' || account_group_name
      - column: customer_group_4
        expression: customer_group_4_code || ' - ' || customer_group_4_name
      - column: customer_hierarchy_3
        expression: customer_hierarchy_3_code || ' - ' || customer_hierarchy_3_name
      - column: customer_hierarchy_4
        expression: customer_hierarchy_4_code || ' - ' || customer_hierarchy_4_name
      - column: order_block
        expression: order_block_code || ' - ' || order_block_name

  - kind: select
    name: select_dim_customer_classification
    params:
      columns:
        account_group_code: account_group_code
        account_group_name: account_group_name
        account_group: account_group
        cust_class_id: cust_class_id
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        customer_group_4: customer_group_4
        customer_hierarchy_3_code: customer_hierarchy_3_code
        customer_hierarchy_3_name: customer_hierarchy_3_name
        customer_hierarchy_3: customer_hierarchy_3
        customer_hierarchy_4_code: customer_hierarchy_4_code
        customer_hierarchy_4_name: customer_hierarchy_4_name
        customer_hierarchy_4: customer_hierarchy_4
        order_block_code: order_block_code
        order_block_name: order_block_name
        order_block: order_block
        payer_partner_function_flag: payer_partner_function_flag
      distinct: true

  - kind: write_dataio
    name: write_dim_customer_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_customer_classification
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: incremental
