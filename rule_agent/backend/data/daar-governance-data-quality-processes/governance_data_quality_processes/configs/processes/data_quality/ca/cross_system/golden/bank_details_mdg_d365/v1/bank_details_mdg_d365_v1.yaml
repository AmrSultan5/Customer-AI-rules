transform:
  name: Bank_details_MDG_D365
  operations:
    - kind: read_dataio
      name: read_mdg_but0bk
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: bank_data
        object_name: but0bk
        schema_version: v1

    - kind: select
      name: select_mdg_but0bk
      context_name: read_mdg_but0bk
      params:
        columns:
          partner: partner_but0bk
          bkvid: bkvid_but0bk
          banks: banks_but0bk
          bankl: bankl_but0bk
          bankn: bankn_but0bk
          bkont: bkont_but0bk
          koinh: koinh_but0bk
          bkref: bkref_but0bk
          xezer: xezer_but0bk
        distinct: true

    - kind: read_dataio
      name: read_mdg_tiban
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: bank_data
        object_name: tiban
        schema_version: v1

    - kind: select
      name: select_mdg_tiban
      context_name: read_mdg_tiban
      params:
        columns:
          iban: iban_tiban
          bankl: bankl_tiban
          bankn: bankn_tiban
          banks: banks_tiban
          bkont: bkont_tiban
        distinct: true

    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          partner_guid: partner_guid_mdg_but000
          name_last: name_last_mdg_but000
          name_first: name_first_mdg_but000
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: join
      name: join_mdg
      context_name: select_mdg_but0bk
      params:
        - other:
            select_mdg_tiban
          how:
            left
          columns:
            bankl_but0bk: bankl_tiban
            bankn_but0bk: bankn_tiban
            banks_but0bk: banks_tiban
            bkont_but0bk: bkont_tiban
        - other:
            select_mdg_but000
          how:
            inner
          columns:
            partner_but0bk: partner_mdg_but000

    - kind: filter
      name: filter_join_mdg
      context_name: join_mdg
      params:
        - condition:
            xpcpt_mdg_but000 <>'X' AND partner_but0bk LIKE any ('12%' , '13%' , '40%' , '18%' , '30%' , '16%' , '29%' , '17%' , '24%' , '26%' , '21%' , '19%' , '96%' , '28%' , '27%' , '32%' , '35%' , '25%' , '34%' , '42%' , '33%' , '31%' , '15%' , '95%' , '94%' , '14%' , '22%')
 
    - kind: add
      name: add_mdg_HASH
      context_name: filter_join_mdg
      params:
      - column: HASH
        expression: MD5(CONCAT(partner_but0bk,bkvid_but0bk, iban_tiban, banks_but0bk,bankl_but0bk,bankn_but0bk,bkont_but0bk,koinh_but0bk,bkref_but0bk,xezer_but0bk)) #remove partner_guid_mdg_but000


    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: filter
      name: filter_knvv
      params:
        - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

    - kind: select
      name: select_mdg_knvv_checkpoint
      params:
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true

    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_mdg_knvv_checkpoint

    - kind: join
      name: join_mdg
      context_name: add_mdg_HASH
      params:
        - other:
            select_mdg_knvv
          how:
            inner
          columns:
            partner_but0bk: kunnr_knvv


    - kind: select
      name: mdg_checkpoint
      context_name: join_mdg
      params:
        columns:
          partner_but0bk: partner_mdg
          bkvid_but0bk: bkvid_mdg
          iban_tiban: iban_mdg
          banks_but0bk: banks_mdg
          bankl_but0bk: bankl_mdg
          bankn_but0bk: bankn_mdg
          bkont_but0bk: bkont_mdg
          koinh_but0bk: koinh_mdg
          bkref_but0bk: bkref_mdg
          xezer_but0bk: xezer_mdg
          HASH: HASH_mdg
        distinct: true

    - kind: checkpoint
      name: mdg
      context_name: mdg_checkpoint


    #d365
    - kind: read_dataio
      name: read_d365_cchbkacc
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_bankaccount
        schema_version: v1

    - kind: select
      name: select_d365_cchbkacc
      context_name: read_d365_cchbkacc
      params:
        columns:
          cch_countryid: cch_countryid
          cch_bkvid: cch_bkvid
          cch_iban: cch_iban
          cch_bankkey: cch_bankkey
          cch_number: cch_number
          cch_controlkey: cch_controlkey
          cch_accountholder: cch_accountholder
          cch_referencedetails: cch_referencedetails
          cch_collectauth: cch_collectauth
          statuscode: statuscode
          statecode: statecode
          cch_accountid: cch_accountid
        distinct: true
    
    - kind: add
      name: add_d365_cchbkacc
      context_name: select_d365_cchbkacc
      params:
        - column: bkvid_d365
          expression: replace(trim(coalesce(cch_bkvid,'')),char(160),'')
        - column: iban_d365
          expression: replace(trim(coalesce(cch_iban,'')),char(160),'')
        - column: bankl_d365
          expression: replace(trim(coalesce(cch_bankkey,'')),char(160),'')
        - column: bankn_d365
          expression: replace(trim(coalesce(cch_number,'')),char(160),'')
        - column: bkont_d365
          expression: replace(trim(coalesce(cch_controlkey,'')),char(160),'')
        - column: koinh_d365
          expression: replace(trim(coalesce(cch_accountholder,'')),char(160),'')
        - column: bkref_d365
          expression: replace(trim(coalesce(cch_referencedetails,'')),char(160),'')
        - column: xezer_d365
          expression: replace(trim(coalesce(cch_collectauth,'')),char(160),'')

    
    - kind: filter
      name: filter_d365_cchbkacc
      context_name: add_d365_cchbkacc
      params:
        - condition: statecode = 0

    - kind: read_dataio
      name: read_d365_acc
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1    

    - kind: select
      name: select_d365_acc
      context_name: read_d365_acc
      params:
        columns:
          id: id
          cch_sapid: cch_sapid
          cch_distributionchannel: cch_distributionchannel
          cch_salesorganizationid: cch_salesorganizationid
          cch_division: cch_division
        distinct: true

    - kind: add
      name: add_d365_acc
      context_name: select_d365_acc
      params:
      - column: partner_d365
        expression: replace(trim(coalesce(cch_sapid,'')),char(160),'')

    - kind: filter
      name: filter_d365_acc
      context_name: add_d365_acc
      params:
        - condition: "statecode = 0 and cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')"

    - kind: read_dataio
      name: read_d365_country
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_country
        schema_version: v1  

    - kind: select
      name: select_d365_country
      context_name: read_d365_country
      params:
        columns:
          id: country_id
          cch_code: country_cch_code
        distinct: true

#################################################################################
    - kind: read_dataio
      name: read_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1
    
    
##  ###################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true
    
##  ###################################################
##   distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true

#############################

    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1
    
    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1
    
    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true        
#######################################################



    - kind: join
      name: join_d365
      context_name: filter_d365_cchbkacc
      params:
        - other:
            select_d365_country
          how:
            inner
          columns:
            cch_countryid: country_id
        - other:
            filter_d365_acc
          how:
            inner
          columns:
            cch_accountid: id
        - other:
            union_cte_distributionchannel
          how:
            inner
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            inner
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id
            
    - kind: filter
      name: filter_d365
      context_name: join_d365
      params:
        - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

            

    - kind: add
      name: add_join_d365
      context_name: filter_d365
      params:
        - column: partner_d365
          expression: replace(trim(coalesce(cch_sapid,'')),char(160),'')
        - column: banks_d365
          expression: replace(trim(coalesce(country_cch_code,'')),char(160),'')
        - column: hash_d365
          expression: >
            md5(concat(
              REPLACE(trim(coalesce(cch_sapid,'')),char(160),''),
              bkvid_d365,
              iban_d365,
              REPLACE(trim(coalesce(country_cch_code,'')),char(160),''),
              bankl_d365,
              bankn_d365,
              bkont_d365,
              koinh_d365,
              bkref_d365,
              xezer_d365
            ))

    - kind: select
      name: d365_checkpoint
      context_name: add_join_d365
      params:
        columns:
          partner_d365: partner_d365
          bkvid_d365: bkvid_d365
          iban_d365: iban_d365
          banks_d365: banks_d365
          bankl_d365: bankl_d365
          bankn_d365: bankn_d365
          bkont_d365: bkont_d365
          koinh_d365: koinh_d365
          bkref_d365: bkref_d365
          xezer_d365: xezer_d365
          hash_d365: hash_d365
        distinct: true

    - kind: checkpoint
      name: d365
      context_name: d365_checkpoint


    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            hash_mdg: hash_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: hash_d365 is null or hash_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          bkvid_mdg: bkvid_mdg
          iban_mdg: iban_mdg
          banks_mdg: banks_mdg
          bankl_mdg: bankl_mdg
          bankn_mdg: bankn_mdg
          bkont_mdg: bkont_mdg
          koinh_mdg: koinh_mdg
          bkref_mdg: bkref_mdg
          xezer_mdg: xezer_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: hash_mdg is null or hash_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          partner_d365: partner_d365
          bkvid_d365: bkvid_d365
          iban_d365: iban_d365
          banks_d365: banks_d365
          bankl_d365: bankl_d365
          bankn_d365: bankn_d365
          bkont_d365: bkont_d365
          koinh_d365: koinh_d365
          bkref_d365: bkref_d365
          xezer_d365: xezer_d365
          hash_d365: hash_d365

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_d365_select
          how:
            full
          columns:
            partner_mdg: partner_d365
            bkvid_mdg: bkvid_d365

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('d365' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_d365
          expression: CASE WHEN partner_d365 IS NULL THEN 'data missing from d365' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string) 

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg_checkpoint
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_d365: partner
          bkvid_d365: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: checkpoint
      name: final_data_missing_from_mdg
      context_name: final_data_missing_from_mdg_checkpoint


    - kind: filter
      name: join_data_missing_from_d365_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_d365 is null

    - kind: select
      name: final_data_missing_from_d365_checkpoint
      context_name: join_data_missing_from_d365_filter
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_d365: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: checkpoint
      name: final_data_missing_from_d365
      context_name: final_data_missing_from_d365_checkpoint


#BANK DETAILS: IBAN
    - kind: filter
      name: bank_details_iban_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND iban_d365 <> iban_mdg

    - kind: add
      name: add_missing_columns_bank_details_iban
      context_name: bank_details_iban_filter
      params:
        - column: attr_name_iban
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND iban_d365 <> iban_mdg THEN concat('BANK DETAILS:',' IBAN') END
        - column: msg_iban
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND iban_d365 <> iban_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_iban
      context_name: add_missing_columns_bank_details_iban
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_iban: msg
          attr_name_iban: attr_name
          iban_d365: tgt_attr
          iban_mdg: src_attr

#BANK DETAILS: Bank Country
    - kind: filter
      name: bank_details_banks_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND banks_d365 <> banks_mdg

    - kind: add
      name: add_missing_columns_bank_details_banks
      context_name: bank_details_banks_filter
      params:
        - column: attr_name_banks
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND banks_d365 <> banks_mdg THEN concat('BANK DETAILS:',' Bank Country') END
        - column: msg_banks
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND banks_d365 <> banks_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_banks
      context_name: add_missing_columns_bank_details_banks
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_banks: msg
          attr_name_banks: attr_name
          banks_d365: tgt_attr
          banks_mdg: src_attr

#BANK DETAILS: Bank Key
    - kind: filter
      name: bank_details_bankl_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankl_d365 <> bankl_mdg

    - kind: add
      name: add_missing_columns_bank_details_bankl
      context_name: bank_details_bankl_filter
      params:
        - column: attr_name_bankl
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankl_d365 <> bankl_mdg THEN concat('BANK DETAILS:',' Bank Key') END
        - column: msg_bankl
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankl_d365 <> bankl_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_bankl
      context_name: add_missing_columns_bank_details_bankl
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_bankl: msg
          attr_name_bankl: attr_name
          bankl_d365: tgt_attr
          bankl_mdg: src_attr

#BANK DETAILS: Bank Account
    - kind: filter
      name: bank_details_bankn_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankn_d365 <> bankn_mdg

    - kind: add
      name: add_missing_columns_bank_details_bankn
      context_name: bank_details_bankn_filter
      params:
        - column: attr_name_bankn
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankn_d365 <> bankn_mdg THEN concat('BANK DETAILS:',' Bank Account') END
        - column: msg_bankn
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bankn_d365 <> bankn_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_bankn
      context_name: add_missing_columns_bank_details_bankn
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          src_system: src_system
          tgt_system: tgt_system
          msg_bankn: msg
          attr_name_bankn: attr_name
          bankn_d365: tgt_attr
          bankn_mdg: src_attr

#BANK DETAILS: Bank Control Key
    - kind: filter
      name: bank_details_bkont_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bkont_d365 <> bkont_mdg

    - kind: add
      name: add_missing_columns_bank_details_bkont
      context_name: bank_details_bkont_filter
      params:
        - column: attr_name_bkont
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bkont_d365 <> bkont_mdg THEN concat('BANK DETAILS:',' Bank Control Key') END
        - column: msg_bkont
          expression: CASE WHEN partner_mdg = partner_d365 AND bkvid_mdg = bkvid_d365 AND bkont_d365 <> bkont_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_bkont
      context_name: add_missing_columns_bank_details_bkont
      params:
        columns:
          partner_mdg: partner
