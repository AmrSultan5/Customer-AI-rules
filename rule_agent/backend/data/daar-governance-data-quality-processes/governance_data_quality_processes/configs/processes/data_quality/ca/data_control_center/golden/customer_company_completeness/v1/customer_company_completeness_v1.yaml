#SELECT rccomp_12_1
  - kind: select
    name: select_rccomp_12_1
    context_name: join_dca_dcg
    params:
      columns:
        customer_code: customer_code
        customer_code_dca: customer_code_dca
        central_order_block_code: central_order_block_code
        legal_name: legal_name
        legal_name_dca: legal_name_dca
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_legal_name_dca
    params:
      - aggs:
          legal_name_dca: max
        by:
        - customer_code_dca
        - sap_cluster

  - kind: select
    name: select_gr_max
    params:
      columns:
        customer_code_dca: customer_code_dca_max
        max_legal_name_dca: max_legal_name_dca
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dca_max
    context_name: select_rccomp_12_1
    params:
      - other:
          select_gr_max
        how:
          inner
        columns:
          customer_code: customer_code_dca_max
          sap_cluster: sap_cluster

  - kind: add
    name: add_rccomp_12_1
    params:
      - column: rule_code
        expression: "'RCCOMP_12.1'"
      - column: check_status
        expression: if(central_order_block_code in('E', 'G', 'SP', 'R', 'U'), '', if(isnull(coalesce(if(if(legal_name = '-1', null, legal_name) = '-1', null, legal_name), if(max_legal_name_dca = '-1', null, max_legal_name_dca))) 
                    or coalesce(if(if(legal_name = '-1', null, legal_name) = '-1', null, legal_name), if(max_legal_name_dca = '-1', null, max_legal_name_dca)) = '' 
                    or (len(coalesce(if(if(legal_name = '-1', null, legal_name) = '-1', null, legal_name), if(max_legal_name_dca = '-1', null, max_legal_name_dca))) <= 2 
                    and regexp(coalesce(if(if(legal_name = '-1', null, legal_name) = '-1', null, legal_name), if(max_legal_name_dca = '-1', null, max_legal_name_dca)), '[0-9A-Za-zا-ي]') = false), '0',
                    '1'))  
      - column: value_checked
        expression: coalesce(if(if(legal_name = '-1', null, legal_name) = '-1', null, legal_name), if(max_legal_name_dca = '-1', null, max_legal_name_dca)) 
        overwrite: true  

  - kind: select
    name: select_rccomp_12_1_final
    context_name: add_rccomp_12_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true

#SELECT rccomp_13_1
  - kind: select
    name: select_rccomp_13_1
    context_name: join_dca_dcg
    params:
      columns:
        customer_code: customer_code
        customer_code_dca: customer_code_dca
        name_above_door: name_above_door
        name_above_door_dca: name_above_door_dca
        central_order_block_code: central_order_block_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_name_above_door_dca
    params:
      - aggs:
          name_above_door_dca: max
        by:
        - customer_code_dca
        - sap_cluster

  - kind: select
    name: select_gr_max_door
    params:
      columns:
        customer_code_dca: customer_code_dca_max
        max_name_above_door_dca: max_name_above_door_dca
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dca_max
    context_name: select_rccomp_13_1
    params:
      - other:
          select_gr_max_door
        how:
          left
        columns:
          customer_code: customer_code_dca_max
          sap_cluster: sap_cluster

  - kind: add
    name: add_rccomp_13_1
    params:
      - column: rule_code
        expression: "'RCCOMP_13.1'"
      - column: check_status
        expression: if(isnull(coalesce(if(name_above_door = '-1', null, name_above_door), if(max_name_above_door_dca = '-1', null, max_name_above_door_dca))) 
                    or coalesce(if(name_above_door = '-1', null, name_above_door), if(max_name_above_door_dca = '-1', null, max_name_above_door_dca)) = '' 
                    or (len(coalesce(if(name_above_door = '-1', null, name_above_door), if(max_name_above_door_dca = '-1', null, max_name_above_door_dca))) <= 2 
                    and regexp(coalesce(if(name_above_door = '-1', null, name_above_door), if(max_name_above_door_dca = '-1', null, max_name_above_door_dca)), '[0-9A-Za-zا-ي]') = false), '0',
                    '1')   
      - column: value_checked
        expression: coalesce(if(name_above_door = '-1', null, name_above_door), if(max_name_above_door_dca = '-1', null, max_name_above_door_dca)) 
        overwrite: true  

  - kind: select
    name: select_rccomp_13_1_final
    context_name: add_rccomp_13_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true

      
