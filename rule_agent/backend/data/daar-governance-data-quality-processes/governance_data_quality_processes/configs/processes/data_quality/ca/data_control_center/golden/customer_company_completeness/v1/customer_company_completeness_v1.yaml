#SELECT rccomp_52_2
  - kind: select
    name: select_rccomp_52_2
    context_name: join_cts_dcg
    params:
      columns:
        country_code: country_code
        country_code_conf: country_code_conf
        customer_code: customer_code
        tax_0: tax_0
        tax_1: tax_1
        tax_2: tax_2
        tax_3: tax_3
        tax_0_value: tax_0_value
        tax_1_value: tax_1_value
        tax_2_value: tax_2_value
        tax_3_value: tax_3_value
        legal_form_code: legal_form_code
      distinct: true

  - kind: add
    name: add_rccomp_52_2
    context_name: select_rccomp_52_2
    params:
      - column: rule_code
        expression: "'RCCOMP_52.2'"
      - column: check_status
        expression: "CASE WHEN legal_form_code like 'X%' THEN '' 
                    WHEN (tax_3_value is null OR tax_3_value = '') 
                    AND (tax_2_value is null OR tax_2_value = '') 
                    AND (tax_0_value is null OR tax_0_value = '') 
                    AND (tax_1_value is null OR tax_1_value = '') 
                    THEN '0' ELSE '1' END"
      - column: t0
        expression: "CASE WHEN tax_0_value is null OR tax_0_value = '' THEN 'NULL_' ELSE tax_0_value||'_' END"
      - column: t1
        expression: "CASE WHEN tax_1_value is null OR tax_1_value = '' THEN 'NULL_' ELSE tax_1_value||'_' END"
      - column: t2
        expression: "CASE WHEN tax_2_value is null OR tax_2_value = '' THEN 'NULL_' ELSE tax_2_value END"
      - column: t3
        expression: "CASE WHEN tax_3_value is null OR tax_3_value = '' THEN 'NULL' ELSE tax_3_value END"
      - column: value_checked
        expression: "t0||t1||t2||t3"

  - kind: select
    name: select_rccomp_52_2_final
    context_name: add_rccomp_52_2
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true

