# rccomp_149_1
  - kind: select
    context_name: select_dcp
    name: select_rccomp_149_1_cp
    params:
      columns:
        customer_code: customer_code_cp
        partner_function_code: partner_function_code_cp
        partner_code: partner_code_cp
        sap_cluster: sap_cluster_cp
      distinct: true

  - kind: group
    name: aggregation_rccomp_149_1_cp
    context_name: select_rccomp_149_1_cp
    params:
      - aggs:
          partner_code_cp: min
        by:
        - customer_code_cp
        - partner_function_code_cp
        - sap_cluster_cp

  - kind: add
    name: add_rccomp_149_1_counter
    context_name: aggregation_rccomp_149_1_cp
    params:
      - column: exist_flag
        expression: if(min_partner_code_cp is null or min_partner_code_cp = '', 0, 1)

  - kind: join
    name: join_rccomp_149_1
    context_name: select_dcg
    params:
      - other:
          select_dcp
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          add_rccomp_149_1_counter
        how:
          left
        columns:
          customer_code: customer_code_cp
          partner_function_code: partner_function_code_cp
          sap_cluster: sap_cluster_cp

#SELECT rccomp_149_1
  - kind: filter
    name: filter_rccomp_149_1_cp
    context_name: join_rccomp_149_1
    params:
      - condition:
          division_code_dcp = '01' and distribution_channel_code_dcp = '01'
          and partner_function_code in('AG', 'RE', 'RG', 'WE', 'ZY', 'YR')

  - kind: select
    name: select_pfc
    context_name: filter_rccomp_149_1_cp
    params:
      columns:
        partner_function_code: partner_function_code_pfc
      distinct: true

  - kind: add
    name: add_dummy_pfc
    context_name: select_pfc
    params:
      - column: dummy_pfc
        expression: "'1'"

  - kind: select
    name: select_cc
    context_name: filter_rccomp_149_1_cp
    params:
      columns:
        customer_code: customer_code_cc
      distinct: true

  - kind: add
    name: add_dummy_cc
    context_name: select_cc
    params:
      - column: dummy_cc
        expression: "'1'"

  - kind: join
    name: join_cc_pfc
    context_name:  add_dummy_cc
    params:
      - other:
           add_dummy_pfc
        how:
          inner
        columns:
          dummy_cc: dummy_pfc

  - kind: select
    name: select_rccomp_149_1
    context_name: filter_rccomp_149_1_cp
    params:
      columns:
        customer_code: customer_code
        account_group_code: account_group_code
        central_order_block_code: central_order_block_code
        partner_code: partner_code
        partner_function_code: partner_function_code
        partner_function_code_alternative: partner_function_code_alternative
        exist_flag: exist_flag
      distinct: true

  - kind: join
    name: join_pfc
    context_name: select_rccomp_149_1
    params:
      - other:
           join_cc_pfc
        how:
          inner
        columns:
          customer_code: customer_code_cc

  - kind: checkpoint
    name: checkpoint_join_pfc
    context_name: join_pfc

  - kind: add
    name: add_check_pfc
    context_name: checkpoint_join_pfc
    params:
      - column: check_pfc
        expression: if(partner_function_code = partner_function_code_pfc, '1', '0')

  - kind: select
    name: select_rccomp_149_1_pfc
    context_name: add_check_pfc
    params:
      columns:
        customer_code: customer_code
        partner_function_code_pfc: partner_function_code
        exist_flag: exist_flag
        check_pfc: check_pfc
      distinct: true

  - kind: group
    name: aggregation_pfc
    context_name: select_rccomp_149_1_pfc
    params:
      - aggs:
          check_pfc: max
        by:
        - customer_code
        - partner_function_code
        - exist_flag

  - kind: select
    name: select_rccomp_149_1
    context_name: filter_rccomp_149_1_cp
    params:
      columns:
        customer_code: customer_code
        account_group_code: account_group_code
        central_order_block_code: central_order_block_code
        partner_code: partner_code
        partner_function_code: partner_function_code
        partner_function_code_alternative: partner_function_code_alternative
      distinct: true

  - kind: join
    name: join_final_149_1
    context_name: aggregation_pfc
    params:
      - other:
           select_rccomp_149_1
        how:
          left
        columns:
          customer_code: customer_code
          partner_function_code: partner_function_code

  - kind: add
    name: add_rccomp_149_1
    context_name: join_final_149_1
    params:
      - column: rule_code
        expression: "'RCCOMP_149.1'"
      - column: check_status
        expression: if(account_group_code not like '90%' 
                    or central_order_block_code IN ('S', 'SP', 'E', 'G', 'S2', 'S3', 'S4', 'S5', 'S9', 'R', 'U', 'S1','SY',' IA','IB','RN'), '',
                    if((exist_flag = '1' and max_check_pfc = '1') = false and partner_function_code_alternative in('ZY', 'YR', 'SH', 'PY', 'BP', 'SP'), '0', '1'))
      - column: check_value
        expression: if(check_status = '0', 'Missing Partner function:' || ' ' || partner_function_code, partner_function_code||'_'||partner_code)

  - kind: select
    name: select_rccomp_149_1_final
    context_name: add_rccomp_149_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        check_value: value_checked
      distinct: true

