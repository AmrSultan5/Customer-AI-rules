      name: select_sap_cc_agg
      context_name: select_sap_cc
      params:
        columns:
          partner_sap_cc: partner_sap_cc
          partner_guid_sap_cc: partner_guid_sap_cc
          country_sap_cc: country_sap_cc
        distinct: true

    - kind: add
      name: add_missing_columns_sap_cc_agg
