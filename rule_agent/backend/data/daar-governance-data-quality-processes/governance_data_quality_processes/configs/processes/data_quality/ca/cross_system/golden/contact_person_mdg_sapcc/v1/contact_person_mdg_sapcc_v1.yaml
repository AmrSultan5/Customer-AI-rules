    - kind: group
      name: group_sap_cc_agg
      context_name: add_missing_columns_sap_cc_agg
      params:
        - aggs:
            partner_guid_concat: count
          by:
          - country_sap_cc
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_sap_cc_agg_final
