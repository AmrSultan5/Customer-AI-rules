    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1
  
    - kind: select
      name: select_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_kna1
          ktokd: ktokd_kna1
          aufsd: aufsd_kna1
  
    - kind: read_dataio
      name: read_t077x
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t077x
        schema_version: v1
  
    - kind: filter
      name: filter_t077x
      params:
        - condition:
            spras = 'E' and sap_cluster = 'CL1'
  
    - kind: select
      name: select_t077x
      params:
        columns:
          ktokd: ktokd_t077x
          txt30: txt30_t077x
        distinct: true
  
    - kind: read_dataio
      name: read_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
  
    - kind: filter
      name: filter_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01'
  
    - kind: select
      name: select_knvv
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          vkorg: vkorg_knvv
          kvgr4: kvgr4_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
  
    - kind: read_dataio
      name: read_tvv4t
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: tvv4t
        schema_version: v1
  
    - kind: filter
      name: filter_tvv4t
      params:
        - condition:
           sap_cluster = 'CL1' and spras = 'E'
  
    - kind: select
      name: select_tvv4t
      params:
        columns:
          kvgr4: kvgr4_tvv4t
          bezei: bezei_tvv4t
        distinct: true

    - kind: join
      name: join_final
      context_name: union_comparison
      params:
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            left
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_knvv
          how:
            left
          columns:
            kunnr_kna1: kunnr_knvv
        - other:
            select_tvv4t
          how:
            left
          columns:
            kvgr4_knvv: kvgr4_tvv4t
  
    - kind: filter
      name: filter_final
      params:
        - condition:
            aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','') and vkorg_knvv in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: add
      name: add_final_columns
      context_name: filter_final
      params:
        - column: attribute10
          expression: concat(ktokd_kna1, ' - ', txt30_t077x)
        - column: attribute5
          expression: concat(kvgr4_knvv, ' - ', bezei_tvv4t)
        - column: country
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
                           WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
                           WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
                           WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
                           WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
                           WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
                           WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
                           WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
                           WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
                           WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
                           WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
                           WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
                           WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
                           WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
                           WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
                           WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
                           WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
                           WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
                           WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
                           WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
                           WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
                           WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
                           WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
                           WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
                           WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
                           WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
                           WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
                           WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
                           WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END
        - column: domain
          expression: '''CUSTOMER'''
        - column: table_name
          expression: '''MDG SAP CC'''
        - column: null_value
          expression: cast(NULL as string)
        - column: loading_date
          expression: current_date()
        - column: attribute3
          expression: src_id

    - kind: select
      name: select_final
      context_name: add_final_columns
      params:
        columns:
          domain: domain
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          msg: dimension
          partner: primary_key_l1
          src_id: primary_key_src_l2
          tgt_id: primary_key_tgt_l2
          null_value: primary_key_src_l3
          null_value: primary_key_tgt_l3
          null_value: attribute1
          null_value: attribute2
          attribute3: attribute3
          aufsd_kna1: attribute4
          attribute5: attribute5
          vkorg_knvv: attribute6
          vtweg_knvv: attribute7
          spart_knvv: attribute8
          null_value: attribute9
          attribute10: attribute10
          country: country
          attr_name: compared_attribute
          src_attr: compared_src_attr_value
          tgt_attr: compared_tgt_attr_value
          loading_date: loading_date

    - kind: write_dataio
      name: write_shipping_data
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          layer: application
          storage_id: "{{dataio.storage_id}}"
        application_name: data_quality
        country: ca
        module: cross_system
        namespace: golden
        object_name: reconciliation_results
        process_run_id: "{{process_run_id}}"
        schema_version: v1
        refresh_mode: partition
        convert_to_target_schema: True

## agg ##
### mdg ###
    - kind: select
      name: select_mdg_agg
      context_name: select_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          partner_guid_mdg: partner_guid_mdg
          country_mdg: country_mdg
        distinct: true

    - kind: add
      name: add_missing_columns_mdg_agg
      context_name: select_mdg_agg
      params:
        - column: table_name
          expression: cast('MDG SAP CC' as string)
        - column: tgt_system
          expression: cast('mdg' as string)
        - column: src_system
          expression: cast('sap cc' as string)
        - column: dimension
          expression: cast('TOTAL COUNT' as string)
        - column: loading_date
          expression: CURRENT_DATE
        - column: partner_guid_concat
          expression: concat(partner_mdg,partner_guid_mdg)

    - kind: group
      name: group_mdg_agg
      context_name: add_missing_columns_mdg_agg
      params:
        - aggs:
            partner_guid_concat: count
          by:
          - country_mdg
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_mdg_agg_final
      context_name: group_mdg_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_partner_guid_concat: cnt
          country_mdg: country
          loading_date: loading_date
        distinct: true
