#GROUP 1 ACCURACY

  - kind: add
    name: add_aggregated_group_1_accuracy
    context_name: select_du_group_1_accuracy
    params:
     - column: total_records
       expression: IF(customer_code != '', 1, NULL)
     - column: total_checks
       expression: IF(customer_code != '', 1, NULL)
     - column: group_number
       expression: '"Group 1"'
     - column: quality_category
       expression: '"Accuracy"'
     - column: invalid_records
       expression: IF(order_block_cooler_status_check_flag  = '0' OR placement_not_allowed_check_flag = '0', 1, NULL)

  - kind: group
    name: group_group_1_accuracy
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_records: count
        by:
        - country_code
        - group_number
        - quality_category

  - kind: select
    name: select_group_1_accuracy
    params:
      columns:
        country_code: country_code
        count_total_records: total_records
        count_total_checks: total_checks
        group_number: group_number
        quality_category: quality_category
        count_invalid_records: invalid_records
      distinct: true

