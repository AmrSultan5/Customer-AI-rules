#READ CHECK NAMES AND NUMBERS
  - kind: read_dataio
    name: read_check_names_and_numbers
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: master_data_quality
      object_name: check_names_and_numbers
      schema_version: v1

  - kind: select
    name: select_check_names_and_numbers
    params:
      columns:
        check_number: check_number
        measure: measure
        check_name: check_name
        output_message: output_message
        idq_group: idq_group
        matrix_label_pbi: matrix_label_pbi
        sorting_order: sorting_order
      distinct: true

#JOIN WITH CHECK_NAMES_AND_NUMBERS TABLE
  - kind: join
    name: join_union_check_names_and_numbers
    context_name: select_union_all
    params:
      - other:
          select_check_names_and_numbers
        how:
          left
        columns:
          quality_category: measure
          group_number: idq_group

  - kind: add
    name: add_loading_date
    params:
      - column: loading_date
        expression: current_date()

  - kind: select
    name: select_aggregated
    params:
      columns:
        country_code: country_code
        total_records: total_records
        total_checks: total_checks
        group_number: group_number
        quality_category: quality_category
        invalid_records: invalid_checks
        loading_date: loading_date
        sorting_order: sorting_order
        matrix_label_pbi: group_name
      distinct: true

  - kind: cast
    name: cast_to_integer
    params:
      - column: total_records
        to: integer
      - column: total_checks
        to: integer
      - column: invalid_checks
        to: integer

  - kind: add
    name: add_upper_country
    params:
     - column: country_code
       expression: UPPER(country_code)
       overwrite: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: coolers_critical_md_checks
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
