        order_block_cooler_status_check_flag: order_block_cooler_status_check_flag
        placement_not_allowed_check_flag: placement_not_allowed_check_flag
        cde_category_if_blank_check_flag: cde_category_if_blank_check_flag
        doors_equivalent_if_blank_check_flag: doors_equivalent_if_blank_check_flag
