transform:
  name: Unloading_points_mdg_d365
  operations:

    - kind: read_dataio
      name: read_mdg_knva
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knva
        schema_version: v1

    - kind: select
      name: select_mdg_knva
      context_name: read_mdg_knva
      params:
        columns:
          KUNNR: KUNNR_mdg_knva
          ablad: ablad_mdg_knva
          KNFAK: KNFAK_mdg_knva
          MOAB1: MOAB1_mdg_knva
          MOAB2: MOAB2_mdg_knva
          DIAB1: DIAB1_mdg_knva
          DIAB2: DIAB2_mdg_knva
          MIAB1: MIAB1_mdg_knva
          MIAB2: MIAB2_mdg_knva
          DOAB1: DOAB1_mdg_knva
          DOAB2: DOAB2_mdg_knva
          FRAB1: FRAB1_mdg_knva
          FRAB2: FRAB2_mdg_knva
          SAAB1: SAAB1_mdg_knva
          SAAB2: SAAB2_mdg_knva
          SOAB1: SOAB1_mdg_knva
          SOAB2: SOAB2_mdg_knva
          MOBI1: MOBI1_mdg_knva
          MOBI2: MOBI2_mdg_knva
          DIBI1: DIBI1_mdg_knva
          DIBI2: DIBI2_mdg_knva
          MIBI1: MIBI1_mdg_knva
          MIBI2: MIBI2_mdg_knva
          DOBI1: DOBI1_mdg_knva
          DOBI2: DOBI2_mdg_knva
          FRBI1: FRBI1_mdg_knva
          FRBI2: FRBI2_mdg_knva
          SABI1: SABI1_mdg_knva
          SABI2: SABI2_mdg_knva
          SOBI1: SOBI1_mdg_knva
          SOBI2: SOBI2_mdg_knva
        distinct: true

    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv
      context_name: read_mdg_knvv
      params:
        - condition: vtweg = '01' AND spart = '01' and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)
    
    - kind: select
      name: select_mdg_knvv_checkpoint
      context_name: filter_knvv
      params:
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_mdg_knvv_checkpoint

    - kind: join
      name: join_mdg
      context_name: select_mdg_knva
      params:
        - other:
            select_mdg_but000
          how:
            inner
          columns:
            KUNNR_mdg_knva: partner_mdg_but000
        - other:
            select_mdg_knvv
          how:
            inner
          columns:
            partner_mdg_but000: kunnr_knvv  
            
            

    - kind: filter
      name: filter_join_mdg
      context_name: join_mdg
      params:
        - condition:
            xpcpt_mdg_but000 <>'X' AND ablad_mdg_knva <> '' AND KUNNR_mdg_knva like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')
 
    - kind: add
      name: add_mdg_HASH
      context_name: filter_join_mdg
      params:
      - column: openmonday1_mdg
        expression: concat(substr(MOAB1_mdg_knva,0,2),':', substr(MOAB1_mdg_knva,3,2),':', substr(MOAB1_mdg_knva,5,2))
      - column: openmonday2_mdg
        expression: concat(substr(MOAB2_mdg_knva,0,2),':', substr(MOAB2_mdg_knva,3,2),':', substr(MOAB2_mdg_knva,5,2))
      - column: opentuesday1_mdg
        expression: concat(substr(DIAB1_mdg_knva,0,2),':', substr(DIAB1_mdg_knva,3,2),':', substr(DIAB1_mdg_knva,5,2))
      - column: opentuesday2_mdg
        expression: concat(substr(DIAB2_mdg_knva,0,2),':', substr(DIAB2_mdg_knva,3,2),':', substr(DIAB2_mdg_knva,5,2))
      - column: openwednesday1_mdg
        expression: concat(substr(MIAB1_mdg_knva,0,2),':', substr(MIAB1_mdg_knva,3,2),':', substr(MIAB1_mdg_knva,5,2))
      - column: openwednesday2_mdg
        expression: concat(substr(MIAB2_mdg_knva,0,2),':', substr(MIAB2_mdg_knva,3,2),':', substr(MIAB2_mdg_knva,5,2))
      - column: openthursday1_mdg
        expression: concat(substr(DOAB1_mdg_knva,0,2),':', substr(DOAB1_mdg_knva,3,2),':', substr(DOAB1_mdg_knva,5,2))
      - column: openthursday2_mdg
        expression: concat(substr(DOAB2_mdg_knva,0,2),':', substr(DOAB2_mdg_knva,3,2),':', substr(DOAB2_mdg_knva,5,2))
      - column: openfriday1_mdg
        expression: concat(substr(FRAB1_mdg_knva,0,2),':', substr(FRAB1_mdg_knva,3,2),':', substr(FRAB1_mdg_knva,5,2))
      - column: openfriday2_mdg
        expression: concat(substr(FRAB2_mdg_knva,0,2),':', substr(FRAB2_mdg_knva,3,2),':', substr(FRAB2_mdg_knva,5,2))
      - column: opensaturday1_mdg
        expression: concat(substr(SAAB1_mdg_knva,0,2),':', substr(SAAB1_mdg_knva,3,2),':', substr(SAAB1_mdg_knva,5,2))
      - column: opensaturday2_mdg
        expression: concat(substr(SAAB2_mdg_knva,0,2),':', substr(SAAB2_mdg_knva,3,2),':', substr(SAAB2_mdg_knva,5,2))
      - column: opensunday1_mdg
        expression: concat(substr(SOAB1_mdg_knva,0,2),':', substr(SOAB1_mdg_knva,3,2),':', substr(SOAB1_mdg_knva,5,2))
      - column: opensunday2_mdg
        expression: concat(substr(SOAB2_mdg_knva,0,2),':', substr(SOAB2_mdg_knva,3,2),':', substr(SOAB2_mdg_knva,5,2))
      - column: closemonday1_mdg
        expression: concat(substr(MOBI1_mdg_knva,0,2),':', substr(MOBI1_mdg_knva,3,2),':', substr(MOBI1_mdg_knva,5,2))
      - column: closemonday2_mdg
        expression: concat(substr(MOBI2_mdg_knva,0,2),':', substr(MOBI2_mdg_knva,3,2),':', substr(MOBI2_mdg_knva,5,2))
      - column: closetuesday1_mdg
        expression: concat(substr(DIBI1_mdg_knva,0,2),':', substr(DIBI1_mdg_knva,3,2),':', substr(DIBI1_mdg_knva,5,2))
      - column: closetuesday2_mdg
        expression: concat(substr(DIBI2_mdg_knva,0,2),':', substr(DIBI2_mdg_knva,3,2),':', substr(DIBI2_mdg_knva,5,2))
      - column: closewednesday1_mdg
        expression: concat(substr(MIBI1_mdg_knva,0,2),':', substr(MIBI1_mdg_knva,3,2),':', substr(MIBI1_mdg_knva,5,2))
      - column: closewednesday2_mdg
        expression: concat(substr(MIBI2_mdg_knva,0,2),':', substr(MIBI2_mdg_knva,3,2),':', substr(MIBI2_mdg_knva,5,2))
      - column: closethursday1_mdg
        expression: concat(substr(DOBI1_mdg_knva,0,2),':', substr(DOBI1_mdg_knva,3,2),':', substr(DOBI1_mdg_knva,5,2))
      - column: closethursday2_mdg
        expression: concat(substr(DOBI2_mdg_knva,0,2),':', substr(DOBI2_mdg_knva,3,2),':', substr(DOBI2_mdg_knva,5,2))
      - column: closefriday1_mdg
        expression: concat(substr(FRBI1_mdg_knva,0,2),':', substr(FRBI1_mdg_knva,3,2),':', substr(FRBI1_mdg_knva,5,2))
      - column: closefriday2_mdg
        expression: concat(substr(FRBI2_mdg_knva,0,2),':', substr(FRBI2_mdg_knva,3,2),':', substr(FRBI2_mdg_knva,5,2))
      - column: closesaturday1_mdg
        expression: concat(substr(SABI1_mdg_knva,0,2),':', substr(SABI1_mdg_knva,3,2),':', substr(SABI1_mdg_knva,5,2))
      - column: closesaturday2_mdg
        expression: concat(substr(SABI2_mdg_knva,0,2),':', substr(SABI2_mdg_knva,3,2),':', substr(SABI2_mdg_knva,5,2))
      - column: closesunday1_mdg
        expression: concat(substr(SOBI1_mdg_knva,0,2),':', substr(SOBI1_mdg_knva,3,2),':', substr(SOBI1_mdg_knva,5,2))
      - column: closesunday2_mdg
        expression: concat(substr(SOBI2_mdg_knva,0,2),':', substr(SOBI2_mdg_knva,3,2),':', substr(SOBI2_mdg_knva,5,2))


    - kind: add
      name: add_mdg_HASH
      context_name: add_mdg_HASH
      params:
      - column: HASH_mdg
        expression:
          MD5(CONCAT(KUNNR_mdg_knva, ablad_mdg_knva, knfak_mdg_knva, openmonday1_mdg, openmonday2_mdg, opentuesday1_mdg, opentuesday2_mdg, openwednesday1_mdg, openwednesday2_mdg, openthursday1_mdg, openthursday2_mdg, openfriday1_mdg, openfriday2_mdg, opensaturday1_mdg, opensaturday2_mdg, opensunday1_mdg, opensunday2_mdg, closemonday1_mdg, closemonday2_mdg, closetuesday1_mdg, closetuesday2_mdg, closewednesday1_mdg, closewednesday2_mdg, closethursday1_mdg, closethursday2_mdg, closefriday1_mdg, closefriday2_mdg, closesaturday1_mdg, closesaturday2_mdg, closesunday1_mdg, closesunday2_mdg))

    - kind: select
      name: mdg_checkpoint
      context_name: add_mdg_HASH
      params:
        columns:
          KUNNR_mdg_knva: partner_mdg
          ablad_mdg_knva: unloading_points_mdg
          knfak_mdg_knva: factory_calendar_mdg
          openmonday1_mdg: openmonday1_mdg
          openmonday2_mdg: openmonday2_mdg
          opentuesday1_mdg: opentuesday1_mdg
          opentuesday2_mdg: opentuesday2_mdg
          openwednesday1_mdg: openwednesday1_mdg
          openwednesday2_mdg: openwednesday2_mdg
          openthursday1_mdg: openthursday1_mdg
          openthursday2_mdg: openthursday2_mdg
          openfriday1_mdg: openfriday1_mdg
          openfriday2_mdg: openfriday2_mdg
          opensaturday1_mdg: opensaturday1_mdg
          opensaturday2_mdg: opensaturday2_mdg
          opensunday1_mdg: opensunday1_mdg
          opensunday2_mdg: opensunday2_mdg
          closemonday1_mdg: closemonday1_mdg
          closemonday2_mdg: closemonday2_mdg
          closetuesday1_mdg: closetuesday1_mdg
          closetuesday2_mdg: closetuesday2_mdg
          closewednesday1_mdg: closewednesday1_mdg
          closewednesday2_mdg: closewednesday2_mdg
          closethursday1_mdg: closethursday1_mdg
          closethursday2_mdg: closethursday2_mdg
          closefriday1_mdg: closefriday1_mdg
          closefriday2_mdg: closefriday2_mdg
          closesaturday1_mdg: closesaturday1_mdg
          closesaturday2_mdg: closesaturday2_mdg
          closesunday1_mdg: closesunday1_mdg
          closesunday2_mdg: closesunday2_mdg
          HASH_mdg: HASH_mdg
        distinct: true

    - kind: checkpoint
      name: mdg
      context_name: mdg_checkpoint

    #d365
    - kind: read_dataio
      name: read_d365_cchunloadp  
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_unloadingpoints
        schema_version: v1

    - kind: select
      name: select_d365_cchunloadp
      context_name: read_d365_cchunloadp
      params:
        columns:
          cch_factorycalendarid: cch_factorycalendaridname
          cch_name: cch_name
          cch_openmonday1: cch_openmonday1
          cch_openmonday2: cch_openmonday2
          cch_opentuesday1: cch_opentuesday1
          cch_opentuesday2: cch_opentuesday2
          cch_openwednesday1: cch_openwednesday1
          cch_openwednesday2: cch_openwednesday2
          cch_openthursday1: cch_openthursday1
          cch_openthursday2: cch_openthursday2
          cch_openfriday1: cch_openfriday1
          cch_openfriday2: cch_openfriday2
          cch_opensaturday1: cch_opensaturday1
          cch_opensaturday2: cch_opensaturday2
          cch_opensunday1: cch_opensunday1
          cch_opensunday2: cch_opensunday2
          cch_closemonday1: cch_closemonday1
          cch_closemonday2: cch_closemonday2
          cch_closetuesday1: cch_closetuesday1
          cch_closetuesday2: cch_closetuesday2
          cch_closewednesday1: cch_closewednesday1
          cch_closewednesday2: cch_closewednesday2
          cch_closethursday1: cch_closethursday1
          cch_closethursday2: cch_closethursday2
          cch_closefriday1: cch_closefriday1
          cch_closefriday2: cch_closefriday2
          cch_closesaturday1: cch_closesaturday1
          cch_closesaturday2: cch_closesaturday2
          cch_closesunday1: cch_closesunday1
          cch_closesunday2: cch_closesunday2
          statuscode: statuscode
          statecode: statecode
          cch_accountid: cch_accountid
        distinct: true
    
    - kind: add
      name: add_d365_cchunloadp
      context_name: select_d365_cchunloadp
      params:
        - column: unloading_points_d365
          expression: TRIM(cch_name)
        - column: openmonday1_d365
          expression: concat(cch_openmonday1, ':00')
        - column: openmonday2_d365
          expression: concat(cch_openmonday2, ':00')
        - column: opentuesday1_d365
          expression: concat(cch_opentuesday1, ':00')
        - column: opentuesday2_d365
          expression: concat(cch_opentuesday2, ':00')
        - column: openwednesday1_d365
          expression: concat(cch_openwednesday1, ':00')
        - column: openwednesday2_d365
          expression: concat(cch_openwednesday2, ':00')
        - column: openthursday1_d365
          expression: concat(cch_openthursday1, ':00')
        - column: openthursday2_d365
          expression: concat(cch_openthursday2, ':00')
        - column: openfriday1_d365
          expression: concat(cch_openfriday1, ':00')
        - column: openfriday2_d365
          expression: concat(cch_openfriday2, ':00')
        - column: opensaturday1_d365
          expression: concat(cch_opensaturday1, ':00')
        - column: opensaturday2_d365
          expression: concat(cch_opensaturday2, ':00')
        - column: opensunday1_d365
          expression: concat(cch_opensunday1, ':00')
        - column: opensunday2_d365
          expression: concat(cch_opensunday2, ':00')
        - column: closemonday1_d365
          expression: concat(cch_closemonday1, ':00')
        - column: closemonday2_d365
          expression: concat(cch_closemonday2, ':00')
        - column: closetuesday1_d365
          expression: concat(cch_closetuesday1, ':00')
        - column: closetuesday2_d365
          expression: concat(cch_closetuesday2, ':00')
        - column: closewednesday1_d365
          expression: concat(cch_closewednesday1, ':00')
        - column: closewednesday2_d365
          expression: concat(cch_closewednesday2, ':00')
        - column: closethursday1_d365
          expression: concat(cch_closethursday1, ':00')
        - column: closethursday2_d365
          expression: concat(cch_closethursday2, ':00')
        - column: closefriday1_d365
          expression: concat(cch_closefriday1, ':00')
        - column: closefriday2_d365
          expression: concat(cch_closefriday2, ':00')
        - column: closesaturday1_d365
          expression: concat(cch_closesaturday1, ':00')
        - column: closesaturday2_d365
          expression: concat(cch_closesaturday2, ':00')
        - column: closesunday1_d365
          expression: concat(cch_closesunday1, ':00')
        - column: closesunday2_d365
          expression: concat(cch_closesunday2, ':00')
    
    - kind: filter
      name: filter_d365_cchunloadp
      context_name: add_d365_cchunloadp
      params:
        - condition: statecode = 0

    - kind: read_dataio
      name: read_d365_acc
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1    

    - kind: select
      name: select_d365_acc
      context_name: read_d365_acc
      params:
        columns:
          id: id
          cch_sapid: cch_sapid
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          cch_salesorganizationid: cch_salesorganizationid
        distinct: true

    - kind: filter
      name: filter_d365_acc
      context_name: select_d365_acc
      params:
        - condition: "cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')"

##########################################################################################
############################################################

    - kind: read_dataio
      name: read_d365_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1
      
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_d365_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true
    
#   ###################################################
#    distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_d365_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true


    - kind: read_dataio
      name: read_d365_cch_country
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_country
        schema_version: v1    

    - kind: select
      name: filter_country
      context_name: read_d365_cch_country
      params:
        columns:
          id: cd_id
          cch_code: cd_cch_code
        distinct: true

    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1
    
    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1
    
    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true

    - kind: join
      name: join_d365
      context_name: filter_d365_cchunloadp
      params:
        - other:
            filter_d365_acc
          how:
            inner
          columns:
            cch_accountid: id
        - other:
            union_cte_distributionchannel
          how:
            inner
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            inner
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            filter_country
          how:
            inner
          columns:
            cch_factorycalendaridname: cd_id
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id

    - kind: filter
      name: filter_d365
      context_name: join_d365
      params:
        - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

    - kind: add
      name: add_join_d365
      context_name: filter_d365
      params:
        - column: hash_d365
          expression: >
            md5(concat(
              cch_sapid,
              coalesce(Unloading_Points_d365, ''),
              coalesce(cd_cch_code, ''),
              coalesce(openmonday1_d365, ''),
              coalesce(openmonday2_d365, ''),
              coalesce(opentuesday1_d365, ''),
