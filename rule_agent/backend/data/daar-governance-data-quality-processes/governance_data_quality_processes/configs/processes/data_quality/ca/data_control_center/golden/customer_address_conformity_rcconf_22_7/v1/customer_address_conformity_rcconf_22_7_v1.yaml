transform:
  name: city_std_conformity
  operations:

  - kind: read_dataio
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address
      schema_version: v4

  - kind: select
    context_name: read_dm_customer_address
    name: select_dca
    params:
      columns:
        customer_code: customer_code
        city: city
        longitude: longitude
        latitude: latitude
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general
      schema_version: v11

  - kind: select
    context_name: read_dm_customer_general
    name: select_dcg
    params:
      columns:
        customer_code: customer_code
        central_order_block_code: central_order_block_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dca_dcg
    context_name: select_dca
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

  - kind: select
    name: select_dca_dcg
    context_name: join_dca_dcg
    params:
      columns:
        customer_code: customer_code
        city: city
        longitude: longitude
        latitude: latitude
        central_order_block_code: central_order_block_code
        country_code: country_code
      distinct: true

  - kind: filter
    name: filter_dca_dcg
    context_name: select_dca_dcg
    params:
      - condition:
          1 = 1

  - kind: governance_data_quality_processes.custom_operations.city_standarization.city_std_conformity.CityStdConformityOperation
    name: city_std_conformity
    config_kind: governance_data_quality_processes.custom_operation_configs.city_standarization.city_std_conformity_config.CityStdConformityOperationConfig
    context_name: filter_dca_dcg
    params:
      value: city
      customer_code: customer_code
      longitude: longitude
      latitude: latitude
      central_order_block_code: central_order_block_code
      country_code: country_code

  - kind: add
    name: add_check
    context_name: city_std_conformity
    params:
      - column: rule_code
        expression: "'RCCONF_22.7'"        
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
        advanced_message: check_details_message
        check_date: check_date
      distinct: true  