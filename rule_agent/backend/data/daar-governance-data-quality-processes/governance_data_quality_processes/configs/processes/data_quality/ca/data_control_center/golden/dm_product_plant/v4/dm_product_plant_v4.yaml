transform:
  name: dm_product_plant
  operations:

# Read MARC
  - kind: read_dataio
    name: read_marc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: marc
      schema_version: v1

  - kind: add
    name: add_concat
    params:
        - column: key_concat
          expression: concat(matnr, werks)
        - column: werks_substr
          expression: substring(werks,0,2)

  - kind: select
    name: select_m
    params:
      columns:
        matnr: matnr
        werks: werks
        werks_substr: werks_substr
        key_concat: key_concat
        ausdt: ausdt
        ausme: ausme
        beskz: beskz
        dismm: dismm
        kzaus: kzaus
        lvorm: lvorm
        maabc: maabc
        minbe: minbe
        mmsta: mmsta
        mmstd: mmstd
        mtvfp: mtvfp
        stawn: stawn
        qmatv: qmatv
        trame: trame
        umlmc: umlmc
        sap_cluster: sap_cluster_m
      distinct: true
    skip_next: false

  - kind: add
    name: add_lpad
    context_name: select_m
    params:
      - column: lpad_key
        expression: "CASE WHEN(length(key_concat) < 24) THEN concat('4', lpad(key_concat, 24, '0')) ELSE key_concat END"

  - kind: select
    name: select_marc
    params:
      columns:
        matnr: matnr
        werks: werks
        werks_substr: werks_substr
        key_concat: key_concat
        lpad_key: lpad_key
        ausdt: ausdt
        ausme: ausme
        beskz: beskz
        dismm: dismm
        kzaus: kzaus
        lvorm: lvorm
        maabc: maabc
        minbe: minbe
        mmsta: mmsta
        mmstd: mmstd
        mtvfp: mtvfp
        stawn: stawn
        qmatv: qmatv
        trame: trame
        umlmc: umlmc
        sap_cluster_m: sap_cluster_m
      distinct: true
    skip_next: false

