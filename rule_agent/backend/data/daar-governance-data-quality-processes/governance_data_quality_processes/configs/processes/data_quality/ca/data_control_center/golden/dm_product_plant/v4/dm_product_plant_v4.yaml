# Read MARD

  - kind: read_dataio
    name: read_mar
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mard
      schema_version: v1

  - kind: group
    name: group_mar
    params:
      - aggs:
          labst: sum
          speme: sum
          insme: sum
        by:
        -  matnr
        -  werks
        -  sap_cluster  

  - kind: add
    name: add_casts
    context_name: group_mar
    params:
       - column: sum_labst_cast
         expression: CAST(sum_labst AS DECIMAL(33, 3))
       - column: sum_speme_cast
         expression: CAST(sum_speme AS DECIMAL(33, 3))
       - column: sum_insme_cast
         expression: CAST(sum_insme AS DECIMAL(33, 3))

  - kind: select
    name: select_group_sum
    context_name: add_casts
    params:
      columns:
        werks: werks
        matnr: matnr
        sum_labst_cast: sum_labst
        sum_speme_cast: sum_speme
        sum_insme_cast: sum_insme
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false     

###change 02/06/2024####
  - kind: add
    name: add_stock
    context_name: read_mar
    params:
      - column: labst_cy
        expression: IF(lfgja = extract(YEAR from now()), labst, 0)
      - column: labst_py
        expression: IF(lfgja = extract(YEAR from now()) - 1, labst, 0)
      - column: labst_ppy
        expression: IF(lfgja = extract(YEAR from now()) - 2, labst, 0)
      - column: speme_cy
        expression: IF(lfgja = extract(YEAR from now()), speme, 0)
      - column: speme_py
        expression: IF(lfgja = extract(YEAR from now()) - 1, speme, 0)
      - column: speme_ppy
        expression: IF(lfgja = extract(YEAR from now()) - 2, speme, 0)
      - column: insme_cy
        expression: IF(lfgja = extract(YEAR from now()), insme, 0)
      - column: insme_py
        expression: IF(lfgja = extract(YEAR from now()) - 1, insme, 0)
      - column: insme_ppy
        expression: IF(lfgja = extract(YEAR from now()) - 2, insme, 0)

  - kind: group
    name: group_stock
    params:
      - aggs:
          labst_cy: sum
          labst_py: sum
          labst_ppy: sum
          speme_cy: sum
          speme_py: sum
          speme_ppy: sum
          insme_cy: sum
          insme_py: sum
          insme_ppy: sum
        by:
        - matnr
        - werks
        - sap_cluster

  - kind: select
    name: select_group_mar_stock
    context_name: group_stock
    params:
      columns:
        werks: werks
        matnr: matnr
        sum_labst_cy: sum_labst_cy
        sum_labst_py: sum_labst_py
        sum_labst_ppy: sum_labst_ppy
        sum_speme_cy: sum_speme_cy
        sum_speme_py: sum_speme_py
        sum_speme_ppy: sum_speme_ppy
        sum_insme_cy: sum_insme_cy
        sum_insme_py: sum_insme_py
        sum_insme_ppy: sum_insme_ppy
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false     

  - kind: join
    name: join_group_mar_stock
    context_name: select_group_sum
    params:
      - other:
          select_group_mar_stock
        how:
          left
        columns:
          matnr: matnr
          werks: werks
          sap_cluster: sap_cluster

  - kind: select
    name: select_group_mar
    params:
      columns:
        werks: werks
        matnr: matnr
        sum_labst: sum_labst
        sum_speme: sum_speme
        sum_insme: sum_insme
        sum_labst_cy: sum_labst_cy
        sum_labst_py: sum_labst_py
        sum_labst_ppy: sum_labst_ppy
        sum_speme_cy: sum_speme_cy
        sum_speme_py: sum_speme_py
        sum_speme_ppy: sum_speme_ppy
        sum_insme_cy: sum_insme_cy
        sum_insme_py: sum_insme_py
        sum_insme_ppy: sum_insme_ppy
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false  
