    name: select_mkol
    context_name: read_mkol
    params:
      columns:
        matnr: matnr_mkol
        werks: plant_code_mkol
        slabs: slabs_mkol
        sinsm: sinsm_mkol
        seinm: seinm_mkol
        sspem: sspem_mkol
        svmla: svmla_mkol
        svmin: svmin_mkol
        svmei: svmei_mkol
        svmsp: svmsp_mkol
        sap_cluster: sap_cluster_mkol
      distinct: true
    skip_next: false

  - kind: group
    name: group_mkol
    context_name: select_mkol
    params:
      - aggs:
          slabs_mkol: sum
          sinsm_mkol: sum
          seinm_mkol: sum
          sspem_mkol: sum
          svmla_mkol: sum
          svmin_mkol: sum
          svmei_mkol: sum
          svmsp_mkol: sum
        by:
        - matnr_mkol
        - plant_code_mkol
        - sap_cluster_mkol

  - kind: add
    name: add_stock_supplier_quantity
    context_name: group_mkol
    params:
      - column: stock_supplier_quantity
        expression: "CASE WHEN sum_slabs_mkol + sum_sinsm_mkol + sum_seinm_mkol + sum_sspem_mkol + sum_svmla_mkol + sum_svmin_mkol + sum_svmei_mkol + sum_svmsp_mkol > 0 THEN '1' ELSE '0' END"

