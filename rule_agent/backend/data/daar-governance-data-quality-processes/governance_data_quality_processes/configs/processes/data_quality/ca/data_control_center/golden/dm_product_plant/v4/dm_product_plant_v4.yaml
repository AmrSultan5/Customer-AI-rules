      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: ce31000
      schema_version: v1

  - kind: filter
    name: filter_c3
    context_name: read_c3
    params:
      - condition:
          gjahr >= (date_format(add_months(current_date(), -24),"yyyy"))
      - condition:
          paledger = '01'

  - kind: select
    name: select_c3
    context_name: filter_c3
    params:
      columns:
        paobjnr: paobjnr_c3
        gjahr: gjahr
        absmg001: absmg001
        sap_cluster: sap_cluster_c3
