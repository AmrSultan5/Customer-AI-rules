# Read MCHB
  - kind: read_dataio
    name: read_mch
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mchb
      schema_version: v1

  - kind: filter
    name: filter_mch
    context_name: read_mch
    params:
      - condition:
          clabs != 0 OR cspem != 0

  - kind: group
    name: group_mch
    context_name: filter_mch
    params:
      - aggs:
          charg: collect_list
        by:
        -  matnr
        -  werks
        -  sap_cluster

  - kind: add
    name: add_sales_charg_array
    context_name: group_mch
    params:
      - column: charg_array
        expression: sort_array(collect_list_charg)

  - kind: add
    name: add_stock_batch
    context_name: add_sales_charg_array
    params:
      - column: charg_concat_ws
        expression: concat_ws(',', charg_array)

  - kind: select
    name: select_mch_grp
    params:
      columns:
        werks: werks
        matnr: matnr
        charg_concat_ws: charg_concat_ws
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false

###change 02/06/2024####
  - kind: add
    name: add_stock_mch
    context_name: filter_mch
    params:
      - column: clabs_cy
        expression: IF(lfgja = extract(YEAR from now()), clabs, 0)
      - column: clabs_py
        expression: IF(lfgja = extract(YEAR from now()) - 1, clabs, 0)
      - column: clabs_ppy
        expression: IF(lfgja = extract(YEAR from now()) - 2, clabs, 0)
      - column: cspem_cy
        expression: IF(lfgja = extract(YEAR from now()), cspem, 0)
      - column: cspem_py
        expression: IF(lfgja = extract(YEAR from now()) - 1, cspem, 0)
      - column: cspem_ppy
        expression: IF(lfgja = extract(YEAR from now()) - 2, cspem, 0)

  - kind: group
    name: group_stock_mch
    params:
      - aggs:
          clabs_cy: sum
          clabs_py: sum
          clabs_ppy: sum
          cspem_cy: sum
          cspem_py: sum
          cspem_ppy: sum
        by:
        - matnr
        - werks
        - sap_cluster

  - kind: add
    name: add_sales_vendor_quantity_mch
    params:
      - column: stock_batch_cy
        expression: sum_clabs_cy+sum_cspem_cy
      - column: stock_batch_py
