# Read MSLB

  - kind: read_dataio
    name: read_msl
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: transactional_data
      object_name: mslb
      schema_version: v1

  - kind: filter
    name: filter_msl
    params:
      - condition:
          sobkz IN('O', 'W')

  - kind: add
    name: add_stock_vendor_flag
    params:
        - column: stock_vendor_flag
          expression: "CASE WHEN(werks IS NOT NULL AND matnr IS NOT NULL) THEN 'X' ELSE '' END"

  - kind: group
    name: group_msl
    params:
      - aggs:
          lblab: sum
          lbins: sum
          lbvla: sum
          lbvin: sum
          lbein: sum
          lbvei: sum
        by:
        - matnr
        - werks
        - sap_cluster

  - kind: join
    name: join_msl
    context_name: add_stock_vendor_flag
    params:
      - other:
          group_msl
        how:
          left
        columns:
          matnr: matnr
          werks: werks
          sap_cluster: sap_cluster

  - kind: add
    name: add_sales_vendor_quantity
    params:
      - column: stock_vendor_quantity
        expression: sum_lblab+sum_lbins+sum_lbvla+sum_lbvin+sum_lbein+sum_lbvei

  - kind: select
    name: select_msl_grp
    params:
      columns:
        sobkz: sobkz
        lfgja: lfgja
        werks: werks
        matnr: matnr
        lblab: lblab
        lbins: lbins
        lbvla: lbvla
        lbvin: lbvin
        lbein: lbein
        lbvei: lbvei
        sum_lblab: sum_lblab
        sum_lbins: sum_lbins
        sum_lbvla: sum_lbvla
        sum_lbvin: sum_lbvin
        sum_lbein: sum_lbein
        sum_lbvei: sum_lbvei
        stock_vendor_flag: stock_vendor_flag
        stock_vendor_quantity: stock_vendor_quantity
        sap_cluster: sap_cluster
      distinct: true
    skip_next: false

