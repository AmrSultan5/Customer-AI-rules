          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_blocking_order_block_sales_area: msg
          attr_name_blocking_order_block_sales_area: attr_name
          aufsd_s4hana: tgt_attr
          aufsd_mdg: src_attr

    - kind: union
      name: union_comparison
      context_name: final_data_missing_from_mdg
      params:
        allow_missing: true
        by_name: true
        other: final_data_missing_from_s4hana

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_invoice_list_schedule

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_account_assignment_group

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_incoterms

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_incoterms2

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_pricing

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_payment_terms

    - kind: union
      name: union_comparison
      params:
        allow_missing: true
        by_name: true
        other: final_blocking_order_block_sales_area

    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
