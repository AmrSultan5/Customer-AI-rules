      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND INCO1_s4hana <> INCO1_mdg

