        - column: msg_billing_data_account_assignment_group
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND KTGRD_s4hana <> KTGRD_mdg THEN 'attributes are mismatching' END

    - kind: select
