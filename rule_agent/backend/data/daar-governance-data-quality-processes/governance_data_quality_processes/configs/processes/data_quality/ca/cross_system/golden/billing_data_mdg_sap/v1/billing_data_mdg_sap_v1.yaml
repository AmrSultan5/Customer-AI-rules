transform:
  name: Billing_data_mdg_sap
  operations:
    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: select
      name: select_mdg_knvv
      context_name: read_mdg_knvv
      params:
        columns:
          KUNNR: PARTNER
          KVGR4: KVGR4
          vkorg: vkorg
          vtweg: vtweg
          spart: spart
          PERRL: PERRL
          KTGRD: KTGRD
          INCO1: INCO1
          INCO2: INCO2
          PRFRE: PRFRE
          ZTERM: ZTERM
          aufsd: aufsd
 
    - kind: add
      name: add_mdg_HASH
      context_name: select_mdg_knvv
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,vkorg,vtweg,spart,PERRL,KTGRD,INCO1,INCO2,PRFRE,ZTERM))

    - kind: filter
      name: filter_mdg_knvv
      context_name: add_mdg_HASH
      params:
        - condition: PARTNER LIKE any('12%','13%','40%','18%','30%','16%','29%','17%','24%','26%','21%','19%','96%','28%','27%','32%','35%','25%','34%','42%','33%','31%','15%','95%','94%','14%','22%','47%') and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: select
      name: mdg
      context_name: filter_mdg_knvv
      params:
        columns:
          PARTNER: PARTNER_mdg
          KVGR4: KVGR4_mdg
          vkorg: vkorg_mdg
          vtweg: vtweg_mdg
          spart: spart_mdg
          PERRL: PERRL_mdg
          KTGRD: KTGRD_mdg
          INCO1: INCO1_mdg
          INCO2: INCO2_mdg
          PRFRE: PRFRE_mdg
          ZTERM: ZTERM_mdg
          aufsd: aufsd_mdg
          HASH: HASH_mdg

    - kind: read_dataio
      name: read_s4hana_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: select
      name: select_s4hana_knvv
      context_name: read_s4hana_knvv
      params:
        columns:
          KUNNR: PARTNER
          KVGR4: KVGR4
          vkorg: vkorg
          vtweg: vtweg
          spart: spart
          PERRL: PERRL
          KTGRD: KTGRD
          INCO1: INCO1
          INCO2: INCO2
          PRFRE: PRFRE
          ZTERM: ZTERM
          aufsd: aufsd
          SAP_CLUSTER: SAP_CLUSTER

    - kind: add
      name: add_s4hana_HASH
      context_name: select_s4hana_knvv
      params:
      - column: HASH
        expression: MD5(CONCAT(PARTNER,vkorg,vtweg,spart,PERRL,KTGRD,INCO1,INCO2,PRFRE,ZTERM))

    - kind: filter
      name: s4hana_union
      context_name: add_s4hana_HASH
      params:
        - condition: if(SAP_CLUSTER = 'CL1', PARTNER like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),PARTNER like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%')) and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: select
      name: s4hana
      context_name: s4hana_union
      params:
        columns:
          PARTNER: PARTNER_s4hana
          KVGR4: KVGR4_s4hana
          vkorg: vkorg_s4hana
          vtweg: vtweg_s4hana
          spart: spart_s4hana
          PERRL: PERRL_s4hana
          KTGRD: KTGRD_s4hana
          INCO1: INCO1_s4hana
          INCO2: INCO2_s4hana
          PRFRE: PRFRE_s4hana
          ZTERM: ZTERM_s4hana
          aufsd: aufsd_s4hana
          HASH: HASH_s4hana

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            HASH_mdg: HASH_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_s4hana is null or HASH_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          PARTNER_mdg: PARTNER_mdg
          KVGR4_mdg: KVGR4_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          PERRL_mdg: PERRL_mdg
          KTGRD_mdg: KTGRD_mdg
          INCO1_mdg: INCO1_mdg
          INCO2_mdg: INCO2_mdg
          PRFRE_mdg: PRFRE_mdg
          ZTERM_mdg: ZTERM_mdg
          aufsd_mdg: aufsd_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          PARTNER_s4hana: PARTNER_s4hana
          KVGR4_s4hana: KVGR4_s4hana
          vkorg_s4hana: vkorg_s4hana
          vtweg_s4hana: vtweg_s4hana
          spart_s4hana: spart_s4hana
          PERRL_s4hana: PERRL_s4hana
          KTGRD_s4hana: KTGRD_s4hana
          INCO1_s4hana: INCO1_s4hana
          INCO2_s4hana: INCO2_s4hana
          PRFRE_s4hana: PRFRE_s4hana
          ZTERM_s4hana: ZTERM_s4hana
          aufsd_s4hana: aufsd_s4hana
          HASH_s4hana: HASH_s4hana

###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            PARTNER_mdg: PARTNER_s4hana
            vkorg_mdg: vkorg_s4hana
            vtweg_mdg: vtweg_s4hana
            spart_mdg: spart_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN PARTNER_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN PARTNER_s4hana IS NULL THEN 'data missing from sap' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          PARTNER_s4hana: partner
          vkorg_s4hana: VKORG
          vtweg_s4hana: VTWEG
          spart_s4hana: SPART
          KVGR4_s4hana: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

###data missing from S4HANA

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##BILLING DATA: Invoice List Schedule
    - kind: filter
      name: billing_data_invoice_list_schedule_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND PERRL_s4hana <> PERRL_mdg

    - kind: add
      name: add_missing_columns_billing_data_invoice_list_schedule
      context_name: billing_data_invoice_list_schedule_filter
      params:
        - column: attr_name_billing_data_invoice_list_schedule
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND PERRL_s4hana <> PERRL_mdg THEN concat('BILLING DATA:',' Invoice List Schedule') END
        - column: msg_billing_data_invoice_list_schedule
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND PERRL_s4hana <> PERRL_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_billing_data_invoice_list_schedule
      context_name: add_missing_columns_billing_data_invoice_list_schedule
      params:
        columns:
          PARTNER_mdg: partner
          vkorg_mdg: VKORG
          vtweg_mdg: VTWEG
          spart_mdg: SPART
          KVGR4_mdg: KVGR4
          src_system: src_system
          tgt_system: tgt_system
          msg_billing_data_invoice_list_schedule: msg
          attr_name_billing_data_invoice_list_schedule: attr_name
          PERRL_s4hana: tgt_attr
          PERRL_mdg: src_attr

