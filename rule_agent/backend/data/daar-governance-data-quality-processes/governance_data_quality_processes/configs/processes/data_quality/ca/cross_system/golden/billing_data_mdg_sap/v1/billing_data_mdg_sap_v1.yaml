        other: final_blocking_order_block_sales_area

    - kind: join
      name: join_final_agg
      context_name: union_comparison_agg
      params:
        - other:
            select_mdg_but000
          how:
            left
          columns:
            partner: partner_mdg_but000
        - other:
            select_kna1
          how:
            left
          columns:
            partner: kunnr_kna1
        - other:
            select_t077x
          how:
            left
          columns:
            ktokd_kna1: ktokd_t077x
        - other:
            select_tvv4t
          how:
            left
          columns:
            KVGR4: KVGR4_tvv4t

    - kind: filter
      name: filter_final_agg
      params:
        - condition:
            aufsd_kna1 in ('C','CW','I','M','S1','TS','VF','WH','') AND vkorg IN (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)

    - kind: select
      name: select_data_mismatch_agg
      context_name: filter_final_agg
      params:
        columns:
          partner: partner
        distinct: true

    - kind: add
      name: add_missing_columns_data_mismatch_agg
      context_name: select_data_mismatch_agg
      params:
        - column: country
          expression: CASE WHEN Substr(partner, 0, 2) = 96 THEN 'AM'
            WHEN Substr(partner, 0, 2) = 12 THEN 'AT'
            WHEN Substr(partner, 0, 2) = 28 THEN 'BA'
            WHEN Substr(partner, 0, 2) = 13 THEN 'BG'
            WHEN Substr(partner, 0, 2) = 23 THEN 'BY'
            WHEN Substr(partner, 0, 2) = 27 THEN 'CH'
            WHEN Substr(partner, 0, 2) = 40 THEN 'CY'
            WHEN Substr(partner, 0, 2) = 18 THEN 'CZ'
            WHEN Substr(partner, 0, 2) = 32 THEN 'EE'
            WHEN Substr(partner, 0, 2) = 47 THEN 'EG'
            WHEN Substr(partner, 0, 2) = 35 THEN 'GB'
            WHEN Substr(partner, 0, 2) = 30 THEN 'GR'
            WHEN Substr(partner, 0, 2) = 25 THEN 'HR'
            WHEN Substr(partner, 0, 2) = 16 THEN 'HU'
            WHEN Substr(partner, 0, 2) = 34 THEN 'IE'
            WHEN Substr(partner, 0, 2) = 29 THEN 'IT'
            WHEN Substr(partner, 0, 2) = 42 THEN 'KV'
            WHEN Substr(partner, 0, 2) = 33 THEN 'LT'
            WHEN Substr(partner, 0, 2) = 31 THEN 'LV'
            WHEN Substr(partner, 0, 2) = 17 THEN 'MD'
            WHEN Substr(partner, 0, 2) = 15 THEN 'ME'
            WHEN Substr(partner, 0, 2) = 95 THEN 'MK'
            WHEN Substr(partner, 0, 2) = 94 THEN 'NG'
            WHEN Substr(partner, 0, 2) = 24 THEN 'PL'
            WHEN Substr(partner, 0, 2) = 26 THEN 'RO'
            WHEN Substr(partner, 0, 2) = 14 THEN 'RS'
            WHEN Substr(partner, 0, 2) = 21 THEN 'SI'
            WHEN Substr(partner, 0, 2) = 19 THEN 'SK'
            WHEN Substr(partner, 0, 2) = 22 THEN 'UA' END
        - column: table_name
          expression: cast('BILLING DATA' as string)
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: dimension
          expression: cast('ATTRIBUTES ARE MISMATCHING' as string)
        - column: loading_date
          expression: CURRENT_DATE

    - kind: group
      name: group_data_mismatch_agg
      context_name: add_missing_columns_data_mismatch_agg
      params:
        - aggs:
            partner: count
          by:
          - country
          - table_name
          - src_system
          - tgt_system
          - dimension
          - loading_date

    - kind: select
      name: select_data_mismatch_final
      context_name: group_data_mismatch_agg
      params:
        columns:
          table_name: table_name
          src_system: src_system
          tgt_system: tgt_system
          dimension: dimension
          count_partner: cnt
          country: country
          loading_date: loading_date
        distinct: true  

