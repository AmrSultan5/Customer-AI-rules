        by_name: true
        other: final_billing_data_incoterms2

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_pricing

    - kind: union
      name: union_comparison_agg
      params:
        allow_missing: true
        by_name: true
        other: final_billing_data_payment_terms

    - kind: union
      name: union_comparison_agg
      params:
