        - column: msg_billing_data_incoterms2
          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND INCO2_s4hana <> INCO2_mdg THEN 'attributes are mismatching' END

    - kind: select
