          expression: CASE WHEN PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND aufsd_s4hana <> aufsd_mdg THEN concat('BLOCKING:',' Order Block - Sales Area') END
        - column: msg_blocking_order_block_sales_area
