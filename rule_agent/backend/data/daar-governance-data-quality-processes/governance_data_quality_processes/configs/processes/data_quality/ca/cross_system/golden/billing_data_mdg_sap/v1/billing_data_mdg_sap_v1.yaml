###BLOCKING: Order Block - Sales Area
    - kind: filter
      name: blocking_order_block_sales_area_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: PARTNER_mdg = PARTNER_s4hana AND vkorg_mdg = vkorg_s4hana AND vtweg_mdg = vtweg_s4hana AND spart_mdg = spart_s4hana AND aufsd_s4hana <> aufsd_mdg

    - kind: add
