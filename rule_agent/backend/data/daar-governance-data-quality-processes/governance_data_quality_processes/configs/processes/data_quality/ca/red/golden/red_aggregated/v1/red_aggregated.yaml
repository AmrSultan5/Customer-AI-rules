        - check_name
        - quality_category

  - kind: select
    name: select_microsegment_with_red_outlet_check_aggregated
    params:
      columns:
        country_code: country_code
        report_name: report_name
        check_name: check_name
        quality_category: quality_category
        count_total_checks: total_checks
        count_failed_checks: failed_checks
        max_period: period

  - kind: union
    name: union_suppressed_red_outlet_with_micro_microsegment_red_outlet_aggregated
    context_name: union_suppressed_red_outlet_with_micro_aggregated
    params:
      allow_missing: false
      by_name: true
      other: select_microsegment_with_red_outlet_check_aggregated



### red_outlet_cde_doors_check


  - kind: select
    name: select_red_outlet_cde_doors_check
    context_name: select_ca_du_fsm004_customer
    params:
      columns:
        report_code: report
        report_name: name
        country_code: country_code
        fiscal_period: period
        red_outlet_cde_doors_check : red_outlet_cde_doors_check
      distinct: true
    skip_next: false


  - kind: add
    name: add_red_outlet_cde_doors_check
    params:
      - column: check_name
        expression: '"RED outlets with CDE Target door maintained Check"'
      - column: quality_category
        expression: '"Accuracy"'
      - column: total_checks
        expression: IF(red_outlet_cde_doors_check  IS NOT NULL, 1, NULL)
      - column: failed_checks
        expression: IF(red_outlet_cde_doors_check  = '0', 1, NULL)
      - column: report_name
        expression: concat(report, '-', name)

  - kind: drop
    name: drop_red_outlet_cde_doors_check
    params:
      - column: red_outlet_cde_doors_check
      - column: report
