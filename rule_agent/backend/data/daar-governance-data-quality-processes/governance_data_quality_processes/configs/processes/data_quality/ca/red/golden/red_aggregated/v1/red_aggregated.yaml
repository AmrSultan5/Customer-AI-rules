        quality_category: quality_category
        count_total_checks: total_checks
        count_failed_checks: failed_checks
        max_period: period

  - kind: union
    name: union_suppressed_red_outlet_with_micro_microsegment_red_outlet_cde_doors_aggregated
    context_name: union_suppressed_red_outlet_with_micro_microsegment_red_outlet_aggregated
    params:
      allow_missing: false
      by_name: true
      other: select_red_outlet_cde_doors_check_aggregated


### the last step
  - kind: cast
    name: cast_fsm004_customer_md_aggregated
    params:
      - column: failed_checks
        to: integer
      - column: total_checks
        to: integer

  - kind: write_dataio
    name: write_red_aggregated
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: red
      namespace: golden
      object_name: red_aggregated
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: append
