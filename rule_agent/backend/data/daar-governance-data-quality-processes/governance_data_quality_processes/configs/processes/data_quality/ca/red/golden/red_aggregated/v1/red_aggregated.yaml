      - column: report_name
        expression: concat(report, '-', name)

  - kind: drop
    name: drop_microsegment_with_red_outlet_check
    params:
      - column: microsegment_with_red_outlet_check
      - column: report
      - column: name

  - kind: group
    name: group_microsegment_with_red_outlet_check
    params:
      - aggs:
          total_checks: count
          failed_checks: count
          period: max
        by:
        - country_code
