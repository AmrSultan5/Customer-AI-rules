transform:
  name: product_general_completeness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_logistic
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_logistic

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_uom
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_uom

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_universe
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_universe

  - kind: select
    name: select_dm_product_universe_0
    context_name: read_dm_product_universe
    params:
      columns:
        material_code: material_code_dpu
        country_code: country_code_dpu
        sap_cluster: sap_cluster_dpu
        eu_flag: eu_flag_dpu
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_country_trade_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_country_trade_classification

  - kind: select
    name: select_dm_product_country_trade_classification
    context_name: read_dm_product_country_trade_classification
    params:
      columns:
        material_code: material_code_dpctc
        country_code: country_code_dpctc
        trade_classification: trade_classification_dpctc
        commodity_code: commodity_code_dpctc
        sap_cluster: sap_cluster_dpctc
      distinct: true

#READ conf_material_group_weight_v2
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_material_group_weight
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_material_group_weight

  - kind: select
    context_name: read_conf_material_group_weight
    name: select_cmgw
    params:
      columns:
        material_group_code: conf_material_group_code
        material_description: conf_material_description
        base_unit_of_measure_code: conf_base_unit_of_measure_code
        weight_unit: conf_weight_unit
        min_weight: conf_min_weight
        max_weight: conf_max_weight
      distinct: true

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_material_group_commodity
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_material_group_commodity

  - kind: filter
    name: filter_cmgc_null
    context_name: read_conf_material_group_commodity
    params:
      - condition:
          material_description IS NULL OR material_description = ''

  - kind: select
    name: select_cmgc_null
    context_name: filter_cmgc_null
    params:
      columns:
        material_group_code: material_group_code_cmgc_null
        material_type_code: material_type_code_cmgc_null
        material_description: material_description_cmgc_null
      distinct: true

  - kind: filter
    context_name: read_dm_product_general
    name: filter_general
    params:
      - condition:
          is_basic_scope = '1'

  - kind: select
    name: select_dm_product_general
    context_name: filter_general
    params:
      columns:
        material_code: material_code
        material_type_code: material_type_code
        bpp_package_code: bpp_package_code
        base_unit_of_measure_code: base_unit_of_measure_code
        material_description: material_description
        coffee_channel_code: coffee_channel_code
        ean_code: ean_code
        ban_code: ban_code
        bpp_code: bpp_code
        general_item_category_group_code: general_item_category_group_code
        storage_conditions_code: storage_conditions_code
        material_group_code: material_group_code
        material_type_name_unified: material_type_name_unified
        remaining_shelf_life: remaining_shelf_life
        total_shelf_life: total_shelf_life
        reference_packaging_material_code: reference_packaging_material_code
        temperature_condition_code: temperature_condition_code
        weight_unit: weight_unit
        gross_weight: gross_weight
        net_weight: net_weight
        coffee_capsule_system_code: coffee_capsule_system_code
        coffee_class_code: coffee_class_code
        coffee_format_code: coffee_format_code
        coffee_method_code: coffee_method_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dpg_ban
    context_name: select_dm_product_general
    params:
      - column: material_code_made_of_ban
        expression: LPAD(ban_code, 18, '0')

  - kind: select
    name: select_dpg_ban
    context_name: add_dpg_ban
    params:
      columns:
        material_code: material_code_ban
        material_group_code: material_group_code_ban
        material_code_made_of_ban: material_code_made_of_ban
        sap_cluster: sap_cluster_ban 
        ban_code: ban_code_ban
        material_type_code: material_type_code_ban
        bpp_code: bpp_code_ban
      distinct: true

  - kind: select
    name: select_dpp
    context_name: read_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        is_production_version_x_r: is_production_version_x_r 
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dpp_26_2_3
    context_name: select_dpp
    params:
      - aggs:
          is_production_version_x_r : max
        by:
        - material_code
        - sap_cluster

  - kind: join
    name: join_self_dpp_26_2_3
    context_name: select_dpp
    params:
      - other:
          group_dpp_26_2_3
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: select
    name: select_dpp_26_2_3
    context_name: join_self_dpp_26_2_3
    params:
      columns:
        material_code: material_code
        country_code: country_code
        max_is_production_version_x_r: is_production_version_x_r 
        sap_cluster: sap_cluster
      distinct: true

#rule 201.1
  - kind: filter
    name: filter_dm_product_plant_201_1
    context_name: read_dm_product_plant
    params:
      - condition:
          CASE WHEN (country_code = 'CH' AND plant_code NOT IN ('5511','5521','5502')) OR material_status_code NOT IN ('', '98') THEN false ELSE true END

  - kind: select
    name: select_dpp_201_1
    context_name: filter_dm_product_plant_201_1
    params:
      columns:
        material_code: material_code_dpp_201
        sap_cluster: sap_cluster_dpp_201
      distinct: true

  - kind: filter
    name: filter_dm_product_plant
    context_name: read_dm_product_plant
    params:
      - condition:
          material_status_code != 'ZA' and is_basic_scope = '1'

  - kind: select
    name: select_dm_product_plant
    context_name: filter_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    context_name: read_dm_product_sales_organization
    name: filter_sales
    params:
      - condition:
          is_basic_scope = '1'

  - kind: filter
    name: filter_dm_product_sales_organization_26_2_3
    context_name: filter_sales
    params:
      - condition:
          sales_org_code != '0001'

  - kind: add
    name: add_sales_org_code
    context_name: read_dm_product_sales_organization
    params:
      - column: sales_org_code_for_join
        expression: "CASE WHEN sales_org_code = '7800' THEN '7900' ELSE sales_org_code END"

  - kind: select
    name: select_dm_product_sales_organization
    params:
      columns:
        material_code: material_code
        sales_org_code: sales_org_code
        country_code: country_code
        account_assignment_group_code: account_assignment_group_code
        sales_org_code_for_join: sales_org_code_for_join
        distribution_channel_code: distribution_channel_code
        sales_unit_name: sales_unit_name
        ss_sm_flag: ss_sm_flag
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        sales_unit_code: sales_unit_code
        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l4_code: product_hierarchy_l4_code
        product_hierarchy_l5_code: product_hierarchy_l5_code
        material_price_group_code: material_price_group_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_product_sales_organization
    context_name: select_dm_product_sales_organization
    params:
      - condition:
          distribution_channel_code = '01' AND sales_org_code = '0001'

#rules 201.1 and 204.1
  - kind: filter
    name: filter_sales_20x_country_code_fix
    context_name: select_dm_product_sales_organization
    params:
      - condition:
          country_code != 'BSO'

  - kind: select
    name: select_dm_product_sales_organization_all
    params:
      columns:
        material_code: material_code
        sales_org_code: sales_org_code
        sales_org_code_for_join: sales_org_code_for_join
        country_code: country_code
        distribution_channel_code: distribution_channel_code
        ss_sm_flag: ss_sm_flag
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        sales_unit_code: sales_unit_code
        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l4_code: product_hierarchy_l4_code
        material_price_group_code: material_price_group_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dpso_f
    context_name: filter_dm_product_sales_organization
    params:
      columns:
        material_code: material_code_so
        sales_org_code: sales_org_code_so
        country_code: country_code_so
        brand_code: brand_code_so
        flavour_code: flavour_code_so
        pack_type_code: pack_type_code_so
        pack_size_code: pack_size_code_so
        sales_unit_code: sales_unit_code_so
        product_hierarchy_code: product_hierarchy_code_so
        sap_cluster: sap_cluster_so
      distinct: true

  - kind: select
    name: select_dm_product_logistic_pre
    context_name: read_dm_product_logistic
    params:
      columns:
        material_code: material_code
        country_code: country_code_logistic
        operation_code: operation_code
        leo_stock_group: leo_stock_group
        leo_material_group: leo_material_group
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_country_code
    params:
      - column: country_code_for_join
        expression: "CASE WHEN country_code_logistic = 'IE' THEN 'GB' ELSE country_code_logistic END"

  - kind: select
    name: select_dm_product_logistic
    params:
      columns:
        material_code: material_code
        country_code_logistic: country_code_logistic
        country_code_for_join: country_code_for_join
        operation_code: operation_code
        leo_stock_group: leo_stock_group
        leo_material_group: leo_material_group
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_product_uom
    context_name: read_dm_product_uom
    params:
      columns:
        material_code: material_code
        ean_code: ean_code_uom
        alternative_unit_of_measure_code: alternative_unit_of_measure_code
        conversion_numerator: conversion_numerator
        conversion_denominator: conversion_denominator
        conversion_factor: conversion_factor
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_product_uom_ST
    context_name: select_dm_product_uom
    params:
      - condition:
          alternative_unit_of_measure_code = 'ST'

  - kind: filter
    name: filter_dm_product_uom_PAK
    context_name: select_dm_product_uom
    params:
      - condition:
          alternative_unit_of_measure_code = 'PAK'

  - kind: filter
    name: filter_dm_product_universe
    context_name: read_dm_product_universe
    params:
      - condition:
          country_code != 'BSO'

  - kind: add
    name: add_country_code_dpu
    params:
      - column: country_code_for_join_dpu
        expression: "CASE WHEN country_code = 'IE' THEN 'GB' ELSE country_code END"

  - kind: select
    name: select_dm_product_universe
    params:
      columns:
        material_code: material_code
        country_code: country_code_universe
        country_code_for_join_dpu: country_code_for_join_dpu
        sap_cluster: sap_cluster
      distinct: true

  - kind: join
    name: join_dpg_dpu
    context_name: select_dm_product_general
    params:
      - other:
          read_dm_product_universe
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_cmgw
        how:
          left
        columns:
          material_group_code: conf_material_group_code

  - kind: join
    name: join_dpg_dpp_dpso
    context_name: select_dm_product_general
    params:
      - other:
          read_dm_product_universe
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_plant
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_sales_organization
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpso_filter
    context_name: select_dm_product_general
    params:
      - other:
          filter_dm_product_sales_organization
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpso
    context_name: select_dm_product_general
    params:
      - other:
          select_dm_product_sales_organization
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpu_dpso_dpl
    context_name: select_dm_product_general
    params:
      - other:
          select_dm_product_universe
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_logistic
        how:
          left
        columns:
          material_code: material_code
          country_code_for_join_dpu: country_code_for_join
          sap_cluster: sap_cluster
      - other:
          filter_sales_20x_country_code_fix
        how:
          left
        columns:
          material_code: material_code
          operation_code: sales_org_code_for_join
          sap_cluster: sap_cluster
      - other:
          select_dpp_201_1
        how:
          left
        columns:
          material_code: material_code_dpp_201
          sap_cluster: sap_cluster_dpp_201

# filter_dm_product_plant_201_1

  - kind: join
    name: join_dpuom_dpu
    context_name: select_dm_product_uom
    params:
      - other:
          select_dm_product_universe
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpuom_dpso_PAK
    context_name: select_dm_product_general
    params:
      - other:
          filter_dm_product_uom_PAK
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          filter_dm_product_sales_organization_26_2_3
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpp_26_2_3
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpuom_dpso_ST
    context_name: select_dm_product_general
    params:
      - other:
          filter_dm_product_uom_ST
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          filter_dm_product_sales_organization_26_2_3
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpp_26_2_3
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dpg_dpu_dpp_dpso_dpuom_filter
    context_name: select_dm_product_general
    params:
      - other:
          select_dm_product_universe
        how:
          left
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_plant
        how:
          inner
        columns:
          material_code: material_code
          country_code_universe: country_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_sales_organization
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster
      - other:
          select_dm_product_uom
        how:
          left
        columns:
          material_code: material_code
          base_unit_of_measure_code: alternative_unit_of_measure_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_53_3
    context_name: select_dpg_ban
    params:
      - other:
          join_dpg_dpu
        how:
          inner
        columns:
          material_code_made_of_ban: material_code
          sap_cluster_ban: sap_cluster
      - other:
          select_dpso_f
        how:
          left
        columns:
          material_code_ban: material_code_so
          sap_cluster_ban: sap_cluster_so
          country_code: country_code_so

  - kind: join
    name: join_dpg_dpctc_dpu
    context_name: read_dm_product_general
    params:
    - other:
        select_dm_product_universe_0
      how:
        inner
      columns:
        material_code: material_code_dpu
        sap_cluster: sap_cluster_dpu
    - other:
        select_dm_product_country_trade_classification
      how:
        left
      columns:
        material_code_dpu: material_code_dpctc
        country_code_dpu: country_code_dpctc
        sap_cluster_dpu: sap_cluster_dpctc
    - other:
        select_cmgc_null
      how:
        left
      columns:
        material_type_code: material_type_code_cmgc_null
        material_group_code: material_group_code_cmgc_null

  - kind: filter
    name: filter_cmgc
    context_name: read_conf_material_group_commodity
    params:
      - condition:
          material_description IS NOT NULL AND material_description != ''

  - kind: select
    name: select_cmgc
    context_name: filter_cmgc
    # context_name: read_conf_material_group_commodity
    params:
      columns:
        material_group_code: material_group_code_cmgc
        material_type_code: material_type_code_cmgc
        material_description: material_description_cmgc
      distinct: true

  - kind: join
    name: join_dpg_dpctc_dpu_final
    context_name: join_dpg_dpctc_dpu
    params:
    - other:
        select_cmgc
      how:
        left
      columns:
        material_type_code: material_type_code_cmgc
        material_group_code: material_group_code_cmgc

  - kind: add
    name: add_commodity_flag
    context_name: join_dpg_dpctc_dpu_final
    params:
      - column: commodity_flag
        expression: if(material_description LIKE material_description_cmgc OR material_description_cmgc_null IS NOT NULL, '1', '')

#SELECT RPCOMP_82_1
  - kind: select
    name: select_RPCOMP_82_1_commodity
    context_name: add_commodity_flag
    params:
      columns:
        country_code_dpu: country_code
        material_code: material_code
        material_description: material_description
        material_type_code: material_type_code
        commodity_code_dpctc: commodity_code
        commodity_flag: mat_descr_flag
        eu_flag_dpu: eu_flag
        sap_cluster_dpu: sap_cluster
      distinct: true

  - kind: group
    name: group_mat_descr_flag
    params:
      - aggs:
