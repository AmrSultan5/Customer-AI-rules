                    if((material_type_code in('ZFG', 'ZFGS') or (material_type_code in('ZFGC') and coffee_channel_code != 'CH4')) 
                    and (isnull(ean_code) OR ean_code = ''), '0', 
                    if((material_type_code in('ZFG', 'ZFGS') or (material_type_code in('ZFGC') and coffee_channel_code != 'CH4')) 
                    and (isnotnull(ean_code) and ean_code != ''), '1', ''))))
      - column: rule_code_rpcomp_26_1
        expression: '''RPCOMP_26.1'''
      - column: check_date
        expression: current_timestamp()

