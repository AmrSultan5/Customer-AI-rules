########################################## detailed ######################################

  - kind: add
    name: add_dq_message_output
    context_name: checkpoint_du
    params:
     - column: dq_message_output
       expression: "CASE WHEN dq_check_delivery_completion_flag = '1' AND delivery_completion_status = 'DLFL' THEN 'OK, Deleted' 
                    WHEN dq_check_delivery_completion_flag = '1' THEN 'OK' 
                    WHEN dq_check_delivery_completion_flag = '0' THEN 'Incomplete' 
                    END"
     - column: delivery_count_dates_cast
       expression: "CAST(delivery_count_dates as DECIMAL(5, 0))" 
     - column: quantity_delivered_cast
       expression: "CAST(quantity_delivered as DECIMAL(13, 3))"      
     - column: quantity_remaining_cast
       expression: "CAST(quantity_remaining as DECIMAL(13, 3))"      
     - column: business_unit_code_EG
       expression: "CASE WHEN company_code = '0477' THEN 'EGX'
                    ELSE business_unit_code 
                    END"    
     - column: business_unit_description_EG
       expression: "CASE WHEN company_code = '0477' THEN 'Egypt'
                    ELSE business_unit_description 
                    END"
   

  - kind: select
