######################################### aggregated ######################################

# completeness
  - kind: add
    name: add_completeness_check
    context_name: checkpoint_du
    params:
      - column: loading_date
        expression: current_date()
      - column: total_records
        expression: cast(1 as int)
      - column: total_checks
        expression: IF(dq_check_delivery_completion_flag IS NOT NULL AND dq_check_delivery_completion_flag != '', 1, NULL)
      - column: quality_category
        expression: '''Completeness''' 
      - column: invalid_checks
        expression: IF(dq_check_delivery_completion_flag = 0, 1, NULL)
        
  - kind: group
    name: group_completeness_check
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - company_code
        - record_type
        - material_category
        - quality_category
        - loading_date
        - sap_cluster

  - kind: add
    name: add_new_columns_completeness_check
    context_name: group_completeness_check
    params:
      - column: total_checks
        expression: CAST(count_total_checks AS INT)
      - column: invalid_checks
        expression: CAST(count_invalid_checks AS INT)
      - column: total_records
        expression: CAST(count_total_records AS INT)

  - kind: select
    name: select_completeness_check
    params:
      columns:
        country_code: country_code
        company_code: company_code
        record_type: record_type
        material_category: material_category
        quality_category: quality_category
        total_checks: total_checks
        invalid_checks: invalid_checks
        total_records: total_records
        sap_cluster: sap_cluster
        loading_date: loading_date
      distinct: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: sc_pending_open_orders
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
