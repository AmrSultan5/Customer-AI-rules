transform:
  name: finance_cost_center_completeness
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_cost_center
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_cost_center

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_controlling_area
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_controlling_area

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_finance_cost_center_active
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_cost_center_active

  - kind: select
    name: select_dfcc
    context_name: read_dm_finance_cost_center
    params:
      columns:
        company_code: company_code
        cost_center_number: cost_center_number
        person_responsible: person_responsible
        functional_area: functional_area
        functional_area_name: functional_area_name
        cost_center_category: cost_center_category
        controlling_area_code: controlling_area_code
        standard_hierarchy_area: standard_hierarchy_area
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dfcc
    context_name: select_dfcc
    params:
      - column: standard_hierarchy_area_substr
        expression: SUBSTR(standard_hierarchy_area, 4, 20)

  - kind: select
    name: select_dfca
    context_name: read_dm_finance_controlling_area
    params:
      columns:
        company_code: company_code_dfca
        country_code: country_code_dfca
        controlling_area_code: controlling_area_code_dfca
        sap_cluster: sap_cluster_dfca
      distinct: true

  - kind: select
    name: select_dfcca
    context_name: read_dm_finance_cost_center_active
    params:
      columns:
        company_code: company_code_dfcca
        cost_center_number:  cost_center_number_dfcca
        sap_cluster: sap_cluster_dfcca
      distinct: true

#READ cost_center_functional_area_matrix_v1
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_cost_center_functional_area_matrix
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: cost_center_functional_area_matrix

  - kind: select
    name: select_ccfam
    context_name: read_cost_center_functional_area_matrix
    params:
      columns:
        cost_center_group: cost_center_group_cf
        functional_area_code: functional_area_code_cf
      distinct: true

  - kind: join
    name: join_dfcc_dfca_dfcca
    context_name: add_dfcc
    params:
      - other:
          select_dfca
        how:
          inner
        columns:
          controlling_area_code: controlling_area_code_dfca
          company_code: company_code_dfca
          sap_cluster: sap_cluster_dfca
      - other:
          select_dfcca
        how:
          inner
        columns:
          cost_center_number: cost_center_number_dfcca
          company_code: company_code_dfcca
          sap_cluster: sap_cluster_dfcca
      - other:
          select_ccfam
        how:
          left
        columns:
          standard_hierarchy_area_substr: cost_center_group_cf

#SELECT RFCOMP_CC_6
  - kind: select
    name: select_RFCOMP_CC_6
    context_name: join_dfcc_dfca_dfcca
    params:
      columns:
        company_code: company_code
        cost_center_number:  cost_center_number
        person_responsible: person_responsible
        controlling_area_code: controlling_area_code
        country_code_dfca: country_code_dfca
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_CC_6
    context_name: select_RFCOMP_CC_6
    params:
      - column: rule_code
        expression: "'RFCOMP_CC.6'"
      - column: attribute_name
        expression: '''Cost Center'''
      - column: check_status
        expression: 
                    if(person_responsible IS NULL OR person_responsible = '' OR LEN(person_responsible) > 20, '0',
                    '1')

  - kind: select
    name: select_RFCOMP_CC_6_final
    context_name: add_RFCOMP_CC_6
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        cost_center_number: finance_value
        attribute_name: attribute_name
        person_responsible: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true

#SELECT RFCOMP_CC_13
  - kind: select
    name: select_RFCOMP_CC_13
    context_name: join_dfcc_dfca_dfcca
    params:
      columns:
        company_code: company_code
        cost_center_number:  cost_center_number
        standard_hierarchy_area: standard_hierarchy_area
        controlling_area_code: controlling_area_code
        country_code_dfca: country_code_dfca
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_CC_13
    context_name: select_RFCOMP_CC_13
    params:
      - column: rule_code
        expression: "'RFCOMP_CC.13'"
      - column: attribute_name
        expression: '''Cost Center'''
      - column: check_status
        expression: 
                    if(standard_hierarchy_area IS NULL OR standard_hierarchy_area = '' OR LEN(standard_hierarchy_area) > 10, '0',
                    '1')

  - kind: select
    name: select_RFCOMP_CC_13_final
    context_name: add_RFCOMP_CC_13
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        cost_center_number: finance_value
        attribute_name: attribute_name
        standard_hierarchy_area: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true

#SELECT RFCOMP_CC_14
  - kind: select
    name: select_RFCOMP_CC_14
    context_name: join_dfcc_dfca_dfcca
    params:
      columns:
        company_code: company_code
        cost_center_number:  cost_center_number
        company_code: company_code
        controlling_area_code: controlling_area_code
        country_code_dfca: country_code_dfca
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_CC_14
    context_name: select_RFCOMP_CC_14
    params:
      - column: rule_code
        expression: "'RFCOMP_CC.14'"
      - column: attribute_name
        expression: '''Cost Center'''
      - column: check_status
        expression: 
                    if(company_code IS NULL OR company_code = '' OR LEN(company_code) > 4, '0',
                    '1')

  - kind: select
    name: select_RFCOMP_CC_14_final
    context_name: add_RFCOMP_CC_14
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        cost_center_number: finance_value
        attribute_name: attribute_name
        company_code: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true


#SELECT RFCOMP_CC_24
  - kind: select
    name: select_RFCOMP_CC_24
    context_name: join_dfcc_dfca_dfcca
    params:
      columns:
        cost_center_category: cost_center_category
        cost_center_number:  cost_center_number
        cost_center_category: cost_center_category
        controlling_area_code: controlling_area_code
        country_code_dfca: country_code_dfca
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_CC_24
    context_name: select_RFCOMP_CC_24
    params:
      - column: rule_code
        expression: "'RFCOMP_CC.24'"
      - column: attribute_name
        expression: '''Cost Center'''
      - column: check_status
        expression: 
                    if(cost_center_category IS NULL OR cost_center_category = '' OR LEN(cost_center_category) > 1, '0',
                    '1')

  - kind: select
    name: select_RFCOMP_CC_24_final
    context_name: add_RFCOMP_CC_24
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        cost_center_number: finance_value
        attribute_name: attribute_name
        cost_center_category: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true

#SELECT RFCOMP_CC_25
  - kind: select
    name: select_RFCOMP_CC_25
    context_name: join_dfcc_dfca_dfcca
    params:
      columns:
        functional_area_name: functional_area_name
        cost_center_number:  cost_center_number
        functional_area: functional_area
        functional_area_name: functional_area_name
        controlling_area_code: controlling_area_code
        country_code_dfca: country_code_dfca
        functional_area_code_cf: functional_area_code_cf
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_RFCOMP_CC_25
    context_name: select_RFCOMP_CC_25
    params:
      - column: rule_code
        expression: "'RFCOMP_CC.25'"
      - column: attribute_name
        expression: '''Cost Center'''
      - column: check_status
        expression: 
                    if(functional_area IS NULL OR functional_area = '' OR functional_area_code_cf IS NULL OR functional_area_code_cf = '', '0',
                    '1')

  - kind: select
    name: select_RFCOMP_CC_25_final
    context_name: add_RFCOMP_CC_25
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        cost_center_number: finance_value
        attribute_name: attribute_name
        functional_area: value_checked
        country_code_dfca: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: union
    name: union_all
    context_name: select_RFCOMP_CC_6_final
    params:
      allow_missing: false
      by_name: true
      other: select_RFCOMP_CC_13_final

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: select_RFCOMP_CC_14_final

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: select_RFCOMP_CC_24_final

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: select_RFCOMP_CC_25_final

  - kind: add
    name: add_final
    params:
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        finance_value: finance_value
        attribute_name: attribute_name
        value_checked: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        check_date: check_date
      distinct: true

  - kind: write_dataio
    name: write_finance_cost_center_completeness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: finance_cost_center_completeness
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full