# lot size completeness
  - kind: add
    name: add_lot_size_completeness_flag
    context_name: checkpoint_du
    params:
      - column: loading_date
        expression: current_date()
      - column: total_records
        expression: cast(1 as int)
      - column: total_checks
        expression: IF(lot_size_completeness_flag != '', 1, NULL)
      - column: quality_category
        expression: '''Completeness''' 
      - column: quality_type
        expression: '''Lot Size'''       
      - column: invalid_checks
        expression: IF(lot_size_completeness_flag IN ('2', '3'), 1, NULL)
        
  - kind: group
    name: group_lot_size_completeness
    params:
      - aggs:
          total_records: count
          total_checks: count
          invalid_checks: count
        by:
        - country_code
        - quality_type
        - quality_category
        - loading_date
        - sap_cluster

  - kind: add
    name: add_new_columns_lot_size_completeness
    context_name: group_lot_size_completeness
    params:
      - column: total_checks
        expression: CAST(count_total_checks AS INT)
      - column: invalid_checks
        expression: CAST(count_invalid_checks AS INT)
      - column: total_records
        expression: CAST(count_total_records AS INT)

