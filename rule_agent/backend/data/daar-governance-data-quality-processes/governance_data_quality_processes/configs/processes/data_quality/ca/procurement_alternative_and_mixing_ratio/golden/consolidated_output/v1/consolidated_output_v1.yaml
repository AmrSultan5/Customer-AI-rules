### DETAILED

  - kind: add
    name: add_lot_size_completeness
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''Lot Size'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: "CASE WHEN lot_size_completeness_flag = '' THEN 'N/A'
                     WHEN lot_size_completeness_flag = '2' AND country_code = 'BG' THEN CONCAT('Lot size is missing in PA for ', posting_period_no_procurement_concat_ws)
                     WHEN lot_size_completeness_flag = '2' AND country_code != 'BG' THEN 'Lot size is missing in PA'
                     WHEN lot_size_completeness_flag = '3' AND country_code = 'BG' THEN CONCAT('Lot size is missing in Mixing ratio for ', posting_period_no_mixing_concat_ws)
                     WHEN lot_size_completeness_flag = '3' AND country_code != 'BG' THEN 'Lot size is missing in Mixing ratio'
                     ELSE 'OK'
                     END"
      - column: dq_flag_output
        expression: CASE WHEN lot_size_completeness_flag IN ('2', '3') THEN '0' ELSE lot_size_completeness_flag END

  - kind: add
    name: add_lot_size_accuracy
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''Lot Size'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: "CASE WHEN lot_size_accuracy_flag = '' THEN 'N/A'
                     WHEN lot_size_accuracy_flag = '2' AND country_code = 'BG' THEN CONCAT('Material lot size is not matching with: PA of the material for ', posting_period_mismatch_procurement_concat_ws)
                     WHEN lot_size_accuracy_flag = '2' AND country_code != 'BG' THEN 'Material lot size is not matching with: PA of the material'
                     WHEN lot_size_accuracy_flag = '3' AND country_code = 'BG' THEN CONCAT('Material lot size is not matching with: Mixing ratio for ', posting_period_mismatch_mixing_concat_ws)
                     WHEN lot_size_accuracy_flag = '3' AND country_code != 'BG' THEN 'Material lot size is not matching with: Mixing ratio'
                     ELSE 'OK'
                     END"
      - column: dq_flag_output
        expression: CASE WHEN lot_size_accuracy_flag IN ('2', '3') THEN '0' ELSE lot_size_accuracy_flag END

  - kind: add
    name: add_pa_mr
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''PA & MR'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN pa_mr_completeness_flag = '0' THEN 'Missing PAMR' ELSE 'OK' END
      - column: dq_flag_output
        expression: pa_mr_completeness_flag

  - kind: add
    name: add_mixing_ratio
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''Mixing Ratio'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN mixing_ratio_completeness_flag = '0' THEN 'Missing MR' ELSE 'OK' END
      - column: dq_flag_output
        expression: mixing_ratio_completeness_flag

  - kind: add
    name: add_procurement_alternative_com
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''Procurement Alternative'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN pa_completeness_flag = '0' THEN 'Missing PA' ELSE 'OK' END
      - column: dq_flag_output
        expression: pa_completeness_flag

  - kind: add
    name: add_procurement_alternative_acu
    context_name: checkpoint_du
    params:
      - column: quality_type
        expression: '''Procurement Alternative'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN pa_completeness_flag = '0' THEN 'Failed at completeness' 
                    WHEN pa_accuracy_flag = '0' THEN 'Wrong PA Type' 
                    WHEN pa_accuracy_flag = '1' THEN 'OK' 
                    ELSE 'N/A' END
      - column: dq_flag_output
        expression: pa_accuracy_flag

  - kind: union
    name: union_pamr_0
    context_name: add_lot_size_completeness
    params:
      allow_missing: false
      by_name: true
      other: add_lot_size_accuracy

  - kind: union
    name: union_pamr_1
    context_name: union_pamr_0
    params:
      allow_missing: false
      by_name: true
      other: add_pa_mr

  - kind: union
    name: union_pamr_2
    context_name: union_pamr_1
    params:
      allow_missing: false
      by_name: true
      other: add_mixing_ratio

  - kind: union
    name: union_pamr_3
    context_name: union_pamr_2
    params:
      allow_missing: false
      by_name: true
      other: add_procurement_alternative_com

  - kind: union
    name: union_pamr_4
    context_name: union_pamr_3
    params:
      allow_missing: false
      by_name: true
      other: add_procurement_alternative_acu

  - kind: select
    name: select_final_detailed
    context_name: union_pamr_4
    params:
      columns:
        country_code: country_code
        plant_code: plant_code
        material_code: material_code
        material_type: material_type_code
        plant_material_status_code: plant_material_status_code    
        valuation_class_code: valuation_class_code
        price_control_flag: price_control_flag
        do_not_cost_indicator: do_not_cost_indicator
        procurement_type: procurement_type
        procurement_alternative_process_category: procurement_alternative_process_category
        purchasing_organization_code: purchasing_organization_code
        special_procurement_plant_code: special_procurement_plant_code
        vendor_code: vendor_code
        lot_size_procurement_alternative: lot_size_procurement_alternative
        lot_size_mixing: lot_size_mixing
        lot_size: lot_size_plant
        production_version: production_version
        bom_usage: bom_usage
        bom_alternative: bom_alternative
        mixing_ratio: mixing_ratio
        quantity_structure_type: quantity_structure_type
        fiscal_year: fiscal_year
        posting_period: posting_period
        quality_category: quality_category
        quality_type: quality_type
        dq_message_output: dq_message_output
        dq_flag_output: dq_flag_output
        sap_cluster: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_detailed
    context_name: select_final_detailed
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: procurement_alternative_and_mixing_ratio
      namespace: golden
      object_name: detailed_status
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
      
