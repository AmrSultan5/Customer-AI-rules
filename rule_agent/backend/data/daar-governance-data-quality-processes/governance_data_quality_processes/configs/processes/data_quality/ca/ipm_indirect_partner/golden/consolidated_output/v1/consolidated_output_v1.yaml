      - column: quality_check_flag
        expression: "CASE WHEN output_subtrade_channel_consistency = 'OK' THEN '1' WHEN output_subtrade_channel_consistency != 'OK' THEN '0' ELSE  '' END" 
      - column: dq_message_output
        expression: output_subtrade_channel_consistency

  - kind: add
    name: add_dummy_tc
    context_name: filter_dummy
    params:
      - column: group_name
        expression: '''Dummy customers'''
      - column: quality_rule
        expression: '''Trade Channel''' 
      - column: quality_check_flag
        expression: "CASE WHEN output_trade_channel_consistency  = 'OK' THEN '1' WHEN output_trade_channel_consistency != 'OK' THEN '0' ELSE  '' END" 
      - column: dq_message_output
        expression: output_trade_channel_consistency

  - kind: union
    name: union_all
    context_name: add_wholesalers_ccaf
    params:
      allow_missing: false
      by_name: true
      other: add_wholesalers_cg4

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: add_wholesalers_ob

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: add_wholesalers_sc

  - kind: union
    name: union_all
    params:
      allow_missing: false
