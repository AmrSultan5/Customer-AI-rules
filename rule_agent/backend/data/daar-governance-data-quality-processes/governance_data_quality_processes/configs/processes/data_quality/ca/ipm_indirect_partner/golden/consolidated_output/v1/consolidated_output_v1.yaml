    params:
      allow_missing: false
      by_name: true
      other: add_dummy_ob

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: add_dummy_sc

  - kind: union
    name: union_all
    params:
      allow_missing: false
      by_name: true
      other: add_dummy_tc   

  - kind: select
    name: select_du
    params:
      columns:
        l7_customer_code: l7_customer_code
        l7_customer_name: l7_customer_name
        sales_org_code: sales_org_code
        country_code: country_code
        l6_customer_code: l6_customer_code
        l6_customer_name: l6_customer_name
        l5_customer_code: l5_customer_code
        l5_customer_name: l5_customer_name
        l4_customer_code: l4_customer_code
        l4_customer_name: l4_customer_name
        l3_customer_code: l3_customer_code
        l3_customer_name: l3_customer_name
        order_block_code: order_block_code
        order_block_name: order_block_name
        ccaf_code: ccaf_code
        ccaf_name: ccaf_name
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        trade_channel_code: trade_channel_code
        trade_channel_name: trade_channel_name
        sub_trade_channel_code: sub_trade_channel_code
        sub_trade_channel_name: sub_trade_channel_name
        group_name: group_name
        quality_rule: quality_rule
        quality_check_flag: quality_check_flag
        dq_message_output: dq_message_output
      distinct: true

  - kind: write_dataio
    name: write_status_by_rows
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: ipm_indirect_partner
      namespace: golden
      object_name: detailed_status_by_rows
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full

## AGGREGATED LAYER

  - kind: add
    name: add_customer_loading_date
    context_name: select_du
    params:
      - column: loading_date
        expression: current_date()
      - column: invalid_checks
        expression: "CASE WHEN dq_message_output != 'OK' THEN '1' ELSE NULL END" 
      - column: total_checks
        expression: CAST(1 AS INT)

  - kind: group
    name: group_total_invalid_records
    context_name: add_customer_loading_date
    params:
      - aggs:
          invalid_checks: count
          total_checks: count
        by:
        - loading_date
        - country_code
        - group_name
        - quality_rule

  - kind: add
    name: add_new_columns
    context_name: group_total_invalid_records
    params:
      - column: invalid_checks
        expression: CAST(count_invalid_checks AS INT)
      - column: total_checks
        expression: CAST(count_total_checks AS INT)

  - kind: select
    name: select_finall
    context_name: add_new_columns
    params:
      columns:
        country_code: country_code
        loading_date: loading_date
        group_name: group_name
        quality_rule: rule_name
        invalid_checks: invalid_checks
        total_checks: total_checks
      distinct: true

  - kind: write_dataio
    name: write_aggregated
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: ipm_indirect_partner
      namespace: golden
      object_name: aggregated_history
      process_run_id: "{{process_run_id}}"
      schema_version: v1
      refresh_mode: full
