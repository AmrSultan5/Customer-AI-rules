      - column: quality_rule
        expression: '''CCAF'''      
      - column: quality_check_flag
        expression: "CASE WHEN output_ccaf_attribute_consistency ='OK' THEN '1' WHEN output_ccaf_attribute_consistency != 'OK' THEN '0' ELSE  '' END" 
      - column: dq_message_output
        expression: output_ccaf_attribute_consistency

  - kind: add
    name: add_dummy_ch3
    context_name: filter_dummy
    params:
      - column: group_name
        expression: '''Dummy customers'''
      - column: quality_rule
        expression: '''Customer Hierarchy 3''' 
      - column: quality_check_flag
        expression: "CASE WHEN output_customer_hierarchy_l3 ='OK' THEN '1' WHEN output_customer_hierarchy_l3 != 'OK' THEN '0' ELSE  '' END" 
      - column: dq_message_output
        expression: output_customer_hierarchy_l3

  - kind: add
    name: add_dummy_ob
    context_name: filter_dummy
    params:
      - column: group_name
