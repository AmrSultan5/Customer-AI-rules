    context_name: filter_nonwholesalers
    params:
      - column: group_name
        expression: '''Non-Wholesalers'''
      - column: quality_rule
        expression: '''Order Block'''  
      - column: quality_check_flag
        expression: "CASE WHEN output_order_block_consistency = 'OK' THEN '1' WHEN output_order_block_consistency != 'OK' THEN '0' ELSE  '' END"  
      - column: dq_message_output
        expression: output_order_block_consistency

  - kind: add
