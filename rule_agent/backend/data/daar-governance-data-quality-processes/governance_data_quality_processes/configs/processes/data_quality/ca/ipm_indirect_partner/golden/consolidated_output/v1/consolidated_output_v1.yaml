      - column: quality_rule
        expression: '''Customer Hierarchy 3''' 
      - column: quality_check_flag
        expression: "CASE WHEN output_customer_hierarchy_l3 ='OK' THEN '1' WHEN output_customer_hierarchy_l3 != 'OK' THEN '0' ELSE  '' END"    
      - column: dq_message_output
        expression: output_customer_hierarchy_l3

  - kind: add
    name: add_indirect_ob
    context_name: filter_indirect
    params:
      - column: group_name
        expression: '''Indirect customers'''
      - column: quality_rule
        expression: '''Order Block'''  
      - column: quality_check_flag
        expression: "CASE WHEN output_order_block_consistency = 'OK' THEN '1' WHEN output_order_block_consistency != 'OK' THEN '0' ELSE  '' END"  
      - column: dq_message_output
        expression: output_order_block_consistency

  - kind: add
