transform:
  name: shipping_data_mdg_d365
  operations:
    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1

    - kind: add
      name: add_mdg_knvv_antlf_int
      context_name: read_mdg_knvv
      params:
      - column: antlf_int
        expression: CAST(antlf AS INT)

    - kind: select
      name: select_mdg_knvv
      context_name: add_mdg_knvv_antlf_int
      params:
        columns:
          KUNNR: partner_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
          autlf: autlf_knvv
          lprio: lprio_knvv
          antlf: antlf_knvv
          kztlf: kztlf_knvv
          vsbed: vsbed_knvv
          vwerk: vwerk_knvv
          antlf_int: antlf_knvv_int
        distinct: true

    - kind: read_dataio
      name: read_t001w
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: reference_data
        object_name: t001w
        schema_version: v1

    - kind: filter
      name: filter_t001w
      params:
        - condition: sap_cluster = 'CL1'

    - kind: select
      name: select_t001w
      params:
        columns:
          name1: name1_t001w
          werks: werks_t001w
        distinct: true

    - kind: join
      name: join_mdg
      context_name: select_mdg_knvv
      params:
        - other:
            select_t001w
          how:
            left
          columns:
            vwerk_knvv: werks_t001w

    - kind: filter
      name: filter_d365
      context_name: join_mdg
      params:
        - condition: partner_knvv  like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%','27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and vtweg_knvv = '01' and spart_knvv = '01' and vkorg_knvv in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)


    - kind: add
      name: add_mdg_columns
      context_name: filter_d365
      params:
      - column: hash_mdg
        expression: md5(concat(partner_knvv,vkorg_knvv ,vtweg_knvv,spart_knvv ,autlf_knvv,name1_t001w,lprio_knvv,antlf_knvv_int,kztlf_knvv,vsbed_knvv))

    - kind: select
      name: mdg_
      context_name: add_mdg_columns
      params:
        columns:
          partner_knvv: partner_mdg
          vkorg_knvv: vkorg_mdg
          vtweg_knvv: vtweg_mdg
          spart_knvv: spart_mdg
          kvgr4_knvv: kvgr4_mdg
          autlf_knvv: autlf_mdg
          name1_t001w: vwerk_mdg
          lprio_knvv: lprio_mdg
          antlf_knvv: antlf_mdg
          kztlf_knvv: kztlf_mdg
          vsbed_knvv: vsbed_mdg
          hash_mdg: hash_mdg
        distinct: true

    - kind: checkpoint
      name: mdg
      context_name: mdg_



###################################################################################
    - kind: read_dataio
      name: read_cch_optionsetmapping
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_optionsetmapping
        schema_version: v1
    
    
##  ###################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_cd
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
    
    - kind: select
      name: union_cte_division
      context_name: filter_cch_optionsetmapping_cd
      params:
        columns:
          cch_optionsetvalue: cd_cch_optionsetvalue
          cch_externalvalue: cd_cch_externalvalue
        distinct: true
    
##  ###################################################
##  E distributionchannel
    - kind: filter
      name: filter_cch_optionsetmapping_dc
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
    
    - kind: select
      name: union_cte_distributionchannel
      context_name: filter_cch_optionsetmapping_dc
      params:
        columns:
          cch_optionsetvalue: dc_cch_optionsetvalue
          cch_externalvalue: dc_cch_externalvalue
        distinct: true
    
##  ##################################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_do
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_partialdeliveryperitem'
    
    - kind: select
      name: union_cte_deliveryoptions
      context_name: filter_cch_optionsetmapping_do
      params:
        columns:
          cch_optionsetvalue: do_cch_optionsetvalue
          cch_externalvalue: do_cch_externalvalue
        distinct: true


    
##  ##################################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_dp
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_deliverypriority'
    
    - kind: select
      name: union_cte_deliverypriority
      context_name: filter_cch_optionsetmapping_dp
      params:
        columns:
          cch_optionsetvalue: dp_cch_optionsetvalue
          cch_externalvalue: dp_cch_externalvalue
        distinct: true


    
##  ##################################################################
    
    - kind: filter
      name: filter_cch_optionsetmapping_cg4
      context_name: read_cch_optionsetmapping
      params:
        - condition: cch_entityname = 'account' and cch_attributename = 'cch_customergroup4code'
    
    - kind: select
      name: union_cte_cg4
      context_name: filter_cch_optionsetmapping_cg4
      params:
        columns:
          cch_optionsetvalue: cg4_cch_optionsetvalue
          cch_externalvalue: cg4_cch_externalvalue
        distinct: true




    - kind: read_dataio
      name: read_d365_territory
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: territory
        schema_version: v1

    - kind: filter
      name: filter_territory
      context_name: read_d365_territory
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_territory
      context_name: filter_territory
      params:
        columns:
          cch_sapid: territory_cch_sapid
          id: territory_id
        distinct: true

###################################################################################
    - kind: read_dataio
      name: read_cch_deliveringplant
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_deliveringplant
        schema_version: v1


    - kind: filter
      name: filter_deliveringplant
      context_name: read_cch_deliveringplant
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_deliveringplant
      context_name: filter_deliveringplant
      params:
        columns:
          id: id_deliveringplant
          statecode: plant_statecode
          cch_name: cch_name_deliveringplant
        distinct: true


#############################################################################


    - kind: read_dataio
      name: read_d365_account
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: account
        schema_version: v1

    - kind: filter
      name: filter_d365_account
      context_name: read_d365_account
      params:
        - condition: 1 = 1

    - kind: select
      name: select_d365_account
      context_name: filter_d365_account
      params:
        columns:
          cch_sapid: cch_sapid
          statecode: acc_statecode
          cch_deliveringplantid: cch_deliveringplantid
          cch_salesorganizationid: cch_salesorganizationid
          cch_deliverypriority: cch_deliverypriority
          cch_partialdeliveryperitem: cch_partialdeliveryperitem
          cch_distributionchannel: cch_distributionchannel
          cch_division: cch_division
          cch_customergroup4code: cch_customergroup4code
          cch_completedelivery: cch_completedelivery
          cch_deliveringplantidname: cch_deliveringplantidname
          cch_salesorganizationidname: cch_salesorganizationidname
          cch_nrofpartialdeliveries: cch_nrofpartialdeliveries
          cch_shippingconditions: cch_shippingconditions
        distinct: true

    - kind: join
      name: join_d365
      context_name: select_d365_account
      params:
        - other:
            union_cte_deliverypriority
          how:
            left
          columns:
            cch_deliverypriority: dp_cch_optionsetvalue
        - other:
            union_cte_deliveryoptions
          how:
            left
          columns:
            cch_partialdeliveryperitem: do_cch_optionsetvalue
        - other:
            union_cte_distributionchannel
          how:
            left
          columns:
            cch_distributionchannel: dc_cch_optionsetvalue
        - other:
            union_cte_division
          how:
            left
          columns:
            cch_division: cd_cch_optionsetvalue
        - other:
            union_cte_cg4
          how:
            left
          columns:
            cch_customergroup4code: cg4_cch_optionsetvalue
        - other:
            select_d365_territory
          how:
            left
          columns:
            cch_salesorganizationid: territory_id
        - other:
            select_d365_deliveringplant
          how:
            left
          columns:
            cch_deliveringplantid: id_deliveringplant


    - kind: add
      name: add_d365_columns
      context_name: join_d365
      params:
      - column: hash_d365
        expression: md5(concat(cch_sapid,territory_cch_sapid,dc_cch_externalvalue,cd_cch_externalvalue,if(cch_completedelivery='true','X',''),cch_name_deliveringplant,dp_cch_externalvalue,cast(cch_nrofpartialdeliveries as int),do_cch_externalvalue ,cch_shippingconditions))
      - column: autlf_d365
        expression: if(cch_completedelivery='true','X','')
        
    - kind: filter
      name: filter_d365
      context_name: add_d365_columns
      params:
        - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600) and acc_statecode = 0 and cch_sapid  like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%','96%', '28%','27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%') and plant_statecode = 0

    - kind: select
      name: d365_
      context_name: filter_d365
      params:
        columns:
          cch_sapid: partner_d365
          territory_cch_sapid: vkorg_d365
          dc_cch_externalvalue: vtweg_d365
          cd_cch_externalvalue: spart_d365
          cg4_cch_externalvalue: kvgr4_d365
          autlf_d365: autlf_d365
          cch_name_deliveringplant: vwerk_d365
          dp_cch_externalvalue: lprio_d365
          cch_nrofpartialdeliveries: antlf_d365
          do_cch_externalvalue: kztlf_d365
          cch_shippingconditions: vsbed_d365
          hash_d365: hash_d365
        distinct: true

    - kind: checkpoint
      name: d365
      context_name: d365_        

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            d365
          how:
            full
          columns:
            hash_mdg: hash_d365

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: hash_d365 is null or hash_d365 = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          vkorg_mdg: vkorg_mdg
          vtweg_mdg: vtweg_mdg
          spart_mdg: spart_mdg
          kvgr4_mdg: kvgr4_mdg
          autlf_mdg: autlf_mdg
          vwerk_mdg: vwerk_mdg
          lprio_mdg: lprio_mdg
          antlf_mdg: antlf_mdg
          kztlf_mdg: kztlf_mdg
          vsbed_mdg: vsbed_mdg
          hash_mdg: hash_mdg

    - kind: filter
      name: non_matching_d365
      context_name: join_non_matching_mdg
      params:
        - condition: hash_mdg is null or hash_mdg = ''

    - kind: select
      name: non_matching_d365_select
      context_name: non_matching_d365
      params:
        columns:
          partner_d365: partner_d365
          vkorg_d365: vkorg_d365
          vtweg_d365: vtweg_d365
          spart_d365: spart_d365
          kvgr4_d365: kvgr4_d365
          autlf_d365: autlf_d365
          vwerk_d365: vwerk_d365
          lprio_d365: lprio_d365
          antlf_d365: antlf_d365
          kztlf_d365: kztlf_d365
          vsbed_d365: vsbed_d365
          hash_d365: hash_d365

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_d365_select
          how:
            full
          columns:
            partner_mdg: partner_d365
            vkorg_mdg: vkorg_d365
            vtweg_mdg: vtweg_d365
            spart_mdg: spart_d365

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('d365' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_d365
          expression: CASE WHEN partner_d365 IS NULL THEN 'data missing from d365' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_d365: partner
          vkorg_d365: vkorg
          vtweg_d365: vtweg
          spart_d365: spart
          kvgr4_d365: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: filter
      name: join_data_missing_from_d365_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_d365 is null

    - kind: select
      name: final_data_missing_from_d365
      context_name: join_data_missing_from_d365_filter
      params:
        columns:
          partner_mdg: partner
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          kvgr4_mdg: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_d365: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##SHIPPING DATA: Complete Delivery Required By Law
    - kind: filter
      name: shipping_data_complete_delivery_required_by_law_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND autlf_d365 <> autlf_mdg

    - kind: add
      name: add_missing_columns_shipping_data_complete_delivery_required_by_law
      context_name: shipping_data_complete_delivery_required_by_law_filter
      params:
        - column: attr_name_shipping_data_complete_delivery_required_by_law
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND autlf_d365 <> autlf_mdg THEN concat('SHIPPING DATA:' ,' Complete Delivery Required By Law') END
        - column: msg_shipping_data_complete_delivery_required_by_law
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND autlf_d365 <> autlf_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_complete_delivery_required_by_law
      context_name: add_missing_columns_shipping_data_complete_delivery_required_by_law
      params:
        columns:
          partner_mdg: partner
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          kvgr4_mdg: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_complete_delivery_required_by_law: msg
          attr_name_shipping_data_complete_delivery_required_by_law: attr_name
          autlf_d365: tgt_attr
          autlf_mdg: src_attr

##SHIPPING DATA: Delivering Plant
    - kind: filter
      name: shipping_data_delivering_plant_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND vwerk_d365 <> vwerk_mdg

    - kind: add
      name: add_missing_columns_shipping_data_delivering_plant
      context_name: shipping_data_delivering_plant_filter
      params:
        - column: attr_name_shipping_data_delivering_plant
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND vwerk_d365 <> vwerk_mdg THEN concat('SHIPPING DATA:' ,' Delivering Plant') END
        - column: msg_shipping_data_delivering_plant
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND vwerk_d365 <> vwerk_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_delivering_plant
      context_name: add_missing_columns_shipping_data_delivering_plant
      params:
        columns:
          partner_mdg: partner
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          kvgr4_mdg: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_delivering_plant: msg
          attr_name_shipping_data_delivering_plant: attr_name
          vwerk_d365: tgt_attr
          vwerk_mdg: src_attr

##SHIPPING DATA: Delivery Priority
    - kind: filter
      name: shipping_data_delivery_priority_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND lprio_d365 <> lprio_mdg

    - kind: add
      name: add_missing_columns_shipping_data_delivery_priority
      context_name: shipping_data_delivery_priority_filter
      params:
        - column: attr_name_shipping_data_delivery_priority
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND lprio_d365 <> lprio_mdg THEN concat('SHIPPING DATA:' ,' Delivery Priority') END
        - column: msg_shipping_data_delivery_priority
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND lprio_d365 <> lprio_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_delivery_priority
      context_name: add_missing_columns_shipping_data_delivery_priority
      params:
        columns:
          partner_mdg: partner
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          kvgr4_mdg: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_delivery_priority: msg
          attr_name_shipping_data_delivery_priority: attr_name
          lprio_d365: tgt_attr
          lprio_mdg: src_attr

##SHIPPING DATA: Max.Part.Deliveries
    - kind: filter
      name: shipping_data_max_part_deliveries_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND antlf_d365 <> antlf_mdg

    - kind: add
      name: add_missing_columns_shipping_data_max_part_deliveries
      context_name: shipping_data_max_part_deliveries_filter
      params:
        - column: attr_name_shipping_data_max_part_deliveries
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND antlf_d365 <> antlf_mdg THEN concat('SHIPPING DATA:' ,' Max.Part.Deliveries') END
        - column: msg_shipping_data_max_part_deliveries
          expression: CASE WHEN partner_mdg = partner_d365 AND vkorg_mdg = vkorg_d365 AND vtweg_mdg = vtweg_d365 AND spart_mdg = spart_d365 AND antlf_d365 <> antlf_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_shipping_data_max_part_deliveries
      context_name: add_missing_columns_shipping_data_max_part_deliveries
      params:
        columns:
          partner_mdg: partner
          vkorg_mdg: vkorg
          vtweg_mdg: vtweg
          spart_mdg: spart
          kvgr4_mdg: kvgr4
          src_system: src_system
          tgt_system: tgt_system
          msg_shipping_data_max_part_deliveries: msg
          attr_name_shipping_data_max_part_deliveries: attr_name
          antlf_d365: tgt_attr
          antlf_mdg: src_attr

##SHIPPING DATA: Part.dlv./item
    - kind: filter
      name: shipping_data_part_dlv_item_filter
      context_name: data_missing_from_mdg_add_columns
      params:
