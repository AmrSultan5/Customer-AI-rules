transform:
  name: incident_nonapproval
  operations:
    - kind: read_dataio
      name: read_incident
      params:
        dataio:
          ad_id: "{{dataio.ad_id}}"
          storage_id: "{{dataio.storage_id}}"
          layer: curated
        source: dataverse
        namespace: d365
        object_name: incident
        schema_version: v1

    - kind: filter
      name: filter_incident_nonapproval
      context_name: read_incident
      params:
        - condition: len(cch_nonapprovaljson) > 40

    - kind: filter
      name: filter_incident_approval
      context_name: read_incident
      params:
        - condition: len(cch_approvaljson) > 40

    - kind: add
      name: add_related_table_nonapproval
      context_name: filter_incident_nonapproval
      params:
        - column: related_table
          expression: "explode_outer(from_json(cch_nonapprovaljson:relatedtables, 'array<struct<AdditionalAttributes:array<struct<NewValue:struct<Id:string,RefEntity:string,Value:string>,OldValue:struct<Id:string,RefEntity:string,Value:string>>>,Attributes:array<struct<LogicalName:string,NewValue:struct<Id:string,RefEntity:string,Value:string>,OldValue:struct<Id:string,RefEntity:string,Value:string>>>,ChangeStatus:int,IsCreated:boolean,LogicalName:string>>'))"
        - column: table
          expression: related_table.logicalname
        - column: changestatus
          expression: related_table.changestatus
        - column: iscreated
          expression: related_table.iscreated
        - column: related_table_attribute
          expression: explode_outer(related_table.attributes)
        - column: attribute
          expression: related_table_attribute.logicalname
        - column: newvalue
          expression: related_table_attribute.newvalue.value
        - column: oldvalue
          expression: related_table_attribute.oldvalue.value
        - column: related_table_additional_attribute
          expression: explode_outer(related_table.additionalattributes)
        - column: guid
          expression: coalesce(related_table_additional_attribute.newvalue.value,related_table_additional_attribute.oldvalue.value)

    - kind: select
      name: select_related_table_nonapproval
      context_name: add_related_table_nonapproval
      params:
        columns:
          id: id
          ticketnumber: ticketnumber
          activitiescomplete: activitiescomplete
          cch_changerequestsenttomdg: changerequestsenttomdg
          cch_dateofprocessingcompletion: dateofprocessingcompletion
          cch_reasoncodename: reasoncodename
          table: table
          changestatus: changestatus
          iscreated: iscreated
          attribute: attribute
          newvalue: newvalue
          oldvalue: oldvalue
          guid: guid
          related_table: related_table
          related_table_attribute: related_table_attribute
          related_table_additional_attribute: related_table_additional_attribute

    - kind: filter
      name: filter_related_table_nonapproval
      context_name: select_related_table_nonapproval
      params:
        - condition: newvalue is not null and attribute in('cch_telephone','cch_telephone2','cch_telephone3','cch_telephone4','cch_telephone5','cch_emailaddress','cch_emailaddress2','cch_emailaddress3','cch_emailaddress4','cch_emailaddress5','cch_mobilephone','cch_mobilephone2','cch_mobilephone3','cch_mobilephone4','cch_mobilephone5','cch_mobilephone_number_default','cch_mobilephone2_number_default','cch_mobilephone3_number_default','cch_mobilephone4_number_default','cch_mobile5_number_default','cch_telephone_number_default','cch_telephone2_number_default','cch_telephone3_number_default','cch_telephone4_number_default','cch_telephone5_number_default','firstname','lastname')

    - kind: select
      name: select_incident_nonapproval_1
      context_name: filter_related_table_nonapproval
      params:
        columns:
          id: id
          ticketnumber: ticketnumber
          activitiescomplete: activitiescomplete
          changerequestsenttomdg: changerequestsenttomdg
          dateofprocessingcompletion: dateofprocessingcompletion
          reasoncodename: reasoncodename
          table: table
          changestatus: changestatus
          iscreated: iscreated
          attribute: attribute
          newvalue: newvalue
          oldvalue: oldvalue
          guid: guid

    - kind: checkpoint
      name: select_incident_nonapproval
      context_name: select_incident_nonapproval_1

    - kind: add
      name: add_related_table_approval
      context_name: filter_incident_approval
      params:
        - column: related_table
          expression: "explode_outer(from_json(cch_approvaljson:relatedtables, 'array<struct<AdditionalAttributes:array<struct<NewValue:struct<Id:string,RefEntity:string,Value:string>,OldValue:struct<Id:string,RefEntity:string,Value:string>>>,Attributes:array<struct<LogicalName:string,NewValue:struct<Id:string,RefEntity:string,Value:string>,OldValue:struct<Id:string,RefEntity:string,Value:string>>>,ChangeStatus:int,IsCreated:boolean,LogicalName:string>>'))"
        - column: table
          expression: related_table.logicalname
        - column: changestatus
          expression: related_table.changestatus
        - column: iscreated
          expression: related_table.iscreated
        - column: related_table_attribute
          expression: explode_outer(related_table.attributes)
        - column: attribute
          expression: related_table_attribute.logicalname
        - column: newvalue
          expression: related_table_attribute.newvalue.value
        - column: oldvalue
          expression: related_table_attribute.oldvalue.value
        - column: related_table_additional_attribute
          expression: explode_outer(related_table.additionalattributes)
        - column: guid
          expression: coalesce(related_table_additional_attribute.newvalue.value,related_table_additional_attribute.oldvalue.value)

    - kind: select
      name: select_related_table_approval
      context_name: add_related_table_approval
      params:
        columns:
          id: id
          ticketnumber: ticketnumber
          activitiescomplete: activitiescomplete
          cch_changerequestsenttomdg: changerequestsenttomdg
          cch_dateofprocessingcompletion: dateofprocessingcompletion
          cch_reasoncodename: reasoncodename
          table: table
          changestatus: changestatus
          iscreated: iscreated
          attribute: attribute
          newvalue: newvalue
          oldvalue: oldvalue
          guid: guid
          related_table: related_table
          related_table_attribute: related_table_attribute
          related_table_additional_attribute: related_table_additional_attribute

    - kind: filter
      name: filter_related_table_approval
      context_name: select_related_table_approval
      params:
        - condition: newvalue is not null and attribute in('cch_telephone','cch_telephone2','cch_telephone3','cch_telephone4','cch_telephone5','cch_emailaddress','cch_emailaddress2','cch_emailaddress3','cch_emailaddress4','cch_emailaddress5','cch_mobilephone','cch_mobilephone2','cch_mobilephone3','cch_mobilephone4','cch_mobilephone5','cch_mobilephone_number_default','cch_mobilephone2_number_default','cch_mobilephone3_number_default','cch_mobilephone4_number_default','cch_mobile5_number_default','cch_telephone_number_default','cch_telephone2_number_default','cch_telephone3_number_default','cch_telephone4_number_default','cch_telephone5_number_default','firstname','lastname')

    - kind: select
      name: select_incident_approval_1
      context_name: filter_related_table_approval
      params:
        columns:
          id: id
          ticketnumber: ticketnumber
          activitiescomplete: activitiescomplete
          changerequestsenttomdg: changerequestsenttomdg
          dateofprocessingcompletion: dateofprocessingcompletion
          reasoncodename: reasoncodename
          table: table
          changestatus: changestatus
          iscreated: iscreated
          attribute: attribute
          newvalue: newvalue
          oldvalue: oldvalue
          guid: guid

    - kind: checkpoint
      name: select_incident_approval
      context_name: select_incident_approval_1

    - kind: union
      name: union_d365_incident
      context_name: select_incident_nonapproval
      params:
        allow_missing: true
        by_name: true
        other: select_incident_approval

    - kind: read_dataio
      name: read_cch_mdrequest
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: dataverse
        namespace: d365
        object_name: cch_mdrequest
        schema_version: v1

    - kind: filter
      name: filter_cch_mdrequest
      context_name: read_cch_mdrequest
      params:
        - condition: 1 = 1

    - kind: select
      name: select_cch_mdrequest
      context_name: filter_cch_mdrequest
      params:
        columns:
          cch_winshuttleticketnumber: cch_winshuttleticketnumber
          cch_casereferencename: cch_casereferencename
          cch_mdrequestdate: cch_mdrequestdate
          cch_account: cch_account
          cch_accountname: cch_accountname
          cch_sladate: cch_sladate
          cch_casereference: cch_casereference
          cch_senttowinshuttle: cch_senttowinshuttle

    - kind: join
      name: join_incident_mdrequest
      context_name: union_d365_incident
      params:
        - other:
            select_cch_mdrequest
          how:
            inner
          columns:
            id: cch_casereference

    - kind: add
      name: add_incident_mdrequest_1
      context_name: join_incident_mdrequest
      params:
        - column: mdrequeststatus
          expression: case when cch_senttowinshuttle='311220000' then 'Not Sent' 
                      when cch_senttowinshuttle='344240000' then 'In queue' 
                      when cch_senttowinshuttle='311220001' then 'In Progress' 
                      when cch_senttowinshuttle='311220002' then 'Sent Successfully' 
                      when cch_senttowinshuttle='311220003' then 'Send Failed' 
                      when cch_senttowinshuttle='311220004' then 'Resend In Progress' 
                      when cch_senttowinshuttle='311220005' then 'Resent Successfully' 
                      when cch_senttowinshuttle='311220006' then 'Resend Failed' 
                      when cch_senttowinshuttle='311220007' then 'Request Rejected' 
                      when cch_senttowinshuttle='399080000' then 'Rejected - Technical Reason' 
                      when cch_senttowinshuttle='399080001' then 'Rejected-Customer Already Exists' 
                      when cch_senttowinshuttle='399080002' then 'Rejected-Not Allowed Legal Entity' 
                      when cch_senttowinshuttle='399080003' then 'Completed' end

    - kind: checkpoint
      name: add_incident_mdrequest
      context_name: add_incident_mdrequest_1

    - kind: select
      name: select_incident_info
      context_name: add_incident_mdrequest
      params:
        columns:
          cch_winshuttleticketnumber: d365ticket
          mdrequeststatus: d365status
          ticketnumber: casenumber
          cch_casereferencename: casedescription
          cch_mdrequestdate: createdon
          cch_account: accountid
          cch_accountname: accountname
          cch_sladate: tocompletebefore
          dateofprocessingcompletion: processingcompletionon
          reasoncodename: changesource
