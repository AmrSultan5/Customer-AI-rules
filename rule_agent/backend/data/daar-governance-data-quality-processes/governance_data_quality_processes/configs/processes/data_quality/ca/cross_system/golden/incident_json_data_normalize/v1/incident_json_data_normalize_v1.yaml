    - kind: add
      name: add_join
      context_name: select_join
      params:
        - column: domain
          expression: '''customer'''
        - column: table_name
          expression: '''CONTACT RELATIONSHIP'''
        - column: src_system
          expression: '''d365_mdrequest_ticket'''
        - column: tgt_system
          expression: '''dummy'''
        - column: primary_key_l1
          expression: concat(partner,'_',lower(replace(cch_sapcrmguid, '-', '')))
        - column: loading_date
          expression: current_date()
        - column: initials
          expression: if(substr(partner, 1, 1) = 'P',3 ,
                    if(substr(partner, 1, 3) = '000', 5, 2))        
        - column: country
          expression: CASE 
                      WHEN initials = 2 THEN 
                        CASE SUBSTRING(partner, 1, 2)
