transform:
  name: dim_rule_group_mapping
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dim_rules_inventory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: dim_rules_inventory

  - kind: filter
    name: filter_sub_domain
    params:
      - condition:
          sub_domain != "Internal Order Settlement"
  - kind: select
    name: select_rule_group_mapping
    params:
      columns:
        rule_code: rule_code
        rule_group: group

  - kind: add
    name: add_rule_group
    context_name: select_rule_group_mapping
    params:
      - column: rule_group
        expression: explode(split(group, ','))

  - kind: select
    name: select_rule_group_mapping
    params:
      columns:
        rule_code: rule_code
        rule_group: rule_group

  - kind: write_dataio
    name: write_rule_group_mapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_rule_group_mapping
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full