transform:
  name: delivery_address_mdg_d365
  operations:

  # Read MDG but000 data
  - kind: read_dataio
    name: read_mdg_but000
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  # Filter MDG but000 data
  - kind: filter
    name: filter_mdg_but000
    context_name: read_mdg_but000
    params:
      - condition:
          xpcpt <> 'X' and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  # Select required columns from MDG but000
  - kind: select
    name: select_mdg_but000
    context_name: filter_mdg_but000
    params:
      columns:
        partner: partner_mdg
      distinct: true

  # Read MDG but020 data
  - kind: read_dataio
    name: read_mdg_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but020
      schema_version: v1

  # Select required columns from MDG but020
  - kind: select
    name: select_mdg_but020
    context_name: read_mdg_but020
    params:
      columns:
        partner: partner_mdg_but020
        addrnumber: addrnumber_mdg
      distinct: true

  # Read MDG adrc data
  - kind: read_dataio
    name: read_mdg_adrc
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adrc
      schema_version: v1

  # Filter MDG adrc data
  - kind: filter
    name: filter_mdg_adrc
    context_name: read_mdg_adrc
    params:
      - condition:
          nation = '' and (adrc_uuid <> '' and isnotnull(adrc_uuid))

  # Select and clean MDG adrc data
  - kind: select
    name: select_mdg_adrc_regex
    context_name: filter_mdg_adrc
    params:
      columns:
        addrnumber: addrnumber_mdg
        city1: city1_mdg_temp
        street: street_mdg_temp
        house_num1: house_num1_mdg_temp
        building: building_mdg_temp
        post_code1: post_code1_mdg_temp
        floor: floor_mdg_temp
        roomnumber: roomnumber_mdg_temp
        country: country_mdg_temp
        region: region_mdg_temp
        regiogroup: regiogroup_mdg_temp
        time_zone: time_zone_mdg_temp
        transpzone: transpzone_mdg_temp
      distinct: true


  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    context_name: read_mdg_knvv
    params:
      - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100)

  - kind: select
    name: select_mdg_knvv_checkpoint
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        kvgr4: kvgr4
        vkorg: vkorg
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: checkpoint
    name: select_knvv
    context_name: select_mdg_knvv_checkpoint



  - kind: add
    name: add_mdg_adrc
    context_name: select_mdg_adrc_regex
    params:
      - column: city1_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(city1_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: street_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(street_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: house_num1_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(house_num1_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: building_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(building_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: post_code1_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(post_code1_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: floor_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(floor_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: roomnumber_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(roomnumber_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: country_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(country_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: region_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(region_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: regiogroup_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(regiogroup_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: time_zone_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(time_zone_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: transpzone_mdg
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(transpzone_mdg_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))

  # Read MDG zmdgc_geo data
  - kind: read_dataio
    name: read_mdg_zmdgc_geo
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: zmdgc_geo
      schema_version: v1

  # Select required columns from MDG zmdgc_geo
  - kind: select
    name: select_mdg_zmdgc_geo
    context_name: read_mdg_zmdgc_geo
    params:
      columns:
        partner: partner_mdg_geo
        zlati: zlati_mdg_temp
        zlong: zlong_mdg_temp
      distinct: true

  - kind: add
    name: add_mdg_geo
    context_name: select_mdg_zmdgc_geo
    params:
      - column: zlati_mdg
        expression: cast(zlati_mdg_temp as decimal(13,10))
      - column: zlong_mdg
        expression: cast(zlong_mdg_temp as decimal(13,10))

  # Join MDG tables
  - kind: join
    name: join_mdg
    context_name: select_mdg_but000
    params:
      - other: select_mdg_but020
        how: inner
        columns:
          partner_mdg: partner_mdg_but020
      - other: select_knvv
        how: inner
        columns:
          partner_mdg: kunnr
      - other: add_mdg_adrc
        how: left
        columns:
          addrnumber_mdg: addrnumber_mdg
      - other: add_mdg_geo
        how: left
        columns:
          partner_mdg: partner_mdg_geo

  # Compute MDG hash
  - kind: add
    name: add_mdg
    context_name: join_mdg
    params:
      - column: hash_mdg
        expression: md5(concat(
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(partner_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(city1_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(street_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(house_num1_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(building_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(post_code1_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(floor_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(roomnumber_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(country_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(region_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(regiogroup_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(time_zone_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(transpzone_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(zlati_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(zlong_mdg, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
            ))

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: add_mdg



  # Read D365 account data
  - kind: read_dataio
    name: read_d365_account
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: account
      schema_version: v1

  # Filter D365 account data
  - kind: filter
    name: filter_d365_account
    context_name: read_d365_account
    params:
      - condition:
          cch_sapid like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%')

  # Select required columns from D365 account
  - kind: select
    name: select_d365_account
    context_name: filter_d365_account
    params:
      columns:
        cch_sapid: partner_d365
        address1_city: address1_city_temp
        address1_line1: address1_line1_temp
        address1_line2: address1_line2_temp
        address1_line3: address1_line3_temp
        address1_postalcode: address1_postalcode_temp
        cch_address1_floor: cch_address1_floor_temp
        cch_address1_room: cch_address1_room_temp
        cch_countryid: cch_countryid_d365
        cch_regionid: cch_regionid_d365
        cch_structuregroupingidname: cch_structuregrouping_temp
        cch_transportationzoneid: cch_transportationzoneid_d365
        cch_timezoneid: cch_timezoneid_d365
        cch_latitude: cch_latitude_temp
        cch_longitude: cch_longitude_temp
        cch_distributionchannel: cch_distributionchannel
        cch_division: cch_division        
        cch_salesorganizationid: cch_salesorganizationid
      distinct: true

  - kind: add
    name: add_d365_account
    context_name: select_d365_account
    params:
      - column: city1_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(address1_city_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: street_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(address1_line1_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: house_num1_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(address1_line2_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: building_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(address1_line3_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: post_code1_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(address1_postalcode_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: floor_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_address1_floor_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: roomnumber_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_address1_room_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: regiogroup_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_structuregrouping_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))
      - column: zlati_d365
        expression: cast(trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_latitude_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))) as decimal(13,10))
      - column: zlong_d365
        expression: cast(trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_longitude_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))) as decimal(13,10))

  # Read D365 cch_country data
  - kind: read_dataio
    name: read_d365_country
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_country
      schema_version: v1

  # Select required columns from D365 cch_country
  - kind: select
    name: select_d365_country
    context_name: read_d365_country
    params:
      columns:
        id: cch_countryid_d365
        cch_code: cch_code_country_temp
      distinct: true

  - kind: add
    name: add_d365_country
    context_name: select_d365_country
    params:
      - column: country_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_code_country_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))

  # Read D365 cch_region data
  - kind: read_dataio
    name: read_d365_region
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_region
      schema_version: v1

  # Select required columns from D365 cch_region
  - kind: select
    name: select_d365_region
    context_name: read_d365_region
    params:
      columns:
        id: cch_regionid_d365
        cch_code: cch_code_region_temp
      distinct: true

  - kind: add
    name: add_d365_region
    context_name: select_d365_region
    params:
      - column: region_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_code_region_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))

  # Read D365 cch_transportationzone data
  - kind: read_dataio
    name: read_d365_transportationzone
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_transportationzone
      schema_version: v1

  # Select required columns from D365 cch_transportationzone
  - kind: select
    name: select_d365_transportationzone
    context_name: read_d365_transportationzone
    params:
      columns:
        id: cch_transportationzoneid_d365
        cch_sapid: cch_sapid_transpzone_temp
      distinct: true

  - kind: add
    name: add_d365_transportationzone
    context_name: select_d365_transportationzone
    params:
      - column: transpzone_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_sapid_transpzone_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))

  # Read D365 cch_timezone data
  - kind: read_dataio
    name: read_d365_timezone
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_timezone
      schema_version: v1

  # Select required columns from D365 cch_timezone
  - kind: select
    name: select_d365_timezone
    context_name: read_d365_timezone
    params:
      columns:
        id: cch_timezoneid_d365
        cch_code: cch_code_timezone_temp
      distinct: true

  - kind: add
    name: add_d365_timezone
    context_name: select_d365_timezone
    params:
      - column: time_zone_d365
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(cch_code_timezone_temp, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', '')))


#   ###################################################
  - kind: read_dataio
    name: read_cch_optionsetmapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_optionsetmapping
      schema_version: v1   

      
  - kind: filter
    name: filter_cch_optionsetmapping_cd
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
  
  - kind: select
    name: union_cte_division
    context_name: filter_cch_optionsetmapping_cd
    params:
      columns:
        cch_optionsetvalue: cd_cch_optionsetvalue
        cch_externalvalue: cd_cch_externalvalue
      distinct: true
  
# ###################################################
#  distributionchannel
  - kind: filter
    name: filter_cch_optionsetmapping_dc
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
  
  - kind: select
    name: union_cte_distributionchannel
    context_name: filter_cch_optionsetmapping_dc
    params:
      columns:
        cch_optionsetvalue: dc_cch_optionsetvalue
        cch_externalvalue: dc_cch_externalvalue
      distinct: true

###########################

  - kind: read_dataio
    name: read_d365_territory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: territory
      schema_version: v1
  
  - kind: filter
    name: filter_territory
    context_name: read_d365_territory
    params:
      - condition: 1 = 1
  
  - kind: select
    name: select_d365_territory
    context_name: filter_territory
    params:
      columns:
        cch_sapid: territory_cch_sapid
        id: territory_id
      distinct: true        

###########################

  # Join D365 tables
  - kind: join
    name: join_d365
    context_name: add_d365_account
    params:
      - other: add_d365_country
        how: left
        columns:
          cch_countryid_d365: cch_countryid_d365
      - other: add_d365_region
        how: left
        columns:
          cch_regionid_d365: cch_regionid_d365
      - other: add_d365_transportationzone
        how: left
        columns:
          cch_transportationzoneid_d365: cch_transportationzoneid_d365
      - other: add_d365_timezone
        how: left
        columns:
          cch_timezoneid_d365: cch_timezoneid_d365          
      - other:
          union_cte_distributionchannel
        how:
          inner
        columns:
          cch_distributionchannel: dc_cch_optionsetvalue
      - other:
          union_cte_division
        how:
          inner
        columns:
          cch_division: cd_cch_optionsetvalue
      - other:
          select_d365_territory
        how:
          left
        columns:
          cch_salesorganizationid: territory_id

  # Compute D365 hash
  - kind: add
    name: add_d365
    context_name: join_d365
    params:
      - column: hash_d365
        expression: md5(concat(
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(partner_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(city1_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
            trim(lower(regexp_replace(regexp_replace(regexp_replace(coalesce( regexp_replace(street_d365, '\u00A0', ''),''), '\\n', ''), '\\r', ''), '\\t', ''))),
