          and (city1_d365 <> city1_mdg
          or street_d365 <> street_mdg
          or house_num1_d365 <> house_num1_mdg
          or building_d365 <> building_mdg
          or post_code1_d365 <> post_code1_mdg
          or floor_d365 <> floor_mdg
          or roomnumber_d365 <> roomnumber_mdg
          or country_d365 <> country_mdg
          or region_d365 <> region_mdg
          or regiogroup_d365 <> regiogroup_mdg
