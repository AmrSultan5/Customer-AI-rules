          mdg_pk = sap_pk and mdg_relationship <> sap_relationship

  - kind: filter
    name: filter_archiving_flag
    context_name: checkpoint_mdg_sap_remaining
    params:
      - condition:
          mdg_pk = sap_pk and mdg_archiving_flag <> sap_archiving_flag

  - kind: filter
