    context_name: checkpoint_mdg_sap_remaining
    params:
      - condition:
          mdg_pk = sap_pk and comparison_sap = 'Telephone' and mdg_r3_user = sap_r3_user
          and (coalesce(trim(mdg_telnr_long),'') <> coalesce(trim(sap_telnr_long),'') or mdg_flgdefault <> sap_flgdefault)

 


  - kind: filter
