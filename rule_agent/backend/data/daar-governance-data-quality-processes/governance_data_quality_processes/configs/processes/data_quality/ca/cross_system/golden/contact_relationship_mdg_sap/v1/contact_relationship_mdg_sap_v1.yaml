###########################################################


  - kind: add
    name: add_mdg_sap
    context_name: checkpoint_mdg_sap
    params:
      - column: comparison_mdg
        expression: CASE 
                      WHEN mdg_telnr_long IS NOT NULL AND mdg_r3_user IN ('', '1') THEN 'Telephone'
                      WHEN mdg_telnr_long IS NOT NULL AND mdg_r3_user IN ('2', '3') THEN 'Mobile Number'
                      WHEN mdg_email IS NOT NULL THEN 'E-mail'
                      WHEN mdg_fax_number IS NOT NULL THEN 'Fax'
                      ELSE 'No address info available'
                    END
      - column: comparison_sap
        expression: CASE 
                      WHEN sap_telnr_long IS NOT NULL AND sap_r3_user IN ('', '1') THEN 'Telephone'
                      WHEN sap_telnr_long IS NOT NULL AND sap_r3_user IN ('2', '3') THEN 'Mobile Number'
                      WHEN sap_email IS NOT NULL THEN 'E-mail'
                      WHEN sap_fax_number IS NOT NULL THEN 'Fax'
                      ELSE 'No address info available'
                    END
      - column: mdg_r3_user_out
        expression: CASE 
                      WHEN comparison_mdg IN ('E-mail', 'Fax', 'No contact info available') THEN '0'
                      ELSE mdg_r3_user
                    END
      - column: sap_r3_user_out
        expression: CASE 
                      WHEN comparison_sap IN ('E-mail', 'Fax', 'No contact info available') THEN '0'
                      ELSE sap_r3_user
                    END


