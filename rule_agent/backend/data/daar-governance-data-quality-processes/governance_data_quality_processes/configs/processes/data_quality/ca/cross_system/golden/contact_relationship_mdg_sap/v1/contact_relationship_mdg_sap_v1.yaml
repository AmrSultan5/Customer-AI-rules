transform:
  name: cross_system_contact_relationship_mdg_sap
  operations:

  - kind: read_dataio
    name: read_mdg_but000_1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but000
      schema_version: v1

  - kind: read_dataio
    name: read_mdg_but051_1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: contact_person_relationships
      object_name: but051
      schema_version: v1

  - kind: filter
    name: read_mdg_but051
    context_name: read_mdg_but051_1
    params:
      - condition: reltyp = 'BUR001' and partner1 like any ('96%','12%','28%','13%','27%','40%','18%','32%','35%','30%','25%','16%','34%','29%','42%','33%','31%','17%','15%','95%','94%','24%','26%','14%','21%','19%','22%','47%')

########################################
  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_mdg_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd
      distinct: true

  - kind: filter
    name: filter_mdg_kna1_1
    context_name: select_mdg_kna1
    params:
      - condition: ktokd LIKE ANY ('7%','9%') AND aufsd NOT IN ('E','G','S1','S','NH','S3','S4','SY','SP','R','U')

##########
  - kind: read_dataio
    name: read_mdg_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1
  
  - kind: filter
    name: filter_knvv
    context_name: read_mdg_knvv
    params:
      - condition: vtweg = '01' AND spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
  
  - kind: select
    name: select_mdg_knvv_checkpoint
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr_knvv
      distinct: true
########################################
  - kind: join
    name: filter_mdg_kna1
    context_name: filter_mdg_kna1_1
    params:
      - other:
          select_mdg_knvv_checkpoint
        how:
          inner
        columns:
          kunnr: kunnr_knvv

########################################

  - kind: read_dataio
    name: read_mdg_but020
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: but020
      schema_version: v1

  - kind: read_dataio
    name: read_mdg_adr2
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adr2
      schema_version: v1

  - kind: read_dataio
    name: read_mdg_adr3
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adr3
      schema_version: v1

  - kind: read_dataio
    name: read_mdg_adr6
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: address_and_communication_data
      object_name: adr6
      schema_version: v1


##################################################
  - kind: filter
    name: read_mdg_but000
    context_name: read_mdg_but000_1
    params:
      - condition: persnumber <> ''
##################################################
  - kind: select
    name: select_mdg_but000_columns
    context_name: read_mdg_but000
    params:
      columns:
        partner: partner
        persnumber: persnumber
        partner_guid: partner_guid
        xdele: xdele_mdg_but000_temp
        name_last: name_last_mdg_but000_temp
        name_first: name_first_mdg_but000_temp
        namcountry: namcountry_mdg_but000_temp
      distinct: true

  - kind: add
    name: select_mdg_but000_cleanse
    context_name: select_mdg_but000_columns
    params:
      - column: xdele_mdg_but000
        expression: coalesce(xdele_mdg_but000_temp,'')
      - column: name_last_mdg_but000
        expression: coalesce(name_last_mdg_but000_temp,'')
      - column: name_first_mdg_but000
        expression: coalesce(name_first_mdg_but000_temp,'')
      - column: namcountry_mdg_but000
        expression: coalesce(namcountry_mdg_but000_temp,'')
        
  - kind: select
    name: select_mdg_but000
    context_name: select_mdg_but000_cleanse
    params:
      columns:
        partner: partner_mdg_but000
        persnumber: persnumber_mdg_but000
        partner_guid: partner_guid_mdg_but000
        xdele_mdg_but000: xdele_mdg_but000
        name_last_mdg_but000: name_last_mdg_but000
        name_first_mdg_but000: name_first_mdg_but000
        namcountry_mdg_but000: namcountry_mdg_but000
      distinct: true
##################################################





  - kind: select
    name: select_mdg_but000_lookup_select
    context_name: read_mdg_but000_1
    params:
      columns:
        partner: partner_mdg_but000_lookup
        bu_group: bu_group_mdg_but000_lookup
      distinct: true




##################################################
  - kind: filter
    name: select_mdg_but000_lookup
    context_name: select_mdg_but000_lookup_select
    params:
      - condition: bu_group LIKE '7%' OR bu_group LIKE '9%'
##################################################

  - kind: select
    name: mdg_but051_select
    context_name: read_mdg_but051
    params:
      columns:
        relnr: relnr_mdg_but051_temp
        partner1: partner1
        partner2: partner2
        reltyp: reltyp
        pafkt: pafkt_mdg_but051_temp
      distinct: true

  - kind: add
    name: mdg_but051_cleanse
    context_name: mdg_but051_select
    params:
      - column: relnr_mdg_but051
        expression: coalesce(relnr_mdg_but051_temp,'')
      - column: pafkt_mdg_but051
        expression: coalesce(pafkt_mdg_but051_temp,'')

  - kind: select
    name: mdg_but051
    context_name: mdg_but051_cleanse
    params:
      columns:
        relnr_mdg_but051: relnr_mdg_but051
        partner1: partner1_mdg_but051
        partner2: partner2_mdg_but051
        reltyp: reltyp_mdg_but051
        pafkt_mdg_but051: pafkt_mdg_but051
      distinct: true
        

###################################################
  - kind: join
    name: select_mdg_but051
    context_name: mdg_but051
    params:
      - other:
          filter_mdg_kna1
        how:
          inner
        columns:
          partner1_mdg_but051: kunnr
###################################################





  - kind: select
    name: select_mdg_but020
    context_name: read_mdg_but020
    params:
      columns:
        partner: partner_mdg_but020
        addrnumber: addrnumber_mdg_but020
      distinct: true
########################################################################
  - kind: select
    name: select_mdg_adr2_select
    context_name: read_mdg_adr2
    params:
      columns:
        addrnumber: addrnumber_temp
        persnumber: persnumber_temp
        r3_user: r3_user_mdg_adr2_temp
        telnr_long: telnr_long_mdg_adr2_temp
        consnumber: consnumber_mdg_adr2_temp
        flgdefault: flgdefault_mdg_adr2_temp     
      distinct: true

  - kind: add
    name: select_mdg_adr2_cleanse
    context_name: select_mdg_adr2_select
    params:
      - column: addrnumber_mdg_adr2
        expression: coalesce(addrnumber_temp,'')
      - column: persnumber_mdg_adr2
        expression: coalesce(persnumber_temp,'')
      - column: r3_user_mdg_adr2
        expression: coalesce(r3_user_mdg_adr2_temp,'')
      - column: telnr_long_mdg_adr2
        expression: coalesce(telnr_long_mdg_adr2_temp,'')
      - column: consnumber_mdg_adr2
        expression: coalesce(consnumber_mdg_adr2_temp,'')
      - column: flgdefault_mdg_adr2
        expression: coalesce(flgdefault_mdg_adr2_temp,'')
        
  - kind: select
    name: select_mdg_adr2
    context_name: select_mdg_adr2_cleanse
    params:
      columns:
        addrnumber_mdg_adr2: addrnumber_mdg_adr2
        persnumber_mdg_adr2: persnumber_mdg_adr2
        r3_user_mdg_adr2: r3_user_mdg_adr2
        telnr_long_mdg_adr2: telnr_long_mdg_adr2
        consnumber_mdg_adr2: consnumber_mdg_adr2
        flgdefault_mdg_adr2: flgdefault_mdg_adr2     
      distinct: true 

##################################################################

  - kind: select
    name: select_mdg_adr3_select
    context_name: read_mdg_adr3
    params:
      columns:
        addrnumber: addrnumber_temp
        persnumber: persnumber_temp
        fax_number: fax_number_mdg_adr3_temp
        consnumber: consnumber_mdg_adr3_temp
        flgdefault: flgdefault_mdg_adr3_temp   
      distinct: true

  - kind: add
    name: select_mdg_adr3_cleanse
    context_name: select_mdg_adr3_select
    params:
      - column: addrnumber_mdg_adr3
        expression: coalesce(addrnumber_temp,'')
      - column: persnumber_mdg_adr3
        expression: coalesce(persnumber_temp,'')
      - column: fax_number_mdg_adr3
        expression: coalesce(fax_number_mdg_adr3_temp,'')
      - column: consnumber_mdg_adr3
        expression: coalesce(consnumber_mdg_adr3_temp,'')
      - column: flgdefault_mdg_adr3
        expression: coalesce(flgdefault_mdg_adr3_temp,'')
        
  - kind: select
    name: select_mdg_adr3
    context_name: select_mdg_adr3_cleanse
    params:
      columns:
        addrnumber_mdg_adr3: addrnumber_mdg_adr3
        persnumber_mdg_adr3: persnumber_mdg_adr3
        fax_number_mdg_adr3: fax_number_mdg_adr3
        consnumber_mdg_adr3: consnumber_mdg_adr3
        flgdefault_mdg_adr3: flgdefault_mdg_adr3
      distinct: true 

##################################################################




  - kind: select
    name: select_mdg_adr6_select
    context_name: read_mdg_adr6
    params:
      columns:
        addrnumber: addrnumber_temp
        persnumber: persnumber_temp
        smtp_addr: smtp_addr_mdg_adr6_temp
        consnumber: consnumber_mdg_adr6_temp
        flgdefault: flgdefault_mdg_adr6_temp
      distinct: true

  - kind: add
    name: select_mdg_adr6_cleanse
    context_name: select_mdg_adr6_select
    params:
      - column: addrnumber_mdg_adr6
        expression: coalesce(addrnumber_temp,'')
      - column: persnumber_mdg_adr6
        expression: coalesce(persnumber_temp,'')
      - column: smtp_addr_mdg_adr6
        expression: coalesce(smtp_addr_mdg_adr6_temp,'')
      - column: consnumber_mdg_adr6
        expression: coalesce(consnumber_mdg_adr6_temp,'')
      - column: flgdefault_mdg_adr6
        expression: coalesce(flgdefault_mdg_adr6_temp,'')
        
  - kind: select
    name: select_mdg_adr6
    context_name: select_mdg_adr6_cleanse
    params:
      columns:
        addrnumber_mdg_adr6: addrnumber_mdg_adr6
        persnumber_mdg_adr6: persnumber_mdg_adr6
        smtp_addr_mdg_adr6: smtp_addr_mdg_adr6
        consnumber_mdg_adr6: consnumber_mdg_adr6
        flgdefault_mdg_adr6: flgdefault_mdg_adr6
      distinct: true 

##################################################################





  - kind: add
    name: add_mdg_but051
    context_name: select_mdg_but051
    params:
      - column: initials_mdg_but051
        expression: if(substr(partner1_mdg_but051, 1, 1) = 'P',3 ,
                    if(substr(partner1_mdg_but051, 1, 3) = '000', 5, 2))
      - column: mdg_country_mdg_but051
        expression: CASE 
                      WHEN initials_mdg_but051 = 2 THEN 
                        CASE SUBSTRING(partner1_mdg_but051, 1, 2)
                          WHEN '96' THEN 'AM'
                          WHEN '12' THEN 'AT'
                          WHEN '28' THEN 'BA'
                          WHEN '13' THEN 'BG'
                          WHEN '23' THEN 'BY'
                          WHEN '27' THEN 'CH'
                          WHEN '18' THEN 'CZ'
                          WHEN '32' THEN 'EE'
                          WHEN '35' THEN 'GB'
                          WHEN '30' THEN 'GR'
                          WHEN '25' THEN 'HR'
                          WHEN '16' THEN 'HU'
                          WHEN '34' THEN 'IE'
                          WHEN '29' THEN 'IT'
                          WHEN '42' THEN 'KV'
                          WHEN '33' THEN 'LT'
                          WHEN '31' THEN 'LV'
                          WHEN '17' THEN 'MD'
                          WHEN '15' THEN 'ME'
                          WHEN '95' THEN 'MK'
                          WHEN '94' THEN 'NG'
                          WHEN '24' THEN 'PL'
                          WHEN '26' THEN 'RO'
                          WHEN '38' THEN 'RU'
                          WHEN '21' THEN 'SI'
                          WHEN '19' THEN 'SK'
                          WHEN '14' THEN 'RS'
                          WHEN '22' THEN 'UA'
                          WHEN '40' THEN 'CY'
                          WHEN '47' THEN 'EG'
                          ELSE NULL
                        END
                      WHEN initials_mdg_but051 = 3 THEN 
                        CASE SUBSTRING(partner1_mdg_but051, 1, 3)
                          WHEN 'P96' THEN 'AM'
                          WHEN 'P11' THEN 'AT'
                          WHEN 'P86' THEN 'BA'
                          WHEN 'P49' THEN 'BG'
                          WHEN 'P23' THEN 'BY'
                          WHEN 'P55' THEN 'CH'
                          WHEN 'P51' THEN 'CY'
                          WHEN 'P45' THEN 'CZ'
                          WHEN 'P32' THEN 'EE'
                          WHEN 'P79' THEN 'GB'
                          WHEN 'P12' THEN 'GR'
                          WHEN 'P80' THEN 'HR'
                          WHEN 'P28' THEN 'HU'
                          WHEN 'P78' THEN 'IE'
                          WHEN 'P63' THEN 'IT'
                          WHEN 'P92' THEN 'KV'
                          WHEN 'P33' THEN 'LT'
                          WHEN 'P31' THEN 'LV'
                          WHEN 'P20' THEN 'MD'
                          WHEN 'P82' THEN 'ME'
                          WHEN 'P95' THEN 'MK'
                          WHEN 'P94' THEN 'NG'
                          WHEN 'P61' THEN 'PL'
                          WHEN 'P91' THEN 'RO'
                          WHEN 'P25' THEN 'RS'
                          WHEN 'P85' THEN 'SI'
                          WHEN 'P41' THEN 'SK'
                          WHEN 'P72' THEN 'UA'
                          WHEN 'P47' THEN 'EG'
                          WHEN 'E96' THEN 'AM'
                          WHEN 'E12' THEN 'AT'
                          WHEN 'E28' THEN 'BA'
                          WHEN 'E13' THEN 'BG'
                          WHEN 'E23' THEN 'BY'
                          WHEN 'E27' THEN 'CH'
                          WHEN 'E40' THEN 'CY'
                          WHEN 'E18' THEN 'CZ'
                          WHEN 'E32' THEN 'EE'
                          WHEN 'E47' THEN 'EG'
                          WHEN 'E35' THEN 'GB'
                          WHEN 'E30' THEN 'GR'
                          WHEN 'E25' THEN 'HR'
                          WHEN 'E16' THEN 'HU'
                          WHEN 'E34' THEN 'IE'
                          WHEN 'E29' THEN 'IT'
                          WHEN 'E42' THEN 'KV'
                          WHEN 'E33' THEN 'LT'
                          WHEN 'E31' THEN 'LV'
                          WHEN 'E17' THEN 'MD'
                          WHEN 'E15' THEN 'ME'
                          WHEN 'E95' THEN 'MK'
                          WHEN 'E94' THEN 'NG'
                          WHEN 'E24' THEN 'PL'
                          WHEN 'E26' THEN 'RO'
                          WHEN 'E14' THEN 'RS'
                          WHEN 'E21' THEN 'SI'
                          WHEN 'E19' THEN 'SK'
                          WHEN 'E22' THEN 'UA'
                          ELSE NULL
                        END
                        WHEN initials_mdg_but051 = 5 THEN 
                          CASE SUBSTRING(partner1_mdg_but051, 1, 5)
                            WHEN '00096' THEN 'AM'
                            WHEN '00012' THEN 'AT'
                            WHEN '00028' THEN 'BA'
                            WHEN '00013' THEN 'BG'
                            WHEN '00023' THEN 'BY'
                            WHEN '00027' THEN 'CH'
                            WHEN '00018' THEN 'CZ'
                            WHEN '00032' THEN 'EE'
                            WHEN '00035' THEN 'GB'
                            WHEN '00030' THEN 'GR'
                            WHEN '00025' THEN 'HR'
                            WHEN '00016' THEN 'HU'
                            WHEN '00034' THEN 'IE'
                            WHEN '00029' THEN 'IT'
                            WHEN '00042' THEN 'KV'
                            WHEN '00033' THEN 'LT'
                            WHEN '00031' THEN 'LV'
                            WHEN '00017' THEN 'MD'
                            WHEN '00015' THEN 'ME'
                            WHEN '00095' THEN 'MK'
                            WHEN '00094' THEN 'NG'
                            WHEN '00024' THEN 'PL'
                            WHEN '00026' THEN 'RO'
                            WHEN '00038' THEN 'RU'
                            WHEN '00021' THEN 'SI'
                            WHEN '00019' THEN 'SK'
                            WHEN '00014' THEN 'RS'
                            WHEN '00022' THEN 'UA'
                            WHEN '00040' THEN 'CY'
                            WHEN '00047' THEN 'EG'
                            ELSE NULL
                          END
                    END

  - kind: join
    name: join_mdg_but051_lookup
    context_name: add_mdg_but051
    params:
      - other:
          select_mdg_but000_lookup
        how:
          left
        columns:
          partner1_mdg_but051: partner_mdg_but000_lookup

  - kind: add
    name: add_mdg_but051_lookup
    context_name: join_mdg_but051_lookup
    params:
      - column: var_d_account_group_code_mdg_but051
        expression: CASE bu_group_mdg_but000_lookup
                      WHEN '7012' THEN 'CCHBC Beverage     Vending  AT'
                      WHEN '7016' THEN 'CCHBC Beverage     Vending  HU'
                      WHEN '7018' THEN 'CCHBC Beverage     Vending  CZ'
                      WHEN '7019' THEN 'CCHBC Beverage     Vending  SK'
                      WHEN '7024' THEN 'CCHBC Beverage     Vending  PL'
                      WHEN '7025' THEN 'CCHBC Beverage     Vending  HR'
                      WHEN '7026' THEN 'CCHBC Beverage     Vending  RO'
                      WHEN '7027' THEN 'CCHBC Beverage   Vending  CH'
                      WHEN '7029' THEN 'CCHBC Beverage     Vending  IT'
                      WHEN '7030' THEN 'CCHBC Beverage     Vending  GR'
                      WHEN '7034' THEN 'CCHBC Beverage     Vending  RI'
                      WHEN '7035' THEN 'CCHBC Beverage     Vending  NI'
                      WHEN '7038' THEN 'CCHBC Beverage     Vending  RU'
                      WHEN '7112' THEN 'CCHBC Cup           Vending AT'
                      WHEN '7116' THEN 'CCHBC Cup           Vending HU'
                      WHEN '7118' THEN 'CCHBC Cup           Vending CZ'
                      WHEN '7119' THEN 'CCHBC Cup           Vending SK'
                      WHEN '7124' THEN 'CCHBC Cup           Vending PL'
                      WHEN '7126' THEN 'CCHBC Cup           Vending RO'
                      WHEN '7127' THEN 'CCHBC Cup           Vending CH'
                      WHEN '7129' THEN 'CCHBC Cup           Vending IT'
                      WHEN '7130' THEN 'CCHBC Cup           Vending GR'
                      WHEN '7134' THEN 'CCHBC Cup           Vending RI'
                      WHEN '7135' THEN 'CCHBC Cup           Vending NI'
                      WHEN '7138' THEN 'CCHBC Cup           Vending RU'
                      WHEN '7212' THEN 'CCHBC Snack         Vending AT'
                      WHEN '7216' THEN 'CCHBC Snack         Vending HU'
                      WHEN '7218' THEN 'CCHBC Snack         Vending CZ'
                      WHEN '7219' THEN 'CCHBC Snack         Vending SK'
                      WHEN '7229' THEN 'CCHBC Snack         Vending IT'
                      WHEN '7230' THEN 'CCHBC Snack         Vending GR'
                      WHEN '7234' THEN 'CCHBC Snack         Vending RI'
                      WHEN '7235' THEN 'CCHBC Snack         Vending NI'
                      WHEN '7312' THEN 'CCHBC Combined      Vending AT'
                      WHEN '7316' THEN 'CCHBC Combined      Vending HU'
                      WHEN '7318' THEN 'CCHBC Combined      Vending CZ'
                      WHEN '7319' THEN 'CCHBC Combined      Vending SK'
                      WHEN '7329' THEN 'CCHBC Combined      Vending IT'
                      WHEN '7330' THEN 'CCHBC Combined      Vending GR'
                      WHEN '7334' THEN 'CCHBC Combined      Vending RI'
                      WHEN '7335' THEN 'CCHBC Combined      Vending NI'
                      WHEN '9012' THEN 'CCHBC Trade customers AT'
                      WHEN '9013' THEN 'CCHBC Trade customers BG'
                      WHEN '9014' THEN 'CCHBC Trade customers RS'
                      WHEN '9015' THEN 'CCHBC Trade customers ME'
                      WHEN '9016' THEN 'CCHBC Trade customers HU'
                      WHEN '9017' THEN 'CCHBC Trade customers MD'
                      WHEN '9018' THEN 'CCHBC Trade customers CZ'
                      WHEN '9019' THEN 'CCHBC Trade customers SK'
                      WHEN '9021' THEN 'CCHBC Trade customers SI'
                      WHEN '9022' THEN 'CCHBC Trade customers UA'
                      WHEN '9023' THEN 'CCHBC Trade customers BY'
                      WHEN '9024' THEN 'CCHBC Trade customers PL'
                      WHEN '9025' THEN 'CCHBC Trade customers HR'
                      WHEN '9026' THEN 'CCHBC Trade customers RO'
                      WHEN '9027' THEN 'CCHBC Trade customers CH'
                      WHEN '9028' THEN 'CCHBC Trade customers BA'
                      WHEN '9029' THEN 'CCHBC Trade customers IT'
                      WHEN '9030' THEN 'CCHBC Trade customers GR'
                      WHEN '9031' THEN 'CCHBC Trade customers LV'
                      WHEN '9032' THEN 'CCHBC Trade customers EE'
                      WHEN '9033' THEN 'CCHBC Trade customers LT'
                      WHEN '9034' THEN 'CCHBC Trade customers RI'
                      WHEN '9035' THEN 'CCHBC Trade customers NI'
                      WHEN '9037' THEN 'CCHBC Trade customers CH Valser'
                      WHEN '9038' THEN 'CCHBC Trade customers RU'
                      WHEN '9040' THEN 'CCHBC Trade customers CY'
                      WHEN '9041' THEN 'CCHBC Trade customers BG SHS'
                      WHEN '9042' THEN 'CCHBC Trade customers XK'
                      WHEN '9047' THEN 'CCHBC Trade customers EG'
                      WHEN '9088' THEN 'CCHBC Trade customers GR HO'
                      WHEN '9094' THEN 'CCHBC Trade customers NG'
                      WHEN '9095' THEN 'CCHBC Trade customers MK'
                      WHEN '9096' THEN 'CCHBC Trade customers AM'
                      WHEN '9999' THEN 'CCH Sochi Olympics Customers'
                      ELSE 'NOT AVAILABLE'
                    END
      - column: account_group_mdg_but051
        expression: concat(bu_group_mdg_but000_lookup, ' - ', regexp_replace(var_d_account_group_code_mdg_but051, '\\s+', ' '))

  - kind: filter
    name: filter_mdg_but051_lookup
    context_name: add_mdg_but051_lookup
    params:
      - condition:
