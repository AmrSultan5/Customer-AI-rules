    context_name: join_mdg_sap_remaining

  - kind: filter
    name: filter_name_first
    context_name: checkpoint_mdg_sap_remaining
    params:
      - condition:
          mdg_pk = sap_pk and coalesce(trim(lower(regexp_replace(mdg_name_first, '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'') <> coalesce(trim(lower(regexp_replace(sap_name_first, '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')


  - kind: filter
    name: filter_name_last
    context_name: checkpoint_mdg_sap_remaining
    params:
      - condition:
          mdg_pk = sap_pk and coalesce(trim(lower(regexp_replace(mdg_name_last, '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'') <> coalesce(trim(lower(regexp_replace(sap_name_last, '[\u00A0\u2000-\u200B\u202F\u205F\u3000]', ''))),'')


  - kind: filter
    name: filter_relationship
    context_name: checkpoint_mdg_sap_remaining
    params:
