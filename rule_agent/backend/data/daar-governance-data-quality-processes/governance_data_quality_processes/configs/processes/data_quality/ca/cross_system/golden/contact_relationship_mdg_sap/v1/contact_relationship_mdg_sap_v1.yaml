  - kind: add
    name: add_mismatched_detailed
    context_name: join_mismatched
    params:
      - column: table_name
        expression: '''CONTACT AND RELATIONSHIP'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''sap'''
      - column: dimension
        expression: '''attributes are mismatching'''
      - column: partner_function_description
        expression: CASE mdg_relationship
                      WHEN 'Z2' THEN 'BY VAT E-invoicing'
                      WHEN 'F4' THEN 'Cash receipt'
                      WHEN 'F5' THEN 'Commercial Contract'
                      WHEN 'Z4' THEN 'Contact Person E & SMS'
                      WHEN 'Z1' THEN 'Contact Person HHT'
                      WHEN 'Z3' THEN 'Customer Portal User'
                      WHEN 'DF' THEN 'Default contact'
                      WHEN '0001' THEN 'Executive Board'
                      WHEN 'FX' THEN 'Fax recepient'
                      WHEN 'F1' THEN 'Finance Contact'
                      WHEN 'Z5' THEN 'Commercial'
                      WHEN 'Z6' THEN 'Legal'
                      WHEN 'Z7' THEN 'Logistics'
                      WHEN 'F2' THEN 'Finance Contact BalC'
                      WHEN 'F3' THEN 'Finance Contact BonN'
                      WHEN '0009' THEN 'Financial Accounting Manager'
                      WHEN '0004' THEN 'Head of Personnel'
                      WHEN '0008' THEN 'IT Manager'
                      WHEN '0010' THEN 'Marketing Manager'
                      WHEN '0007' THEN 'Personal Assistant'
                      WHEN '0006' THEN 'Production Manager'
                      WHEN '0002' THEN 'Purchasing Manager'
                      WHEN '0005' THEN 'Quality Officer'
                      WHEN '0003' THEN 'Sales Manager'
                      ELSE NULL
                    END
      - column: loading_date
        expression: current_date()
      - column: src_attr_value
        expression: CASE attr_name
                      WHEN 'Telephone' THEN concat('Tel Nr ', mdg_telnr_long, ' | Def Flg ', CAST(mdg_flgdefault AS STRING))
                      WHEN 'Mobile Number' THEN concat('Tel Nr ', mdg_telnr_long, ' | Def Flg ', CAST(mdg_flgdefault AS STRING))
                      WHEN 'E-mail' THEN concat('Email ', mdg_email, ' | Def Flg ', CAST(mdg_flgdefault AS STRING))
                      WHEN 'Fax' THEN concat('Fax ', mdg_fax_number, ' | Def Flg ', CAST(mdg_flgdefault AS STRING)) 
                      WHEN 'First Name' THEN mdg_name_first
                      WHEN 'Last Name' THEN mdg_name_last
                      WHEN 'Function' THEN mdg_relationship
                      WHEN 'Archiving Flag' THEN mdg_archiving_flag
                      ELSE ''
                      END                                        
      - column: tgt_attr_value
        expression: CASE attr_name
                      WHEN 'Telephone' THEN concat('Tel Nr ', sap_telnr_long, ' | Def Flg ', CAST(sap_flgdefault AS STRING))
                      WHEN 'Mobile Number' THEN concat('Tel Nr ', sap_telnr_long, ' | Def Flg ', CAST(sap_flgdefault AS STRING))
                      WHEN 'E-mail' THEN concat('Email ', sap_email, ' | Def Flg ', CAST(sap_flgdefault AS STRING))
                      WHEN 'Fax' THEN concat('Fax ', sap_fax_number, ' | Def Flg ', CAST(sap_flgdefault AS STRING))
                      WHEN 'First Name' THEN sap_name_first
                      WHEN 'Last Name' THEN sap_name_last
                      WHEN 'Function' THEN sap_relationship
                      WHEN 'Archiving Flag' THEN sap_archiving_flag
                      ELSE ''                      
                    END
      - column: domain
        expression: '''CUSTOMER'''




