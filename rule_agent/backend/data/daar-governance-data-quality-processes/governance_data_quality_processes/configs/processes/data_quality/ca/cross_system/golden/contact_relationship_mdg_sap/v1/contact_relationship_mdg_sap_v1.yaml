      - column: dimension
        expression: '''TOTAL COUNT'''
      - column: sap
        expression: concat(sap_partner, sap_partner_contact)    

  - kind: group
    name: group_sap_agg
    context_name: add_sap_agg
    params:
      - aggs:
          sap: count
        by:
        - country
        - table_name
        - src_system
        - dimension

  - kind: add
    name: add_sap_agg_loading_date
    context_name: group_sap_agg
    params:
      - column: loading_date
        expression: current_date()
      - column: tgt_system
        expression: '''mdg'''
      - column: cnt
        expression: CAST(count_sap AS INT)

  - kind: select
    name: select_sap_agg
    context_name: add_sap_agg_loading_date
    params:
      columns:
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        dimension: dimension
        cnt: cnt
        country: country
        loading_date: loading_date
      distinct: true

  - kind: select
