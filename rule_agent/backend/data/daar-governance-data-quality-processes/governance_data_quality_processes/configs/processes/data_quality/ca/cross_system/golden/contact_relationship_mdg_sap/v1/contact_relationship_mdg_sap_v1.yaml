      - column: src_system
        expression: '''mdg'''
      - column: dimension
        expression: '''ATTRIBUTES ARE MISMATCHING'''
      - column: mdg
        expression: concat(mdg_partner, mdg_partner_contact)

  - kind: group
    name: group_mismatched_agg
    context_name: add_mismatched_agg
    params:
      - aggs:
          mdg: count
        by:
        - mdg_country
        - table_name
        - src_system
        - dimension

  - kind: add
    name: add_mdg_mismatched_agg_loading_date
    context_name: group_mismatched_agg
    params:
      - column: loading_date
        expression: current_date()
      - column: tgt_system
        expression: '''sap'''
      - column: cnt
        expression: CAST(count_mdg AS INT)

  - kind: select
    name: select_mdg_mismatched_agg
    context_name: add_mdg_mismatched_agg_loading_date
    params:
      columns:
        table_name: table_name
        src_system: src_system
        tgt_system: tgt_system
        dimension: dimension
        cnt: cnt
        mdg_country: country
        loading_date: loading_date
      distinct: true

  - kind: union
    name: union_agg
    context_name: select_mdg_agg
    params:
      allow_missing: true
      by_name: true
      other: select_sap_agg

  - kind: union
    name: union_agg
    params:
      allow_missing: true
      by_name: true
      other: select_mdg_mismatched_agg

  - kind: union
