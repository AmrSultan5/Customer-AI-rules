transform:
  name: tax_data_mdg_sap
  operations:

  - kind: read_dataio
    name: read_mdg_dfkkbptaxnum
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: business_partner
      object_name: dfkkbptaxnum
      schema_version: v1

  - kind: filter
    name: filter_mdg_dfkkbptaxnum
    context_name: read_mdg_dfkkbptaxnum
    params:
      - condition:
          partner not like '000%' and (taxtype like '%0'
          or taxtype like '%1'
          or taxtype like '%2'
          or taxtype like '%3'
          or taxtype like '%4'
          or taxtype like '%5')
          and partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', 
          '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '14%', '22%','47%')

  - kind: add
    name: add_mdg_dfkkbptaxnum
    context_name: filter_mdg_dfkkbptaxnum
    params:
      - column: taxnum0
        expression: if(taxtype like '%0', taxnum, '')
      - column: taxnum1
        expression: if(taxtype like '%1', taxnum, '')
      - column: taxnum2
        expression: if(taxtype like '%2', taxnum, '')
      - column: taxnum3
        expression: if(taxtype like '%3', taxnum, '')
      - column: taxnum4
        expression: if(taxtype like '%4', taxnum, '')
      - column: taxnum5
        expression: if(taxtype like '%5', taxnum, '')
      - column: taxtype0
        expression: if(taxtype like '%0', taxtype, '')
      - column: taxtype1
        expression: if(taxtype like '%1', taxtype, '')
      - column: taxtype2
        expression: if(taxtype like '%2', taxtype, '')
      - column: taxtype3
        expression: if(taxtype like '%3', taxtype, '')
      - column: taxtype4
        expression: if(taxtype like '%4', taxtype, '')
      - column: taxtype5
        expression: if(taxtype like '%5', taxtype, '')


  - kind: group
    name: group_mdg_dfkkbptaxnum
    context_name: add_mdg_dfkkbptaxnum
    params:
      - aggs:
          taxnum0: max
          taxnum1: max
          taxnum2: max
          taxnum3: max
          taxnum4: max
          taxnum5: max
          taxtype0: max
          taxtype1: max
          taxtype2: max
          taxtype3: max
          taxtype4: max
          taxtype5: max
        by:
        - partner


  - kind: rename
    name: rename_mdg_dfkkbptaxnum
    context_name: group_mdg_dfkkbptaxnum
    params:
      - column: partner
        to: partner_mdg
      - column: max_taxnum0
        to: taxnum0_mdg
      - column: max_taxnum1
        to: taxnum1_mdg
      - column: max_taxnum2
        to: taxnum2_mdg
      - column: max_taxnum3
        to: taxnum3_mdg
      - column: max_taxnum4
        to: taxnum4_mdg
      - column: max_taxnum5
        to: taxnum5_mdg
      - column: max_taxtype0
        to: taxtype0_mdg
      - column: max_taxtype1
        to: taxtype1_mdg
      - column: max_taxtype2
        to: taxtype2_mdg
      - column: max_taxtype3
        to: taxtype3_mdg
      - column: max_taxtype4
        to: taxtype4_mdg
      - column: max_taxtype5
        to: taxtype5_mdg


  - kind: add
    name: add_mdg
    context_name: rename_mdg_dfkkbptaxnum
    params:
      - column: hash_mdg
        expression: md5(concat_ws('',
                    partner_mdg, 
                    taxnum0_mdg, 
                    taxnum1_mdg, 
                    taxnum2_mdg, 
                    taxnum3_mdg,
                    taxnum4_mdg,
                    taxnum5_mdg))

  - kind: read_dataio
    name: read_knvv
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv
    params:
      - condition:
          vtweg = '01' and spart = '01' and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700)

  - kind: select
    name: select_knvv_1
    context_name: filter_knvv
    params:
      columns:
        kunnr: kunnr
        vkorg: vkorg
        kvgr4: kvgr4
        vtweg: vtweg
        spart: spart
      distinct: true

  - kind: checkpoint
    name: select_knvv
    context_name: select_knvv_1

  - kind: join
    name: join_mdg
    context_name: add_mdg
    params:
      - other:
          select_knvv
        how:
          inner
        columns:
          partner_mdg: kunnr

  - kind: checkpoint
    name: checkpoint_mdg
    context_name: join_mdg

  - kind: read_dataio
    name: read_sap_dfkkbptaxnum
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: business_partner
      object_name: dfkkbptaxnum
      schema_version: v1

  - kind: filter
    name: filter_sap_dfkkbptaxnum
    context_name: read_sap_dfkkbptaxnum
    params:
      - condition:
          partner not like '000%' and (taxtype like '%0'
          or taxtype like '%1'
          or taxtype like '%2'
          or taxtype like '%3'
          or taxtype like '%4'
          or taxtype like '%5')
          and if(sap_cluster = 'CL1', partner like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'),
          partner like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '14%', '22%','47%'))

  - kind: add
    name: add_sap_dfkkbptaxnum
    context_name: filter_sap_dfkkbptaxnum
    params:
      - column: taxnum0
        expression: if(taxtype like '%0', taxnum, '')
      - column: taxnum1
        expression: if(taxtype like '%1', taxnum, '')
      - column: taxnum2
        expression: if(taxtype like '%2', taxnum, '')
      - column: taxnum3
        expression: if(taxtype like '%3', taxnum, '')
      - column: taxnum4
        expression: if(taxtype like '%4', taxnum, '')
      - column: taxnum5
        expression: if(taxtype like '%5', taxnum, '')
      - column: taxtype0
        expression: if(taxtype like '%0', taxtype, '')
      - column: taxtype1
        expression: if(taxtype like '%1', taxtype, '')
      - column: taxtype2
        expression: if(taxtype like '%2', taxtype, '')
      - column: taxtype3
        expression: if(taxtype like '%3', taxtype, '')
      - column: taxtype4
        expression: if(taxtype like '%4', taxtype, '')
      - column: taxtype5
        expression: if(taxtype like '%5', taxtype, '')

  - kind: group
    name: group_sap_dfkkbptaxnum
    context_name: add_sap_dfkkbptaxnum
    params:
      - aggs:
          taxnum0: max
          taxnum1: max
          taxnum2: max
          taxnum3: max
          taxnum4: max
          taxnum5: max
          taxtype0: max
          taxtype1: max
          taxtype2: max
          taxtype3: max
          taxtype4: max
          taxtype5: max
        by:
        - partner


  - kind: rename
    name: rename_sap_dfkkbptaxnum
    context_name: group_sap_dfkkbptaxnum
    params:
      - column: partner
        to: partner_sap
      - column: max_taxnum0
        to: taxnum0_sap
      - column: max_taxnum1
        to: taxnum1_sap
      - column: max_taxnum2
        to: taxnum2_sap
      - column: max_taxnum3
        to: taxnum3_sap
      - column: max_taxnum4
        to: taxnum4_sap
      - column: max_taxnum5
        to: taxnum5_sap
      - column: max_taxtype0
        to: taxtype0_sap
      - column: max_taxtype1
        to: taxtype1_sap
      - column: max_taxtype2
        to: taxtype2_sap
      - column: max_taxtype3
        to: taxtype3_sap
      - column: max_taxtype4
        to: taxtype4_sap
      - column: max_taxtype5
        to: taxtype5_sap

  - kind: add
    name: add_sap
    context_name: rename_sap_dfkkbptaxnum
    params:
      - column: hash_sap
        expression: md5(concat_ws('',
                    partner_sap, 
                    taxnum0_sap, 
                    taxnum1_sap, 
                    taxnum2_sap, 
                    taxnum3_sap,
                    taxnum4_sap,
                    taxnum5_sap))

  - kind: read_dataio
    name: read_knvv_sap
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: knvv
      schema_version: v1

  - kind: filter
    name: filter_knvv_sap
    context_name: read_knvv_sap
    params:
      - condition:
          vtweg = '01' and spart = '01' and vkorg in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600,4700) and if(sap_cluster = 'CL1', kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'), kunnr like any('96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '14%', '22%','47%'))

  - kind: select
    name: select_knvv_sap
    context_name: filter_knvv_sap
    params:
      columns:
        kunnr: kunnr_sap
        vkorg: vkorg_sap
        kvgr4: kvgr4_sap
        vtweg: vtweg_sap
        spart: spart_sap
      distinct: true

  - kind: join
    name: join_sap
    context_name: add_sap
    params:
      - other:
          select_knvv_sap
        how:
          inner
        columns:
          partner_sap: kunnr_sap

  - kind: checkpoint
    name: checkpoint_sap
    context_name: join_sap

  - kind: join
    name: join_non_matching_mdg
    context_name: checkpoint_mdg
    params:
      - other:
          checkpoint_sap
        how:
          full
        columns:
          hash_mdg: hash_sap

  - kind: filter
    name: filter_non_matching_mdg
    context_name: join_non_matching_mdg
    params:
      - condition:
          isnull(hash_sap) or hash_sap = ''

  - kind: join
    name: join_non_matching_sap
    context_name: checkpoint_sap
    params:
      - other:
          checkpoint_mdg
        how:
          full
        columns:
          hash_sap: hash_mdg

  - kind: filter
    name: filter_non_matching_sap
    context_name: join_non_matching_sap
    params:
      - condition:
          isnull(hash_mdg) or hash_mdg = ''

  - kind: select
    name: select_non_matching_mdg
    context_name: filter_non_matching_mdg
    params:
      columns:
        partner_mdg: partner_mdg
        taxnum0_mdg: taxnum0_mdg
        taxnum1_mdg: taxnum1_mdg
        taxnum2_mdg: taxnum2_mdg
        taxnum3_mdg: taxnum3_mdg
        taxnum4_mdg: taxnum4_mdg
        taxnum5_mdg: taxnum5_mdg
        taxtype0_mdg: taxtype0_mdg
        taxtype1_mdg: taxtype1_mdg
        taxtype2_mdg: taxtype2_mdg
        taxtype3_mdg: taxtype3_mdg
        taxtype4_mdg: taxtype4_mdg
        taxtype5_mdg: taxtype5_mdg
        hash_mdg: hash_mdg
      distinct: true

  - kind: select
    name: select_non_matching_sap
    context_name: filter_non_matching_sap
    params:
      columns:
        partner_sap: partner_sap
        taxnum0_sap: taxnum0_sap
        taxnum1_sap: taxnum1_sap
        taxnum2_sap: taxnum2_sap
        taxnum3_sap: taxnum3_sap
        taxnum4_sap: taxnum4_sap
        taxnum5_sap: taxnum5_sap
        taxtype0_sap: taxtype0_sap
        taxtype1_sap: taxtype1_sap
        taxtype2_sap: taxtype2_sap
        taxtype3_sap: taxtype3_sap
        taxtype4_sap: taxtype4_sap
        taxtype5_sap: taxtype5_sap
        hash_sap: hash_sap
      distinct: true

  - kind: checkpoint
    name: checkpoint_non_matching_mdg
    context_name: select_non_matching_mdg

  - kind: checkpoint
    name: checkpoint_non_matching_sap
    context_name: select_non_matching_sap

  - kind: read_dataio
    name: read_mdg_kna1
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_mdg
      namespace: customer
      object_name: kna1
      schema_version: v1

  - kind: select
    name: select_kna1
    context_name: read_mdg_kna1
    params:
      columns:
        kunnr: kunnr
        ktokd: ktokd
        aufsd: aufsd

  - kind: read_dataio
    name: read_t077x
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: t077x
      schema_version: v1

  - kind: filter
    name: filter_t077x
    params:
      - condition:
          spras = 'E' and sap_cluster = 'CL1'

  - kind: select
    name: select_t077x
    params:
      columns:
        ktokd: ktokd
        txt30: txt30
        sap_cluster: sap_cluster
      distinct: true

  - kind: read_dataio
    name: read_tvv4t
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: reference_data
      object_name: tvv4t
      schema_version: v1

  - kind: filter
    name: filter_tvv4t
    params:
      - condition:
         sap_cluster = 'CL1' and spras = 'E'

  - kind: select
    name: select_tvv4t
    params:
      columns:
        kvgr4: kvgr4
        bezei: bezei
      distinct: true

  - kind: join
    name: join_non_matching
    context_name: checkpoint_non_matching_mdg
    params:
      - other:
          checkpoint_non_matching_sap
        how:
          full
        columns:
          partner_mdg: partner_sap

  - kind: join
    name: join_missing_from_mdg_to_filter
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_sap: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_mdg
    context_name: join_missing_from_mdg_to_filter
    params:
      - condition:
         aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

  - kind: join
    name: join_missing_from_sap_to_filter
    context_name: join_non_matching
    params:
      - other:
          select_kna1
        how:
          left
        columns:
          partner_mdg: kunnr
      - other:
          select_t077x
        how:
          left
        columns:
          ktokd: ktokd
      - other:
          select_knvv
        how:
          left
        columns:
          kunnr: kunnr
      - other:
          select_tvv4t
        how:
          left
        columns:
          kvgr4: kvgr4

  - kind: filter
    name: join_missing_from_sap
    context_name: join_missing_from_sap_to_filter
    params:
      - condition:
         aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

## data missing from mdg

  - kind: filter
    name: filter_missing_from_mdg
    context_name: join_missing_from_mdg
    params:
      - condition:
          isnull(partner_mdg)

  - kind: add
    name: add_missing_from_mdg
    context_name: filter_missing_from_mdg
    params:
      - column: msg
        expression: if(isnull(partner_mdg), 'data missing from mdg', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_sap, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''TAX DATA'''
      - column: src_system
        expression: '''sap'''
      - column: tgt_system
        expression: '''mdg'''
      - column: loading_date
        expression: current_date()

## data missing from sap

  - kind: filter
    name: filter_missing_from_sap
    context_name: join_missing_from_sap
    params:
      - condition:
          isnull(partner_sap)

  - kind: add
    name: add_missing_from_sap
    context_name: filter_missing_from_sap
    params:
      - column: msg
        expression: if(isnull(partner_sap), 'data missing from sap', '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
        expression: CASE substr(partner_mdg, 0, 2)
                      WHEN '96' THEN 'AM'
                      WHEN '12' THEN 'AT'
                      WHEN '28' THEN 'BA'
                      WHEN '13' THEN 'BG'
                      WHEN '23' THEN 'BY'
                      WHEN '27' THEN 'CH'
                      WHEN '18' THEN 'CZ'
                      WHEN '32' THEN 'EE'
                      WHEN '35' THEN 'GB'
                      WHEN '30' THEN 'GR'
                      WHEN '25' THEN 'HR'
                      WHEN '16' THEN 'HU'
                      WHEN '34' THEN 'IE'
                      WHEN '29' THEN 'IT'
                      WHEN '42' THEN 'KV'
                      WHEN '33' THEN 'LT'
                      WHEN '31' THEN 'LV'
                      WHEN '17' THEN 'MD'
                      WHEN '15' THEN 'ME'
                      WHEN '95' THEN 'MK'
                      WHEN '94' THEN 'NG'
                      WHEN '24' THEN 'PL'
                      WHEN '26' THEN 'RO'
                      WHEN '38' THEN 'RU'
                      WHEN '21' THEN 'SI'
                      WHEN '19' THEN 'SK'
                      WHEN '14' THEN 'RS'
                      WHEN '22' THEN 'UA'
                      WHEN '40' THEN 'CY'
                      WHEN '47' THEN 'EG'
                      ELSE NULL
                    END
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''TAX DATA'''
      - column: src_system
        expression: '''mdg'''
      - column: tgt_system
        expression: '''sap'''
      - column: loading_date
        expression: current_date()

# attributes are mismatching

  - kind: filter
    name: filter_mismatched
    context_name: join_missing_from_sap
    params:
      - condition:
          partner_sap = partner_mdg
          and (taxnum0_sap <> taxnum0_mdg
          or taxnum1_sap <> taxnum1_mdg
          or taxnum2_sap <> taxnum2_mdg
          or taxnum3_sap <> taxnum3_mdg
          or taxnum4_sap <> taxnum4_mdg
          or taxnum5_sap <> taxnum5_mdg)

  - kind: add
    name: add_mismatched
    context_name: filter_mismatched
    params:
      - column: msg_taxnum0
        expression: if(partner_sap = partner_mdg 
                    and taxnum0_sap <> taxnum0_mdg, 'attributes are mismatching', '-')
      - column: msg_taxnum1
        expression: if(partner_sap = partner_mdg 
                    and taxnum1_sap <> taxnum1_mdg, 'attributes are mismatching', '-')
      - column: msg_taxnum2
        expression: if(partner_sap = partner_mdg 
                    and taxnum2_sap <> taxnum2_mdg, 'attributes are mismatching', '-')
      - column: msg_taxnum3
        expression: if(partner_sap = partner_mdg 
                    and taxnum3_sap <> taxnum3_mdg, 'attributes are mismatching', '-')
      - column: msg_taxnum4
        expression: if(partner_sap = partner_mdg 
                    and taxnum4_sap <> taxnum4_mdg, 'attributes are mismatching', '-')
      - column: msg_taxnum5
        expression: if(partner_sap = partner_mdg
                    and taxnum5_sap <> taxnum5_mdg, 'attributes are mismatching', '-')
      - column: attr_name_taxnum0
        expression: if(partner_sap = partner_mdg 
                    and taxnum0_sap <> taxnum0_mdg, concat('TAX DATA:', ' ', ' VAT Reg.No.'), '-')
      - column: attr_name_taxnum1
        expression: if(partner_sap = partner_mdg 
                    and taxnum1_sap <> taxnum1_mdg, concat('TAX DATA:', ' ', ' Tax Number 1'), '-')
      - column: attr_name_taxnum2
        expression: if(partner_sap = partner_mdg 
                    and taxnum2_sap <> taxnum2_mdg, concat('TAX DATA:', ' ', ' Tax Number 2'), '-')
      - column: attr_name_taxnum3
        expression: if(partner_sap = partner_mdg 
                    and taxnum3_sap <> taxnum3_mdg, concat('TAX DATA:', ' ', ' Tax Number 3'), '-')
      - column: attr_name_taxnum4
        expression: if(partner_sap = partner_mdg 
                    and taxnum4_sap <> taxnum4_mdg, concat('TAX DATA:', ' ', ' Tax Number 4'), '-')
      - column: attr_name_taxnum5
        expression: if(partner_sap = partner_mdg 
                    and taxnum5_sap <> taxnum5_mdg, concat('TAX DATA:', ' ', ' Tax Number 5'), '-')
      - column: attribute10
        expression: concat(ktokd, ' - ', txt30)
      - column: attribute5
        expression: concat(kvgr4, ' - ', bezei)
      - column: country
