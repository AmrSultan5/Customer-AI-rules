      distinct: true

  - kind: select
    name: select_d365_telephone2
    context_name: filter_d365_telephone2
    params:
      columns:
        cch_telephone2: telephone
        d_partner: d_partner
        guid: guid
        cch_telephone2_number_default: default_telephone
