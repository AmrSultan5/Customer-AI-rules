transform:
  name: cross_system_contact_relationship_mdg_d365
  operations:

########################################################################################
##d365
  - kind: read_dataio
    name: read_d365_account
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: account
      schema_version: v1

  - kind: read_dataio
    name: read_d365_role
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_contactrole
      schema_version: v1


  - kind: filter
    name: filter_d365_role
    context_name: read_d365_role
    params:
      - condition: statecode = 0


  - kind: read_dataio
    name: read_d365_ag
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_accountgroup
      schema_version: v1


  - kind: filter
    name: filter_d365_ag
    context_name: read_d365_ag
    params:
      - condition: statecode = 0

  - kind: select
    name: select_d365_ag
    context_name: filter_d365_ag
    params:
      columns:
        id: ag_id
        cch_name: ag_cch_name
        cch_code: ag_cch_code
      distinct: true

  - kind: read_dataio
    name: read_d365_contact
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: contact
      schema_version: v1

  - kind: select
    name: select_d365_account
    context_name: read_d365_account
    params:
      columns:
        cch_orderblockall: cch_orderblockall
        cch_salesorganizationid: cch_salesorganizationid
        id: account_id
        cch_sapid: d_partner
        cch_accountgroupidname: d_account_group
        cch_accountgroupid: cch_accountgroupid
        cch_distributionchannel: cch_distributionchannel
        cch_division: cch_division
        statecode: statecode_acc
        statuscode: statuscode_acc
      distinct: true

  - kind: select
    name: select_d365_role
    context_name: filter_d365_role
    params:
      columns:
        cch_contactrole: cch_contactrole
        cch_accountid: cch_accountid
        cch_contactid: cch_contactid
        cch_telephone: cch_telephone
        cch_telephone2: cch_telephone2
        cch_telephone3: cch_telephone3
        cch_telephone4: cch_telephone4
        cch_telephone5: cch_telephone5
        cch_emailaddress: cch_emailaddress
        cch_emailaddress2: cch_emailaddress2
        cch_emailaddress3: cch_emailaddress3
        cch_emailaddress4: cch_emailaddress4
        cch_emailaddress5: cch_emailaddress5
        cch_mobilephone: cch_mobilephone
        cch_mobilephone2: cch_mobilephone2
        cch_mobilephone3: cch_mobilephone3
        cch_mobilephone4: cch_mobilephone4
        cch_mobilephone5: cch_mobilephone5
        cch_mobilephone_number_default: cch_mobilephone_number_default
        cch_mobilephone2_number_default: cch_mobilephone2_number_default
        cch_mobilephone3_number_default: cch_mobilephone3_number_default
        cch_mobilephone4_number_default: cch_mobilephone4_number_default
        cch_mobile5_number_default: cch_mobilephone5_number_default
        cch_telephone_number_default: cch_telephone_number_default
        cch_telephone2_number_default: cch_telephone2_number_default
        cch_telephone3_number_default: cch_telephone3_number_default
        cch_telephone4_number_default: cch_telephone4_number_default
        cch_telephone5_number_default: cch_telephone5_number_default
      distinct: true

  - kind: select
    name: select_d365_contact_prefilter
    context_name: read_d365_contact
    params:
      columns:
        firstname: firstname
        lastname: lastname
        id: contact_id
        cch_sapcrmcontactpersonbpid: cch_sapcrmcontactpersonbpid
        cch_sapid: cch_sapid_contact
        cch_sapcrmguid: guid
        statecode: statecode
        statuscode: statuscode
      distinct: true


  - kind: filter
    name: select_d365_contact
    context_name: select_d365_contact_prefilter
    params:
      - condition: 1 = 1
##statecode = 0 
##and statuscode=1

##########################

  - kind: read_dataio
    name: read_cch_optionsetmapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: cch_optionsetmapping
      schema_version: v1

  - kind: filter
    name: filter_cch_optionsetmapping_pfm
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'cch_contactrole' and cch_attributename = 'cch_contactrole'

  - kind: select
    name: partner_function_map
    context_name: filter_cch_optionsetmapping_pfm
    params:
      columns:
        cch_optionsetvalue: pfm_cch_optionsetvalue
        cch_externalvalue: pfm_cch_externalvalue
      distinct: true
    
    
#####################################################
  
  - kind: filter
    name: filter_cch_optionsetmapping_cd
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_division' 
  
  - kind: select
    name: union_cte_division
    context_name: filter_cch_optionsetmapping_cd
    params:
      columns:
        cch_optionsetvalue: cd_cch_optionsetvalue
        cch_externalvalue: cd_cch_externalvalue
      distinct: true
  
#####################################################
##E distributionchannel
  - kind: filter
    name: filter_cch_optionsetmapping_dc
    context_name: read_cch_optionsetmapping
    params:
      - condition: cch_entityname = 'account' and cch_attributename = 'cch_distributionchannel'
  
  - kind: select
    name: union_cte_distributionchannel
    context_name: filter_cch_optionsetmapping_dc
    params:
      columns:
        cch_optionsetvalue: dc_cch_optionsetvalue
        cch_externalvalue: dc_cch_externalvalue
      distinct: true

  - kind: read_dataio
    name: read_d365_territory
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: dataverse
      namespace: d365
      object_name: territory
      schema_version: v1

  - kind: filter
    name: filter_territory
    context_name: read_d365_territory
    params:
      - condition: 1 = 1

  - kind: select
    name: select_d365_territory
    context_name: filter_territory
    params:
      columns:
        cch_sapid: territory_cch_sapid
        id: territory_id
      distinct: true        
#######################################################



  - kind: filter
    name: filter_d365_accounts_filtered
    context_name: select_d365_account
    params:
      - condition:
          d_partner like any ('96%','12%','28%','13%','27%','40%','18%','32%','35%','30%','25%','16%','34%','29%','42%','33%','31%','17%','15%','95%','94%','24%','26%','14%','21%','19%','22%') and (isnull(cch_orderblockall) or length(cch_orderblockall) = 0 or cch_orderblockall not in(311220003, 311220005, 311220008, 311220011, 311220012,311220013, 311220014, 311220015, 311220016, 311220018)) 
##and statecode_acc = 0 
##and statuscode_acc = 1

  - kind: join
    name: join_d365_roles_contacts
    context_name: filter_d365_accounts_filtered
    params:
      - other:
          select_d365_role
        how:
          inner
        columns:
          account_id: cch_accountid
      - other:
          select_d365_contact
        how:
          inner
        columns:
          cch_contactid: contact_id
      - other:
          select_d365_ag
        how:
          left
        columns:
          cch_accountgroupid: ag_id
      - other:
          partner_function_map
        how:
          left
        columns:
          cch_contactrole: pfm_cch_optionsetvalue
      - other:
          select_d365_territory
        how:
          left
        columns:
          cch_salesorganizationid: territory_id
      - other:
          union_cte_distributionchannel
        how:
          left
        columns:
          cch_distributionchannel: dc_cch_optionsetvalue
      - other:
          union_cte_division
        how:
          left
        columns:
          cch_division: cd_cch_optionsetvalue


  - kind: add
    name: add_d365_roles_contacts
    context_name: join_d365_roles_contacts
    params:
      - column: d_account_group_code
        expression: concat(ag_cch_code, ' - ', regexp_replace(ag_cch_name, '\\s+', ' '))
      - column: initials
        expression: if(substr(d_partner, 1, 1) = 'P',3 ,
                    if(substr(d_partner, 1, 3) = '000', 5, 2))
      - column: d_country
        expression: CASE 
                      WHEN initials = 2 THEN 
                        CASE SUBSTRING(d_partner, 1, 2)
                          WHEN '96' THEN 'AM'
                          WHEN '12' THEN 'AT'
                          WHEN '28' THEN 'BA'
                          WHEN '13' THEN 'BG'
                          WHEN '23' THEN 'BY'
                          WHEN '27' THEN 'CH'
                          WHEN '18' THEN 'CZ'
                          WHEN '32' THEN 'EE'
                          WHEN '35' THEN 'GB'
                          WHEN '30' THEN 'GR'
                          WHEN '25' THEN 'HR'
                          WHEN '16' THEN 'HU'
                          WHEN '34' THEN 'IE'
                          WHEN '29' THEN 'IT'
                          WHEN '42' THEN 'KV'
                          WHEN '33' THEN 'LT'
                          WHEN '31' THEN 'LV'
                          WHEN '17' THEN 'MD'
                          WHEN '15' THEN 'ME'
                          WHEN '95' THEN 'MK'
                          WHEN '94' THEN 'NG'
                          WHEN '24' THEN 'PL'
                          WHEN '26' THEN 'RO'
                          WHEN '38' THEN 'RU'
                          WHEN '21' THEN 'SI'
                          WHEN '19' THEN 'SK'
                          WHEN '14' THEN 'RS'
                          WHEN '22' THEN 'UA'
                          WHEN '40' THEN 'CY'
                          WHEN '47' THEN 'EG'
                          ELSE NULL
                        END
                      WHEN initials = 3 THEN 
                        CASE SUBSTRING(d_partner, 1, 3)
                          WHEN 'P96' THEN 'AM'
                          WHEN 'P11' THEN 'AT'
                          WHEN 'P86' THEN 'BA'
                          WHEN 'P49' THEN 'BG'
                          WHEN 'P23' THEN 'BY'
                          WHEN 'P55' THEN 'CH'
                          WHEN 'P51' THEN 'CY'
                          WHEN 'P45' THEN 'CZ'
                          WHEN 'P32' THEN 'EE'
                          WHEN 'P79' THEN 'GB'
                          WHEN 'P12' THEN 'GR'
                          WHEN 'P80' THEN 'HR'
                          WHEN 'P28' THEN 'HU'
                          WHEN 'P78' THEN 'IE'
                          WHEN 'P63' THEN 'IT'
                          WHEN 'P92' THEN 'KV'
                          WHEN 'P33' THEN 'LT'
                          WHEN 'P31' THEN 'LV'
                          WHEN 'P20' THEN 'MD'
                          WHEN 'P82' THEN 'ME'
                          WHEN 'P95' THEN 'MK'
                          WHEN 'P94' THEN 'NG'
                          WHEN 'P61' THEN 'PL'
                          WHEN 'P91' THEN 'RO'
                          WHEN 'P25' THEN 'RS'
                          WHEN 'P85' THEN 'SI'
                          WHEN 'P41' THEN 'SK'
                          WHEN 'P72' THEN 'UA'
                          WHEN 'P47' THEN 'EG'
                          WHEN 'E96' THEN 'AM'
                          WHEN 'E12' THEN 'AT'
                          WHEN 'E28' THEN 'BA'
                          WHEN 'E13' THEN 'BG'
                          WHEN 'E23' THEN 'BY'
                          WHEN 'E27' THEN 'CH'
                          WHEN 'E40' THEN 'CY'
                          WHEN 'E18' THEN 'CZ'
                          WHEN 'E32' THEN 'EE'
                          WHEN 'E47' THEN 'EG'
                          WHEN 'E35' THEN 'GB'
                          WHEN 'E30' THEN 'GR'
                          WHEN 'E25' THEN 'HR'
                          WHEN 'E16' THEN 'HU'
                          WHEN 'E34' THEN 'IE'
                          WHEN 'E29' THEN 'IT'
                          WHEN 'E42' THEN 'KV'
                          WHEN 'E33' THEN 'LT'
                          WHEN 'E31' THEN 'LV'
                          WHEN 'E17' THEN 'MD'
                          WHEN 'E15' THEN 'ME'
                          WHEN 'E95' THEN 'MK'
                          WHEN 'E94' THEN 'NG'
                          WHEN 'E24' THEN 'PL'
                          WHEN 'E26' THEN 'RO'
                          WHEN 'E14' THEN 'RS'
                          WHEN 'E21' THEN 'SI'
                          WHEN 'E19' THEN 'SK'
                          WHEN 'E22' THEN 'UA'
                          ELSE NULL
                        END
                        WHEN initials = 5 THEN 
                          CASE SUBSTRING(d_partner, 1, 5)
                            WHEN '00096' THEN 'AM'
                            WHEN '00012' THEN 'AT'
                            WHEN '00028' THEN 'BA'
                            WHEN '00013' THEN 'BG'
                            WHEN '00023' THEN 'BY'
                            WHEN '00027' THEN 'CH'
                            WHEN '00018' THEN 'CZ'
                            WHEN '00032' THEN 'EE'
                            WHEN '00035' THEN 'GB'
                            WHEN '00030' THEN 'GR'
                            WHEN '00025' THEN 'HR'
                            WHEN '00016' THEN 'HU'
                            WHEN '00034' THEN 'IE'
                            WHEN '00029' THEN 'IT'
                            WHEN '00042' THEN 'KV'
                            WHEN '00033' THEN 'LT'
                            WHEN '00031' THEN 'LV'
                            WHEN '00017' THEN 'MD'
                            WHEN '00015' THEN 'ME'
                            WHEN '00095' THEN 'MK'
                            WHEN '00094' THEN 'NG'
                            WHEN '00024' THEN 'PL'
                            WHEN '00026' THEN 'RO'
                            WHEN '00038' THEN 'RU'
                            WHEN '00021' THEN 'SI'
                            WHEN '00019' THEN 'SK'
                            WHEN '00014' THEN 'RS'
                            WHEN '00022' THEN 'UA'
                            WHEN '00040' THEN 'CY'
                            WHEN '00047' THEN 'EG'
                            ELSE NULL
                          END
                    END
      - column: name_last 
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(lastname, '\u00A0', ''), '\\t', ''), '\\n', ''), '\\r', '')))
      - column: name_first
        expression: trim(lower(regexp_replace(regexp_replace(regexp_replace(regexp_replace(firstname, '\u00A0', ''), '\\t', ''), '\\n', ''), '\\r', '')))
      - column: d365_pk
        expression: concat(d_partner,lower(replace(guid, '-', '')))
      - column: partner_function
        expression: CAST(cch_contactrole AS string)
      - column: partner_function_description
        expression: pfm_cch_externalvalue

  - kind: filter
    name: filter_d365_attr
    context_name: add_d365_roles_contacts
    params:
      - condition: dc_cch_externalvalue = '01' and cd_cch_externalvalue = '01' and d_account_group_code not like '%NOT AVAILABLE%' and territory_cch_sapid in (1100,1200,2000,2500,2800,3100,3200,3300,4090,4500,4890,5100,5500,6100,6300,7200,7800,7900,8090,8200,8500,8600,9100,9200,9400,9500,9600)

  - kind: select
    name: select_d365_attr
    context_name: filter_d365_attr
    params:
      columns:
        cch_orderblockall: cch_orderblockall
        d_partner: d_partner
        d_account_group_code: d_account_group_code
        partner_function: partner_function
        partner_function_description: partner_function_description
        name_first: name_first
        name_last: name_last
        contact_id: contact_id
        cch_sapcrmcontactpersonbpid: cch_sapcrmcontactpersonbpid
        cch_sapid_contact: cch_sapid_contact
        d_country: d_country
        guid: guid
        d365_pk: d365_pk
      distinct: true

## mobile

  - kind: filter
    name: filter_d365_mobilephone
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_mobilephone)

  - kind: filter
    name: filter_d365_mobilephone2
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_mobilephone2)

  - kind: filter
    name: filter_d365_mobilephone3
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_mobilephone3)

  - kind: filter
    name: filter_d365_mobilephone4
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_mobilephone4)

  - kind: filter
    name: filter_d365_mobilephone5
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_mobilephone5)
          
  - kind: select
    name: select_d365_mobilephone
    context_name: filter_d365_mobilephone
    params:
      columns:
        cch_mobilephone: mobilephone
        d_partner: d_partner
        guid: guid
        cch_mobilephone_number_default: default_mobile
      distinct: true

  - kind: select
    name: select_d365_mobilephone2
    context_name: filter_d365_mobilephone2
    params:
      columns:
        cch_mobilephone2: mobilephone
        d_partner: d_partner
        guid: guid
        cch_mobilephone2_number_default: default_mobile
      distinct: true

  - kind: select
    name: select_d365_mobilephone3
    context_name: filter_d365_mobilephone3
    params:
      columns:
        cch_mobilephone3: mobilephone
        d_partner: d_partner
        guid: guid
        cch_mobilephone3_number_default: default_mobile
      distinct: true

  - kind: select
    name: select_d365_mobilephone4
    context_name: filter_d365_mobilephone4
    params:
      columns:
        cch_mobilephone4: mobilephone
        d_partner: d_partner
        guid: guid
        cch_mobilephone4_number_default: default_mobile
      distinct: true
      
  - kind: select
    name: select_d365_mobilephone5
    context_name: filter_d365_mobilephone5
    params:
      columns:
        cch_mobilephone5: mobilephone
        d_partner: d_partner
        guid: guid
        cch_mobilephone5_number_default: default_mobile
      distinct: true
      

  - kind: union
    name: union_d365_mobilephone
    context_name: select_d365_mobilephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_mobilephone2

  - kind: union
    name: union_d365_mobilephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_mobilephone3
      
  - kind: union
    name: union_d365_mobilephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_mobilephone4
      
  - kind: union
    name: union_d365_mobilephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_mobilephone5
      
  - kind: join
    name: join_d365_mobile
    context_name: select_d365_attr
    params:
      - other:
          union_d365_mobilephone
        how:
          left
        columns:
          d_partner: d_partner
          guid: guid

  - kind: add
    name: add_d365_mobile
    context_name: join_d365_mobile
    params:
      - column: d365_hash
        expression: md5(concat(d_partner,coalesce(trim(lower(name_first)),''),coalesce(trim(lower(name_last)),''),coalesce(trim(mobilephone),''),coalesce(trim(partner_function_description),''),lower(replace(guid, '-', '')),coalesce(trim(default_mobile),'')))
      - column: domain
        expression: '''CUSTOMER'''
      - column: table_name
        expression: '''CONTACT RELATIONSHIP'''
      - column: partner_guid
        expression: lower(replace(guid, '-', '')) 
      - column: src_system
        expression: '''d365'''
      - column: dimension
        expression: '''telephone'''
      - column: loading_date
        expression: current_date()
      - column: r3_user
        expression: '''3'''
      - column: attribute4
        expression: ''''''
      - column: attribute10
        expression: coalesce(trim(default_mobile),'')
        
#telephone

  - kind: filter
    name: filter_d365_telephone
    context_name: join_d365_roles_contacts
    params:
      - condition:
          isnotnull(cch_telephone)

  - kind: filter
