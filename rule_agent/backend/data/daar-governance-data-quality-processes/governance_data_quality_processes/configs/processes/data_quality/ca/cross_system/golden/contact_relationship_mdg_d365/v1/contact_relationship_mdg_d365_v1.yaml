  - kind: select
    name: select_d365_telephone3
    context_name: filter_d365_telephone3
    params:
      columns:
        cch_telephone3: telephone
        d_partner: d_partner
        guid: guid
        cch_telephone3_number_default: default_telephone
      distinct: true

  - kind: select
    name: select_d365_telephone4
    context_name: filter_d365_telephone4
    params:
      columns:
        cch_telephone4: telephone
        d_partner: d_partner
        guid: guid
        cch_telephone4_number_default: default_telephone
      distinct: true

  - kind: select
    name: select_d365_telephone5
    context_name: filter_d365_telephone5
    params:
      columns:
        cch_telephone5: telephone
        d_partner: d_partner
        guid: guid
        cch_telephone5_number_default: default_telephone
      distinct: true

  - kind: union
    name: union_d365_telephone
    context_name: select_d365_telephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_telephone2

  - kind: union
    name: union_d365_telephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_telephone3

  - kind: union
    name: union_d365_telephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_telephone4

  - kind: union
    name: union_d365_telephone
    params:
      allow_missing: false
      by_name: true
      other: select_d365_telephone5

  - kind: join
    name: join_d365_telephone
    context_name: select_d365_attr
    params:
      - other:
          union_d365_telephone
        how:
          left
        columns:
          d_partner: d_partner
          guid: guid

  - kind: add
    name: add_d365_telephone
    context_name: join_d365_telephone
