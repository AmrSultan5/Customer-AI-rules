  - kind: add
    name: add_mdg_but051
    context_name: select_mdg_but051
    params:
      - column: initials_mdg_but051
        expression: if(substr(partner1_mdg_but051, 1, 1) = 'P',3 ,
                    if(substr(partner1_mdg_but051, 1, 3) = '000', 5, 2))
      - column: mdg_country_mdg_but051
        expression: CASE 
                      WHEN initials_mdg_but051 = 2 THEN 
                        CASE SUBSTRING(partner1_mdg_but051, 1, 2)
                          WHEN '96' THEN 'AM'
                          WHEN '12' THEN 'AT'
                          WHEN '28' THEN 'BA'
                          WHEN '13' THEN 'BG'
                          WHEN '23' THEN 'BY'
                          WHEN '27' THEN 'CH'
                          WHEN '18' THEN 'CZ'
                          WHEN '32' THEN 'EE'
                          WHEN '35' THEN 'GB'
                          WHEN '30' THEN 'GR'
                          WHEN '25' THEN 'HR'
                          WHEN '16' THEN 'HU'
                          WHEN '34' THEN 'IE'
                          WHEN '29' THEN 'IT'
                          WHEN '42' THEN 'KV'
                          WHEN '33' THEN 'LT'
                          WHEN '31' THEN 'LV'
                          WHEN '17' THEN 'MD'
                          WHEN '15' THEN 'ME'
                          WHEN '95' THEN 'MK'
                          WHEN '94' THEN 'NG'
                          WHEN '24' THEN 'PL'
                          WHEN '26' THEN 'RO'
                          WHEN '38' THEN 'RU'
                          WHEN '21' THEN 'SI'
                          WHEN '19' THEN 'SK'
                          WHEN '14' THEN 'RS'
                          WHEN '22' THEN 'UA'
                          WHEN '40' THEN 'CY'
                          WHEN '47' THEN 'EG'
                          ELSE NULL
                        END
                      WHEN initials_mdg_but051 = 3 THEN 
                        CASE SUBSTRING(partner1_mdg_but051, 1, 3)
                          WHEN 'P96' THEN 'AM'
                          WHEN 'P11' THEN 'AT'
                          WHEN 'P86' THEN 'BA'
                          WHEN 'P49' THEN 'BG'
                          WHEN 'P23' THEN 'BY'
                          WHEN 'P55' THEN 'CH'
                          WHEN 'P51' THEN 'CY'
                          WHEN 'P45' THEN 'CZ'
                          WHEN 'P32' THEN 'EE'
                          WHEN 'P79' THEN 'GB'
                          WHEN 'P12' THEN 'GR'
                          WHEN 'P80' THEN 'HR'
