                      WHEN '0002' THEN 'Purchasing Manager'
                      WHEN '0005' THEN 'Quality Officer'
                      WHEN '0003' THEN 'Sales Manager'
                      ELSE NULL
                    END
      - column: loading_date
        expression: current_date()
      - column: src_attr_value
        expression: CASE attr_name
                      WHEN 'Telephone' THEN concat('Tel Nr ', mdg_telephone)
                      WHEN 'Mobile Number' THEN concat('Tel Nr ', mdg_mobile)
                      WHEN 'E-mail' THEN concat('Email ', mdg_email)
                      WHEN 'First Name' THEN mdg_name_first
                      WHEN 'Last Name' THEN mdg_name_last
                      WHEN 'Function' THEN mdg_relationship
                      ELSE ''
                      END
      - column: tgt_attr_value
        expression: CASE attr_name
                      WHEN 'Telephone' THEN concat('Tel Nr ', d_telephone)
                      WHEN 'Mobile Number' THEN concat('Tel Nr ', d_mobile)
                      WHEN 'E-mail' THEN concat('Email ', d_email)
                      WHEN 'First Name' THEN d_name_first
                      WHEN 'Last Name' THEN d_name_last
                      WHEN 'Function' THEN d_partner_function_description
                      ELSE ''
                    END
      - column: domain
        expression: '''CUSTOMER'''


