    params:
      columns:
        # length: length
        bank_type_format: bank_type_format
      distinct: true

#ADD rule code 182_3
  - kind: add
    name: add_cbtf
    context_name: select_cbtf
    params:
      - column: rule_code
        expression: "'RCCONF_182.3'"

#READ conf_dunning_procedure_block
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_dunning_procedure_block
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_dunning_procedure_block
  - kind: join
    name: join_dcb_dcg
    context_name: add_dcb
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          add_cbtf
        how:
          left
        columns:
          rule_code: rule_code
  - kind: join
    name: left_join_dcg_dcc
    context_name: select_dcg
    params:
      - other:
          select_dcc
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#JOIN dcg and dcc
  - kind: join
    name: join_dcg_dcc
    context_name: select_dcg
    params:
      - other:
          select_dcc
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#JOIN dcg and dcso
  - kind: join
    name: join_dcg_dcso
    context_name: select_dcso
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
  - kind: select
    name: select_dcg_dcc
    context_name: left_join_dcg_dcc
    params:
      columns:
        customer_code: customer_code
        account_group_code: account_group_code
        reconciliation_account: reconciliation_account
      distinct: true

#JOIN dcg and cra
  - kind: join
    name: join_dcg_dcc_cra
    context_name: select_dcg_dcc
    params:
      - other:
          select_cra
        how:
          left
        columns:
          reconciliation_account: conf_reconciliation_account
          account_group_code: conf_account_group_code

#JOIN dcg_dcc and cpgm
  - kind: join
    name: join_dcg_dcc_cpgm
    context_name: join_dcg_dcc
    params:
      - other:
          select_cpgm
        how:
          inner
        columns:
          planning_group_code: conf_planning_group_code

#JOIN dcg_dcc_cpgm and dch
  - kind: join
    name: join_dcg_dcc_cpgm_dch
    context_name: join_dcg_dcc_cpgm
    params:
      - other:
          select_dch
        how:
          inner
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster

#JOIN dcg and dcso and dcb
  - kind: join
    name: join_dcb_dcg_dcso
    context_name: select_dcb
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dcso
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dcg_dca_csc
    context_name: select_dcg
    params:
      - other:
          add_address_rule
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#JOIN dcg dcc cdpb dch dcp dcso
  - kind: join
    name: join_dcg_dcc_cdpb_dch_dcp_dcso
    context_name: select_dcg
    params:
      - other:
          select_dcc
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          read_conf_dunning_procedure_block
        how:
          inner
        columns:
          company_code: company_code
          account_group_code: account_group_code
      - other:
          select_dch
        how:
          inner
        columns:
          customer_code: l7_customer_code
          sap_cluster: sap_cluster
      - other:
          filter_dcp
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dcso
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

  - kind: join
    name: join_dcg_cts
    context_name: select_dcg
    params:
      - other:
          select_cts
        how:
          left
        columns:
          country_code: country_code_cts

#JOIN dcg and cts 52_3
  - kind: join
    name: join_dcg_cts_ctnf_cvnf
    context_name: select_dcg
    params:
      - other:
          select_cts
        how:
          left
        columns:
          country_code: country_code_cts
      - other:
          select_ctnf
        how:
          left
        columns:
          country_code: country_code_ctnf
      - other:
          select_cvnf
        how:
          left
        columns:
          country_code: country_code_cvnf
  - kind: select
    name: select_rcconf_52_2
    context_name: join_dcg_cts
    params:
      columns:
        customer_code: customer_code
        legal_form_code: legal_form_code
        tax_0_value: tax_0_value
        tax_1_value: tax_1_value
        tax_2_value: tax_2_value
        tax_3_value: tax_3_value
        tax_0_cts: tax_0_cts
        tax_1_cts: tax_1_cts
        tax_2_cts: tax_2_cts
        tax_3_cts: tax_3_cts
        country_code: country_code
        country_code_cts: country_code_cts
      distinct: true

  - kind: add
    name: add_rcconf_52_2
    context_name: select_rcconf_52_2
    params:
      - column: rule_code
        expression: "'RCCONF_52.2'"
      - column: tax_0_value
        expression: if(tax_0_value is null, '', tax_0_value)
        overwrite: true
      - column: tax_1_value
        expression: if(tax_1_value is null, '', tax_1_value)
        overwrite: true
      - column: tax_2_value
        expression: if(tax_2_value is null, '', tax_2_value)
        overwrite: true
      - column: tax_3_value
        expression: if(tax_3_value is null, '', tax_3_value)
        overwrite: true
      - column: t0
        expression: if((tax_0_cts = '0' and country_code = country_code_cts) or (tax_0_cts = '1' and country_code = country_code_cts and len(tax_0_value) = 0), '',
                    if(legal_form_code LIKE 'X%', '',
                    if(tax_0_cts = '1' and country_code = country_code_cts and len(tax_0_value) < 3 and len(tax_0_value) > 0, '0', '1')))
      - column: t1
        expression: if((tax_1_cts = '0' and country_code = country_code_cts) or (tax_1_cts = '1' and country_code = country_code_cts and len(tax_1_value) = 0), '',
                    if(legal_form_code LIKE 'X%', '',
                    if(tax_1_cts = '1' and country_code = country_code_cts and len(tax_1_value) < 3 and len(tax_1_value) > 0, '0', '1')))
      - column: t2
        expression: if((tax_2_cts = '0' and country_code = country_code_cts) or (tax_2_cts = '1' and country_code = country_code_cts and len(tax_2_value) = 0), '',
                    if(legal_form_code LIKE 'X%', '',
                    if(tax_2_cts = '1' and country_code = country_code_cts and len(tax_2_value) < 3 and len(tax_2_value) > 0, '0', '1')))
      - column: t3
        expression: if((tax_3_cts = '0' and country_code = country_code_cts) or (tax_3_cts = '1' and country_code = country_code_cts and len(tax_2_value) = 0), '',
                    if(legal_form_code LIKE 'X%', '',
                    if(tax_3_cts = '1' and country_code = country_code_cts and len(tax_3_value) < 3 and len(tax_3_value) > 0, '0', '1')))
      - column: check_status
        expression: if(t0 = '0' or t1 = '0' or t2 = '0' or t3 = '0', '0',
                    if(t0 = '1' or t1 = '1' or t2 = '1' or t3 = '1', '1', ''))
      - column: value_checked
        expression: if(t0 in ('0','1') and tax_0_value != '', 
                    'TAX0' || CHR(58) || ' ' || tax_0_value, '')
      - column: value_checked
        expression: if(value_checked = '' AND t1 in ('0','1') and tax_1_value != '', 'TAX1' || CHR(58) || ' ' ||  tax_1_value,
                    if(t1 in ('0','1') and tax_1_value != '', value_checked || ', ' || 'TAX1' || CHR(58) || ' ' ||  tax_1_value, value_checked))
        overwrite: true
      - column: value_checked
        expression: if(value_checked = '' AND t2 in ('0','1') and tax_2_value != '', 'TAX2' || CHR(58) || ' ' ||  tax_2_value,
                    if(t2 in ('0','1') and tax_2_value != '', value_checked || ', ' || 'TAX2' || CHR(58) || ' ' ||  tax_2_value, value_checked))
        overwrite: true
      - column: value_checked
        expression: if(value_checked = '' AND t3 in ('0','1') and tax_3_value != '', 'TAX3' || CHR(58) || ' ' ||  tax_3_value,
                    if(t3 in ('0','1') and tax_3_value != '', value_checked || ', ' || 'TAX3' || CHR(58) || ' ' ||  tax_3_value, value_checked))
        overwrite: true

  - kind: select
    name: select_rcconf_52_2_final
    context_name: add_rcconf_52_2
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true

#RULE 52_3
  - kind: select
    name: select_rcconf_52_3
    context_name: join_dcg_cts_ctnf_cvnf
    params:
      columns:
        customer_code: customer_code
        legal_form_code: legal_form_code
        tax_0_value: tax_0_value
        tax_1_value: tax_1_value
        tax_2_value: tax_2_value
        tax_3_value: tax_3_value
        tax_0_cts: tax_0_cts
        tax_1_cts: tax_1_cts
        tax_2_cts: tax_2_cts
        tax_3_cts: tax_3_cts
        tax_format_ctnf: tax_format_ctnf
        length_ctnf: length_ctnf
        vat_format_cvnf: vat_format_cvnf
        length_cvnf: length_cvnf
        country_code: country_code
        country_code_cts: country_code_cts
      distinct: true

  - kind: add
    name: add_rcconf_52_3
    context_name: select_rcconf_52_3
    params:
      - column: tax_0_value
        expression: if(tax_0_value is null, '', tax_0_value)
        overwrite: true
      - column: tax_1_value
        expression: if(tax_1_value is null, '', tax_1_value)
        overwrite: true
      - column: tax_2_value
        expression: if(tax_2_value is null, '', tax_2_value)
        overwrite: true
      - column: tax_3_value
        expression: if(tax_3_value is null, '', tax_3_value)
        overwrite: true
      - column: t0
        expression: if((tax_0_cts = '0' and country_code = country_code_cts) or (tax_0_cts = '1' and country_code = country_code_cts and len(tax_0_value) = 0), '',
                    if(tax_0_cts = '1' and country_code = country_code_cts and regexp(tax_0_value, vat_format_cvnf), '1', '0'))
      - column: t1
        expression: if((tax_1_cts = '0' and country_code = country_code_cts) or (tax_1_cts = '1' and country_code = country_code_cts and len(tax_1_value) = 0), '',
                    if(tax_1_cts = '1' and country_code = country_code_cts and regexp(tax_1_value, tax_format_ctnf), '1', '0'))
      - column: t2
        expression: if((tax_2_cts = '0' and country_code = country_code_cts) or (tax_2_cts = '1' and country_code = country_code_cts and len(tax_2_value) = 0), '',
                    if(tax_2_cts = '1' and country_code = country_code_cts and regexp(tax_2_value, tax_format_ctnf), '1', '0'))
      - column: t3
        expression: if((tax_3_cts = '0' and country_code = country_code_cts) or (tax_3_cts = '1' and country_code = country_code_cts and len(tax_3_value) = 0), '',
                    if(tax_3_cts = '1' and country_code = country_code_cts and regexp(tax_3_value, tax_format_ctnf), '1', '0'))

  - kind: group
    name: group_52_3
    context_name: add_rcconf_52_3
    params:
      - aggs:
          t0: max
          t1: max
          t2: max
          t3: max
        by:
        - customer_code
        - tax_0_value
        - tax_1_value
        - tax_2_value
        - tax_3_value

  - kind: add
    name: add_rcconf_52_3_final
    context_name: group_52_3
    params:
      - column: rule_code
        expression: "'RCCONF_52.3'"
      - column: check_status
        expression: if(max_t0 = '0' or max_t1 = '0' or max_t2 = '0' or max_t3 = '0', '0',
                    if(max_t0 = '1' or max_t1 = '1' or max_t2 = '1' or max_t3 = '1', '1', ''))
      - column: value_checked
        expression: if(max_t0 in ('0','1') and tax_0_value != '', 
                    'TAX0' || CHR(58) || ' ' || tax_0_value, '')
      - column: value_checked
        expression: if(value_checked = '' AND max_t1 in ('0','1') and tax_1_value != '', 'TAX1' || CHR(58) || ' ' ||  tax_1_value,
                    if(max_t1 in ('0','1') and tax_1_value != '', value_checked || ', ' || 'TAX1' || CHR(58) || ' ' ||  tax_1_value, value_checked))
        overwrite: true
      - column: value_checked
        expression: if(value_checked = '' AND max_t2 in ('0','1') and tax_2_value != '', 'TAX2' || CHR(58) || ' ' ||  tax_2_value,
                    if(max_t2 in ('0','1') and tax_2_value != '', value_checked || ', ' || 'TAX2' || CHR(58) || ' ' ||  tax_2_value, value_checked))
        overwrite: true
      - column: value_checked
        expression: if(value_checked = '' AND max_t3 in ('0','1') and tax_3_value != '', 'TAX3' || CHR(58) || ' ' ||  tax_3_value,
                    if(max_t3 in ('0','1') and tax_3_value != '', value_checked || ', ' || 'TAX3' || CHR(58) || ' ' ||  tax_3_value, value_checked))
        overwrite: true

  - kind: select
    name: select_rcconf_52_3_final
    context_name: add_rcconf_52_3_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true

#RULE 52_4

  - kind: add
    name: add_checks_1
    context_name: add_rcconf_52_3_final
    params:
      - column: rule_code
        expression: "'RCCONF_52.4'"
        overwrite: true
      - column: tax_0_value
        expression: if(max_t0 in ('0', '1'), tax_0_value, '')
        overwrite: true
      - column: tax_1_value
        expression: if(max_t1 in ('0', '1'), tax_1_value, '')
        overwrite: true
      - column: tax_2_value
        expression: if(max_t2 in ('0', '1'), tax_2_value, '')
        overwrite: true
      - column: tax_3_value
        expression: if(max_t3 in ('0', '1'), tax_3_value, '')
        overwrite: true
      - column: repeated_digit
        expression: if(rlike(tax_0_value, "^(\d)\1+$") or rlike(tax_1_value, "^(\d)\1+$") or rlike(tax_2_value, "^(\d)\1+$") or rlike(tax_3_value, "^(\d)\1+$"), 1, 0)
      - column: repeated_letter
        expression: if(rlike(tax_0_value, "^([A-Za-z])\1+$") or rlike(tax_1_value, "^([A-Za-z])\1+$") or rlike(tax_2_value, "^([A-Za-z])\1+$") or rlike(tax_3_value, "^([A-Za-z])\1+$"), 1, 0)
        overwrite: true 
      # - column: repeated_both
      #   expression: if(rlike(tax_1_value, "^(.)\1+$"), 1, 0) 

  - kind: governance_data_quality_processes.custom_operations.sequential_digits.validate_sequential_digits.ValidateSequentialDigitsOperation
    name: validate_sequetial_digits
    context_name: add_checks_1
    config_kind: governance_data_quality_processes.custom_operation_configs.sequential_digits.validate_sequential_digits_config.ValidateSequentialDigitsOperationConfig
    params:
      tax_0_value: tax_0_value
      tax_1_value: tax_1_value
      tax_2_value: tax_2_value
      tax_3_value: tax_3_value

  - kind: add
    name: add_rcconf_52_4_checks_final
    context_name: validate_sequetial_digits
    params:
      - column: check_status
        expression: if(repeated_digit = '1' or repeated_letter = '1' or tax_0_value_is_sequential = '1' or tax_1_value_is_sequential = '1' or tax_2_value_is_sequential = '1' or tax_3_value_is_sequential = '1', '0', check_status)
        overwrite: true 

  - kind: select
    name: select_rcconf_52_4_final
    context_name: add_rcconf_52_4_checks_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true
