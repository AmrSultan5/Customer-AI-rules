#Select Data Marts

  - kind: select
    name: select_dcg
    context_name: read_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        legal_name: general_legal_name
        legal_form_code: legal_form_code
        name_above_door: general_name_above_door
        organization_1_name: organization_1_name
        organization_2_name: organization_2_name
        organization_3_name: organization_3_name
        organization_4_name: organization_4_name
        account_group_code: account_group_code
        central_order_block_code: central_order_block_code
        tax_0_value: tax_0_value
        tax_1_value: tax_1_value
        tax_2_value: tax_2_value
        tax_3_value: tax_3_value
        country_code: country_code
        name_above_door_corp_ind: name_above_door_corp_ind
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    context_name: read_dm_customer_address
    name: select_dca
    params:
      columns:
        customer_code: customer_code
        legal_name: address_legal_name
        name_above_door: address_name_above_door
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_address_rule
    context_name: select_dca
    params:
      - column: rule_code
        expression: "'RCCONF_12.3'"

  - kind: select
    context_name: read_dm_customer_bank
    name: select_dcb
    params:
      columns:
        bank_key: bank_key
        bank_name: bank_name
        customer_code: customer_code
        bank_details_id: bank_details_id
        bank_country_code: bank_country_code
        bank_account_number: bank_account_number
        is_bank_country_code_valid: is_bank_country_code_valid
        sap_cluster: sap_cluster
      distinct: true

#COMPANY
  - kind: select
    context_name: read_dm_customer_company
    name: select_dcc
    params:
      columns:
        customer_code: customer_code
        company_code: company_code
        dunning_procedure_code: dunning_procedure_code
        reconciliation_account: reconciliation_account
        planning_group_code: planning_group_code
        planning_group_description: planning_group_description
        terms_of_payment_code: terms_of_payment_code
        sap_cluster: sap_cluster
      distinct: true

#SALES ORGANIZATION
  - kind: select
    name: select_dcso
    context_name: read_dm_customer_sales_organization
    params:
      columns:
        customer_code: customer_code
        customer_group_4_code: customer_group_4_code
        account_assignment_group_code: account_assignment_group_code
        account_assignment_group_name: account_assignment_group_name
        sap_cluster: sap_cluster
      distinct: true  

#HIERARCHY
  - kind: select
    name: select_dch
    context_name: read_dm_customer_hierarchy
    params:
      columns:
        l4_customer_code: l4_customer_code
        l2_customer_code: l2_customer_code
        l7_customer_code: l7_customer_code
        sap_cluster: sap_cluster
      distinct: true

#READ dm_customer_partner_v1
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_partner
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_partner

  - kind: select
    context_name: read_dm_customer_partner
    name: select_dcp
    params:
      columns:
        customer_code: customer_code
        partner_function_code: partner_function_code
        partner_code: partner_code
        division_code: division_code_dcp
        distribution_channel_code: distribution_channel_code_dcp
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dcp
    context_name: select_dcp
    params:
      - condition:
          partner_function_code = 'RG' and division_code_dcp = '01' and distribution_channel_code_dcp = '01'

#ADD leadin zero
  - kind: add
    name: conf_recon_accounts
    context_name: read_conf_recon_accounts
    params:
      - column: conf_reconciliation_account
        expression: LPAD(reconciliation_account,10,'0')

#conf_recon_accounts
  - kind: select
    name: select_cra
    context_name: conf_recon_accounts
    params:
      columns:
