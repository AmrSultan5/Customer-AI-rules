transform:
  name: Bank_details_mdg_sap
  operations:
    - kind: read_dataio
      name: read_mdg_but0bk
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: bank_data
        object_name: but0bk
        schema_version: v1

    - kind: select
      name: select_mdg_but0bk
      context_name: read_mdg_but0bk
      params:
        columns:
          partner: partner_but0bk
          bkvid: bkvid_but0bk
          banks: banks_but0bk
          bankl: bankl_but0bk
          bankn: bankn_but0bk
          bkont: bkont_but0bk
          koinh: koinh_but0bk
          bkref: bkref_but0bk
          xezer: xezer_but0bk
        distinct: true

    - kind: read_dataio
      name: read_mdg_tiban
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: bank_data
        object_name: tiban
        schema_version: v1

    - kind: select
      name: select_mdg_tiban
      context_name: read_mdg_tiban
      params:
        columns:
          iban: iban_tiban
          bankl: bankl_tiban
          bankn: bankn_tiban
          banks: banks_tiban
          bkont: bkont_tiban
        distinct: true

    - kind: read_dataio
      name: read_mdg_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_mdg_but000
      context_name: read_mdg_but000
      params:
        columns:
          partner: partner_mdg_but000
          partner_guid: partner_guid_mdg_but000
          name_last: name_last_mdg_but000
          name_first: name_first_mdg_but000
          xpcpt: xpcpt_mdg_but000
        distinct: true

    - kind: read_dataio
      name: read_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_knvv_pre_checkpoint
      context_name: filter_knvv
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true

    - kind: checkpoint
      name: select_knvv
      context_name: select_knvv_pre_checkpoint

    - kind: join
      name: join_mdg
      context_name: select_mdg_but0bk
      params:
        - other:
            select_mdg_tiban
          how:
            left
          columns:
            bankl_but0bk: bankl_tiban
            bankn_but0bk: bankn_tiban
            banks_but0bk: banks_tiban
            bkont_but0bk: bkont_tiban
        - other:
            select_mdg_but000
          how:
            inner
          columns:
            partner_but0bk: partner_mdg_but000
        - other:
            select_knvv
          how:
            inner
          columns:
            partner_mdg_but000: kunnr_knvv

    - kind: filter
      name: filter_join_mdg
      context_name: join_mdg
      params:
        - condition:
            xpcpt_mdg_but000 <>'X' AND (
              partner_but0bk LIKE '12%' OR 
              partner_but0bk LIKE '13%' OR 
              partner_but0bk LIKE '40%' OR 
              partner_but0bk LIKE '18%' OR 
              partner_but0bk LIKE '30%' OR 
              partner_but0bk LIKE '16%' OR 
              partner_but0bk LIKE '29%' OR 
              partner_but0bk LIKE '17%' OR 
              partner_but0bk LIKE '24%' OR 
              partner_but0bk LIKE '26%' OR 
              partner_but0bk LIKE '21%' OR 
              partner_but0bk LIKE '19%' OR 
              partner_but0bk LIKE '96%' OR 
              partner_but0bk LIKE '28%' OR 
              partner_but0bk LIKE '27%' OR 
              partner_but0bk LIKE '32%' OR 
              partner_but0bk LIKE '35%' OR 
              partner_but0bk LIKE '25%' OR 
              partner_but0bk LIKE '34%' OR 
              partner_but0bk LIKE '42%' OR 
              partner_but0bk LIKE '33%' OR 
              partner_but0bk LIKE '31%' OR 
              partner_but0bk LIKE '15%' OR 
              partner_but0bk LIKE '95%' OR 
              partner_but0bk LIKE '94%' OR 
              partner_but0bk LIKE '14%' OR 
              partner_but0bk LIKE '47%' OR 
              partner_but0bk LIKE '22%')
 
    - kind: add
      name: add_mdg_HASH
      context_name: filter_join_mdg
      params:
      - column: HASH
        expression: MD5(CONCAT(partner_but0bk,bkvid_but0bk, iban_tiban, banks_but0bk,bankl_but0bk,bankn_but0bk,bkont_but0bk,koinh_but0bk,bkref_but0bk,xezer_but0bk ,partner_guid_mdg_but000))

    - kind: select
      name: mdg
      context_name: add_mdg_HASH
      params:
        columns:
          partner_but0bk: partner_mdg
          bkvid_but0bk: bkvid_mdg
          iban_tiban: iban_mdg
          banks_but0bk: banks_mdg
          bankl_but0bk: bankl_mdg
          bankn_but0bk: bankn_mdg
          bkont_but0bk: bkont_mdg
          koinh_but0bk: koinh_mdg
          bkref_but0bk: bkref_mdg
          xezer_but0bk: xezer_mdg
          name_first_mdg_but000: name_first_mdg
          name_last_mdg_but000: name_last_mdg
          partner_guid_mdg_but000: partner_guid_mdg
          HASH: HASH_mdg
        distinct: true

#s4hana
    - kind: read_dataio
      name: read_s4hana_but0bk
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: bank_data
        object_name: but0bk
        schema_version: v1

    - kind: select
      name: select_s4hana_but0bk
      context_name: read_s4hana_but0bk
      params:
        columns:
          partner: partner_but0bk
          bkvid: bkvid_but0bk
          banks: banks_but0bk
          bankl: bankl_but0bk
          bankn: bankn_but0bk
          bkont: bkont_but0bk
          koinh: koinh_but0bk
          bkref: bkref_but0bk
          xezer: xezer_but0bk
          SAP_CLUSTER: SAP_CLUSTER_but0bk
        distinct: true

    - kind: read_dataio
      name: read_s4hana_tiban
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: bank_data
        object_name: tiban
        schema_version: v1

    - kind: select
      name: select_s4hana_tiban
      context_name: read_s4hana_tiban
      params:
        columns:
          iban: iban_tiban
          bankl: bankl_tiban
          bankn: bankn_tiban
          banks: banks_tiban
          bkont: bkont_tiban
          SAP_CLUSTER: SAP_CLUSTER_tiban
        distinct: true

    - kind: read_dataio
      name: read_s4hana_but000
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: business_partner
        object_name: but000
        schema_version: v1

    - kind: select
      name: select_s4hana_but000
      context_name: read_s4hana_but000
      params:
        columns:
          partner: partner_s4hana_but000
          partner_guid: partner_guid_s4hana_but000
          name_last: name_last_s4hana_but000
          name_first: name_first_s4hana_but000
          xpcpt: xpcpt_s4hana_but000
          SAP_CLUSTER: SAP_CLUSTER_s4hana_but000
        distinct: true

    - kind: read_dataio
      name: read_knvv_sap
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_knvv_sap
      context_name: read_knvv_sap
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_knvv_sap
      context_name: filter_knvv_sap
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
          sap_cluster: sap_cluster_knvv
        distinct: true

    - kind: join
      name: join_s4hana
      context_name: select_s4hana_but0bk
      params:
        - other:
            select_s4hana_tiban
          how:
            left
          columns:
            bankl_but0bk: bankl_tiban
            bankn_but0bk: bankn_tiban
            banks_but0bk: banks_tiban
            bkont_but0bk: bkont_tiban
            SAP_CLUSTER_but0bk: SAP_CLUSTER_tiban
        - other:
            select_s4hana_but000
          how:
            inner
          columns:
            partner_but0bk: partner_s4hana_but000
            SAP_CLUSTER_but0bk: SAP_CLUSTER_s4hana_but000
        - other:
            select_knvv_sap
          how:
            inner
          columns:
            partner_s4hana_but000: kunnr_knvv
            SAP_CLUSTER_s4hana_but000: sap_cluster_knvv

    - kind: add
      name: add_s4hana_HASH
      context_name: join_s4hana
      params:
      - column: HASH
        expression: MD5(CONCAT(partner_but0bk,bkvid_but0bk, iban_tiban, banks_but0bk,bankl_but0bk,bankn_but0bk,bkont_but0bk,koinh_but0bk,bkref_but0bk,xezer_but0bk ,partner_guid_s4hana_but000))

    - kind: filter
      name: filter_join_s4hana_cl1
      context_name: add_s4hana_HASH
      params:
        - condition:
            SAP_CLUSTER_but0bk = 'CL1' AND xpcpt_s4hana_but000 <>'X' AND (
              partner_but0bk LIKE '12%' OR 
              partner_but0bk LIKE '13%' OR 
              partner_but0bk LIKE '40%' OR 
              partner_but0bk LIKE '18%' OR 
              partner_but0bk LIKE '30%' OR 
              partner_but0bk LIKE '16%' OR 
              partner_but0bk LIKE '29%' OR 
              partner_but0bk LIKE '17%' OR 
              partner_but0bk LIKE '24%' OR 
              partner_but0bk LIKE '26%' OR 
              partner_but0bk LIKE '21%' OR 
              partner_but0bk LIKE '19%')

    - kind: filter
      name: filter_join_s4hana_cl2
      context_name: add_s4hana_HASH
      params:
        - condition:
            SAP_CLUSTER_but0bk = 'CL2' AND xpcpt_s4hana_but000 <>'X' AND (
              partner_but0bk LIKE '96%' OR 
              partner_but0bk LIKE '28%' OR 
              partner_but0bk LIKE '27%' OR 
              partner_but0bk LIKE '32%' OR 
              partner_but0bk LIKE '35%' OR 
              partner_but0bk LIKE '25%' OR 
              partner_but0bk LIKE '34%' OR 
              partner_but0bk LIKE '42%' OR 
              partner_but0bk LIKE '33%' OR 
              partner_but0bk LIKE '31%' OR 
              partner_but0bk LIKE '15%' OR 
              partner_but0bk LIKE '95%' OR 
              partner_but0bk LIKE '94%' OR 
              partner_but0bk LIKE '14%' OR  
              partner_but0bk LIKE '47%' OR 
              partner_but0bk LIKE '22%')

    - kind: union
      name: s4hana_union
      context_name: filter_join_s4hana_cl1
      params:
        allow_missing: true
        by_name: true
        other: filter_join_s4hana_cl2


    - kind: select
      name: s4hana
      context_name: s4hana_union
      params:
        columns:
          partner_but0bk: partner_s4hana
          bkvid_but0bk: bkvid_s4hana
          iban_tiban: iban_s4hana
          banks_but0bk: banks_s4hana
          bankl_but0bk: bankl_s4hana
          bankn_but0bk: bankn_s4hana
          bkont_but0bk: bkont_s4hana
          koinh_but0bk: koinh_s4hana
          bkref_but0bk: bkref_s4hana
          xezer_but0bk: xezer_s4hana
          name_first_s4hana_but000: name_first_s4hana
          name_last_s4hana_but000: name_last_s4hana
          partner_guid_s4hana_but000: partner_guid_s4hana
          HASH: HASH_s4hana
        distinct: true

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            HASH_mdg: HASH_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_s4hana is null or HASH_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          bkvid_mdg: bkvid_mdg
          iban_mdg: iban_mdg
          banks_mdg: banks_mdg
          bankl_mdg: bankl_mdg
          bankn_mdg: bankn_mdg
          bkont_mdg: bkont_mdg
          koinh_mdg: koinh_mdg
          bkref_mdg: bkref_mdg
          xezer_mdg: xezer_mdg
          name_first_mdg: name_first_mdg
          name_last_mdg: name_last_mdg
          partner_guid_mdg: partner_guid_mdg
          HASH_mdg: HASH_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: HASH_mdg is null or HASH_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          partner_s4hana: partner_s4hana
          bkvid_s4hana: bkvid_s4hana
          iban_s4hana: iban_s4hana
          banks_s4hana: banks_s4hana
          bankl_s4hana: bankl_s4hana
          bankn_s4hana: bankn_s4hana
          bkont_s4hana: bkont_s4hana
          koinh_s4hana: koinh_s4hana
          bkref_s4hana: bkref_s4hana
          xezer_s4hana: xezer_s4hana
          name_first_s4hana: name_first_s4hana
          name_last_s4hana: name_last_s4hana
          partner_guid_s4hana: partner_guid_s4hana
          HASH_s4hana: HASH_s4hana

# ###data missing from mdg

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            partner_mdg: partner_s4hana
            bkvid_mdg: bkvid_s4hana
            partner_guid_mdg: partner_guid_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN partner_s4hana IS NULL THEN 'data missing from sap' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_s4hana: partner
          bkvid_s4hana: bkvid
          name_first_s4hana: name_first
          name_last_s4hana: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

# ###data missing from S4HANA

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

##BANK DETAILS: IBAN
    - kind: filter
      name: bank_details_iban_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND iban_s4hana <> iban_mdg

    - kind: add
      name: add_missing_columns_bank_details_iban
      context_name: bank_details_iban_filter
      params:
        - column: attr_name_bank_details_iban
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND iban_s4hana <> iban_mdg THEN concat('BANK DETAILS:',' IBAN') END
        - column: msg_bank_details_iban
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND iban_s4hana <> iban_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_iban
      context_name: add_missing_columns_bank_details_iban
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_bank_details_iban: msg
          attr_name_bank_details_iban: attr_name
          iban_s4hana: tgt_attr
          iban_mdg: src_attr

##BANK DETAILS: Bank Country
    - kind: filter
      name: bank_details_bank_country_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND banks_s4hana <> banks_mdg

    - kind: add
      name: add_missing_columns_bank_details_bank_country
      context_name: bank_details_bank_country_filter
      params:
        - column: attr_name_bank_details_bank_country
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND banks_s4hana <> banks_mdg THEN concat('BANK DETAILS:',' Bank Country') END
        - column: msg_bank_details_bank_country
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND banks_s4hana <> banks_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_bank_country
      context_name: add_missing_columns_bank_details_bank_country
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_bank_details_bank_country: msg
          attr_name_bank_details_bank_country: attr_name
          banks_s4hana: tgt_attr
          banks_mdg: src_attr

##BANK DETAILS: Bank Key
    - kind: filter
      name: bank_details_bank_key_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND bankl_s4hana <> bankl_mdg

    - kind: add
      name: add_missing_columns_bank_details_bank_key
      context_name: bank_details_bank_key_filter
      params:
        - column: attr_name_bank_details_bank_key
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND bankl_s4hana <> bankl_mdg THEN concat('BANK DETAILS:',' Bank Key') END
        - column: msg_bank_details_bank_key
          expression: CASE WHEN partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND bankl_s4hana <> bankl_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_bank_details_bank_key
      context_name: add_missing_columns_bank_details_bank_key
      params:
        columns:
          partner_mdg: partner
          bkvid_mdg: bkvid
          name_first_mdg: name_first
          name_last_mdg: name_last
          src_system: src_system
          tgt_system: tgt_system
          msg_bank_details_bank_key: msg
          attr_name_bank_details_bank_key: attr_name
          bankl_s4hana: tgt_attr
          bankl_mdg: src_attr

##BANK DETAILS: Bank Account
    - kind: filter
      name: bank_details_bank_account_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND bkvid_mdg = bkvid_s4hana AND partner_guid_mdg = partner_guid_s4hana AND bankn_s4hana <> bankn_mdg

    - kind: add
      name: add_missing_columns_bank_details_bank_account
      context_name: bank_details_bank_account_filter
      params:
