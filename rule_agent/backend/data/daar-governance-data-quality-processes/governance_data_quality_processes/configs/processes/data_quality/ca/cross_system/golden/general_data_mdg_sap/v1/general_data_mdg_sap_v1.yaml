        - column: msg_general_data_equalization_tax
          expression: CASE WHEN partner_mdg = partner_s4hana AND stkza_s4hana <> stkza_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_general_data_equalization_tax
      context_name: add_missing_columns_general_data_equalization_tax
      params:
        columns:
          partner_mdg: partner
          aufsd_mdg: aufsd
          ktokd_mdg: ktokd
