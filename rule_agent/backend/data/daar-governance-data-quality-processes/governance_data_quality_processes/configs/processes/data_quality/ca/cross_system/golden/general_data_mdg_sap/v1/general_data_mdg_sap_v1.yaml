transform:
  name: General_data_mdg_sap
  operations:
    - kind: read_dataio
      name: read_mdg_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: select
      name: select_mdg_kna1
      context_name: read_mdg_kna1
      params:
        columns:
          kunnr: kunnr_mdg_kna1
          ktokd: ktokd_mdg_kna1
          stkzu: stkzu_mdg_kna1
          stkza: stkza_mdg_kna1
          stkzn: stkzn_mdg_kna1
          stcd6: stcd6_mdg_kna1
          sperr: sperr_mdg_kna1
          katr1: katr1_mdg_kna1
          katr2: katr2_mdg_kna1
          katr3: katr3_mdg_kna1
          katr4: katr4_mdg_kna1
          katr5: katr5_mdg_kna1
          katr6: katr6_mdg_kna1
          katr7: katr7_mdg_kna1
          katr8: katr8_mdg_kna1
          katr9: katr9_mdg_kna1
          katr10: katr10_mdg_kna1
          locco: locco_mdg_kna1
          kukla: kukla_mdg_kna1
          niels: niels_mdg_kna1
          rpmkr: rpmkr_mdg_kna1
          bran1: bran1_mdg_kna1
          brsch: brsch_mdg_kna1
          aufsd: aufsd_mdg_kna1
        distinct: true

    - kind: read_dataio
      name: read_mdg_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_mdg
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_mdg_knvv
      context_name: read_mdg_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_knvv_pre_checkpoint
      context_name: filter_mdg_knvv
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
        distinct: true
    
    - kind: checkpoint
      name: select_mdg_knvv
      context_name: select_knvv_pre_checkpoint

  # Join MDG tables
    - kind: join
      name: join_mdg
      context_name: select_mdg_kna1
      params:
        - other: select_mdg_knvv
          how: inner
          columns:
            kunnr_mdg_kna1: kunnr_knvv

    - kind: filter
      name: filter_mdg_kna1
      context_name: join_mdg
      params:
        - condition:
            kunnr_mdg_kna1 like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%', '96%', '28%', '27%', '32%', '35%', '25%', '34%', '42%', '33%', '31%', '15%', '95%', '94%', '14%', '22%','47%') #and aufsd_mdg_kna1 in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: add
      name: add_mdg_hash
      context_name: filter_mdg_kna1
      params:
      - column: hash_mdg
        expression: md5(concat(kunnr_mdg_kna1,stkzu_mdg_kna1,stkza_mdg_kna1,stkzn_mdg_kna1,stcd6_mdg_kna1,aufsd_mdg_kna1,sperr_mdg_kna1,katr1_mdg_kna1,katr2_mdg_kna1,katr3_mdg_kna1,katr4_mdg_kna1,katr5_mdg_kna1,katr6_mdg_kna1,katr7_mdg_kna1,katr8_mdg_kna1,katr9_mdg_kna1,katr10_mdg_kna1,locco_mdg_kna1,kukla_mdg_kna1,niels_mdg_kna1,rpmkr_mdg_kna1,bran1_mdg_kna1,brsch_mdg_kna1))

    - kind: select
      name: select_mdg
      context_name: add_mdg_hash
      params:
        columns:
          kunnr_mdg_kna1: partner_mdg
          ktokd_mdg_kna1: ktokd_mdg
          stkzu_mdg_kna1: stkzu_mdg
          stkza_mdg_kna1: stkza_mdg
          stkzn_mdg_kna1: stkzn_mdg
          stcd6_mdg_kna1: stcd6_mdg
          aufsd_mdg_kna1: aufsd_mdg
          sperr_mdg_kna1: sperr_mdg
          katr1_mdg_kna1: katr1_mdg
          katr2_mdg_kna1: katr2_mdg
          katr3_mdg_kna1: katr3_mdg
          katr4_mdg_kna1: katr4_mdg
          katr5_mdg_kna1: katr5_mdg
          katr6_mdg_kna1: katr6_mdg
          katr7_mdg_kna1: katr7_mdg
          katr8_mdg_kna1: katr8_mdg
          katr9_mdg_kna1: katr9_mdg
          katr10_mdg_kna1: katr10_mdg
          locco_mdg_kna1: locco_mdg
          kukla_mdg_kna1: kukla_mdg
          niels_mdg_kna1: niels_mdg
          rpmkr_mdg_kna1: rpmkr_mdg
          bran1_mdg_kna1: bran1_mdg
          brsch_mdg_kna1: brsch_mdg
          hash_mdg: hash_mdg

    - kind: checkpoint
      name: mdg
      context_name: select_mdg

    - kind: read_dataio
      name: read_s4hana_kna1
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: kna1
        schema_version: v1

    - kind: filter
      name: filter_s4hana_kna1
      params:
        - condition:
            (SAP_CLUSTER = 'CL1' AND (kunnr like any('12%', '13%', '40%', '18%', '30%', '16%', '29%', '17%', '24%', '26%', '21%', '19%'))) OR (SAP_CLUSTER = 'CL2' AND (kunnr like any('96%','28%','27%','32%','35%','25%','34%','42%','33%','31%','15%','95%','94%','14%','22%','47%'))) 

    # - kind: filter
    #   name: filter_s4hana_kna1
    #   params:
    #     - condition:
    #         aufsd in ('C','CW','I','M','S1','TS','VF','WH','')

    - kind: select
      name: select_s4hana_kna1
      context_name: filter_s4hana_kna1
      params:
        columns:
          kunnr: kunnr_s4hana_kna1
          ktokd: ktokd_s4hana_kna1
          stkzu: stkzu_s4hana_kna1
          stkza: stkza_s4hana_kna1
          stkzn: stkzn_s4hana_kna1
          stcd6: stcd6_s4hana_kna1
          sperr: sperr_s4hana_kna1
          katr1: katr1_s4hana_kna1
          katr2: katr2_s4hana_kna1
          katr3: katr3_s4hana_kna1
          katr4: katr4_s4hana_kna1
          katr5: katr5_s4hana_kna1
          katr6: katr6_s4hana_kna1
          katr7: katr7_s4hana_kna1
          katr8: katr8_s4hana_kna1
          katr9: katr9_s4hana_kna1
          katr10: katr10_s4hana_kna1
          locco: locco_s4hana_kna1
          kukla: kukla_s4hana_kna1
          niels: niels_s4hana_kna1
          rpmkr: rpmkr_s4hana_kna1
          bran1: bran1_s4hana_kna1
          brsch: brsch_s4hana_kna1
          aufsd: aufsd_s4hana_kna1
          SAP_CLUSTER: SAP_CLUSTER_kna1
        distinct: true

    - kind: read_dataio
      name: read_sap_knvv
      params:
        dataio:
          ad_id: '{{dataio.ad_id}}'
          layer: curated
          storage_id: '{{dataio.storage_id}}'
        source: sap_s4hana
        namespace: customer
        object_name: knvv
        schema_version: v1
    
    - kind: filter
      name: filter_sap_knvv
      context_name: read_sap_knvv
      params:
        - condition:
            vtweg = '01' and spart = '01' and vkorg in (9600,8200,5500,8500,3100,9400,2000,1200,3300,4890,8090,5100,7800,3200,6100,4090,2800,7200,9100,6300,2500,8600,4500,9500,7900,9200,1100,4700)
    
    - kind: select
      name: select_sap_knvv
      context_name: filter_sap_knvv
      params:          
        columns:
          kunnr: kunnr_knvv
          kvgr4: kvgr4_knvv
          vkorg: vkorg_knvv
          vtweg: vtweg_knvv
          spart: spart_knvv
          sap_cluster: sap_cluster_knvv
        distinct: true

  # Join MDG tables
    - kind: join
      name: join_sap
      context_name: select_s4hana_kna1
      params:
        - other: select_sap_knvv
          how: inner
          columns:
            kunnr_s4hana_kna1: kunnr_knvv
            SAP_CLUSTER_kna1: sap_cluster_knvv

    - kind: add
      name: add_s4hana_hash
      context_name: join_sap
      params:
      - column: hash_s4hana
        expression: md5(concat(kunnr_s4hana_kna1,stkzu_s4hana_kna1,stkza_s4hana_kna1,stkzn_s4hana_kna1,stcd6_s4hana_kna1,aufsd_s4hana_kna1,sperr_s4hana_kna1,katr1_s4hana_kna1,katr2_s4hana_kna1,katr3_s4hana_kna1,katr4_s4hana_kna1,katr5_s4hana_kna1,katr6_s4hana_kna1,katr7_s4hana_kna1,katr8_s4hana_kna1,katr9_s4hana_kna1,katr10_s4hana_kna1,locco_s4hana_kna1,kukla_s4hana_kna1,niels_s4hana_kna1,rpmkr_s4hana_kna1,bran1_s4hana_kna1,brsch_s4hana_kna1))

    - kind: select
      name: select_s4hana
      context_name: add_s4hana_hash
      params:
        columns:
          kunnr_s4hana_kna1: partner_s4hana
          ktokd_s4hana_kna1: ktokd_s4hana
          stkzu_s4hana_kna1: stkzu_s4hana
          stkza_s4hana_kna1: stkza_s4hana
          stkzn_s4hana_kna1: stkzn_s4hana
          stcd6_s4hana_kna1: stcd6_s4hana
          aufsd_s4hana_kna1: aufsd_s4hana
          sperr_s4hana_kna1: sperr_s4hana
          katr1_s4hana_kna1: katr1_s4hana
          katr2_s4hana_kna1: katr2_s4hana
          katr3_s4hana_kna1: katr3_s4hana
          katr4_s4hana_kna1: katr4_s4hana
          katr5_s4hana_kna1: katr5_s4hana
          katr6_s4hana_kna1: katr6_s4hana
          katr7_s4hana_kna1: katr7_s4hana
          katr8_s4hana_kna1: katr8_s4hana
          katr9_s4hana_kna1: katr9_s4hana
          katr10_s4hana_kna1: katr10_s4hana
          locco_s4hana_kna1: locco_s4hana
          kukla_s4hana_kna1: kukla_s4hana
          niels_s4hana_kna1: niels_s4hana
          rpmkr_s4hana_kna1: rpmkr_s4hana
          bran1_s4hana_kna1: bran1_s4hana
          brsch_s4hana_kna1: brsch_s4hana
          hash_s4hana: hash_s4hana



    - kind: checkpoint
      name: s4hana
      context_name: select_s4hana

    - kind: join
      name: join_non_matching_mdg
      context_name: mdg
      params:
        - other:
            s4hana
          how:
            full
          columns:
            hash_mdg: hash_s4hana

    - kind: filter
      name: non_matching_mdg
      context_name: join_non_matching_mdg
      params:
        - condition: hash_s4hana is null or hash_s4hana = ''

    - kind: select
      name: non_matching_mdg_select
      context_name: non_matching_mdg
      params:
        columns:
          partner_mdg: partner_mdg
          ktokd_mdg: ktokd_mdg
          stkzu_mdg: stkzu_mdg
          stkza_mdg: stkza_mdg
          stkzn_mdg: stkzn_mdg
          stcd6_mdg: stcd6_mdg
          aufsd_mdg: aufsd_mdg
          sperr_mdg: sperr_mdg
          katr1_mdg: katr1_mdg
          katr2_mdg: katr2_mdg
          katr3_mdg: katr3_mdg
          katr4_mdg: katr4_mdg
          katr5_mdg: katr5_mdg
          katr6_mdg: katr6_mdg
          katr7_mdg: katr7_mdg
          katr8_mdg: katr8_mdg
          katr9_mdg: katr9_mdg
          katr10_mdg: katr10_mdg
          locco_mdg: locco_mdg
          kukla_mdg: kukla_mdg
          niels_mdg: niels_mdg
          rpmkr_mdg: rpmkr_mdg
          bran1_mdg: bran1_mdg
          brsch_mdg: brsch_mdg
          hash_mdg: hash_mdg

    - kind: filter
      name: non_matching_s4hana
      context_name: join_non_matching_mdg
      params:
        - condition: hash_mdg is null or hash_mdg = ''

    - kind: select
      name: non_matching_s4hana_select
      context_name: non_matching_s4hana
      params:
        columns:
          partner_s4hana: partner_s4hana
          ktokd_s4hana: ktokd_s4hana
          stkzu_s4hana: stkzu_s4hana
          stkza_s4hana: stkza_s4hana
          stkzn_s4hana: stkzn_s4hana
          stcd6_s4hana: stcd6_s4hana
          aufsd_s4hana: aufsd_s4hana
          sperr_s4hana: sperr_s4hana
          katr1_s4hana: katr1_s4hana
          katr2_s4hana: katr2_s4hana
          katr3_s4hana: katr3_s4hana
          katr4_s4hana: katr4_s4hana
          katr5_s4hana: katr5_s4hana
          katr6_s4hana: katr6_s4hana
          katr7_s4hana: katr7_s4hana
          katr8_s4hana: katr8_s4hana
          katr9_s4hana: katr9_s4hana
          katr10_s4hana: katr10_s4hana
          locco_s4hana: locco_s4hana
          kukla_s4hana: kukla_s4hana
          niels_s4hana: niels_s4hana
          rpmkr_s4hana: rpmkr_s4hana
          bran1_s4hana: bran1_s4hana
          brsch_s4hana: brsch_s4hana
          hash_s4hana: hash_s4hana

    - kind: join
      name: join_data_missing_from_mdg
      context_name: non_matching_mdg_select
      params:
        - other:
            non_matching_s4hana_select
          how:
            full
          columns:
            partner_mdg: partner_s4hana

    - kind: add
      name: data_missing_from_mdg_add_columns
      context_name: join_data_missing_from_mdg
      params:
        - column: src_system
          expression: cast('mdg' as string)
        - column: tgt_system
          expression: cast('sap' as string)
        - column: msg_mdg
          expression: CASE WHEN partner_mdg IS NULL THEN 'data missing from mdg' end
        - column: msg_s4hana
          expression: CASE WHEN partner_s4hana IS NULL THEN 'data missing from sap' end
        - column: attr_name
          expression: cast(NULL as string)
        - column: tgt_attr
          expression: cast(NULL as string)
        - column: src_attr
          expression: cast(NULL as string)   

    - kind: filter
      name: join_data_missing_from_mdg_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg is null

    - kind: select
      name: final_data_missing_from_mdg
      context_name: join_data_missing_from_mdg_filter
      params:
        columns:
          partner_s4hana: partner
          aufsd_s4hana: aufsd
          ktokd_s4hana: ktokd
          src_system: src_system
          tgt_system: tgt_system
          msg_mdg: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

    - kind: filter
      name: join_data_missing_from_s4hana_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_s4hana is null

    - kind: select
      name: final_data_missing_from_s4hana
      context_name: join_data_missing_from_s4hana_filter
      params:
        columns:
          partner_mdg: partner
          aufsd_mdg: aufsd
          ktokd_mdg: ktokd
          src_system: src_system
          tgt_system: tgt_system
          msg_s4hana: msg
          attr_name: attr_name
          tgt_attr: tgt_attr
          src_attr: src_attr

###Sales/Pur.Tax---
    - kind: filter
      name: general_data_sales_pur_tax_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND stkzu_s4hana <> stkzu_mdg

    - kind: add
      name: add_missing_columns_general_data_sales_pur_tax
      context_name: general_data_sales_pur_tax_filter
      params:
        - column: attr_name_general_data_sales_pur_tax
          expression: CASE WHEN partner_mdg = partner_s4hana AND stkzu_s4hana <> stkzu_mdg THEN concat('TAX DATA:',' Sales/Pur.Tax') END
        - column: msg_general_data_sales_pur_tax
          expression: CASE WHEN partner_mdg = partner_s4hana AND stkzu_s4hana <> stkzu_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_general_data_sales_pur_tax
      context_name: add_missing_columns_general_data_sales_pur_tax
      params:
        columns:
          partner_mdg: partner
          aufsd_mdg: aufsd
          ktokd_mdg: ktokd
          src_system: src_system
          tgt_system: tgt_system
          msg_general_data_sales_pur_tax: msg
          attr_name_general_data_sales_pur_tax: attr_name
          stkzu_s4hana: tgt_attr
          stkzu_mdg: src_attr

