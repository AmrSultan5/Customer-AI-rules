          attr_name_general_data_equalization_tax: attr_name
          stkza_s4hana: tgt_attr
          stkza_mdg: src_attr

###Natural Person---
    - kind: filter
      name: general_data_natural_person_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND stkzn_s4hana <> stkzn_mdg

    - kind: add
      name: add_missing_columns_general_data_natural_person
      context_name: general_data_natural_person_filter
      params:
        - column: attr_name_general_data_natural_person
          expression: CASE WHEN partner_mdg = partner_s4hana AND stkzn_s4hana <> stkzn_mdg THEN concat('TAX DATA:',' Natural Person') END
        - column: msg_general_data_natural_person
          expression: CASE WHEN partner_mdg = partner_s4hana AND stkzn_s4hana <> stkzn_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_general_data_natural_person
      context_name: add_missing_columns_general_data_natural_person
      params:
        columns:
          partner_mdg: partner
          aufsd_mdg: aufsd
          ktokd_mdg: ktokd
          src_system: src_system
          tgt_system: tgt_system
          msg_general_data_natural_person: msg
          attr_name_general_data_natural_person: attr_name
          stkzn_s4hana: tgt_attr
          stkzn_mdg: src_attr

###Tax Number 6---
    - kind: filter
      name: general_data_tax_number_6_filter
      context_name: data_missing_from_mdg_add_columns
      params:
        - condition: partner_mdg = partner_s4hana AND stcd6_s4hana <> stcd6_mdg

    - kind: add
      name: add_missing_columns_general_data_tax_number_6
      context_name: general_data_tax_number_6_filter
      params:
        - column: attr_name_general_data_tax_number_6
          expression: CASE WHEN partner_mdg = partner_s4hana AND stcd6_s4hana <> stcd6_mdg THEN concat('TAX DATA:',' Tax Number 6') END
        - column: msg_general_data_tax_number_6
          expression: CASE WHEN partner_mdg = partner_s4hana AND stcd6_s4hana <> stcd6_mdg THEN 'attributes are mismatching' END

    - kind: select
      name: final_general_data_tax_number_6
      context_name: add_missing_columns_general_data_tax_number_6
      params:
        columns:
          partner_mdg: partner
          aufsd_mdg: aufsd
          ktokd_mdg: ktokd
          src_system: src_system
          tgt_system: tgt_system
          msg_general_data_tax_number_6: msg
          attr_name_general_data_tax_number_6: attr_name
          stcd6_s4hana: tgt_attr
          stcd6_mdg: src_attr

###Blocking---
    - kind: filter
      name: general_data_blocking_filter
