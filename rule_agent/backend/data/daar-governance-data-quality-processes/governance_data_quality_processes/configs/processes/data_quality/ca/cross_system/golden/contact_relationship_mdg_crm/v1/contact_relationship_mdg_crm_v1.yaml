                          WHEN 'P47' THEN 'EG'
                          WHEN 'E96' THEN 'AM'
                          WHEN 'E12' THEN 'AT'
                          WHEN 'E28' THEN 'BA'
                          WHEN 'E13' THEN 'BG'
                          WHEN 'E23' THEN 'BY'
                          WHEN 'E27' THEN 'CH'
                          WHEN 'E40' THEN 'CY'
                          WHEN 'E18' THEN 'CZ'
                          WHEN 'E32' THEN 'EE'
                          WHEN 'E47' THEN 'EG'
                          WHEN 'E35' THEN 'GB'
                          WHEN 'E30' THEN 'GR'
                          WHEN 'E25' THEN 'HR'
                          WHEN 'E16' THEN 'HU'
                          WHEN 'E34' THEN 'IE'
                          WHEN 'E29' THEN 'IT'
                          WHEN 'E42' THEN 'KV'
                          WHEN 'E33' THEN 'LT'
                          WHEN 'E31' THEN 'LV'
                          WHEN 'E17' THEN 'MD'
                          WHEN 'E15' THEN 'ME'
                          WHEN 'E95' THEN 'MK'
                          WHEN 'E94' THEN 'NG'
