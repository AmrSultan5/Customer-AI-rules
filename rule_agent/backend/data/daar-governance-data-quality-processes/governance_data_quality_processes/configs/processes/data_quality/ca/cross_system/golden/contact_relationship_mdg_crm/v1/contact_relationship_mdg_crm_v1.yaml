          inner
        columns:
          partner_mdg_but020: partner1_mdg_but051

  - kind: join
    name: join_mdg_but051_adr2
    context_name: join_mdg_but051_but020
    params:
      - other:
          select_mdg_adr2
        how:
          left
        columns:
          addrnumber_mdg_but020: addrnumber_mdg_adr2
          persnumber_mdg_but000: persnumber_mdg_adr2

  - kind: join
    name: join_mdg_but051_adr3
    context_name: join_mdg_but051_but020
    params:
      - other:
          select_mdg_adr3
        how:
          left
        columns:
