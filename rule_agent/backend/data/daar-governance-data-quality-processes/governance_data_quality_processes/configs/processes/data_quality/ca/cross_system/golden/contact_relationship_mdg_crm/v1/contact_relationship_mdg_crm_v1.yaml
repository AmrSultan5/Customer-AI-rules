                          WHEN 'P79' THEN 'GB'
                          WHEN 'P12' THEN 'GR'
                          WHEN 'P80' THEN 'HR'
                          WHEN 'P28' THEN 'HU'
                          WHEN 'P78' THEN 'IE'
                          WHEN 'P63' THEN 'IT'
                          WHEN 'P92' THEN 'KV'
                          WHEN 'P33' THEN 'LT'
                          WHEN 'P31' THEN 'LV'
                          WHEN 'P20' THEN 'MD'
                          WHEN 'P82' THEN 'ME'
