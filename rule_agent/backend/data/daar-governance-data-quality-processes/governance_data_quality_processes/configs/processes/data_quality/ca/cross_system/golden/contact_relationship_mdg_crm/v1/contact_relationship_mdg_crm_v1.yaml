                      WHEN 'First Name' THEN crm_name_first
                      WHEN 'Last Name' THEN crm_name_last
                      WHEN 'Function' THEN crm_relationship
                      WHEN 'Archiving Flag' THEN crm_archiving_flag
                      ELSE ''                      
                    END
