                          WHEN '26' THEN 'RO'
                          WHEN '38' THEN 'RU'
                          WHEN '21' THEN 'SI'
                          WHEN '19' THEN 'SK'
                          WHEN '14' THEN 'RS'
                          WHEN '22' THEN 'UA'
                          WHEN '40' THEN 'CY'
                          WHEN '47' THEN 'EG'
                          ELSE NULL
                        END
                      WHEN initials_crm_but051 = 3 THEN 
                        CASE SUBSTRING(partner1_crm_but051, 1, 3)
                          WHEN 'P96' THEN 'AM'
                          WHEN 'P11' THEN 'AT'
                          WHEN 'P86' THEN 'BA'
                          WHEN 'P49' THEN 'BG'
                          WHEN 'P23' THEN 'BY'
