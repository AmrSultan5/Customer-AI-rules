        expression: CASE 
                      WHEN mdg_telnr_long IS NOT NULL AND mdg_r3_user IN ('', '1') THEN 'Telephone'
                      WHEN mdg_telnr_long IS NOT NULL AND mdg_r3_user IN ('2', '3') THEN 'Mobile Number'
                      WHEN mdg_email IS NOT NULL THEN 'E-mail'
                      WHEN mdg_fax_number IS NOT NULL THEN 'Fax'
                      ELSE 'No address info available'
                    END
      - column: comparison_crm
        expression: CASE 
                      WHEN crm_telnr_long IS NOT NULL AND crm_r3_user IN ('', '1') THEN 'Telephone'
                      WHEN crm_telnr_long IS NOT NULL AND crm_r3_user IN ('2', '3') THEN 'Mobile Number'
                      WHEN crm_email IS NOT NULL THEN 'E-mail'
                      WHEN crm_fax_number IS NOT NULL THEN 'Fax'
                      ELSE 'No address info available'
                    END
      - column: mdg_r3_user_out
        expression: CASE 
                      WHEN comparison_mdg IN ('E-mail', 'Fax', 'No contact info available') THEN '0'
                      ELSE mdg_r3_user
                    END
      - column: crm_r3_user_out
        expression: CASE 
                      WHEN comparison_crm IN ('E-mail', 'Fax', 'No contact info available') THEN '0'
                      ELSE crm_r3_user
                    END


