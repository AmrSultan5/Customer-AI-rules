transform:
  name: dm_product_check_results_activity
  operations:

# read dm_product_universe
  - kind: read_dataio
    name: read_dm_product_universe
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_universe
      schema_version: v2

  - kind: filter
    name: filter_country_code
    params:
      - condition:
          country_code!='BSO'

  - kind: select
    name: select_dm_product_universe
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

#read dm_product_plant
  - kind: read_dataio
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant
      schema_version: v8

#Sales check

  - kind: select
    name: select_dm_product_plant_sales_check
    context_name: read_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sales_quantity_cy: sales_quantity_cy
        sales_quantity_py: sales_quantity_py
        sales_quantity_ppy: sales_quantity_ppy
        stock_batch: stock_batch
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_not_empty
        expression: IF(stock_batch='', null, stock_batch)

  - kind: group
    name: group_dm_product_plant_sales_check
    params:
      - aggs:
          sales_quantity_cy: sum
          sales_quantity_py: sum
          sales_quantity_ppy: sum
          stock_batch_not_empty: collect_set
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_sales_check_sort_set
    params:
      - column: stock_batch_not_empty_sorted_array
        expression: sort_array(collect_set_stock_batch_not_empty)

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_array_concat
        expression: concat_ws(',', stock_batch_not_empty_sorted_array)


  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: stock_batch_array
        expression: IF(length(stock_batch_array_concat)<4001, stock_batch_array_concat, substring_index(substr(stock_batch_array_concat,1,4000),',',-1))

  - kind: add
    name: add_dm_product_plant_sales_check
    params:
      - column: sales_check_with_null
        expression: "CASE WHEN(sum_sales_quantity_cy != 0 AND sum_sales_quantity_py!= 0 AND sum_sales_quantity_ppy!= 0) THEN '1' ELSE '0' END"

  - kind: join
    name: join_dm_product_plant_sales_check_universe
    context_name: select_dm_product_universe
    params:
      - other:
          add_dm_product_plant_sales_check
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_dm_product_plant_sales_check_if_null
    params:
      - column: sales_check
        expression: "CASE WHEN(sales_check_with_null is null) THEN '0' ELSE sales_check_with_null END"

  - kind: select
    name: select_dm_product_plant_sales_check_final
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
        sum_sales_quantity_cy: sum_sales_quantity_cy
        sum_sales_quantity_py: sum_sales_quantity_py
        sum_sales_quantity_ppy: sum_sales_quantity_ppy
        sales_check: sales_check
        stock_batch_array: stock_batch_array

#Stock check
  - kind: select
    name: select_dm_product_plant_stock_check
    context_name: read_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        stock_in_transit_quantity: stock_in_transit_quantity
        stock_in_transfer_quantity: stock_in_transfer_quantity
        stock_in_transfer_quantity: stock_in_transfer_quantity
        stock_unrestricted_quantity: stock_unrestricted_quantity
        stock_blocked_quantity: stock_blocked_quantity
        stock_quality_inspection_quantity: stock_quality_inspection_quantity
        stock_vendor_flag: stock_vendor_flag
        stock_customer_unrestricted_use_quantity: stock_customer_unrestricted_use_quantity
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dm_product_plant_stock_check
    params:
      - aggs:
          stock_in_transit_quantity: sum
          stock_in_transfer_quantity: sum
          stock_unrestricted_quantity: sum
          stock_blocked_quantity: sum
          stock_quality_inspection_quantity: sum
          stock_vendor_flag: max
          stock_customer_unrestricted_use_quantity: sum 
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_stock_check
    params:
      - column: stock_check_with_null
        expression: "CASE WHEN((sum_stock_in_transit_quantity = 0 OR sum_stock_in_transit_quantity is null OR sum_stock_in_transit_quantity='') AND (sum_stock_in_transfer_quantity = 0 OR sum_stock_in_transfer_quantity is null OR sum_stock_in_transfer_quantity='') AND (sum_stock_unrestricted_quantity = 0 OR sum_stock_unrestricted_quantity is null OR sum_stock_unrestricted_quantity ='') AND (sum_stock_blocked_quantity = 0 OR sum_stock_blocked_quantity is null OR sum_stock_blocked_quantity ='') AND (sum_stock_quality_inspection_quantity = 0 OR sum_stock_quality_inspection_quantity is null OR sum_stock_quality_inspection_quantity='') AND (sum_stock_customer_unrestricted_use_quantity = 0 OR sum_stock_customer_unrestricted_use_quantity is null OR sum_stock_customer_unrestricted_use_quantity='') AND max_stock_vendor_flag is null) THEN '0' ELSE '1' END"

  - kind: join
    name: join_dm_product_plant_stock_check_universe
    context_name: select_dm_product_plant_sales_check_final
    params:
      - other:
          add_dm_product_plant_stock_check
        how:
          left
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_dm_product_plant_stock_check_if_null
    params:
      - column: stock_check
        expression: "CASE WHEN(stock_check_with_null is null) THEN '0' ELSE stock_check_with_null END"

  - kind: select
    name: select_dm_product_plant_stock_check_final
    params:
      columns:
        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
        sum_sales_quantity_cy: sum_sales_quantity_cy
        sum_sales_quantity_py: sum_sales_quantity_py
        sum_sales_quantity_ppy: sum_sales_quantity_ppy
        sales_check: sales_check
        stock_batch_array: stock_batch_array
        sum_stock_in_transit_quantity: sum_stock_in_transit_quantity
        sum_stock_in_transfer_quantity: sum_stock_in_transfer_quantity
        sum_stock_unrestricted_quantity: sum_stock_unrestricted_quantity
        sum_stock_blocked_quantity: sum_stock_blocked_quantity
        sum_stock_quality_inspection_quantity: sum_stock_quality_inspection_quantity
        max_stock_vendor_flag: max_stock_vendor_flag
        sum_stock_customer_unrestricted_use_quantity: sum_stock_customer_unrestricted_use_quantity
        stock_check: stock_check
      distinct: true

#read dm_product_documents
