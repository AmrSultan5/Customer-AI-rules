      - aggs:
          bom_item_link_deletion_flag : min
          bom_number: collect_set
        by:
        - bom_component_material_number
        - bom_material_status 
        - country_code
        - sap_cluster


  - kind: add
    name: add_dm_bill_of_material_bom_check_sort_set
