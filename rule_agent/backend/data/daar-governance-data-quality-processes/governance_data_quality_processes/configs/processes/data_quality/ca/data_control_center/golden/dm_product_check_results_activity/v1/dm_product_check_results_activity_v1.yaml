  - kind: add
    name: add_dm_bill_of_material_bom_check
    params:
      - column: bom_check_with_null
        expression: "CASE WHEN((min_bom_item_link_deletion_flag = '' or min_bom_item_link_deletion_flag is null) AND bom_material_status = '1') THEN '1' ELSE '0' END"


  - kind: select
    name: select_dm_bill_of_material_bom_check
    params:
      columns:
        bom_component_material_number: bom_component_material_number
        country_code: country_code
        sap_cluster: sap_cluster
        bom_check_with_null : bom_check_with_null 
        bom_number_array: bom_number_array
