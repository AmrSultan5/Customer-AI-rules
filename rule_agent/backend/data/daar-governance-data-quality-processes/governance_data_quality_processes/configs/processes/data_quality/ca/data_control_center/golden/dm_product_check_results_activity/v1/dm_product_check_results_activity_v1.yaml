  - kind: add
    name: add_sub_check_flag
    params:
      - column: sum_of_sub_checks
        expression: (cast(sales_check as int) + cast(purchase_order_check as int) + cast(production_order_check as int) + cast(stock_check as int) + cast(product_document_check as int) + cast(bom_check as int) )


#Final check status
  - kind: add
    name: add_check_status
    params:
      - column: check_status
        expression: IF(cast(material_code as int) < 3000 or cast(material_code as int) > 9999999,'',
                    IF((material_code_plant IS NULL OR material_code_plant = ''), '',
                    IF(plant_status_check ='1','1',
                    IF(creation_date_check = '1', '1',
                    IF(sales_check ='0' AND purchase_order_check ='0' AND production_order_check ='0' AND stock_check ='0' AND product_document_check ='0' AND bom_check ='0' AND sales_status_check ='1', '1',
                    IF(sales_check ='0' AND purchase_order_check ='0' AND production_order_check ='0' AND stock_check ='0' AND product_document_check ='0' AND bom_check ='0' AND sales_status_check ='0', '0',
                    IF((sales_check !='0' OR purchase_order_check !='0' OR production_order_check !='0' OR stock_check !='0' OR product_document_check !='0' OR bom_check !='0') AND sum_of_sub_checks = 5,'1',
                    IF((sales_check !='0' OR purchase_order_check !='0' OR production_order_check !='0' OR stock_check !='0' OR product_document_check !='0' OR bom_check !='0') AND sum_of_sub_checks < 5,'1',
                    '1'))))))))
      - column: message
        expression: IF(cast(material_code as int) < 3000 or cast(material_code as int) > 9999999,'',
                    IF((material_code_plant IS NULL OR material_code_plant = ''), 'Not extended on Plant Level',
                    IF(plant_status_check ='1', 'Active material - Used for planning',
                    IF(creation_date_check = '1', 'Active material - Newly Created/Extended',
                    IF(sales_check ='0' AND purchase_order_check ='0' AND production_order_check ='0' AND stock_check ='0' AND product_document_check ='0' AND bom_check ='0' AND sales_status_check ='1','Inactive material - Missing Sales and/or Plant Block',
                    IF(sales_check ='0' AND purchase_order_check ='0' AND production_order_check ='0' AND stock_check ='0' AND product_document_check ='0' AND bom_check ='0' AND sales_status_check ='0', 'Inactive material',
                    IF((sales_check !='0' OR purchase_order_check !='0' OR production_order_check !='0' OR stock_check !='0' OR product_document_check !='0' OR bom_check !='0') AND sum_of_sub_checks < 6, 'Candidate for blocking', 
                    'Active material')))))))

  - kind: add
    name: add_message
    params:
      - column: message_sales_check
        expression: IF(sales_check ='0', 'sales_check', null)
      - column: message_purchase_order_check
        expression: IF(purchase_order_check ='0', 'purchase_order_check', null)
      - column: message_production_order_check
        expression: IF(production_order_check ='0', 'production_order_check', null)
      - column: message_stock_check
        expression: IF(stock_check ='0', 'stock_check', null)
      - column: message_product_document_check
        expression: IF(product_document_check ='0', 'product_document_check', null)
      - column: message_bom_check
        expression: IF(bom_check ='0', 'bom_check', null)
        
  - kind: add
    name: add_final_output_message
    params:
      - column: output_message
        expression: IF(message = 'Candidate for blocking', concat('Candidate for blocking - conditions met excl. ', concat_ws(', ', message_sales_check,message_purchase_order_check,message_production_order_check,message_stock_check, message_product_document_check, message_bom_check)), message)



#final columns
  - kind: add
    name: add_columns
    params:
      - column: rule_code
        expression: '''RPACTI_1'''
      - column: sales_quantity_cy_flag
        expression: IF(sum_sales_quantity_cy > 0, '+X', IF(sum_sales_quantity_cy < 0, '-X', 0))
      - column: sales_quantity_py_flag
