        material_code: material_code
        country_code: country_code
        sap_cluster: sap_cluster
        sum_sales_quantity_cy: sum_sales_quantity_cy
        sum_sales_quantity_py: sum_sales_quantity_py
        sum_sales_quantity_ppy: sum_sales_quantity_ppy
        sales_check: sales_check
        stock_batch_array: stock_batch_array
        sum_stock_in_transit_quantity: sum_stock_in_transit_quantity
        sum_stock_in_transfer_quantity: sum_stock_in_transfer_quantity
        sum_stock_unrestricted_quantity: sum_stock_unrestricted_quantity
        sum_stock_blocked_quantity: sum_stock_blocked_quantity
        sum_stock_quality_inspection_quantity: sum_stock_quality_inspection_quantity
        max_stock_vendor_flag: max_stock_vendor_flag
