        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: customer
      object_name: kna1

  - kind: filter
    name: filter_kna1
    params:
      - condition:
          ( nodel <> 'X' and loevm <> 'X' AND (ktokd like '7%' OR ktokd like '9%') and aufsd not in ('S', 'NH', 'S3', 'S4', 'SY', 'U', 'R'))

  - kind: add
    name: add_kunnr_short
    params:
      - column: kunnr_short
        expression: substring(kunnr, 1, 2)

  - kind: select
    name: select_kna1
    params:
      columns:
        kunnr: kunnr
        kunnr_short: kunnr_short
        aufsd: aufsd
        land1: land1
        adrnr: adrnr
        name1: name1
        name2: name2
        name3: name3
        name4: name4
        ktokd: ktokd
        katr1: katr1
        katr6: katr6
        katr7: katr7
        katr4: katr4
        kukla: kukla
