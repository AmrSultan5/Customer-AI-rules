        expression: IF(isnull(zw2_cmdemand_bran1_a9), '0', '1')

  - kind: add
    name: add_dm_customer_general__taxs
    params:
      - column: taxtype_falg_0
        expression: "CASE WHEN (taxtype_0 is null) THEN '0'  WHEN (land1 = substring_taxtype_0) THEN '1' ELSE '10' END"
      - column: taxtype_falg_1
        expression: "CASE WHEN (taxtype_1 is null) THEN '0'  WHEN (land1 = substring_taxtype_1) THEN '1' ELSE '10' END"
      - column: taxtype_falg_2
        expression: "CASE WHEN (taxtype_2 is null) THEN '0'  WHEN (land1 = substring_taxtype_2) THEN '1' ELSE '10' END"
      - column: taxtype_falg_3
        expression: "CASE WHEN (taxtype_3 is null) THEN '0'  WHEN (land1 = substring_taxtype_3) THEN '1' ELSE '10' END"
      - column: taxtype_falg_4
        expression: "CASE WHEN (taxtype_4 is null) THEN '0'  WHEN (land1 = substring_taxtype_4) THEN '1' ELSE '10' END"
      - column: taxtype_falg_5
        expression: "CASE WHEN (taxtype_5 is null) THEN '0'  WHEN (land1 = substring_taxtype_5) THEN '1' ELSE '10' END"
      - column: taxtype_falg_6
        expression: "CASE WHEN (taxtype_6 is null) THEN '0'  WHEN (land1 = substring_taxtype_6) THEN '1' ELSE '10' END"

  - kind: add
    name: add_dm_customer_general__taxs
    params:
      - column: taxtype_falg_sum
        expression: taxtype_falg_0 + taxtype_falg_1 + taxtype_falg_2 + taxtype_falg_3 + taxtype_falg_4 + taxtype_falg_5 + taxtype_falg_6


  - kind: group
    name: group_tax
    params:
      - aggs:
          kunnr: count
          str_suppl3_adrc: max
          location_adrc: max
