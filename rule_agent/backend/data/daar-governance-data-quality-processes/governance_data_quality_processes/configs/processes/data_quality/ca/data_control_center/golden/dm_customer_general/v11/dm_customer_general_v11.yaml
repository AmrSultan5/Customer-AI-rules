        - kunnr
        - sap_cluster

  - kind: join
    name: join_group_tax_add_tax
    context_name: add_dm_customer_general__taxs
    params:
      - other:
          group_tax
        how:
          left
        columns:
          kunnr: kunnr
          sap_cluster: sap_cluster

  - kind: add
    name: add_true
    params:
      - column: taxtype_falg_true
        expression: "CASE WHEN taxtype_falg_sum < 10 THEN TRUE WHEN land1 = substring_taxtype_0 THEN TRUE WHEN land1 = substring_taxtype_1 THEN TRUE WHEN land1 = substring_taxtype_2 THEN TRUE WHEN land1 = substring_taxtype_3 THEN TRUE WHEN land1 = substring_taxtype_4 THEN TRUE WHEN land1 = substring_taxtype_5 THEN TRUE WHEN land1 = substring_taxtype_6 THEN TRUE ELSE FALSE END"

#Add legal_name and name_above_door and customer visits flag
  - kind: add
    name: add_new_fields
    params:
      - column: legal_name
        expression: CASE WHEN country_code = 'IT' THEN concat(name_org1,' ',name_org2) 
                    WHEN country_code = 'RO' THEN concat(name_org1,' ',name_org3,' ',name_org4) 
                    WHEN country_code = 'CZ' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'SK' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'RS' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'ME' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'KV' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'BG' THEN name_org1 
                    WHEN country_code = 'GR' THEN name_org1 
                    WHEN country_code = 'CY' THEN name_org1 
                    WHEN country_code = 'NG' THEN name_org1 
                    WHEN country_code = 'AT' THEN name_org1 
                    WHEN country_code = 'HR' THEN name_org1 
                    WHEN country_code = 'BA' THEN name_org1 
                    WHEN country_code = 'SI' THEN name_org1 
                    WHEN country_code = 'MK' THEN name_org2 
                    WHEN country_code = 'UA' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc,' ',name_org3) 
                    WHEN country_code = 'AM' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'MD' THEN name_org1 
                    WHEN country_code = 'EG' THEN name_org1 
                    WHEN country_code = 'HU' THEN name_org2 
                    WHEN country_code = 'CH' THEN name_org1 
                    WHEN country_code = 'IE' THEN name_org3 
                    WHEN country_code = 'GB' THEN name_org3 
                    WHEN country_code = 'PL' THEN concat(max_str_suppl3_adrc,' ',max_location_adrc)
                    WHEN country_code = 'EE' THEN name_org1 
                    WHEN country_code = 'LT' THEN name_org1 
                    WHEN country_code = 'LV' THEN name_org1 ELSE '-1' END
      - column: name_above_door
        expression: CASE WHEN country_code = 'IT' THEN name_org2 
                    WHEN country_code = 'RO' THEN name_org2 
                    WHEN country_code = 'CZ' THEN concat(name_org1,' ',name_org2) 
                    WHEN country_code = 'SK' THEN concat(name_org1,' ',name_org2) 
                    WHEN country_code = 'RS' THEN concat(name_org1,' ',name_org2)
                    WHEN country_code = 'ME' THEN concat(name_org1,' ',name_org2)
                    WHEN country_code = 'KV' THEN concat(name_org1,' ',name_org2)
                    WHEN country_code = 'BG' THEN name_org2 
                    WHEN country_code = 'GR' THEN name_org2 
                    WHEN country_code = 'CY' THEN name_org2 
                    WHEN country_code = 'NG' THEN name_org2 
                    WHEN country_code = 'AT' THEN name_org2 
                    WHEN country_code = 'HR' THEN name_org2 
                    WHEN country_code = 'BA' THEN name_org2 
                    WHEN country_code = 'SI' THEN name_org2 
                    WHEN country_code = 'MK' THEN name_org1 
                    WHEN country_code = 'UA' THEN name_org2 
                    WHEN country_code = 'AM' THEN concat(name_org1,' ',name_org2) 
                    WHEN country_code = 'MD' THEN name_org2 
                    WHEN country_code = 'EG' THEN name_org2 
                    WHEN country_code = 'HU' THEN name_org1 
                    WHEN country_code = 'CH' THEN name_org2 
                    WHEN country_code = 'IE' THEN name_org1 
                    WHEN country_code = 'GB' THEN name_org1 
                    WHEN country_code = 'PL' THEN concat(name_org1,' ',name_org2) 
                    WHEN country_code = 'EE' THEN name_org2 
                    WHEN country_code = 'LT' THEN name_org2 
                    WHEN country_code = 'LV' THEN name_org2 ELSE '-1' END
      - column: customer_visits_flag
        expression: CASE 
                    WHEN count_crm_activities_visit = 1 and aufsd in('WH', 'I', 'CW', 'PR', 'S1', 'C', 'DR', 'F', 'TS', '') THEN '2'
                    WHEN count_crm_activities_visit > 1 and aufsd in('WH', 'I', 'CW', 'PR', 'S1', 'C', 'DR', 'F', 'TS', '') THEN '3'
                    ELSE '0' END

