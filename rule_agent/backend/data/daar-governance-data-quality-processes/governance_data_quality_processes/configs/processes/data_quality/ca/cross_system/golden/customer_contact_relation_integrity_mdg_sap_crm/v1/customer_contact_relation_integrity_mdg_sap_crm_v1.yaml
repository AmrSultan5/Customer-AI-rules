                          WHEN 'E14' THEN 'RS'
                          WHEN 'E21' THEN 'SI'
                          WHEN 'E19' THEN 'SK'
                          WHEN 'E22' THEN 'UA'
                          ELSE NULL
                        END
                        WHEN initials_mdg_but051 = 5 THEN 
                          CASE SUBSTRING(partner1_mdg_but051, 1, 5)
                            WHEN '00096' THEN 'AM'
                            WHEN '00012' THEN 'AT'
                            WHEN '00028' THEN 'BA'
                            WHEN '00013' THEN 'BG'
