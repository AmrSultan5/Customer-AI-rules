#######################################################



  - kind: filter
    name: filter_d365_accounts_filtered
    context_name: select_d365_account
    params:
      - condition:
          d_partner like any('00027%', '27%', 'P55%', 'E27%', '00032%', '32%', 'P32%', 'E32%', 
                            '00035%', '35%', 'P79%', 'E35%', '00034%', '34%', 'P78%', 'E34%', 
                            '00042%', '42%', 'P92%', 'E42%', '00033%', '33%', 'P33%', 'E33%', 
                            '00031%', '31%', 'P31%', 'E31%', '00015%', '15%', 'P82%', 'E15%', 
                            '00014%', '14%', 'P25%', 'E14%', '00040%', '40%', 'P51%', 'E40%', 
                            '00018%', '18%', 'P45%', 'E18%', '00030%', '30%', 'P12%', 'E30%', 
                            '00016%', '16%', 'P28%', 'E16%', '00024%', '24%', 'P61%', 'E24%', 
                            '00026%', '26%', 'P91%', 'E26%', '00019%', '19%', 'P41%', 'E19%', 
                            '00025%', '25%', 'P80%', 'E25%', '00028%', '28%', 'P86%', 'E28%', 
                            '00021%', '21%', 'P85%', 'E21%', '00012%', '12%', 'P11%', 'E12%', 
                            '00094%', '94%', 'P94%', 'E94%', '00095%', '95%', 'P95%', 'E95%', 
                            '96%', 'P96%', '00096%', 'E96%', '22%', 'P72%', '00022%', 'E22%', 
                            '13%', 'P49%', '00013%', 'E13%', '17%', 'P20%', '00017%', 'E17%')
          and (isnull(cch_orderblockall) 
          or length(cch_orderblockall) = 0 
          or cch_orderblockall not in(311220003, 311220005, 311220008, 311220011, 311220012, 
                                      311220013, 311220014, 311220015, 311220016, 311220018))

  - kind: join
    name: join_d365_roles_contacts
    context_name: filter_d365_accounts_filtered
    params:
      - other:
          select_d365_role
        how:
          inner
        columns:
          account_id: cch_accountid
      - other:
          select_d365_contact
        how:
          inner
        columns:
          cch_contactid: contact_id
      - other:
          select_d365_ag
        how:
          left
        columns:
          cch_accountgroupid: ag_id
      - other:
          partner_function_map
        how:
          left
        columns:
          cch_contactrole: pfm_cch_optionsetvalue


  - kind: add
    name: add_d365_roles_contacts
    context_name: join_d365_roles_contacts
    params:
      - column: d_account_group_code
        expression: concat(ag_cch_code, ' - ', regexp_replace(ag_cch_name, '\\s+', ' '))
      - column: initials
        expression: if(substr(d_partner, 1, 1) = 'P',3 ,
                    if(substr(d_partner, 1, 3) = '000', 5, 2))
      - column: d365_country
        expression: CASE 
                      WHEN initials = 2 THEN 
                        CASE SUBSTRING(d_partner, 1, 2)
                          WHEN '96' THEN 'AM'
                          WHEN '12' THEN 'AT'
                          WHEN '28' THEN 'BA'
                          WHEN '13' THEN 'BG'
                          WHEN '23' THEN 'BY'
                          WHEN '27' THEN 'CH'
                          WHEN '18' THEN 'CZ'
                          WHEN '32' THEN 'EE'
                          WHEN '35' THEN 'GB'
                          WHEN '30' THEN 'GR'
                          WHEN '25' THEN 'HR'
                          WHEN '16' THEN 'HU'
                          WHEN '34' THEN 'IE'
                          WHEN '29' THEN 'IT'
                          WHEN '42' THEN 'KV'
                          WHEN '33' THEN 'LT'
                          WHEN '31' THEN 'LV'
                          WHEN '17' THEN 'MD'
                          WHEN '15' THEN 'ME'
                          WHEN '95' THEN 'MK'
                          WHEN '94' THEN 'NG'
                          WHEN '24' THEN 'PL'
                          WHEN '26' THEN 'RO'
                          WHEN '38' THEN 'RU'
                          WHEN '21' THEN 'SI'
                          WHEN '19' THEN 'SK'
                          WHEN '14' THEN 'RS'
                          WHEN '22' THEN 'UA'
                          WHEN '40' THEN 'CY'
                          WHEN '47' THEN 'EG'
                          ELSE NULL
                        END
                      WHEN initials = 3 THEN 
                        CASE SUBSTRING(d_partner, 1, 3)
                          WHEN 'P96' THEN 'AM'
                          WHEN 'P11' THEN 'AT'
                          WHEN 'P86' THEN 'BA'
                          WHEN 'P49' THEN 'BG'
                          WHEN 'P23' THEN 'BY'
                          WHEN 'P55' THEN 'CH'
                          WHEN 'P51' THEN 'CY'
                          WHEN 'P45' THEN 'CZ'
                          WHEN 'P32' THEN 'EE'
                          WHEN 'P79' THEN 'GB'
                          WHEN 'P12' THEN 'GR'
                          WHEN 'P80' THEN 'HR'
                          WHEN 'P28' THEN 'HU'
                          WHEN 'P78' THEN 'IE'
                          WHEN 'P63' THEN 'IT'
                          WHEN 'P92' THEN 'KV'
                          WHEN 'P33' THEN 'LT'
                          WHEN 'P31' THEN 'LV'
                          WHEN 'P20' THEN 'MD'
                          WHEN 'P82' THEN 'ME'
                          WHEN 'P95' THEN 'MK'
                          WHEN 'P94' THEN 'NG'
                          WHEN 'P61' THEN 'PL'
                          WHEN 'P91' THEN 'RO'
                          WHEN 'P25' THEN 'RS'
                          WHEN 'P85' THEN 'SI'
                          WHEN 'P41' THEN 'SK'
                          WHEN 'P72' THEN 'UA'
                          WHEN 'P47' THEN 'EG'
                          WHEN 'E96' THEN 'AM'
                          WHEN 'E12' THEN 'AT'
                          WHEN 'E28' THEN 'BA'
                          WHEN 'E13' THEN 'BG'
                          WHEN 'E23' THEN 'BY'
                          WHEN 'E27' THEN 'CH'
                          WHEN 'E40' THEN 'CY'
                          WHEN 'E18' THEN 'CZ'
                          WHEN 'E32' THEN 'EE'
                          WHEN 'E47' THEN 'EG'
                          WHEN 'E35' THEN 'GB'
                          WHEN 'E30' THEN 'GR'
                          WHEN 'E25' THEN 'HR'
                          WHEN 'E16' THEN 'HU'
                          WHEN 'E34' THEN 'IE'
                          WHEN 'E29' THEN 'IT'
                          WHEN 'E42' THEN 'KV'
                          WHEN 'E33' THEN 'LT'
                          WHEN 'E31' THEN 'LV'
                          WHEN 'E17' THEN 'MD'
                          WHEN 'E15' THEN 'ME'
                          WHEN 'E95' THEN 'MK'
                          WHEN 'E94' THEN 'NG'
                          WHEN 'E24' THEN 'PL'
                          WHEN 'E26' THEN 'RO'
                          WHEN 'E14' THEN 'RS'
                          WHEN 'E21' THEN 'SI'
                          WHEN 'E19' THEN 'SK'
                          WHEN 'E22' THEN 'UA'
                          ELSE NULL
                        END
                        WHEN initials = 5 THEN 
                          CASE SUBSTRING(d_partner, 1, 5)
                            WHEN '00096' THEN 'AM'
                            WHEN '00012' THEN 'AT'
                            WHEN '00028' THEN 'BA'
                            WHEN '00013' THEN 'BG'
                            WHEN '00023' THEN 'BY'
                            WHEN '00027' THEN 'CH'
                            WHEN '00018' THEN 'CZ'
                            WHEN '00032' THEN 'EE'
                            WHEN '00035' THEN 'GB'
                            WHEN '00030' THEN 'GR'
                            WHEN '00025' THEN 'HR'
                            WHEN '00016' THEN 'HU'
                            WHEN '00034' THEN 'IE'
                            WHEN '00029' THEN 'IT'
                            WHEN '00042' THEN 'KV'
                            WHEN '00033' THEN 'LT'
                            WHEN '00031' THEN 'LV'
                            WHEN '00017' THEN 'MD'
                            WHEN '00015' THEN 'ME'
                            WHEN '00095' THEN 'MK'
                            WHEN '00094' THEN 'NG'
                            WHEN '00024' THEN 'PL'
                            WHEN '00026' THEN 'RO'
                            WHEN '00038' THEN 'RU'
                            WHEN '00021' THEN 'SI'
                            WHEN '00019' THEN 'SK'
                            WHEN '00014' THEN 'RS'
                            WHEN '00022' THEN 'UA'
                            WHEN '00040' THEN 'CY'
                            WHEN '00047' THEN 'EG'
                            ELSE NULL
                          END
                    END
      - column: name_last
        expression: lower(regexp_replace(regexp_replace(lastname, '\\n', ' '), '\\r', ' '))
      - column: name_first
        expression: lower(regexp_replace(regexp_replace(firstname, '\\n', ' '), '\\r', ' '))
      - column: d365_pk
        expression: concat(d_partner, '_', lower(replace(guid, '-', '')))
      - column: partner_function
        expression: CAST(cch_contactrole AS string)
      - column: partner_function_description
        expression: pfm_cch_externalvalue

