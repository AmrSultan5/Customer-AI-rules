transform:
  name: dm_product_check_results_activity
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#read dm_bill_of_material
# Read STPO

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_stpo
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: stpo
 
  - kind: filter
    name: filter_stpo
    params:
      - condition:
          stlty = 'M'

  - kind: select
    name: select_stpo
    params:
      columns:
        stlty: stpo_stlty
        stlnr: stpo_stlnr
        stlkn: stpo_stlkn
        idnrk: stpo_idnrk
        lkenz: stpo_lkenz
        sanka: stpo_sanka
        aedat: stpo_aedat
        menge: stpo_menge
        verti: stpo_verti
        datuv: stpo_datuv
        sap_cluster: stpo_sap_cluster


# Read STKO

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_stko
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: stko

  - kind: select
    name: select_stko
    params:
      columns:
        stlty: stko_stlty
        stlnr: stko_stlnr
        stlst: stko_stlst
        stkoz: stko_stkoz
        loekz: stko_loekz
        lkenz: stko_lkenz
        sap_cluster: stko_sap_cluster

  - kind: group
    name: grouped_stko
    context_name: read_stko
    params:
      - aggs:
          stkoz: max
        by:
        - stlnr
        - stlty
        - sap_cluster


  - kind: join
    name: join_grp_read
    context_name: select_stko
    params:
      - other:
          grouped_stko
        how:
          inner
        columns:
          stko_stlnr: stlnr
          stko_stlty: stlty
          stko_sap_cluster: sap_cluster
          stko_stkoz: max_stkoz


  - kind: select
    name: select_stko_fin
    params:
      columns:
        stko_stlty: sk_stlty
        stko_stlnr: sk_stlnr
        stko_stlst: sk_stlst
        max_stkoz: sk_stkoz
        stko_loekz: sk_loekz
        stko_lkenz: sk_lkenz
        stko_sap_cluster: sk_sap_cluster
      distinct: true

# Read MAST

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_mast
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: material_master
      object_name: mast

  - kind: add
    name: add_mast_werks_substr
    params:
      - column: mast_werks_substr
        expression: substring(werks,0,2)      

  - kind: select
    name: select_mast
    params:
      columns:
        mast_werks_substr: mast_werks_substr
        stlnr: mast_stlnr
        stlal: mast_stlal
        matnr: mast_matnr
        werks: mast_werks
        stlan: mast_stlan
        andat: mast_andat
        sap_cluster: mast_sap_cluster

# Read STAS

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_stas
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: stas

  - kind: group
    name: grouped_stas
    params:
      - aggs:
          stasz: max
        by:
        - stlnr
        - stlty
        - stlkn
        - stlal
        - sap_cluster

  - kind: select
    name: select_grouped_stas
    params:
      columns:
        stlnr: agg_stas_stlnr
        stlty: agg_stas_stlty
        stlkn: agg_stas_stlkn
        stlal: agg_stas_stlal
        sap_cluster: agg_stas_sap_cluster
        max_stasz: agg_stas_max_stasz           

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_stas
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: stas

  - kind: select
    name: select_stas
    params:
      columns:
        stlnr: stas_stlnr
        stlal: stas_stlal
        stlkn: stas_stlkn
        stlty: stas_stlty
        datuv: stas_datuv
        stasz: stas_stasz
        andat: stas_andat
        lkenz: stas_lkenz
        sap_cluster: stas_sap_cluster


# Read plant_code_mapping

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_plant_code_mapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: plant_code_mapping

  - kind: select
    name: select_pcm
    params:
      columns:
        plant_code_short: pcm_plant_code_short
        country_code: pcm_country_code
        sap_cluster: pcm_sap_cluster

  - kind: join
    name: join_ms_sp_st_pcm
    context_name: select_stpo
    params:
      - other:
          select_mast
        how:
          inner
        columns:
          stpo_stlnr: mast_stlnr
          stpo_sap_cluster: mast_sap_cluster
      - other:
          select_stas
        how:
          inner
        columns:
          stpo_stlnr: stas_stlnr
          mast_stlal: stas_stlal 
          stpo_stlkn: stas_stlkn  
          stpo_stlty: stas_stlty                             
          stpo_sap_cluster: stas_sap_cluster
      - other:
          select_grouped_stas
        how:
          inner
        columns:
          stas_stlnr: agg_stas_stlnr
          stas_stlal: agg_stas_stlal 
          stas_stlkn: agg_stas_stlkn  
          stas_stlty: agg_stas_stlty                             
          stas_sap_cluster: agg_stas_sap_cluster
          stas_stasz: agg_stas_max_stasz  
      - other:
          select_stko_fin
        how:
          inner
        columns:
          stpo_stlnr: sk_stlnr
          stpo_stlty: sk_stlty
          stpo_sap_cluster: sk_sap_cluster      
      - other:
          select_pcm
        how:
          inner
        columns:
          mast_werks_substr: pcm_plant_code_short
          mast_sap_cluster: pcm_sap_cluster

  - kind: select
    name: select_final
    params:
      columns:
        mast_matnr: material_code
        mast_werks: plant_code
        pcm_country_code: country_code        
        mast_stlan: bom_usage
        mast_stlal: bom_alternative
        mast_andat: bom_link_created_when
        mast_stlnr: bom_number
        stpo_idnrk: bom_component_material_number
        stpo_stlkn: bom_item_number
        stpo_lkenz: bom_item_deletion_flag
        stpo_sanka: costing_relevant_flag
        stpo_aedat: bom_item_last_change_date
        stpo_menge: component_quantity
        stpo_verti: distribution_key_code
        stpo_stlty: component_category
        stpo_datuv: bom_item_valid_from
        stas_datuv: bom_item_link_valid_from
        stas_stasz: bom_item_link_counter
        stas_andat: bom_item_link_created_when       
        stas_lkenz: bom_item_link_deletion_flag 
        sk_stlst: bom_material_status
        sk_stkoz: bom_counter     
        mast_sap_cluster: sap_cluster
        sk_loekz: bom_deletion_flag
        sk_lkenz: bom_deletion_indicator
      distinct: true


  - kind: write_dataio
    name: write_dm_bill_of_material
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_bill_of_material
      process_run_id: "{{process_run_id}}"
      schema_version: v2
      refresh_mode: full