### PASSED

  - kind: filter
    name: filter_flags_passed
    params:
      - condition:
          batch_status == 'passed'

  - kind: group
    name: group_batch_number_passed
    params:
      - aggs:
          batch_number: collect_list
        by:
        -  material_code
        -  plant_code
        -  sap_cluster

  - kind: add
    name: add_sales_batch_number_array_passed
    params:
      - column: batch_number_array_passed
        expression: sort_array(collect_list_batch_number)

  - kind: add
    name: add_batch_passed
    context_name: add_sales_batch_number_array_passed
    params:
      - column: batch_number_concat_ws_passed
        expression: concat_ws(',', batch_number_array_passed)

### FAILED 
  - kind: filter
    name: filter_flags_failed
    context_name: select_batch_status
    params:
      - condition:
          batch_status == 'failed'

  - kind: group
    name: group_batch_number_failed
    params:
      - aggs:
          batch_number: collect_list
        by:
        -  material_code
        -  plant_code
        -  sap_cluster

  - kind: add
    name: add_sales_batch_number_array_failed
    params:
      - column: batch_number_array_failed
        expression: sort_array(collect_list_batch_number)

  - kind: add
    name: add_batch_failed
    context_name: add_sales_batch_number_array_failed
    params:
      - column: batch_number_concat_ws_failed
        expression: concat_ws(',', batch_number_array_failed)

