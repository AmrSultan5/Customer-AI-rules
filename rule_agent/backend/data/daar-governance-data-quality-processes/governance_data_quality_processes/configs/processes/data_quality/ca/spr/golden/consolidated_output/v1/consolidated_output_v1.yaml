        overwrite: true
      - column: plant_pet_cl1
        expression: "COALESCE(plant_pet_cl1, 0)"
        overwrite: true
      - column: preform_additive_cl1
        expression: "COALESCE(preform_additive_cl1, 0)"
        overwrite: true
      - column: recycle_content_cl2
        expression: "COALESCE((CASE WHEN (recycle_content_cl2 IS NULL OR recycle_content_cl2 = '') THEN '0' WHEN recycle_content_cl2 LIKE '%%' THEN REPLACE(recycle_content_cl2, '%', '') ELSE recycle_content_cl2 END), 0)"
        overwrite: true
      - column: rpet_chips_cl2
        expression: "COALESCE((CASE WHEN (rpet_chips_cl2 IS NULL OR rpet_chips_cl2 = '') THEN '0' WHEN rpet_chips_cl2 LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_cl2 LIKE '%%' THEN REPLACE(rpet_chips_cl2, '%', '') ELSE rpet_chips_cl2 END), 0)"
