# PREPARATION WEIGHT COLUMNS

  - kind: add
    name: add_weights
    params:
     - column: material_code
       expression: LTRIM('0', material_code)
       overwrite: true
     - column: net_weight
       expression: "CASE WHEN rule_name = 'Material Group Weight' THEN net_weight ELSE '' END"
       overwrite: true
     - column: gross_weight
       expression: "CASE WHEN rule_name = 'Material Group Weight' THEN gross_weight ELSE '' END"
       overwrite: true
     - column: material_description_weight
       expression: "CASE WHEN rule_name = 'Material Group Weight' THEN material_description_weight ELSE '' END"
       overwrite: true
     - column: mix_ratio
       expression: "CASE WHEN rule_name = 'Recycle Content Mix' THEN mix_ratio ELSE '' END"
       overwrite: true
     - column: quality_rule
       expression: "CONCAT(rule_name, ' ', quality_category)"
       overwrite: true
     - column: dq_message_output
       expression: "IF(length(dq_message_output)<4001, dq_message_output, substr(dq_message_output,1,4000))"
       overwrite: true

