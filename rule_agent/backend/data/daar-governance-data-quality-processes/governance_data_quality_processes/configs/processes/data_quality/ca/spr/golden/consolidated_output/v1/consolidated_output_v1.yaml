  - kind: add
    name: add_aggregated
    context_name: select_finall
    params:
     - column: total_checks
       expression: IF(dq_flag_output != '', 1, NULL)
     - column: invalid_checks
       expression: IF(dq_flag_output   = '0', 1, NULL)

  - kind: group
    name: group_sales_general
    context_name: add_aggregated
    params:
      - aggs:
          total_checks: count
          invalid_checks: count
        by:
        - record_type
        - quality_category
        - quality_rule
        - rule_name
        - sap_cluster

  - kind: add
    name: add_sales_general_country
