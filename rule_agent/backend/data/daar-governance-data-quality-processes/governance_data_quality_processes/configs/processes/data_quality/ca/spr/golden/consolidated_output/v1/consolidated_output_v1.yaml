###

  - kind: add
    name: add_consistency_flag_cl1_cl2
    context_name: add_internal_vendor_pi_t2
    params:
      - column: consistency_flag_cl1_cl2
        expression: "CASE WHEN (recycle_content = 'R' AND COALESCE(recycle_content_cl1, '') != COALESCE(recycle_content_cl2, '')) OR 
                    (shape = 'R' AND COALESCE(shape_cl1, '') != COALESCE(shape_cl2, '')) OR
                    (weight = 'R' AND COALESCE(weight_cl1, '') != COALESCE(weight_cl2, '')) OR 
                    (colour = 'R' AND COALESCE(colour_cl1, '') != COALESCE(colour_cl2, '')) OR  
                    (plant_pet = 'R' AND COALESCE(plant_pet_cl1, '') != COALESCE(plant_pet_cl2, '')) OR 
                    (preform_additive = 'R' AND COALESCE(preform_additive_cl1, '') != COALESCE(preform_additive_cl2, '')) OR  
                    (rpet_chips = 'R' AND COALESCE(rpet_chips_cl1, '') != COALESCE(rpet_chips_cl2, '')) OR 
                    (rpet_flake = 'R' AND COALESCE(rpet_flake_cl1, '') != COALESCE(rpet_flake_cl2, '')) OR  
                    (rpet_meltin = 'R' AND COALESCE(rpet_meltin_cl1, '') != COALESCE(rpet_meltin_cl2, '')) OR 
                    (virgin = 'R' AND COALESCE(virgin_cl1, '') != COALESCE(virgin_cl2, '')) OR 
                    (resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_cl1, '') != COALESCE(resin_recycle_type_cl2, '')) OR 
                    (co2 = 'R' AND COALESCE(co2_cl1, '') != COALESCE(co2_cl2, '')) 
                    THEN '0' ELSE '1' END"
      - column: consistency_list_long_cl1_cl2
        expression: CONCAT(if(recycle_content = 'R' AND (COALESCE(recycle_content_cl1, '') != COALESCE(recycle_content_cl2, '')), 'RECYCLE_CONTENT,', ''),
                           if(shape = 'R' AND (COALESCE(shape_cl1, '') != COALESCE(shape_cl2, '')), 'SHAPE,', ''),
                           if(weight = 'R' AND (COALESCE(weight_cl1, '') != COALESCE(weight_cl2, '')), 'WEIGHT,', ''),
                           if(colour = 'R' AND (COALESCE(colour_cl1, '') != COALESCE(colour_cl2, '')), 'COLOUR,', ''),
                           if(plant_pet = 'R' AND (COALESCE(plant_pet_cl1, '') != COALESCE(plant_pet_cl2, '')), 'PLANT_PET,', ''),
                           if(preform_additive = 'R' AND (COALESCE(preform_additive_cl1, '') != COALESCE(preform_additive_cl2, '')), 'PREFORM_ADDITIVE,', ''),
                           if(rpet_chips = 'R' AND (COALESCE(rpet_chips_cl1, '') != COALESCE(rpet_chips_cl2, '')), 'RPET_CHIPS,', ''),
                           if(rpet_flake = 'R' AND (COALESCE(rpet_flake_cl1, '') != COALESCE(rpet_flake_cl2, '')), 'RPET_FLAKE,', ''),
                           if(rpet_meltin = 'R' AND (COALESCE(rpet_meltin_cl1, '') != COALESCE(rpet_meltin_cl2, '')), 'RPET_MELTIN,', ''),
                           if(virgin = 'R' AND (COALESCE(virgin_cl1, '') != COALESCE(virgin_cl2, '')), 'VIRGIN,', ''),
                           if(resin_recycle_type = 'R' AND (COALESCE(resin_recycle_type_cl1, '') != COALESCE(resin_recycle_type_cl2, '')), 'RESIN_RECYCLE_TYPE,', ''),
                           if(co2 = 'R' AND (COALESCE(co2_cl1, '') != COALESCE(co2_cl2, '')), 'CO2,', ''))

  - kind: add
    name: add_columns
    params:
      - column: class_attribute_value_consistency_list
        expression: substr(consistency_list_long_cl1_cl2, 1, length(consistency_list_long_cl1_cl2) - 1)
      - column: material_status
        expression: IF(sum_material_status_code_99 = count_material_status_code_mp, 'Fully Blocked', '')
      - column: record_type
        expression: '''Locally Procured Material'''
      - column: net_weight
        expression: IF(net_weight_ma < 1, 1000 * net_weight_ma, net_weight_ma)
      - column: gross_weight
        expression: IF(gross_weight_ma < 1, 1000 * gross_weight_ma, gross_weight_ma)
      - column: weight_cast
        expression: "CASE WHEN weight_mc < 1 THEN CAST(weight_mc AS DECIMAL(13,3)) * 100 ELSE CAST(weight_mc AS DECIMAL(13,3)) END"
      - column: mix_ratio
        expression: CAST(rpet_chips_mc AS FLOAT) + CAST(rpet_flake_mc AS FLOAT) + CAST(rpet_meltin_mc AS FLOAT)

  - kind: add
    name: add_columns
    params:
      - column: class_group_completeness_flag
        expression: IF(material_status = 'Fully Blocked', '', 
                    IF(product_class_name_pc IS NULL OR product_class_name_pc = '', '0', '1'))
                    
  - kind: add
    name: add_columns
    params:
      - column: class_group_accuracy_flag
        expression: IF(material_status = 'Fully Blocked' OR class_group_completeness_flag = '0', '', 
                    IF(product_class_name_pc = 'SPR_MM', '1', '0'))
      - column: core_material_accuracy_flag
        expression: IF(material_status = 'Fully Blocked', '', 
                    IF((material_group_code_ma = '1003005' AND core_material_mc IN ('CAN_B', 'CAN B')) OR
                       (material_group_code_ma = '1003009' AND core_material_mc = 'BTL_RGB') OR
                       (material_group_code_ma = '1003010' AND core_material_mc = 'BTL_NRG') OR 
                       (material_group_code_ma = '1003011' AND core_material_mc = 'RESIN') OR 
                       (material_group_code_ma = '1003012' AND core_material_mc IN ('PREF_MONO', 'PREF_MULT')) OR 
                       (material_group_code_ma = '1003014' AND core_material_mc = 'CAN_E') OR
                       (material_group_code_ma = '1004009' AND core_material_mc = 'CARDBOARD') OR
                       (material_group_code_ma IN ('1004002','1004003') AND core_material_mc = 'SHRINK_FILM') OR
                       (material_group_code_ma = '1004005' AND core_material_mc = 'STRETCH_FILM'), '1', '0'))
      - column: class_attribute_value_consistency_flag
        expression: IF(material_type_code_ma = 'ZEM', '', 
                    IF(consistency_flag_cl1_cl2 = '1', '1', '0'))
      - column: material_name_accuracy_flag
        expression: IF(material_status = 'Fully Blocked', '',
                    IF(((material_name_ma LIKE 'CAN_B%' OR material_name_ma LIKE 'CAN BODY%') AND material_group_code_ma = '1003005') OR
                       ((material_name_ma LIKE 'BTL_NRG%' OR material_name_ma LIKE 'BOTTLE NRG%' OR material_name_ma LIKE 'BTL NRG%') AND material_group_code_ma = '1003010') OR
                       (material_name_ma LIKE 'RESIN%' AND material_group_code_ma = '1003011') OR
                       ((material_name_ma LIKE 'PREF_MONO%' OR material_name_ma LIKE 'PREF_MULT%' OR material_name_ma LIKE 'PREFORM%') AND material_group_code_ma = '1003012') OR
                       ((material_name_ma LIKE 'CAN_E%' OR material_name_ma LIKE 'CAN END%') AND material_group_code_ma = '1003014') OR
                       ((material_name_ma LIKE 'BTL_RGB%' OR material_name_ma LIKE 'BTL RGB%' OR material_name_ma LIKE 'BTL_RPT%' OR material_name_ma LIKE 'BOTTLES RPT%' OR material_name_ma LIKE '%RET%') AND material_group_code_ma = '1003009') OR
                       ((material_name_ma like 'SHRF%' OR material_name_ma like 'SHRINK%') AND material_group_code_ma IN ('1004002','1004003')) OR
                       ((material_name_ma like 'TRAY%' OR material_name_ma like 'CTN%' OR material_name_ma like 'PAD%' OR material_name_ma like 'CLIP%' OR material_name_ma like 'KEELCLIP%' OR material_name_ma like 'CARTON%') AND material_group_code_ma = '1004009') OR
                       (material_name_ma like 'STRETCH%' AND material_group_code_ma = '1004005'), '1',
                    IF(material_name_ma NOT LIKE 'BTL_NRG%' AND material_name_ma NOT LIKE 'BOTTLE NRG%' AND material_name_ma NOT LIKE 'BTL NRG%' AND material_name_ma NOT LIKE 'RESIN%' AND material_name_ma NOT LIKE 'PREF_MONO%' AND material_name_ma NOT LIKE 'PREF_MULT%' AND material_name_ma NOT LIKE 'PREFORM%' AND material_name_ma NOT LIKE 'CAN_E%' AND material_name_ma NOT LIKE 'CAN END%' AND material_name_ma NOT LIKE 'BTL_RGB%' AND material_name_ma NOT LIKE 'BTL RGB%' AND material_name_ma NOT LIKE 'BTL_RPT%' AND material_name_ma NOT LIKE 'BOTTLES RPT%' AND material_name_ma NOT LIKE '%RET%' AND material_name_ma NOT LIKE 'SHRF%' AND material_name_ma NOT LIKE 'SHRINK%' AND material_name_ma NOT LIKE 'TRAY%' AND material_name_ma NOT LIKE 'CTN%' AND material_name_ma NOT LIKE 'PAD%' AND material_name_ma NOT LIKE 'CLIP%' AND material_name_ma NOT LIKE 'KEELCLIP%' AND material_name_ma NOT LIKE 'CARTON%' AND material_name_ma NOT LIKE 'STRETCH%', '2', '0')))
      - column: recycle_content_mix_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN  material_group_code_ma != '1003012' THEN ''
                     WHEN ((rpet_chips_mc IS NULL) OR (rpet_flake_mc IS NULL) OR (rpet_meltin_mc IS NULL) OR (recycle_content_mc IS NULL)) THEN ''
                     WHEN mix_ratio = CAST(recycle_content_mc AS float) THEN '1' 
                     ELSE '0' END"
      - column: recycle_content_rv_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN ''
                     WHEN material_group_code_ma != '1003012' THEN ''
                     WHEN recycle_content_mc IS NULL OR virgin_mc IS NULL THEN ''
                     WHEN CAST(virgin_mc AS float) + CAST(plant_pet_mc AS float) + CAST(recycle_content_mc AS float) = 100 OR 
                          CAST(plant_pet_mc AS float) + CAST(recycle_content_mc AS float) = 100 OR 
                          mix_ratio = CAST(recycle_content_mc AS float) THEN '1' 
                    ELSE '0' END"
      - column: weight_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN material_group_code_ma != '1003012' THEN ''
                     WHEN material_description_weight_ma = net_weight AND material_description_weight_ma = gross_weight AND CAST(material_description_weight_ma AS decimal(13,3)) = CAST(weight_mc AS decimal(13,3)) THEN '1' 
                     ELSE '0' END"
      - column: class_attribute_value_completeness_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN (COALESCE(core_material_mc, '') = '' OR 
                      recycle_content = 'R' AND COALESCE(recycle_content_mc, '') = '' OR
                      shape = 'R' AND COALESCE(shape_mc, '') = '' OR
                      weight = 'R' AND COALESCE(weight_mc, '') = '' OR
                      colour = 'R' AND COALESCE(colour_mc, '') = '' OR
                      plant_pet = 'R' AND COALESCE(plant_pet_mc, '') = '' OR
                      preform_additive = 'R' AND COALESCE(preform_additive_mc, '') = '' OR
                      rpet_chips = 'R' AND COALESCE(rpet_chips_mc, '') = '' OR
                      rpet_flake = 'R' AND COALESCE(rpet_flake_mc, '') = '' OR
                      rpet_meltin = 'R' AND COALESCE(rpet_meltin_mc, '') = '' OR
                      virgin = 'R' AND COALESCE(virgin_mc, '') = '' OR
                      resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_mc, '') = '' OR
                      co2 = 'R' AND COALESCE(co2_mc, '') = '') 
                     THEN '0'
                     WHEN (COALESCE(core_material_mc, '') = '' OR
                      recycle_content = 'O' AND COALESCE(recycle_content_mc, '') = '' OR
                      shape = 'O' AND COALESCE(shape_mc, '') = '' OR
                      weight = 'O' AND COALESCE(weight_mc, '') = '' OR
                      colour = 'O' AND COALESCE(colour_mc, '') = '' OR
                      plant_pet = 'O' AND COALESCE(plant_pet_mc, '') = '' OR
                      preform_additive = 'O' AND COALESCE(preform_additive_mc, '') = '' OR
                      rpet_chips = 'O' AND COALESCE(rpet_chips_mc, '') = '' OR
                      rpet_flake = 'O' AND COALESCE(rpet_flake_mc, '') = '' OR
                      rpet_meltin = 'O' AND COALESCE(rpet_meltin_mc, '') = '' OR
                      virgin = 'O' AND COALESCE(virgin_mc, '') = '' OR
                      resin_recycle_type = 'O' AND COALESCE(resin_recycle_type_mc, '') = '' OR
                      co2 = 'O' AND COALESCE(co2_mc, '') = '') 
                     THEN '2'
                     WHEN (COALESCE(core_material_mc, '') != '' OR 
                      recycle_content = 'R' AND COALESCE(recycle_content_mc, '') != '' OR
                      shape = 'R' AND COALESCE(shape_mc, '') != '' OR
                      weight = 'R' AND COALESCE(weight_mc, '') != '' OR
                      colour = 'R' AND COALESCE(colour_mc, '') != '' OR
                      plant_pet = 'R' AND COALESCE(plant_pet_mc, '') != '' OR
                      preform_additive = 'R' AND COALESCE(preform_additive_mc, '') != '' OR
                      rpet_chips = 'R' AND COALESCE(rpet_chips_mc, '') != '' OR
                      rpet_flake = 'R' AND COALESCE(rpet_flake_mc, '') != '' OR
                      rpet_meltin = 'R' AND COALESCE(rpet_meltin_mc, '') != '' OR
                      virgin = 'R' AND COALESCE(virgin_mc, '') != '' OR
                      resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_mc, '') != '' OR
                      co2 = 'R' AND COALESCE(co2_mc, '') != '') 
                    THEN '1'
                    WHEN (COALESCE(core_material_mc, '') != '' OR
                     recycle_content = 'O' AND COALESCE(recycle_content_mc, '') != '' OR
                     shape = 'O' AND COALESCE(shape_mc, '') != '' OR
                     weight = 'O' AND COALESCE(weight_mc, '') != '' OR
                     colour = 'O' AND COALESCE(colour_mc, '') != '' OR
                     plant_pet = 'O' AND COALESCE(plant_pet_mc, '') != '' OR
                     preform_additive = 'O' AND COALESCE(preform_additive_mc, '') != '' OR
                     rpet_chips = 'O' AND COALESCE(rpet_chips_mc, '') != '' OR
                     rpet_flake = 'O' AND COALESCE(rpet_flake_mc, '') != '' OR
                     rpet_meltin = 'O' AND COALESCE(rpet_meltin_mc, '') != '' OR
                     virgin = 'O' AND COALESCE(virgin_mc, '') != '' OR
                     resin_recycle_type = 'O' AND COALESCE(resin_recycle_type_mc, '') != '' OR
                     co2 = 'O' AND COALESCE(co2_mc, '') != '') 
                    THEN '3' 
                    ELSE '' END"
      - column: class_attribute_value_completeness_list
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' ELSE
                     CONCAT_WS(',',
                     CASE WHEN recycle_content = 'R' AND core_material_value = core_material_mc AND COALESCE(recycle_content_mc, '') = '' THEN 'RECYCLE_CONTENT_R' ELSE NULL END,
                     CASE WHEN shape = 'R' AND core_material_value = core_material_mc AND COALESCE(shape_mc, '') = '' THEN 'SHAPE_R' ELSE NULL END,
                     CASE WHEN weight = 'R' AND core_material_value = core_material_mc AND COALESCE(weight_mc, '') = '' THEN 'WEIGHT_R' ELSE NULL END,
                     CASE WHEN colour = 'R' AND core_material_value = core_material_mc AND COALESCE(colour_mc, '') = '' THEN 'COLOUR_R' ELSE NULL END,
                     CASE WHEN plant_pet = 'R' AND core_material_value = core_material_mc AND COALESCE(plant_pet_mc, '') = '' THEN 'PLANT_PET_R' ELSE NULL END,
                     CASE WHEN preform_additive = 'R' AND core_material_value = core_material_mc AND COALESCE(preform_additive_mc, '') = '' THEN 'PREFORM_ADDITIVE_R' ELSE NULL END,
                     CASE WHEN rpet_chips = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_chips_mc, '') = '' THEN 'RPET_CHIPS_R' ELSE NULL END,
                     CASE WHEN rpet_flake = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_flake_mc, '') = '' THEN 'RPET_FLAKE_R' ELSE NULL END,
                     CASE WHEN rpet_meltin = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_meltin_mc, '') = '' THEN 'RPET_MELTIN_R' ELSE NULL END,
                     CASE WHEN virgin = 'R' AND core_material_value = core_material_mc AND COALESCE(virgin_mc, '') = '' THEN 'VIRGIN_R' ELSE NULL END,
                     CASE WHEN resin_recycle_type = 'R' AND core_material_value = core_material_mc AND COALESCE(resin_recycle_type_mc, '') = '' THEN 'RESIN_RECYCLE_TYPE_R' ELSE NULL END,
                     CASE WHEN co2 = 'R' AND core_material_value = core_material_mc AND COALESCE(co2_mc, '') = '' THEN 'CO2_R' ELSE NULL END,
                     CASE WHEN recycle_content = 'O' AND core_material_value = core_material_mc AND COALESCE(recycle_content_mc, '') = '' THEN 'RECYCLE_CONTENT_O' ELSE NULL END,
                     CASE WHEN shape = 'O' AND core_material_value = core_material_mc AND COALESCE(shape_mc, '') = '' THEN 'SHAPE_O' ELSE NULL END,
                     CASE WHEN weight = 'O' AND core_material_value = core_material_mc AND COALESCE(weight_mc, '') = '' THEN 'WEIGHT_O' ELSE NULL END,
                     CASE WHEN colour = 'O' AND core_material_value = core_material_mc AND COALESCE(colour_mc, '') = '' THEN 'COLOUR_O' ELSE NULL END,
                     CASE WHEN plant_pet = 'O' AND core_material_value = core_material_mc AND COALESCE(plant_pet_mc, '') = '' THEN 'PLANT_PET_O' ELSE NULL END,
                     CASE WHEN preform_additive = 'O' AND core_material_value = core_material_mc AND COALESCE(preform_additive_mc, '') = '' THEN 'PREFORM_ADDITIVE_O' ELSE NULL END,
                     CASE WHEN rpet_chips = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_chips_mc, '') = '' THEN 'RPET_CHIPS_O' ELSE NULL END,
                     CASE WHEN rpet_flake = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_flake_mc, '') = '' THEN 'RPET_FLAKE_O' ELSE NULL END,
                     CASE WHEN rpet_meltin = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_meltin_mc, '') = '' THEN 'RPET_MELTIN_O' ELSE NULL END,
                     CASE WHEN virgin = 'O' AND core_material_value = core_material_mc AND COALESCE(virgin_mc, '') = '' THEN 'VIRGIN_O' ELSE NULL END,
                     CASE WHEN resin_recycle_type = 'O' AND core_material_value = core_material_mc AND COALESCE(resin_recycle_type_mc, '') = '' THEN 'RESIN_RECYCLE_TYPE_O' ELSE NULL END,
                     CASE WHEN co2 = 'O' AND core_material_value = core_material_mc AND COALESCE(co2_mc, '') = '' THEN 'CO2_O' ELSE NULL END)
                     END"
      - column: class_attribute_value_numeric_flag
        expression: "CASE WHEN material_type_code_ma = 'ZEM' THEN ''
                          WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') AND 
                               (plant_pet_mc IS NULL OR plant_pet_mc = '') AND 
                               (rpet_chips_mc IS NULL OR rpet_chips_mc = '') AND 
                               (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') AND 
                               (rpet_flake_mc IS NULL OR rpet_flake_mc = '') AND 
                               (virgin_mc IS NULL OR virgin_mc = '') 
                          THEN ''
                          WHEN TRY_CAST(recycle_content_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(plant_pet_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(rpet_chips_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(rpet_meltin_mc AS FLOAT) IS NULL OR
                               TRY_CAST(rpet_flake_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(virgin_mc AS FLOAT) IS NULL 
                          THEN '0'
                          ELSE '1'
                     END"
      - column: class_attribute_value_numeric_list
        expression: "CONCAT_WS(',',
                     CASE WHEN TRY_CAST(recycle_content_mc AS FLOAT) IS NULL THEN 'RECYCLE_CONTENT' ELSE NULL END,
                     CASE WHEN TRY_CAST(plant_pet_mc AS FLOAT) IS NULL THEN 'PLANT_PET' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_chips_mc AS FLOAT) IS NULL THEN 'RPET_CHIPS' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_meltin_mc AS FLOAT) IS NULL THEN 'RPET_MELTIN' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_flake_mc AS FLOAT) IS NULL THEN 'RPET_FLAKE' ELSE NULL END,
                     CASE WHEN TRY_CAST(virgin_mc AS FLOAT) IS NULL THEN 'VIRGIN' ELSE NULL END)"

  - kind: add
    name: add_cast_null_to_zeros
    params:
      - column: recycle_content_mc
        expression: "COALESCE((CASE WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') THEN '0' WHEN recycle_content_mc LIKE '%%' THEN REPLACE(recycle_content_mc, '%', '') ELSE recycle_content_mc END), 0)"
        overwrite: true
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END), 0)"
        overwrite: true
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%'  THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END), 0)"
        overwrite: true
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_meltin_mc LIKE '%%'  THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END), 0)"
        overwrite: true
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)"
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"
        overwrite: true
      - column: preform_additive_mc
        expression: "COALESCE(preform_additive_mc, 0)"
        overwrite: true

