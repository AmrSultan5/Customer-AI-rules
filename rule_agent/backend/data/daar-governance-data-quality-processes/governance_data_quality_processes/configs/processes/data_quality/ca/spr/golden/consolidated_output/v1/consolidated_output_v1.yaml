################# DU task3 #################
  - kind: filter
    name: filter_ma_t3
    context_name: select_ma
    params:
      - condition:
          material_substitution_flag_ma = '0' AND
          material_status_ma = '' AND
          material_group_code_ma != '1110000'AND
          material_type_code_ma IN ('ZFG', 'ZFGS') AND
          sales_organization_ma = '0001' AND
          distribution_channel_ma = '01' AND
          package_type_code_ma IN ('PET', 'RGB', 'CAN', 'NRG', 'RPT', 'NRB', 'PTD', 'RET') AND
          CONCAT(material_group_code_ma, product_hierarchy_level_4_code_ma) NOT IN ('111100101010022133', '111100101010022145', '111100101010022155', '111100101010032163', '111100101030042179', '111100401010022145', '111100601010032163', '111100801010022158', '111100901010012123', '111100901010022145', '111100901010032169', '111100901030042179')

  - kind: filter
    name: filter_mc_t3
    context_name: select_mc
    params:
      - condition:
          class_type_mc = '001' AND core_material_mc IN ('', 'CAN', 'BTL_NRG', 'PREF_MONO', 'PREF_MULT', 'BTL_RGB')

  - kind: filter
    name: filter_pc_t3
    context_name: select_pc
    params:
      - condition:
          class_type_pc = '001' AND 
          product_class_name_pc IN ('CPC_MM', 'SPR_MM', 'SPR_MM_EXT_PURCH')

  - kind: group
    name: group_product_class_code
    context_name: filter_pc_t3
    params:
      - aggs:
          product_class_code_pc: collect_list
          product_class_name_pc: collect_list
        by:
        - material_code_pc
        - sap_cluster_pc
        - class_type_pc

  - kind: add
    name: add_product_class_code_list
    context_name: group_product_class_code
    params:
      - column: product_class_code_array
        expression: sort_array(collect_list_product_class_code_pc)
      - column: product_class_name_array
        expression: sort_array(collect_list_product_class_name_pc)

  - kind: add
    name: add_product_class_list
    params:
      - column: product_class_code_concat_ws
        expression: concat_ws(',', product_class_code_array)
      - column: product_class_name_concat_ws
        expression: concat_ws(',', product_class_name_array)

  - kind: select
    name: select_product_class_t3
    context_name: add_product_class_list
    params:
      columns:
        material_code_pc: material_code_pc
        class_type_pc: class_type_pc
        sap_cluster_pc: sap_cluster_pc
        product_class_code_concat_ws: product_class_code_concat_ws
        product_class_name_concat_ws: product_class_name_concat_ws
      distinct: true
 
  - kind: join
    name: join_product_class_code_list_t3
    context_name: filter_pc_t3
    params:
      - other: 
          select_product_class_t3
        how:
          left
        columns:
          material_code_pc: material_code_pc
          class_type_pc: class_type_pc
          sap_cluster_pc: sap_cluster_pc

  - kind: filter
    name: filter_pi_t3
    context_name: select_pi
    params:
      - condition:
          purchase_org_deletion_flag_pi = '' AND
          general_deletion_flag_pi != 'X' AND
          SUBSTRING(vendor_code_pi, 1, 1) NOT IN ('P', 'Z')

  - kind: filter
    name: filter_proc_t3
    context_name: select_proc
    params:
      - condition:
          procurement_alternative_process_category_proc NOT IN ('BF','BL') AND production_version_proc != 'HAUL'

