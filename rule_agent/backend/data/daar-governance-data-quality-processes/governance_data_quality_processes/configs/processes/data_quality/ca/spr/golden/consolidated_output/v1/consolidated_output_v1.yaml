          material_code_ma: material_code_all
          sap_cluster_ma: sap_cluster_all

  - kind: add
    name: add_columns
    params:
      - column: record_type
        expression: '''Production Batch'''
      - column: weight_cast
        expression: "CASE WHEN weight_mc IS NULL OR weight_mc = '' THEN 0
                     WHEN weight_mc < 1 THEN CAST(weight_mc AS DECIMAL(13,3)) * 100 
                     ELSE CAST(weight_mc AS DECIMAL(13,3)) 
                     END"
      - column: recycle_content_mc
        expression: "CASE WHEN recycle_content_mc IS NULL OR recycle_content_mc = '' THEN '0' ELSE recycle_content_mc END"
        overwrite: true        
      - column: weight_mc
        expression: "CASE WHEN weight_mc IS NULL OR weight_mc = '' THEN 0
                     WHEN weight_mc < 1 THEN weight_mc * 100 
                     ELSE weight_mc END"     
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"  
        overwrite: true   
      - column: preform_additive_mc
        expression: "COALESCE(preform_additive_mc, 0)"   
        overwrite: true  
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END) , 0)"   
        overwrite: true       
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%' THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END) , 0)"  
        overwrite: true        
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_meltin_mc LIKE '%%' THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END) , 0)"  
        overwrite: true        
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)" 
        overwrite: true    
      - column: batch_classification_completeness_flag
        expression: IF(class_group_completeness_flag_t1 != '1' OR class_group_completeness_flag_t2 != '1' OR class_attribute_value_completeness_flag_t1 NOT IN ('1', '2', '3') OR class_attribute_value_completeness_flag_t2 NOT IN ('1', '2', '3'), '',
                    IF(internal_object_number_ma IS NULL, '0', '1'))
      - column: class_compare_consistency_flag
        expression: IF(class_group_completeness_flag_t1 != '1' OR class_group_completeness_flag_t2 != '1' OR 
                       class_attribute_value_completeness_flag_t1 NOT IN ('1', '2', '3') OR class_attribute_value_completeness_flag_t2 NOT IN ('1', '2', '3') OR 
                       task_number IS NULL OR core_material_mc IS NULL OR core_material_mc = '' OR core_material IS NULL, '',
                    IF(task_number = 't1', 
                    IF(IF(co2 = 'R', co2_mc = co2_t1, 1 = 1) AND
                      IF(core_material = 'R', core_material_mc = core_material_t1, 1 = 1) AND
                      IF(recycle_content = 'R', recycle_content_mc = recycle_content_t1, 1 = 1) AND
                      IF(weight = 'R', weight_mc = weight_t1, 1 = 1) AND
                      IF(shape = 'R', shape_mc = shape_t1, 1 = 1) AND
                      IF(colour = 'R', colour_mc = colour_t1, 1 = 1) AND
                      IF(plant_pet = 'R', plant_pet_mc = plant_pet_t1, 1 = 1) AND
                      IF(preform_additive = 'R', preform_additive_mc = preform_additive_t1, 1 = 1) AND
                      IF(rpet_chips = 'R', rpet_chips_mc = rpet_chips_t1, 1 = 1) AND
                      IF(rpet_flake = 'R', rpet_flake_mc = rpet_flake_t1, 1 = 1) AND
                      IF(rpet_meltin = 'R', rpet_meltin_mc = rpet_meltin_t1, 1 = 1) AND
                      IF(virgin = 'R', virgin_mc = virgin_t1, 1 = 1) AND
                      IF(resin_recycle_type = 'R', resin_recycle_type_mc = resin_recycle_type_t1, 1 = 1), '1', '0'),
                   IF(IF(co2 = 'R', co2_mc = co2_t2, 1 = 1) AND
                     IF(core_material = 'R', core_material_mc = core_material_t2, 1 = 1) AND
                     IF(recycle_content = 'R', recycle_content_mc = recycle_content_t2, 1 = 1) AND
                     IF(weight = 'R', weight_mc = weight_t2, 1 = 1) AND
                     IF(shape = 'R', shape_mc = shape_t2, 1 = 1) AND
                     IF(colour = 'R', colour_mc = colour_t2, 1 = 1) AND
                     IF(plant_pet = 'R', plant_pet_mc = plant_pet_t2, 1 = 1) AND
                     IF(preform_additive = 'R', preform_additive_mc = preform_additive_t2, 1 = 1) AND
                     IF(rpet_chips = 'R', rpet_chips_mc = rpet_chips_t2, 1 = 1) AND
                     IF(rpet_flake = 'R', rpet_flake_mc = rpet_flake_t2, 1 = 1) AND
                     IF(rpet_meltin = 'R', rpet_meltin_mc = rpet_meltin_t2, 1 = 1) AND
                     IF(virgin = 'R', virgin_mc = virgin_t2, 1 = 1) AND
                     IF(resin_recycle_type = 'R', resin_recycle_type_mc = resin_recycle_type_t2, 1 = 1), '1', '0')))
      - column: batch_availability_completeness_flag
        expression: IF(class_group_completeness_flag_t1 != '1' OR class_group_completeness_flag_t2 != '1' OR class_attribute_value_completeness_flag_t1 NOT IN ('1', '2', '3') OR class_attribute_value_completeness_flag_t2 NOT IN ('1', '2', '3'), '',
                    IF(batch_classification_pb IS NULL, '0', '1'))

  - kind: add
    name: add_cast_null_to_zeros
    params:
      - column: recycle_content_mc
        expression: "COALESCE((CASE WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') THEN '0' WHEN recycle_content_mc LIKE '%%' THEN REPLACE(recycle_content_mc, '%', '') ELSE recycle_content_mc END), 0)"
        overwrite: true
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END), 0)"
        overwrite: true
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%'  THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END), 0)"
        overwrite: true
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_meltin_mc LIKE '%%'  THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END), 0)"
        overwrite: true
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)"
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"
        overwrite: true
