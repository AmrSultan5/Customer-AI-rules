        expression: "COALESCE((CASE WHEN (rpet_chips_cl1 IS NULL OR rpet_chips_cl1 = '') THEN '0' WHEN rpet_chips_cl1 LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_cl1 LIKE '%%' THEN REPLACE(rpet_chips_cl1, '%', '') ELSE rpet_chips_cl1 END), 0)"
        overwrite: true
      - column: rpet_flake_cl1
