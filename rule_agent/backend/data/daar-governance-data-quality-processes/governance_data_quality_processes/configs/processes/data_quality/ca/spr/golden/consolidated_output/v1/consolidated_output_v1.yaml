transform:
  name: detailed
  operations:

  - kind: read_dataio
    name: read_dm_material
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material
      schema_version: v6

  - kind: select
    name: select_ma
    params:
      columns:
        material_code: material_code_ma
        material_name: material_name_ma
        material_type_code: material_type_code_ma
        material_group_code: material_group_code_ma
        material_status: material_status_ma
        package_type_code: package_type_code_ma
        net_weight: net_weight_ma
        gross_weight: gross_weight_ma
        material_description_weight: material_description_weight_ma
        product_hierarchy: product_hierarchy_ma
        internal_object_number: internal_object_number_ma
        material_substitution_flag: material_substitution_flag_ma
        sales_organization: sales_organization_ma
        distribution_channel: distribution_channel_ma
        product_hierarchy_level_4_code: product_hierarchy_level_4_code_ma
        sap_cluster: sap_cluster_ma
      distinct: true

  - kind: read_dataio
    name: read_dm_material_characteristics
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_characteristics
      schema_version: v2

  - kind: select
    name: select_mc
    params:
      columns:
        class_type: class_type_mc
        core_material: core_material_mc
        object_code: object_code_mc
        co2: co2_mc
        recycle_content: recycle_content_mc
        weight: weight_mc
        shape: shape_mc
        colour: colour_mc
        plant_pet: plant_pet_mc
        preform_additive: preform_additive_mc
        rpet_chips: rpet_chips_mc
        rpet_flake: rpet_flake_mc
        rpet_meltin: rpet_meltin_mc
        virgin: virgin_mc
        resin_recycle_type: resin_recycle_type_mc
        rm_qty: rm_qty_mc
        sap_cluster: sap_cluster_mc
      distinct: true
 
  - kind: add
    name: select_mc
    params:
      - column: recycle_content_mc
        expression: "COALESCE((CASE WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') THEN '0' WHEN recycle_content_mc LIKE '%%' THEN REPLACE(recycle_content_mc, '%', '') ELSE recycle_content_mc END) , 0)"
        overwrite: true
      - column: weight_mc
        expression: "COALESCE((CASE WHEN weight_mc < 1 THEN CAST(weight_mc AS decimal(13,3)) * 100 ELSE weight_mc END), 0)"     
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"  
        overwrite: true   
      - column: preform_additive_mc
        expression: "COALESCE(preform_additive_mc, 0)"   
        overwrite: true  
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END) , 0)"   
        overwrite: true       
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%' THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END) , 0)"  
        overwrite: true        
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100'WHEN rpet_meltin_mc LIKE '%%'  THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END) , 0)"  
        overwrite: true        
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)" 
        overwrite: true    

  - kind: read_dataio
    name: read_dm_product_class
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_product_class
      schema_version: v1
      
  - kind: select
    name: select_pc
    params:
      columns:
        class_type: class_type_pc
        material_code: material_code_pc
        product_class_name: product_class_name_pc
        product_class_code: product_class_code_pc
        sap_cluster: sap_cluster_pc
      distinct: true

  - kind: read_dataio
    name: read_dm_material_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_plant
      schema_version: v3
      
  - kind: select
    name: select_mp
    params:
      columns:
        material_code: material_code_mp
        material_status_code: material_status_code_mp
        plant_code: plant_code_mp
        country_code: country_code_mp
        sap_cluster: sap_cluster_mp
      distinct: true

  - kind: filter
    name: select_mp
    params:
      - condition: "material_status_code_mp IN ('98', '')"

### material_status_99 to check if material is fully blocked
  - kind: add
    name: add_columns_mp
    context_name: select_mp
    params:
      - column: material_status_code_99
        expression: "CASE WHEN material_status_code_mp = '99' THEN '1' ELSE '0' END"

  - kind: group
    name: group_plant_codes
    context_name: add_columns_mp
    params:
      - aggs:
          material_status_code_mp: count 
          material_status_code_99: sum
        by:
        - material_code_mp
        - sap_cluster_mp

  - kind: join
    name: join_material_status_code_99
    context_name: add_columns_mp
    params:
      - other:
          group_plant_codes
        how:
          left
        columns:
          material_code_mp: material_code_mp
          sap_cluster_mp: sap_cluster_mp
###

  - kind: read_dataio
    name: read_dm_product_batch
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_product_batch
      schema_version: v1

  - kind: select
    name: select_pb
    params:
      columns:
        material_code : material_code_pb
        created_on_date: created_on_date_pb
        plant_code: plant_code_pb
        batch_number: batch_number_pb
        sap_cluster: sap_cluster_pb
        batch_classification: batch_classification_pb
      distinct: true

  - kind: read_dataio
    name: read_dm_purchasing_info
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_purchasing_info
      schema_version: v1

  - kind: select
    name: select_pi
    params:
      columns:
        purchase_org_deletion_flag: purchase_org_deletion_flag_pi
        general_deletion_flag: general_deletion_flag_pi
        material_code: material_code_pi
        vendor_code: vendor_code_pi
        purchasing_organization_code: purchasing_organization_code_pi
        plant_code: plant_code_pi
        sap_cluster: sap_cluster_pi
      distinct: true

  - kind: read_dataio
    name: read_dm_material_production_versions
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_production_versions
      schema_version: v2

  - kind: select
    name: select_pv
    params:
      columns:
        material_code: material_code_pv
        plant_code: plant_code_pv
        production_version: production_version_pv
        sap_cluster: sap_cluster_pv
      distinct: true

  - kind: read_dataio
    name: read_dm_material_procurement
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_procurement
      schema_version: v1

  - kind: select
    name: select_proc
    params:
      columns:
        material_code: material_code_proc
        plant_code: plant_code_proc
        procurement_alternative_process_category: procurement_alternative_process_category_proc
        production_version: production_version_proc
        sap_cluster: sap_cluster_proc
      distinct: true

  - kind: read_dataio
    name: read_classifications_matrix_1_2_4
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: master_data_quality
      object_name: classifications_matrix_task_1_2_4
      schema_version: v1

  - kind: read_dataio
    name: read_classifications_matrix_3
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: master_data_quality
      object_name: classifications_matrix_task_3
      schema_version: v1

################# DU task1 #################
  - kind: filter
    name: filter_ma_t1
    context_name: select_ma
    params:
      - condition:
          material_status_ma = '' AND
          material_type_code_ma IN ('ZRWT', 'ZSFT', 'ZEM') AND
          material_group_code_ma != '1110000' AND
          (material_group_code_ma IN ('1003005', '1003014') AND material_name_ma LIKE 'CAN%' OR 
          material_group_code_ma IN ('1003009','1003010') AND material_name_ma LIKE 'BTL%' OR
          material_group_code_ma = '1003011' AND material_name_ma LIKE 'RESIN%' OR
          material_group_code_ma = '1003012' AND material_name_ma LIKE 'PREF%')

### max_package_type_code
  - kind: group
    name: group_package_type_code_max
    context_name: filter_ma_t1
    params:
      - aggs:
          package_type_code_ma: max 
        by:
        - material_code_ma
        - sap_cluster_ma

  - kind: join
    name: join_max_package_type_code_ma_t1
    context_name: filter_ma_t1
    params:
      - other:
          group_package_type_code_max
        how:
          left
        columns:
          material_code_ma: material_code_ma
          sap_cluster_ma: sap_cluster_ma
##

  - kind: filter
    name: filter_mc_t1
    context_name: select_mc
    params:
      - condition:
          class_type_mc = '001' AND core_material_mc IN ('', 'CAN_B', 'BTL_NRG', 'RESIN', 'PREF_MONO', 'PREF_MULT', 'CAN_E', 'BTL_RGB')

  - kind: add
    name: select_add_mc_t1
    context_name: filter_mc_t1
    params:
      - column: recycle_content_mc
        expression: "COALESCE((CASE WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') THEN '0' WHEN recycle_content_mc LIKE '%%' THEN REPLACE(recycle_content_mc, '%', '') ELSE recycle_content_mc END), 0)"
        overwrite: true
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END), 0)"
        overwrite: true
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%'  THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END), 0)"
        overwrite: true
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_meltin_mc LIKE '%%'  THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END), 0)"
        overwrite: true
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)"
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"
        overwrite: true
      - column: preform_additive_mc
        expression: "COALESCE(preform_additive_mc, 0)"
        overwrite: true

  - kind: filter
    name: filter_pc_t1
    context_name: select_pc
    params:
      - condition:
          class_type_pc = '001'

  - kind: filter
    name: filter_pi_t1
    context_name: select_pi
    params:
      - condition:
          purchase_org_deletion_flag_pi != 'X' AND general_deletion_flag_pi != 'X' 

  - kind: add
    name: add_columns_pi
    context_name: filter_pi_t1
    params:
      - column: internal_vendor_2000000102
        expression: "CASE WHEN vendor_code_pi = '2000000102' THEN '1' ELSE '0' END"
      - column: internal_vendor_2000000028
        expression: "CASE WHEN vendor_code_pi = '2000000028' THEN '1' ELSE '0' END"

### comparison cl1 vs cl2, class_attribute_value_consistency_flag
  - kind: select
    name: select_class_attr_flag_cl1
    context_name: select_add_mc_t1
    params:
      columns:
        recycle_content_mc: recycle_content_cl1
        shape_mc: shape_cl1
        colour_mc: colour_cl1
        plant_pet_mc: plant_pet_cl1
        preform_additive_mc: preform_additive_cl1
        rpet_chips_mc: rpet_chips_cl1
        rpet_flake_mc: rpet_flake_cl1
        rpet_meltin_mc: rpet_meltin_cl1
        virgin_mc: virgin_cl1
        resin_recycle_type_mc: resin_recycle_type_cl1
        co2_mc: co2_cl1
        core_material_mc: core_material_cl1
        weight_mc: weight_cl1
        object_code_mc: object_code_cl1
        class_type_mc: class_type_cl1
        sap_cluster_mc: sap_cluster_cl1
      distinct: true
      
  - kind: filter
    name: filter_class_attr_flag_cl1
    context_name: select_class_attr_flag_cl1
    params:
      - condition:
          sap_cluster_cl1 = 'CL1'
       
  - kind: select
    name: select_class_attr_flag_cl2
    context_name: select_add_mc_t1
    params:
      columns:
        recycle_content_mc: recycle_content_cl2
        shape_mc: shape_cl2
        colour_mc: colour_cl2
        plant_pet_mc: plant_pet_cl2
        preform_additive_mc: preform_additive_cl2
        rpet_chips_mc: rpet_chips_cl2
        rpet_flake_mc: rpet_flake_cl2
        rpet_meltin_mc: rpet_meltin_cl2
        virgin_mc: virgin_cl2
        resin_recycle_type_mc: resin_recycle_type_cl2
        co2_mc: co2_cl2
        core_material_mc: core_material_cl2
        weight_mc: weight_cl2
        object_code_mc: object_code_cl2
        class_type_mc: class_type_cl2
        sap_cluster_mc: sap_cluster_cl2
      distinct: true
      
  - kind: filter
    name: filter_class_attr_flag_cl2
    context_name: select_class_attr_flag_cl2
    params:
      - condition:
          sap_cluster_cl2 = 'CL2'
          
  - kind: join
    name: join_cl1_cl2
    context_name: filter_class_attr_flag_cl1
    params:
      - other:
          filter_class_attr_flag_cl2
        how:
          outer
        columns:
          object_code_cl1: object_code_cl2

  - kind: filter
    name: filter_join_cl1_cl2_1
    context_name: join_cl1_cl2
    params:
      - condition:
          object_code_cl1 IS NOT NULL
          
  - kind: select
    name: select_join_cl1_cl2_1
    context_name: filter_join_cl1_cl2_1
    params:
      columns:
        object_code_cl1: object_code
        recycle_content_cl1: recycle_content_cl1
        shape_cl1: shape_cl1
        colour_cl1: colour_cl1
        plant_pet_cl1: plant_pet_cl1
        preform_additive_cl1: preform_additive_cl1
        rpet_chips_cl1: rpet_chips_cl1
        rpet_flake_cl1: rpet_flake_cl1
        rpet_meltin_cl1: rpet_meltin_cl1
        virgin_cl1: virgin_cl1
        resin_recycle_type_cl1: resin_recycle_type_cl1
        co2_cl1: co2_cl1
        core_material_cl1: core_material_cl1
        weight_cl1: weight_cl1
        class_type_cl1: class_type_cl1
        sap_cluster_cl1: sap_cluster_cl1
        recycle_content_cl2: recycle_content_cl2
        shape_cl2: shape_cl2
        colour_cl2: colour_cl2
        plant_pet_cl2: plant_pet_cl2
        preform_additive_cl2: preform_additive_cl2
        rpet_chips_cl2: rpet_chips_cl2
        rpet_flake_cl2: rpet_flake_cl2
        rpet_meltin_cl2: rpet_meltin_cl2
        virgin_cl2: virgin_cl2
        resin_recycle_type_cl2: resin_recycle_type_cl2
        co2_cl2: co2_cl2
        core_material_cl2: core_material_cl2
        weight_cl2: weight_cl2
        class_type_cl2: class_type_cl2
        sap_cluster_cl2: sap_cluster_cl2
      distinct: true

  - kind: filter
    name: filter_join_cl1_cl2_2
    context_name: join_cl1_cl2
    params:
      - condition:
          object_code_cl2 IS NOT NULL
 
  - kind: select
    name: select_join_cl1_cl2_2
    context_name: filter_join_cl1_cl2_2
    params:
      columns:
        object_code_cl2: object_code
        recycle_content_cl1: recycle_content_cl1
        shape_cl1: shape_cl1
        colour_cl1: colour_cl1
        plant_pet_cl1: plant_pet_cl1
        preform_additive_cl1: preform_additive_cl1
        rpet_chips_cl1: rpet_chips_cl1
        rpet_flake_cl1: rpet_flake_cl1
        rpet_meltin_cl1: rpet_meltin_cl1
        virgin_cl1: virgin_cl1
        resin_recycle_type_cl1: resin_recycle_type_cl1
        co2_cl1: co2_cl1
        core_material_cl1: core_material_cl1
        weight_cl1: weight_cl1
        class_type_cl1: class_type_cl1
        sap_cluster_cl1: sap_cluster_cl1
        recycle_content_cl2: recycle_content_cl2
        shape_cl2: shape_cl2
        colour_cl2: colour_cl2
        plant_pet_cl2: plant_pet_cl2
        preform_additive_cl2: preform_additive_cl2
        rpet_chips_cl2: rpet_chips_cl2
        rpet_flake_cl2: rpet_flake_cl2
        rpet_meltin_cl2: rpet_meltin_cl2
        virgin_cl2: virgin_cl2
        resin_recycle_type_cl2: resin_recycle_type_cl2
        co2_cl2: co2_cl2
        core_material_cl2: core_material_cl2
        weight_cl2: weight_cl2
        class_type_cl2: class_type_cl2
        sap_cluster_cl2: sap_cluster_cl2
      distinct: true

  - kind: union
    name: union_cl1_cl2
    context_name: select_join_cl1_cl2_1
    params:
      allow_missing: false
      by_name: true
      other: select_join_cl1_cl2_2
###

  - kind: join
    name: join_t1
    context_name: join_max_package_type_code_ma_t1
    params:
      - other:
          select_add_mc_t1
        how:
          left
        columns:
          material_code_ma: object_code_mc
          sap_cluster_ma: sap_cluster_mc
      - other:
          filter_pc_t1
        how:
          inner
        columns:
          material_code_ma: material_code_pc
          sap_cluster_ma: sap_cluster_pc
      - other:
          join_material_status_code_99
        how:
          inner
        columns:
          material_code_ma: material_code_mp
          sap_cluster_ma: sap_cluster_mp
      - other:
          add_columns_pi
        how:
          left
        columns:
          material_code_ma: material_code_pi
          sap_cluster_ma: sap_cluster_pi
      - other:
          union_cl1_cl2
        how:
          left
        columns:
          material_code_ma: object_code
      - other:
          read_classifications_matrix_1_2_4
        how:
          left
        columns:
          core_material_mc: core_material_value

  - kind: filter
    name: filter_join_t1
    context_name: join_t1
    params:
      - condition:
          (material_type_code_ma IN ('ZRWT', 'ZSFT') OR 
          (material_type_code_ma = 'ZEM' AND (vendor_code_pi ='2000000102' OR vendor_code_pi ='2000000028') AND product_class_name_pc IS NOT NULL AND material_code_pi IS NOT NULL AND SUBSTRING(purchasing_organization_code_pi, 0, 2) = SUBSTRING(plant_code_pi, 0, 2))) AND
          (product_class_name_pc IN ('CPC_MM', 'SPR_MM', 'SPR_MM_EXT_PURCH'))

### max vendor_code and internal_vendor_code
  - kind: group
    name: group_vendor_code_max
    context_name: filter_join_t1
    params:
      - aggs:
          vendor_code_pi: max 
          internal_vendor_2000000102: sum
          internal_vendor_2000000028: sum
        by:
        - material_code_ma
        - sap_cluster_ma

  - kind: join
    name: join_max_group_vendor_code_join_t1
    context_name: filter_join_t1
    params:
      - other:
          group_vendor_code_max
        how:
          left
        columns:
          material_code_ma: material_code_ma
          sap_cluster_ma: sap_cluster_ma
###

  - kind: add
    name: add_consistency_flag_cl1_cl2
    context_name: join_max_group_vendor_code_join_t1
    params:
      - column: internal_vendor_code
        expression: "CASE WHEN sum_internal_vendor_2000000102 > 0 THEN '2000000102' 
                     WHEN sum_internal_vendor_2000000028 > 0 THEN '2000000028' 
                     ELSE 'external vendors' 
                     END"
      - column: consistency_flag_cl1_cl2
        expression: "CASE WHEN (recycle_content = 'R' AND COALESCE(recycle_content_cl1, '') != COALESCE(recycle_content_cl2, '')) OR 
                    (shape = 'R' AND COALESCE(shape_cl1, '') != COALESCE(shape_cl2, '')) OR
                    (weight = 'R' AND COALESCE(weight_cl1, '') != COALESCE(weight_cl2, '')) OR 
                    (colour = 'R' AND COALESCE(colour_cl1, '') != COALESCE(colour_cl2, '')) OR  
                    (plant_pet = 'R' AND COALESCE(plant_pet_cl1, '') != COALESCE(plant_pet_cl2, '')) OR 
                    (preform_additive = 'R' AND COALESCE(preform_additive_cl1, '') != COALESCE(preform_additive_cl2, '')) OR  
                    (rpet_chips = 'R' AND COALESCE(rpet_chips_cl1, '') != COALESCE(rpet_chips_cl2, '')) OR 
                    (rpet_flake = 'R' AND COALESCE(rpet_flake_cl1, '') != COALESCE(rpet_flake_cl2, '')) OR  
                    (rpet_meltin = 'R' AND COALESCE(rpet_meltin_cl1, '') != COALESCE(rpet_meltin_cl2, '')) OR 
                    (virgin = 'R' AND COALESCE(virgin_cl1, '') != COALESCE(virgin_cl2, '')) OR 
                    (resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_cl1, '') != COALESCE(resin_recycle_type_cl2, '')) OR 
                    (co2 = 'R' AND COALESCE(co2_cl1, '') != COALESCE(co2_cl2, '')) 
                    THEN '0' ELSE '1' END"
      - column: consistency_list_long_cl1_cl2
        expression: CONCAT(if(recycle_content = 'R' AND (COALESCE(recycle_content_cl1, '') != COALESCE(recycle_content_cl2, '')), 'RECYCLE_CONTENT,', ''),
                           if(shape = 'R' AND (COALESCE(shape_cl1, '') != COALESCE(shape_cl2, '')), 'SHAPE,', ''),
                           if(weight = 'R' AND (COALESCE(weight_cl1, '') != COALESCE(weight_cl2, '')), 'WEIGHT,', ''),
                           if(colour = 'R' AND (COALESCE(colour_cl1, '') != COALESCE(colour_cl2, '')), 'COLOUR,', ''),
                           if(plant_pet = 'R' AND (COALESCE(plant_pet_cl1, '') != COALESCE(plant_pet_cl2, '')), 'PLANT_PET,', ''),
                           if(preform_additive = 'R' AND (COALESCE(preform_additive_cl1, '') != COALESCE(preform_additive_cl2, '')), 'PREFORM_ADDITIVE,', ''),
                           if(rpet_chips = 'R' AND (COALESCE(rpet_chips_cl1, '') != COALESCE(rpet_chips_cl2, '')), 'RPET_CHIPS,', ''),
                           if(rpet_flake = 'R' AND (COALESCE(rpet_flake_cl1, '') != COALESCE(rpet_flake_cl2, '')), 'RPET_FLAKE,', ''),
                           if(rpet_meltin = 'R' AND (COALESCE(rpet_meltin_cl1, '') != COALESCE(rpet_meltin_cl2, '')), 'RPET_MELTIN,', ''),
                           if(virgin = 'R' AND (COALESCE(virgin_cl1, '') != COALESCE(virgin_cl2, '')), 'VIRGIN,', ''),
                           if(resin_recycle_type = 'R' AND (COALESCE(resin_recycle_type_cl1, '') != COALESCE(resin_recycle_type_cl2, '')), 'RESIN_RECYCLE_TYPE,', ''),
                           if(co2 = 'R' AND (COALESCE(co2_cl1, '') != COALESCE(co2_cl2, '')), 'CO2,', ''))

  - kind: add
    name: add_columns
    params:
      - column: class_attribute_value_consistency_list
        expression: substr(consistency_list_long_cl1_cl2, 1, length(consistency_list_long_cl1_cl2) - 1)
      - column: material_status
        expression: IF(sum_material_status_code_99 = count_material_status_code_mp, 'Fully Blocked', '')
      - column: record_type
        expression: '''Centrally Procured Material'''
      - column: net_weight
        expression: IF(net_weight_ma < 1, 1000 * net_weight_ma, net_weight_ma)
      - column: gross_weight
        expression: IF(gross_weight_ma < 1, 1000 * gross_weight_ma, gross_weight_ma)
      - column: weight_cast
        expression: "CASE WHEN weight_mc < 1 THEN CAST(weight_mc AS DECIMAL(13,3)) * 100 ELSE CAST(weight_mc AS DECIMAL(13,3)) END"
      - column: mix_ratio
        expression: CAST(rpet_chips_mc AS FLOAT) + CAST(rpet_flake_mc AS FLOAT) + CAST(rpet_meltin_mc AS FLOAT)

  - kind: add
    name: add_columns
    params:
      - column: class_group_completeness_flag
        expression: IF(material_status = 'Fully Blocked', '', 
                    IF(product_class_name_pc IS NULL OR product_class_name_pc = '', '0', '1'))
                    
  - kind: add
    name: add_columns
    params:
      - column: class_group_accuracy_flag
        expression: IF(material_status = 'Fully Blocked' OR class_group_completeness_flag = '0', '', 
                    IF(product_class_name_pc = 'CPC_MM', '1', '0'))
      - column: core_material_accuracy_flag
        expression: IF(material_status = 'Fully Blocked', '', 
                    IF((material_group_code_ma = '1003005' AND core_material_mc IN ('CAN_B', 'CAN B')) OR
                       (material_group_code_ma = '1003009' AND core_material_mc = 'BTL_RGB') OR
                       (material_group_code_ma = '1003010' AND core_material_mc = 'BTL_NRG') OR 
                       (material_group_code_ma = '1003011' AND core_material_mc = 'RESIN') OR 
                       (material_group_code_ma = '1003012' AND core_material_mc IN ('PREF_MONO', 'PREF_MULT')) OR 
                       (material_group_code_ma = '1003014' AND core_material_mc = 'CAN_E'), '1', '0'))
      - column: class_attribute_value_consistency_flag
        expression: IF(material_type_code_ma = 'ZEM', '', 
                    IF(consistency_flag_cl1_cl2 = '1', '1', '0'))
      - column: material_name_accuracy_flag
        expression: IF(material_status = 'Fully Blocked', '',
                    IF(((material_name_ma LIKE 'CAN_B%' OR material_name_ma LIKE 'CAN BODY%') AND material_group_code_ma = '1003005') OR
                       ((material_name_ma LIKE 'BTL_NRG%' OR material_name_ma LIKE 'BOTTLE NRG%' OR material_name_ma LIKE 'BTL NRG%') AND material_group_code_ma = '1003010') OR
                       (material_name_ma LIKE 'RESIN%' AND material_group_code_ma = '1003011') OR
                       ((material_name_ma LIKE 'PREF_MONO%' OR material_name_ma LIKE 'PREF_MULT%' OR material_name_ma LIKE 'PREFORM%') AND material_group_code_ma = '1003012') OR
                       ((material_name_ma LIKE 'CAN_E%' OR material_name_ma LIKE 'CAN END%') AND material_group_code_ma = '1003014') OR
                       ((material_name_ma LIKE 'BTL_RGB%' OR material_name_ma LIKE 'BTL RGB%' OR material_name_ma LIKE 'BTL_RPT%' OR material_name_ma LIKE 'BOTTLES RPT%' OR material_name_ma LIKE '%RET%') AND material_group_code_ma = '1003009'), '1',
                    IF(material_name_ma NOT LIKE 'BTL_NRG%' AND material_name_ma NOT LIKE 'BOTTLE NRG%' AND material_name_ma NOT LIKE 'BTL NRG%' AND material_name_ma NOT LIKE 'RESIN%' AND material_name_ma NOT LIKE 'PREF_MONO%' AND material_name_ma NOT LIKE 'PREF_MULT%' AND material_name_ma NOT LIKE 'PREFORM%' AND material_name_ma NOT LIKE 'CAN_E%' AND material_name_ma NOT LIKE 'CAN END%' AND material_name_ma NOT LIKE 'BTL_RGB%' AND material_name_ma NOT LIKE 'BTL RGB%' AND material_name_ma NOT LIKE 'BTL_RPT%' AND material_name_ma NOT LIKE 'BOTTLES RPT%' AND material_name_ma NOT LIKE '%RET%', '2', '0')))
      - column: recycle_content_mix_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN  material_group_code_ma != '1003012' THEN ''
                     WHEN ((rpet_chips_mc IS NULL) OR (rpet_flake_mc IS NULL) OR (rpet_meltin_mc IS NULL) OR (recycle_content_mc IS NULL)) THEN ''
                     WHEN mix_ratio = CAST(recycle_content_mc AS float) THEN '1' 
                     ELSE '0' END"
      - column: recycle_content_rv_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN ''
                     WHEN material_group_code_ma != '1003012' THEN ''
                     WHEN recycle_content_mc IS NULL OR virgin_mc IS NULL THEN ''
                     WHEN CAST(virgin_mc AS float) + CAST(plant_pet_mc AS float) + CAST(recycle_content_mc AS float) = 100 OR 
                          CAST(plant_pet_mc AS float) + CAST(recycle_content_mc AS float) = 100 OR 
                          mix_ratio = CAST(recycle_content_mc AS float) THEN '1' 
                    ELSE '0' END"
      - column: weight_accuracy_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN material_group_code_ma != '1003012' THEN ''
                     WHEN material_description_weight_ma = net_weight AND material_description_weight_ma = gross_weight AND CAST(material_description_weight_ma AS decimal(13,3)) = weight_cast THEN '1' 
                     ELSE '0' END"
      - column: class_attribute_value_completeness_flag
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' 
                     WHEN (COALESCE(core_material_mc, '') = '' OR 
                      recycle_content = 'R' AND COALESCE(recycle_content_mc, '') = '' OR
                      shape = 'R' AND COALESCE(shape_mc, '') = '' OR
                      weight = 'R' AND COALESCE(weight_mc, '') = '' OR
                      colour = 'R' AND COALESCE(colour_mc, '') = '' OR
                      plant_pet = 'R' AND COALESCE(plant_pet_mc, '') = '' OR
                      preform_additive = 'R' AND COALESCE(preform_additive_mc, '') = '' OR
                      rpet_chips = 'R' AND COALESCE(rpet_chips_mc, '') = '' OR
                      rpet_flake = 'R' AND COALESCE(rpet_flake_mc, '') = '' OR
                      rpet_meltin = 'R' AND COALESCE(rpet_meltin_mc, '') = '' OR
                      virgin = 'R' AND COALESCE(virgin_mc, '') = '' OR
                      resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_mc, '') = '' OR
                      co2 = 'R' AND COALESCE(co2_mc, '') = '') 
                     THEN '0'
                     WHEN (COALESCE(core_material_mc, '') = '' OR
                      recycle_content = 'O' AND COALESCE(recycle_content_mc, '') = '' OR
                      shape = 'O' AND COALESCE(shape_mc, '') = '' OR
                      weight = 'O' AND COALESCE(weight_mc, '') = '' OR
                      colour = 'O' AND COALESCE(colour_mc, '') = '' OR
                      plant_pet = 'O' AND COALESCE(plant_pet_mc, '') = '' OR
                      preform_additive = 'O' AND COALESCE(preform_additive_mc, '') = '' OR
                      rpet_chips = 'O' AND COALESCE(rpet_chips_mc, '') = '' OR
                      rpet_flake = 'O' AND COALESCE(rpet_flake_mc, '') = '' OR
                      rpet_meltin = 'O' AND COALESCE(rpet_meltin_mc, '') = '' OR
                      virgin = 'O' AND COALESCE(virgin_mc, '') = '' OR
                      resin_recycle_type = 'O' AND COALESCE(resin_recycle_type_mc, '') = '' OR
                      co2 = 'O' AND COALESCE(co2_mc, '') = '') 
                     THEN '2'
                     WHEN (COALESCE(core_material_mc, '') != '' OR 
                      recycle_content = 'R' AND COALESCE(recycle_content_mc, '') != '' OR
                      shape = 'R' AND COALESCE(shape_mc, '') != '' OR
                      weight = 'R' AND COALESCE(weight_mc, '') != '' OR
                      colour = 'R' AND COALESCE(colour_mc, '') != '' OR
                      plant_pet = 'R' AND COALESCE(plant_pet_mc, '') != '' OR
                      preform_additive = 'R' AND COALESCE(preform_additive_mc, '') != '' OR
                      rpet_chips = 'R' AND COALESCE(rpet_chips_mc, '') != '' OR
                      rpet_flake = 'R' AND COALESCE(rpet_flake_mc, '') != '' OR
                      rpet_meltin = 'R' AND COALESCE(rpet_meltin_mc, '') != '' OR
                      virgin = 'R' AND COALESCE(virgin_mc, '') != '' OR
                      resin_recycle_type = 'R' AND COALESCE(resin_recycle_type_mc, '') != '' OR
                      co2 = 'R' AND COALESCE(co2_mc, '') != '') 
                    THEN '1'
                    WHEN (COALESCE(core_material_mc, '') != '' OR
                     recycle_content = 'O' AND COALESCE(recycle_content_mc, '') != '' OR
                     shape = 'O' AND COALESCE(shape_mc, '') != '' OR
                     weight = 'O' AND COALESCE(weight_mc, '') != '' OR
                     colour = 'O' AND COALESCE(colour_mc, '') != '' OR
                     plant_pet = 'O' AND COALESCE(plant_pet_mc, '') != '' OR
                     preform_additive = 'O' AND COALESCE(preform_additive_mc, '') != '' OR
                     rpet_chips = 'O' AND COALESCE(rpet_chips_mc, '') != '' OR
                     rpet_flake = 'O' AND COALESCE(rpet_flake_mc, '') != '' OR
                     rpet_meltin = 'O' AND COALESCE(rpet_meltin_mc, '') != '' OR
                     virgin = 'O' AND COALESCE(virgin_mc, '') != '' OR
                     resin_recycle_type = 'O' AND COALESCE(resin_recycle_type_mc, '') != '' OR
                     co2 = 'O' AND COALESCE(co2_mc, '') != '') 
                    THEN '3' 
                    ELSE '' END"
      - column: class_attribute_value_completeness_list
        expression: "CASE WHEN material_status = 'Fully Blocked' THEN '' ELSE
                     CONCAT_WS(',',
                     CASE WHEN recycle_content = 'R' AND core_material_value = core_material_mc AND COALESCE(recycle_content_mc, '') = '' THEN 'RECYCLE_CONTENT_R' ELSE NULL END,
                     CASE WHEN shape = 'R' AND core_material_value = core_material_mc AND COALESCE(shape_mc, '') = '' THEN 'SHAPE_R' ELSE NULL END,
                     CASE WHEN weight = 'R' AND core_material_value = core_material_mc AND COALESCE(weight_mc, '') = '' THEN 'WEIGHT_R' ELSE NULL END,
                     CASE WHEN colour = 'R' AND core_material_value = core_material_mc AND COALESCE(colour_mc, '') = '' THEN 'COLOUR_R' ELSE NULL END,
                     CASE WHEN plant_pet = 'R' AND core_material_value = core_material_mc AND COALESCE(plant_pet_mc, '') = '' THEN 'PLANT_PET_R' ELSE NULL END,
                     CASE WHEN preform_additive = 'R' AND core_material_value = core_material_mc AND COALESCE(preform_additive_mc, '') = '' THEN 'PREFORM_ADDITIVE_R' ELSE NULL END,
                     CASE WHEN rpet_chips = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_chips_mc, '') = '' THEN 'RPET_CHIPS_R' ELSE NULL END,
                     CASE WHEN rpet_flake = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_flake_mc, '') = '' THEN 'RPET_FLAKE_R' ELSE NULL END,
                     CASE WHEN rpet_meltin = 'R' AND core_material_value = core_material_mc AND COALESCE(rpet_meltin_mc, '') = '' THEN 'RPET_MELTIN_R' ELSE NULL END,
                     CASE WHEN virgin = 'R' AND core_material_value = core_material_mc AND COALESCE(virgin_mc, '') = '' THEN 'VIRGIN_R' ELSE NULL END,
                     CASE WHEN resin_recycle_type = 'R' AND core_material_value = core_material_mc AND COALESCE(resin_recycle_type_mc, '') = '' THEN 'RESIN_RECYCLE_TYPE_R' ELSE NULL END,
                     CASE WHEN co2 = 'R' AND core_material_value = core_material_mc AND COALESCE(co2_mc, '') = '' THEN 'CO2_R' ELSE NULL END,
                     CASE WHEN recycle_content = 'O' AND core_material_value = core_material_mc AND COALESCE(recycle_content_mc, '') = '' THEN 'RECYCLE_CONTENT_O' ELSE NULL END,
                     CASE WHEN shape = 'O' AND core_material_value = core_material_mc AND COALESCE(shape_mc, '') = '' THEN 'SHAPE_O' ELSE NULL END,
                     CASE WHEN weight = 'O' AND core_material_value = core_material_mc AND COALESCE(weight_mc, '') = '' THEN 'WEIGHT_O' ELSE NULL END,
                     CASE WHEN colour = 'O' AND core_material_value = core_material_mc AND COALESCE(colour_mc, '') = '' THEN 'COLOUR_O' ELSE NULL END,
                     CASE WHEN plant_pet = 'O' AND core_material_value = core_material_mc AND COALESCE(plant_pet_mc, '') = '' THEN 'PLANT_PET_O' ELSE NULL END,
                     CASE WHEN preform_additive = 'O' AND core_material_value = core_material_mc AND COALESCE(preform_additive_mc, '') = '' THEN 'PREFORM_ADDITIVE_O' ELSE NULL END,
                     CASE WHEN rpet_chips = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_chips_mc, '') = '' THEN 'RPET_CHIPS_O' ELSE NULL END,
                     CASE WHEN rpet_flake = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_flake_mc, '') = '' THEN 'RPET_FLAKE_O' ELSE NULL END,
                     CASE WHEN rpet_meltin = 'O' AND core_material_value = core_material_mc AND COALESCE(rpet_meltin_mc, '') = '' THEN 'RPET_MELTIN_O' ELSE NULL END,
                     CASE WHEN virgin = 'O' AND core_material_value = core_material_mc AND COALESCE(virgin_mc, '') = '' THEN 'VIRGIN_O' ELSE NULL END,
                     CASE WHEN resin_recycle_type = 'O' AND core_material_value = core_material_mc AND COALESCE(resin_recycle_type_mc, '') = '' THEN 'RESIN_RECYCLE_TYPE_O' ELSE NULL END,
                     CASE WHEN co2 = 'O' AND core_material_value = core_material_mc AND COALESCE(co2_mc, '') = '' THEN 'CO2_O' ELSE NULL END)
                     END"
      - column: class_attribute_value_numeric_flag
        expression: "CASE WHEN material_type_code_ma = 'ZEM' THEN ''
                          WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') AND 
                               (plant_pet_mc IS NULL OR plant_pet_mc = '') AND 
                               (rpet_chips_mc IS NULL OR rpet_chips_mc = '') AND 
                               (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') AND 
                               (rpet_flake_mc IS NULL OR rpet_flake_mc = '') AND 
                               (virgin_mc IS NULL OR virgin_mc = '') 
                          THEN ''
                          WHEN TRY_CAST(recycle_content_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(plant_pet_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(rpet_chips_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(rpet_meltin_mc AS FLOAT) IS NULL OR
                               TRY_CAST(rpet_flake_mc AS FLOAT) IS NULL OR 
                               TRY_CAST(virgin_mc AS FLOAT) IS NULL 
                          THEN '0'
                          ELSE '1'
                     END"
      - column: class_attribute_value_numeric_list
        expression: "CONCAT_WS(',',
                     CASE WHEN TRY_CAST(recycle_content_mc AS FLOAT) IS NULL THEN 'RECYCLE_CONTENT' ELSE NULL END,
                     CASE WHEN TRY_CAST(plant_pet_mc AS FLOAT) IS NULL THEN 'PLANT_PET' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_chips_mc AS FLOAT) IS NULL THEN 'RPET_CHIPS' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_meltin_mc AS FLOAT) IS NULL THEN 'RPET_MELTIN' ELSE NULL END,
                     CASE WHEN TRY_CAST(rpet_flake_mc AS FLOAT) IS NULL THEN 'RPET_FLAKE' ELSE NULL END,
                     CASE WHEN TRY_CAST(virgin_mc AS FLOAT) IS NULL THEN 'VIRGIN' ELSE NULL END)"

  - kind: add
    name: add_columns
    params:
      - column: internal_vendor_code
        expression: IF(internal_vendor_code IS NULL, 'external vendors', internal_vendor_code)
        overwrite: true

  - kind: select
    name: select_du_t1
    params:
      columns:
        material_code_ma: material_code
        material_name_ma: material_name
        material_type_code_ma: material_type_code
        max_package_type_code_ma: package_type_code
        material_status: material_status
        material_group_code_ma: material_group_code
        max_vendor_code_pi: vendor_code
        internal_vendor_code: internal_vendor_code
        product_class_code_pc: product_class_code
        product_class_name_pc: product_class_name
        record_type: record_type
        net_weight: net_weight
        gross_weight: gross_weight
        material_description_weight_ma: material_description_weight
        co2_mc: co2
        core_material_mc: core_material
        recycle_content_mc: recycle_content
        weight_mc: weight
        shape_mc: shape
        colour_mc: colour
        plant_pet_mc: plant_pet
        preform_additive_mc: preform_additive
        rpet_chips_mc: rpet_chips
        rpet_flake_mc: rpet_flake
        rpet_meltin_mc: rpet_meltin
        virgin_mc: virgin
        resin_recycle_type_mc: resin_recycle_type
        sap_cluster_ma: sap_cluster
        mix_ratio: mix_ratio
        class_group_completeness_flag: class_group_completeness_flag
        class_group_accuracy_flag: class_group_accuracy_flag
        class_attribute_value_completeness_flag: class_attribute_value_completeness_flag
        class_attribute_value_completeness_list: class_attribute_value_completeness_list
        core_material_accuracy_flag: core_material_accuracy_flag
        class_attribute_value_consistency_flag: class_attribute_value_consistency_flag
        class_attribute_value_consistency_list: class_attribute_value_consistency_list
        material_name_accuracy_flag: material_name_accuracy_flag
        recycle_content_mix_accuracy_flag: recycle_content_mix_accuracy_flag
        recycle_content_rv_accuracy_flag: recycle_content_rv_accuracy_flag
        weight_accuracy_flag: weight_accuracy_flag
        class_attribute_value_numeric_flag: class_attribute_value_numeric_flag
        class_attribute_value_numeric_list: class_attribute_value_numeric_list
        country_code_mp: country_code
      distinct: true

################# DU task2 #################
  - kind: filter
    name: filter_ma_t2
    context_name: select_ma
    params:
      - condition:
          material_status_ma = '' AND
          material_type_code_ma IN ('ZRW', 'ZSF', 'ZEM') AND
          material_group_code_ma != '1110000' AND
          (material_group_code_ma IN ('1003005', '1003014') AND material_name_ma LIKE 'CAN%' OR 
          material_group_code_ma IN ('1003009','1003010') AND material_name_ma LIKE 'BTL%' OR
          material_group_code_ma = '1003011' AND material_name_ma LIKE 'RESIN%' OR
          material_group_code_ma = '1003012' AND material_name_ma LIKE 'PREF%' OR
          material_group_code_ma IN ('1004002', '1004003', '1004009', '1004005'))

### max_package_type_code
  - kind: group
    name: group_package_type_code_max
    context_name: filter_ma_t2
    params:
      - aggs:
          package_type_code_ma: max 
        by:
        - material_code_ma
        - sap_cluster_ma

  - kind: join
    name: join_max_package_type_code_ma_t2
    context_name: filter_ma_t2
    params:
      - other:
          group_package_type_code_max
        how:
          left
        columns:
          material_code_ma: material_code_ma
          sap_cluster_ma: sap_cluster_ma
##

  - kind: filter
    name: filter_mc_t2
    context_name: select_mc
    params:
      - condition:
          class_type_mc = '001' AND core_material_mc IN ('', 'CAN_B', 'BTL_NRG', 'RESIN', 'PREF_MONO', 'PREF_MULT', 'CAN_E', 'BTL_RGB', 'SHRINK_FILM', 'CARDBOARD', 'STRECH_FILM')

  - kind: add
    name: add_mc_t2
    context_name: filter_mc_t2
    params:
      - column: recycle_content_mc
        expression: "COALESCE((CASE WHEN (recycle_content_mc IS NULL OR recycle_content_mc = '') THEN '0' WHEN recycle_content_mc LIKE '%%' THEN REPLACE(recycle_content_mc, '%', '') ELSE recycle_content_mc END), 0)"
        overwrite: true
      - column: rpet_chips_mc
        expression: "COALESCE((CASE WHEN (rpet_chips_mc IS NULL OR rpet_chips_mc = '') THEN '0' WHEN rpet_chips_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_chips_mc LIKE '%%' THEN REPLACE(rpet_chips_mc, '%', '') ELSE rpet_chips_mc END), 0)"
        overwrite: true
      - column: rpet_flake_mc
        expression: "COALESCE((CASE WHEN (rpet_flake_mc IS NULL OR rpet_flake_mc = '') THEN '0' WHEN rpet_flake_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN rpet_flake_mc LIKE '%%'  THEN REPLACE(rpet_flake_mc, '%', '')  ELSE rpet_flake_mc END), 0)"
        overwrite: true
      - column: rpet_meltin_mc
        expression: "COALESCE((CASE WHEN (rpet_meltin_mc IS NULL OR rpet_meltin_mc = '') THEN '0' WHEN rpet_meltin_mc LIKE '%[^0-9./%]%' THEN '-100'WHEN rpet_meltin_mc LIKE '%%'  THEN REPLACE(rpet_meltin_mc, '%', '')  ELSE rpet_meltin_mc END), 0)"
        overwrite: true
      - column: virgin_mc
        expression: "COALESCE((CASE WHEN (virgin_mc IS NULL OR virgin_mc = '')  THEN '0'  WHEN virgin_mc LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_mc LIKE '%%' THEN REPLACE(virgin_mc, '%', '') ELSE virgin_mc END) , 0)"
        overwrite: true
      - column: plant_pet_mc
        expression: "COALESCE(plant_pet_mc, 0)"
        overwrite: true
      - column: preform_additive_mc
        expression: "COALESCE(preform_additive_mc, 0)"
        overwrite: true

