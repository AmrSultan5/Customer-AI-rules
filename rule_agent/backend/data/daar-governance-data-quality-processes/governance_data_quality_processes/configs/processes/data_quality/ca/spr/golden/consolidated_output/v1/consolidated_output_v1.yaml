  - kind: add
    name: add_flags_A
    context_name: select_a1
    params:
     - column: dq_flag_output
       expression: "CASE WHEN class_group_completeness_flag = '4' THEN '' ELSE class_group_completeness_flag END"
     - column: dq_message_output
       expression: "CASE WHEN class_group_completeness_flag = '1' THEN 'OK' WHEN class_group_completeness_flag = '0' THEN 'Missing class in the Classification' WHEN class_group_completeness_flag = '4' THEN 'N/A - No purchasing data' ELSE 'N/A' END"
     - column: quality_category
       expression: '''Completeness'''
