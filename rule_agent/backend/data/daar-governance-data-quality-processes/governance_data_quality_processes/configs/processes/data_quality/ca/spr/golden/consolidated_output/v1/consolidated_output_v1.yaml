        overwrite: true
      - column: virgin_cl2
        expression: "COALESCE((CASE WHEN (virgin_cl2 IS NULL OR virgin_cl2 = '')  THEN '0'  WHEN virgin_cl2 LIKE '%[^0-9./%]%' THEN '-100' WHEN virgin_cl2 LIKE '%%' THEN REPLACE(virgin_cl2, '%', '') ELSE virgin_cl2 END) , 0)"
        overwrite: true
      - column: plant_pet_cl2
        expression: "COALESCE(plant_pet_cl2, 0)"
        overwrite: true
      - column: preform_additive_cl2
        expression: "COALESCE(preform_additive_cl2, 0)"
        overwrite: true
