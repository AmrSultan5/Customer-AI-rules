        WHEN sales_org_code != '0001' AND material_group_code != '1110000' AND material_type_code = 'ZFGC' AND valuation_class_code = '1145' AND general_item_category_group_code = 'ZCVC' AND brand_code = 'COJ' AND account_assignment_group_code != 'L5' THEN '0'
