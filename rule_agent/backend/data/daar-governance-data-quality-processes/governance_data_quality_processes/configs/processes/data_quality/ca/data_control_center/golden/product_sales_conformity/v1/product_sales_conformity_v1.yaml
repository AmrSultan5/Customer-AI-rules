#JOIN pso and pg
  - kind: join
    name: join_pso_pg
    context_name: select_pso
    params:
      - other:
          select_pg
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#JOIN pct, pso and pg
  - kind: join
    name: join_pct_pso_pg
    context_name: select_pct
    params:
      - other:
          select_pso
        how:
          inner
        columns:
          material_code: material_code
          country_code: country_code
          sap_cluster: sap_cluster
      - other:
          select_pg
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#JOIN pso, pg and pv
  - kind: join
    name: join_pso_pg_pv
    context_name: select_pso
    params:
      - other:
          select_pg
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_pv
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

#RULE RPCONF_149.1
  - kind: add
    name: add_rpconf_149_1
    context_name: join_pso_pg
    params:
      - column: rule_code
        expression: "'RPCONF_149.1'"
      - column: check_status
        expression: "CASE WHEN material_description LIKE '%ABP%' THEN '' WHEN account_assignment_group_code is null OR account_assignment_group_code = '' THEN '' 
        WHEN sales_org_code != '0001' AND material_group_code != '1110000' AND material_type_code = 'ZFGC' AND general_item_category_group_code = 'ZCVP' AND brand_code = 'COJ' AND account_assignment_group_code = 'K1' THEN '1' 
        WHEN sales_org_code != '0001' AND material_group_code != '1110000' AND material_type_code = 'ZFGC' AND general_item_category_group_code = 'ZCVP' AND brand_code = 'COJ' AND account_assignment_group_code != 'K1' THEN '0'
        ELSE '' END"
      - column: plant_code
        expression: "cast (null as string)"

  - kind: select
    name: select_rpconf_149_1_final
    context_name: add_rpconf_149_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        account_assignment_group_code: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

#RULE RPCONF_149.2
  - kind: add
    name: add_rpconf_149_2
    context_name: join_pso_pg_pv
    params:
      - column: rule_code
        expression: "'RPCONF_149.2'"
      - column: check_status
        expression: "CASE WHEN material_description LIKE '%ABP%' THEN '' WHEN (account_assignment_group_code is null OR account_assignment_group_code = '') THEN ''
        WHEN sales_org_code != '0001' AND material_group_code != '1110000' AND material_type_code = 'ZFGC' AND valuation_class_code = '1120' AND general_item_category_group_code = 'ZCVI' AND brand_code = 'COJ' AND account_assignment_group_code = 'K1' THEN '1'
        WHEN sales_org_code != '0001' AND material_group_code != '1110000' AND material_type_code = 'ZFGC' AND valuation_class_code = '1120' AND general_item_category_group_code = 'ZCVI' AND brand_code = 'COJ' AND account_assignment_group_code != 'K1' THEN '0'
        ELSE '' END"
      - column: plant_code
