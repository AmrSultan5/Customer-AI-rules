        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l3_code: product_hierarchy_l3_code
        product_hierarchy_l4_code: product_hierarchy_l4_code
        product_hierarchy_l5_code: product_hierarchy_l5_code
        account_assignment_group_code: account_assignment_group_code
        distribution_channel_code: distribution_channel_code
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        pack_size_name: pack_size_name
        pack_size_volume_unified: pack_size_volume_unified
        sales_unit_code: sales_unit_code
        promotion_flag: promotion_flag
        item_category_group_code: item_category_group_code
        sales_org_code: sales_org_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dpso
    context_name: filter_sales_org
    params:
      columns:
        material_code: material_code
        sales_org_code: sales_org_code_so
        country_code: country_code_so
        sales_unit_code: sales_unit_code_so
        distribution_channel_code: distribution_channel_code
        ss_sm_flag: ss_sm_flag
        brand_code: brand_code
        flavour_code: flavour_code
        pack_type_code: pack_type_code
        pack_size_code: pack_size_code
        account_assignment_group_code: account_assignment_group_code
        product_hierarchy_code: product_hierarchy_code
        product_hierarchy_l4_code: product_hierarchy_l4_code
        pack_size_uom_unified: pack_size_uom_unified
        pack_size_volume_unified: pack_size_volume_unified
        pack_size_name: pack_size_name
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dpso_0001
    context_name: select_dpso
    params:
      - condition:
          sales_org_code_so = '0001'

  - kind: select
    name: select_dpso_0001
    context_name: filter_dpso_0001
    params:
      columns:
        material_code: material_code_0001
        brand_code: brand_code_0001
        product_hierarchy_l4_code: product_hierarchy_l4_code_0001
        country_code_so: country_code_0001
        sap_cluster: sap_cluster_0001
      distinct: true

  - kind: filter
    name: filter_dpso_no_0001
    context_name: select_dpso
    params:
      - condition:
          sales_org_code_so != '0001'

  - kind: select
