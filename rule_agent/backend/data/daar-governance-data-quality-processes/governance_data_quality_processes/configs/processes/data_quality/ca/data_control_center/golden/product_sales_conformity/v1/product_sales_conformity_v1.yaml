#RULE RPCONF_199.9
  - kind: add
    name: add_rpconf_199_9
    context_name: join_pso_pg
    params:
      - column: rule_code
        expression: "'RPCONF_199.9'"
      - column: check_status
        expression: if(material_description LIKE '%ABP%', '',
                    if(item_category_group_code is null OR item_category_group_code = '' OR material_type_code NOT IN ('ZSPS') OR distribution_channel_code NOT IN ('02','04'), '', 
                    if((distribution_channel_code IN ('02') AND item_category_group_code IN ('ZSPS')) OR (distribution_channel_code IN ('04') AND item_category_group_code IN ('ZCSM')), '1', '0')))
      - column: plant_code
        expression: "cast (null as string)"
      - column: value_checked_concat
        expression: if(distribution_channel_code IN ('02','04'), distribution_channel_code ||'_'|| item_category_group_code, '')

  - kind: group
    name: group_199_9
    context_name: add_rpconf_199_9
    params:
      - aggs:
          value_checked_concat: collect_set
          check_status: max
        by:
        - rule_code
        - material_code
        - sap_cluster
        - plant_code
        - country_code
        - sales_org_code
 
  - kind: add
    name: add_199_9_sort_set
    context_name: group_199_9
    params:
      - column: sorted_value_checked_concat
        expression: sort_array(collect_set_value_checked_concat)

  - kind: add
    name: add_value_checked
    context_name: add_199_9_sort_set
    params:
      - column: value_checked_ws
        expression: concat_ws('; ', sorted_value_checked_concat)
      - column: value_checked
        expression: if(substr(value_checked_ws,1,2) = '; ', substr(value_checked_ws,3), value_checked_ws)

  - kind: select
    name: select_rpconf_199_9_final
    context_name: add_value_checked
    params:
      columns:
        rule_code: rule_code
        max_check_status: check_status
        material_code: material_code
        value_checked: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
      distinct: true

