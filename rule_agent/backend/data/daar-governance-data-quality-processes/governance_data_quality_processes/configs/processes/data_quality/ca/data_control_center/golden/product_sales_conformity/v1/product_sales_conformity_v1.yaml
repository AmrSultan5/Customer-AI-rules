transform:
  name: product_sales_conformity
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions
#READ dm_product_plant
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant
      
  - kind: select
    context_name: read_dm_product_plant
    name: select_pp
    params:
      columns:
        material_status_code: material_status_code_pp
        material_code: material_code
        country_code: country_code_pp
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_product_plant
    params:
      - condition:
          material_status_code_pp IN ('', '98')

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_uom
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_uom

  - kind: select
    context_name: read_dm_product_uom
    name: select_dm_product_uom
    params:
      columns:
        material_code: material_code
        alternative_unit_of_measure_code: alternative_unit_of_measure_code
        conversion_numerator: conversion_numerator
        conversion_denominator: conversion_denominator
        sap_cluster: sap_cluster
      distinct: true 

#READ conf_energy_segment_mapping
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_energy_segment_mapping
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_energy_segment_mapping

  - kind: select
    context_name: read_conf_energy_segment_mapping
    name: select_conf_esm
    params:
      columns:
        bp_code: bp_code
        segment: segment
        zero: zero
        regular: regular
      distinct: true 

#READ dm_product_general
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general

  - kind: filter
    name: filter_general
    params:
      - condition:
          is_basic_scope = '1'
 
  - kind: select
    context_name: filter_general
    name: select_pg
    params:
      columns:
        material_code: material_code
        ban_code: ban_code
        bpp_code: bpp_code
        bpp_bp_code: bpp_bp_code
        material_type_code: material_type_code
        material_group_code: material_group_code
        material_description: material_description
        material_type_name_unified: material_type_name_unified
        general_item_category_group_code: general_item_category_group_code
        old_material_code: old_material_code
        sap_cluster: sap_cluster
      distinct: true


#READ dm_product_sales_organization
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
