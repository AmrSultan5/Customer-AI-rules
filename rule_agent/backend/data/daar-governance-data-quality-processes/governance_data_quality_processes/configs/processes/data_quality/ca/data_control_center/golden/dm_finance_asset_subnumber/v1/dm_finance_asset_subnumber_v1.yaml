transform:
  name: dm_finance_asset_subnumber
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

# Read ANLA

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_anla
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: sap_s4hana
      namespace: finance
      object_name: anla

  - kind: filter
    name: filter_anla
    params:
      - condition:
          spras = 'E'

  - kind: group
    name: group_max_aktiv
    params:
      - aggs:
          aktiv: max
        by:
        - anln1
        - anln2
        - txt50
        - bukrs
        - anlkl
        - aktiv
        - sap_cluster


  - kind: select
    name: select_anla
    params:
      columns:
        anln1: anln1
        anln2: anln2
        txt50: txt50
        bukrs: bukrs
        anlkl: anlkl
        max_aktiv: aktiv
        sap_cluster: sap_cluster_anla
      distinct: true


  - kind: select
    name: select_final
    params:
      columns:
        anln1: asset_number
        anln2: asset_subnumber
        txt50: asset_subnumber_description
        bukrs: company_code
        anlkl: asset_class
        aktiv: asset_capitalization_date
        sap_cluster_anla: sap_cluster
      distinct: true

  - kind: write_dataio
    name: write_dm_finance_asset_subnumber
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_finance_asset_subnumber
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full
