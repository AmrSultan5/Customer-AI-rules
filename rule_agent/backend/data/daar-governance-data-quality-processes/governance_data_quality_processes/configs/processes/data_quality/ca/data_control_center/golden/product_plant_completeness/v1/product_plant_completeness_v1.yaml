  - kind: union
    name: union_product_plant_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rpcomp_245_1_final

  - kind: add
    name: add_final
    params:
      - column: check_date
        expression: current_timestamp()

  - kind: select
    name: select_final
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        value_checked: value_checked
        country_code: country_code
        sap_cluster: sap_cluster
        plant_code: plant_code
        sales_org_code: sales_org_code
        check_date: check_date
      distinct: true

  - kind: write_dataio
    name: write_product_plant_completeness
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: product_plant_completeness
      process_run_id: '{{process_run_id}}'
      schema_version: v1
      refresh_mode: full