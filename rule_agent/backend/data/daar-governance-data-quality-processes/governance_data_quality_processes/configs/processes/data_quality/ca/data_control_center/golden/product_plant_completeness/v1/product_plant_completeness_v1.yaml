    name: union_product_plant_completeness
    context_name: select_rpcomp_102_1_final
    params:
      allow_missing: false
      by_name: true
      other: select_rpcomp_148_1_final

  - kind: union
    name: union_product_plant_completeness
    params:
      allow_missing: false
      by_name: true
      other: select_rpcomp_42_2_final

  - kind: union
