        plant_code: plant_code_ws
        warehouse_number: warehouse_number
        sap_cluster: sap_cluster_ws
      distinct: true

  - kind: select
    name: rpcomp_245_1_dm_product_warehouse_storage_location_t32
    context_name: read_dm_product_warehouse_storage_location
    params:
      columns:
        plant_code: plant_code_t32
        sap_cluster: sap_cluster_t32
      distinct: true
  - kind: join
    name: rpcomp_245_1
    context_name: rpcomp_245_1_dm_product_general
    params:
      - other:
          rpcomp_245_1_dm_product_plant
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster
      - other:
          select_dpso_leo
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: join
    name: rpcomp_245_1_a
    context_name: rpcomp_245_1
    params:
      - other:
          rpcomp_245_1_dm_product_warehouse_storage_location_t32
        how:
          inner
        columns:
          plant_code: plant_code_t32
          sap_cluster: sap_cluster_t32

  - kind: join
    name: rpcomp_245_1
    context_name: rpcomp_245_1_a
    params:
      - other:
          rpcomp_245_1_dm_product_warehouse_storage_location
        how:
          left
        columns:
          material_code: material_code
          plant_code: plant_code_ws
          sap_cluster: sap_cluster_ws
  - kind: add
    name: rpcomp_245_1
    params:
      - column: sales_org_code
        expression: "''"
      - column: rule_code
        expression: "'RPCOMP_245.1'"
      - column: check_status
        expression: "CASE WHEN material_group_code = '1110000' OR material_type_code NOT IN ('ZFGP', 'ZFG', 'ZFGS', 'ZFGA', 'ZFGC') OR general_item_category_group_code IN ('ZCVP', 'ZSNK') OR material_status_code NOT IN ('98', '') OR plant_code_t32 IS NULL OR plant_code_t32 = '' THEN '' WHEN warehouse_number IS NOT NULL AND warehouse_number <> '' THEN '1' ELSE '0' END"
  - kind: cast
