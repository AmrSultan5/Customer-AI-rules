          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

#SELECT rcconf_383_5
  - kind: select
    name: select_rcconf_383_5
    context_name: join_cso_dcg
    params:
      columns:
        customer_code: customer_code
        latitude: latitude
        longitude: longitude
        account_group_code: account_group_code
        sale_org_code: sale_org_code
      distinct: true   

  - kind: add
    name: add_rcconf_383_5
    context_name: select_rcconf_383_5
    params:
      - column: rule_code
        expression: "'RCCONF_383.5'"
      - column: latitude_cast
        expression: "CAST(latitude as DECIMAL(15,6))"            
      - column: longitude_cast
        expression: "CAST(longitude as DECIMAL(15,6))"          
      - column: check_status
        expression: if(account_group_code like '7%' or longitude_cast is null or longitude_cast='' or latitude_cast is null or latitude_cast='' 
                    OR sale_org_code IN('3801', '3802', '3803', '3804', '3805', '3806', '3890',  '3600', '9600', '9400', '4700') 
                    OR INT(longitude_cast)= 0 OR INT(latitude_cast)= 0 OR latitude_cast = longitude_cast, '',
                    if(latitude_cast < longitude_cast, '0', 
                    if(latitude_cast > longitude_cast, '1', '')))
      - column: value_checked
        expression: CONCAT(latitude_cast,'_',longitude_cast) 

  - kind: select
    name: select_rcconf_383_5_final
    context_name: add_rcconf_383_5
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true 

#READ conf_special_characters
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_special_characters
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_special_characters

  - kind: filter
    context_name: read_conf_special_characters
    name: filter_conf_special_characters
    params:
      - condition:
          rule_code = 'RCCONF_18.2' AND CAST(value AS STRING) != '0'

  - kind: add
    name: add_address_rule
    context_name: select_ca
    params:
      - column: rule_code
        expression: "'RCCONF_18.2'"

  - kind: add
    name: add_conf_special_characters
    context_name: filter_conf_special_characters
    params:
      - column: rule_code
        expression: "'RCCONF_18.2'"
      - column: rcconf_18_2
        expression: "CAST(value AS STRING)"

  - kind: select
    name: select_conf_special_characters
    context_name: add_conf_special_characters
    params:
      columns:
        rule_code: rule_code
        character: character
        rcconf_18_2: rcconf_18_2
      distinct: true
   
  - kind: join
    name: join_dcg_dca_csc
    context_name: select_dcg
    params:
      - other:
          add_address_rule
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_conf_special_characters
        how:
          left
        columns:
          rule_code: rule_code

#SELECT rcconf_18_2
  - kind: select
    name: select_rcconf_18_2
    context_name: join_dcg_dca_csc
    params:
      columns:
        customer_code: customer_code
        street_1_name: street_1_name
        rule_code: rule_code
        character: character
        rcconf_18_2: rcconf_18_2
      distinct: true

#RULE 18_2
  - kind: add
    name: add_rcconf_18_2
    context_name: select_rcconf_18_2
    params:
      - column: r_code
        expression: "'RCCONF_18.2'"
      - column: check_val
        expression: "street_1_name"
      - column: check_status
        expression: "CASE WHEN check_val is null OR check_val = '' THEN '' WHEN INSTR(check_val, character) > 0 AND rcconf_18_2 = '1' THEN '0' WHEN INSTR(check_val, concat(character,'',character)) > 0  AND rcconf_18_2 = '2' THEN '0' WHEN MOD(LENGTH(check_val) - LENGTH(REPLACE(check_val, chr(34), '')), 2) <> 0 THEN '0' WHEN MOD(LENGTH(check_val) - LENGTH(REGEXP_REPLACE(check_val, '[()]', '')), 2) <> 0 OR INSTR(check_val, '(') > INSTR(check_val, ')') THEN '0' WHEN MOD(LENGTH(check_val) - LENGTH(REGEXP_REPLACE(check_val, '[{}]', '')), 2) <> 0 OR INSTR(check_val, '{') > INSTR(check_val, '}') THEN '0' WHEN MOD(LENGTH(check_val) - LENGTH(REPLACE(REPLACE(check_val, chr(91), ''), chr(93), '')), 2) <> 0 OR INSTR(check_val, chr(91)) > INSTR(check_val, chr(93)) THEN '0' ELSE '1' END"

  - kind: group
    name: aggregation_rcconf_18_2
    context_name: add_rcconf_18_2
    params:
      - aggs:
          check_status: min
        by:
        - customer_code
        - r_code
        - check_val

  - kind: select
    name: select_rcconf_18_2_final
    context_name: aggregation_rcconf_18_2
    params:
      columns:
        r_code: rule_code
        min_check_status: check_status
        customer_code: customer_code
        check_val: value_checked
      distinct: true 

#RULE rcconf_22_2
  - kind: filter
    context_name: read_conf_special_characters
    name: filter_conf_special_characters_22_2
    params:
      - condition:
          rule_code = 'RCCONF_22.2' AND CAST(value AS STRING) != '0'

  - kind: add
