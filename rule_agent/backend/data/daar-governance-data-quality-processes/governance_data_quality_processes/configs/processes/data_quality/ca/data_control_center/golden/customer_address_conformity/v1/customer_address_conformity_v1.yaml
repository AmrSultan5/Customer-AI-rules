  - kind: group
    name: aggregation_rcconf_22_2
    context_name: add_rcconf_22_2
    params:
      - aggs:
          check_status: min
        by:
        - customer_code
        - r_code
        - check_val

  - kind: select
    name: select_rcconf_22_2_final
    context_name: aggregation_rcconf_22_2
    params:
      columns:
        r_code: rule_code
        min_check_status: check_status
        customer_code: customer_code
        check_val: value_checked
