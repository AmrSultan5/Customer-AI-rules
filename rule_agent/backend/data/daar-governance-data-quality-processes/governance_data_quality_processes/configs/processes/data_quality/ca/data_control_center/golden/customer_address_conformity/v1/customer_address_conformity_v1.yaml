  - kind: add
    name: add_rcconf_383_4
    context_name: select_rcconf_383_4
    params:
      - column: rule_code
        expression: "'RCCONF_383.4'"
      - column: check_status
        expression: "CASE WHEN account_group_code like '7%' or latitude is null or latitude='' OR INT(latitude)= 0 or longitude is null or longitude='' OR INT(longitude)= 0 THEN '' WHEN latitude=longitude THEN '0' ELSE '1' END"
      - column: value_checked
        expression: CONCAT(latitude,'_',longitude)

  - kind: select
    name: select_rcconf_383_4_final
    context_name: add_rcconf_383_4
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        value_checked: value_checked
      distinct: true 

#JOIN rcconf_22.4 rcconf_23.1
  - kind: join
    name: join_ca_dcg
    context_name: select_ca
    params:
      - other:
          select_dcg
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
  - kind: select
    name: select_rcconf_22_4
    context_name: join_ca_dcg
    params:
      columns:
        customer_code: customer_code
        city: city
        country_code: country_code
      distinct: true   

  - kind: add
    name: add_rcconf_22_4
    context_name: select_rcconf_22_4
    params:
      - column: rule_code
        expression: "'RCCONF_22.4'"
      - column: check_status
        expression: if(isnull(city) or city = '', '', 
                    if(upper(city) = 'GENÈVE 15 AÉROPORT', '1', 
                    if(upper(city) like '%PRAH%' or upper(city) like '%BRATISLAVA%', '1', 
                    if(upper(city) IN ('2 MAI', '1 DECEMBRIE', '1 MAI', 'MILA 23', '23 AUGUST','BAILE 1 MAI'), '1',
                    if(upper(city) IN ('ВЕЛИКА ДИМЕРКА А/Д М-01 К-Ч.-Н.-ЯР.', 'ВІН.ЛЬВІВСЬКЕ Ш. А/Д М-21 ВИС.-ЖИ.-', 'ХМЕЛ.Р-Н,РОЗСОШАНСЬКА ТГ,АВТОД.Н-03'), '1',
                    if(country_code = 'NG' and regexp(upper(city), '^(JAHI|KURUDUMA|SABURI|TASHA|UMUEBULU|LEKKI PHASE|GRA|KUBWA|IDANYIN BY CELE|BAWAK)[ ]*[0-9]+$'),'1', if(regexp(city,'.*[0-9]+'), '0', '1')))))))
  - kind: select
    name: select_rcconf_22_4_final
    context_name: add_rcconf_22_4
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        city: value_checked
      distinct: true

