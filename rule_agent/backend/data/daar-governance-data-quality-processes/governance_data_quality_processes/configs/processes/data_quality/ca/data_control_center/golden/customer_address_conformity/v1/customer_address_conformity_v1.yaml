      - column: latitude_cast
        expression: "CAST(latitude as DECIMAL(15,6))"            
      - column: check_status
        expression: "CASE WHEN account_group_code like '7%' THEN '' WHEN latitude_cast is null or latitude_cast='' THEN '' WHEN INT(latitude_cast) IN(0.0,0.000,0) THEN '0' ELSE '1' END"

  - kind: select
    name: select_rcconf_384_3_final
    context_name: add_rcconf_384_3
    params:
      columns:
        rule_code: rule_code
