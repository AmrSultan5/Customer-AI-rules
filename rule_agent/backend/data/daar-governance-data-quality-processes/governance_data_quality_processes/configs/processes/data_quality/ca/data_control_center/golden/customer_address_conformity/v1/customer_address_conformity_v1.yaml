transform:
  name: customer_address_conformity
  operations:     
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

#READ dm_customer_general
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: select
    context_name: read_dm_customer_general
    name: select_dcg
    params:
      columns:
        customer_code: customer_code
        longitude: longitude
        latitude: latitude
        account_group_code: account_group_code
        central_order_block_code: central_order_block_code
        sap_cluster: sap_cluster
      distinct: true        

#READ dm_customer_address
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_address
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_address

  - kind: select
    context_name: read_dm_customer_address
    name: select_ca
    params:
      columns:
        customer_code: customer_code
        address_number: address_number
        longitude: longitude_address
        latitude: latitude_address
        city: city
        city_translit: city_translit
        country_code: country_code
        is_allowed_country_code: is_allowed_country_code
        street_1_name: street_1_name
        street_1_name_translit: street_1_name_translit
        house_number: house_number
        post_code: post_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_rcconf_383_1
    context_name: select_dcg
    params:
      columns:
        customer_code: customer_code
        longitude: longitude
        account_group_code: account_group_code
      distinct: true   

  - kind: add
    name: add_rcconf_383_1
    context_name: select_rcconf_383_1
    params:
      - column: rule_code
        expression: "'RCCONF_383.1'"
      - column: longitude_cast
        expression: "CAST(longitude as DECIMAL(15,6))"            
      - column: check_status
        expression: "CASE WHEN account_group_code like '7%' THEN '' WHEN longitude_cast is null or longitude_cast='' THEN '' WHEN int(longitude_cast) = 0 THEN '' WHEN (LENGTH(longitude_cast)=9 AND INSTR(longitude_cast,'.')=3) OR (LENGTH(longitude_cast)=10 AND INSTR(longitude_cast,'.')=4 AND INSTR(longitude_cast,'-')=1) OR (LENGTH(longitude_cast)=8 AND INSTR(longitude_cast,'.')=2) OR (LENGTH(longitude_cast)=9 AND INSTR(longitude_cast,'.')=3 AND INSTR(longitude_cast,'-')=1) OR (LENGTH(longitude_cast)=10 AND INSTR(longitude_cast,'.')=4) OR (LENGTH(longitude_cast)=11 AND INSTR(longitude_cast,'.')=5 AND INSTR(longitude_cast,'-')=1) THEN '1' ELSE '0' END "


  - kind: select
    name: select_rcconf_383_1_final
    context_name: add_rcconf_383_1
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        longitude_cast: value_checked
      distinct: true  

#SELECT rcconf_384_3
  - kind: select
    name: select_rcconf_384_3
    context_name: select_dcg
    params:
      columns:
        customer_code: customer_code
        latitude: latitude
        account_group_code: account_group_code
      distinct: true   

  - kind: add
    name: add_rcconf_384_3
    context_name: select_rcconf_384_3
