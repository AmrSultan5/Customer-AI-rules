#########################

  - kind: add
    name: add_dq_subcontracting_flag
    context_name: join_group_production_version_valid_to_date
    params:                                        
      - column: dq_subcontracting_flag
        expression: CASE WHEN info_record_category_code_pi = '0' OR dq_pir_validity_flag != '1' OR procurement_alternative_process_category_mpa != 'BL' THEN ''
                    WHEN (info_record_category_code_pi IS NULL OR info_record_category_code_pi = '') AND (dq_pir_validity_flag IS NULL OR dq_pir_validity_flag = '') THEN ''
                    WHEN dq_pir_validity_flag = '1' AND info_record_category_code_pi = '3' THEN (CASE WHEN sum_mixing_ratio_mpa != 100 THEN '2' 
                    WHEN procurement_alternative_process_category_mpa = 'BL' AND production_version_pi NOT LIKE 'X%' THEN '3'  
                    WHEN (material_code_pv1 IS NULL OR material_code_pv1 = '') THEN '4'
                    WHEN count_production_version_valid_to_date_pv1 = count_production_version_valid_to_date_pv1_all THEN '5'
                    WHEN (production_version_lock_pv1 IS NOT NULL AND production_version_lock_pv1 != '') THEN '6'
                    WHEN (production_version_check_status_pv1 IS NULL OR production_version_check_status_pv1 = '') AND (production_version_last_check_date_pv1 IS NULL OR production_version_last_check_date_pv1 = '') THEN '7'
                    WHEN (bom_number_b IS NULL OR bom_number_b = '') THEN '8'
                    WHEN bom_material_status_b = '2' THEN '9' 
                    WHEN bom_item_link_deletion_flag_b = 'X' OR bom_deletion_flag_b = 'X' THEN '10'
                    WHEN (material_code_tl IS NULL OR material_code_tl = '') THEN '11'
                    WHEN deletion_flag_tl = 'X' THEN '12'
                    WHEN  (material_code_pv2 IS NULL OR material_code_pv2 = '') THEN '13'
                    ELSE '1' END) ELSE '' END                   

