        - plant_code_mpa
        - sap_cluster_mpa

  - kind: group
    name: group_filter_production_version_valid_to_date_all
    context_name: join_group_subcontracting_mixing_ratio_count
    params:
      - aggs:
          production_version_valid_to_date_pv1: count
