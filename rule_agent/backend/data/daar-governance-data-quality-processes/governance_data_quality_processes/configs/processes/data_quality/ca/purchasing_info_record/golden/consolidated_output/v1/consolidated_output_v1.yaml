###DETAILED

  - kind: add
    name: add_pir_subcontracting_version
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''PIR subcontracting version'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN dq_subcontracting_flag = '' THEN 'N/A'
                    WHEN dq_subcontracting_flag = '1' THEN 'OK'
                    WHEN dq_subcontracting_flag = '2' THEN 'Invalid Mixing Ratio'
                    WHEN dq_subcontracting_flag = '3' THEN 'No suitable or assigned subcontracting Production Version'
                    WHEN dq_subcontracting_flag = '4' THEN 'Missing Subcontracting Version'
                    WHEN dq_subcontracting_flag = '5' THEN 'Version is not valid'
                    WHEN dq_subcontracting_flag = '6' THEN 'Version is locked'
                    WHEN dq_subcontracting_flag = '7' THEN 'Missing check date in PV'
                    WHEN dq_subcontracting_flag = '8' THEN 'Missing BOM for subcontracting version'
                    WHEN dq_subcontracting_flag = '9' THEN 'BOM is inactive for subcontracting version'
                    WHEN dq_subcontracting_flag = '10' THEN 'BOM is blocked for Subcontracting version'
                    WHEN dq_subcontracting_flag = '11' THEN 'Routing is missing for Subcontracting Version'
                    WHEN dq_subcontracting_flag = '12' THEN 'Routing is locked'
                    WHEN dq_subcontracting_flag = '13' THEN 'Routing is missing for Subcontracting Version MKAL' END
      - column: dq_flag_output
        expression: CASE WHEN dq_subcontracting_flag IN ('', '1') THEN dq_subcontracting_flag ELSE '0' END

  - kind: add
    name: add_scale
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Scale'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN dq_scale_flag = '1' THEN 'OK' WHEN dq_scale_flag = '0' THEN 'Error in scales' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_scale_flag

  - kind: add
    name: add_mixing_ratio
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Mixing Ratio'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN dq_block_pir_status = '0' THEN 'Missing PIR – N/A' WHEN dq_mixing_ratio_flag = '0' THEN 'Missing MR' WHEN dq_block_pir_status = '1' THEN 'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_mixing_ratio_flag

  - kind: add
    name: add_purchasing_info_record
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Purchasing Info Record'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN dq_pir_completeness_flag = '0' THEN 'Missing PIR' WHEN dq_pir_completeness_flag = '1' THEN'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_pir_completeness_flag

  - kind: add
    name: add_pir_status
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''PIR Status'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN dq_pir_status_flag  = '0' THEN 'Blocked PIR'
                    WHEN dq_pir_status_flag  = '2' THEN 'Blocked in EINE - sugg.Gen.Block ' || sap_cluster
                    WHEN dq_pir_status_flag  = '3' then 'Blocked in EINA ' || sap_cluster
                    WHEN dq_pir_status_flag  = '1' THEN 'OK'
                    ELSE 'N/A' END
      - column: dq_flag_output
        expression: CASE WHEN dq_pir_status_flag IN ('2','3') THEN '0' ELSE dq_pir_status_flag END

  - kind: add
    name: add_pir_validity
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''PIR Validity'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN dq_block_pir_status = '0' THEN 'Missing PIR – N/A' WHEN dq_pir_validity_flag = '0' THEN 'No active PIR for current period' WHEN dq_pir_validity_flag = '1' THEN 'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_pir_validity_flag

  - kind: add
    name: add_pir_category
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''PIR Category'''
      - column: quality_category
        expression: '''Accuracy'''
      - column: dq_message_output
        expression: CASE WHEN dq_block_pir_status = '0' THEN 'Missing PIR – N/A' WHEN dq_pir_category_flag = '0' THEN 'Wrong PIR category & PA type' WHEN dq_pir_category_flag = '1' THEN 'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_pir_category_flag

  - kind: add
    name: add_buom
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''BUoM'''
      - column: quality_category
        expression: '''Consistency'''
      - column: dq_message_output
        expression: CASE WHEN dq_block_pir_status = '0' THEN 'Missing PIR – N/A' WHEN dq_uom_flag = '0' THEN 'Inconsistent OPU and BUoM' WHEN dq_uom_flag = '1' THEN 'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_uom_flag


  - kind: add
    name: add_certificate_category
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Certificate Category'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN dq_block_pir_status = '0' THEN 'Missing PIR – N/A' 
                    WHEN dq_cert_category_flag = '2' THEN 'OK' 
                    WHEN dq_cert_category_flag = '3' THEN 'Certificate category is missing, but PIR is used by another PO/Country' 
                    WHEN dq_cert_category_flag = '4' THEN 'Block PIR on PO level' 
                    WHEN dq_cert_category_flag = '5' THEN 'Missing Certificate Category prerequisite. Please check and revise' ELSE 'N/A' END
      - column: dq_flag_output
        expression: CASE WHEN dq_cert_category_flag  IN ('2','3') THEN '1' WHEN dq_cert_category_flag  IN ('4','5') THEN '0' ELSE dq_cert_category_flag  END


  - kind: add
    name: add_country_of_origin_status
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Country of origin status'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN dq_country_of_origin_completeness_flag = '0' THEN 'Missing country of origin' WHEN dq_country_of_origin_completeness_flag = '1' THEN 'OK' END
      - column: dq_flag_output
        expression: dq_country_of_origin_completeness_flag


  - kind: add
    name: add_commodity_code_status
    context_name: checkpoint_final_du
    params:
      - column: quality_type
        expression: '''Commodity Code Status'''
      - column: quality_category
        expression: '''Completeness'''
      - column: dq_message_output
        expression: CASE WHEN dq_comodity_code_flag = '0' THEN 'Missing commodity code in the prod.master' WHEN dq_comodity_code_flag = '1' THEN 'OK' ELSE 'N/A' END
      - column: dq_flag_output
        expression: dq_comodity_code_flag

  - kind: union
    name: union_pir_1
    context_name: add_pir_subcontracting_version
    params:
      allow_missing: false
      by_name: true
      other: add_scale

  - kind: union
    name: union_pir_2
    context_name: union_pir_1
    params:
      allow_missing: false
      by_name: true
      other: add_mixing_ratio

  - kind: union
    name: union_pir_3
    context_name: union_pir_2
    params:
      allow_missing: false
      by_name: true
      other: add_purchasing_info_record

  - kind: union
    name: union_pir_4
    context_name: union_pir_3
    params:
      allow_missing: false
      by_name: true
      other: add_pir_status

  - kind: union
    name: union_pir_5
    context_name: union_pir_4
    params:
      allow_missing: false
      by_name: true
      other: add_pir_validity


  - kind: union
    name: union_pir_6
    context_name: union_pir_5
    params:
      allow_missing: false
      by_name: true
      other: add_pir_category

  - kind: union
    name: union_pir_7
    context_name: union_pir_6
    params:
      allow_missing: false
      by_name: true
      other: add_buom

  - kind: union
    name: union_pir_8
    context_name: union_pir_7
    params:
      allow_missing: false
      by_name: true
      other: add_certificate_category

  - kind: union
    name: union_pir_9
    context_name: union_pir_8
    params:
      allow_missing: false
      by_name: true
      other: add_country_of_origin_status

  - kind: union
