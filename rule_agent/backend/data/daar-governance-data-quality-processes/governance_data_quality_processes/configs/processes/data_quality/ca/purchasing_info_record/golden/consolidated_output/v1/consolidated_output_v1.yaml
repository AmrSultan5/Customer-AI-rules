transform:
  name: du
  operations:

  - kind: read_dataio
    name: read_dm_material_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_plant
      schema_version: v3

  - kind: select
    name: select_mp
    context_name: read_dm_material_plant
    params:
      columns:
        material_code: material_code_mp
        plant_code: plant_code_mp
        procurement_type: procurement_type_mp
        country_code: country_code_mp
        country_code_of_origin: country_code_of_origin_mp
        material_status_code: material_status_code_mp
        do_not_cost_indicator: do_not_cost_indicator_mp    
        commodity_code: commodity_code_mp
        sap_cluster: sap_cluster_mp
      distinct: true           
      
  - kind: filter
    name: filter_mp
    context_name: select_mp
    params:
      - condition:
         material_status_code_mp NOT IN ('97', '98', '99', 'ZA', 'Z8','Z9') AND
         do_not_cost_indicator_mp <> 'X' AND
         procurement_type_mp IN ('E', 'F', 'X') AND
         plant_code_mp NOT IN ('5503')
         
########################################################

  - kind: read_dataio
    name: read_dm_material_procurement
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_procurement
      schema_version: v1
      
  - kind: select
    name: select_mpa
    context_name: read_dm_material_procurement
    params:
      columns:
        material_code: material_code_mpa
        plant_code: plant_code_mpa
        quantity_structure_type: quantity_structure_type_mpa
        posting_period: posting_period_mpa
        purchasing_organization_code: purchasing_organization_code_mpa
        procurement_alternative_process_category: procurement_alternative_process_category_mpa
        special_procurement_plant_code: special_procurement_plant_code_mpa
        vendor_code: vendor_code_mpa
        production_version: production_version_mpa
        bom_usage: bom_usage_mpa
        bom_alternative: bom_alternative_mpa
        mixing_ratio: mixing_ratio_mpa
        quantity_structure_type: quantity_structure_type_mpa
        fiscal_year: fiscal_year_mpa
        sap_cluster: sap_cluster_mpa
      distinct: true     
      
  - kind: add
    name: add_posting_period_filter
    context_name: select_mpa
    params:
      - column: posting_period_filter
        expression: "CASE WHEN SUBSTR(plant_code_mpa, 1, 2) != 49 AND posting_period_mpa = '0' THEN 'X' 
                    WHEN SUBSTR(plant_code_mpa, 1, 2) = 49 AND posting_period_mpa = MONTH(GETDATE()) THEN 'X'
                    ELSE ''
                    END"                       
      
  - kind: filter
    name: filter_mpa
    context_name: add_posting_period_filter
    params:
      - condition:
         fiscal_year_mpa = YEAR(current_date()) AND
         fiscal_year_mpa is not null AND
         quantity_structure_type_mpa IN ('ZZ02', 'ZZ01') AND
         posting_period_filter = 'X' AND
         procurement_alternative_process_category_mpa IN ('BL', 'BB')
         
         
 ########################################################

  - kind: read_dataio
    name: read_dm_material_valuation
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_valuation
      schema_version: v1
      
  - kind: select
    name: select_dv
    context_name: read_dm_material_valuation
    params:
      columns:
        material_code: material_code_dv
        plant_valuation_area: plant_valuation_area_dv
        valuation_class_code: valuation_class_code_dv
        price_control_flag: price_control_flag_dv
        sap_cluster: sap_cluster_dv
      distinct: true     
      
  - kind: filter
    name: filter_dv
    context_name: select_dv
    params:
      - condition:
         price_control_flag_dv = 'S' AND
         valuation_class_code_dv NOT IN ('0000','1990','2091','4099')
         
########################################################

  - kind: read_dataio
    name: read_dm_purchasing_info 
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_purchasing_info
      schema_version: v1
      
  - kind: select
    name: select_pi
    context_name: read_dm_purchasing_info 
    params:
      columns:
        material_code: material_code_pi
        plant_code: plant_code_pi
        purchasing_organization_code: purchasing_organization_code_pi
        condition_record_number: condition_record_number_pi
        production_version: production_version_pi
        general_deletion_flag: general_deletion_flag_pi
        purchase_org_deletion_flag: purchase_org_deletion_flag_pi
        purchasing_info_record: purchasing_info_record_pi
        vendor_code: vendor_code_pi
        certificate_category_code: certificate_category_code_pi
        info_record_category_code: info_record_category_code_pi
        order_price_unit_code: order_price_unit_code_pi
        valid_to_date: valid_to_date_pi
        vendor_code: vendor_pi
        price_valid_to_date: price_valid_to_date_pi
        sap_cluster: sap_cluster_pi
      distinct: true     
      
  - kind: filter
    name: filter_pi
    context_name: select_pi
    params:
      - condition:
         info_record_category_code_pi IN ('0','3') AND
         (price_valid_to_date_pi >= current_date() OR valid_to_date_pi >= current_date()) AND
         (purchase_org_deletion_flag_pi != 'X' OR general_deletion_flag_pi != 'X')

#######################################################

  - kind: read_dataio
    name: read_dm_material
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material
      schema_version: v6
      
  - kind: select
    name: select_m
    context_name: read_dm_material
    params:
      columns:
        material_code: material_code_m
        material_type_code: material_type_code_m
        material_group_code: material_group_code_m
        maintenance_status: maintenance_status_m
        unit_of_measure_code: unit_of_measure_code_m
        material_status: material_status_code_m
        sap_cluster: sap_cluster_m
      distinct: true     
      
  - kind: filter
    name: filter_m
    context_name: select_m
    params:
      - condition:
         material_type_code_m IN ('ZFG', 'ZFGA', 'ZFGC', 'ZFGM', 'ZFGP', 'ZFGS', 'ZMM', 'ZRW', 'ZRWT', 'ZSF', 'ZSFT') AND
         material_group_code_m <> '1110000' AND
         (maintenance_status_m LIKE '%B%' and maintenance_status_m LIKE '%G%') AND
         material_status_code_m NOT IN ('97', '98', '99', 'ZA', 'Z8','Z9')
         
 ########################################################

  - kind: read_dataio
    name: read_dm_conditions_scale
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_conditions_scale
      schema_version: v1
      
  - kind: select
    name: select_cs
    context_name: read_dm_conditions_scale
    params:
      columns:
        condition_record_number: condition_record_number_cs
        scale_quantity: scale_quantity_cs
        scale_number: scale_number_cs
        scale_rate: scale_rate_cs       
        sequence_number: sequence_number_cs  
        sap_cluster: sap_cluster_cs
      distinct: true     
      
 ########################################################

  - kind: read_dataio
    name: read_dm_bom
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_bom
      schema_version: v1
      
  - kind: select
    name: select_b
    context_name: read_dm_bom
    params:
      columns:
        material_code: material_code_b
        plant_code: plant_code_b
        bom_usage: bom_usage_b
        bom_alternative: bom_alternative_b
        bom_number: bom_number_b
        bom_material_status: bom_material_status_b
        bom_item_link_deletion_flag: bom_item_link_deletion_flag_b
        bom_item_link_counter: bom_item_link_counter_b
        bom_deletion_flag: bom_deletion_flag_b
        sap_cluster: sap_cluster_b
      distinct: true       

  - kind: filter
    name: filter_b
    context_name: select_b
    params:
      - condition:
         bom_usage_b = 1

  - kind: select
    name: select_b_before_grouped
    params:
      columns:
        material_code_b: material_code_b
        plant_code_b: plant_code_b
        bom_alternative_b: bom_alternative_b
        bom_item_link_counter_b: bom_item_link_counter_b
        sap_cluster_b: sap_cluster_b
      distinct: true    

  - kind: group
    name: grouped_b
    params:
      - aggs:
          bom_item_link_counter_b: max
        by:
        - material_code_b
        - plant_code_b
        - bom_alternative_b
        - sap_cluster_b

  - kind: join
    name: join_b_grouped_b
    context_name: filter_b
    params:
      - other:
          grouped_b
        how:
          left
        columns:
          material_code_b: material_code_b
          plant_code_b: plant_code_b
          bom_alternative_b: bom_alternative_b
          sap_cluster_b: sap_cluster_b

  - kind: filter
    name: filter_b_max_counter
    params:
      - condition:
         bom_item_link_counter_b = max_bom_item_link_counter_b

  - kind: select
    name: select_b_final
    params:
      columns:
        material_code_b: material_code_b
        plant_code_b: plant_code_b
        bom_usage_b: bom_usage_b
        bom_alternative_b: bom_alternative_b
        bom_number_b: bom_number_b
        bom_material_status_b: bom_material_status_b
        bom_item_link_deletion_flag_b: bom_item_link_deletion_flag_b
        bom_deletion_flag_b: bom_deletion_flag_b
        sap_cluster_b: sap_cluster_b
        max_bom_item_link_counter_b: max_bom_item_link_counter_b
      distinct: true    

########################################################

  - kind: read_dataio
    name: read_dm_material_production_versions
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_production_versions
      schema_version: v2
      
  - kind: select
    name: select_pv1
    context_name: read_dm_material_production_versions
    params:
      columns:
        material_code: material_code_pv1
        plant_code: plant_code_pv1
        group_counter: group_counter_pv1
        production_version: production_version_pv1
        task_list_number: task_list_number_pv1
        bom_alternative: bom_alternative_pv1
        production_version_valid_to_date: production_version_valid_to_date_pv1
        production_version_lock: production_version_lock_pv1
        production_version_check_status: production_version_check_status_pv1
        production_version_last_check_date: production_version_last_check_date_pv1
        sap_cluster: sap_cluster_pv1
      distinct: true     
      
  - kind: filter
    name: filter_pv1
    context_name: select_pv1
    params:
      - condition:
         production_version_pv1 LIKE 'X%'

########################################################

  - kind: read_dataio
    name: read_dm_material_task_lists
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: master_data_quality
      namespace: l2
      object_name: dm_material_task_lists
      schema_version: v1
      
  - kind: select
    name: select_tl
    context_name: read_dm_material_task_lists
    params:
      columns:
        material_code: material_code_tl
        plant_code: plant_code_tl
        group_counter: group_counter_tl
        task_list_number: task_list_number_tl
        deletion_flag: deletion_flag_tl
        sap_cluster: sap_cluster_tl
      distinct: true     

  - kind: add
    name: add_flags_1
    params:
      - column: task_list_number_code
        expression: regexp_extract(task_list_number_tl, '^[0-9]+', 0)   

  - kind: filter
    name: filter_tl
    params:
      - condition:
         task_list_number_code IS NOT NULL AND task_list_number_code != ''
         
########################################################
      
  - kind: select
    name: select_pv2
    context_name: read_dm_material_production_versions
    params:
      columns:
        material_code: material_code_pv2
        plant_code: plant_code_pv2
        bom_alternative: bom_alternative_pv2
        bom_usage: bom_usage_pv2
        group_counter: group_counter_pv2
        task_list_number: task_list_number_pv2
        sap_cluster: sap_cluster_pv2
      distinct: true     
      
 #############################################################################################################
 
  - kind: join
    name: join_m_mp_mpa_dv_pi
    context_name: filter_m
    params:
      - other:
          filter_mp
        how:
          inner
        columns:
          material_code_m: material_code_mp
          sap_cluster_m: sap_cluster_mp
      - other:
          filter_mpa
        how:
          inner
        columns:
          material_code_mp: material_code_mpa
          plant_code_mp: plant_code_mpa
          sap_cluster_mp: sap_cluster_mpa
      - other:
          filter_dv
        how:
          inner
        columns:
          material_code_mp: material_code_dv
          plant_code_mp: plant_valuation_area_dv
          sap_cluster_mp: sap_cluster_dv
      - other:
          filter_pi
        how:
          left
        columns:
          material_code_mp: material_code_pi
          plant_code_mp: plant_code_pi
          purchasing_organization_code_mpa: purchasing_organization_code_pi
          sap_cluster_mp: sap_cluster_pi

  - kind: join
    name: join_mpa_pi_as_mpa1
    context_name: filter_pi
    params:
      - other:
          filter_mpa
        how:
          left
        columns:
          material_code_pi: material_code_mpa
          plant_code_pi: plant_code_mpa
          vendor_pi: vendor_code_mpa
          sap_cluster_pi: sap_cluster_mpa

  - kind: select
    name: select_mpa_pi_as_mpa1
    params:
      columns:
        material_code_mpa: material_code_mpa_mpa1
        plant_code_mpa: plant_code_mpa_mpa1
        vendor_code_mpa: vendor_code_mpa_mpa1
        vendor_pi: vendor_pi_mpa1
        purchasing_info_record_pi: purchasing_info_record_mpa1
        purchasing_organization_code_mpa: purchasing_organization_code_mpa1
        sap_cluster_mpa: sap_cluster_mpa_mpa1
      distinct: true     

  - kind: join
    name: join_m_mp_mpa_dv_pi_mpa1
    context_name: join_m_mp_mpa_dv_pi
    params:
      - other:
          select_mpa_pi_as_mpa1
        how:
          left
        columns:
          material_code_mpa: material_code_mpa_mpa1
          plant_code_mpa: plant_code_mpa_mpa1
          vendor_pi: vendor_code_mpa_mpa1
          vendor_code_mpa: vendor_code_mpa_mpa1
          sap_cluster_mpa: sap_cluster_mpa_mpa1

  - kind: filter
    name: filter_pi_purchasing_is_not_null_v2
    params:
      - condition:        
         (purchasing_info_record_pi IS NULL OR purchasing_info_record_pi = '') OR (vendor_code_mpa_mpa1 IS NOT NULL AND vendor_code_mpa_mpa1 != '') 
 
###############################################################################################################
  
  - kind: add
    name: add_flags_1
    params:
      - column: dq_pir_completeness_flag
        expression: "CASE WHEN (purchasing_info_record_pi IS NULL OR purchasing_info_record_pi = '') THEN '0' 
                    ELSE '1' END"                    
      - column: dq_pir_status_flag
        expression: "CASE WHEN purchase_org_deletion_flag_pi  = 'X' AND general_deletion_flag_pi  != 'X' AND (purchasing_info_record_pi  IS NOT NULL AND purchasing_info_record_pi  !='') THEN '2'
                    WHEN purchase_org_deletion_flag_pi  != 'X' and general_deletion_flag_pi  = 'X' AND (purchasing_info_record_pi  IS NOT NULL AND purchasing_info_record_pi  != '') THEN '3'
                    WHEN (purchasing_info_record_pi  IS NULL OR purchasing_info_record_pi  = '') THEN ''
                    ELSE '1' END"
      - column: dq_country_of_origin_completeness_flag
        expression: "CASE WHEN (country_code_of_origin_mp IS NULL OR country_code_of_origin_mp = '') THEN '0'
                    ELSE '1' END"
      - column: dq_comodity_code_flag
        expression: "CASE WHEN (country_code_of_origin_mp IS NULL OR country_code_of_origin_mp = '') OR country_code_of_origin_mp = country_code_mp THEN ''
                    WHEN country_code_of_origin_mp <> country_code_mp AND (commodity_code_mp IS NOT NULL AND commodity_code_mp != '') THEN '1'
                    ELSE '0' END"
                    
  - kind: add
    name: add_dq_block_pir_status
    context_name: add_flags_1
    params:
      - column: dq_block_pir_status
        expression: "CASE WHEN dq_pir_completeness_flag = '1' AND dq_pir_status_flag = '1' THEN '1'
                    WHEN dq_pir_completeness_flag = '0' OR dq_pir_status_flag IN ('2', '3') THEN '0' 
                    ELSE '' END" 
########################################################################################################################################

  - kind: select
    name: select_cert_category
    context_name: add_dq_block_pir_status
    params:
      columns:
        purchasing_info_record_pi: purchasing_info_record_pi
        country_code_mp: country_code_mp
        sap_cluster_mp: sap_cluster_mp
      distinct: true     

  - kind: group
    name: group_cert_category
    params:
      - aggs:
          country_code_mp: count
        by:
        - purchasing_info_record_pi
        - sap_cluster_mp

  - kind: join
    name: join_m_mp_mpa_dv_pi_mpa1_cert_category
    context_name: add_dq_block_pir_status
    params:
      - other:
          group_cert_category
        how:
          left
        columns:
          purchasing_info_record_pi: purchasing_info_record_pi
          sap_cluster_mp: sap_cluster_mp
          
####################################################################################################
  - kind: add
    name: add_flags_2
    context_name: join_m_mp_mpa_dv_pi_mpa1_cert_category
    params:                    
      - column: dq_mixing_ratio_flag
        expression: "CASE WHEN dq_block_pir_status = '0' THEN '' 
                    WHEN mixing_ratio_mpa IS NULL  THEN '0' 
                    ELSE '1' END"
      - column: dq_pir_validity_flag
        expression: "CASE WHEN dq_block_pir_status = '0' THEN '' 
                    WHEN valid_to_date_pi >= current_date() THEN '1'
                    ELSE '0' END"
      - column: dq_pir_category_flag
        expression: "CASE WHEN dq_block_pir_status = '0' THEN ''
                    WHEN (procurement_alternative_process_category_mpa = 'BB' AND info_record_category_code_pi = '0') OR (procurement_alternative_process_category_mpa = 'BL' AND info_record_category_code_pi = '3') THEN '1'
                    ELSE '0' END"
      - column: dq_uom_flag
        expression: "CASE WHEN dq_block_pir_status = '0' THEN ''
                    WHEN order_price_unit_code_pi = unit_of_measure_code_m THEN '1'
                    ELSE '0' END"
      - column: dq_cert_category_flag 
        expression: CASE WHEN dq_block_pir_status = '0' THEN ''
                    WHEN vendor_code_mpa NOT LIKE '4000%' OR ((material_code_m NOT BETWEEN LPAD('1000', 18, '0') AND LPAD('9999999', 18, '0')) AND (material_code_m NOT BETWEEN LPAD('12000000', 18, '0') AND LPAD('12999999', 18, '0')) AND (material_code_m NOT BETWEEN LPAD('15000000', 18, '0') AND LPAD('15999999', 18, '0')) AND (material_code_m NOT BETWEEN LPAD('85000000', 18, '0') AND LPAD('85499999', 18, '0')) AND (material_code_m NOT BETWEEN LPAD('95000000', 18, '0') AND LPAD('97999999', 18, '0'))) THEN ''
                    WHEN certificate_category_code_pi IS NOT NULL AND certificate_category_code_pi != '' THEN '2'
                    WHEN (certificate_category_code_pi IS NULL OR certificate_category_code_pi = '') AND count_country_code_mp > 1 THEN '3'
                    WHEN (certificate_category_code_pi IS NULL OR certificate_category_code_pi = '') AND count_country_code_mp = 1 AND material_status_code_mp = '99' THEN '4'
                    WHEN (certificate_category_code_pi IS NULL OR certificate_category_code_pi = '') AND count_country_code_mp = 1 AND material_status_code_mp != '99' THEN '5'
                    ELSE '' END
              
  - kind: join
    name: join_subcontracting_scale_cs
    context_name: add_flags_2
    params:
      - other:
          select_cs
        how:
          left
        columns:
          condition_record_number_pi: condition_record_number_cs
          sap_cluster_pi: sap_cluster_cs
      - other:
          filter_pv1
        how:
          left
        columns:
          material_code_pi: material_code_pv1
          plant_code_pi: plant_code_pv1
          production_version_pi: production_version_pv1
          sap_cluster_pi: sap_cluster_pv1      
      - other:
          select_b_final
        how:
          left
        columns:
          material_code_pi: material_code_b
          plant_code_pi: plant_code_b
          bom_alternative_pv1: bom_alternative_b
          sap_cluster_pi: sap_cluster_b   
      - other:
          filter_tl
        how:
          left
        columns:
          material_code_pi: material_code_tl
          plant_code_pi: plant_code_tl
          group_counter_pv1: group_counter_tl
          task_list_number_pv1: task_list_number_tl
          sap_cluster_pi: sap_cluster_tl     
      - other:
          select_pv2
        how:
          left
        columns:
          material_code_pi: material_code_pv2
          plant_code_pi: plant_code_pv2
          bom_alternative_b: bom_alternative_pv2
          bom_usage_b: bom_usage_pv2
          group_counter_tl: group_counter_pv2
          task_list_number_tl: task_list_number_pv2
          sap_cluster_tl: sap_cluster_pv2           

  - kind: add
    name: add_next_scale_quantity_rate
    context_name: join_subcontracting_scale_cs
    params:                                     
      - column: next_quantity_scale_number
        expression: LEAD(scale_quantity_cs) OVER (PARTITION BY condition_record_number_cs ORDER BY scale_number_cs ASC)
      - column: next_rate_scale_number
        expression: LEAD(scale_rate_cs) OVER (PARTITION BY condition_record_number_cs ORDER BY scale_number_cs ASC)

  - kind: group
    name: group_scale_number
    params:
      - aggs:
          scale_number_cs: count
        by:
        - condition_record_number_cs

  - kind: join
    name: join_group_scale_number
    context_name: add_next_scale_quantity_rate
    params:
      - other:
          group_scale_number
        how:
          left
        columns:
          condition_record_number_cs: condition_record_number_cs 

  - kind: add
    name: add_dq_scale_flag_v1
    context_name: join_group_scale_number
    params:                    
      - column: dq_scale_flag_v1
        expression: CASE WHEN (condition_record_number_cs IS NULL OR condition_record_number_cs = '') THEN '' WHEN scale_number_cs IS NULL THEN ''
                    WHEN sequence_number_cs IS NULL THEN ''
                    WHEN count_scale_number_cs = 1 THEN '1'
                    WHEN scale_quantity_cs < next_quantity_scale_number AND scale_rate_cs >= next_rate_scale_number THEN '1'
                    ELSE '0' END        

  - kind: group
    name: group_sum_flag
    params:
      - aggs:
          dq_scale_flag_v1: sum
        by:
        - condition_record_number_cs

  - kind: join
    name: join_group_sum_flag_v2
    context_name: add_dq_scale_flag_v1
    params:
      - other:
          group_sum_flag
        how:
          left
        columns:
          condition_record_number_cs: condition_record_number_cs 

  - kind: add
    name: add_dq_scale_flag
    context_name: join_group_sum_flag_v2
    params:                    
      - column: dq_scale_flag
        expression: CASE WHEN dq_scale_flag_v1 = '' THEN '' WHEN sum_dq_scale_flag_v1 = count_scale_number_cs - 1 THEN '1'
                    ELSE '0' END      

  - kind: filter
    name: filter_deletion_flag
    context_name: add_dq_scale_flag
    params:
      - condition:
         purchase_org_deletion_flag_pi != 'X' AND general_deletion_flag_pi != 'X'

  - kind: select
    name: select_mixing_ratio
    params:
      columns:
        material_code_mpa: material_code_mpa
        plant_code_mpa: plant_code_mpa
        sap_cluster_mpa: sap_cluster_mpa
        mixing_ratio_mpa: mixing_ratio_mpa
      distinct: true   

  - kind: group
    name: group_subcontracting
    params:
      - aggs:
          mixing_ratio_mpa: sum
        by:
        - material_code_mpa
        - plant_code_mpa
        - sap_cluster_mpa
  
###################################################33

  - kind: join
    name: join_group_subcontracting_mixing_ratio_count
    context_name: add_dq_scale_flag
    params:
      - other:
          group_subcontracting
        how:
          left
        columns:
          material_code_mpa: material_code_mpa
          plant_code_mpa: plant_code_mpa
          sap_cluster_mpa: sap_cluster_mpa           

