transform:
  name: dm_product_check_results_activity_raw
  operations:

#read dm_product_plant
  - kind: read_dataio
    name: read_dm_product_plant
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_plant
      schema_version: v8

#Stock check

  - kind: select
    name: select_dm_product_plant_sales_check
    context_name: read_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        stock_in_transit_quantity: stock_in_transit_quantity
        stock_in_transfer_quantity: stock_in_transfer_quantity
        stock_unrestricted_quantity: stock_unrestricted_quantity
        stock_blocked_quantity: stock_blocked_quantity
        stock_quality_inspection_quantity: stock_quality_inspection_quantity
        stock_vendor_quantity: stock_vendor_quantity
        stock_customer_unrestricted_use_quantity: stock_customer_unrestricted_use_quantity
        stock_batch: stock_batch
        stock_vendor_flag: stock_vendor_flag
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dm_product_plant_sales_check
    params:
      - aggs:
          stock_in_transit_quantity: sum
          stock_in_transfer_quantity: sum
          stock_unrestricted_quantity: sum
          stock_blocked_quantity: sum
          stock_quality_inspection_quantity: sum
          stock_vendor_quantity: sum
          stock_customer_unrestricted_use_quantity: sum
          stock_batch: max
          stock_vendor_flag: max
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_stock_check
    params:
      - column: stock_check
        expression: "CASE WHEN (sum_stock_in_transit_quantity + sum_stock_in_transfer_quantity + sum_stock_unrestricted_quantity + sum_stock_blocked_quantity + sum_stock_quality_inspection_quantity + sum_stock_vendor_quantity + sum_stock_customer_unrestricted_use_quantity) > 0 OR (max_stock_batch != '' AND max_stock_batch is not null) THEN '1' ELSE '0' END"

  - kind: select
    name: select_dm_product_plant_stock_check_final
    params:
      columns:
        material_code: material_code_pl
        country_code: country_code_pl
        sap_cluster: sap_cluster_pl
        stock_check: stock_check

