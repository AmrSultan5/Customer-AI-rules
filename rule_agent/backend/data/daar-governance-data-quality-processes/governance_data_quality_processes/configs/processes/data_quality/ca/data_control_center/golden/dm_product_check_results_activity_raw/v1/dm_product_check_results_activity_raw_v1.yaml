  - kind: join
    name: join_dm_product_plant_general_creation_date_check
    context_name: group_dm_product_plant_creation_date_check
    params:
      - other:
          select_dm_product_general_creation_date_check
        how:
          inner
        columns:
          material_code: material_code
          sap_cluster: sap_cluster

  - kind: add
    name: add_dm_product_general_creation_date_check
    params:
      - column: creation_date_check_with_null
        expression: "CASE WHEN(to_date(creation_date) >= add_months(to_date(current_date()), -12) and max_plant_extenstion_date is null and max_plant_extenstion_date!='') OR (to_date(max_plant_extenstion_date) >= add_months(to_date(current_date()), -12)) THEN '1' ELSE '0' END"
  
  - kind: add
    name: add_dm_product_general_creation_date_check_if_null
    params:
      - column: creation_date_check
        expression: "CASE WHEN(creation_date_check_with_null is null) THEN '0' ELSE creation_date_check_with_null END"

  - kind: select
    name: select_dm_product_general_creation_date_check_final
    params:
      columns:
        material_code: material_code_pg
        country_code: country_code_pg
        sap_cluster: sap_cluster_pg
        max_plant_extenstion_date: max_plant_extenstion_date
        creation_date_check: creation_date_check
      distinct: true

#Plant status check

  - kind: select
    name: select_dm_product_plant_status_check_za
    context_name: read_dm_product_plant
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_status_code: material_status_code_org
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_dm_product_plant_matarial_status_code
    params:
      - column: material_status_code 
        expression: IF(material_status_code_org = '02', '', material_status_code_org)

  - kind: add
    name: add_dm_product_plant_status_check_if
    params:
      - column: plant_status_check_za 
        expression: IF(material_status_code='ZA', 1, 0)
      - column: plant_status_check_97 
        expression: IF(material_status_code='97', 1, 0)
      - column: plant_status_check_98 
        expression: IF(material_status_code='98', 1, 0)
      - column: plant_status_check_99 
        expression: IF(material_status_code='99', 1, 0)   
      - column: plant_status_check_99_s
        expression: IF(material_status_code='99', 1, 0)  
      - column: plant_status_check_98_s
        expression: IF(material_status_code='98', 1, 0)                 
      - column: plant_status_check_not_99 
        expression: IF(material_status_code!='99', 1, 0)  
      - column: plant_status_check_null
        expression: IF(material_status_code is null or material_status_code='', 1, 0)                                     
      - column: plant_status_check_null_not_98
        expression: IF(material_status_code!='98' and (material_status_code is null or material_status_code=''), 1, 0)  
      - column: plant_status_all
        expression: CAST(1 as INT)                                

  - kind: group
    name: group_dm_product_plant_status_check
    params:
      - aggs:
          plant_status_check_za: max
          plant_status_check_97: max
          plant_status_check_98: max
          plant_status_check_99: max
          plant_status_check_99_s: sum
          plant_status_check_98_s: sum
          plant_status_check_not_99: max
          plant_status_check_null_not_98: sum
          plant_status_check_null: sum
          plant_status_all: sum
        by:
        - material_code
        - country_code
        - sap_cluster

  - kind: add
    name: add_dm_product_plant_status_check
    params:
      - column: plant_status_check
        expression: "CASE WHEN(max_plant_status_check_za = 1) THEN 'at least one ZA' WHEN (max_plant_status_check_97 = 1) THEN 'at least one 97'  WHEN sum_plant_status_check_99_s = sum_plant_status_all THEN '99 only' WHEN sum_plant_status_check_98_s = sum_plant_status_all THEN '98 only' WHEN (max_plant_status_check_98 = 1 and sum_plant_status_check_null_not_98 = 0) THEN 'at least one 98' WHEN max_plant_status_check_99 = 1 AND max_plant_status_check_not_99 = 1 THEN 'at least one 99' WHEN sum_plant_status_check_null = sum_plant_status_all THEN 'no blocks' ELSE 'some blocks' END"

  - kind: select
    name: select_dm_product_plant_status_check_final
    params:
      columns:
        material_code: material_code_pppl
        country_code: country_code_pppl
        sap_cluster: sap_cluster_pppl
        plant_status_check: plant_status_check
      distinct: true

