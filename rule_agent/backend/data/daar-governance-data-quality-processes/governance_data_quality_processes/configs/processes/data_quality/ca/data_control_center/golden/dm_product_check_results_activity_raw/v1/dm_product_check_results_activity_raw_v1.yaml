  - kind: join
    name: join_bom_check_iterations
    context_name: select_dm_bill_of_material_bom_check_iteration_1_final
    params:
      - other:
          select_dm_bill_of_material_bom_check_iteration_2_final
        how:
          left
        columns:
          bom_component_material_number_bom_it_1: bom_component_material_number_bom_it_2
          country_code_bom_it_1: country_code_bom_it_2
          sap_cluster_bom_it_1: sap_cluster_bom_it_2    

  - kind: add
    name: add_final_checks
    context_name: join_bom_check_iterations
    params:
      - column: fg_bom_component_material_flag_it1_it2
        expression: "CASE WHEN(fg_bom_component_material_flag_it_1!='') THEN fg_bom_component_material_flag_it_1 ELSE fg_bom_component_material_flag_it_2 END" 
      - column: fg_bom_number_it1_it2
        expression: "CASE WHEN(fg_bom_number_it_1!='') THEN fg_bom_number_it_1 ELSE fg_bom_number_it_2 END" 
      - column: fg_bom_material_code_it1_it2
        expression: "CASE WHEN(fg_bom_material_code_it_1!='') THEN fg_bom_material_code_it_1 ELSE fg_bom_material_code_it_2 END"         
      - column: bom_check
        expression: "CASE WHEN(empty_bom_component_material_flag_it_1='1' OR fg_bom_component_material_flag_it1_it2='1' OR semi_fg_bom_component_material_flag_it_1='1') THEN '1' ELSE '0' END" 

  - kind: select
