        empty_bom_number_it_1: empty_bom_number
        empty_bom_material_code_it_1: empty_bom_material_code
        fg_bom_component_material_flag_it1_it2: fg_bom_component_material_flag
        fg_bom_number_it1_it2: fg_bom_number
        fg_bom_material_code_it1_it2: fg_bom_material_code
        semi_fg_bom_component_material_flag_it_1: semi_fg_bom_component_material_flag
        semi_fg_bom_number_it_1: semi_fg_bom_number
        semi_fg_bom_material_code_it_1: semi_fg_bom_material_code
        bom_check: bom_check
      distinct: true

#read dm_product_sales_organization
  - kind: read_dataio
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization
      schema_version: v8

  - kind: filter
    name: filter_dm_product_sales_organization_org
    context_name: read_dm_product_sales_organization
    params:
      - condition:
          country_code!= 'BSO'

  - kind: filter
    name: filter_dm_product_sales_organization
    context_name: filter_dm_product_sales_organization_org
    params:
      - condition:
          country_code!= 'BSO' and distribution_channel_code in ('01', '02')

  - kind: group
    name: aggregation_dm_product_sales_organization_distr_ch
    context_name: filter_dm_product_sales_organization
    params:
      - aggs:
          distribution_channel_code: min
        by:
        - material_code
        - sales_org_code
        - country_code
        - sap_cluster

  - kind: join
    name: join_dm_product_sales_organization_distr_ch
    context_name: filter_dm_product_sales_organization
    params:
      - other:
          aggregation_dm_product_sales_organization_distr_ch
        how:
          inner
        columns:
          material_code: material_code
          sales_org_code: sales_org_code
          country_code: country_code
          sap_cluster: sap_cluster
          distribution_channel_code: min_distribution_channel_code

#Sales status check

  - kind: select
    name: select_dm_product_sales_organization_sales_status_check
    context_name: join_dm_product_sales_organization_distr_ch
    params:
      columns:
        material_code: material_code
        country_code: country_code
        material_status_code: material_status_code
        min_distribution_channel_code: min_distribution_channel_code
        material_sales_valid_from: material_sales_valid_from
        sap_cluster: sap_cluster
      distinct: true

  - kind: add
    name: add_material_status_code
    params:
      - column: material_status_code_03_check
        expression: "CASE WHEN(material_status_code='03') THEN 1 ELSE 0 END"
      - column: material_status_code_all
        expression: CAST(1 AS INT)       

  - kind: group
    name: group_dm_product_sales_organization_sales_status_check
    params:
      - aggs:
          material_status_code_03_check: sum
          material_status_code_all: sum
          material_sales_valid_from: max
        by:
        - material_code
        - country_code
        - min_distribution_channel_code
        - sap_cluster

  - kind: add
    name: add_dm_product_sales_organization_product_plant_sales_status_check
    params:
      - column: sales_status_check  
        expression: "CASE WHEN(sum_material_status_code_03_check = sum_material_status_code_all) THEN '0' ELSE '1' END"
      - column: material_sales_valid_from_final  
        expression: "CASE WHEN(sales_status_check='0') THEN max_material_sales_valid_from ELSE '' END"

  - kind: select
    name: select_dm_sales_organization_status_check_final
    params:
      columns:
        material_code: material_code_so
        country_code: country_code_so
        min_distribution_channel_code: min_distribution_channel_code
        sap_cluster: sap_cluster_so
        sales_status_check: sales_status_check
        material_sales_valid_from_final: sales_block_date
      distinct: true

#join product_general, product_sales_org, product_plan - for correctly establishing material extendedness
#part 1 - pg_pp
  - kind: join
    name: join_pg_pp
    context_name: filter_dm_product_general
    params:
      - other:
          select_dm_product_plant_stock_check_final
        how:
          inner
        columns:
          material_code: material_code_pl
          sap_cluster: sap_cluster_pl

  - kind: add
    name: add_join_pg_pp
    context_name: join_pg_pp
    params:
      - column: country_code
        expression: country_code_pl

  - kind: select
    name: select_join_pg_pp
    context_name: add_join_pg_pp
    params:
      columns:
        material_code: material_code
        material_type_code: material_type_code
        country_code: country_code
        country_code_pl: country_code_pl
        sap_cluster: sap_cluster
        material_code_pl: material_code_pl
        sap_cluster_pl: sap_cluster_pl
        stock_check: stock_check
      distinct: true


#part 2 - pso_pg_pp
  - kind: select
    name: select_dm_product_sales_org
    context_name: read_dm_product_sales_organization
    params:
      columns:
        material_code: material_code_so
        country_code: country_code_so
        sap_cluster: sap_cluster_so
      distinct: true

  - kind: join
    name: join_pg_pp_pso_left
    context_name: select_dm_product_sales_org
    params:
      - other:
          select_join_pg_pp
        how:
          left
        columns:
          material_code_so: material_code_pl
          sap_cluster_so: sap_cluster_pl
          country_code_so: country_code

  - kind: join
    name: join_pg_pp_pso_full
    context_name: select_dm_product_sales_org
    params:
      - other:
          select_join_pg_pp
        how:
          full
        columns:
          material_code_so: material_code_pl
          sap_cluster_so: sap_cluster_pl
          country_code_so: country_code

  - kind: add
    name: add_join_pg_pp_pso_for_group
    context_name: join_pg_pp_pso_full
    params:
      - column: material_code_out
        expression: "CASE WHEN material_code_so is null THEN material_code_pl ELSE material_code_so END"
      - column: sap_cluster_out  
        expression: "CASE WHEN sap_cluster_so is null THEN sap_cluster_pl ELSE sap_cluster_so END"
      - column: country_code_out  
        expression: "CASE WHEN country_code_so is null THEN country_code_pl ELSE country_code_so END"

  - kind: group
    name: agg_pso_max_mat_code
    context_name: add_join_pg_pp_pso_for_group
    params:
      - aggs:
          material_code_pl: max
        by:
        - material_code_out
        - country_code_out
        - sap_cluster_out

  - kind: join
    name: join_pg_pp_pso_mat_code_max
