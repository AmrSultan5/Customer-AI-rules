transform:
  name: f_product_details_l3_activity_raw
  operations:

# Read dm_product_check_results_activity_raw

  - kind: read_dataio
    name: read_dm_product_check_results_activity_raw
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_check_results_activity_raw
      schema_version: v2

  - kind: select
    name: select_dm_product_check_results_activity_raw
    context_name: read_dm_product_check_results_activity_raw
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        material_code: material_code
        country_code: country_code
        plant_extenstion_date: plant_extenstion_date
        message_output: message_output
        sap_cluster: sap_cluster
        check_date: check_date   
        plant_block_status: plant_block_status     
        purchase_document_flag: purchase_document_flag
        purchase_document_last_date: purchase_document_last_date
        production_order_flag: production_order_flag
        production_order_last_date: production_order_last_date
        stock_in_country_flag: stock_in_country_flag
        sales_order_flag: sales_order_flag
        sales_order_last_date: sales_order_last_date
        bom_component_material_flag: bom_component_material_flag
        billing_document_flag: billing_document_flag
        billing_document_last_date: billing_document_last_date
        delivery_document_flag: delivery_document_flag
        delivery_document_last_date: delivery_document_last_date
        empty_bom_number: empty_bom_number
        empty_bom_component_material_flag: empty_bom_component_material_flag
        empty_bom_material_code: empty_bom_material_code
        fg_bom_number: fg_bom_number
        fg_bom_component_material_flag: fg_bom_component_material_flag
        fg_bom_material_code: fg_bom_material_code
        semi_fg_bom_number: semi_fg_bom_number
        semi_fg_bom_component_material_flag: semi_fg_bom_component_material_flag
        semi_fg_bom_material_code: semi_fg_bom_material_code
        is_channel_01_available: is_channel_01_available
      distinct: true

# Read dm_product_general

  - kind: read_dataio
    name: read_dm_product_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_general
      schema_version: v5

#Select dm_product_general

  - kind: add
    name: add_dm_product_general
    context_name: read_dm_product_general
    params:
      - column: material_group_code_ifnull
        expression: ifnull(material_group_code, 'null')
      - column: material_type_code_ifnull
        expression: ifnull(material_type_code, 'null')
      - column: bpp_code_ifnull
        expression: ifnull(bpp_code, 'null')
      - column: bpp_name_ifnull
        expression: ifnull(bpp_name,'null' ) 
      - column: bpp_package_name_ifnull
        expression: ifnull(bpp_package_name,'null' )

  - kind: select
    name: select_dm_product_general
    context_name: add_dm_product_general
    params:
      columns:
        material_code: material_code_pg
        material_group_code_ifnull: material_group_code_pg
        material_type_code_ifnull: material_type_code_pg
        bpp_code_ifnull: bpp_code_pg
        bpp_name_ifnull: bpp_name_pg
        bpp_package_name_ifnull: bpp_package_name_pg
        material_description: material_description_pg
        creation_date: creation_date_pg
        base_unit_of_measure_code: base_unit_of_measure_code_pg
        sap_cluster: sap_cluster_pg
      distinct: true

# Read dm_product_sales_organization

  - kind: read_dataio
    name: read_dm_product_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_product_sales_organization
      schema_version: v8

#Select dm_product_sales_organization

  - kind: filter
    name: filter_dm_product_sales_organization
    context_name: read_dm_product_sales_organization
    params:
      - condition:
          distribution_channel_code in ('01', '02', '03', '04')

  - kind: group
    name: aggregation_dm_product_sales_organization_distr_ch
    context_name: filter_dm_product_sales_organization
    params:
      - aggs:
          distribution_channel_code: min
        by:
        - material_code
        - sales_org_code
        - country_code
        - sap_cluster

  - kind: join
    name: join_dm_product_sales_organization_distr_ch
    context_name: filter_dm_product_sales_organization
    params:
      - other:
          aggregation_dm_product_sales_organization_distr_ch
        how:
          inner
        columns:
          material_code: material_code
          sales_org_code: sales_org_code
          country_code: country_code
          sap_cluster: sap_cluster
          distribution_channel_code: min_distribution_channel_code

  - kind: add
    name: add_dm_product_sales_organization
    context_name: join_dm_product_sales_organization_distr_ch
    params:
      - column: flavour_code_ifnull
        expression: ifnull(flavour_code, 'null')
      - column: pack_size_code_ifnull
        expression: ifnull(pack_size_code, 'null')
      - column: pack_type_code_ifnull
        expression: ifnull(pack_type_code, 'null')
      - column: product_hierarchy_code_ifnull
        expression: ifnull(product_hierarchy_code, 'null')
      - column: sales_unit_code_ifnull
        expression: ifnull(sales_unit_code, 'null')
      - column: brand_code_ifnull
        expression: ifnull(brand_code, 'null')

  - kind: select
    name: select_dm_product_sales_organization
    context_name: add_dm_product_sales_organization
    params:
      columns:
        material_code: material_code_pso
        country_code: country_code_pso
        flavour_code_ifnull: flavour_code_pso
        pack_size_code_ifnull: pack_size_code_pso
        pack_type_code_ifnull: pack_type_code_pso
        product_hierarchy_code_ifnull: product_hierarchy_code_pso
        sales_unit_code_ifnull: sales_unit_code_pso
        brand_code_ifnull: brand_code_pso
        sap_cluster: sap_cluster_pso
      distinct: true

# Read dim_product_classification

  - kind: read_dataio
    name: read_dim_product_classification
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dim_product_classification
      schema_version: v1

#Select dim_product_classification

  - kind: add
    name: add_dim_product_classification
    context_name: read_dim_product_classification
    params:
      - column: flavour_code_ifnull
        expression: ifnull(flavour_code, 'null')
      - column: material_group_code_ifnull
        expression: ifnull(material_group_code, 'null')
      - column: material_type_code_ifnull
        expression: ifnull(material_type_code, 'null')
      - column: pack_size_code_ifnull
        expression: ifnull(pack_size_code, 'null')
      - column: pack_type_code_ifnull
        expression: ifnull(pack_type_code, 'null')
      - column: product_hierarchy_code_ifnull
        expression: ifnull(product_hierarchy_code, 'null')
      - column: sales_unit_code_ifnull
        expression: ifnull(sales_unit_code, 'null')
      - column: brand_code_ifnull
        expression: ifnull(brand_code, 'null')
      - column: bpp_code_ifnull
        expression: ifnull(bpp_code, 'null')
      - column: bpp_name_ifnull
        expression: ifnull(bpp_name,'null' ) 
      - column: bpp_package_name_ifnull
        expression: ifnull(bpp_package_name,'null' )

  - kind: select
    name: select_dim_product_classification
    context_name: add_dim_product_classification
    params:
      columns:
        prod_class_id: prod_class_id_pc
        flavour_code_ifnull: flavour_code_pc
        material_group_code_ifnull: material_group_code_pc
        material_type_code_ifnull: material_type_code_pc
        pack_size_code_ifnull: pack_size_code_pc
        pack_type_code_ifnull: pack_type_code_pc
        product_hierarchy_code_ifnull: product_hierarchy_code_pc
        sales_unit_code_ifnull: sales_unit_code_pc
        brand_code_ifnull: brand_code_pc
        bpp_code_ifnull: bpp_code_pc
        bpp_name_ifnull: bpp_name_pc
        bpp_package_name_ifnull: bpp_package_name_pc     
      distinct: true


  - kind: join
    name: join_qc_pg_pso_pc
    context_name: select_dm_product_check_results_activity_raw
    params:
      - other:
          select_dm_product_general
        how:
          inner
        columns:
          material_code: material_code_pg
          sap_cluster: sap_cluster_pg
      - other:
          select_dm_product_sales_organization
        how:
          left
        columns:
          material_code: material_code_pso
          country_code: country_code_pso
          sap_cluster: sap_cluster_pso
      - other:
          select_dim_product_classification
        how:
          left
        columns:
          flavour_code_pso: flavour_code_pc
          material_group_code_pg: material_group_code_pc
          material_type_code_pg: material_type_code_pc
          pack_size_code_pso: pack_size_code_pc
          pack_type_code_pso: pack_type_code_pc
          product_hierarchy_code_pso: product_hierarchy_code_pc
          sales_unit_code_pso: sales_unit_code_pc
          brand_code_pso: brand_code_pc
          bpp_code_pg: bpp_code_pc
          bpp_name_pg: bpp_name_pc
          bpp_package_name_pg: bpp_package_name_pc

  - kind: add
    name: add_final_columns
    context_name: join_qc_pg_pso_pc
    params:
      - column: loading_date
        expression: "to_date(current_date(),'YYYY-MM-DD')"

  - kind: select
    name: select_dm_product_check_results_activity__raw_final_columns
    context_name: add_final_columns
    params:
      columns:
        check_status: check_status
        country_code: country_code
        material_code: material_code
        loading_date: loading_date
        creation_date_pg: material_creation_date
        material_description_pg: material_description
        base_unit_of_measure_code_pg: base_unit_of_measure_code
        message_output: message_output
        plant_block_status: plant_block_status
        plant_extenstion_date: plant_extenstion_date
        prod_class_id_pc: prod_class_id
        sap_cluster: sap_cluster
        rule_code: rule_code
        purchase_document_flag: purchase_document_flag
        purchase_document_last_date: purchase_document_last_date
        production_order_flag: production_order_flag
        production_order_last_date: production_order_last_date
        stock_in_country_flag: stock_in_country_flag
        sales_order_flag: sales_order_flag
        sales_order_last_date: sales_order_last_date
        billing_document_flag: billing_document_flag
        billing_document_last_date: billing_document_last_date
        delivery_document_flag: delivery_document_flag
        delivery_document_last_date: delivery_document_last_date
        bom_component_material_flag: bom_component_material_flag
        empty_bom_number: empty_bom_number
        empty_bom_component_material_flag: empty_bom_component_material_flag
        empty_bom_material_code: empty_bom_material_code
        fg_bom_number: fg_bom_number
        fg_bom_component_material_flag: fg_bom_component_material_flag
        fg_bom_material_code: fg_bom_material_code
        semi_fg_bom_number: semi_fg_bom_number
        semi_fg_bom_component_material_flag: semi_fg_bom_component_material_flag
        semi_fg_bom_material_code: semi_fg_bom_material_code
        is_channel_01_available: is_channel_01_available
      distinct: true 

  - kind: write_dataio
    name: write_f_product_details_l3_activity_raw
    params:
      dataio:
        ad_id: "{{dataio.ad_id}}"
        layer: application
        storage_id: "{{dataio.storage_id}}"
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: f_product_details_l3_activity_raw
      process_run_id: "{{process_run_id}}"
      schema_version: v2
      refresh_mode: full