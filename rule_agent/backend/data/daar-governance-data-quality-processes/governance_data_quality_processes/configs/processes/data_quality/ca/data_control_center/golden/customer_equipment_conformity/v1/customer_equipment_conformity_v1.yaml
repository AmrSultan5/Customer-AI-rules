        - equipment_model
        - rule_code

  - kind: select
    name: select_rcconf_389_2_cs2_final
    context_name: aggregation_rcconf_389_2_cs2
    params:
      columns:
        rule_code: rule_code
        min_check_status_2: check_status_2
        customer_code: customer_code
        equipment_model: value_checked
      distinct: true

#RULE 389_2 - cs_3, cs_4, cs_5
  - kind: add
    name: add_rcconf_389_2_cs345
    context_name: add_rcconf_389_2_cs1
    params:
      - column: check_status_3
        expression: "CASE WHEN INSTR(equipment_model, '..') > 0 THEN '0' WHEN INSTR(equipment_model, ',,') > 0 THEN '0' WHEN INSTR(equipment_model, '..') > 0 THEN '0' WHEN INSTR(equipment_model, chr(47)||chr(47)) > 0 THEN '0' WHEN INSTR(equipment_model, '--') > 0 THEN '0' WHEN INSTR(equipment_model, '__') > 0 THEN '0' WHEN INSTR(equipment_model, '&&') > 0 THEN '0' WHEN INSTR(equipment_model, chr(34)||chr(34)) > 0 THEN '0' WHEN INSTR(equipment_model, '::') > 0 THEN '0' WHEN INSTR(equipment_model, chr(92)||chr(92)) > 0 THEN '0' WHEN INSTR(equipment_model, '^^') > 0 THEN '0' WHEN INSTR(equipment_model, '``') > 0 THEN '0' WHEN INSTR(equipment_model, '++') > 0 THEN '0' WHEN INSTR(equipment_model, chr(39)||chr(39)) > 0 THEN '0' ELSE '1' END"
      - column: check_status_4
        expression: "CASE WHEN MOD(LENGTH(equipment_model) - LENGTH(REPLACE(equipment_model, chr(34), '')), 2) = 0 THEN '1' ELSE '0' END"
      - column: check_status_51
        expression: "CASE WHEN MOD(LENGTH(equipment_model) - LENGTH(REGEXP_REPLACE(equipment_model, '[()]', '')), 2) = 0 THEN CASE WHEN INSTR(equipment_model, '(') <= INSTR(equipment_model, ')') THEN '1' ELSE '0' END ELSE '0' END"
      - column: check_status_52
        expression: "CASE WHEN MOD(LENGTH(equipment_model) - LENGTH(REGEXP_REPLACE(equipment_model, '[{}]', '')), 2) = 0 THEN CASE WHEN INSTR(equipment_model, '{') <= INSTR(equipment_model, '}') THEN '1' ELSE '0' END ELSE '0' END"
      - column: check_status_53
        expression: "CASE WHEN MOD(LENGTH(equipment_model) - LENGTH(REPLACE(REPLACE(equipment_model, chr(91), ''), chr(93), '')), 2) = 0 THEN CASE WHEN INSTR(equipment_model, chr(91)) <= INSTR(equipment_model, chr(93)) THEN '1' ELSE '0' END ELSE '0' END"
      - column: check_status_5
        expression: "CASE WHEN check_status_51 = '0' THEN '0' WHEN check_status_52 = '0' THEN '0' WHEN check_status_53 = '0' THEN '0' ELSE '1' END"

  - kind: select
    name: select_rcconf_389_2_cs345_final
    context_name: add_rcconf_389_2_cs345
    params:
      columns:
        rule_code: rule_code
        check_status_3: check_status_3
        check_status_4: check_status_4
        check_status_5: check_status_5
        customer_code: customer_code
        equipment_model: value_checked
      distinct: true

