  - kind: add
    name: add_rcconf_389_2_cs2
    context_name: join_rcconf_389_special_char
    params:
      - column: check_status_2
        expression: "CASE WHEN INSTR(equipment_model, character) > 0 AND rcconf_389_2 = 1 THEN '0' ELSE 1 END"

  - kind: group
