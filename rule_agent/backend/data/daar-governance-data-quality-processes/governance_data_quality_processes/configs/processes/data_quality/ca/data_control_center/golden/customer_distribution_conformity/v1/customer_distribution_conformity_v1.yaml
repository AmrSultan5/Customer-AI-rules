transform:
  name: customer_distribution_conformity
  operations:
  - name: initialize_schema_configuration
    kind: governance_data_quality_processes.operations.common.initialize_schema_configuration.InitializeSchemaConfigurationOperation
    params:
      module_name: governance_data_quality_processes
      config_name: dcc_schema_versions

# Read data marts

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_general
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_general

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_hierarchy
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_hierarchy

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_company
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_company

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_sales_organization
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_sales_organization

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_cg4_order_block_matrix
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_cg4_order_block_matrix

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_conf_order_block_time
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: curated
        storage_id: '{{dataio.storage_id}}'
      source: data_quality
      namespace: data_control_center
      object_name: conf_order_block_time

#Select Data Marts

  - kind: select
    name: select_dm_customer_general
    context_name: read_dm_customer_general
    params:
      columns:
        customer_code: customer_code
        central_order_block_code: central_order_block_code
        central_order_block_name: central_order_block_name
        central_order_block_assignment_date: central_order_block_assignment_date
        account_group_code: account_group_code
        distribution_type_code: distribution_type_code
        country_code: country_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_hierarchy
    context_name: read_dm_customer_hierarchy
    params:
      columns:
        l7_customer_code: l7_customer_code
        l3_customer_code: l3_customer_code
        l7_division_code: division_code_ch
        l7_distribution_channel_code: distribution_channel_code_ch
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_company
    context_name: read_dm_customer_company
    params:
      columns:
        customer_code: customer_code
        country_code: country_code_cc
        terms_of_payment_code: terms_of_payment_code_cc
        terms_of_payment_description: terms_of_payment_description
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_sales_organization
    context_name: read_dm_customer_sales_organization
    params:
      columns:
        customer_code: customer_code
        sale_org_code: sale_org_code
        country_code: country_code_so
        customer_group_code: customer_group_code
        customer_group_name: customer_group_name
        shipping_condition_code: shipping_condition_code
        shipping_condition_name: shipping_condition_name
        delivering_plant_code: delivering_plant_code
        is_delivering_plant_allowed: is_delivering_plant_allowed
        customer_group_4_code: customer_group_4_code
        customer_group_4_name: customer_group_4_name
        terms_of_payment_code: terms_of_payment_code_so
        terms_of_payment_name: terms_of_payment_name_so
        division_code: division_code
        distribution_channel_code: distribution_channel_code
        trading_term_1_code: trading_term_1_code
        trading_term_1_name: trading_term_1_name
        order_block_sales_code: order_block_sales_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_dm_customer_sales_organization_d
    context_name: read_dm_customer_sales_organization
    params:
      columns:
        customer_code: customer_code_d
        sale_org_code: sale_org_code
        delivering_plant_code: delivering_plant_code_d
        sap_cluster: sap_cluster
      distinct: true

  - kind: select
    name: select_conf_cg4_order_block_matrix
    context_name: read_conf_cg4_order_block_matrix
    params:
      columns:
        customer_group_4_code: customer_group_4_code_mx
        customer_hier_3_code: customer_hier_3_code_mx
        order_block_code: order_block_code_mx
        flag: flag
      distinct: true

  - kind: select
    name: select_cobt
    context_name: read_conf_order_block_time
    params:
      columns:
        central_order_block_code: conf_central_order_block_code
        max_months: conf_max_months
      distinct: true

#READ dm_customer_partner_v1
  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
    config_kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperationConfig
    name: read_dm_customer_partner
    params:
      dataio:
        ad_id: '{{dataio.ad_id}}'
        layer: application
        storage_id: '{{dataio.storage_id}}'
      application_name: data_quality
      country: ca
      module: data_control_center
      namespace: golden
      object_name: dm_customer_partner

  - kind: select
    context_name: read_dm_customer_partner
    name: select_dm_customer_partner
    params:
      columns:
        customer_code: customer_code
        partner_function_code: partner_function_code
        partner_code: partner_code
        sap_cluster: sap_cluster
      distinct: true

  - kind: filter
    name: filter_dm_customer_partner
    context_name: select_dm_customer_partner
    params:
      - condition:
          partner_function_code = 'ZW'

# Join data marts 119.2
  - kind: join
    name: join_data_marts_119
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_company
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_sales_organization
        how:
          inner
        columns:
          customer_code: customer_code
          country_code_cc: country_code_so
          sap_cluster: sap_cluster

# Join data marts
  - kind: join
    name: join_data_marts_144_154_170
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_sales_organization
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

# Join data marts
  - kind: join
    name: join_data_marts_154_5
    context_name: join_data_marts_144_154_170
    params:
      - other:
          select_dm_customer_partner
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_sales_organization_d
        how:
          inner
        columns:
          partner_code: customer_code_d
          sale_org_code: sale_org_code
          sap_cluster: sap_cluster

  - kind: governance_data_quality_processes.operations.common.read_dataio.CustomReadDataioOperation
