#SELECT rcconf_119_2
  - kind: select
    name: select_rcconf_119_2
    context_name: join_data_marts_119
    params:
      columns:
        customer_code: customer_code
        terms_of_payment_code_cc: terms_of_payment_code_cc
        terms_of_payment_code_so: terms_of_payment_code_so
      distinct: true

#RULE 119_2
  - kind: add
    name: add_rcconf_119_2
    context_name: select_rcconf_119_2
    params:
      - column: rule_code
        expression: "'RCCONF_119.2'"
      - column: check_status
        expression: "CASE WHEN terms_of_payment_code_cc IS NULL or terms_of_payment_code_so IS NULL THEN '-1' WHEN terms_of_payment_code_cc = terms_of_payment_code_so THEN '1' ELSE '0' END"
      - column: value_checked
        expression: "CONCAT(terms_of_payment_code_cc, '_', terms_of_payment_code_so)"  

  - kind: group
    name: group_rcconf_119_2_status
    context_name: add_rcconf_119_2
    params:
      - aggs:
          check_status: max
        by:
        - customer_code

  - kind: join
    name: join_rcconf_119_2_status
    context_name: add_rcconf_119_2
    params:
      - other:
          group_rcconf_119_2_status
        how:
          inner
        columns:
          customer_code: customer_code
          check_status: max_check_status

  - kind: group
    name: group_rcconf_119_2_value_checked
    context_name: join_rcconf_119_2_status
    params:
      - aggs:
          value_checked: collect_set
        by:
        - customer_code
        - rule_code
        - check_status

  - kind: add
    name: add_rcconf_119_2_value_checked_concat
    context_name: group_rcconf_119_2_value_checked
    params:
      - column: collect_set_value_checked_concat
        expression: concat_ws(',', sort_array(collect_set_value_checked))

  - kind: add
    name: add_rcconf_119_2_status_empty
    context_name: add_rcconf_119_2_value_checked_concat
    params:
      - column: check_status
        expression: IF(check_status = '-1', '', check_status)
        overwrite: true

  - kind: select
    name: select_rcconf_119_2_final
    context_name: add_rcconf_119_2_status_empty
    params:
      columns:
        rule_code: rule_code
        check_status: check_status
        customer_code: customer_code
        collect_set_value_checked_concat: value_checked
      distinct: true

