    context_name: read_dm_customer_uploading_points
    params:
      - column: nullif_grh_mon_morning_from
        expression: nullif(grh_mon_morning_from, '-1')
      - column: nullif_grh_mon_morning_to
        expression: nullif(grh_mon_morning_to, '-1')
      - column: nullif_grh_mon_afternoon_from
        expression: nullif(grh_mon_afternoon_from, '-1')
      - column: nullif_grh_mon_afternoon_to
        expression: nullif(grh_mon_afternoon_to, '-1')
      - column: nullif_grh_tue_morning_from
        expression: nullif(grh_tue_morning_from, '-1')
      - column: nullif_grh_tue_morning_to
        expression: nullif(grh_tue_morning_to, '-1')
      - column: nullif_grh_tue_afternoon_from
        expression: nullif(grh_tue_afternoon_from, '-1')
      - column: nullif_grh_tue_afternoon_to
        expression: nullif(grh_tue_afternoon_to, '-1')
      - column: nullif_grh_wed_morning_from
        expression: nullif(grh_wed_morning_from, '-1')
      - column: nullif_grh_wed_morning_to
        expression: nullif(grh_wed_morning_to, '-1')
      - column: nullif_grh_wed_afternoon_from
        expression: nullif(grh_wed_afternoon_from, '-1')
      - column: nullif_grh_wed_afternoon_to
        expression: nullif(grh_wed_afternoon_to, '-1')
      - column: nullif_grh_thu_morning_from
        expression: nullif(grh_thu_morning_from, '-1')
      - column: nullif_grh_thu_morning_to
        expression: nullif(grh_thu_morning_to, '-1')
      - column: nullif_grh_thu_afternoon_from
        expression: nullif(grh_thu_afternoon_from, '-1')
      - column: nullif_grh_thu_afternoon_to
        expression: nullif(grh_thu_afternoon_to, '-1')
      - column: nullif_grh_fri_morning_from
        expression: nullif(grh_fri_morning_from, '-1')
      - column: nullif_grh_fri_morning_to
        expression: nullif(grh_fri_morning_to, '-1')
      - column: nullif_grh_fri_afternoon_from
        expression: nullif(grh_fri_afternoon_from, '-1')
      - column: nullif_grh_fri_afternoon_to
        expression: nullif(grh_fri_afternoon_to, '-1')
      - column: nullif_grh_sat_morning_from
        expression: nullif(grh_sat_morning_from, '-1')
      - column: nullif_grh_sat_morning_to
        expression: nullif(grh_sat_morning_to, '-1')
      - column: nullif_grh_sat_afternoon_from
        expression: nullif(grh_sat_afternoon_from, '-1')
      - column: nullif_grh_sat_afternoon_to
        expression: nullif(grh_sat_afternoon_to, '-1')
      - column: nullif_grh_sun_morning_from
        expression: nullif(grh_sun_morning_from, '-1')
      - column: nullif_grh_sun_morning_to
        expression: nullif(grh_sun_morning_to, '-1')
      - column: nullif_grh_sun_afternoon_from
        expression: nullif(grh_sun_afternoon_from, '-1')
      - column: nullif_grh_sun_afternoon_to
        expression: nullif(grh_sun_afternoon_to, '-1')

  - kind: select
    name: select_dm_customer_uploading_points
    context_name: add_dm_customer_uploading_points
    params:
      columns:
        customer_code: customer_code
        nullif_grh_mon_morning_from: nullif_grh_mon_morning_from
        nullif_grh_mon_morning_to: nullif_grh_mon_morning_to
        nullif_grh_mon_afternoon_from: nullif_grh_mon_afternoon_from
        nullif_grh_mon_afternoon_to: nullif_grh_mon_afternoon_to
        nullif_grh_tue_morning_from: nullif_grh_tue_morning_from
        nullif_grh_tue_morning_to: nullif_grh_tue_morning_to
        nullif_grh_tue_afternoon_from: nullif_grh_tue_afternoon_from
        nullif_grh_tue_afternoon_to: nullif_grh_tue_afternoon_to
        nullif_grh_wed_morning_from: nullif_grh_wed_morning_from
        nullif_grh_wed_morning_to: nullif_grh_wed_morning_to
        nullif_grh_wed_afternoon_from: nullif_grh_wed_afternoon_from
        nullif_grh_wed_afternoon_to: nullif_grh_wed_afternoon_to
        nullif_grh_thu_morning_from: nullif_grh_thu_morning_from
        nullif_grh_thu_morning_to: nullif_grh_thu_morning_to
        nullif_grh_thu_afternoon_from: nullif_grh_thu_afternoon_from
        nullif_grh_thu_afternoon_to: nullif_grh_thu_afternoon_to
        nullif_grh_fri_morning_from: nullif_grh_fri_morning_from
        nullif_grh_fri_morning_to: nullif_grh_fri_morning_to
        nullif_grh_fri_afternoon_from: nullif_grh_fri_afternoon_from
        nullif_grh_fri_afternoon_to: nullif_grh_fri_afternoon_to
        nullif_grh_sat_morning_from: nullif_grh_sat_morning_from
        nullif_grh_sat_morning_to: nullif_grh_sat_morning_to
        nullif_grh_sat_afternoon_from: nullif_grh_sat_afternoon_from
        nullif_grh_sat_afternoon_to: nullif_grh_sat_afternoon_to
        nullif_grh_sun_morning_from: nullif_grh_sun_morning_from
        nullif_grh_sun_morning_to: nullif_grh_sun_morning_to
        nullif_grh_sun_afternoon_from: nullif_grh_sun_afternoon_from
        nullif_grh_sun_afternoon_to: nullif_grh_sun_afternoon_to
        grh_mon_morning_from: grh_mon_morning_from
        grh_mon_morning_to: grh_mon_morning_to
        grh_mon_afternoon_from: grh_mon_afternoon_from
        grh_mon_afternoon_to: grh_mon_afternoon_to
        grh_tue_morning_from: grh_tue_morning_from
        grh_tue_morning_to: grh_tue_morning_to
        grh_tue_afternoon_from: grh_tue_afternoon_from
        grh_tue_afternoon_to: grh_tue_afternoon_to
        grh_wed_morning_from: grh_wed_morning_from
        grh_wed_morning_to: grh_wed_morning_to
        grh_wed_afternoon_from: grh_wed_afternoon_from
        grh_wed_afternoon_to: grh_wed_afternoon_to
        grh_thu_morning_from: grh_thu_morning_from
        grh_thu_morning_to: grh_thu_morning_to
        grh_thu_afternoon_from: grh_thu_afternoon_from
        grh_thu_afternoon_to: grh_thu_afternoon_to
        grh_fri_morning_from: grh_fri_morning_from
        grh_fri_morning_to: grh_fri_morning_to
        grh_fri_afternoon_from: grh_fri_afternoon_from
        grh_fri_afternoon_to: grh_fri_afternoon_to
        grh_sat_morning_from: grh_sat_morning_from
        grh_sat_morning_to: grh_sat_morning_to
        grh_sat_afternoon_from: grh_sat_afternoon_from
        grh_sat_afternoon_to: grh_sat_afternoon_to
        grh_sun_morning_from: grh_sun_morning_from
        grh_sun_morning_to: grh_sun_morning_to
        grh_sun_afternoon_from: grh_sun_afternoon_from
        grh_sun_afternoon_to: grh_sun_afternoon_to
        sap_cluster: sap_cluster
      distinct: true

  - kind: group
    name: group_dm_customer_uploading_points
    context_name: select_dm_customer_uploading_points
    params:
      - aggs:
          nullif_grh_mon_morning_from: max
          nullif_grh_mon_morning_to: max
          nullif_grh_mon_afternoon_from: max
          nullif_grh_mon_afternoon_to: max
          nullif_grh_tue_morning_from: max
          nullif_grh_tue_morning_to: max
          nullif_grh_tue_afternoon_from: max
          nullif_grh_tue_afternoon_to: max
          nullif_grh_wed_morning_from: max
          nullif_grh_wed_morning_to: max
          nullif_grh_wed_afternoon_from: max
          nullif_grh_wed_afternoon_to: max
          nullif_grh_thu_morning_from: max
          nullif_grh_thu_morning_to: max
          nullif_grh_thu_afternoon_from: max
          nullif_grh_thu_afternoon_to: max
          nullif_grh_fri_morning_from: max
          nullif_grh_fri_morning_to: max
          nullif_grh_fri_afternoon_from: max
          nullif_grh_fri_afternoon_to: max
          nullif_grh_sat_morning_from: max
          nullif_grh_sat_morning_to: max
          nullif_grh_sat_afternoon_from: max
          nullif_grh_sat_afternoon_to: max
          nullif_grh_sun_morning_from: max
          nullif_grh_sun_morning_to: max
          nullif_grh_sun_afternoon_from: max
          nullif_grh_sun_afternoon_to: max
        by:
        - customer_code
        - sap_cluster

  - kind: join
    name: join_data_marts_rcconf_72
    context_name: select_dm_customer_general
    params:
      - other:
          select_dm_customer_sales_organization
        how:
          left
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          group_dm_customer_uploading_points
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster
      - other:
          select_dm_customer_uploading_points
        how:
          inner
        columns:
          customer_code: customer_code
          sap_cluster: sap_cluster

  - kind: filter
    context_name: join_data_marts_rcconf_72
    name: filter_data_marts_rcconf_72
    params:
      - condition:
          distribution_channel_code = '01' and division_code = '01'

  - kind: add
    name: add_checks_rcconf_72
    context_name: filter_data_marts_rcconf_72
    params:
      - column: rule_code_72_1
        expression: "'RCCONF_72.1'"
      - column: rule_code_72_2
        expression: "'RCCONF_72.2'"
      - column: rule_code_72_3
        expression: "'RCCONF_72.3'"
      - column: rule_code_72_4
        expression: "'RCCONF_72.4'"
      - column: rule_code_72_5
        expression: "'RCCONF_72.5'"
      - column: rule_code_72_6
        expression: "'RCCONF_72.6'"
      - column: rule_code_72_7
        expression: "'RCCONF_72.7'"
      - column: rule_code_72_8
        expression: "'RCCONF_72.8'"
      - column: rcconf_72_1
        expression: if(account_group_code like '9%' and coalesce(max_nullif_grh_mon_morning_from, 
                    max_nullif_grh_mon_morning_to, 
                    max_nullif_grh_mon_afternoon_from, 
                    max_nullif_grh_mon_afternoon_to, 
                    max_nullif_grh_tue_morning_from, 
                    max_nullif_grh_tue_morning_to, 
                    max_nullif_grh_tue_afternoon_from, 
                    max_nullif_grh_tue_afternoon_to, 
                    max_nullif_grh_wed_morning_from, 
                    max_nullif_grh_wed_morning_to, 
                    max_nullif_grh_wed_afternoon_from, 
                    max_nullif_grh_wed_afternoon_to, 
                    max_nullif_grh_thu_morning_from, 
                    max_nullif_grh_thu_morning_to, 
                    max_nullif_grh_thu_afternoon_from, 
                    max_nullif_grh_thu_afternoon_to, 
                    max_nullif_grh_fri_morning_from, 
                    max_nullif_grh_fri_morning_to, 
                    max_nullif_grh_fri_afternoon_from, 
                    max_nullif_grh_fri_afternoon_to, 
                    max_nullif_grh_sat_morning_from, 
                    max_nullif_grh_sat_morning_to, 
                    max_nullif_grh_sat_afternoon_from, 
                    max_nullif_grh_sat_afternoon_to, 
                    max_nullif_grh_sun_morning_from, 
                    max_nullif_grh_sun_morning_to, 
                    max_nullif_grh_sun_afternoon_from, 
                    max_nullif_grh_sun_afternoon_to) is not null
                    and central_order_block_code not in('S1','E','SP','G'), 
                    if(coalesce(nullif(grh_mon_morning_from, '00:00'), 
                    nullif(grh_mon_morning_to, '00:00'), 
                    nullif(grh_mon_afternoon_from, '00:00'), 
                    nullif(grh_mon_afternoon_to, '00:00'), 
                    nullif(grh_tue_morning_from, '00:00'), 
                    nullif(grh_tue_morning_to, '00:00'), 
                    nullif(grh_tue_afternoon_from, '00:00'), 
                    nullif(grh_tue_afternoon_to, '00:00'), 
                    nullif(grh_wed_morning_from, '00:00'), 
                    nullif(grh_wed_morning_to, '00:00'), 
                    nullif(grh_wed_afternoon_from, '00:00'), 
                    nullif(grh_wed_afternoon_to, '00:00'), 
                    nullif(grh_thu_morning_from, '00:00'), 
                    nullif(grh_thu_morning_to, '00:00'), 
                    nullif(grh_thu_afternoon_from, '00:00'), 
                    nullif(grh_thu_afternoon_to, '00:00'), 
                    nullif(grh_fri_morning_from, '00:00'), 
                    nullif(grh_fri_morning_to, '00:00'), 
                    nullif(grh_fri_afternoon_from, '00:00'), 
                    nullif(grh_fri_afternoon_to, '00:00'), 
                    nullif(grh_sat_morning_from, '00:00'), 
                    nullif(grh_sat_morning_to, '00:00'), 
                    nullif(grh_sat_afternoon_from, '00:00'), 
                    nullif(grh_sat_afternoon_to, '00:00'), 
                    nullif(grh_sun_morning_from, '00:00'), 
                    nullif(grh_sun_morning_to, '00:00'), 
                    nullif(grh_sun_afternoon_from, '00:00'), 
                    nullif(grh_sun_afternoon_to, '00:00'), '00:00') > '00:00', '1', '0'),'')
      - column: rcconf_72_2
        expression: if(account_group_code like '9%' and coalesce(max_nullif_grh_mon_morning_from, 
                    max_nullif_grh_mon_morning_to, 
                    max_nullif_grh_mon_afternoon_from, 
                    max_nullif_grh_mon_afternoon_to, 
                    max_nullif_grh_tue_morning_from, 
                    max_nullif_grh_tue_morning_to, 
                    max_nullif_grh_tue_afternoon_from, 
