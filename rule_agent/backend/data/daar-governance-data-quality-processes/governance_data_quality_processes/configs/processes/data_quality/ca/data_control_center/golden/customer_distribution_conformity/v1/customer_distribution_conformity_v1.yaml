    name: add_rcconf_144_4
    context_name: select_rcconf_144
    params:
      - column: rule_code
        expression: "'RCCONF_144.4'"
      - column: check_status
        expression: "CASE WHEN ISNULL(terms_of_payment_code) OR terms_of_payment_code='' THEN '' WHEN (account_group_code LIKE '70%' OR  account_group_code LIKE '71%' OR  account_group_code LIKE  '72%' OR  account_group_code LIKE  '73%' OR  account_group_code LIKE '90%') AND ISNULL(terms_of_payment_name) THEN '0'  WHEN (account_group_code LIKE  '70%' OR  account_group_code LIKE  '71%' OR  account_group_code LIKE  '72%' OR  account_group_code LIKE  '73%' OR  account_group_code LIKE '90%') AND NOT ISNULL(terms_of_payment_name) THEN '1' ELSE '' END"
      - column: value_checked
        expression: "account_group_code"   

  - kind: select
